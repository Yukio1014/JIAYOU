<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4A90E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家有">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>家有</title>
<script src="supabase.js?v=2" defer></script>
<style>
/* ========== 设计系统 ========== */
:root {
  --bg: #F2F2F7;
  --card-bg: #FFFFFF;
  --text: #1C1C1E;
  --text-secondary: #8E8E93;
  --text-tertiary: #C7C7CC;
  --separator: #E5E5EA;
  --accent: #007AFF;
  --red: #FF3B30;
  --orange: #FF9500;
  --yellow: #FFCC00;
  --green: #34C759;
  --blue: #5AC8FA;
  --purple: #AF52DE;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ========== 导航栏 ========== */
.navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(242,242,247,0.85);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid var(--separator);
  padding: 12px 16px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.navbar h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.navbar .nav-actions { display: flex; gap: 8px; align-items: center; }
.cloud-status {
  font-size: 12px; font-weight: 600;
  padding: 5px 10px; border-radius: 12px;
  background: rgba(0,122,255,0.08); color: var(--accent);
  white-space: nowrap; cursor: pointer;
  transition: opacity 0.15s;
}
.cloud-status:active { opacity: 0.6; }
.cloud-status.synced { background: rgba(52,199,89,0.12); color: var(--green); }
.cloud-status.syncing { background: rgba(0,122,255,0.12); color: var(--accent); }
.cloud-status.pending { background: rgba(255,149,0,0.12); color: var(--orange); }
.cloud-status.offline { background: rgba(142,142,147,0.12); color: var(--text-secondary); }
.cloud-status.error { background: rgba(255,59,48,0.12); color: var(--red); }
.nav-btn {
  width: 32px; height: 32px;
  border-radius: 50%; border: none;
  background: rgba(0,122,255,0.1);
  color: var(--accent);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s;
}
.nav-btn:active { transform: scale(0.88); }

/* ========== 底部Tab栏 ========== */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--separator);
  display: flex; padding: 6px 0 20px;
  max-width: 600px; margin: 0 auto;
}
.tabbar-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 2px; cursor: pointer;
  transition: opacity 0.15s; -webkit-user-select: none; user-select: none;
}
.tabbar-item:active { opacity: 0.5; }
.tabbar-item .tab-icon { font-size: 24px; line-height: 1; }
.tabbar-item .tab-label { font-size: 10px; color: var(--text-secondary); font-weight: 500; }
.tabbar-item.active .tab-label { color: var(--accent); }
.tabbar-item.active .tab-icon { transform: scale(1.1); }

/* ========== 页面容器 ========== */
.page {
  max-width: 600px; margin: 0 auto;
  padding: 0 16px 100px;
  display: none;
}
.page.active { display: block; }

/* ========== 按钮系统 ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600; border: none;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  font-family: var(--font);
}
.btn:active { transform: scale(0.96); opacity: 0.7; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-success { background: var(--green); color: #fff; }
.btn-warn { background: var(--orange); color: #fff; }
.btn-ghost { background: transparent; color: var(--accent); }
.btn-full { width: 100%; padding: 14px; font-size: 16px; }
.btn-outline { background: transparent; border: 1.5px solid var(--separator); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 13px; }

/* ========== 卡片 ========== */
.card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

/* ========== 首页预警条 ========== */
.alert-strip {
  display: flex; gap: 8px; margin-bottom: 16px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 2px 0;
}
.alert-strip::-webkit-scrollbar { display: none; }
.alert-badge {
  flex-shrink: 0; padding: 10px 14px; border-radius: 12px;
  display: flex; flex-direction: column; gap: 2px;
  min-width: 100px; cursor: pointer;
  transition: transform 0.15s;
}
.alert-badge:active { transform: scale(0.95); }
.alert-badge .badge-num { font-size: 24px; font-weight: 800; line-height: 1.1; }
.alert-badge .badge-label { font-size: 11px; opacity: 0.9; font-weight: 500; }
.alert-red { background: linear-gradient(135deg, #FF3B30, #FF6B6B); color: #fff; }
.alert-yellow { background: linear-gradient(135deg, #FF9500, #FFB340); color: #fff; }
.alert-blue { background: linear-gradient(135deg, #5AC8FA, #7AD9FF); color: #fff; }
.alert-green { background: linear-gradient(135deg, #34C759, #5AD680); color: #fff; }
.alert-gray { background: linear-gradient(135deg, #8E8E93, #AEAEB2); color: #fff; }
.alert-purple { background: linear-gradient(135deg, #AF52DE, #C97AF0); color: #fff; }
@keyframes pulse-red {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(255,59,48,0); }
}
.alert-red.pulse { animation: pulse-red 2s infinite; }

/* ========== 区块标题 ========== */
.section-title {
  font-size: 20px; font-weight: 700;
  margin: 20px 0 12px; letter-spacing: -0.3px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title .section-action {
  font-size: 14px; font-weight: 500; color: var(--accent); cursor: pointer;
}

/* ========== 拥有量卡 ========== */
.own-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.own-card {
  background: var(--card-bg); border-radius: var(--radius); padding: 14px;
  box-shadow: var(--shadow); cursor: pointer; transition: transform 0.15s;
}
.own-card:active { transform: scale(0.97); }
.own-card .own-icon { font-size: 28px; }
.own-card .own-name { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.own-card .own-num { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
.own-card .own-unit { font-size: 13px; color: var(--text-secondary); }
.own-card .own-idle { font-size: 11px; color: var(--orange); margin-top: 2px; font-weight: 600; }

/* ========== AI分析卡 ========== */
.ai-card {
  background: linear-gradient(135deg, #E0F7FA, #B2DFDB, #E1BEE7);
  color: #1C1C1E; border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-lg);
  border: 1px solid rgba(178,223,219,0.4);
}
.ai-card .ai-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.ai-card .ai-title { font-size: 16px; font-weight: 700; color: #00695C; }
.ai-card .ai-badge {
  font-size: 10px; background: rgba(0,105,92,0.12);
  padding: 2px 8px; border-radius: 6px; font-weight: 600; color: #00695C;
}
.ai-card .ai-section { margin-bottom: 14px; }
.ai-card .ai-section:last-child { margin-bottom: 0; }
.ai-card .ai-section-title {
  font-size: 12px; color: #00897B;
  margin-bottom: 6px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.ai-card .ai-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 0.5px solid rgba(0,105,92,0.12);
  font-size: 14px;
}
.ai-card .ai-item:last-child { border-bottom: none; }
.ai-card .ai-item .ai-val { font-weight: 700; color: #00695C; }
.ai-card .ai-suggest {
  background: rgba(255,255,255,0.5); border-radius: 8px;
  padding: 10px 12px; font-size: 13px; line-height: 1.6; color: #1C1C1E;
}
.ai-card .ai-suggest strong { color: #00897B; }
.ai-card .ai-suggest .donate-buy { color: #007AFF; font-weight: 700; }
.ai-card .ai-suggest .stop-buy { color: var(--red); font-weight: 700; }

/* ========== 进度条 ========== */
.bar-wrap { width: 100%; height: 8px; background: var(--separator); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.bar-green { background: var(--green); }
.bar-yellow { background: var(--yellow); }
.bar-orange { background: var(--orange); }
.bar-red { background: var(--red); }
.bar-blue { background: var(--blue); }
.bar-purple { background: var(--purple); }

/* 大进度条（库存可视化） */
.stock-bar {
  width: 100%; height: 12px; border-radius: 6px;
  overflow: hidden; background: var(--separator); position: relative;
}
.stock-bar .stock-fill {
  height: 100%; border-radius: 6px; transition: width 0.5s ease;
}
.stock-bar.low .stock-fill { background: linear-gradient(90deg, #FF3B30, #FF6B6B); }
.stock-bar.mid .stock-fill { background: linear-gradient(90deg, #FF9500, #FFB340); }
.stock-bar.high .stock-fill { background: linear-gradient(90deg, #34C759, #5AD680); }
.stock-bar.over .stock-fill { background: linear-gradient(90deg, #5AC8FA, #7AD9FF); }

/* 保质期进度条 */
.shelf-bar {
  width: 100%; height: 6px; border-radius: 3px;
  overflow: hidden; background: var(--separator);
}
.shelf-bar .shelf-fill { height: 100%; transition: width 0.5s ease; }

/* ========== 物品卡片网格 ========== */
.item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.item-card {
  background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
  cursor: pointer; transition: transform 0.15s;
  position: relative;
}
.item-card:active { transform: scale(0.97); }
.item-card .card-photo {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-size: 40px; color: var(--text-tertiary);
}
.item-card .card-photo img { width: 100%; height: 100%; object-fit: cover; }
.item-card .card-body { padding: 10px 12px; }
.item-card .card-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-card .card-info { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.item-card .card-mini-bar { margin-top: 6px; }

/* 耐用品紧凑卡片（无大照片区，隐私模式） */
.item-card-compact {
  min-height: 80px;
  display: flex; flex-direction: column; justify-content: center;
}
.item-card-compact .card-body { padding: 16px 14px; }
.item-card-compact .card-name { font-size: 16px; }

/* 变体缩略图网格（卡片背面） */
.variant-thumb-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
.variant-thumb { position:relative; border-radius:10px; overflow:hidden; background:var(--bg); }
.variant-thumb img { width:100%; aspect-ratio:1; object-fit:cover; display:block; cursor:pointer; }
.variant-thumb-no-photo { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--text-tertiary); background:var(--bg); }
.variant-thumb .variant-label { padding:6px 8px; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.variant-thumb .variant-sub { padding:0 8px 8px; font-size:11px; color:var(--text-secondary); }
.variant-thumb .variant-del {
  position:absolute; top:6px; right:6px;
  width:24px; height:24px; border-radius:50%;
  background:rgba(0,0,0,0.5); color:#fff;
  border:none; font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  z-index:2;
}

/* 全屏照片查看器 */
.photo-viewer {
  position:fixed; inset:0; z-index:500; background:#000;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.photo-viewer img {
  max-width:100%; max-height:100%; object-fit:contain;
  touch-action:none; will-change:transform;
}
.photo-viewer-close {
  position:absolute; top:16px; right:16px; z-index:501;
  width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,0.2); color:#fff;
  border:none; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.photo-viewer-counter {
  position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
  color:#fff; font-size:14px; font-weight:600; z-index:501;
  background:rgba(0,0,0,0.4); padding:6px 16px; border-radius:20px;
}

/* 卡片角标 */
.card-badge {
  position: absolute; top: 8px; right: 8px;
  padding: 3px 8px; border-radius: 8px;
  font-size: 10px; font-weight: 700; color: #fff;
  backdrop-filter: blur(4px);
}
.badge-expire { background: rgba(255,59,48,0.9); }
.badge-warn { background: rgba(255,149,0,0.9); }
.badge-low { background: rgba(255,149,0,0.9); }
.badge-restock { background: rgba(175,82,222,0.9); }
.badge-good { background: rgba(52,199,89,0.85); }
.badge-bad { background: rgba(255,59,48,0.85); }
.badge-oneshot { background: rgba(255,149,0,0.92); }
.badge-archived { background: rgba(142,142,147,0.92); }

/* 卡片3D翻面 */
.card-detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 16px;
}
.card-detail-overlay.show { display: flex; }
.flip-card {
  width: 100%; max-width: 360px; max-height: 85vh;
  perspective: 1200px; position: relative;
}
.flip-inner {
  width: 100%; position: relative;
  transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
  transform-style: preserve-3d;
}
.flip-inner.flipped { transform: rotateY(180deg); }
.flip-face {
  width: 100%; backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 20px; overflow: hidden;
  box-shadow: var(--shadow-lg);
  transition: visibility 0s 0.3s;
}
.flip-front { background: var(--card-bg); }
.flip-back {
  position: absolute; top: 0; left: 0; min-height: 100%;
  transform: rotateY(180deg); background: var(--card-bg);
  max-height: 85vh; overflow-y: auto;
}
/* iOS Safari backface 失效兜底：翻到背面彻底隐藏正面，翻回时隐藏背面（0.3s 后切换=翻转过半时） */
.flip-inner.flipped .flip-front { visibility: hidden; }
.flip-inner:not(.flipped) .flip-back { visibility: hidden; }

/* 卡片正面（弹窗版） */
.detail-front { padding: 0; }
.detail-front .detail-photo {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-size: 60px; color: var(--text-tertiary); position: relative;
}
.detail-front .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
.detail-front .detail-body { padding: 16px; }
.detail-front .detail-name { font-size: 22px; font-weight: 700; }
.detail-front .detail-cat { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.detail-front .detail-tap-hint {
  text-align: center; font-size: 12px; color: var(--text-tertiary);
  margin-top: 12px; padding: 8px;
  border: 1px dashed var(--separator); border-radius: 8px;
}

/* 卡片背面 */
.detail-back { padding: 16px; }
.sticky-actions {
  position: sticky; top: 0; z-index: 20;
  display: flex; gap: 8px; margin: -2px -16px 14px; padding: 8px 16px;
  background: var(--card-bg, #fff); border-bottom: 1px solid var(--border, #eee);
}
.detail-back .back-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.detail-back .back-title { font-size: 18px; font-weight: 700; }
.detail-back .back-close {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg); border: none; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.back-section { margin-bottom: 16px; }
.back-section-title {
  font-size: 12px; color: var(--text-secondary);
  font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 8px;
}
.back-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 0.5px solid var(--separator); font-size: 14px;
}
.back-row:last-child { border-bottom: none; }
.back-row .back-label { color: var(--text-secondary); }
.back-row .back-value { font-weight: 600; }

/* ========== 品牌变体卡片（统一规格）========== */
.variant-card {
  background: var(--card-bg);
  border: 0.5px solid var(--separator);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 12px;
}
.variant-card:last-child { margin-bottom: 0; }
.variant-card.vc-using { border-color: var(--orange); box-shadow: inset 3px 0 0 var(--orange); }
.variant-card.vc-done { opacity: 0.72; }
.vc-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.vc-brand { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.3; }
.vc-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; }
.vc-badge.using { background: rgba(255,149,0,0.14); color: var(--orange); }
.vc-badge.done { background: rgba(52,199,89,0.14); color: var(--green); }
.vc-badge.norestock { background: rgba(142,142,147,0.16); color: var(--text-secondary); }
.variant-card.vc-norestock { opacity: 0.66; border-style: dashed; }
.vc-price-line { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.vc-price { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.vc-price-note { font-size: 12px; color: var(--text-secondary); }
.vc-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; padding-top: 12px; border-top: 0.5px dashed var(--separator); }
.vc-meta-item { min-width: 0; }
.vc-meta-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
.vc-meta-value { font-size: 13px; font-weight: 600; line-height: 1.4; word-break: break-all; }
.vc-meta-item.wide { grid-column: 1 / -1; }
.vc-meta-item.wide .vc-meta-value { color: var(--text-secondary); font-weight: 500; font-size: 12px; }
.vc-feel { margin-top: 12px; padding-top: 12px; border-top: 0.5px dashed var(--separator); }
.vc-stars { font-size: 14px; line-height: 1.2; }
.vc-tags { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.vc-note { font-size: 12px; color: var(--text-secondary); margin-top: 4px; font-style: italic; line-height: 1.5; }
.vc-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

@media (prefers-color-scheme: dark) {
  .variant-card.vc-using { border-color: var(--orange); }
}

/* ========== 表单 ========== */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 13px; color: var(--text-secondary); font-weight: 600; margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--separator); background: var(--card-bg);
  font-size: 15px; font-family: var(--font); color: var(--text);
  outline: none; transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: none; min-height: 60px; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

/* 开关（开袋即使用） */

<script>

// ========== Supabase 云同步配置 ==========
const SUPABASE_URL = 'https://pnahlubyqqzcjrzhnzfa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UpBLW71YgaQCcm6YGCrGsw_urK1cVTd';
const BUCKET_NAME = 'jiayou-photos';
const CLOUD_SYNC_DEBOUNCE_MS = 2500;

var supabaseClient = null;
var currentUser = null;
var cloudSyncState = { status: 'idle', message: '', lastSyncAt: null, pending: false };
var cloudSyncTimer = null;
var cloudSyncInProgress = false;

// 懒初始化 Supabase 客户端：
// supabase.js 是 defer 加载（HTML 解析完才执行），而内联主脚本先执行，
// 因此不能在顶层直接读 window.supabase —— 必须等真正用到时再创建。
function ensureSupabaseClient() {
  if (supabaseClient) return true;
  if (!window.supabase || !window.supabase.createClient) {
    cloudSyncState.message = 'Supabase 库未加载（检查 supabase.js 是否存在）';
    return false;
  }
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
    return true;
  } catch(e) {
    console.error('Supabase初始化失败', e);
    cloudSyncState.message = 'Supabase初始化失败: ' + (e.message || e);
    return false;
  }
}

// 生成稳定设备ID（用于匿名用户识别）
function getDeviceId() {
  var id = localStorage.getItem('jiayou_device_id');
  if (!id) {
    id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('jiayou_device_id', id);
  }
  return id;
}

// 尝试匿名登录；失败则使用设备本地模式（仍可用，只是不同步）
async function initAuth() {
  if (!ensureSupabaseClient()) {
    updateCloudUI();
    return;
  }
  try {
    var { data: { session }, error } = await supabaseClient.auth.getSession();
    if (error) throw error;
    if (session && session.user) {
      currentUser = session.user;
      cloudSyncState.message = '';
      updateCloudUI();
      return;
    }
    // 尝试匿名登录
    var { data, error: signErr } = await supabaseClient.auth.signInAnonymously();
    if (signErr) {
      console.log('匿名登录失败，尝试邮箱降级:', signErr.message);
      await fallbackAnonymousLogin();
      return;
    }
    currentUser = data.user;
    localStorage.setItem('jiayou_anon_email', data.user.email || '');
    cloudSyncState.message = '';
    updateCloudUI();
  } catch(e) {
    console.error('认证初始化失败', e);
    cloudSyncState.message = '认证失败: ' + (e.message || e);
    updateCloudUI();
    await fallbackAnonymousLogin();
  }
}

async function fallbackAnonymousLogin() {
  if (!ensureSupabaseClient()) return;
  var deviceId = getDeviceId();
  var email = localStorage.getItem('jiayou_anon_email');
  var password = localStorage.getItem('jiayou_anon_password');
  var isNew = false;
  if (!email) {
    email = deviceId + '@jiayou.app';
    password = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    isNew = true;
  }
  try {
    if (isNew) {
      // 新设备：直接注册
      var { data: signUpData, error: signUpErr } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: { data: { source: 'jiayou_app' } }
      });
      if (signUpErr) throw signUpErr;
      if (!signUpData.user) throw new Error('注册后未返回用户');
      currentUser = signUpData.user;
      localStorage.setItem('jiayou_anon_email', email);
      localStorage.setItem('jiayou_anon_password', password);
      cloudSyncState.message = '';
      updateCloudUI();
      toast('已创建云端账号');
      return;
    }
    // 已有账号：尝试登录
    var { data: signInData, error: signInErr } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });
    if (!signInErr && signInData.user) {
      currentUser = signInData.user;
      cloudSyncState.message = '';
      updateCloudUI();
      return;
    }
    // 登录失败：可能账号被删或密码错，重新注册
    var { data: signUpData2, error: signUpErr2 } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: { data: { source: 'jiayou_app' } }
    });
    if (signUpErr2) throw signUpErr2;
    if (!signUpData2.user) throw new Error('重新注册后未返回用户');
    currentUser = signUpData2.user;
    cloudSyncState.message = '';
    updateCloudUI();
    toast('已创建云端账号');
  } catch(e) {
    console.error('降级认证失败', e);
    cloudSyncState.message = '云端登录失败: ' + (e.message || e);
    updateCloudUI();
  }
}

// 重试登录（清除旧凭据后重新走一遍）
async function retryCloudLogin() {
  toast('正在重试登录...');
  cloudSyncState.message = '正在重试...';
  updateCloudUI();
  if (!ensureSupabaseClient()) { toast('Supabase 库未加载'); return; }
  // 清除旧凭据，强制重新注册
  localStorage.removeItem('jiayou_anon_email');
  localStorage.removeItem('jiayou_anon_password');
  // 清除 supabase 本地 session
  try { await supabaseClient.auth.signOut(); } catch(e) {}
  currentUser = null;
  await initAuth();
  if (currentUser) {
    var changed = await syncFromCloud();
    if (changed) renderAll();
    toast('登录成功');
  } else {
    toast('登录仍失败，请检查网络或稍后再试');
  }
}

function updateCloudUI() {
  var el = document.getElementById('cloud-status');
  var settingsEl = document.getElementById('settings-cloud-status');
  var text = '☁️ 未登录', cls = 'cloud-status offline';
  if (!currentUser) {
    text = '☁️ 未登录'; cls = 'cloud-status offline';
  } else if (cloudSyncInProgress) {
    text = '🔄 同步中...'; cls = 'cloud-status syncing';
  } else if (cloudSyncState.pending) {
    text = '⏳ 待同步'; cls = 'cloud-status pending';
  } else if (cloudSyncState.lastSyncAt) {
    var t = new Date(cloudSyncState.lastSyncAt);
    text = '✓ 已同步 ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
    cls = 'cloud-status synced';
  } else {
    text = '☁️ 已登录'; cls = 'cloud-status online';
  }
  if (el) { el.textContent = text; el.className = cls; }
  if (settingsEl) { settingsEl.textContent = text.replace(/^[^\s]+\s/, ''); }
}

function setCloudStatus(status, message) {
  cloudSyncState.status = status;
  if (message) cloudSyncState.message = message;
  updateCloudUI();
}

// 从本地数据中提取所有照片（base64），上传到 Storage，替换为 URL
async function uploadAllLocalPhotos() {
  if (!currentUser) return;
  if (!ensureSupabaseClient()) return;
  var uploads = [];
  DB.zones.forEach(function(zone) {
    zone.items.forEach(function(item) {
      (item.photos || []).forEach(function(photo, idx) {
        if (photo && photo.startsWith && photo.startsWith('data:')) {
          uploads.push({ zoneId: zone.id, itemId: item.id, field: 'photos', idx: idx, data: photo });
        }
      });
      (item.variants || []).forEach(function(v, vidx) {
        (v.photos || []).forEach(function(photo, pidx) {
          if (photo && photo.startsWith && photo.startsWith('data:')) {
            uploads.push({ zoneId: zone.id, itemId: item.id, field: 'variant_photos', vidx: vidx, pidx: pidx, data: photo });
          }
        });
      });
    });
  });
  if (uploads.length === 0) return;
  setCloudStatus('syncing', '上传照片中...');
  for (var i = 0; i < uploads.length; i++) {
    var u = uploads[i];
    try {
      var url = await uploadPhotoToStorage(u.data, u.zoneId, u.itemId);
      if (url) {
        if (u.field === 'photos') {
          var item = findItemByIds(u.zoneId, u.itemId);
          if (item && item.photos && item.photos[u.idx]) item.photos[u.idx] = url;
        } else {
          var item = findItemByIds(u.zoneId, u.itemId);
          if (item && item.variants && item.variants[u.vidx] && item.variants[u.vidx].photos) {
            item.variants[u.vidx].photos[u.pidx] = url;
          }
        }
      }
    } catch(e) { console.error('照片上传失败', e); }
  }
}

function findItemByIds(zoneId, itemId) {
  var zone = DB.zones.find(function(z) { return z.id === zoneId; });
  if (!zone) return null;
  return zone.items.find(function(it) { return it.id === itemId; }) || null;
}

async function uploadPhotoToStorage(base64Data, zoneId, itemId) {
  if (!currentUser) return null;
  if (!ensureSupabaseClient()) return null;
  try {
    var arr = base64Data.split(',');
    var mime = arr[0].match(/:(.*?);/)[1];
    var bstr = atob(arr[1]);
    var n = bstr.length;
    var u8arr = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
    var ext = mime.split('/')[1] || 'jpg';
    var fileName = currentUser.id + '/' + zoneId + '/' + itemId + '/' + Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
    var file = new File([u8arr], fileName.split('/').pop(), { type: mime });
    var { data, error } = await supabaseClient.storage.from(BUCKET_NAME).upload(fileName, file, { upsert: true });
    if (error) throw error;
    var { data: urlData } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(fileName);
    return urlData.publicUrl;
  } catch(e) {
    console.error('上传照片到Storage失败', e);
    return null;
  }
}

// 保存数据到云端
async function syncToCloud(force) {
  if (!currentUser) return;
  if (!ensureSupabaseClient()) return;
  if (cloudSyncInProgress) {
    cloudSyncState.pending = true;
    updateCloudUI();
    return;
  }
  cloudSyncInProgress = true;
  cloudSyncState.pending = false;
  setCloudStatus('syncing', '正在同步...');
  try {
    // 先上传本地 base64 照片
    await uploadAllLocalPhotos();
    // 保存元数据
    var payload = {
      user_id: currentUser.id,
      data: DB,
      updated_at: new Date().toISOString(),
      version: (DB.version || 1)
    };
    var { error } = await supabaseClient
      .from('app_data')
      .upsert(payload, { onConflict: 'user_id' });
    if (error) throw error;
    cloudSyncState.lastSyncAt = Date.now();
    setCloudStatus('synced', '同步完成');
  } catch(e) {
    console.error('同步到云端失败', e);
    cloudSyncState.pending = true;
    setCloudStatus('error', '同步失败');
  } finally {
    cloudSyncInProgress = false;
    updateCloudUI();
    // 如果有排队中的同步，debounce 后重试
    if (cloudSyncState.pending) {
      clearTimeout(cloudSyncTimer);
      cloudSyncTimer = setTimeout(function() { syncToCloud(true); }, CLOUD_SYNC_DEBOUNCE_MS);
    }
  }
}

function queueCloudSync() {
  if (!currentUser) return;
  if (!ensureSupabaseClient()) return;
  cloudSyncState.pending = true;
  updateCloudUI();
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(function() { syncToCloud(true); }, CLOUD_SYNC_DEBOUNCE_MS);
}

// 从云端拉取数据
async function syncFromCloud() {
  if (!currentUser) return false;
  if (!ensureSupabaseClient()) return false;
  setCloudStatus('syncing', '从云端恢复...');
  try {
    var { data, error } = await supabaseClient
      .from('app_data')
      .select('data, updated_at')
      .eq('user_id', currentUser.id)
      .single();
    if (error) {
      if (error.code === 'PGRST116') {
        // 云端没有数据，把本地数据推上去
        await syncToCloud(true);
        return true;
      }
      throw error;
    }
    if (!data || !data.data) return false;
    // 合并云端数据到本地
    var cloudData = data.data;
    var localZones = (DB.zones || []);
    var cloudZones = (cloudData.zones || []);
    var localItemsCount = localZones.reduce(function(s, z) { return s + (z.items ? z.items.length : 0); }, 0);
    var cloudItemsCount = cloudZones.reduce(function(s, z) { return s + (z.items ? z.items.length : 0); }, 0);
    if (cloudItemsCount > 0) {
      // 云端有真实数据，用云端覆盖
      DB = mergeDB(DB, cloudData);
      // 立即同步到本地存储
      try { localStorage.setItem('jiayou_db', JSON.stringify(DB)); } catch(e) {}
      saveDBIndexed().catch(function(){});
    } else if (localItemsCount > 0) {
      // 本地有数据但云端没有，推送到云端
      await syncToCloud(true);
      return true;
    } else {
      // 双方都空，用云端（默认空）
      DB = mergeDB(DB, cloudData);
    }
    cloudSyncState.lastSyncAt = Date.now();
    setCloudStatus('synced', '恢复完成');
    return true;
  } catch(e) {
    console.error('从云端恢复失败', e);
    setCloudStatus('error', '恢复失败');
    return false;
  }
}

// 手动触发同步按钮
function manualSync() {
  if (!navigator.onLine) { toast('当前离线，恢复网络后自动同步'); return; }
  if (!ensureSupabaseClient()) { toast('Supabase 库未加载，无法同步'); return; }
  if (!currentUser) { toast('未登录，无法同步'); return; }
  toast('开始同步...');
  syncToCloud(true).then(function() {
    renderAll();
    toast('同步完成');
  });
}

// ========== 数据层 ==========
var DB = {
  zones: [],
  tasks: [],
  yearStats: {},
  settings: {},
  version: 1
};

// 板块类型: consumable(补给品) / durable(耐用品)
var ZONE_TYPES = {
  consumable: { name: '补给品', icon: '🦦', desc: '会用完、会过期、需要补货' },
  durable: { name: '耐用品', icon: '🐨', desc: '外观库、配件等耐用品' }
};

// ========== IndexedDB 存储（iOS PWA 更可靠） ==========
var DB_NAME = 'jiayou_app_db';
var STORE_NAME = 'data';
var dbPromise = null;

function initIndexedDB() {
  return new Promise(function(resolve) {
    if (dbPromise) { resolve(dbPromise); return; }
    if (!window.indexedDB) { resolve(null); return; }
    var req = indexedDB.open(DB_NAME, 1);
    req.onerror = function() { console.error('IndexedDB打开失败'); resolve(null); };
    req.onsuccess = function(e) { dbPromise = e.target.result; resolve(dbPromise); };
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
  });
}

function saveDBIndexed() {
  return initIndexedDB().then(function(db) {
    if (!db) return Promise.reject('no db');
    return new Promise(function(resolve, reject) {
      try {
        var tx = db.transaction(STORE_NAME, 'readwrite');
        var store = tx.objectStore(STORE_NAME);
        var req = store.put(DB, 'jiayou_db');
        req.onsuccess = function() { resolve(); };
        req.onerror = function(e) { reject(e); };
      } catch(e) { reject(e); }
    });
  });
}

function loadDBIndexed() {
  return initIndexedDB().then(function(db) {
    if (!db) return Promise.resolve(null);
    return new Promise(function(resolve) {
      try {
        var tx = db.transaction(STORE_NAME, 'readonly');
        var store = tx.objectStore(STORE_NAME);
        var req = store.get('jiayou_db');
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function() { resolve(null); };
      } catch(e) { resolve(null); }
    });
  });
}

// ========== 存储管理 ==========
function saveDB() {
  try {
    var json = JSON.stringify(DB);
    // 主存：IndexedDB（容量大，可存数十MB）
    saveDBIndexed().catch(function(e) { console.error('IndexedDB保存失败', e); });
    // 次存：localStorage（5-10MB限制，存不下会失败但不阻塞）
    try { localStorage.setItem('jiayou_db', json); } catch(lsErr) { console.warn('localStorage保存失败', lsErr); }
    // 排队同步到 Supabase 云端（最可靠）
    queueCloudSync();
  } catch(e) {
    console.error('saveDB错误:', e);
    if (e.name === 'QuotaExceededError') {
      toast('本地存储空间不足（云端已存）');
    } else {
      toast('存储失败: ' + e.message);
    }
  }
}

async function loadDB() {
  var loaded = false;
  var localRaw = null, idbData = null;
  // 先读 localStorage（5MB 限制可能失败）
  try {
    localRaw = localStorage.getItem('jiayou_db');
  } catch(e) { console.warn('读 localStorage 失败', e); }
  if (localRaw) {
    try {
      var parsed = JSON.parse(localRaw);
      if (parsed && parsed.zones && parsed.zones.length > 0) {
        DB = mergeDB(DB, parsed);
        loaded = true;
      }
    } catch(e) {
      console.warn('localStorage数据加载失败', e);
    }
  }
  // 再读 IndexedDB（容量大）
  try {
    idbData = await loadDBIndexed();
    if (idbData && idbData.zones && idbData.zones.length > 0) {
      var idbItemCount = idbData.zones.reduce(function(s,z){return s+(z.items?z.items.length:0);}, 0);
      var localItemCount = (DB.zones||[]).reduce(function(s,z){return s+(z.items?z.items.length:0);}, 0);
      if (idbItemCount > localItemCount) {
        DB = mergeDB(DB, idbData);
        loaded = true;
      } else if (!loaded) {
        DB = mergeDB(DB, idbData);
        loaded = true;
      }
    }
  } catch(e) { console.error('IndexedDB加载失败', e); }

  // 首次使用：创建默认板块
  if (!DB.zones || DB.zones.length === 0) {
    DB.zones = [
      {
        id: genId(), name: '补给品', type: 'consumable', icon: '🦦', theme: 'consumable',
        categories: [
          { id: genId(), name: '个护' },
          { id: genId(), name: '清洁' },
          { id: genId(), name: '食品' },
          { id: genId(), name: '药品' }
        ],
        items: []
      },
      {
        id: genId(), name: '角色外观库', type: 'durable', icon: '🐨', theme: 'durable',
        categories: [
          { id: genId(), name: '上衣' },
          { id: genId(), name: '裤子' },
          { id: genId(), name: '鞋' },
          { id: genId(), name: '包' }
        ],
        items: []
      },
      {
        id: genId(), name: '角色配件', type: 'durable', icon: '🦝', theme: 'durable2',
        categories: [
          { id: genId(), name: '戒指' },
          { id: genId(), name: '项链' },
          { id: genId(), name: '耳环' },
          { id: genId(), name: '手链' }
        ],
        items: []
      }
    ];
    // 注意：首次创建默认板块时不立即 saveDB，避免空默认数据覆盖云端真实数据
    // 等 syncFromCloud 拉取后会被云端数据覆盖
  }
}

function mergeDB(defaults, loaded) {
  var result = Object.assign({}, defaults, loaded);
  if (!result.settings) result.settings = defaults.settings;
  if (!result.zones) result.zones = [];
  if (!result.tasks) result.tasks = [];
  if (!result.yearStats) result.yearStats = {};
  // 旧版「目标锁定」数据迁移为「任务委托」
  if (result.pool && !result.tasks.length) {
    migratePoolToTasks(result);
  }
  // 补给品套餐模型迁移（只增字段，零破坏：stock/totalPrice/price 原值不动）
  migrateConsumablePackages(result);
  // 历史脏数据：表单内连续添加方案曾共用同一个 id，导致点任一方案只切换第一个 → 全局去重
  migrateTaskPlanIds(result);
  return result;
}

// 方案 id 全局去重：任务内重复或缺失的 id 分配新 id（从全局最大 +1 递增），其余字段一律不动
function migrateTaskPlanIds(db) {
  var max = 0;
  (db.tasks || []).forEach(function (t) { (t.plans || []).forEach(function (p) { if (p.id > max) max = p.id; }); });
  (db.tasks || []).forEach(function (t) {
    var seen = {};
    (t.plans || []).forEach(function (p) {
      if (p.id == null || seen[p.id]) { p.id = ++max; }
      seen[p.id] = true;
    });
  });
}

// 旧 pool/poolHistory → 新 tasks（四态：待接/进行中/凯旋/搁置）
function migratePoolToTasks(db) {
  if (!db.pool) return;
  var used = {};
  (db.tasks || []).forEach(function (t) { used[t.id] = true; });
  function nid() { var x = 1; while (used[x]) x++; used[x] = true; return x; }
  function npid() { var x = 1; while (used['p' + x]) x++; used['p' + x] = true; return x; }
  var arr = [];
  (db.pool || []).forEach(function (p) { arr.push(legacyPoolToTask(p, false, nid, npid)); });
  (db.poolHistory || []).forEach(function (p) { arr.push(legacyPoolToTask(p, true, nid, npid)); });
  db.tasks = arr;
  delete db.pool;
  delete db.poolHistory;
}

function legacyPoolToTask(p, isHistory, nid, npid) {
  var status = isHistory ? '搁置' : (p.status === 'pending' ? '待接' : (p.status === 'decided' ? '进行中' : '搁置'));
  var plans = (p.variants || []).map(function (v) {
    var price = Math.round((+v.price || 0) * 100) / 100;
    return {
      id: npid(),
      name: v.brand || '未命名',
      amount: price,
      note: (v.reason || '') + '',
      status: 'open',
      pinned: false,
      comboPrice: price,
      qty: 1,
      spec: Math.round((+v.specQty || 0) * 100) / 100,
      unit: (v.specUnit || '') + '',
      photos: (v.photos || []).slice()
    };
  });
  var lockedPlanId = (status === '进行中' && plans.length) ? plans[0].id : null;
  if (status === '进行中' && plans[0]) plans[0].status = 'done';
  var createdAt = p.date ? String(p.date).slice(0, 10) : new Date().toISOString().slice(0, 10);
  return {
    id: nid(),
    name: p.name || '未命名',
    status: status,
    createdAt: createdAt,
    note: (p.notes || '') + '',
    lockedPlanId: lockedPlanId,
    plans: plans,
    zoneId: p.zoneId || null,
    categoryId: p.categoryId || null,
    photos: (p.photos || []).slice(),
    date: p.date || new Date().toISOString()
  };
}

// 补给品套餐模型迁移：只增字段，零破坏旧数据
// 字段约定：stock = 小单位总数（不变）；packQty=每套餐内含小单位数(默认1)；
// packCount=套餐数(默认=stock，packQty=1时等价)；packPrice=每套餐价(默认=totalPrice)；
// packUnit=小单位名；packWeight=每个小单位的含量(默认0)；packWeightUnit=含量单位(kg/g/ml/L，默认kg)；consumeMode=物品级消耗模式
function migrateConsumablePackages(db) {
  if (!db.zones) return;
  db.zones.forEach(function(zone) {
    if (zone.type !== 'consumable') return; // 仅补给品
    (zone.items || []).forEach(function(item) {
      // 物品级消耗模式：oneShot→unit（开袋即用完/小单位），其余→pack（套餐消耗）
      if (item.consumeMode !== 'pack' && item.consumeMode !== 'unit') {
        item.consumeMode = (item.oneShot === true) ? 'unit' : 'pack';
      }
      (item.variants || []).forEach(function(v) {
        if (typeof v.packQty === 'undefined') v.packQty = 1;
        if (typeof v.packCount === 'undefined') v.packCount = (v.stock || 0); // packQty=1时等价
        if (typeof v.packPrice === 'undefined') v.packPrice = v.totalPrice || 0;
        if (typeof v.packUnit === 'undefined') v.packUnit = item.unit || '个';
        if (typeof v.packWeight === 'undefined') v.packWeight = 0;
        if (typeof v.packWeightUnit === 'undefined') v.packWeightUnit = 'kg';
        // stock / price / totalPrice 原值一律不动
      });
    });
  });
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

// ========== 子物品（品牌变体）辅助 ==========
// 库存摘要（人话版）：套餐数 + 容量，如「4套 · ≈200ml」；没有套餐数据则退回「200ml」
// ---------- 变体级混合规格：每个品牌（变体）自己可选，互不干扰 ----------
// 例：品牌A面霜 = 正装 1瓶×50ml + 小样 3个×15ml = 95ml；单位自由：ml / kg / g / L / 粒 / 个 …
function variantSpecsOf(v) {
  return ((v && v.specs) || []).filter(function (s) { return (+s.qty > 0) && (+s.content > 0); });
}
function variantSpecContent(v) { // 总含量（库存口径）
  var ss = variantSpecsOf(v); if (!ss.length) return 0;
  var t = 0; ss.forEach(function (s) { t += (+s.qty || 0) * (+s.content || 0); });
  return Math.round(t * 100) / 100;
}
function variantSpecPieces(v) { // 总件数（参考）
  var ss = variantSpecsOf(v); if (!ss.length) return 0;
  var t = 0; ss.forEach(function (s) { t += (+s.qty || 0); });
  return Math.round(t * 100) / 100;
}
function variantSpecUnit(v) {
  var ss = variantSpecsOf(v);
  return ss.length ? (ss[0].unit || '') : '';
}
function variantSpecText(v) { // "正装 1×50ml + 小样 3×15ml = 95ml"
  var ss = variantSpecsOf(v); if (!ss.length) return '';
  var parts = ss.map(function (s) {
    var nm = String(s.name || '').trim();
    return (nm ? nm + ' ' : '') + trimNum(+s.qty) + '×' + trimNum(+s.content) + (s.unit || '');
  });
  return parts.join(' + ') + ' = ' + trimNum(variantSpecContent(v)) + (ss[0].unit || '');
}
function stockSummaryOf(item) {
  var vs = (item.variants && item.variants.length) ? item.variants : [];
  var packs = 0, hasPacks = false;
  var wTotals = {}, wOrder = [];
  vs.forEach(function(v) {
    if (variantSpecsOf(v).length) {
      // 多规格：packCount=件数，stock 本身就是含量口径
      if (v.packCount) { packs += v.packCount; hasPacks = true; }
      var cu = variantSpecUnit(v);
      if (cu) {
        if (!wTotals[cu]) { wTotals[cu] = 0; wOrder.push(cu); }
        wTotals[cu] += variantSpecContent(v);
      }
      return;
    }
    // 单规格：整套数按「剩余 ÷ 每套含」算（购买套数会随消耗失真），如 3支/10支每套 → 0 整套
    var pq = parseFloat(v.packQty) || 1;
    if (v.packCount && pq > 1) { packs += Math.max(0, Math.floor((v.stock || 0) / pq)); hasPacks = true; }
    // 含量 = 当前剩余（不是购买总量）
    var sc = variantStockContent(v);
    if (sc !== null && sc > 0) {
      var u = weightUnitOf(v);
      if (!wTotals[u]) { wTotals[u] = 0; wOrder.push(u); }
      wTotals[u] += sc;
    }
  });
  var st = getTotalStock(item) || 0;
  var unit = mainPackUnit(item);
  var capTxt = st > 0 ? (round1(st) + unit) : '';
  // 总含量按单位分组显示（如「≈600ml」；混合单位时「≈6kg · ≈600ml」）
  // 含量单位若与容量单位相同（混合规格下容量就是含量），不再重复显示
  var wTxt = '';
  var wParts = wOrder.filter(function(u) { return u !== unit; }).map(function(u) { return '≈' + round1(wTotals[u]) + u; });
  if (wParts.length) wTxt = ' · ' + wParts.join(' · ');
  if (hasPacks && packs > 0) {
    // 每套=1 时容量数和套数是同一个数，说了等于没说 → 只显示套数
    if (capTxt && Math.round(st) !== packs) return packs + '套 · ≈' + capTxt + wTxt;
    return packs + '套' + wTxt;
  }
  return round1(st) + unit + wTxt;
}

function getTotalStock(item) {
  if (item.variants && item.variants.length > 0) {
    return item.variants.reduce(function(s, v) { return s + (v.stock || 0); }, 0);
  }
  return item.stock || 0;
}
// 有效库存：排除标记了「不再买」的品牌（它们不算进补货提醒）
function getActiveStock(item) {
  if (item.variants && item.variants.length > 0) {
    return item.variants.filter(function(v) { return !v.noRestock; }).reduce(function(s, v) { return s + (v.stock || 0); }, 0);
  }
  return item.stock || 0;
}

// ===== 套餐模型展示辅助 =====
// 变体总含量：套数 × 每套含 × 每小单位含量（packWeight=每个小单位的含量，单位见 packWeightUnit）
function variantTotalWeight(v) {
  if (variantSpecsOf(v).length) return variantSpecContent(v); // 混合规格：直接用明细汇总的含量
  var w = parseFloat(v.packWeight) || 0;
  if (w <= 0) return 0;
  var pc = parseFloat(v.packCount) || 0;
  var pq = parseFloat(v.packQty) || 1;
  return pc * pq * w;
}
// 含量单位：默认 kg（兼容旧数据未存该字段的情况）
function weightUnitOf(v) { return v.packWeightUnit || 'kg'; }
// 变体当前剩余含量：混合规格走明细汇总；普通变体 = 剩余件数(stock) × 每小单位含量(packWeight)
// 注意区分 variantTotalWeight（购买总量，用于折算单价）；这里算的是「现在还剩多少」
// 没配含量（packWeight 缺失）→ null（无法折算）
function variantStockContent(v) {
  if (variantSpecsOf(v).length) return variantSpecContent(v);
  var w = parseFloat(v.packWeight) || 0;
  if (w <= 0) return null;
  return Math.round(((parseFloat(v.stock) || 0) * w) * 100) / 100;
}
// 物品当前总剩余含量：每个变体都能折算含量才返回总数；任一变体没配含量 → null
function itemStockContent(item, onlyVariants) {
  var vs = (onlyVariants && onlyVariants.length) ? onlyVariants : (item.variants || []);
  if (!vs.length) return null;
  var t = 0;
  for (var i = 0; i < vs.length; i++) {
    var c = variantStockContent(vs[i]);
    if (c === null) return null;
    t += c;
  }
  return Math.round(t * 100) / 100;
}
// 折算单价：有重量→每KG单价，否则→每小单位单价
function variantUnitPrice(v) {
  var tp = v.totalPrice || 0;
  if (v.packWeight && v.packWeight > 0) {
    var tw = variantTotalWeight(v);
    if (tw > 0) return tp / tw;
  }
  var stock = v.stock || 0;
  if (stock > 0) return tp / stock;
  return v.price || 0;
}
// 库存展示文本：packQty>1 时显示"X套 (+余Y个)"
function variantPackText(v, item) {
  var spAll = variantSpecsOf(v);
  if (spAll.length) {
    return trimNum(variantSpecContent(v)) + variantSpecUnit(v) + '（共 ' + trimNum(variantSpecPieces(v)) + ' 件）';
  }
  var stock = v.stock || 0;
  var pq = v.packQty || 1;
  var unit = v.packUnit || (item && item.unit) || '个';
  if (pq > 1 && stock > 0) {
    var packs = Math.floor(stock / pq);
    var rem = stock % pq;
    var t = packs + ' 套';
    if (rem > 0) t += ' + ' + rem + ' ' + unit;
    return t + '（' + stock + unit + '）';
  }
  return stock + ' ' + unit;
}
// 按含量单位折算可比单价文本（kg→每kg；g/ml→每100g/每100ml；L→每L）
function unitPricePerWeightText(v) {
  var u = weightUnitOf(v);
  var up = variantUnitPrice(v); // 已是基于原始单位的单价（每 kg/g/ml/L）
  if (u === 'g') return '每100g ¥' + (up * 100).toFixed(2);
  if (u === 'ml') return '每100ml ¥' + (up * 100).toFixed(2);
  if (u === 'L') return '每L ¥' + up.toFixed(2);
  return '每kg ¥' + up.toFixed(2); // kg 或默认
}
// 比价提示文本（重量或单价维度）
function variantPriceCompareText(v) {
  if (v.packWeight && v.packWeight > 0) return unitPricePerWeightText(v);
  var stock = v.stock || 0;
  if (stock > 0) return '每' + (v.packUnit || '个') + ' ¥' + (variantUnitPrice(v)).toFixed(2);
  return '每' + (v.packUnit || '个') + ' ¥' + (v.price || 0).toFixed(2);
}

// 耐用品：计算单件物品的总金额（优先用各款 totalPrice，否则用 单价×件数）
function calcDurableTotalPrice(item) {
  if (!item.variants || item.variants.length === 0) return 0;
  var total = item.variants.reduce(function(s, v) {
    var t = v.totalPrice || ((v.price || 0) * (v.stock || 1));
    return s + t;
  }, 0);
  return parseFloat(total.toFixed(2));
}

// 耐用品：计算单件物品的实际件数（所有variant数量之和）
function calcDurableItemCount(item) {
  if (!item.variants || item.variants.length === 0) return 0;
  return item.variants.length;
}

// 耐用品：计算整个板块的总金额
function calcZoneTotalPrice(zone) {
  if (!zone || !zone.items) return 0;
  return zone.items.reduce(function(s, it) { return s + calcDurableTotalPrice(it); }, 0);
}

function ensureVariants(item) {
  if (!item.variants || item.variants.length === 0) {
    item.variants = [{
      id: genId(), brand: item.brand || item.name, stock: item.stock || 0,
      price: item.currentPrice || 0, channel: item.channel || '',
      photos: item.photos || [], opened: item.opened || false,
      openDate: item.openDate || null, finishDate: item.finishDate || null,
      usedUp: item.usedUp || false, openQty: item.openQty || 0,
      feeling: item.feeling || null, shelfLife: item.shelfLife || null,
      productionDate: item.productionDate || null,
      packCount: item.stock || 0, packPrice: item.currentPrice || 0, packQty: 1, packUnit: item.unit || '个', packWeight: 0
    }];
  }
}

function syncItemFromVariants(item) {
  ensureVariants(item);
  item.stock = item.variants.reduce(function(s, v) { return s + (v.stock || 0); }, 0);
  if (item.variants.length > 0) {
    // 补给品总金额 = 各品牌总价之和
    item.currentPrice = parseFloat(item.variants.reduce(function(s,v){ return s + (v.totalPrice || ((v.price||0)*(v.stock||0))); }, 0).toFixed(2));
    item.channel = item.variants[0].channel;
    // 合并所有变体的照片到 item.photos（用于首页卡片正面展示）
    var allVariantPhotos = [];
    item.variants.forEach(function(v) {
      if (v.photos && v.photos.length > 0) {
        v.photos.forEach(function(p) { allVariantPhotos.push(p); });
      }
    });
    // 优先保留顶层 item.photos 中已有的照片，再加上变体照片去重
    var seen = {};
    var merged = [];
    (item.photos || []).concat(allVariantPhotos).forEach(function(p) {
      if (p && !seen[p]) { seen[p] = true; merged.push(p); }
    });
    item.photos = merged;
    item.opened = item.variants.some(function(v) { return v.opened && !v.usedUp; });
    item.usedUp = item.variants.length > 0 && item.variants.every(function(v) { return v.usedUp; });
    var active = item.variants.find(function(v) { return v.opened && !v.usedUp; });
    if (active) { item.openDate = active.openDate; item.openQty = active.openQty; }
  }
}

// 耐用品：从variants同步到item级别
function syncDurableFromVariants(item) {
  if (!item.variants || item.variants.length === 0) {
    item.variants = [{ id: genId(), brand: item.name || '第1件', stock: 1, price: item.currentPrice || 0, photos: item.photos || [] }];
  }
  item.stock = item.variants.reduce(function(s,v){ return s + (v.stock||1); }, 0);
  item.unit = '件';
  // 合并所有variant照片到item级别（用于兼容旧逻辑）
  var allPhotos = [];
  item.variants.forEach(function(v) {
    if (v.photos && v.photos.length > 0) {
      allPhotos = allPhotos.concat(v.photos);
    }
  });
  item.photos = allPhotos;
  item.currentPrice = parseFloat((item.variants[0].price || 0).toFixed(2));
}

// ========== 页面切换 ==========
var currentZoneId = null;
var currentCategoryId = null;
var currentSearchQuery = '';

function openSettings() { showPage('settings'); }

function showPage(page) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');

  document.querySelectorAll('.navbar').forEach(function(n) { n.style.display = 'none'; });
  if (page === 'home') document.getElementById('nav-home').style.display = 'flex';
  else if (page === 'zone') document.getElementById('nav-zone').style.display = 'flex';
  else if (page === 'pool') document.getElementById('nav-pool').style.display = 'flex';
  else if (page === 'settings') document.getElementById('nav-settings').style.display = 'flex';

  document.querySelectorAll('.tabbar-item').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === page);
  });

  if (page === 'home') renderHome();
  else if (page === 'zone') renderZone();
  else if (page === 'pool') renderTasks();
  else if (page === 'settings') renderSettings();

  window.scrollTo(0, 0);
}

function enterZone(zoneId) {
  currentZoneId = zoneId;
  var zone = getZone(zoneId);
  document.getElementById('zone-title').textContent = zone.icon + ' ' + zone.name;
  currentCategoryId = 'all';
  currentSearchQuery = '';
  showPage('zone');
}

// ========== 数据查询 ==========
function getZone(zoneId) {
  for (var i = 0; i < DB.zones.length; i++) {
    if (DB.zones[i].id === zoneId) return DB.zones[i];
  }
  return null;
}
function getCategory(zoneId, catId) {
  var zone = getZone(zoneId);
  if (!zone) return null;
  for (var i = 0; i < zone.categories.length; i++) {
    if (zone.categories[i].id === catId) return zone.categories[i];
  }
  return null;
}

// ========== 两级分类辅助 ==========
// 取某大类的所有子分类（无 parentId 的分类视为大类）
function getSubcategories(zone, catId) {
  if (!zone || !zone.categories) return [];
  return zone.categories.filter(function(c) { return c.parentId === catId; });
}
// 判断分类是否为子分类
function isSubcategory(zone, cat) {
  return !!(cat && cat.parentId && zone.categories.some(function(c) { return c.id === cat.parentId; }));
}
// 返回分类路径："大类 · 子类"（大类本身只返回大类名）
function getCategoryPath(zoneId, catId) {
  var zone = getZone(zoneId);
  if (!zone) return '';
  var cat = getCategory(zoneId, catId);
  if (!cat) return '';
  if (cat.parentId) {
    var parent = getCategory(zoneId, cat.parentId);
    if (parent) return parent.name + ' · ' + cat.name;
  }
  return cat.name;
}
// 搜索匹配：物品名/备注/位置/分类路径/每件描述与备注
function matchesSearch(item, zone, q) {
  q = (q || '').toLowerCase();
  if (!q) return true;
  var hay = [
    item.name || '',
    item.notes || '',
    item.location || ''
  ];
  if (item.categoryId) hay.push(getCategoryPath(zone.id, item.categoryId));
  (item.variants || []).forEach(function(v) {
    hay.push(v.brand || '');
    if (v.notes) hay.push(v.notes);
  });
  return hay.some(function(s) { return s.toLowerCase().indexOf(q) >= 0; });
}

// 开袋即用完：完全由用户手动开关控制，不再根据分类名/物品名自动猜测
function isOneShotItem(item) {
  return !!(item && item.oneShot === true);
}
function getItem(zoneId, itemId) {
  var zone = getZone(zoneId);
  if (!zone) return null;
  for (var i = 0; i < zone.items.length; i++) {
    if (zone.items[i].id === itemId) return zone.items[i];
  }
  return null;
}
// ========== 归档（不再补货/不再提醒，但保留全部历史数据）==========
function isArchived(it) { return !!(it && it.archived); }
function visibleItems(zone) { return (zone.items || []).filter(function(it) { return !it.archived; }); }
function archivedItemsOf(zone) { return (zone.items || []).filter(function(it) { return !!it.archived; }); }
function archivedCountAll() {
  var n = 0;
  DB.zones.forEach(function(z) { n += archivedItemsOf(z).length; });
  return n;
}
function getItemsByCategory(zoneId, catId) {
  var zone = getZone(zoneId);
  if (!zone) return [];
  // 预计算：选中大类时，允许匹配的 id 集合（自身 + 其所有子分类）
  var allowedIds = null;
  if (catId !== 'all') {
    allowedIds = [catId];
    getSubcategories(zone, catId).forEach(function(sub) {
      allowedIds.push(sub.id);
    });
  }
  return zone.items.filter(function(it) {
    // 归档物品默认隐藏；搜索时才露出来（带"已归档"标记），方便找回
    if (it.archived && !currentSearchQuery) return false;
    if (currentSearchQuery && !matchesSearch(it, zone, currentSearchQuery)) return false;
    return catId === 'all' || allowedIds.indexOf(it.categoryId) >= 0;
  });
}

// ========== 首页渲染 ==========
function renderHome() {
  var html = '';
  var allItems = [];
  DB.zones.forEach(function(zone) {
    visibleItems(zone).forEach(function(it) {
      it._zoneId = zone.id;
      it._zoneType = zone.type;
      allItems.push(it);
    });
  });

  // === 消耗品预警 ===
  var expired = [], expiring = [], lowStock = [], lowStockSoft = [], stockUpList = [];
  var inUseItems = [], stockpileItems = [];
  DB.zones.forEach(function(zone) {
    if (zone.type !== 'consumable') return;
    visibleItems(zone).forEach(function(it) {
      var status = getItemStatus(it);
      if (status.expired) expired.push({item: it, zone: zone});
      if (status.expiring) expiring.push({item: it, zone: zone});
      if (status.lowStock) lowStock.push({item: it, zone: zone});
      else if (status.lowStockSoft) lowStockSoft.push({item: it, zone: zone});
      if (status.stockUpAlert) stockUpList.push({item: it, zone: zone});
      if (status.hasInUse) inUseItems.push({item: it, zone: zone});
      if (status.allUnopened) stockpileItems.push({item: it, zone: zone});
    });
  });

  // === 预警条 ===
  html += '<div class="alert-strip">';
  if (expired.length > 0) {
    html += '<div class="alert-badge alert-red pulse" onclick="filterExpired()">';
    html += '<div class="badge-num">' + expired.length + '</div>';
    html += '<div class="badge-label">已过期</div></div>';
  }
  if (expiring.length > 0) {
    html += '<div class="alert-badge alert-yellow" onclick="filterExpiring()">';
    html += '<div class="badge-num">' + expiring.length + '</div>';
    html += '<div class="badge-label">即将过期</div></div>';
  }
  if (lowStock.length > 0) {
    html += '<div class="alert-badge alert-yellow" onclick="filterLowStock()">';
    html += '<div class="badge-num">' + lowStock.length + '</div>';
    html += '<div class="badge-label">库存告急</div></div>';
  }
  if (lowStockSoft.length > 0) {
    html += '<div class="alert-badge alert-blue" onclick="filterLowStockSoft()">';
    html += '<div class="badge-num">' + lowStockSoft.length + '</div>';
    html += '<div class="badge-label">余量较少</div></div>';
  }
  if (stockUpList.length > 0) {
    html += '<div class="alert-badge alert-purple" onclick="filterStockUp()">';
    html += '<div class="badge-num">' + stockUpList.length + '</div>';
    html += '<div class="badge-label">该囤货了</div></div>';
  }
  if (inUseItems.length > 0) {
    html += '<div class="alert-badge alert-green" onclick="filterInUse()">';
    html += '<div class="badge-num">' + inUseItems.length + '</div>';
    html += '<div class="badge-label">使用中</div></div>';
  }
  if (stockpileItems.length > 0) {
    html += '<div class="alert-badge alert-gray" onclick="filterStockpile()">';
    html += '<div class="badge-num">' + stockpileItems.length + '</div>';
    html += '<div class="badge-label">囤货区</div></div>';
  }
  if (expired.length === 0 && expiring.length === 0 && lowStock.length === 0 && lowStockSoft.length === 0 && stockUpList.length === 0 && inUseItems.length === 0 && stockpileItems.length === 0) {
    html += '<div class="alert-badge alert-green">';
    html += '<div class="badge-num">✓</div>';
    html += '<div class="badge-label">一切正常</div></div>';
  }
  html += '</div>';

  // 去任务委托规划补货
  html += '<div style="margin-bottom:14px"><button class="btn btn-outline btn-sm" style="width:100%" onclick="showPage(\'pool\')">📋 去「任务委托」规划补货</button></div>';

  // === 板块入口 ===
  html += '<div class="section-title">领地分布<div class="section-action" onclick="openZoneManager()">管理</div></div>';
  html += '<div>';
  DB.zones.forEach(function(zone) {
    var count;
    // 耐用品：统计所有variant的实际件数总和；补给品：按物品卡片数量
    if (zone.type === 'durable') {
      count = visibleItems(zone).reduce(function(s, it) { return s + calcDurableItemCount(it); }, 0);
    } else {
      count = visibleItems(zone).length;
    }
    var themeClass = 'zone-theme-' + (zone.theme || (zone.type === 'consumable' ? 'consumable' : 'durable'));
    html += '<div class="zone-card ' + themeClass + '" onclick="enterZone(\'' + zone.id + '\')">';
    html += '<div class="zone-icon">' + zone.icon + '</div>';
    html += '<div class="zone-info">';
    html += '<div class="zone-name">' + escapeHtml(zone.name) + '</div>';
    html += '<div class="zone-desc">' + (zone.categories.length + '个分类') + '</div>';
    html += '</div>';
    if (zone.type === 'durable') {
      var totalPrice = calcZoneTotalPrice(zone);
      html += '<div class="zone-count" style="text-align:right;line-height:1.4">';
      html += '<div style="font-size:14px;font-weight:700;color:var(--text)">' + count + '件</div>';
      html += '<div style="font-size:12px;color:var(--accent);font-weight:600">¥' + totalPrice.toFixed(2) + '</div>';
      html += '</div>';
    } else {
      html += '<div class="zone-count">' + count + '件</div>';
    }
    html += '</div>';
  });
  html += '</div>';

  // === AI分析 ===
  html += renderAIAnalysis();

  document.getElementById('home-content').innerHTML = html;
}

// ========== 物品状态判断 ==========
function getItemStatus(item) {
  var status = {
    expired: false, expiring: false,
    lowStock: false, lowStockSoft: false, stockUpAlert: false,
    shelfPercent: 100, daysLeft: null, estDaysLeft: null, monthsLeft: null
  };

  var totalStock = getActiveStock(item);

  // 保质期：取所有variants中最早过期的（不再买的品牌不参与提醒计算）
  var allVariants = (item.variants && item.variants.length > 0) ? item.variants : [item];
  var variants = allVariants.filter(function(v) { return !v.noRestock; });
  if (variants.length === 0) {
    // 全部品牌都标记了「不再买」→ 整个物品不再提醒，只保留保质期信息
    variants = [];
  }
  var earliestDaysLeft = null;
  var earliestShelfPercent = 100;
  variants.forEach(function(v) {
    var sl = v.shelfLife || item.shelfLife;
    var pd = v.productionDate || item.productionDate;
    if (sl && sl > 0 && pd) {
      var prod = new Date(pd);
      var expireDate = new Date(prod);
      expireDate.setMonth(expireDate.getMonth() + sl);
      var daysLeft = daysBetween(new Date(), expireDate);
      var totalDays = sl * 30;
      var shelfPercent = Math.max(0, Math.min(100, (daysLeft / totalDays) * 100));
      if (earliestDaysLeft === null || daysLeft < earliestDaysLeft) {
        earliestDaysLeft = daysLeft;
        earliestShelfPercent = shelfPercent;
      }
    }
  });
  if (earliestDaysLeft !== null) {
    status.daysLeft = earliestDaysLeft;
    status.shelfPercent = earliestShelfPercent;
    if (earliestDaysLeft <= 0) status.expired = true;
    else if (earliestDaysLeft <= 30) status.expiring = true;
  }

  // === 使用状态 ===
  // 使用中：含「不再买」的品牌（还在开封用的，开封天数照常跟踪）
  status.hasInUse = allVariants.some(function(v) { return v.opened && !v.usedUp; });
  status.allUnopened = variants.length > 0 && variants.every(function(v) { return !v.opened; });

  // 全部品牌都标记「不再买」→ 整个物品不再提醒补货（保质期提醒保留）
  if (variants.length === 0) return status;

  // === 库存告急判断（基于消耗速率预估） ===
  var threshold = item.stockThreshold || 1;
  if (totalStock > 0) {
    // 有库存：基于历史消耗速率预估剩余可用天数
    var estDays = estimateStockDaysLeft(item, totalStock, variants);
    status.estDaysLeft = estDays;
    if (estDays !== null) {
      // 有历史数据：以「预估剩余天数」为主判据，不再额外要求库存数 ≤ 阈值
      // （抽纸剩 3 包、月耗 1.9 包 → 约 47 天，虽然件数 > 阈值也必须提示）
      if (estDays <= 30) status.lowStock = true;
      else if (estDays <= 90) status.lowStockSoft = true;
      // 预估天数还够，但库存已经降到阈值以内 → 温和提示
      else if (totalStock <= threshold) status.lowStockSoft = true;
    } else {
      // 没有历史数据：库存 ≤ 阈值，用温和提示（浅蓝色），不显示黄色告急
      if (totalStock <= threshold) status.lowStockSoft = true;
    }
  } else {
    // 库存为 0：手头没有任何后备库存，无论是否使用中都应提示补货
    var hasOpenedInUse = variants.some(function(v) { return v.opened && !v.usedUp; });
    if (hasOpenedInUse) {
      // 有使用中的变体：按消耗速率预估剩余天数
      var openedEstDays = estimateOpenedDaysLeft(item, variants);
      status.estDaysLeft = openedEstDays;
      if (openedEstDays !== null && openedEstDays > 0) {
        // 正在使用的那份还没用完，但用完就没库存了 → 温和提示补货（蓝）
        status.lowStockSoft = true;
      } else {
        // 已超过预估用完时间，或无法预估 → 真正告急（黄）
        status.lowStock = true;
      }
    } else {
      // 没有使用中的变体，库存为 0，真正告急
      status.lowStock = true;
    }
  }

  // 余量较少/告急：够用天数少或余量低都要提示，未开封也提示（抽纸未开封但只剩 3 包）
  var hasAnyStock = (item.variants && item.variants.length ? item.variants : [item]).some(function (v) { return (v.stock || 0) > 0; });
  if (!status.hasInUse && !hasAnyStock) status.lowStockSoft = false;

  // === 囤货提醒（独立于使用状态） ===
  // 用户的采购节奏：一年只在双 11 采购一次
  // 规则：只要「有过使用记录」且按消耗速率预估「撑不满一年」→ 就该囤货
  // 与是否开封、是否使用中无关；库存 0 也照常提示
  var hasAnyRecord = (item.usageRecords || []).some(function (r) { return r.startDate && r.endDate; });
  if (hasAnyRecord) {
    var estAll = null;
    if (totalStock > 0) {
      estAll = estimateStockDaysLeft(item, totalStock, variants);
    } else {
      // 库存为 0：还有使用中的那份在用 → 它用完就彻底没了，剩余天数取其预估值
      var inUseV = variants.filter(function (v) { return v.opened && !v.usedUp; });
      if (inUseV.length) estAll = Math.max(0, estimateOpenedDaysLeft(item, variants) || 0);
      else estAll = 0;
    }
    if (estAll !== null) {
      status.estDaysLeft = (status.estDaysLeft === null || status.estDaysLeft === undefined) ? estAll : status.estDaysLeft;
      status.monthsLeft = Math.round((estAll / 30) * 10) / 10;
      // 撑不满 365 天 → 该囤货了
      if (estAll < 365) status.stockUpAlert = true;
    }
  }

  return status;
}

// 短卡片库存线条颜色：以「预估剩余天数」为主，件数占比为辅
// 返回 'high'(绿) / 'mid'(黄) / 'low'(红)
function stockBarClass(item, status) {
  status = status || getItemStatus(item);
  var totalStock = getTotalStock(item);
  if (!totalStock) return 'low';
  var threshold = item.stockThreshold || 1;
  var pct = (totalStock / Math.max(totalStock, threshold * 3)) * 100;
  var barClass = 'low';
  if (pct > 60) barClass = 'high';
  else if (pct > 30) barClass = 'mid';
  // 有速率预估：按剩余天数覆盖（>180 天绿 / 90~180 黄 / ≤90 红）
  if (status.estDaysLeft !== null && status.estDaysLeft !== undefined) {
    if (status.estDaysLeft > 180) barClass = 'high';
    else if (status.estDaysLeft > 90) barClass = 'mid';
    else barClass = 'low';
  }
  // 真正告急 → 至少是红；温和提示 → 至多是黄
  if (status.lowStock) barClass = 'low';
  else if (status.lowStockSoft && barClass === 'high') barClass = 'mid';
  return barClass;
}

// 预估当前总库存还能用多少天（基于历史消耗速率）
function estimateStockDaysLeft(item, totalStock, variants) {
  if (!item.usageRecords || item.usageRecords.length === 0) return null;
  var records = item.usageRecords.filter(function(r) { return r.startDate && r.endDate; });
  if (records.length === 0) return null;
  // 统计总消耗量和首次使用日期
  var totalQty = 0, totalContent = 0, allContent = true, earliestDate = null;
  records.forEach(function(r) {
    totalQty += (r.qty || 1);
    if (r.contentUsed > 0) totalContent += r.contentUsed; else allContent = false;
    var start = new Date(r.startDate);
    if (!earliestDate || start < earliestDate) earliestDate = start;
  });
  if (totalQty === 0) return null;
  // 从首次使用到今天经过多少天
  var totalDays = daysBetween(earliestDate, new Date());
  if (totalDays < 1) totalDays = 1;
  // 多规格开封记录：库存本身就是含量口径，直接按「每天消耗多少含量」折算
  // 注意：入参 totalStock 是件数口径，不能直接除以含量速率 —— 用剩余含量（支×每支g）
  if (allContent && totalContent > 0) {
    var scE = itemStockContent(item, variants);
    if (scE !== null) {
      var perDay = totalContent / totalDays;
      if (perDay <= 0) return null;
      return Math.round(scE / perDay);
    }
  }
  var avgDaysPerUnit = totalDays / totalQty;
  // 剩余库存换算成"套"：消耗记录 qty 记的是套餐数，pack 模式 stock 是小单位总数，需除以每套含数
  var isPackMode = item.consumeMode === 'pack';
  var avgPq = 1;
  if (isPackMode && variants && variants.length) {
    avgPq = variants.reduce(function(s, v) { return s + (v.packQty || 1); }, 0) / variants.length;
  }
  var remainingPacks = isPackMode ? (totalStock / Math.max(1, avgPq)) : totalStock;
  // 如果有使用中的变体，减去已用天数
  var activeVariant = variants.find(function(v) { return v.opened && !v.usedUp; });
  if (activeVariant && activeVariant.openDate) {
    var usedDays = daysBetween(new Date(activeVariant.openDate), new Date());
    var remainingInCurrent = Math.max(0, avgDaysPerUnit - usedDays);
    return Math.round(remainingInCurrent + Math.max(0, remainingPacks - 1) * avgDaysPerUnit);
  }
  return Math.round(remainingPacks * avgDaysPerUnit);
}

// ========== 消耗速率计算 ==========
// 基于"首次使用日期到今天"的总时间跨度，计算平均月/年消耗
// 消耗速率的单位名：pack 模式记录的是"开了几套"→套；unit 模式→小单位（优先变体的 packUnit，如 瓶/袋/包）
function rateUnitName(item) { return item.consumeMode === 'pack' ? '套' : mainPackUnit(item); }
// 平均每套含数（小单位/套）
function avgPackQtyOf(item) {
  if (item.consumeMode !== 'pack' || !item.variants || !item.variants.length) return 1;
  return item.variants.reduce(function (s, v) { return s + (v.packQty || 1); }, 0) / item.variants.length;
}
// 主变体的小单位名（ml/颗/包…）
function mainPackUnit(item) {
  if (item.variants && item.variants.length) {
    for (var i = 0; i < item.variants.length; i++) { if (item.variants[i].packUnit) return item.variants[i].packUnit; }
  }
  return item.unit || '个';
}
function round1(x) { return Math.round((+x || 0) * 10) / 10; }
function calcUsageRate(item) {
  if (!item.usageRecords || item.usageRecords.length === 0) return 0;
  var records = item.usageRecords.filter(function(r) { return r.startDate && r.endDate; });
  if (records.length === 0) return 0;

  // 统计总消耗量
  var totalQty = 0;
  var earliestDate = null;
  records.forEach(function(r) {
    totalQty += (r.qty || 1);
    var start = new Date(r.startDate);
    if (!earliestDate || start < earliestDate) earliestDate = start;
  });
  if (totalQty === 0) return 0;

  // 从首次使用到今天经过了多少天
  var today = new Date();
  var totalDays = daysBetween(earliestDate, today);
  if (totalDays < 1) totalDays = 1; // 至少1天

  var perDay = totalQty / totalDays;
  return perDay * 30; // 月消耗
}

// ===== 含量口径的消耗速率：把使用记录折算成 ml/g 等含量单位 =====
// 记录口径：pack 模式 qty=套 → 含量 = qty × 每套含 × 每小单位含量；unit 模式 qty=小单位 → 含量 = qty × 每小单位含量
// 返回 { perMonth, unit }；任一记录无法换算（未配含量 / ml 混 kg）→ 返回 null，展示退回记录口径
// 含量单位换算表：容量/重量可换算，计数类（粒/个/片/颗）按自身计，不写死单位
var CONTENT_UNIT_TABLE = { ml: ['ml', 1], L: ['ml', 1000], g: ['g', 1], kg: ['g', 1000], 粒: ['粒', 1], 个: ['个', 1], 片: ['片', 1], 颗: ['颗', 1], 包: ['包', 1], 瓶: ['瓶', 1], 盒: ['盒', 1], 抽: ['抽', 1] };
function contentRateOf(item) {
  if (!item.usageRecords || !item.usageRecords.length) return null;
  var vs = item.variants || [];
  var recs = item.usageRecords.filter(function(r) { return r.startDate && r.endDate; });
  if (!recs.length) return null;
  // 基准含量单位：第一个配了含量且单位可换算的变体
  var baseUnit = null;
  for (var i = 0; i < vs.length; i++) {
    if (variantSpecsOf(vs[i]).length) { baseUnit = variantSpecUnit(vs[i]); break; } // 混合规格：以明细单位为准
    if ((parseFloat(vs[i].packWeight) || 0) > 0 && CONTENT_UNIT_TABLE[weightUnitOf(vs[i])]) { baseUnit = weightUnitOf(vs[i]); break; }
  }
  if (!baseUnit) return null;
  var baseFactor = CONTENT_UNIT_TABLE[baseUnit][1];
  var total = 0, earliest = null, ok = true;
  recs.forEach(function(r) {
    var v = null;
    if (r.variantId) v = vs.find(function(x) { return x.id === r.variantId; });
    if (!v) v = vs.find(function(x) { return (parseFloat(x.packWeight) || 0) > 0; }); // 旧记录无variantId → 回退第一个有含量的
    var m = v ? CONTENT_UNIT_TABLE[weightUnitOf(v)] : null;
    if (r.contentUsed > 0) {
      // 多规格开封记录：直接记了本次消耗的总含量
      if (!m || m[0] !== CONTENT_UNIT_TABLE[baseUnit][0]) { ok = false; return; }
      total += r.contentUsed * m[1] / baseFactor;
      var s0 = new Date(r.startDate);
      if (!earliest || s0 < earliest) earliest = s0;
      return;
    }
    var w = v ? (parseFloat(v.packWeight) || 0) : 0;
    if (!v || w <= 0 || !m || m[0] !== CONTENT_UNIT_TABLE[baseUnit][0]) { ok = false; return; }
    var mult = item.consumeMode === 'pack' ? (parseFloat(v.packQty) || 1) : 1;
    total += (r.qty || 1) * w * mult * m[1] / baseFactor;
    var s = new Date(r.startDate);
    if (!earliest || s < earliest) earliest = s;
  });
  if (!ok || total <= 0 || !earliest) return null;
  var days = daysBetween(earliest, new Date());
  if (days < 1) days = 1;
  return { perMonth: total / days * 30, unit: baseUnit };
}
// 速率展示文本：有含量口径 → 「≈9.6ml/月（0.6个/月）」；没有 → 「0.6个/月」
function rateValueText(item, perMonth, suffix) {
  var ru = rateUnitName(item);
  // 多规格记录的 perMonth 口径是「份」，不能借用 mainPackUnit 的名字
  if ((item.usageRecords || []).some(function (r) { return r.specText; })) ru = '份';
  var c = contentRateOf(item);
  if (c && c.perMonth > 0) {
    var cv = suffix === '/年' ? c.perMonth * 12 : c.perMonth;
    var txt = '≈' + trimNum(round1(cv)) + c.unit + suffix;
    if (ru !== c.unit) txt += '（' + trimNum(round1(perMonth)) + ru + suffix + '）';
    return txt;
  }
  return trimNum(round1(perMonth)) + ru + suffix;
}

// ========== 预估使用中变体的剩余天数 ==========
// 基于"首次使用到今天"的总时间跨度，预估剩余可用天数
function estimateOpenedDaysLeft(item, variants) {
  if (!item.usageRecords || item.usageRecords.length === 0) return null;
  var records = item.usageRecords.filter(function(r) { return r.startDate && r.endDate; });
  if (records.length === 0) return null;

  // 统计总消耗量和首次使用日期
  var totalQty = 0, totalContent = 0, allContent = true, earliestDate = null;
  records.forEach(function(r) {
    totalQty += (r.qty || 1);
    if (r.contentUsed > 0) totalContent += r.contentUsed; else allContent = false;
    var start = new Date(r.startDate);
    if (!earliestDate || start < earliestDate) earliestDate = start;
  });
  if (totalQty === 0) return null;
  var totalDays = daysBetween(earliestDate, new Date());
  if (totalDays < 1) totalDays = 1;
  var avgDaysPerUnit = totalDays / totalQty;

  // 找到当前使用中的变体
  var activeVariant = variants.find(function(v) { return v.opened && !v.usedUp; });
  if (!activeVariant || !activeVariant.openDate) return null;

  // 已使用天数
  var usedDays = daysBetween(new Date(activeVariant.openDate), new Date());
  // 多规格：库存是含量口径，直接按「剩余含量 ÷ 每天消耗含量」估
  if (allContent && totalContent > 0) {
    var perDayC = totalContent / totalDays;
    if (perDayC <= 0) return null;
    return Math.round((activeVariant.stock || 0) / perDayC - usedDays);
  }
  // 预估剩余天数 = 平均周期 - 已使用天数
  return Math.round(avgDaysPerUnit - usedDays);
}

// ========== AI分析渲染 ==========
function renderAIAnalysis() {

    });
    html += '<div style="font-size:11px;color:var(--text-secondary);margin-top:4px">点开卡片可查看建议采购量（半年/一年）</div>';
