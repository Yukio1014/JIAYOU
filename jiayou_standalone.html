function adjustOpenQty(delta) {
  window._openQty = Math.max(1, Math.min(window._maxOpenQty, window._openQty + delta));
  var valEl = document.getElementById('open-qty-val');
  if (valEl) valEl.textContent = window._openQty;
}
// 多规格开封：每个规格独立步进（0 ~ 该规格剩余份数）；k = v.specs 原始下标
function adjustSpecOpen(k, delta) {
  var q = window._openSpecQty || {};
  var item = getItem(currentZoneId, window._openItemId);
  var v = item && item.variants ? item.variants.find(function (x) { return x.id === window._openVariantId; }) : null;
  var s = v ? (v.specs || [])[k] : null;
  var max = s ? specPiecesOf(s) : 0;
  q[k] = Math.max(0, Math.min(max, (q[k] || 0) + delta));
  window._openSpecQty = q;
  var el = document.getElementById('spec-open-' + k);
  if (el) el.textContent = q[k];
}

// ========== 模型④ 组合消耗型：动作按「包」，统计按「片」 ==========
// 说明：specIdx 是 v.specs 的原始下标（UI 与记录都用它），但只有「有效规格」才可操作
// 开启新包：某子规格 packCount -1，记一条开包记录（带 specName / packPieces）
function openOnePack(itemId, variantId, specIdx) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function (x) { return x.id === variantId; });
  if (!v) return;
  var s = (v.specs || [])[specIdx];
  if (!s) return;
  // 该规格必须还有未开的包（剩余包数 > 0），否则视为不可操作
  var remaining = specPacksRemaining(v, s);
  if (remaining <= 0) { toast('这个规格已经没有新包了'); return; }
  var pq = specPackQty(s), u = s.unit || '';
  var nm = s.name || ('规格' + (specIdx + 1));

  // 消耗层：已开包数 +1（不改动构成 packCount，也不改动套餐数）
  s.openPacks = Math.round((specOpenPacks(s) + 1) * 100) / 100;
  // 兼容字段 qty：该规格「单套内包数 × 每包含量」（构成口径，保持稳定）
  s.qty = Math.round(specPackCount(s) * pq * 100) / 100;
  // 记下「这一包正在用」的开始时间（同一规格同时只有一包在开）
  var pkey = '__packOpenAt_' + specIdx;
  if (!s[pkey]) s[pkey] = new Date().toISOString();
  s.__openPack = true;

  var nowISO = new Date().toISOString();
  if (!item.usageRecords) item.usageRecords = [];
  // 注意：这里**不结束**同规格的上一条记录 —— 开新包只代表「开始用新的一包」，
  // 上一条记录可能还没结束（同一规格可以同时开着多包，如日用+夜用同时在用）。
  // 每条「开启」记录在「这包用完」时统一收尾，保证消耗量不丢失。
  item.usageRecords.push({
    startDate: nowISO, endDate: null,
    qty: pq, variantId: variantId, brand: v.brand,
    specName: nm, packIdx: specIdx, packPieces: pq,
    specText: nm + '×1包' + (pq !== 1 ? '（' + trimNum(pq) + u + '）' : '')
  });

  v.stock = variantSpecContent(v);
  v.opened = true;
  v.openDate = nowISO;
  var allGone = variantSpecsOf(v).every(function (x) { return specPacksRemaining(v, x) <= 0; });
  if (v.stock <= 0 && allGone) { v.usedUp = true; v.finishDate = nowISO; }
  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  toast('已开启 ' + nm + ' 新包' + (pq !== 1 ? '（' + trimNum(pq) + u + '）' : '') + '，剩 ' + trimNum(specPacksRemaining(v, s)) + ' 包未开');
}

// 整批开启：每个还有包的规格各开 1 包
function openAllPacks(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function (x) { return x.id === variantId; });
  if (!v) return;
  var sp = variantSpecsOf(v);
  var openedCount = 0;
  var nowISO = new Date().toISOString();
  if (!item.usageRecords) item.usageRecords = [];
  sp.forEach(function (s) {
    if (specPacksRemaining(v, s) <= 0) return;
    var nm = s.name || '规格';
    var pq = specPackQty(s);
    s.openPacks = Math.round((specOpenPacks(s) + 1) * 100) / 100;
    s.qty = Math.round(specPackCount(s) * pq * 100) / 100;
    s.__openPack = true;
    item.usageRecords.push({
      startDate: nowISO, endDate: null, qty: pq, variantId: variantId, brand: v.brand,
      specName: nm, packPieces: pq, specText: nm + '×1包'
    });
    openedCount++;
  });
  if (!openedCount) { toast('没有可开启的新包'); return; }
  v.stock = variantSpecContent(v);
  v.opened = true;
  v.openDate = v.openDate || nowISO;
  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  toast('已整批开启 ' + openedCount + ' 个规格的新包');
}

// 这包用完了：结束所有未结束的开包记录（不扣库存——开包时已扣）
function confirmOpenCombo(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function (x) { return x.id === variantId; });
  if (!v) return;
  var nowISO = new Date().toISOString();
  var closed = 0, usedPieces = 0;
  (item.usageRecords || []).forEach(function (r) {
    if (r.variantId === variantId && r.specName && !r.endDate && !r.instant) {
      r.endDate = nowISO; closed++; usedPieces += (r.qty || 0);
    }
  });
  if (!closed) { toast('没有正在使用的包（先点「开启新包」）'); return; }
  variantSpecsOf(v).forEach(function (s) { s.__openPack = false; });
  var allGone = variantSpecsOf(v).every(function (s) { return specPacksRemaining(v, s) <= 0; });
  if (allGone) { v.usedUp = true; v.finishDate = nowISO; }
  else { v.opened = false; v.usedUp = false; v.finishDate = null; }
  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  toast('这包已用完（' + closed + ' 个规格，共 ' + trimNum(usedPieces) + variantSpecUnit(v) + '）');
}
function confirmOpen(itemId, variantId, markAsUsed) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(v) { return v.id === variantId; });
  if (!v) return;
  var dateInput = document.getElementById('open-date');
  var date = dateInput ? dateInput.value : new Date().toISOString().split('T')[0];
  var nowISO = new Date(date).toISOString();

  // 混合规格：按「规格×份数」消耗（口径 = 已开包数 openPacks，不动构成与套餐数）
  var spOpen = variantSpecsOf(v);
  if (spOpen.length && window._openSpecQty) {
    var usedParts = [], pieces = 0, contentUsed = 0;
    var spUnit = variantSpecUnit(v); // 先取单位：扣完可能全部归零，之后再取就空了
    spOpen.forEach(function (s) {
      var k = (v.specs || []).indexOf(s); // 原始下标：与 adjustSpecOpen / 表单一致
      var avail = specPacksRemaining(v, s) * specPackQty(s); // 可开份数 = 剩余包数 × 每包含量
      var n = Math.min(window._openSpecQty[k] || 0, avail);
      if (n <= 0) return;
      // 消耗换算：份数 → 包数（不足一包按一包计），累加进「已开包数」
      var pq = specPackQty(s);
      var packs = Math.max(1, Math.ceil(n / pq - 1e-9));
      var maxPacks = specPacksRemaining(v, s);
      if (packs > maxPacks) packs = maxPacks;
      s.openPacks = Math.round((specOpenPacks(s) + packs) * 100) / 100;
      s.qty = Math.round(specPackCount(s) * specPackQty(s) * 100) / 100; // 兼容字段：构成口径
      usedParts.push((s.name || '规格' + (k + 1)) + '×' + packs + '包');
      pieces += packs * pq;
      contentUsed += packs * pq * specContentOf(s);
    });
    if (!pieces) { toast('先选择要开封的规格'); return; }
    v.opened = true;
    v.openDate = nowISO;
    v.openQty = pieces;
    v.stock = variantSpecContent(v);
    var allEmpty = spOpen.every(function (s) { return specPacksRemaining(v, s) <= 0; });
    if (allEmpty) { v.usedUp = true; v.finishDate = nowISO; }
    if (!item.usageRecords) item.usageRecords = [];
    item.usageRecords.push({
      startDate: nowISO,
      endDate: allEmpty ? nowISO : null,
      qty: pieces,
      variantId: variantId,
      brand: v.brand,
      specText: usedParts.join(' + '),
      contentUsed: Math.round(contentUsed * 100) / 100
    });
    syncItemFromVariants(item);
    saveDB();
    closeModal();
    openCardDetail(currentZoneId, itemId);
    toast('已开封 ' + escapeHtml(v.brand) + '：' + usedParts.join(' + ') + '，- ' + trimNum(contentUsed) + spUnit);
    return;
  }

  var qty = window._openQty || 1;
  if (qty > (v.stock || 0)) qty = v.stock || 0; // 不超过现有库存

  v.opened = true;
  v.usedUp = !!markAsUsed;
  v.openDate = nowISO;
  v.openQty = qty;
  v.stock = Math.max(0, (v.stock || 0) - qty);
  if (markAsUsed) v.finishDate = nowISO;

  if (!item.usageRecords) item.usageRecords = [];
  item.usageRecords.push({
    startDate: nowISO,
    endDate: markAsUsed ? nowISO : null,
    qty: qty,
    variantId: variantId,
    brand: v.brand
  });

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  toast('已' + (markAsUsed ? '开封并标记用完' : '开封') + ' ' + escapeHtml(v.brand) + '，库存-' + qty);
}

function confirmFinish(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(v) { return v.id === variantId; });
  if (!v) return;
  var date = document.getElementById('finish-date').value;

  v.usedUp = true;
  v.finishDate = new Date(date).toISOString();

  if (item.usageRecords && item.usageRecords.length > 0) {
    var lastRecord = item.usageRecords[item.usageRecords.length - 1];
    if (!lastRecord.endDate) {
      lastRecord.endDate = new Date(date).toISOString();
    }
  }

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  toast('已记录用完。消耗数据已更新');
}

// ========== 模型③ 即时消耗型：纯打卡扣减 ==========
// 语义：点一次 = 消耗一份，可反复点；不设 opened/finishDate，也不进「本批用完」流程；
//      扣到 0 才自动折叠进「已用完」。记录标记 instant:true，便于和周期型区分统计。
function punchInstant(itemId, variantId, delta) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function (x) { return x.id === variantId; });
  if (!v) return;
  var d = (delta === undefined) ? 1 : parseFloat(delta);
  if (!(d > 0)) return;
  var stock = parseFloat(v.stock) || 0;
  if (stock <= 0) { toast('已经用完了'); return; }
  var take = Math.min(d, stock);
  var u = v.packUnit || mainPackUnit(item) || '份';

  v.stock = Math.round((stock - take) * 100) / 100;
  // 即时消耗不区分「开封/用完」两态，只保留一个滚动中的批次（用不完就一直累积为一条）
  var rec = null;
  if (item.usageRecords) {
    for (var i = item.usageRecords.length - 1; i >= 0; i--) {
      var r = item.usageRecords[i];
      if (r.variantId === variantId && r.instant) { rec = r; break; }
    }
  }
  if (!item.usageRecords) item.usageRecords = [];
  var nowISO = new Date().toISOString();
  if (rec) {
    rec.qty = Math.round(((rec.qty || 0) + take) * 100) / 100;
    rec.endDate = nowISO;
  } else {
    item.usageRecords.push({
      startDate: nowISO, endDate: nowISO, qty: take,
      variantId: variantId, brand: v.brand, instant: true
    });
  }
  // 扣到 0 才算真正用完 → 折叠
  if (v.stock <= 0) {
    v.usedUp = true;
    v.finishDate = nowISO;
    if (rec) rec.endDate = nowISO;
    syncItemFromVariants(item);
    saveDB();
    openCardDetail(currentZoneId, itemId);
    toast('已用完（今年累计 ' + trimNum(instantUsedQty(item, variantId)) + u + '）');
    return;
  }
  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('打卡 -' + trimNum(take) + u + '，剩 ' + trimNum(v.stock) + u);
}
// 某变体本年的即时消耗量（按记录年份汇总）
function instantUsedQty(item, variantId, year) {
  var y = year || new Date().getFullYear();
  return (item.usageRecords || [])
    .filter(function (r) {
      if (!r.instant) return false;
      if (variantId && r.variantId !== variantId) return false;
      var d = new Date(r.endDate || r.startDate);
      return d.getFullYear() === y;
    })
    .reduce(function (s, r) { return s + (parseFloat(r.qty) || 0); }, 0);
}
// 模型③改数量：点「−」回落 / 点错撤销（不允许低于 0，也不超过购买总量）
function unpunchInstant(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function (x) { return x.id === variantId; });
  if (!v) return;
  if (!item.usageRecords) { toast('没有可撤销的打卡'); return; }
  var rec = null;
  for (var i = item.usageRecords.length - 1; i >= 0; i--) {
    var r = item.usageRecords[i];
    if (r.variantId === variantId && r.instant && (r.qty || 0) > 0) { rec = r; break; }
  }
  if (!rec) { toast('没有可撤销的打卡'); return; }
  var u = v.packUnit || mainPackUnit(item) || '份';
  rec.qty = Math.round(((rec.qty || 0) - 1) * 100) / 100;
  if (rec.qty <= 0) item.usageRecords.splice(item.usageRecords.indexOf(rec), 1);
  v.stock = Math.round(((parseFloat(v.stock) || 0) + 1) * 100) / 100;
  if (v.stock > 0 && v.usedUp) { v.usedUp = false; v.finishDate = null; }
  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已撤销 1' + u + '，剩 ' + trimNum(v.stock) + u);
}

// 即时消耗型：点「消耗一份」时作用在哪个品牌上
// 规则：优先还有库存的品牌；多个都有 → 取第一个（用户可在卡片里切换品牌后单独点）
function instantTargetVariant(item) {
  var vs = (item.variants || []).filter(function (v) { return !v.usedUp && (parseFloat(v.stock) || 0) > 0; });
  if (!vs.length) return (item.variants && item.variants[0]) ? item.variants[0].id : '';
  return vs[0].id;
}

// 直接标记某个变体用完（用于多变体的"用完了"按钮，食品类直接完成）
function finishVariant(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(vv) { return vv.id === variantId; });
  if (!v) return;

  // 多规格：开封那一刻已按「规格×份数」扣过库存，
  // 这里的「用完了」= 手头开的这一批用完 → 只结束本次使用记录，剩余规格照常待开封
  if (variantSpecsOf(v).length) {
    var recF = null;
    if (item.usageRecords) {
      for (var fi = item.usageRecords.length - 1; fi >= 0; fi--) {
        if (item.usageRecords[fi].variantId === variantId && !item.usageRecords[fi].endDate) { recF = item.usageRecords[fi]; break; }
      }
    }
    var nowF = new Date().toISOString();
    if (recF) recF.endDate = nowF;
    v.usedUp = false;
    v.finishDate = null;
    v.opened = false; // 本批结束，剩余库存等下次开封
    var usedC = (recF && recF.contentUsed > 0) ? recF.contentUsed : 0;
    // 整变体已清零（规格全部为 0）→ 真正用完，折叠进「已用完」区
    if (variantSpecContent(v) <= 0) {
      v.usedUp = true;
      v.finishDate = v.finishDate || nowF;
      syncItemFromVariants(item);
      saveDB();
      openCardDetail(currentZoneId, itemId);
      toast('已用完' + (usedC > 0 ? '（≈' + trimNum(usedC) + variantSpecUnit(v) + '）' : ''));
      return;
    }
    var remainC = variantSpecContent(v), remainP = variantSpecPieces(v), spU = variantSpecUnit(v);
    syncItemFromVariants(item);
    saveDB();
    openCardDetail(currentZoneId, itemId);
    toast('本批已记用完' + (usedC > 0 ? '（≈' + trimNum(usedC) + spU + '）' : '') + '，剩 ' + trimNum(remainC) + spU + '（' + trimNum(remainP) + ' 包未开）待开封');
    return;
  }

  // 普通变体：还有剩余库存 → 「用完了」只结束当前开封的这一份，剩余的继续待开封
  // （如 10支装用了7支还剩3支：结束使用记录，但不能把整个品牌折叠进「已用完」）
  if ((v.stock || 0) > 0) {
    var recN = null;
    if (item.usageRecords) {
      for (var ni = item.usageRecords.length - 1; ni >= 0; ni--) {
        if (item.usageRecords[ni].variantId === variantId && !item.usageRecords[ni].endDate) { recN = item.usageRecords[ni]; break; }
      }
    }
    var nowN = new Date().toISOString();
    if (recN) recN.endDate = nowN;
    v.usedUp = false;
    v.finishDate = null;
    v.opened = false; // 本份结束，剩余库存等下次开封
    var uN = v.packUnit || mainPackUnit(item);
    syncItemFromVariants(item);
    saveDB();
    openCardDetail(currentZoneId, itemId);
    toast('本份已记用完，剩 ' + trimNum(v.stock) + uN + ' 待开封');
    return;
  }

  // 库存已为 0 → 真正用完，折叠进「已用完」区
  v.usedUp = true;
  v.finishDate = v.finishDate || new Date().toISOString();

  if (item.usageRecords && item.usageRecords.length > 0) {
    var lastRecord = item.usageRecords[item.usageRecords.length - 1];
    if (lastRecord && !lastRecord.endDate && lastRecord.variantId === variantId) {
      lastRecord.endDate = v.finishDate;
    }
  }

  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已记录用完');
}

// 单品牌物品：标记当前使用中的变体为用完
function finishCurrentVariant(itemId) {
  var item = getItem(currentZoneId, itemId);

  ensureVariants(item);

}

// 多规格品牌的补货明细：按规格录份数；也支持直接按含量补
function renderRestockSpecs(item) {
  var box = document.getElementById('restock-spec-block');
  if (!box) return;
  var sel = document.getElementById('restock-brand');
  var vid = sel ? sel.value : '';
  var v = null;
  item.variants.forEach(function(x) { if (x.id === vid) v = x; });
  var sp = (v && v.specs) ? v.specs : [];
  var qtyRow = document.getElementById('restock-qty-row');
  if (!sp.length || !v) {
    box.style.display = 'none'; box.innerHTML = '';
    if (qtyRow) qtyRow.style.display = 'flex';
    return;
  }
  box.style.display = 'block';
  var h = '<div style="font-size:13px;font-weight:700;margin:4px 0 6px">🧩 补货（按「套」补）</div>';
  h += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">单套构成：' + escapeHtml(variantSpecText(v)) + '<br>当前 套餐数 ' + trimNum(variantPacksBought(v)) + ' 套 · 剩 ' + trimNum(variantPacksLeftCalc(v)) + ' 套</div>';
  h += '<div class="form-row" style="align-items:center;margin-bottom:6px">';
  h += '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">这次补几套？</div>';
  h += '<div style="font-size:11px;color:var(--text-secondary)">补 N 套 = 每种子规格各多 N × 单套包数</div></div>';
  h += '<input type="number" class="form-input" style="width:92px;flex:none" id="restock-spec-sets" value="0" min="0" step="1" oninput="syncRestockSpecQty()">';
  h += '</div>';
  sp.forEach(function (s, k) {
    h += '<div class="form-row" style="align-items:center;margin-bottom:4px">';
    h += '<div style="flex:1;min-width:0;font-size:12px;color:var(--text-secondary)">' + escapeHtml(s.name || ('规格' + (k + 1))) + '（单套 ' + trimNum(specPackCount(s)) + ' 包 × ' + trimNum(specPackQty(s)) + (s.unit || '') + '）</div>';
    h += '</div>';
  });
  h += '<div class="form-row">';
  h += '<div class="form-group" style="flex:1"><label class="form-label">或按含量补（选填）</label><input type="number" class="form-input" id="restock-spec-content" value="" placeholder="如 100" oninput="syncRestockSpecQty()"></div>';
  h += '<div class="form-group" style="width:96px;flex:none"><label class="form-label">单位</label><input type="text" class="form-input" id="restock-spec-unit" value="' + escapeHtml(sp[0].unit || '') + '"></div>';
  h += '</div>';
  box.innerHTML = h;
  window._restockSpecs = sp;
  if (qtyRow) qtyRow.style.display = 'flex'; // 数量行保留（用于算单价），由规格自动回填
}
// 补套数 → 自动回填「补货数量」（含量口径），省得再手算
function syncRestockSpecQty() {
  var sp = window._restockSpecs || [];
  var total = 0, unit = '';
  var setsEl = document.getElementById('restock-spec-sets');
  var sets = setsEl ? (parseFloat(setsEl.value) || 0) : 0;
  if (sets > 0 && sp.length) {
    // 每套含量 = Σ 单套内包数 × 每包含量 × 每份规格
    var perSet = 0;
    sp.forEach(function (s) { perSet += specPackCount(s) * specPackQty(s) * specContentOf(s); });
    total += sets * perSet;
  }
  if (sp.length) unit = sp[0].unit || '';
  var cEl = document.getElementById('restock-spec-content');
  if (cEl) {
    total += (parseFloat(cEl.value) || 0);
    var uEl = document.getElementById('restock-spec-unit');
    if (uEl && uEl.value) unit = uEl.value;
  }
  var qEl = document.getElementById('restock-qty');
  if (qEl && total > 0) qEl.value = Math.round(total * 100) / 100;
  var unEl = document.getElementById('restock-unit');
  if (unEl && unit) unEl.value = unit;
  if (window._restockItemId) {
    var it = getItem(currentZoneId, window._restockItemId);
    if (it) updateRestockCompare(it);
  }
}

function updateRestockCompare(item) {
  var qty = parseFloat(document.getElementById('restock-qty').value) || 0;
  var total = parseFloat(document.getElementById('restock-total').value) || 0;
  var unitPrice = qty > 0 ? total / qty : 0;
  document.getElementById('restock-unit-price').value = unitPrice.toFixed(2);

  var compareDiv = document.getElementById('restock-compare');
  if (unitPrice > 0 && item.priceHistory && item.priceHistory.length > 0) {
    var prices = item.priceHistory.map(function(p) { return p.unitPrice || 0; });
    var minPrice = Math.min.apply(null, prices);
    var lastPrice = prices[prices.length - 1];

    if (unitPrice < minPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-cheaper">🎉 新低！比历史最低 ¥' + minPrice.toFixed(2) + ' 便宜 ¥' + (minPrice - unitPrice).toFixed(2) + '</div>';
    } else if (unitPrice < lastPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-cheaper">✓ 比上次 ¥' + lastPrice.toFixed(2) + ' 便宜</div>';
    } else if (unitPrice > lastPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-expensive">⚠ 比上次 ¥' + lastPrice.toFixed(2) + ' 贵 ¥' + (unitPrice - lastPrice).toFixed(2) + '</div>';
    } else {
      compareDiv.innerHTML = '<div class="price-compare price-same">和上次价格相同</div>';
    }
  }
}

function confirmRestock(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  ensureVariants(item);
  var qty = parseFloat(document.getElementById('restock-qty').value) || 0;
  var total = parseFloat(document.getElementById('restock-total').value) || 0;
  var unitPrice = qty > 0 ? total / qty : 0;
  var channel = document.getElementById('restock-channel').value;
  var date = document.getElementById('restock-date').value;
  var notes = document.getElementById('restock-notes').value;
  var unit = document.getElementById('restock-unit').value;

  if (qty <= 0) { toast('请输入数量'); return; }

  item.unit = unit;
  item.channel = channel;

  // 更新或新增variant
  var brandSelect = document.getElementById('restock-brand').value;
  var variant;
  if (brandSelect === '__new__') {
    var newBrand = document.getElementById('restock-new-brand').value.trim() || ('品牌' + (item.variants.length + 1));
    variant = { id: genId(), brand: newBrand, stock: qty, price: parseFloat(unitPrice.toFixed(2)), totalPrice: parseFloat(total.toFixed(2)), channel: channel, photos: [], opened: false, openDate: null, finishDate: null, usedUp: false, openQty: 0, feeling: null, shelfLife: item.shelfLife, productionDate: null };
    item.variants.push(variant);
  } else {
    variant = item.variants.find(function(v) { return v.id === brandSelect; });
    if (variant) {
      // 多规格品牌：补货 = 又买了 N 套 → 套餐数 +N（构成不变，剩余量随之增加）
      var spR = (variant.specs && variant.specs.length) ? variant.specs : null;
      var addedPieces = 0;
      if (spR) {
        var setsEl = document.getElementById('restock-spec-sets');
        var setsAdd = setsEl ? (parseFloat(setsEl.value) || 0) : 0;
        if (setsAdd > 0) {
          variant.packCount = Math.round((variantPacksBought(variant) + setsAdd) * 100) / 100;
          addedPieces = setsAdd;
        } else {
          // 没填套数 → 按含量补：把含量折算成「套数」加上去（不足一套按一套）
          var cEl0 = document.getElementById('restock-spec-content');
          var c0 = cEl0 ? (parseFloat(cEl0.value) || 0) : 0;
          if (c0 <= 0) c0 = qty;
          var perSet0 = variantSpecPerSet(variant);
          if (perSet0 > 0 && c0 > 0) {
            var setsFromContent = Math.ceil(c0 / perSet0 - 1e-9);
            variant.packCount = Math.round((variantPacksBought(variant) + setsFromContent) * 100) / 100;
            addedPieces = setsFromContent;
          }
        }
        variant.stock = variantSpecContent(variant);
        // 套餐数是「购买记录」，补货累加到套餐数上；构成（specs）不动
        if (!variant.specsFolded) variant.specsFolded = true;
        variant.packUnit = (spR[0].unit || variant.packUnit);
        variant.usedUp = false;   // 又补上了 → 不再是「用完」状态
        variant.finishDate = null;
      } else {
        variant.stock = (variant.stock || 0) + qty;
      }
      variant.price = parseFloat(unitPrice.toFixed(2));
      variant.totalPrice = parseFloat((variant.price * (variant.stock || 0)).toFixed(2));
      variant.channel = channel;
    }
  }

  // 价格历史
  if (!item.priceHistory) item.priceHistory = [];
  item.priceHistory.push({
    date: new Date(date).toISOString(),
    channel: channel,
    quantity: qty,
    totalPrice: total,
    unitPrice: parseFloat(unitPrice.toFixed(1)),
    notes: notes,
    brand: variant ? variant.brand : '',
    attachments: restockPhotos.slice()
  });

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  restockPhotos = [];
  toast('补货成功 +' + qty + ' (' + (variant ? variant.brand : '') + ')');
  renderZone();
}

function renderConsumableVariantRows() {
  var html = '';
  var variants = window._editVariants || [];
  variants.forEach(function(v, i) {
    var specsOpen = (window._specsOpen && window._specsOpen[i] !== undefined) ? window._specsOpen[i] : ((v.specs || []).length > 0);
    html += '<div class="consumable-variant-row" style="border:1px solid var(--separator);border-radius:12px;padding:12px;margin-bottom:12px">';
    // 小格标签（输入框上方的小字，标明这格填什么）
    function vCell(lab, inner, style) {
      return '<div class="vcell" style="' + style + '"><div class="vlab">' + lab + '</div>' + inner + '</div>';
    }
    // ===== 行1：名称 + 🧩规格 + ❌不再买 + 🗑删品牌（同一行搞定） =====
    html += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">';
    html += '<input type="text" class="form-input" style="flex:1;min-width:0;font-size:14px;font-weight:600;height:42px" placeholder="品牌名称" value="' + escapeHtml(v.brand) + '" onchange="updateConsumableVariantField(' + i + ',\'brand\',this.value)">';
    // 🧩：展开/收起「规格明细」（组合消耗型按子规格记录用；普通品牌不用管）
    html += '<button type="button" class="vside-btn h' + (specsOpen ? ' on spec' : '') + '" onclick="toggleVariantSpecsOpen(' + i + ')">🧩<small>规格' + ((v.specs || []).length ? ' ' + v.specs.length : '') + '</small></button>';
    // ❌：这个品牌用完就不再买了（= noRestock，不再计入补货提醒）
    html += '<button type="button" class="vside-btn h' + (v.noRestock ? ' on' : '') + '" onclick="toggleVariantNoRestock(' + i + ')">❌<small>不再买</small></button>';
    if (variants.length > 1) {
      html += '<button type="button" class="vside-btn h" title="删除这个品牌" onclick="removeConsumableVariantRow(' + i + ')">🗑<small>删除</small></button>';
    }
    html += '</div>';
    // 字段映射：packCount=套餐数、packPrice=单价、totalPrice=总价、
    // packQty=规格(套餐内包数)、packQtyUnit=规格单位(瓶/包/个)、packWeight=容量(单包规格)、packWeightUnit=容量单位(ml/g)
    var cPack = v.packCount || 0;
    var cPackPrice = v.packPrice || 0;
    var cPackQty = v.packQty || '';
    var cQtyUnit = packQtyUnitOf(v);
    var cWeight = v.packWeight || '';
    var cWeightUnit = v.packWeightUnit || '';
    var cTotal = v.totalPrice || (cPackPrice * cPack);
    // 行2：套餐数（小框，1-2 位数）+ 单价 / 总价（大框，六位数；填一个另一个自动算，保留两位小数）

function renderDurableVariantRows() {
  var html = '';
  var variants = window._editVariants || [];
  var photos = window._editVariantPhotos || [];
  variants.forEach(function(v, i) {
    html += '<div class="durable-variant-row" style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">';
    html += '<div style="display:flex;gap:8px;align-items:flex-start">';
    // 照片上传区
    html += '<div class="durable-photo-slot" onclick="uploadDurableVariantPhoto(' + i + ')" style="width:56px;height:56px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;cursor:pointer;position:relative">';
    if (photos[i] && photos[i].length > 0) {
      html += '<img src="' + photos[i][0] + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px">';
      html += '<div style="position:absolute;bottom:0;right:0;background:rgba(0,0,0,0.6);color:#fff;font-size:10px;padding:1px 4px;border-radius:4px 0 8px 0">' + (photos[i].length > 1 ? '+' + photos[i].length : '') + '</div>';
    } else {
      html += '<span style="font-size:20px;color:var(--text-tertiary)">📷</span>';
    }
    html += '</div>';
    // 描述 + 单价/件数/总价(联动) + 备注
    html += '<div style="flex:1;display:flex;flex-direction:column;gap:4px">';
    html += '<input type="text" class="form-input" style="font-size:14px" placeholder="描述（如：白色圆领 / 女隐形袜·黑色）" value="' + escapeHtml(v.brand) + '" onchange="updateDurableVariantField(' + i + ',\'brand\',this.value)">';
    // 单价 / 件数 / 总价 三联动
    var vUnit = v.price || 0;
    var vQty = v.stock || 1;
    var vTotal = v.totalPrice || (vUnit * vQty);
    html += '<div style="display:flex;gap:6px;align-items:center">';
    html += '<input type="number" class="form-input" style="font-size:13px;flex:1" placeholder="单价" value="' + (vUnit||'') + '" oninput="onDurablePriceInput(' + i + ',\'unit\',this.value)">';
    html += '<span style="font-size:12px;color:var(--text-tertiary)">×</span>';
    html += '<input type="number" class="form-input" style="font-size:13px;width:56px;flex-shrink:0" placeholder="件" min="1" step="1" value="' + vQty + '" oninput="onDurablePriceInput(' + i + ',\'qty\',this.value)">';
    html += '<span style="font-size:12px;color:var(--text-tertiary)">=</span>';
    html += '<input type="number" class="form-input" style="font-size:13px;flex:1" placeholder="总价" value="' + (vTotal||'') + '" oninput="onDurablePriceInput(' + i + ',\'total\',this.value)">';
    html += '</div>';
    html += '<input type="text" class="form-input" style="font-size:13px;color:var(--text-secondary)" placeholder="备注（如：真丝/手洗/25.3购）" value="' + escapeHtml(v.notes||'') + '" onchange="updateDurableVariantField(' + i + ',\'notes\',this.value)">';
    html += '</div>';
    // 删除按钮
    html += '<button class="btn btn-danger btn-sm" style="flex-shrink:0;padding:6px 8px;font-size:12px" onclick="removeDurableVariantRow(' + i + ')">✕</button>';
    html += '</div>';
    // 已有照片缩略图列表
    if (photos[i] && photos[i].length > 0) {
      html += '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">';
      photos[i].forEach(function(p, pi) {
        html += '<div style="position:relative;width:40px;height:40px">';
        html += '<img src="' + p + '" style="width:40px;height:40px;border-radius:6px;object-fit:cover">';
        html += '<button onclick="removeDurableVariantPhoto(' + i + ',' + pi + ')" style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:10px;line-height:16px;cursor:pointer">✕</button>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  return html;
}
function updateDurableVariantField(idx, field, val) {
  if (window._editVariants && window._editVariants[idx]) {
    window._editVariants[idx][field] = val;
  }
}
// 单价 × 件数 = 总价 三联动（实时计算，不重渲染整个列表避免输入焦点丢失）
function onDurablePriceInput(idx, which, val) {
  var v = window._editVariants && window._editVariants[idx];
  if (!v) return;
  var row = document.querySelectorAll('.durable-variant-row')[idx];
  if (!row) return;
  var inputs = row.querySelectorAll('input[type=number]');
  // inputs[0]=单价 [1]=件数 [2]=总价
  var unitEl = inputs[0], qtyEl = inputs[1], totalEl = inputs[2];
  if (which === 'unit') {
    var u = parseFloat(val) || 0;
    v.price = u;
    var q = v.stock || 1;
    v.totalPrice = +(u * q).toFixed(2);
    if (totalEl) totalEl.value = v.totalPrice || '';
  } else if (which === 'qty') {
    var q2 = Math.max(1, parseInt(val) || 1);
    v.stock = q2;
    var u2 = v.price || 0;
    v.totalPrice = +(u2 * q2).toFixed(2);
    if (totalEl) totalEl.value = v.totalPrice || '';
  } else if (which === 'total') {
    var t = parseFloat(val) || 0;
    v.totalPrice = t;
    var q3 = v.stock || 1;
    v.price = q3 > 0 ? +(t / q3).toFixed(2) : 0;
    if (unitEl) unitEl.value = v.price || '';
  }
}
function addDurableVariantRow() {
  window._editVariants = window._editVariants || [];
  window._editVariantPhotos = window._editVariantPhotos || [];
  window._editVariants.push({ id: genId(), brand: '', photos: [], price: 0, notes: '', stock: 1, totalPrice: 0 });
  window._editVariantPhotos.push([]);
  document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
}
function removeDurableVariantRow(idx) {
  if (window._editVariants.length <= 1) {
    toast('至少保留一件');
    return;
  }
  window._editVariants.splice(idx, 1);
  window._editVariantPhotos.splice(idx, 1);
  document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
}
function uploadDurableVariantPhoto(idx) {
  var input = document.getElementById('photo-input');
  input.onchange = function(e) {
    var files = e.target.files;
    var count = 0;
    var maxPhotos = 5;
    var currentPhotos = window._editVariantPhotos[idx] || [];
    var remaining = maxPhotos - currentPhotos.length;
    var toProcess = Math.min(files.length, remaining);
    
    function processNext(fileIdx) {
      if (fileIdx >= toProcess) {
        input.value = '';
        document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
        if (count === 0) toast('每件最多' + maxPhotos + '张照片');
        return;
      }
      compressImage(files[fileIdx], function(dataUrl) {
        window._editVariantPhotos[idx].push(dataUrl);
        count++;
        processNext(fileIdx + 1);
      });
    }
    processNext(0);
  };
  input.click();
}
function removeDurableVariantPhoto(variantIdx, photoIdx) {
  if (window._editVariantPhotos && window._editVariantPhotos[variantIdx]) {
    window._editVariantPhotos[variantIdx].splice(photoIdx, 1);
    document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
  }
}

function saveItem() {
  var zone = getZone(currentZoneId);
  var name = document.getElementById('item-name').value.trim();
  if (!name) { toast('请输入名称'); return; }

  // 分类：选了子分类用子分类，否则用大类
  var finalCategoryId = document.getElementById('item-category').value;
  var subSel = document.getElementById('item-subcategory');
  if (subSel && subSel.value) finalCategoryId = subSel.value;

  var data = {
    name: name,
    categoryId: finalCategoryId,
    // 存放位置字段已并入备注；编辑旧物品时保留原 location 值，不丢数据
    location: (function () {
      var el = document.getElementById('item-location');
      if (el) return el.value;
      var oldIt = editingItemId ? getItem(currentZoneId, editingItemId) : null;
      return oldIt ? (oldIt.location || '') : '';
    })(),
    notes: (function() { var el = document.getElementById('item-notes'); return el ? el.value : ''; })(),
    photos: itemPhotos.slice()
  };

  if (zone.type === 'consumable') {
    // 从品牌变体编辑器读取
    var editVariants = window._editVariants || [];
    // 旧变体快照：用于把「已开包数」从旧数据带过来（按名称+单位匹配）
    var _oldItem = editingItemId ? getItem(currentZoneId, editingItemId) : null;
    var oldVariantsForLeft = (_oldItem && _oldItem.variants) ? _oldItem.variants : [];
    data.variants = editVariants.map(function(ev, i) {
      // 留空 = 1，填 0 = 0：所有数量类字段统一按此语义归一
      function normQty(x) { var s = String(x == null ? '' : x).trim(); if (s === '') return 1; return parseFloat(s) || 0; }
      var evStock = parseFloat(ev.stock) || 0;
      var evPrice = parseFloat(ev.price) || 0;
      // 以编辑行数据为基础（保留 packWeightUnit / noRestock / notes 等扩展字段，避免保存时丢失），
      // 再覆盖本表单实际管理的字段
      var nv = {};
      Object.keys(ev).forEach(function(k) { nv[k] = ev[k]; });
      nv.id = ev.id;
      nv.brand = ev.brand || '未命名';
      nv.stock = evStock;
      nv.price = evPrice;
      nv.totalPrice = ev.totalPrice || +(evPrice * evStock).toFixed(2);
      nv.channel = '';
      nv.photos = []; // 补给品不再使用照片（只在耐用品保留）；保存时清掉存量旧图，卡片更精简
      nv.opened = false; nv.openDate = null; nv.finishDate = null;
      nv.usedUp = false; nv.openQty = 0; nv.feeling = null; nv.shelfLife = null; nv.productionDate = null;
      nv.packCount = normQty(ev.packCount);
      nv.packPrice = (typeof ev.packPrice !== 'undefined' ? ev.packPrice : (ev.totalPrice || 0));
      nv.packQty = normQty(ev.packQty);
      nv.packQtyUnit = String(ev.packQtyUnit || '').trim();   // 件数单位（瓶/包/个…）
      nv.packUnit = (ev.packUnit && !isContentUnitText(ev.packUnit)) ? ev.packUnit : nv.packQtyUnit; // 旧字段兼容；含量单位一律不收
      nv.packWeight = normQty(ev.packWeight);
      // 混合规格（本品牌可选）：specs = 「一套里装了什么」（单套构成），永不被套餐数折算写回
      // 库存 = Σ 各规格(套餐数 × 单套包数 − 已开包数) × 每包含量 × 每份规格；消耗记在 specs[i].openPacks
      // 规格两层结构：packCount(单套内包数) × packQty(每包含量) × content(每份规格)；留空 = 1，填 0 = 0
      nv.specs = (ev.specs || []).map(function (s) {
        var spc_ = (s.packCount !== undefined && s.packCount !== null && s.packCount !== '') ? (parseFloat(s.packCount) || 0) : ((+s.qty || 0) > 0 ? +s.qty : 1);
        var spq_ = (s.packQty !== undefined && s.packQty !== null && s.packQty !== '') ? (parseFloat(s.packQty) || 0) : 1;
        var sct_ = (s.content !== undefined && s.content !== null && s.content !== '') ? (+s.content || 0) : 1;
        return { name: (s.name || '').trim(), packCount: spc_, packQty: spq_, content: sct_, unit: (s.unit || '').trim(), qty: Math.round(spc_ * spq_ * 100) / 100, openPacks: specOpenPacks(s) };
      }).filter(function (s) { return +s.packCount > 0; });
      if (nv.specs.length) {
        // ① 套餐数：用户填多少就存多少（留空 = 1）；不做任何折算写回（消灭「横跳」）
        var packsN = variantPacksBought(nv);
        nv.packCount = packsN;
        // ② 明细归一：补齐 content=1、同步 qty；已开包数由表单原样带回（openPacks）
        var oldV = null;
        (oldVariantsForLeft || []).forEach(function (x) { if (x && x.id === nv.id) oldV = x; });
        var oldSpecs = (oldV && oldV.specs) ? oldV.specs : [];
        nv.specs.forEach(function (s, si) {
          if (!(+s.content > 0)) s.content = 1;
          // 已开包数：优先用表单带回的值；为 0 时按「名称+单位」从旧数据补（防止表单未初始化）
          var keep = specOpenPacks(s);
          if (!(keep > 0)) {
            oldSpecs.forEach(function (os) {
              if (keep > 0) return;
              var sameName = String(os.name || '').trim() === String(s.name || '').trim();
              var sameUnit = String(os.unit || '').trim() === String(s.unit || '').trim();
              if (sameName && sameUnit) keep = specOpenPacks(os);
            });
          }
          if (!(keep > 0) && oldSpecs[si]) keep = specOpenPacks(oldSpecs[si]);
          // 已开包数不能超过「套餐数 × 单套包数」
          var maxOpen = packsN * specPackCount(s);
          s.openPacks = Math.round(Math.min(keep, maxOpen) * 100) / 100;
          s.qty = Math.round(specPackCount(s) * specPackQty(s) * 100) / 100; // 兼容字段：单套内包数 × 每包含量
        });
        // ③ 库存 = Σ 各规格剩余包数 × 每包含量 × 每份规格
        nv.stock = variantSpecStockCalc(nv);
        // ④ 父级规格行已被明细接管：不再从明细反写 packQty（避免「套数 × 每套含」的旧矛盾）
        nv.specsFolded = true;
        nv.packsLeft = undefined;   // 计数改由 specs[i].openPacks 承载        nv.packUnit = nv.specs[0].unit || nv.packUnit;
        nv.packWeight = 1;
        nv.packWeightUnit = nv.specs[0].unit || nv.packWeightUnit;
        // ⑤ 重启消费状态：库存还有 → 不是「用完」；仍有未结束的开封记录 → 保持「使用中」
        if (nv.stock > 0) {
          nv.usedUp = false; nv.finishDate = null;
          nv.opened = !!(_oldItem && (_oldItem.usageRecords || []).some(function (r) { return r.variantId === nv.id && !r.endDate; }));
          nv.openDate = nv.opened ? ((oldV && oldV.openDate) || new Date().toISOString()) : null;
        }
      } else {
        nv.specs = [];
      }
      return nv;
    });
    // 合并变体照片，用于卡片展示
    var variantPhotos = [];
    data.variants.forEach(function(v) { variantPhotos = variantPhotos.concat(v.photos); });
    var seenP = {};
    var allP = [];
    variantPhotos.forEach(function(p) { if (p && !seenP[p]) { seenP[p] = true; allP.push(p); } });
    data.photos = allP;
    data.stock = data.variants.reduce(function(s,v) { return s + (v.stock||0); }, 0);
    // 补给品总金额 = 各品牌总价之和
    data.currentPrice = data.variants.reduce(function(s,v){ return s + (v.totalPrice || ((v.price||0)*(v.stock||0))); }, 0);
    data.stockThreshold = parseFloat(document.getElementById('item-threshold').value) || 1;
    var cmEl = document.getElementById('item-consumemode');
    data.consumeMode = (cmEl && CONSUME_MODELS[cmEl.value]) ? cmEl.value : 'spec';
    data.oneShot = (data.consumeMode === 'instant'); // 即时消耗 = 旧 oneShot 语义，保持字段兼容
  } else {
    // 耐用品：从件数编辑器读取
    var dEditVariants = window._editVariants || [];
    var dEditPhotos = window._editVariantPhotos || [];
    data.variants = dEditVariants.map(function(ev, i) {
      return {
        id: ev.id,
        brand: ev.brand || ('第' + (i+1) + '件'),
        stock: Math.max(1, parseInt(ev.stock) || 1),
        price: ev.price || 0,
        totalPrice: ev.totalPrice || ((ev.price || 0) * (Math.max(1, parseInt(ev.stock) || 1))),
        channel: '',
        photos: (dEditPhotos[i] || []).slice(),
        notes: ev.notes || '',
        opened: false, openDate: null, finishDate: null,
        usedUp: false, openQty: 0, feeling: null,
        shelfLife: null, productionDate: null
      };
    });
    data.stock = data.variants.reduce(function(s,v){ return s + (v.stock||1); }, 0);
    data.unit = '件';
    // 耐用品总金额 = 各款总价之和
    data.currentPrice = data.variants.reduce(function(s,v){ return s + (v.totalPrice || ((v.price||0)*(v.stock||1))); }, 0);
    data.channel = '';
  }

  if (editingItemId) {
    var item = getItem(currentZoneId, editingItemId);
    if (zone.type === 'consumable') {
      // 补给品：保留已有的variant使用数据
      var oldVariants = item.variants || [];
      var newVariants = data.variants;
      newVariants.forEach(function(nv) {
        var old = oldVariants.find(function(ov) { return ov.id === nv.id; });
        if (old) {
          nv.opened = old.opened;
          nv.usedUp = old.usedUp;
          nv.openDate = old.openDate;
          nv.finishDate = old.finishDate;
          nv.openQty = old.openQty;
          nv.feeling = old.feeling;
          nv.shelfLife = old.shelfLife;
          nv.productionDate = old.productionDate;
          // 照片以编辑表单为准（表单里有完整的缩略图 + 删除按钮）：
          // 不再从旧数据「复活」照片——否则用户删光照片保存后又被拷回来（曾误报「照片写死了」）
        }
      });
    } else {
      // 耐用品：保留已有的variant使用感受和备注
      var oldDVariants = item.variants || [];
      data.variants.forEach(function(nv) {
        var old = oldDVariants.find(function(ov) { return ov.id === nv.id; });
        if (old) {
          nv.feeling = old.feeling;
          if (!nv.notes && old.notes) nv.notes = old.notes;
          if (!nv.totalPrice && old.totalPrice) nv.totalPrice = old.totalPrice;
        }
      });
    }
    // 耐用品编辑表单已无整物品备注输入框，保留旧值不被空覆盖
    if (zone.type !== 'consumable' && !data.notes && item.notes) data.notes = item.notes;
    Object.assign(item, data);
    if (zone.type === 'consumable') syncItemFromVariants(item);
    else syncDurableFromVariants(item);
  } else {
    data.id = genId();
    data.usageRecords = [];
    data.priceHistory = [];
    data.createdAt = new Date().toISOString();
    zone.items.push(data);
  }

  saveDB();
  closeModal();
  renderZone();
  toast(editingItemId ? '已保存' : '已添加');
}

// 删除：会连同使用记录一起消失，所以先说清楚，并给「归档」这个更稳的出路
function deleteItem(itemId) {
  var item = findItemByIdGlobal(itemId);
  var recCnt = (item && item.usageRecords) ? item.usageRecords.length : 0;
  var msg = '确定永久删除？此操作不可撤销。';
  if (item) {
    msg = '确定永久删除「' + item.name + '」？\n\n⚠️ 它的 ' + recCnt + ' 条使用记录、价格历史、使用感受会一起消失，且无法找回。\n\n如果只是「用完不再买」，建议改用 📦 归档：不再提醒补货，数据全部保留，随时可恢复。\n\n仍要永久删除吗？';
  }
  if (!confirm(msg)) return;
  var zone = getZone(currentZoneId);
  zone.items = zone.items.filter(function(it) { return it.id !== itemId; });
  saveDB();
  closeModal();
  closeCardDetail();
  renderZone();
  if (document.getElementById('home-content')) renderHome();
  toast('已永久删除');
}

// ========== 年度档案：把明细压缩成一句「这一年的使用效率」==========
// 固化后，用完的品牌/物品就可以放心删掉，结论不会丢
function buildYearStats(year) {
  if (!DB.yearStats) DB.yearStats = {};
  var items = [];
  var totalSpend = 0;
  DB.zones.forEach(function(z) {
    (z.items || []).forEach(function(it) {
      var yq = 0, times = 0, daySum = 0, dayCnt = 0, spend = 0;
      var brandMap = {};
      // 消耗量：使用记录落在这一年的
      (it.usageRecords || []).forEach(function(r) {
        var d = r.endDate || r.startDate || r.date;
        if (!d) return;
        if (new Date(d).getFullYear() !== year) return;
        yq += (r.qty || 1);
        times += 1;
        if (r.startDate && r.endDate) {
          var dd = daysBetween(new Date(r.startDate), new Date(r.endDate));
          if (dd >= 0) { daySum += dd; dayCnt += 1; }
        }
        var bn = r.brand || '未命名';
        if (!brandMap[bn]) brandMap[bn] = { name: bn, spend: 0, restock: null };
      });
      // 花费：价格历史落在这一年的（按品牌归集）
      (it.priceHistory || []).forEach(function(p) {
        if (!p.date || new Date(p.date).getFullYear() !== year) return;
        spend += (p.totalPrice || 0);
        var bn2 = p.brand || '未命名';
        if (!brandMap[bn2]) brandMap[bn2] = { name: bn2, spend: 0, restock: null };
        brandMap[bn2].spend += (p.totalPrice || 0);
      });
      // 品牌评分 / 是否回购（从变体取当前结论）
      (it.variants || []).forEach(function(v) {
        var bn3 = v.brand || '未命名';
        if (!brandMap[bn3]) brandMap[bn3] = { name: bn3, spend: 0, restock: null };
        var b = brandMap[bn3];
        b.rating = (v.feeling && v.feeling.rating) || 0;
        b.tags = (v.feeling && v.feeling.tags) ? v.feeling.tags.slice() : [];
        if (v.noRestock) b.restock = false; else if (v.usedUp) b.restock = true;
      });
      // 没有价格历史（很多物品只在变体上记了单价）→ 按当前单价估算花费，标注「约」
      var estimated = false;
      if (spend <= 0 && yq > 0) {
        var perUnit = 0;
        if (it.variants && it.variants.length) {
          perUnit = it.variants.reduce(function(s, v) { return s + (v.packPrice || v.price || 0); }, 0) / it.variants.length;
        } else {
          perUnit = it.price || 0;
        }
        spend = Math.round(perUnit * yq * 100) / 100;
        estimated = true;
      }
      if (yq <= 0 && spend <= 0) return; // 这一年没有任何动静，不进档案
      // 年报表展示口径：记录里的 qty 是「用户开/用的件·份数」（步进器选的数），
      // 不是「套」——套只是展示层的折算说法。所以主口径一律用件/份/片，
      // 有含量（每个多重/多少）时再补一个含量口径。
      var model = consumeModelOf(it);
      var capUnit = mainPackUnit(it);
      var unitName = it.unit || capUnit || '个';
      var mainQty = Math.round(yq * 10) / 10;
      var capQty = 0, showCapUnit = capUnit;
      if (model === 'combo') {
        unitName = (it.variants && it.variants[0] ? variantSpecUnit(it.variants[0]) : '') || it.unit || '件';
        capQty = 0;                     // combo 的 qty 已是片/件，不再折算
      } else {
        // 周期型：qty = 开了几件/几份；用「每件含量」补一个含量口径（如 3件 → ≈27kg）
        var wAvg = 0, wAvgUnit = '';
        (it.variants || []).forEach(function (v) {
          var w = parseFloat(v.packWeight) || 0;
          if (w > 0) { wAvg = w; wAvgUnit = weightUnitOf(v); }
        });
        if (wAvg > 0) {
          // 若这一年的记录带 contentUsed（规格开封时算过含量），优先用它
          var contentSum = 0, hasContent = false;
          (it.usageRecords || []).forEach(function (r) {
            var d = r.endDate || r.startDate || r.date;
            if (!d || new Date(d).getFullYear() !== year) return;
            if (r.contentUsed > 0) { contentSum += r.contentUsed; hasContent = true; }
          });
          capQty = hasContent ? round1(contentSum) : round1(yq * wAvg);
          showCapUnit = wAvgUnit;
        }
      }
      var brands = Object.keys(brandMap).map(function(k) { return brandMap[k]; });
      totalSpend += spend;
      // 速率四要素也一并固化：物品删除后年报仍能展示它的「用得多快 / 建议买多少」
      // （固化时物品还在，statsOf/buyAdviceOf 可正常计算；此后这份数据不再变化）
      var stY = statsOf(it);
      var advY = buyAdviceOf(it);
      items.push({
        itemId: it.id,
        zoneId: z.id, zoneName: z.name, zoneIcon: z.icon || '📦',
        categoryPath: getCategoryPath(z.id, it.categoryId) || '未分类',
        name: it.name, unit: unitName,
        qty: mainQty,
        capQty: capQty,
        capUnit: showCapUnit,
        spend: Math.round(spend * 100) / 100,
        unitPrice: yq > 0 ? Math.round((spend / yq) * 100) / 100 : 0,
        times: times,
        avgDays: dayCnt > 0 ? Math.round(daySum / dayCnt) : 0,
        estimated: estimated,
        rateText: rateSentenceOf(it, stY),
        restText: restSentenceOf(it, stY),
        leftText: monthsLeftSentenceOf(stY),
        adviceText: advY ? String(advY.main || '').replace(/<[^>]+>/g, '') : '',
        brands: brands
      });
    });
  });
  items.sort(function(a, b) { return b.spend - a.spend; });
  DB.yearStats[String(year)] = {
    generatedAt: new Date().toISOString(),
    itemCount: items.length,
    totalSpend: Math.round(totalSpend * 100) / 100,
    items: items
  };
  saveDB();
  return DB.yearStats[String(year)];
}

function yearStatsYears() {
  var ys = Object.keys(DB.yearStats || {});
  var cur = String(new Date().getFullYear());
  if (ys.indexOf(cur) < 0) ys.push(cur);
  ys.sort(function(a, b) { return Number(b) - Number(a); });
  return ys;
}

  st.items.forEach(function(e) {

    html += '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">';
    html += '<div style="min-width:0"><strong>' + escapeHtml(e.name) + '</strong>';
    html += '<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">' + e.zoneIcon + ' ' + escapeHtml(e.zoneName) + ' · ' + escapeHtml(e.categoryPath) + '</div></div>';
    html += '<div style="text-align:right;flex-shrink:0"><div style="font-weight:700">' + (e.estimated ? '约 ' : '') + '¥' + e.spend.toFixed(2) + '</div>';
    html += '<div style="font-size:11px;color:var(--text-secondary)">用了 ' + e.qty + e.unit + (e.capQty > 0 ? '（≈' + e.capQty + escapeHtml(e.capUnit) + '）' : '') + '</div></div>';
    html += '</div>';
    var meta = [];
    if (e.unitPrice > 0) meta.push('均价 ¥' + e.unitPrice.toFixed(2) + '/' + e.unit);
    if (e.times > 0) meta.push(e.times + ' 次');
    if (e.avgDays > 0) meta.push('平均 ' + e.avgDays + ' 天用掉一' + e.unit);
    if (meta.length) html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:6px">' + meta.join(' · ') + '</div>';
    if (e.brands && e.brands.length) {
      html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:6px;line-height:1.7">';
      e.brands.forEach(function(b) {

        var flag = b.restock === false ? '🚫不回购' : (b.restock === true ? '✅回购' : '');
        html += '<div>· ' + escapeHtml(b.name) + (stars ? ' ' + stars : '') + (flag ? ' ' + flag : '') + (b.spend > 0 ? ' · ¥' + b.spend.toFixed(2) : '') + '</div>';

function generateYearStatsAndOpen(year) {
  var st = buildYearStats(Number(year));
  toast(year + ' 年档案已生成 · ' + st.itemCount + ' 件物品 · ¥' + st.totalSpend.toFixed(2));
  openYearReview(year);
}

// 清理：删掉已用完 / 不再买的品牌卡片（含照片与使用记录），年度档案已固化结论
function cleanupFinishedVariants(year) {
  year = year || String(new Date().getFullYear());
  if (!(DB.yearStats && DB.yearStats[String(year)])) {
    if (!confirm('还没有 ' + year + ' 年度档案。\n\n建议先生成档案，把这一年的消耗/花费固化下来，再清理。\n\n现在生成并继续？')) return;
    buildYearStats(Number(year));
  }
  var vCnt = 0, itemCnt = 0, photoCnt = 0;
  var plan = [];
  DB.zones.forEach(function(z) {
    (z.items || []).forEach(function(it) {
      if (!it.variants || !it.variants.length) return;
      var keep = it.variants.filter(function(v) { return !(isVariantDone(v, it) || v.noRestock); });
      var drop = it.variants.filter(function(v) { return isVariantDone(v, it) || v.noRestock; });
      if (drop.length === 0) return;
      drop.forEach(function(v) { photoCnt += ((v.photos || []).length); });
      vCnt += drop.length;
      if (keep.length === 0) itemCnt += 1;
      plan.push({ zone: z, item: it, keep: keep, dropAll: keep.length === 0 });
    });
  });
  if (vCnt === 0) {
    toast('没有用完 / 不再买的品牌可清理');
    return;
  }
  var msg = '将清理 ' + vCnt + ' 个品牌卡片';
  if (itemCnt > 0) msg += '（其中 ' + itemCnt + ' 个物品的品牌会全部清空，物品本身一并移除）';
  msg += '，含约 ' + photoCnt + ' 张照片。\n\n' + year + ' 年度档案已保存消耗量/花费/品牌评价，删了也留着结论。\n\n确定清理？此操作不可撤销。';
  if (!confirm(msg)) return;
  plan.forEach(function(p) {
    if (p.dropAll) {
      p.zone.items = p.zone.items.filter(function(x) { return x.id !== p.item.id; });
    } else {
      p.item.variants = p.keep;
      syncItemFromVariants(p.item);
    }
  });
  saveDB();
  closeModal();
  renderZone();
  if (document.getElementById('home-content')) renderHome();
  toast('🧹 已清理 ' + vCnt + ' 个品牌 · 年度档案保留');
}

// 详情页：展开/收起「已用完 / 不再买」的品牌卡片的品牌卡片
function toggleDoneVariants(itemId) {
  if (!window._showDoneVariants) window._showDoneVariants = {};
  window._showDoneVariants[itemId] = !window._showDoneVariants[itemId];
  if (currentDetailItem && currentDetailItem.id === itemId) renderCardBack(currentDetailItem, currentDetailZone);

// 详情页「⋯」菜单：编辑 / 归档 / 删除（不占顶部空间）

  } else {
    html += '<button class="btn btn-outline btn-full" style="margin-bottom:10px" onclick="archiveItem(\'' + itemId + '\')">📦 归档整个物品（整个都不再买时用）</button>';
  }
  html += '<button class="btn btn-danger btn-full" style="margin-bottom:10px" onclick="deleteItem(\'' + itemId + '\')">🗑 永久删除（' + recCnt + '条使用记录会一起删）</button>';
  html += '<button class="btn btn-ghost btn-full" onclick="closeModal()">取消</button>';
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

// 归档：不再提醒/不再出现在列表，但使用记录等历史数据全部保留
function archiveItem(itemId) {
  var item = findItemByIdGlobal(itemId);
  if (!item) return;
  var recCnt = (item.usageRecords && item.usageRecords.length) || 0;
  var msg = '归档「' + item.name + '」？\n\n归档后：不再出现在首页提醒和分类列表，也不再催你补货。\n\n' + recCnt + ' 条使用记录、价格、使用感受全部保留，随时可一键恢复。';
  if (!confirm(msg)) return;
  item.archived = true;
  item.archivedAt = new Date().toISOString();
  saveDB();
  closeModal();
  closeCardDetail();
  renderZone();
  if (document.getElementById('home-content')) renderHome();
  toast('📦 已归档 · 数据都留着');
}

function unarchiveItem(itemId) {
  var item = findItemByIdGlobal(itemId);
  if (!item) return;
  item.archived = false;
  delete item.archivedAt;
  saveDB();
  closeModal();
  closeCardDetail();
  renderZone();
  if (document.getElementById('home-content')) renderHome();
  toast('↩️ 已恢复');
}

// 归档箱：列出全部已归档物品，可恢复或彻底删除
function showArchivedBox() {

  html += '<div class="modal-title">📦 归档箱</div>';

    archivedItemsOf(z).forEach(function(it) { rows.push({item: it, zone: z}); });

    html += '<button class="btn btn-ghost btn-full" style="margin-top:12px" onclick="closeModal()">关闭</button>';

    html += '</div>';
    html += '</div>';
  });
  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">关闭</button>';
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');

function deleteItemFromArchive(zoneId, itemId) {
  var zone = getZone(zoneId);
  if (!zone) return;
  var item = zone.items.find(function(it) { return it.id === itemId; });

  zone.items = zone.items.filter(function(it) { return it.id !== itemId; });
  saveDB();
  closeModal();
  renderZone();
  if (document.getElementById('home-content')) renderHome();

}

  html += '<div class="form-group"><label class="form-label">评分</label>';
  html += '<div class="stars" id="feeling-stars" style="justify-content:center">';
  for (var i = 1; i <= 5; i++) {
    html += '<span class="star ' + (i<=f.rating?'filled':'') + '" onclick="setRating(' + i + ')">★</span>';
  }

  });
  html += '</div></div>';

  html += '<div class="form-group"><label class="form-label">心得（选填）</label>';
  html += '<textarea class="form-textarea" id="feeling-notes" placeholder="一句话记录感受...">' + escapeHtml(f.notes) + '</textarea></div>';

function setRating(n) {
  window._feelingRating = n;
  var stars = document.querySelectorAll('#feeling-stars .star');
  stars.forEach(function(s, i) { s.classList.toggle('filled', i < n); });

function toggleTag(el, tag) {
  var idx = window._feelingTags.indexOf(tag);
  if (idx >= 0) { window._feelingTags.splice(idx, 1); el.classList.remove('selected'); }

// 撤销单品牌/顶层用完状态
function undoFinish(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  ensureVariants(item);
  // 找到最近一个已用完的变体，恢复为使用中
  var lastFinished = null;
  for (var i = item.variants.length - 1; i >= 0; i--) {
    var v = item.variants[i];
    if (isVariantDone(v, item)) { lastFinished = v; break; }
  }
  if (!lastFinished) {
    toast('没有可撤销的用完记录');
    return;
  }
  lastFinished.usedUp = false;
  lastFinished.finishDate = null;
  // 恢复使用记录
  if (item.usageRecords && item.usageRecords.length > 0) {
    for (var j = item.usageRecords.length - 1; j >= 0; j--) {
      var r = item.usageRecords[j];
      if (r.variantId === lastFinished.id && r.endDate) {
        r.endDate = null;
        break;
      }
    }
  }
  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已撤销用完');
}

// 撤销多变体某个变体的用完状态
function undoFinishVariant(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(vv) { return vv.id === variantId; });
  if (!v) { toast('该变体不存在'); return; }
  if (!v.usedUp) {
    // 多规格「本批用完」后的撤销：库存还剩着，只是把最近一次记录恢复为使用中
    var reopened = false;
    if (item.usageRecords) {
      for (var i = item.usageRecords.length - 1; i >= 0; i--) {
        var r0 = item.usageRecords[i];
        if (r0.variantId === variantId && r0.endDate) { r0.endDate = null; reopened = true; break; }
      }
    }
    if (!reopened) { toast('该变体未标记用完'); return; }
    v.opened = true;
    v.finishDate = null;
    syncItemFromVariants(item);
    saveDB();
    openCardDetail(currentZoneId, itemId);
    toast('已撤销：该批继续使用中');
    return;
  }
  v.usedUp = false;
  v.finishDate = null;
  if (item.usageRecords && item.usageRecords.length > 0) {
    for (var i = item.usageRecords.length - 1; i >= 0; i--) {
      var r = item.usageRecords[i];
      if (r.variantId === variantId && r.endDate) {
        r.endDate = null;
        break;
      }
    }
  }
  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已撤销用完');
}

      } else {

      } else if (spA) {

          var pqA = specPackQty(s), uA = s.unit || '';

          html += '</div>';
        });

        html += '<input type="number" class="form-input audit-variant-stock" data-idx="' + i + '" data-recorded="' + (v.stock || 0) + '" value="' + (v.stock || 0) + '" min="0" step="0.5" style="width:90px;text-align:center;font-size:16px;font-weight:600;flex-shrink:0" oninput="updateAuditTotal()">';

    html += '<input type="number" class="form-input" id="audit-stock" value="' + currentStock + '" min="0" step="0.5" style="font-size:24px;text-align:center;font-weight:700"></div>';
  }

  html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">按实物清点后填写，用于校正共用物品的消耗。</div>';

  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">取消</button>';

function updateAuditTotal() {
  var total = 0, recorded = 0;
  document.querySelectorAll('.audit-variant-stock').forEach(function(el) {
    total += parseFloat(el.value) || 0;
    recorded += parseFloat(el.getAttribute('data-recorded')) || 0;
  });
  // 多规格：剩余包数 × 每包含量 × 每份规格
  document.querySelectorAll('.audit-spec-input').forEach(function(el) {
    var c = parseFloat(el.getAttribute('data-content')) || 0;
    var pq = parseFloat(el.getAttribute('data-packqty')) || 1;
    total += (parseFloat(el.value) || 0) * pq * c;
    recorded += (parseFloat(el.getAttribute('data-recorded-packs')) || 0) * pq * c;
  });
  total = Math.round(total * 100) / 100;
  recorded = Math.round(recorded * 100) / 100;
  var totalEl = document.getElementById('audit-total');
  if (totalEl) {
    var unit = totalEl.getAttribute('data-unit') || '个';
    totalEl.textContent = total + unit;
  }
  var diffEl = document.getElementById('audit-diff');
  if (diffEl) {
    var diff = Math.round((recorded - total) * 100) / 100;
    if (Math.abs(diff) >= 0.5) {
      diffEl.innerHTML = '⚠️ 与系统记录差 ' + (diff > 0 ? '+' : '') + diff + (totalEl ? totalEl.getAttribute('data-unit') : '个') + '（保存将按实际校正，你可再微调）';
      diffEl.style.color = 'var(--red)';
    } else {
      diffEl.textContent = '与系统记录一致 ✓';
      diffEl.style.color = 'var(--green)';
    }
  }
}

function saveStockAudit(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var variants = item.variants && item.variants.length > 0 ? item.variants : [];
  var recorded = 0;
  (item.variants || []).forEach(function(v) { if (!(isSetPackMode(item) && v.opened && !v.usedUp)) recorded += (v.stock || 0); });
  var actual = 0;

  if (variants.length > 0) {
    var ok = true;
    variants.forEach(function(v, i) {
      var spS = (v.specs && v.specs.length) ? v.specs : null;
      if (spS) {
        // 多规格：按「剩余包数」落账（构成与套餐数不动，只校正剩余量）
        var touched = false;
        var allBad = false;
        spS.forEach(function (s, si) {
          var el = document.querySelector('.audit-spec-input[data-vi="' + i + '"][data-si="' + si + '"]');
          if (!el) return;
          var n = parseFloat(el.value);
          if (isNaN(n) || n < 0) { toast('请输入有效的剩余包数'); ok = false; allBad = true; return; }
          // 剩余包数 → 反算已开包数：openPacks = 套餐数 × 单套包数 − 剩余包数
          var total = variantPacksBought(v) * specPackCount(s);
          s.openPacks = Math.round(Math.max(0, total - n) * 100) / 100;
          s.qty = Math.round(specPackCount(s) * specPackQty(s) * 100) / 100; // 兼容字段：构成口径
          touched = true;
        });
        if (allBad) { actual += v.stock || 0; return; }
        if (touched) {
          v.stock = variantSpecContent(v);
          // 套餐数是「购买记录」，盘点只校正剩余量，不覆盖
          if (!v.specsFolded) v.specsFolded = true;
          if (v.stock > 0) {
            v.usedUp = false; v.finishDate = null;
            // 使用中与否以「有没有未结束的开封记录」为准
            v.opened = (item.usageRecords || []).some(function(r) { return r.variantId === v.id && !r.endDate; });
          }
          else { v.usedUp = true; v.opened = false; if (!v.finishDate) v.finishDate = new Date().toISOString(); }
        }
        actual += v.stock || 0;
        return;
      }
      var input = document.querySelector('.audit-variant-stock[data-idx="' + i + '"]');
      if (!input) return; // 使用中跳过盘点，保留原 stock
      var val = parseFloat(input.value);
      if (isNaN(val) || val < 0) { toast('请输入有效数量'); ok = false; return; }
      v.stock = val;
      actual += val;
    });
    if (!ok) return;
  } else {
    var input = document.getElementById('audit-stock');
    actual = parseFloat(input ? input.value : NaN);
    if (isNaN(actual) || actual < 0) { toast('请输入有效数量'); return; }
    item.stock = actual;
  }

  var diff = recorded - actual; // 正数=实际用得更快

  if (!item.auditHistory) item.auditHistory = [];
  item.auditHistory.push({
    date: new Date().toISOString(),
    recorded: recorded,
    actual: actual,
    diff: diff
  });

  // 校正库存：把差异记成一条使用记录
  // 场景：出差/家人代用 → 中间没写记录，盘点时消失的那部分也是被用掉了
  // 规则：起点 = 上一条记录的结束日（没有则用 30 天前兜底），终点 = 今天
  // 这样「这一段」才会作为一条真实使用记录参与速率计算
  if (diff > 0) {
    if (!item.usageRecords) item.usageRecords = [];
    var nowA = new Date();
    // 找最近一条已结束记录的 endDate 作为起点（按日期不按数组顺序，防止乱序）
    var lastEndMs = null;
    item.usageRecords.forEach(function (r) {
      if (!r.endDate) return;
      var t = new Date(r.endDate).getTime();
      if (isNaN(t)) return;
      if (lastEndMs === null || t > lastEndMs) lastEndMs = t;
    });
    var startA = lastEndMs !== null ? new Date(lastEndMs) : new Date(nowA.getTime() - 30 * 86400000);
    // 起点不能晚于今天
    if (startA.getTime() > nowA.getTime()) startA = new Date(nowA.getTime() - 86400000);
    item.usageRecords.push({
      startDate: startA.toISOString(),
      endDate: nowA.toISOString(),
      qty: diff,
      variantId: null,
      brand: '盘点差异(共用)',
      isAudit: true
    });
  }

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  if (diff === 0) {
    toast('盘点完成，数量一致');
  } else if (diff > 0) {
    toast('盘点完成，差异 ' + diff + mainPackUnit(item) + '（实际用得更快）已校正');
  } else {
    toast('盘点完成，实际比记录多 ' + Math.abs(diff) + mainPackUnit(item));
  }
}

// ========== 分类管理 ==========
function openCategoryManager() {
  var zone = getZone(currentZoneId);
  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">分类管理</div>';
  html += '<div style="font-size:12px;color:var(--text-tertiary);margin-bottom:8px">大类下可加子分类（如：上装 → 春秋/夏/冬），添加物品时子分类选填</div>';
  html += '<div id="cat-list">';
  var mainCats = zone.categories.filter(function(c) { return !c.parentId; });
  if (mainCats.length === 0) {
    html += '<div style="padding:20px;text-align:center;color:var(--text-tertiary);font-size:13px">还没有分类</div>';
  }
  mainCats.forEach(function(cat) {
    var subs = getSubcategories(zone, cat.id);
    // 大类计数 = 自身 + 子分类的物品总数
    var subIds = subs.map(function(s) { return s.id; });
    var count = visibleItems(zone).filter(function(it) {
      return it.categoryId === cat.id || subIds.indexOf(it.categoryId) >= 0;
    }).length;
    html += '<div class="setting-row" style="border-radius:0;background:var(--card-bg)">';
    html += '<div><span class="setting-label" style="font-weight:700">' + escapeHtml(cat.name) + '</span><br><span class="setting-value">' + count + '件' + (subs.length > 0 ? ' · ' + subs.length + '个子类' : '') + '</span></div>';
    html += '<div style="display:flex;gap:6px">';
    html += '<button class="btn btn-outline btn-sm" onclick="addSubcategory(\'' + cat.id + '\')">＋子类</button>';
    html += '<button class="btn btn-outline btn-sm" onclick="editCategory(\'' + cat.id + '\')">改名</button>';
    html += '<button class="btn btn-danger btn-sm" onclick="deleteCategory(\'' + cat.id + '\')">删</button>';
    html += '</div></div>';
    // 子分类行（缩进）
    subs.forEach(function(sub) {
      var subCount = visibleItems(zone).filter(function(it) { return it.categoryId === sub.id; }).length;
      html += '<div class="setting-row" style="border-radius:0;padding-left:28px">';
      html += '<div><span class="setting-label">└ ' + escapeHtml(sub.name) + '</span><br><span class="setting-value">' + subCount + '件</span></div>';
      html += '<div style="display:flex;gap:6px">';
      html += '<button class="btn btn-outline btn-sm" onclick="editCategory(\'' + sub.id + '\')">改名</button>';
      html += '<button class="btn btn-danger btn-sm" onclick="deleteCategory(\'' + sub.id + '\')">删</button>';
      html += '</div></div>';
    });
  });
  html += '</div>';
  html += '<button class="btn btn-primary btn-full" style="margin-top:16px" onclick="addCategory()">＋ 添加大类</button>';
  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal();renderZone()">完成</button>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

function deleteCategory(catId) {
  var zone = getZone(currentZoneId);
  var cat = getCategory(zone.id, catId);
  if (!cat) return;
  if (!cat.parentId) {
    // 大类：检查子分类和物品
    var subs = getSubcategories(zone, catId);
    if (subs.length > 0) {
      toast('该大类下还有 ' + subs.length + ' 个子分类，请先删除子分类');
      return;
    }
  }
  var count = visibleItems(zone).filter(function(it) { return it.categoryId === catId; }).length;
  if (count > 0) {
    toast('该分类下还有' + count + '件物品，请先移走');
    return;
  }
  if (!confirm('确定删除此分类？')) return;
  zone.categories = zone.categories.filter(function(c) { return c.id !== catId; });
  saveDB();
  openCategoryManager();
  toast('已删除');
}

// ========== 任务委托（原「目标锁定」完全重写） ==========
var taskState = { tab: '待接', searchOpen: false, search: '', sel: null, formPlans: [], batchIds: [], parentItemId: null };

var TASK_TABS = [
  { key: '待接',   color: '#007AFF', label: '委托待接' },
  { key: '进行中', color: '#5856D8', label: '任务进行' },
  { key: '凯旋',   color: '#FFB300', label: '任务凯旋' },
  { key: '搁置',   color: '#FF9500', label: '任务搁置' }
];

function taskHaptic() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }
function escTask(s) { return escapeHtml(s); }
function trimNum(n) { var x = +n || 0; return (Math.round(x * 100) / 100).toString(); }
function fmtMoney(n) { var v = Math.round((+n || 0) * 100) / 100; return '¥' + v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function taskById(id) { var s = String(id); for (var i = 0; i < DB.tasks.length; i++) { if (String(DB.tasks[i].id) === s) return DB.tasks[i]; } return null; }
function taskNextId() { var m = 0; DB.tasks.forEach(function (t) { if (t.id > m) m = t.id; }); return m + 1; }
function planNextId() { var m = 0; DB.tasks.forEach(function (t) { (t.plans || []).forEach(function (p) { if (p.id > m) m = p.id; }); }); if (taskState && taskState.formPlans) taskState.formPlans.forEach(function (p) { if (p.id > m) m = p.id; }); return m + 1; }
function findPlan(t, pid) { if (!t.plans) return null; var s = String(pid); for (var i = 0; i < t.plans.length; i++) { if (String(t.plans[i].id) === s) return t.plans[i]; } return null; }
function cheapestPlan(t) { var best = null; (t.plans || []).forEach(function (p) { var a = +p.amount || 0; if (a > 0 && (!best || a < best.amount)) best = p; }); return best; }

// ---------- 混合套餐：一个方案可含多种规格（如 44粒装×3盒 + 70粒装×2盒 = 272粒）----------
// v1.7：明细带「性质」kind —— normal 正装 / refill 替换装 / gift 赠品。
// 库存只认「实物件数与含量」，性质仅用于结算页与展示区分，绝不影响库存计算口径。
var SPEC_KINDS = [
  { k: 'normal', label: '正装', icon: '🫙' },
  { k: 'refill', label: '替换装', icon: '♻️' },
  { k: 'gift', label: '赠品', icon: '🎁' }
];
function specKindOf(s) {
  var k = String((s && s.kind) || '').trim();
  return (k === 'refill' || k === 'gift') ? k : 'normal';
}
function specKindLabel(k) {
  for (var i = 0; i < SPEC_KINDS.length; i++) { if (SPEC_KINDS[i].k === k) return SPEC_KINDS[i].label; }
  return '正装';
}
function specKindIcon(k) {
  for (var i = 0; i < SPEC_KINDS.length; i++) { if (SPEC_KINDS[i].k === k) return SPEC_KINDS[i].icon; }
  return '🫙';
}
function planSubList(p) {
  return (p.subItems || []).filter(function (s) { return (+s.spec > 0) && (+s.count > 0); });
}
// ---------- v1.7 强制归属：委托必须有父级物品，方案一律继承父级 ----------
// 父级 = 库存里的「物品」（如 面霜），是仓库；方案里的各品牌 = 仓库下的货架。
function taskParentIdOf(t) {
  if (!t) return null;
  if (t.sourceItemId) return t.sourceItemId;
  // 兼容历史数据：从任一方案里回溯来源物品
  var found = null;
  (t.plans || []).forEach(function (p) { if (!found && p && p.sourceItemId) found = p.sourceItemId; });
  return found;
}
function taskParentItem(t) {
  var pid = taskParentIdOf(t);
  return pid ? findItemByIdGlobal(pid) : null;
}
function taskParentLabel(t) {
  var it = taskParentItem(t);
  if (it) return it.name;
  var pid = taskParentIdOf(t);
  return pid ? '(已删除的物品)' : '';
}
// 该委托是否具备凯旋资格（必须挂父级）
function taskCanWin(t) {
  return !!taskParentIdOf(t);
}
// 在父级物品下按品牌名找变体（去掉首尾空白、忽略大小写）
function findVariantByName(item, brandName) {
  if (!item || !item.variants) return null;
  var nm = String(brandName || '').trim().toLowerCase();
  if (!nm) return null;
  var hit = null;
  item.variants.forEach(function (v) {
    if (hit) return;
    if (String(v.brand || '').trim().toLowerCase() === nm) hit = v;
  });
  return hit;
}
function planSubSpec(p) { // 每套（一份套餐）的总含量
  var subs = planSubList(p);
  if (!subs.length) return 0;
  var per = 0;
  subs.forEach(function (s) { per += (+s.spec || 0) * (+s.count || 0); });
  return Math.round(per * 100) / 100;
}
function planSpecText(p) { // "44粒装×3 + 70粒装×2 = 272粒"；带性质图标（🫙正装/♻️替换装/🎁赠品）
  var subs = planSubList(p);
  if (!subs.length) return '';
  var u0 = subs[0].unit || '';
  var parts = subs.map(function (s) {
    var nm = String(s.name || '').trim() || (trimNum(+s.spec) + (s.unit || ''));
    var kd = specKindOf(s);
    var ic = (kd !== 'normal') ? (specKindIcon(kd) + ' ') : '';
    return ic + nm + '×' + trimNum(+s.count);
  });
  return parts.join(' + ') + ' = ' + trimNum(planSubSpec(p)) + u0;
}
function planMultiUnit(p) {
  var subs = planSubList(p);
  if (subs.length && subs[0].unit) return subs[0].unit;
  return p.unit || '';
}
function planDerived(p) {
  var amount = +p.amount || 0;
  var qty = (+p.qty > 0) ? +p.qty : 1;
  var perSpec = planSubSpec(p);
  var spec = perSpec > 0 ? perSpec : (+p.spec || 0);
  var comboPrice = (+p.comboPrice > 0) ? +p.comboPrice : (qty > 0 ? amount / qty : amount);
  var totalSpec = spec * qty;
  var unitPrice = totalSpec > 0 ? amount / totalSpec : 0;
  return { amount: amount, qty: qty, spec: spec, comboPrice: comboPrice, totalSpec: totalSpec, unitPrice: unitPrice, perSpec: perSpec, multi: perSpec > 0 };
}
// 从方案"单位"文本解析每小单位含量："1kg"→1kg、"3kg"→3kg、"500g"→0.5kg、"200ml/瓶"→200ml+小单位名"瓶"
// 解析不了（如纯文字"包"）返回 null
function parseUnitContent(unit) {
  var s = String(unit || '').toLowerCase().trim();
  if (!s) return null;
  var m = s.match(/([0-9.]+)\s*(kg|千克|公斤|g|克|ml|毫升|l|升)/);
  if (!m) return null;
  var v = parseFloat(m[1]); if (!(v > 0)) return null;
  var u = m[2];
  if (u === '千克' || u === '公斤') u = 'kg';
  else if (u === '克') u = 'g';
  else if (u === '毫升') u = 'ml';
  else if (u === 'l' || u === '升') u = 'L';
  if (u === 'g' && v >= 1000) { u = 'kg'; v = v / 1000; }
  if (u === 'ml' && v >= 1000) { u = 'L'; v = v / 1000; }
  // 小单位名：含量匹配之后的剩余文本（"1kg/包"→包）；纯重量则无名
  var name = s.slice(m.index + m[0].length).replace(/^[\s\/\\*x×每\.\-、]+/, '').trim();
  if (/^[0-9]*$/.test(name)) name = '';
  return { v: v, u: u, name: name };
}
// 方案总含量：总份数 × 每份含量（单位文本可解析时），如 3套×4包×1kg = 12kg
function planTotalContent(p) {
  var d = planDerived(p);
  var c = parseUnitContent(p.unit);
  if (!c || !(d.totalSpec > 0)) return null;
  return { total: d.totalSpec * c.v, u: c.u, perUnit: c.v, name: c.name, totalUnits: d.totalSpec };
}
function planMin(t) { var m = Infinity; (t.plans || []).forEach(function (p) { var a = +p.amount || 0; if (a > 0 && a < m) m = a; }); return m === Infinity ? 0 : m; }
function planMax(t) { var m = 0; (t.plans || []).forEach(function (p) { var a = +p.amount || 0; if (a > m) m = a; }); return m; }
function planWeightStr(p) {
  var d = planDerived(p);
  if (d.multi) { var mt = planSpecText(p); return mt ? ('📦 ' + mt) : ''; }
  if (!(d.totalSpec > 0)) return '';
  var tc = planTotalContent(p);
  if (tc) return '📦 ≈' + trimNum(tc.total) + tc.u; // 真总重量（套×每套含×每份含量）
  return '📦 共 ' + trimNum(d.totalSpec) + (p.unit ? ' ' + p.unit : ' 份');
}
function taskWeightStr(t) {
  var inProgress = (t.status === '进行中' || t.status === '凯旋');
  var arr = [];
  (t.plans || []).forEach(function (p) {
    if (inProgress && p.buy === false) return;
    var tc = planTotalContent(p);
    if (tc) { arr.push({ v: tc.total, s: tc.u }); return; }
    var d = planDerived(p);
    if (d.totalSpec > 0) arr.push({ v: d.totalSpec, s: p.unit ? ' ' + p.unit : ' 份' });
  });
  if (arr.length === 0) return '';
  var suffixes = {};
  arr.forEach(function (x) { suffixes[x.s] = true; });
  var keys = Object.keys(suffixes);
  var vals = arr.map(function (x) { return x.v; });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (keys.length > 1) return '📦 ' + arr.map(function (x) { return trimNum(x.v) + x.s; }).join(' + ');
  if (mn === mx) return '📦 ' + trimNum(mn) + keys[0];
  return '📦 ' + trimNum(mn) + '~' + trimNum(mx) + keys[0];
}
function taskAbandonAmt(t) {
  if (t.status === '搁置') return planMin(t);
  if (t.status === '凯旋') { var s = 0; (t.plans || []).forEach(function (p) { if (p.buy !== false) s += (+p.amount || 0); }); return s; }
  return 0;
}
function sortPlans(t) { return (t.plans || []).slice().sort(function (a, b) { if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1; return (a.id || 0) - (b.id || 0); }); }
function taskMatch(t, q) { q = (q || '').toLowerCase(); if (!q) return true; if ((t.name || '').toLowerCase().indexOf(q) >= 0) return true; return (t.plans || []).some(function (p) { return (p.name || '').toLowerCase().indexOf(q) >= 0; }); }
function taskPriceLabel(t) { var mn = planMin(t), mx = planMax(t); if (mn === mx) return '💰 价格 ' + fmtMoney(mn); return '💰 价格区间 ' + fmtMoney(mn) + ' ~ ' + fmtMoney(mx); }

// ---------- 渲染入口 ----------
function renderTasks() {
  var s = taskState;
  var html = '';

  // 标签页
  html += '<div class="task-tabs">';
  TASK_TABS.forEach(function (tb) {
    var on = s.tab === tb.key;
    html += '<div class="task-tab' + (on ? ' on' : '') + '" style="' + (on ? 'background:' + tb.color + ';border-color:' + tb.color : '') + '" onclick="taskSwitchTab(\'' + tb.key + '\')">' + tb.label + '</div>';
  });
  html += '</div>';

  // 战报条（按规范：仅待接/搁置，进行中/凯旋不显示，避免干扰主线）
  if (s.tab === '待接') {
    var need = 0, cnt = 0;
    DB.tasks.forEach(function (t) { if (t.status === '待接') { need += planMin(t); cnt++; } });
    html += '<div class="task-banner orange">解锁本区域全部目标，需消耗金币总额：' + fmtMoney(need) + '（' + cnt + ' 项）</div>';
  } else if (s.tab === '搁置') {

    DB.tasks.forEach(function (t) { if (t.status === '搁置') { saved += planMin(t); sc++; } });
    html += '<div class="task-banner green">成功抵御欲望侵蚀，回收 ' + fmtMoney(saved) + ' 金币！（' + sc + ' 项）</div>';
  }

  // 工具栏
  html += '<div class="task-toolbar">';
  html += '<button class="task-tool-btn" onclick="taskToggleSearch()">🔍 搜索</button>';
  html += '<button class="task-tool-btn' + (s.sel ? ' on' : '') + '" onclick="taskToggleSel()">' + (s.sel ? '✓ 退出多选' : '☑️ 多选') + '</button>';
  if (s.tab === '待接') html += '<button class="task-tool-btn primary" style="margin-left:auto" onclick="taskOpenForm()">＋ 新增委托</button>';
  else if (s.tab === '凯旋' || s.tab === '搁置') html += '<button class="task-tool-btn" style="margin-left:auto" onclick="taskClearModal()">🔄 重置</button>';
  else html += '<span class="spacer"></span>';
  html += '</div>';

  // 搜索框
  if (s.searchOpen) {
    html += '<div class="task-search-row"><input type="text" class="form-input" id="task-search-input" placeholder="搜委托名或方案名…" value="' + escTask(s.search) + '" oninput="taskOnSearch(this.value)"></div>';
  }

  // 列表
  var list = DB.tasks.filter(function (t) { return t.status === s.tab; });
  if (s.search) list = list.filter(function (t) { return taskMatch(t, s.search); });
  if (list.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">这里还没有委托<br>点击右上角「＋ 新增委托」开始登记</div></div>';
  } else {
    list.forEach(function (t) { html += taskCard(t); });
  }

  // 多选操作条
  if (s.sel) {
    html += '<div class="task-selbar">';
    var allSel = list.length > 0 && list.every(function (t) { return s.sel.has(t.id); });
    html += '<button class="task-tool-btn" onclick="taskSelAll()">' + (allSel ? '取消全选' : '全选') + '</button>';
    if (s.tab === '待接') {
      html += '<button class="btn btn-primary btn-sm" onclick="taskBatchStrike()">⚔️ 出击</button>';
      html += '<button class="btn btn-outline btn-sm" onclick="taskBatchAbandon()">🚫 放弃</button>';
    } else if (s.tab === '进行中') {

    } else {

    }
    html += '<button class="btn btn-danger btn-sm" onclick="taskBatchDestroy()">🗑️ 删除</button>';
