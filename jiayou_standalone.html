<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4A90E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家有">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>家有</title>
<style>
/* ========== 设计系统 ========== */
:root {
  --bg: #F2F2F7;
  --card-bg: #FFFFFF;
  --text: #1C1C1E;
  --text-secondary: #8E8E93;
  --text-tertiary: #C7C7CC;
  --separator: #E5E5EA;
  --accent: #007AFF;
  --red: #FF3B30;
  --orange: #FF9500;
  --yellow: #FFCC00;
  --green: #34C759;
  --blue: #5AC8FA;
  --purple: #AF52DE;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ========== 导航栏 ========== */
.navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(242,242,247,0.85);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid var(--separator);
  padding: 12px 16px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.navbar h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.navbar .nav-actions { display: flex; gap: 8px; align-items: center; }
.nav-btn {
  width: 32px; height: 32px;
  border-radius: 50%; border: none;
  background: rgba(0,122,255,0.1);
  color: var(--accent);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s;
}
.nav-btn:active { transform: scale(0.88); }

/* ========== 底部Tab栏 ========== */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--separator);
  display: flex; padding: 6px 0 20px;
  max-width: 600px; margin: 0 auto;
}
.tabbar-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 2px; cursor: pointer;
  transition: opacity 0.15s; -webkit-user-select: none; user-select: none;
}
.tabbar-item:active { opacity: 0.5; }
.tabbar-item .tab-icon { font-size: 24px; line-height: 1; }
.tabbar-item .tab-label { font-size: 10px; color: var(--text-secondary); font-weight: 500; }
.tabbar-item.active .tab-label { color: var(--accent); }
.tabbar-item.active .tab-icon { transform: scale(1.1); }

/* ========== 页面容器 ========== */
.page {
  max-width: 600px; margin: 0 auto;
  padding: 0 16px 100px;
  display: none;
}
.page.active { display: block; }

/* ========== 按钮系统 ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600; border: none;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  font-family: var(--font);
}
.btn:active { transform: scale(0.96); opacity: 0.7; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-success { background: var(--green); color: #fff; }
.btn-ghost { background: transparent; color: var(--accent); }
.btn-full { width: 100%; padding: 14px; font-size: 16px; }
.btn-outline { background: transparent; border: 1.5px solid var(--separator); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 13px; }
/* 第 10 轮：卡片次要操作按钮（日常的「消耗/开封/回退」）——极低视觉存在感 */
/* 主操作（补货）继续用 .btn-outline，次要操作用它，让主次一眼分明 */
.btn-quiet {
  background: var(--card-bg);
  border: 1px solid var(--separator);
  color: var(--text-secondary);
  font-weight: 500;
  box-shadow: none;
}
.btn-quiet:active { background: var(--bg); }
/* 卡片底部操作区按钮统一高度，避免两行高矮不齐 */
.btn-card-action { padding: 7px 6px; font-size: 12px; border-radius: 9px; }

/* 第 12 轮：详情页操作区 —— 全部按钮强制同一行，图标为主 + 极小文字为辅 */
.act-row {
  display: flex; gap: 6px; margin-bottom: 12px;
  flex-wrap: nowrap; align-items: stretch;
}
.act-row > button { flex: 1 1 0; min-width: 0; }
/* 【第 25 轮】年报顶部四大类 + 已归档：一行四列，只做入口不显示数字 */
.report-cat-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  padding: 0 16px 12px;
}
.report-cat-cell {
  background: var(--bg); border-radius: 10px; padding: 10px 4px;
  text-align: center; cursor: pointer; border: 1.5px solid transparent;
  transition: background .15s, border-color .15s;
}
.report-cat-cell.open { background: rgba(0,105,92,0.10); border-color: rgba(0,105,92,0.35); }
.report-cat-txt {
  font-size: 12px; font-weight: 600; color: var(--text-primary);
  display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.act-mini {
  display: flex; flex-direction: row; align-items: center; justify-content: center;
  gap: 4px; padding: 8px 2px; font-size: 15px; line-height: 1;
  border-radius: 9px; white-space: nowrap; overflow: hidden;
}
.act-mini i {
  font-style: normal; font-size: 11px; font-weight: 500;
  color: var(--text-secondary); letter-spacing: 0;
}
/* 第 12 轮：记录行右侧的极简图标按钮 —— 方形小尺寸，纯图标无文字 */
.rec-icon-btn {
  flex-shrink: 0; width: 26px; height: 26px; padding: 0;
  font-size: 12px; line-height: 1; border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center;
}
.rec-icon-danger { color: var(--text-tertiary); }

/* ========== 卡片 ========== */
.card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

/* ========== 首页预警条 ========== */
.alert-strip {
  display: flex; gap: 8px; margin-bottom: 16px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 2px 0;
}
.alert-strip::-webkit-scrollbar { display: none; }
.alert-badge {
  flex-shrink: 0; padding: 10px 14px; border-radius: 12px;
  display: flex; flex-direction: column; gap: 2px;
  min-width: 100px; cursor: pointer;
  transition: transform 0.15s;
}
.alert-badge:active { transform: scale(0.95); }
.alert-badge .badge-num { font-size: 24px; font-weight: 800; line-height: 1.1; }
.alert-badge .badge-label { font-size: 11px; opacity: 0.9; font-weight: 500; }
.alert-red { background: linear-gradient(135deg, #FF3B30, #FF6B6B); color: #fff; }
.alert-yellow { background: linear-gradient(135deg, #FF9500, #FFB340); color: #fff; }
.alert-blue { background: linear-gradient(135deg, #5AC8FA, #7AD9FF); color: #fff; }
.alert-green { background: linear-gradient(135deg, #34C759, #5AD680); color: #fff; }
.alert-gray { background: linear-gradient(135deg, #8E8E93, #AEAEB2); color: #fff; }
.alert-purple { background: linear-gradient(135deg, #AF52DE, #C97AF0); color: #fff; }
@keyframes pulse-red {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(255,59,48,0); }
}
.alert-red.pulse { animation: pulse-red 2s infinite; }

/* ========== 区块标题 ========== */
.section-title {
  font-size: 20px; font-weight: 700;
  margin: 20px 0 12px; letter-spacing: -0.3px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title .section-action {
  font-size: 14px; font-weight: 500; color: var(--accent); cursor: pointer;
}

/* ========== 拥有量卡 ========== */
.own-card {
  background: var(--card-bg); border-radius: var(--radius); padding: 14px;
  box-shadow: var(--shadow); cursor: pointer; transition: transform 0.15s;
}
.own-card:active { transform: scale(0.97); }

/* ========== AI分析卡 ========== */
.ai-card {
  background: linear-gradient(135deg, #E0F7FA, #B2DFDB, #E1BEE7);
  color: #1C1C1E; border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-lg);
  border: 1px solid rgba(178,223,219,0.4);
}
.ai-card .ai-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.ai-card .ai-title { font-size: 16px; font-weight: 700; color: #00695C; }
.ai-card .ai-badge {
  font-size: 10px; background: rgba(0,105,92,0.12);
  padding: 2px 8px; border-radius: 6px; font-weight: 600; color: #00695C;
}
.ai-card .ai-section { margin-bottom: 14px; }
.ai-card .ai-section:last-child { margin-bottom: 0; }
.ai-card .ai-section-title {
  font-size: 12px; color: #00897B;
  margin-bottom: 6px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.ai-card .ai-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 0.5px solid rgba(0,105,92,0.12);
  font-size: 14px;
}
.ai-card .ai-item:last-child { border-bottom: none; }
.ai-card .ai-item .ai-val { font-weight: 700; color: #00695C; }
.ai-card .ai-suggest {
  background: rgba(255,255,255,0.5); border-radius: 8px;
  padding: 10px 12px; font-size: 13px; line-height: 1.6; color: #1C1C1E;
}
.ai-card .ai-suggest strong { color: #00897B; }

/* ========== 年报页 ========== */
.report-hero {
  margin: 0 0 16px; padding: 18px; border-radius: var(--radius);
  background: linear-gradient(135deg, #E0F7FA, #B2DFDB, #E1BEE7);
  border: 1px solid rgba(178,223,219,0.4); box-shadow: var(--shadow-lg);
}
.report-hero-title { font-size: 19px; font-weight: 700; color: #00695C; }
.report-hero-sub { font-size: 12px; color: #00695C; opacity: .8; margin-top: 4px; line-height: 1.5; }
.report-hero-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px;
}
.report-stat {
  background: rgba(255,255,255,0.62); border-radius: 10px;
  padding: 10px 4px; text-align: center;
}
.report-stat-num { font-size: 20px; font-weight: 700; color: #00695C; line-height: 1.1; }
.report-stat-num.report-stat-warn { color: var(--orange); }
.report-stat-label { font-size: 10px; color: #00695C; opacity: .75; margin-top: 3px; }
.report-hero-spend {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(0,105,92,0.15);
  font-size: 13px; color: #00695C;
}
.report-hero-spend strong { font-size: 16px; }

.report-group {
  margin-bottom: 18px; background: var(--card);
  border-radius: var(--radius); border: 0.5px solid var(--separator);
  overflow: hidden;
}
.report-group-head {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px 6px; cursor: pointer; user-select: none;
}
.report-group-icon { font-size: 18px; }
.report-group-title { font-size: 15px; font-weight: 700; flex: 1; }
.report-group-count {
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  background: var(--bg); border-radius: 999px; padding: 2px 9px;
}
.report-group-arrow {
  font-size: 16px; color: var(--text-tertiary);
  transition: transform .2s ease; transform: rotate(0deg);
}
.report-group-arrow.folded { transform: rotate(-90deg); }
.report-group-hint {
  padding: 0 16px 10px; font-size: 11px; line-height: 1.55; color: var(--text-tertiary);
}
.report-group-body { padding: 0 16px 8px; }

.report-row {
  padding: 12px 0; border-top: 0.5px solid var(--separator); cursor: pointer;
}
.report-row:first-child { border-top: none; }
.report-row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.report-row-name { font-size: 15px; font-weight: 700; min-width: 0; }
.report-row-zone { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
.report-tag {
  font-size: 10px; font-weight: 600; vertical-align: middle;
  padding: 1px 6px; border-radius: 6px; margin-left: 5px;
  background: var(--bg); color: var(--text-secondary);
}
.report-tag-warn { background: rgba(255,149,0,0.16); color: var(--orange); }
.report-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.report-fact {
  font-size: 12px; line-height: 1.4; padding: 3px 9px; border-radius: 8px;
  background: var(--bg); color: var(--text-secondary);
}
.report-left { font-size: 12px; color: var(--purple); font-weight: 600; margin-top: 7px; }
.report-advice {
  font-size: 13px; line-height: 1.55; color: #00695C; font-weight: 600; margin-top: 7px;
}
.report-detail { font-size: 11px; line-height: 1.6; color: var(--text-tertiary); margin-top: 4px; }
.report-foot {
  padding: 16px 0 8px; font-size: 11px; line-height: 1.6;
  color: var(--text-tertiary); text-align: center;
}

/* 表单变体卡：左标签右输入的行式字段（「总套餐数：[1]」模式） */
.vfield { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.vfield .form-input { flex:1; min-width:0; font-size:13px; padding:7px 9px; }
/* 表单变体卡：标签在上的小格（一行多格：「规格 [2] 单位 [瓶] 容量 [30] 单位 [ml]」） */
.vcell { display:flex; flex-direction:column; min-width:0; }
.vcell .vlab { font-size:11px; color:var(--text-tertiary); margin:0 0 3px 2px; }
.vcell .form-input { width:100%; font-size:14px; padding:8px 9px; min-height:40px; }
.vcalc {
  background:var(--bg); border-radius:8px; padding:8px 10px;
  font-size:12px; line-height:1.55; color:var(--text-secondary); margin-top:2px;
}
.vside-btn {
  width:56px; padding:5px 0; border-radius:8px; border:1px solid var(--separator);
  background:var(--bg); font-size:14px; line-height:1.1; cursor:pointer; text-align:center;
}
.vside-btn small { display:block; font-size:9px; color:var(--text-secondary); margin-top:1px; }
.vside-btn.on { background:var(--red); border-color:var(--red); }
.vside-btn.on small { color:#fff; }
.vside-btn.on.spec { background:var(--accent); border-color:var(--accent); }
/* 横排小按钮（名称行右侧：🧩规格 / ❌不再买 / 🗑删除） */
.vside-btn.h { width:46px; min-height:42px; padding:4px 0; flex-shrink:0; }

/* 首页年报入口 */.report-entry {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; margin-bottom: 12px;
  background: var(--card); border-radius: var(--radius);
  border: 0.5px solid var(--separator); box-shadow: var(--shadow);
  cursor: pointer;
}
.report-entry:active { opacity: .7; }
.report-entry-icon { font-size: 24px; flex-shrink: 0; }
.report-entry-body { flex: 1; min-width: 0; }
.report-entry-title { font-size: 15px; font-weight: 700; color: var(--text); }
.report-entry-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.report-entry-arrow { font-size: 22px; color: var(--text-tertiary); flex-shrink: 0; line-height: 1; }

/* ========== 进度条 ========== */
/* 大进度条（库存可视化） */
.stock-bar {
  width: 100%; height: 12px; border-radius: 6px;
  overflow: hidden; background: var(--separator); position: relative;
}
.stock-bar .stock-fill {
  height: 100%; border-radius: 6px; transition: width 0.5s ease;
}
.stock-bar.low .stock-fill { background: linear-gradient(90deg, #FF3B30, #FF6B6B); }
.stock-bar.mid .stock-fill { background: linear-gradient(90deg, #FF9500, #FFB340); }
.stock-bar.high .stock-fill { background: linear-gradient(90deg, #34C759, #5AD680); }

/* ========== 物品卡片网格 ========== */
/* 第 13 轮：修复卡片宽度不一致 —— 1fr 等价于 minmax(auto,1fr)，长标题的 min-content 会撑宽整列；
   改用 minmax(0,1fr) 强制所有卡片严格等宽、网格对齐，配合 .item-card{min-width:0} 截断长内容 */
.item-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.item-card {
  background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
  cursor: pointer; transition: transform 0.15s;
  position: relative;
  min-width: 0;   /* 【第 13 轮】双列网格内绝不被内容撑破，宽度强制统一 */
}
.item-card:active { transform: scale(0.97); }
.item-card .card-photo {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-size: 40px; color: var(--text-tertiary);
}
.item-card .card-photo img { width: 100%; height: 100%; object-fit: cover; }
.item-card .card-body { padding: 10px 12px 11px; }
/* 第 12 轮：标题降噪 —— 15px/600（不再 17px/700），两列卡片内「生理期护理」也能完整显示 */
.item-card .card-name { font-size: 15px; font-weight: 600; letter-spacing: -0.1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-card .card-info { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* 耐用品紧凑卡片（无大照片区，隐私模式） */
.item-card-compact {
  min-height: 0;
  display: flex; flex-direction: column; justify-content: center;
}
.item-card-compact .card-body { padding: 10px 12px 11px; }
.item-card-compact .card-name { font-size: 15px; font-weight: 600; }

/* 第 10 轮：小卡片属性标签降噪 —— 去掉彩色背景与边框，只留极简灰字/灰图标 */
/* 属性 ≠ 状态：属性永远安静，彩色只留给真正需要行动的预警 */
.card-st {
  flex-shrink: 0; font-size: 11px; font-weight: 500; padding: 0;
  background: none; border: none; white-space: nowrap; line-height: 1.4;
  color: var(--text-tertiary);   /* 默认全灰，不抢眼 */
}
.card-st.st-idle  { color: var(--text-tertiary); }
.card-st.st-using { color: var(--text-tertiary); }
/* ⚠️ 余量较少：仅文字变橙，不加底色（预警但不用最重的视觉） */
.card-st.st-warn  { color: var(--orange); font-weight: 600; }
/* ❗️ 告急：仅文字变红加粗，卡片级红色左边框由 .card-alert 承担 */
.card-st.st-danger { color: var(--red); font-weight: 700; }
/* 第 12 轮：状态/模型图标 —— 极小、纯图标、不占文字空间 */
.card-model {
  flex-shrink: 0; font-size: 11px; font-weight: 400; padding: 0;
  background: none; border: none; border-radius: 0;
  white-space: nowrap; line-height: 1; color: var(--text-tertiary);
  opacity: 0.7;
}
.card-model.model-instant { color: var(--text-tertiary); }
.card-model.model-cycle { color: var(--text-tertiary); }

/* 第 11 轮：预警卡强化 —— 加粗橙/红边框 + 同色阴影；外框尺寸严格不变（仍在原位） */
/* 关键：用 border 而非 outline/scale，且 box-sizing 为 border-box，绝不撑开卡片大小 */
.item-card { box-sizing: border-box; }
.item-card.card-calm { border: 2px solid transparent; }
.item-card.card-warn {
  border: 2px solid var(--orange);
  box-shadow: 0 3px 12px rgba(255,149,0,0.24), var(--shadow);
}
.item-card.card-alert {
  border: 2px solid var(--red);
  box-shadow: 0 3px 12px rgba(255,59,48,0.26), var(--shadow);
}

/* 第 12 轮：卡片内留白节奏 —— 整体收紧，卡片真正变扁 */
.card-sec { margin-top: 6px; }         /* 段与段 */
.card-sec-tight { margin-top: 4px; }   /* 段内行与行 */
.card-price-zone { margin-top: 9px; }  /* 主信息与下方按钮之间 */

/* 第 12 轮：字号层级重排（降噪核心） */
/* 【第 13 轮】唯一被强调的数字 = 库存/余量：与标题并排放在第一行右侧 */
/* 【第 17 轮】字号 15→13px：库存是附属信息，绝不挤压产品名称（视觉重心=名称） */
.card-hero {
  font-size: 13px; font-weight: 600; line-height: 1.35;
  color: var(--text-secondary); letter-spacing: 0;
}
.card-hero-sub {
  font-size: 12px; font-weight: 400; color: var(--text-tertiary);
  margin-left: 0; letter-spacing: 0;
}
/* 辅助信息（品牌数等）—— 小字、常规粗细、柔和色，绝不抢标题视线 */
.card-meta {
  font-size: 11.5px; font-weight: 400; color: var(--text-tertiary);
  line-height: 1.5;
}
/* 第 12 轮：卡片可用天数 —— 全卡唯一允许「大字号」的核心数据之外的第二强调 */
.card-days {
  font-size: 12px; font-weight: 500; color: var(--text-secondary);
  line-height: 1.4; white-space: nowrap;
}

/* 变体缩略图网格（卡片背面） */
.variant-thumb-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
.variant-thumb { position:relative; border-radius:10px; overflow:hidden; background:var(--bg); }
.variant-thumb img { width:100%; aspect-ratio:1; object-fit:cover; display:block; cursor:pointer; }
.variant-thumb-no-photo { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--text-tertiary); background:var(--bg); }
.variant-thumb .variant-label { padding:6px 8px; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.variant-thumb .variant-sub { padding:0 8px 8px; font-size:11px; color:var(--text-secondary); }
.variant-thumb .variant-del {
  position:absolute; top:6px; right:6px;
  width:24px; height:24px; border-radius:50%;
  background:rgba(0,0,0,0.5); color:#fff;
  border:none; font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  z-index:2;
}

/* 全屏照片查看器 */
.photo-viewer {
  position:fixed; inset:0; z-index:500; background:#000;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.photo-viewer img {
  max-width:100%; max-height:100%; object-fit:contain;
  touch-action:none; will-change:transform;
}
.photo-viewer-close {
  position:absolute; top:16px; right:16px; z-index:501;
  width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,0.2); color:#fff;
  border:none; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.photo-viewer-counter {
  position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
  color:#fff; font-size:14px; font-weight:600; z-index:501;
  background:rgba(0,0,0,0.4); padding:6px 16px; border-radius:20px;
}

/* 卡片角标 */
.card-badge {
  position: absolute; top: 8px; right: 8px;
  padding: 3px 8px; border-radius: 8px;
  font-size: 10px; font-weight: 700; color: #fff;
  backdrop-filter: blur(4px);
}
.badge-expire { background: rgba(255,59,48,0.9); }
.badge-warn { background: rgba(255,149,0,0.9); }
.badge-archived { background: rgba(142,142,147,0.92); }

/* 卡片3D翻面 */
.card-detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 16px;
}
.card-detail-overlay.show { display: flex; }
.flip-card {
  width: 100%; max-width: 360px; max-height: 85vh;
  perspective: 1200px; position: relative;
}
.flip-inner {
  width: 100%; position: relative;
  transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
  transform-style: preserve-3d;
}
.flip-inner.flipped { transform: rotateY(180deg); }
.flip-face {
  width: 100%; backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 20px; overflow: hidden;
  box-shadow: var(--shadow-lg);
  transition: visibility 0s 0.3s;
}
.flip-front { background: var(--card-bg); }
.flip-back {
  position: absolute; top: 0; left: 0; min-height: 100%;
  transform: rotateY(180deg); background: var(--card-bg);
  max-height: 85vh; overflow-y: auto;
}
/* iOS Safari backface 失效兜底：翻到背面彻底隐藏正面，翻回时隐藏背面（0.3s 后切换=翻转过半时） */
.flip-inner.flipped .flip-front { visibility: hidden; }
.flip-inner:not(.flipped) .flip-back { visibility: hidden; }

/* 卡片正面（弹窗版） */
.detail-front { padding: 0; }
.detail-front .detail-photo {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-size: 60px; color: var(--text-tertiary); position: relative;
}
.detail-front .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
.detail-front .detail-body { padding: 16px; }
.detail-front .detail-name { font-size: 22px; font-weight: 700; }
.detail-front .detail-cat { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.detail-front .detail-tap-hint {
  text-align: center; font-size: 12px; color: var(--text-tertiary);
  margin-top: 12px; padding: 8px;
  border: 1px dashed var(--separator); border-radius: 8px;
}

/* 卡片背面 */
.detail-back { padding: 14px 14px 20px; }
.detail-back .back-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.detail-back .back-title { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
.detail-back .back-close {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--bg); border: none; font-size: 13px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
}
.back-section { margin-bottom: 14px; }
/* 第 12 轮：区块标题不再大写加粗，改小字常规灰（降噪） */
.back-section-title {
  font-size: 12px; color: var(--text-tertiary);
  font-weight: 500; text-transform: none;
  letter-spacing: 0; margin-bottom: 7px;
}
.back-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 0; border-bottom: 0.5px solid var(--separator); font-size: 13px;
}
.back-row:last-child { border-bottom: none; }
.back-row .back-label { color: var(--text-secondary); font-weight: 400; }
.back-row .back-value { font-weight: 500; }

/* ========== 品牌变体卡片（统一规格）========== */
.variant-card {
  background: var(--card-bg);
  border: 0.5px solid var(--separator);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 12px;
}
.variant-card:last-child { margin-bottom: 0; }
.variant-card.vc-using { border-color: var(--orange); box-shadow: inset 3px 0 0 var(--orange); }
.variant-card.vc-done { opacity: 0.72; }
.vc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
/* 第 12 轮：品牌名 16→14px、去掉 700 加粗（辅助信息不该抢主数字） */
.vc-brand { font-size: 14px; font-weight: 600; letter-spacing: 0; line-height: 1.35; }
.vc-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; flex-shrink: 0; }
.vc-badge.using { background: rgba(255,149,0,0.14); color: var(--orange); }
.vc-badge.done { background: rgba(52,199,89,0.14); color: var(--green); }
.vc-badge.norestock { background: rgba(142,142,147,0.16); color: var(--text-secondary); }
.variant-card.vc-norestock { opacity: 0.66; border-style: dashed; }
.vc-price-line { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
/* 第 12 轮：价格是全页唯一保留的大数字（17px/600），其余一律小字常规 */
.vc-price { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
.vc-price-note { font-size: 12px; color: var(--text-secondary); }
.vc-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 12px; padding-top: 10px; border-top: 0.5px dashed var(--separator); }
.vc-meta-item { min-width: 0; }
.vc-meta-label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 2px; }
.vc-meta-value { font-size: 12px; font-weight: 400; color: var(--text-primary); line-height: 1.45; word-break: break-all; }
.vc-meta-item.wide { grid-column: 1 / -1; }
.vc-meta-item.wide .vc-meta-value { color: var(--text-secondary); font-weight: 400; font-size: 12px; }
.vc-feel { margin-top: 12px; padding-top: 12px; border-top: 0.5px dashed var(--separator); }
.vc-stars { font-size: 14px; line-height: 1.2; }
.vc-tags { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.vc-note { font-size: 12px; color: var(--text-secondary); margin-top: 4px; font-style: italic; line-height: 1.5; }
.vc-foot { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
/* 第 11 轮：品牌名右侧的「💕感受 / 🚮弃用」—— 与名字并排，轻量不抢视线 */
.vc-head-btn { font-size: 11px; padding: 3px 8px; font-weight: 500; flex-shrink: 0; border-radius: 8px; }
.vc-head-btn-mute { color: var(--text-tertiary); }
/* 第 11 轮：感受区块标题行（标题 + 🪄编辑 / 🗑️删除） */
.vc-feel-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }

@media (prefers-color-scheme: dark) {
  .variant-card.vc-using { border-color: var(--orange); }
}

/* ========== 表单 ========== */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 13px; color: var(--text-secondary); font-weight: 600; margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--separator); background: var(--card-bg);
  font-size: 15px; font-family: var(--font); color: var(--text);
  outline: none; transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: none; min-height: 60px; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

/* 开关（开袋即使用） */
.switch { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider {
  position: absolute; cursor: pointer; inset: 0;
  background: var(--separator); border-radius: 26px;
  transition: background 0.2s;
}
.switch .slider::before {
  content: ''; position: absolute; height: 20px; width: 20px;
  left: 3px; bottom: 3px; background: #fff; border-radius: 50%;
  transition: transform 0.2s;
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(20px); }

/* 图片上传 */
.photo-upload {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.photo-slot {
  aspect-ratio: 1; border-radius: var(--radius-sm);
  border: 2px dashed var(--separator); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: var(--text-tertiary);
  cursor: pointer; overflow: hidden; position: relative;
}
.photo-slot img { width: 100%; height: 100%; object-fit: cover; }
.photo-slot.has-photo { border-style: solid; border-color: var(--separator); }
.photo-slot .remove-photo {
  position: absolute; top: 4px; right: 4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,0.5); color: #fff;
  border: none; font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ========== 搜索栏 ========== */
.search-bar {
  position: relative; margin-bottom: 12px;
}
.search-bar input {
  width: 100%; padding: 10px 14px 10px 36px;
  border-radius: 10px; border: none;
  background: rgba(118,118,128,0.12);
  font-size: 15px; font-family: var(--font); outline: none;
}
.search-bar .search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 16px; color: var(--text-tertiary);
}

/* ========== 分类标签 ========== */
.cat-tabs {
  display: flex; gap: 8px; margin-bottom: 14px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 2px 0;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  flex-shrink: 0; padding: 6px 14px; border-radius: 16px;
  background: var(--card-bg); font-size: 14px; font-weight: 500;
  color: var(--text-secondary); cursor: pointer;
  border: 1.5px solid transparent; transition: all 0.2s;
  -webkit-user-select: none; user-select: none;
  display: flex; align-items: center; gap: 4px;
}
.cat-tab:active { transform: scale(0.95); }
.cat-tab.active { background: var(--accent); color: #fff; }

/* ========== 弹窗 ========== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center;
  overflow: hidden;
  overscroll-behavior: contain;
  touch-action: pan-y;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card-bg); border-radius: 20px 20px 0 0;
  width: 100%; max-width: 600px; max-height: 90vh;
  overflow-x: hidden; overflow-y: auto;
  padding: 20px 16px 30px;
  animation: slideUp 0.3s ease;
  box-sizing: border-box;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
  width: 36px; height: 5px; border-radius: 3px;
  background: var(--text-tertiary); margin: 0 auto 16px;
}
.modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; text-align: center; }

/* ========== 空状态 ========== */
.empty-state {
  text-align: center; padding: 40px 20px;
  color: var(--text-tertiary);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .empty-text { font-size: 15px; }

/* ========== 准备池 ========== */
.pool-item {
  background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px; margin-bottom: 10px;
}
.pool-item .pool-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 8px;
}
.pool-item .pool-name { font-size: 15px; font-weight: 600; }
.pool-item .pool-meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.pool-item .pool-warn {
  background: rgba(255,149,0,0.1); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; color: var(--orange);
  margin-top: 8px; font-weight: 600;
}
.pool-item .pool-ok {
  background: rgba(52,199,89,0.1); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; color: var(--green);
  margin-top: 8px; font-weight: 600;
}
.pool-item .pool-actions { display: flex; gap: 8px; margin-top: 10px; }
.pool-status {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  font-size: 11px; font-weight: 600;
}
.status-pending { background: rgba(255,149,0,0.15); color: var(--orange); }
.status-decided { background: rgba(0,122,255,0.15); color: var(--accent); }
.status-given-up { background: rgba(142,142,147,0.15); color: var(--text-secondary); }
.status-win { background: rgba(255,179,0,0.18); color: #B8860B; }

/* ========== 任务委托 ========== */
.task-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
.task-tab { flex: 1; text-align: center; padding: 9px 4px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--text-secondary); background: var(--bg); border: 1.5px solid transparent; cursor: pointer; transition: transform .12s; }
.task-tab:active { transform: scale(0.96); }
.task-banner { border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 14px; line-height: 1.4; }
.task-banner-sub { margin: -8px 0 14px; padding: 6px 12px; font-size: 11px; color: var(--text-secondary); background: rgba(255,149,0,0.10); border-radius: 8px; line-height: 1.4; }
.task-banner-sub:empty { display: none; }
.task-banner.orange { background: linear-gradient(135deg,#FF9500,#FFB340); }
.task-banner.green { background: linear-gradient(135deg,#34C759,#5AD680); }
.task-toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
.task-tool-btn { padding: 7px 12px; border-radius: 10px; background: var(--bg); border: 1.5px solid var(--separator); font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; }
.task-tool-btn.on { border-color: var(--accent); color: var(--accent); }
.task-tool-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.task-toolbar .spacer { flex: 1; }
.task-search-row { margin-bottom: 12px; }
.task-back { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
.task-card.flipped .task-back { max-height: 3000px; }
.task-back-inner { padding-top: 10px; margin-top: 10px; border-top: 1px dashed var(--separator); }
.task-plan-row { display: flex; gap: 8px; align-items: flex-start; padding: 8px; background: var(--bg); border-radius: 8px; margin-bottom: 8px; }
.task-plan-row .pp-name { font-weight: 600; font-size: 14px; }
.task-calc-label { font-size: 12px; color: var(--accent); margin-bottom: 8px; cursor: pointer; }
.task-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--separator); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; cursor: pointer; }
.task-card.selon { border: 2px solid var(--accent); }
.task-card.selon .task-check { background: var(--accent); border-color: var(--accent); }
.task-selbar { position: sticky; bottom: 0; display: flex; gap: 10px; align-items: stretch; padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--card-bg); border-top: 1.5px solid var(--separator); border-radius: 14px 14px 0 0; box-shadow: 0 -4px 16px rgba(0,0,0,0.08); margin-top: 10px; }
.task-selbar .spacer { flex: 1; }
.task-selbar .btn { flex: 1; min-width: 0; white-space: nowrap; padding: 11px 8px; font-size: 14px; font-weight: 700; border-radius: 12px; justify-content: center; }
.task-selbar .task-tool-btn { flex-shrink: 0; padding: 11px 14px; font-size: 14px; }
.task-plan-row .pp-buy { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: rgba(52,199,89,0.12); color: var(--green); margin-left: 4px; }
.task-plan-row .pp-buy.off { background: rgba(142,142,147,0.12); color: var(--text-tertiary); }
.task-plan-row .pp-buy.tap { cursor: pointer; border: 1px dashed currentColor; }
/* 出击选择弹窗的方案勾选条 */
.strike-plan { display: flex; gap: 10px; align-items: flex-start; padding: 10px; background: var(--bg); border-radius: 10px; margin-bottom: 8px; cursor: pointer; border: 1.5px solid transparent; }
.strike-plan.on { border-color: var(--accent); background: rgba(52,199,89,0.07); }
.strike-plan input { margin-top: 2px; width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--accent); }

/* ========== 开封按钮 ========== */
.open-btn {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 12px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #FF9500, #FFB340);
  color: #fff; font-size: 15px; font-weight: 700;
  border: none; cursor: pointer; width: 100%;
  transition: transform 0.1s;
}
.open-btn:active { transform: scale(0.97); }
.open-btn.done { background: linear-gradient(135deg, #34C759, #5AD680); }

/* ========== 评分星星 ========== */
.stars { display: flex; gap: 2px; }
.star { font-size: 20px; color: var(--text-tertiary); cursor: pointer; -webkit-user-select: none; user-select: none; }
.star.filled { color: var(--yellow); }

/* ========== 标签 ========== */
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  padding: 4px 10px; border-radius: 12px;
  font-size: 12px; font-weight: 500;
  background: rgba(0,122,255,0.1); color: var(--accent);
  cursor: pointer; -webkit-user-select: none; user-select: none;
}
.tag.selected { background: var(--accent); color: #fff; }

/* ========== 设置页 ========== */
.setting-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; background: var(--card-bg);
  border-bottom: 0.5px solid var(--separator);
  cursor: pointer;
}
.setting-row:last-child { border-bottom: none; }
.setting-row:active { background: var(--bg); }
.setting-row .setting-label { font-size: 15px; }
.setting-row .setting-value { font-size: 14px; color: var(--text-secondary); }

.setting-group {
  background: var(--card-bg); border-radius: var(--radius);
  overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow);
}

/* ========== Toast ========== */
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  z-index: 400; background: rgba(0,0,0,0.8);
  color: #fff; padding: 10px 20px; border-radius: 20px;

  opacity: 0; transition: opacity 0.3s, transform 0.3s;
  pointer-events: none; white-space: nowrap;
}

/* 倒计时圆环 */

  width: 60px; height: 60px; position: relative;
  display: flex; align-items: center; justify-content: center;
}

/* ========== 工具栏 ========== */

  display: flex; gap: 8px; margin-bottom: 12px;
  overflow-x: auto; scrollbar-width: none;
}
.toolbar::-webkit-scrollbar { display: none; }

/* ========== 板块选择卡 ========== */

  background: var(--card-bg); border-radius: var(--radius);

<script>
/* ================================================================
   家有 App - 核心逻辑
   ================================================================ */


// ========== 数据层 ==========
var DB = {
  zones: [],
  tasks: [],
  yearStats: {},
  settings: {},
  version: 1
};

// 板块类型: consumable(补给品) / durable(耐用品)
// ========== IndexedDB 存储（iOS PWA 更可靠） ==========
var DB_NAME = 'jiayou_app_db';
var STORE_NAME = 'data';
var dbPromise = null;

function initIndexedDB() {
  return new Promise(function(resolve) {
    if (dbPromise) { resolve(dbPromise); return; }
    if (!window.indexedDB) { resolve(null); return; }
    // 超时兜底：iOS 在站点存储被系统清理/损坏后，indexedDB.open 可能既不触发
    // onsuccess 也不触发 onerror（永久挂起），把整个启动序列卡死在
    // 「await loadDB()」上 —— 表现为页面空白。
    // 3.5 秒没响应就放弃 IndexedDB，降级 localStorage 继续启动。
    var settled = false;
    var timer = setTimeout(function() {
      if (!settled) { settled = true; console.error('IndexedDB打开超时(3.5s)，降级localStorage'); resolve(null); }
    }, 3500);
    var req = indexedDB.open(DB_NAME, 1);
    req.onerror = function() { console.error('IndexedDB打开失败'); if (!settled) { settled = true; clearTimeout(timer); resolve(null); } };
    req.onsuccess = function(e) { if (!settled) { settled = true; clearTimeout(timer); dbPromise = e.target.result; resolve(dbPromise); } };
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
  });
}

function saveDBIndexed() {
  return initIndexedDB().then(function(db) {
    if (!db) return Promise.reject('no db');
    return new Promise(function(resolve, reject) {
      try {
        var tx = db.transaction(STORE_NAME, 'readwrite');
        var store = tx.objectStore(STORE_NAME);
        var req = store.put(DB, 'jiayou_db');
        req.onsuccess = function() { resolve(); };
        req.onerror = function(e) { reject(e); };
      } catch(e) { reject(e); }
    });
  });
}

function loadDBIndexed() {
  return initIndexedDB().then(function(db) {
    if (!db) return Promise.resolve(null);
    return new Promise(function(resolve) {
      try {
        var tx = db.transaction(STORE_NAME, 'readonly');
        var store = tx.objectStore(STORE_NAME);
        var req = store.get('jiayou_db');
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function() { resolve(null); };
      } catch(e) { resolve(null); }
    });
  });
}

// ========== 存储管理 ==========
function saveDB() {
  try {
    var json = JSON.stringify(DB);
    // 主存：IndexedDB（容量大，可存数十MB）
    saveDBIndexed().catch(function(e) { console.error('IndexedDB保存失败', e); });
    // 次存：localStorage（5-10MB限制，存不下会失败但不阻塞）
    try { localStorage.setItem('jiayou_db', json); } catch(lsErr) { console.warn('localStorage保存失败', lsErr); }
  } catch(e) {
    console.error('saveDB错误:', e);
    if (e.name === 'QuotaExceededError') {
      toast('本地存储空间不足，请先导出备份并清理部分照片');
    } else {
      toast('存储失败: ' + e.message);
    }
  }
}

async function loadDB() {
  var loaded = false;
  var localRaw = null, idbData = null;
  // 先读 localStorage（5MB 限制可能失败）
  try {
    localRaw = localStorage.getItem('jiayou_db');
  } catch(e) { console.warn('读 localStorage 失败', e); }
  if (localRaw) {
    try {
      var parsed = JSON.parse(localRaw);
      if (parsed && parsed.zones && parsed.zones.length > 0) {
        DB = mergeDB(DB, parsed);
        loaded = true;
      }
    } catch(e) {
      console.warn('localStorage数据加载失败', e);
    }
  }
  // 再读 IndexedDB（容量大）
  try {
    idbData = await loadDBIndexed();
    if (idbData && idbData.zones && idbData.zones.length > 0) {
      var idbItemCount = idbData.zones.reduce(function(s,z){return s+(z.items?z.items.length:0);}, 0);
      var localItemCount = (DB.zones||[]).reduce(function(s,z){return s+(z.items?z.items.length:0);}, 0);
      if (idbItemCount > localItemCount) {
        DB = mergeDB(DB, idbData);
        loaded = true;
      } else if (!loaded) {
        DB = mergeDB(DB, idbData);
        loaded = true;
      }
    }
  } catch(e) { console.error('IndexedDB加载失败', e); }

  // 首次使用：创建默认板块
  if (!DB.zones || DB.zones.length === 0) {
    DB.zones = [
      {
        id: genId(), name: '补给品', type: 'consumable', icon: '🦦', theme: 'consumable',
        categories: [
          { id: genId(), name: '个护' },
          { id: genId(), name: '清洁' },
          { id: genId(), name: '食品' },
          { id: genId(), name: '药品' }
        ],
        items: []
      },
      {
        id: genId(), name: '角色外观库', type: 'durable', icon: '🐨', theme: 'durable',
        categories: [
          { id: genId(), name: '上衣' },
          { id: genId(), name: '裤子' },
          { id: genId(), name: '鞋' },
          { id: genId(), name: '包' }
        ],
        items: []
      },
      {
        id: genId(), name: '角色配件', type: 'durable', icon: '🦝', theme: 'durable2',
        categories: [
          { id: genId(), name: '戒指' },
          { id: genId(), name: '项链' },
          { id: genId(), name: '耳环' },
          { id: genId(), name: '手链' }
        ],
        items: []
      }
    ];
    // 注意：首次创建默认板块时不立即 saveDB，避免空默认数据覆盖已有真实数据
  }
}

function mergeDB(defaults, loaded) {
  var result = Object.assign({}, defaults, loaded);
  if (!result.settings) result.settings = defaults.settings;
  if (!result.zones) result.zones = [];
  if (!result.tasks) result.tasks = [];
  if (!result.yearStats) result.yearStats = {};
  // 防御：loaded.zones 为空数组但 defaults 有真实数据时，不能把本地数据冲成空
  // （浅合并 Object.assign 会让空数组覆盖本地，必须显式兜底）
  var defZones = (defaults && defaults.zones) || [];
  var defItems = defZones.reduce(function (s, z) { return s + ((z.items || []).length); }, 0);
  var resItems = (result.zones || []).reduce(function (s, z) { return s + ((z.items || []).length); }, 0);
  if (resItems === 0 && defItems > 0) result.zones = defZones;
  // 旧版「目标锁定」数据迁移为「任务委托」
  if (result.pool && !result.tasks.length) {
    migratePoolToTasks(result);
  }
  // 补给品套餐模型迁移（只增字段，零破坏：stock/totalPrice/price 原值不动）
  migrateConsumablePackages(result);
  // 规格两层结构迁移（packCount 包数 × packQty 每包含量 × content 每份规格）
  // 关键：旧数据可能存着旧单层结构（只有 qty/content），合并时必须就地升级，
  // 不能依赖调用方事后再补跑 —— 否则 specPackQty 读不到会退回默认 1 造成口径错乱
  migrateSpecTwoLayer(result);
  // 历史脏数据：表单内连续添加方案曾共用同一个 id，导致点任一方案只切换第一个 → 全局去重
  migrateTaskPlanIds(result);
  // 状态对账（关键）：从使用记录重新推导每个品牌的开封/用完状态，
  // 并剔除 0 天记录。这解决了「删了记录、卡片还卡在『使用中』、刷新重进也没用」
  // 这类幽灵状态 —— 因为存档/本地存的陈旧 opened 字段会在装载时被纠正回来。
  reconcileDBState(result);
  return result;
}

// 全库状态对账：遍历所有补给品板块的物品，重建 opened/usedUp 并清理 0 天记录
function reconcileDBState(db) {
  if (!db || !db.zones) return;
  db.zones.forEach(function (z) {
    if (!z || z.type !== 'consumable' || !z.items) return;
    z.items.forEach(function (it) {
      if (!it) return;
      // 先剔除 0 天等无效记录，再据记录重建状态
      purgeInvalidRecords(it);
      try { reconcileItemState(it); } catch (e) { console.warn('状态对账失败', e); }
    });
  });
}

// 方案 id 全局去重：任务内重复或缺失的 id 分配新 id（从全局最大 +1 递增），其余字段一律不动
function migrateTaskPlanIds(db) {
  var max = 0;
  (db.tasks || []).forEach(function (t) { (t.plans || []).forEach(function (p) { if (p.id > max) max = p.id; }); });
  (db.tasks || []).forEach(function (t) {
    var seen = {};
    (t.plans || []).forEach(function (p) {
      if (p.id == null || seen[p.id]) { p.id = ++max; }
      seen[p.id] = true;
    });
  });
}

// 旧 pool/poolHistory → 新 tasks（四态：待接/进行中/凯旋/搁置）
function migratePoolToTasks(db) {
  if (!db.pool) return;
  var used = {};
  (db.tasks || []).forEach(function (t) { used[t.id] = true; });
  function nid() { var x = 1; while (used[x]) x++; used[x] = true; return x; }
  function npid() { var x = 1; while (used['p' + x]) x++; used['p' + x] = true; return x; }
  var arr = [];
  (db.pool || []).forEach(function (p) { arr.push(legacyPoolToTask(p, false, nid, npid)); });
  (db.poolHistory || []).forEach(function (p) { arr.push(legacyPoolToTask(p, true, nid, npid)); });
  db.tasks = arr;
  delete db.pool;
  delete db.poolHistory;
}

function legacyPoolToTask(p, isHistory, nid, npid) {
  var status = isHistory ? '搁置' : (p.status === 'pending' ? '待接' : (p.status === 'decided' ? '进行中' : '搁置'));
  var plans = (p.variants || []).map(function (v) {
    var price = Math.round((+v.price || 0) * 100) / 100;
    return {
      id: npid(),
      name: v.brand || '未命名',
      amount: price,
      note: (v.reason || '') + '',
      status: 'open',
      pinned: false,
      comboPrice: price,
      qty: 1,
      spec: Math.round((+v.specQty || 0) * 100) / 100,
      unit: (v.specUnit || '') + '',
      photos: (v.photos || []).slice()
    };
  });
  var lockedPlanId = (status === '进行中' && plans.length) ? plans[0].id : null;
  if (status === '进行中' && plans[0]) plans[0].status = 'done';
  var createdAt = p.date ? String(p.date).slice(0, 10) : new Date().toISOString().slice(0, 10);
  return {
    id: nid(),
    name: p.name || '未命名',
    status: status,
    createdAt: createdAt,
    note: (p.notes || '') + '',
    lockedPlanId: lockedPlanId,
    plans: plans,
    zoneId: p.zoneId || null,
    categoryId: p.categoryId || null,
    photos: (p.photos || []).slice(),
    date: p.date || new Date().toISOString()
  };
}

// 补给品套餐模型迁移：只增字段，零破坏旧数据
// 字段约定：stock = 小单位总数（不变）；packQty=每套餐内含小单位数(默认1)；
// packCount=套餐数(默认=stock，packQty=1时等价)；packPrice=每套餐价(默认=totalPrice)；
// packUnit=小单位名；packWeight=每个小单位的含量(默认0)；packWeightUnit=含量单位(kg/g/ml/L，默认kg)；consumeMode=物品级消耗模式
function migrateConsumablePackages(db) {
  if (!db.zones) return;
  // 【第 13 轮 · 修 Bug】新四值模型（count/spec/instant/combo）绝不能被本迁移覆盖！
  // 旧逻辑「不是 pack/unit 就改写」会把用户保存好的四值模型（组合/件数/即时）
  // 在每次 loadDB/mergeDB 时一律打回 pack/unit，再被归一成 spec —— 这就是
  // 「明明改成了混合/组合模型，刷新后永远回到规格周期型」的根因。
  // 现在只对真正的旧值（pack/unit/缺省/乱值）做迁移，四值一律放行。
  var CM4 = { count: 1, spec: 1, instant: 1, combo: 1 };
  db.zones.forEach(function(zone) {
    if (zone.type !== 'consumable') return; // 仅补给品
    (zone.items || []).forEach(function(item) {
      // 物品级消耗模式：仅旧数据迁移 oneShot→unit（开袋即用完/小单位），其余→pack（套餐消耗）
      if (!CM4[item.consumeMode]) {
        item.consumeMode = (item.oneShot === true) ? 'unit' : 'pack';
      }
      (item.variants || []).forEach(function(v) {
        if (typeof v.packQty === 'undefined') v.packQty = 1;
        if (typeof v.packCount === 'undefined') v.packCount = (v.stock || 0); // packQty=1时等价
        if (typeof v.packPrice === 'undefined') v.packPrice = v.totalPrice || 0;
        if (typeof v.packUnit === 'undefined') v.packUnit = item.unit || '个';
        if (typeof v.packWeight === 'undefined') v.packWeight = 0;
        if (typeof v.packWeightUnit === 'undefined') v.packWeightUnit = 'kg';
        // stock / price / totalPrice 原值一律不动
      });
    });
  });
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

// ========== 子物品（品牌变体）辅助 ==========
// 库存摘要（人话版）：套餐数 + 容量，如「4套 · ≈200ml」；没有套餐数据则退回「200ml」
// ---------- 变体级混合规格：每个品牌（变体）自己可选，互不干扰 ----------
// 两层数量模型（新）：每个规格 = 包数(packCount) × 每包含量(packQty) × 每份规格(content) + 单位(unit)
//   例：姨妈巾 日用 3包 × 5片/包 × 1片/份 = 15片
// 兼容一层旧数据：没有 packCount/packQty 的规格视为 packCount=qty、packQty=1
//   → 洗衣凝珠 {qty:3, content:44} = 3包 × 1粒/包 × 44粒/份 = 132粒（数值不变）
function specPackCount(s) { // 规格的「包数」
  if (s.packCount !== undefined && s.packCount !== null && s.packCount !== '') return +s.packCount || 0;
  return +s.qty || 0; // 兼容一层旧数据
}
function specPackQty(s) { // 规格的「每包含量」
  var p = parseFloat(s.packQty);
  return (isFinite(p) && p > 0) ? p : 1; // 兼容一层旧数据；空 = 1
}
function specContentOf(s) { // 每份规格（如每片 1 片、每毫升 1ml）；留空/0 → 按 1（与保存口径一致）
  var c = parseFloat(s && s.content);
  return (isFinite(c) && c > 0) ? c : 1;
}
// 表单回显用：保留用户原本填的空字符串（空 = 按 1 计算，但不预填任何数字）
function specPackCountRaw(s) { if (s.packCount !== undefined && s.packCount !== null && s.packCount !== '') return s.packCount; return (s.qty !== undefined && s.qty !== null && s.qty !== '') ? s.qty : ''; }

function specTotalOf(s) { // 该规格总含量 = 包数 × 每包含量 × 每份规格
  return specPackCount(s) * specPackQty(s) * specContentOf(s);
}
function specPiecesOf(s) { // 该规格总件数（v1.7 双轨制件数口径）
  // 铁律：含量单位（ml/g/kg/L）1 包 = 1 件（绝不能拿 ml 数冒充件数）；
  //      片/粒类（每包含 N 片）件数 = 包数 × 每包含量。与 variantSpecPiecesCalc 保持一致。
  return isContentUnitText(s && s.unit) ? specPackCount(s) : specPackCount(s) * specPackQty(s);
}
function variantSpecsOf(v) {
  return ((v && v.specs) || []).filter(function (s) { return specPackCount(s) > 0 && (+s.packQty > 0 || +s.qty > 0 || +s.content > 0); });
}
function variantSpecContent(v) { // 总含量（库存口径）= Σ 各规格剩余包数 × 每包含量 × 每份规格
  var ss = variantSpecsOf(v); if (!ss.length) return 0;
  return variantSpecStockCalc(v);
}
function variantSpecPieces(v) { // 总件数（参考）= Σ 各规格剩余包数 × 每包含量
  var ss = variantSpecsOf(v); if (!ss.length) return 0;
  return variantSpecPiecesCalc(v);
}
function variantSpecUnit(v) {
  var ss = variantSpecsOf(v);
  return ss.length ? (ss[0].unit || '') : '';
}

// ===== 明细口径统一（v1.6）：specs = 单套构成，库存 = 剩余包数汇总 =====
// 语义约定：
//   specs[i]        = 「一套里装了什么」（单套构成），永不被套餐数折算写回
//   specs[i].openPacks = 该规格「已开出的包数」（跨套累计，唯一消耗来源）
//   v.packCount     = 购入套餐数（用户填写，消耗不改动，仅作记录/单价折算）
//   v.stock         = Σ 各规格「(套餐数 × 单套包数 − 已开包数) × 每包含量 × 每份规格」
// 购入套餐数：留空按 1；填 0 就是 0
function variantPacksBought(v) {
  var raw = (v && v.packCount !== undefined && v.packCount !== null) ? String(v.packCount) : '';
  if (raw === '') return 1;

  return isFinite(n) ? n : 0;
}
// 单套构成合计（含量）：Σ 每种规格 = 包数 × 每包含量 × 每份规格
function variantSpecPerSet(v) {
  var ss = variantSpecsOf(v); if (!ss.length) return 0;
  var t = 0; ss.forEach(function (s) { t += specTotalOf(s); });
  return Math.round(t * 100) / 100;
}
// 单套构成合计（件数/包数）
function variantSpecPerSetPieces(v) {
  var ss = variantSpecsOf(v); if (!ss.length) return 0;
  var t = 0; ss.forEach(function (s) { t += specPiecesOf(s); });
  return Math.round(t * 100) / 100;
}
// 是否有明细（有明细 = 父级规格行由明细接管）
// 注意：用「明细行数」判定，而不是「有效明细」——刚点【＋ 添加规格】还没填数字时，
// 父级规格行就应该立刻隐藏/变灰（用户心智：我已经决定用明细来描述这套装什么了）
function variantHasSpecs(v) {
  return !!((v && v.specs && v.specs.length) || variantSpecsOf(v).length);
}

// ===== 明细消耗层（v1.6）=====
// specs[i].packCount = 单套内该规格的包数（构成，永不改）
// specs[i].openPacks = 该规格「已开出的包数」（跨套累计，仅用于算剩余）
// v.packCount        = 购入套餐数（记录，不随消耗变化）
// 剩余包数(spec)     = 购入套餐数 × 单套内包数 − 已开包数
// 剩余库存           = Σ_spec 剩余包数 × 每包含量 × 每份规格    ← 精确，不依赖「套」的凑整
// 剩余套数           = min_spec (剩余包数 ÷ 单套内包数)         ← 展示用，小数保留
function specOpenPacks(s) { var n = parseFloat(s && s.openPacks); return isFinite(n) && n > 0 ? n : 0; }
// 某规格剩余未开包数（购买总量口径）
function specPacksRemaining(v, s) {
  var perSet = specPackCount(s);
  var boughtTotal = variantPacksBought(v) * perSet;
  return Math.round(Math.max(0, boughtTotal - specOpenPacks(s)) * 100) / 100;
}
// 该变体剩余套数（min 各规格的「剩余包数 ÷ 单套内包数」）
function variantPacksLeftCalc(v) {
  var ss = variantSpecsOf(v); if (!ss.length) return 0;
  var m = Infinity;
  ss.forEach(function (s) {
    var perSet = specPackCount(s);
    if (perSet <= 0) return;
    var r = specPacksRemaining(v, s) / perSet;
    if (r < m) m = r;
  });
  return isFinite(m) ? Math.round(m * 100) / 100 : 0;
}
// 该变体剩余总含量（= Σ 各规格剩余包数 × 每包含量 × 每份规格）
function variantSpecStockCalc(v) {
  var ss = variantSpecsOf(v); if (!ss.length) return 0;
  var t = 0;
  ss.forEach(function (s) {
    t += specRemainContent(v, s);
  });
  return Math.round(t * 100) / 100;
}
// 该变体剩余总件数。v1.7 双轨制：1 包 = 1 件（份）——
// 含量单位（ml/g/kg/L）的规格，件数就是剩余包数（绝不能拿 ml 数冒充件数）；
// 片/粒类（每包含 N 片）件数 = 剩余包数 × 每包含量（片数），保持旧口径。
function variantSpecPiecesCalc(v) {
  var ss = variantSpecsOf(v); if (!ss.length) return 0;
  var t = 0;
  ss.forEach(function (s) {
    t += specRemainPieces(v, s);
  });
  return Math.round(t * 100) / 100;
}

// ===== 【第 13 轮】即时消耗型 × 规格明细：按规格打卡扣减 =====
// specs[i].usedQty = 该规格「已消耗份数」：
//   片/粒类（每包含 N 片）：1 份 = 1 片 → 剩余 = 剩余包数×每包含量 − usedQty
//   含量单位（ml/g/kg/L）：1 份 = 1 包 → 消耗直接记 openPacks（usedQty 恒 0）
// 兼容：旧数据 usedQty 缺失 → 0；组合消耗型走 openPacks 口径，完全不受影响。
function specUsedQty(s) {
  var n = parseFloat(s && s.usedQty);
  return (isFinite(n) && n > 0) ? n : 0;
}
// 该规格剩余「件数」（片/粒类 = 片数；含量单位 = 包数）
function specRemainPieces(v, s) {
  if (isContentUnitText(s && s.unit)) {
    return Math.max(0, Math.round(specPacksRemaining(v, s) * 100) / 100);
  }
  var total = specPacksRemaining(v, s) * specPackQty(s);
  return Math.max(0, Math.round((total - specUsedQty(s)) * 100) / 100);
}
// 该规格剩余「含量」（片/粒类还要乘每份规格 content；含量单位同包数口径）
function specRemainContent(v, s) {
  var base = specPacksRemaining(v, s) * specPackQty(s) * specContentOf(s);
  if (isContentUnitText(s && s.unit)) {
    return Math.max(0, Math.round(base * 100) / 100);
  }
  return Math.max(0, Math.round((base - specUsedQty(s) * specContentOf(s)) * 100) / 100);
}

// ===== v1.7 双轨制：单一规格 / 混合规格 =====
// 单一规格（明细只有 1 行）：1 份 = 实际容量（如 400ml/份）。
// 混合规格（明细 ≥ 2 行）：均值单件容量 = 总容量 ÷ 总件数（1520ml ÷ 4 件 = 380ml/份），
//   均值只用于「年度采购决策」和「份数折算展示」；开封/消耗永远按实际所选规格容量。
function variantIsMixed(v) {
  return variantSpecsOf(v).length > 1;
}
// 【第 19 轮】单/多规格判定：看「容量多样性」，绝不用物理件数/套餐数判断。
//   ① 规格 ≤1 行 → 单一规格（哪怕套餐数/内部包数填了 2，只要容量一致就按单件容量算）；
//   ② 多行但所有规格容量(含单位)完全相同 → 仍视为单一规格；
//   ③ 多行且存在容量差异 → 多规格（速率/采购必须穿透到具体规格，绝不用整套均值或总量）。
//   ④ 没有规格明细 → 退化为单一规格（按单件容量算），杜绝「整套餐均值」乱算。

function variantAvgPiece(v) {

// 物品级均值：取第一个有明细的变体（同物品各变体单位一致）
// 规格行展示文本："日用 3包×5片 = 15片"
function specLineText(s) {

}
function variantSpecText(v) { // "日用 3包×5片 = 15片 + 夜用 2包×3片 = 6片 = 21片/套"
  var ss = variantSpecsOf(v); if (!ss.length) return '';

function stockSummaryOf(item) {
  // 【第 19 轮 · 即时消耗】即时型的消耗标的物永远是规格单位（片/粒/包/个/份），
  // 容量(ml/g)对其无意义 —— 每次用就是"用一个"，与容量无关。
  // 故库存只报"还能再用多少次（份/包）"，绝不显示容量、绝不算套餐数。
  if (consumeModelOf(item) === 'instant') {
    return round1(instantTotalStock(item)) + instantStockUnit(item);
  }
  var vs = (item.variants && item.variants.length) ? item.variants : [];
  var packs = 0, hasPacks = false, hasCombo = false, comboSpecPieces = 0, comboSetsBought = 0;
  var wTotals = {}, wOrder = [];
  vs.forEach(function(v) {
    if (variantSpecsOf(v).length) {
      // 组合消耗型④：库存是「子规格剩余片数」，主口径按片展示；
      // 另记下「购入套数」做辅助说明（v.packCount = 总套餐数，不随消耗变化）
      hasCombo = true;
      comboSpecPieces += variantSpecContent(v);
      comboSetsBought += (parseFloat(v.packCount) || 0);
      var cu = variantSpecUnit(v);
      if (cu) {
        if (!wTotals[cu]) { wTotals[cu] = 0; wOrder.push(cu); }
        wTotals[cu] += variantSpecContent(v);
      }
      return;
    }
    // 单规格：整套数按「剩余 ÷ 每套含」算（购买套数会随消耗失真），如 3支/10支每套 → 0 整套
    var pq = parseFloat(v.packQty) || 1;
    if (v.packCount && pq > 1) { packs += Math.max(0, Math.floor((v.stock || 0) / pq)); hasPacks = true; }

    var sc = variantStockContent(v);
    if (sc !== null && sc > 0) {
      var u = weightUnitOf(v);
      if (!wTotals[u]) { wTotals[u] = 0; wOrder.push(u); }
      wTotals[u] += sc;

  // 组合消耗型：主口径 = 剩余含量（如 1520ml），并按均值折算「约 N 份」；
  // 「原 N 套」仅作购买记录补充说明（v1.7 双轨制：份 = 含量 ÷ 均值单件容量）
  if (hasCombo) {
    var cuMain = wOrder[0] || (item.unit || '件');
    var totalC = round1(comboSpecPieces);
    var head = totalC + cuMain;
    // 均值折算份数：优先取本物品首个有明细变体的均值
    var avgS = 0;
    vs.forEach(function (v) { if (!avgS && variantSpecsOf(v).length) { var a = variantAvgPiece(v); if (a > 0) avgS = a; } });
    if (avgS > 0 && totalC > 0) head += '（约 ' + round1(totalC / avgS) + ' 份）';
    if (comboSetsBought > 0) head += ' · 原 ' + trimNum(comboSetsBought) + ' 套';
    return head;
  }

  var unit = mainPackUnit(item);
  var capTxt = st > 0 ? (round1(st) + unit) : '';

  // 含量单位若与容量单位相同（混合规格下容量就是含量），不再重复显示
  var wTxt = '';
  var wParts = wOrder.filter(function(u) { return u !== unit; }).map(function(u) { return '≈' + round1(wTotals[u]) + u; });
  if (wParts.length) wTxt = ' · ' + wParts.join(' · ');

    // 每套=1 时容量数和套数是同一个数，说了等于没说 → 只显示套数
    if (capTxt && Math.round(st) !== packs) return packs + '套 · ' + capTxt + wTxt;
    return packs + '套' + wTxt;

function getTotalStock(item) {
  if (item.variants && item.variants.length > 0) {
    return item.variants.reduce(function(s, v) { return s + (v.stock || 0); }, 0);
  }
  return item.stock || 0;
}
// 【第 19 轮 · 即时消耗】即时型消耗标的物永远是「规格单位」（片/粒/包/个/份），
// 绝不按容量(ml/g)计算与显示。容量对本模型无意义：每次用就是"用一个"，与容量大小无关。
// 因此即时型的"剩余库存"= 还能再用多少次（份/包计数），而非含量。
// 【第 20 轮】加总口径 = specRemainPieces（剩余「件数」：片类=片数、g/ml 类=包数），
//   绝不直接用 specPacksRemaining（那是剩余「包数」，面膜 3 包会被错显示成"3片"）。
function instantTotalStock(item) {
  if (!item) return 0;
  var vs = (item.variants && item.variants.length) ? item.variants : [];
  if (!vs.length) return (parseFloat(item.stock) || 0);
  var t = 0;
  vs.forEach(function (v) {
    if (variantSpecsOf(v).length) {
      variantSpecsOf(v).forEach(function (s) { t += specRemainPieces(v, s); });
    } else {
      t += (parseFloat(v.stock) || 0);
    }
  });
  return Math.round(t * 100) / 100;
}
// 【第 20 轮】即时型日常扣减的「计数单位」（按钮/库存/速率统一用它）：
//   ① 规格单位全是片/粒/包/个等计数单位且一致 → 直接用（面膜 → 1片）；
//   ② 规格单位含 g/kg/ml/L → 1 份 = 1 包，日常只按「包」扣减显示（热泡茶 → 1包），
//      容量仅作为年度汇总/采购建议的后台基数，绝不出现在日常扣减 UI 上；
//   ③ 计数单位不一致（片+粒混填）→ 统一叫「份」；无任何单位 → 「份」。
// 有效库存：排除标记了「不再买」的品牌（它们不算进补货提醒）
function getActiveStock(item) {
  if (item.variants && item.variants.length > 0) {
    return item.variants.filter(function(v) { return !v.noRestock; }).reduce(function(s, v) { return s + (v.stock || 0); }, 0);
  }
  return item.stock || 0;
}

// ===== 「已用完」的统一判断 + 历史脏数据自愈 =====
// 正常流程下 usedUp=true 时库存必为 0。但旧版本点「用完了」只写 usedUp=true、
// 不清库存（如牙膏剩 3 支却被折叠进已用完区），留下矛盾状态。
// 判断规则：usedUp 且确实没有剩余库存才算「已用完」；
// 「开封即用完」的一次性物品（oneShot）开封后即使还有库存也算用完（其本身语义如此）。
function isVariantDone(v, item) {
  if (!v.usedUp) return false;
  if ((parseFloat(v.stock) || 0) > 0 && !(item && isOneShotItem(item))) return false;
  return true;
}
// 数据自愈：启动时把「标记了用完但仍有库存」的普通变体恢复为待开封
function migrateDirtyUsedUp() {
  var fixed = 0;
  DB.zones.forEach(function(zone) {
    (zone.items || []).forEach(function(item) {
      if (!item.variants || !item.variants.length) return;
      var touched = false;
      item.variants.forEach(function(v) {
        if (v.usedUp && (parseFloat(v.stock) || 0) > 0 && !v.noRestock && !isOneShotItem(item)) {
          v.usedUp = false; v.finishDate = null; v.opened = false;
          touched = true; fixed++;
        }
      });
      if (touched) syncItemFromVariants(item);
    });
  });
  if (fixed) {
    saveDB();
    console.log('[自愈] 修复了 ' + fixed + ' 个「已用完但仍有库存」的变体 → 待开封');
  }
  return fixed;
}

// 数据自愈②：多规格变体的「套数」口径统一（v1.6：明细 = 单套构成）
// 旧版落账把规格份数和写进 packCount（如姨妈巾显示成「67套 × ¥45.34」、库存只算一套 67片）
// v1.6 起：specs 恒为「单套构成」，库存 = Σ 各规格(套餐数 × 单套包数 − 已开包数) × 每包含量 × 每份规格
//   存量明细无法可靠判断是「单套构成」还是「全部总量」→ 一律保守按「全部总量」处理：
//   packCount 归 1 批（1 套 = 全部总量，库存数值完全不变），并标记 specsFolded=true。
//   这样旧数据在展示与消耗上自洽；用户重新编辑保存时，填上真实套餐数即可切换成「单套构成」口径。
function migrateSpecPacks() {
  var marked = 0;
  DB.zones.forEach(function(zone) {
    (zone.items || []).forEach(function(item) {
      if (!item.variants || !item.variants.length) return;
      var touched = false;
      item.variants.forEach(function(v) {
        var sp = variantSpecsOf(v);
        if (!sp.length) return;
        // 已开包数归零（新字段，旧数据没有）
        (v.specs || []).forEach(function (s) { if (typeof s.openPacks === 'undefined') s.openPacks = 0; });
        if (v.specsFolded) return;
        v.packCount = 1;
        v.packQty = Math.round(variantSpecPerSetPieces(v) * 100) / 100;
        v.packWeight = 1;
        v.packUnit = sp[0].unit || v.packUnit;
        v.packWeightUnit = sp[0].unit || v.packWeightUnit;
        v.specsFolded = true;
        marked++;
        touched = true;
      });
      if (touched) syncItemFromVariants(item);
    });
  });
  if (marked) {
    saveDB();
    console.log('[自愈] 多规格口径：统一标记 ' + marked + ' 个变体为「1 套 = 全部总量」');
  }
  return marked;
}

// ===== 【第 24 轮】两模型 —— 世界上只有两种消耗方式 =====
//   period  周期型：点【开启】开一包 → 点【用完】手动闭环（面霜、猫粮、洗发水、姨妈巾…）
//   instant 即时型：点【消耗】扣数字 → 归零自动闭环，0 时按钮置灰（面膜、棉片…）
// 旧四模型（count / spec / combo）一律归并为 period：它们的差别只是「单位叫什么」，
// 而 R24 里单位已是纯文本，无需再用模型去区分口径。
var CONSUME_MODELS = {
  period:  { key: 'period',  icon: '🧴', name: '周期型', desc: '点【开启】开一包，用完了点【用完】闭环（面霜、猫粮、洗发水、姨妈巾）' },
  instant: { key: 'instant', icon: '🧻', name: '即时型', desc: '点【消耗】扣数字，归零自动闭环、按钮置灰（面膜、棉片、一次性内裤）' }
};
function consumeModelOf(item) {
  if (!item) return 'period';
  var m = item.consumeMode;
  if (m === 'instant') return 'instant';
  if (m === 'period' || m === 'count' || m === 'spec' || m === 'combo') return 'period';
  // 旧值兼容：oneShot=true 是最强信号（开封即用完）→ 即时型
  if (item.oneShot === true) return 'instant';
  if (m === 'unit') return 'period';
  return 'period';
}
// 迁移：specs 从一层(qty×content)升级为两层(packCount包数 × packQty每包含量 × content每份规格)
// 原则：库存数值必须不变 —— qty=3,content=44 → packCount=3,packQty=1,content=44（3×1×44=132，与旧值一致）
function migrateSpecTwoLayer(target) {
  var db = target || DB;
  if (!db || !db.zones) return 0;
  var fixed = 0;
  db.zones.forEach(function(zone) {
    (zone.items || []).forEach(function(item) {
      if (!item.variants || !item.variants.length) return;
      var touched = false;
      item.variants.forEach(function(v) {
        (v.specs || []).forEach(function(s) {
          if (s.packCount === undefined || s.packCount === null) {
            s.packCount = +s.qty || 0;                 // 旧 qty → 包数
            if (s.packQty === undefined || s.packQty === null || s.packQty === '') s.packQty = 1;
            if (s.content === undefined || s.content === null || s.content === '') s.content = 1;
            fixed++; touched = true;
          }
          // 保留 qty 字段做兼容读取（旧代码路径），但以 packCount 为准
        });
      });
      // consumeMode 归一（写入四值之一，避免每次都要跑兼容分支）
      var want = consumeModelOf(item);
      if (item.consumeMode !== want) { item.consumeMode = want; touched = true; }
      if (touched) syncItemFromVariants(item);
    });
  });
  if (fixed && typeof DB !== 'undefined' && db === DB) {
    saveDB();
    console.log('[自愈] 规格两层结构：迁移 ' + fixed + ' 条规格明细（库存数值不变）');
  }
  return fixed;
}

// 数据自愈③：清洗「件数单位」字段
// 套餐内单位（packUnit）语义 = 包/瓶/支这类件数单位；旧版表单曾把它和「规格单位」混填，
// 存量数据里出现 packUnit='ml' → 显示成「2ml/套 × 30ml/ml」「当前库存 1 套（2ml）」「告急阈值 1ml」
// → 清掉含量单位值，显示层由 packQtyUnitOf/mainPackUnit 回退「包」；同时把用户显式填的 packQtyUnit 保住
function migratePackUnit(target) {
  var db = target || DB;
  if (!db || !db.zones) return 0;
  var fixed = 0;
  db.zones.forEach(function(zone) {
    (zone.items || []).forEach(function(item) {
      if (!item.variants || !item.variants.length) return;
      item.variants.forEach(function(v) {
        if (v.packUnit && isContentUnitText(v.packUnit)) {
          v.packUnit = '';
          // 若没有显式的件数单位，给「包」兜底（保存后显示稳定，不再依赖回退链）
          if (!v.packQtyUnit) v.packQtyUnit = '包';
          fixed++;
        }
        // packQtyUnit 本身若被填成含量单位（手滑），同样纠正
        if (v.packQtyUnit && isContentUnitText(v.packQtyUnit)) { v.packQtyUnit = '包'; fixed++; }
      });
    });
  });
  if (fixed && typeof DB !== 'undefined' && db === DB) {
    saveDB();
    console.log('[自愈] 件数单位：清洗 ' + fixed + ' 个变体被误填成含量单位（ml/g/kg）的套餐内单位');
  }
  return fixed;
}

// ===== 套餐模型展示辅助 =====
// 变体「购买总量」含量（用于折算单价，不随消耗变化）
//   混合规格 = 套餐数 × 单套构成合计
function variantTotalWeight(v) {
  if (variantSpecsOf(v).length) {
    return Math.round(variantPacksBought(v) * variantSpecPerSet(v) * 100) / 100;
  }
  var w = parseFloat(v.packWeight) || 0;
  if (w <= 0) return 0;
  var pc = parseFloat(v.packCount) || 0;
  var pq = parseFloat(v.packQty) || 1;
  return pc * pq * w;
}
// 含量单位：默认 kg（兼容旧数据未存该字段的情况）
function weightUnitOf(v) { return v.packWeightUnit || 'kg'; }
// 变体当前剩余含量：混合规格走明细汇总；普通变体 = 剩余件数(stock) × 每小单位含量(packWeight)
// 注意区分 variantTotalWeight（购买总量，用于折算单价）；这里算的是「现在还剩多少」
// 没配含量（packWeight 缺失）→ null（无法折算）
function variantStockContent(v) {
  if (variantSpecsOf(v).length) return variantSpecContent(v);
  var w = parseFloat(v.packWeight) || 0;
  if (w <= 0) return null;
  return Math.round(((parseFloat(v.stock) || 0) * w) * 100) / 100;
}
// 物品当前总剩余含量：每个变体都能折算含量才返回总数；任一变体没配含量 → null
function itemStockContent(item, onlyVariants) {
  var vs = (onlyVariants && onlyVariants.length) ? onlyVariants : (item.variants || []);
  if (!vs.length) return null;
  var t = 0;
  for (var i = 0; i < vs.length; i++) {
    var c = variantStockContent(vs[i]);
    if (c === null) return null;
    t += c;
  }
  return Math.round(t * 100) / 100;
}
// ===== 【第 24 轮】比价：套餐总价 ÷ 总容量，单位原样引用，绝不换算 =====
// 总容量 = Σ over 规格明细 (套餐数 × 该规格包数 × 每包含量)
//   例：3 套 ×（日用 2包×5片 + 护垫 1包×5片）= 3 × 15 = 45 片
// 单价   = 套餐总价 ÷ 总容量
// 显示   = 「每 片 约 1.02 元」—— 单位就是用户自己填的那个词，系统不做任何 ml↔L / g↔kg 折算
function variantOneSetCapacity(v) {   // 单套（一份套餐）的总容量
  var sp = variantSpecsOf(v);
  if (sp.length) {
    var t = 0;
    sp.forEach(function (s) { t += specPackCount(s) * specPackQty(s) * specContentOf(s); });
    return { qty: Math.round(t * 100) / 100, unit: String(sp[0].unit || '').trim() };
  }
  var w = parseFloat(v.packWeight) || 0;
  var pq = parseFloat(v.packQty) || 1;
  if (w > 0) return { qty: Math.round(pq * w * 100) / 100, unit: weightUnitOf(v) };
  return { qty: Math.round(pq * 100) / 100, unit: packQtyUnitOf(v) };
}
function variantBoughtCapacity(v) {   // 历史累计购入总容量 = 套餐数 × 单套容量
  var one = variantOneSetCapacity(v);
  return { qty: Math.round(one.qty * variantPacksBought(v) * 100) / 100, unit: one.unit };
}
  // 兼容旧名
function variantUnitPrice(v) {        // 单价（每单位多少钱）；无法计算 → null
  var cap = variantBoughtCapacity(v);
  var tp = parseFloat(v.totalPrice);
  if (!(tp > 0)) tp = (parseFloat(v.price) || 0) * (parseFloat(v.packCount) || 1) * (parseFloat(v.packQty) || 1);
  if (!(cap.qty > 0) || !(tp > 0)) return null;
  return tp / cap.qty;
}
// 比价文本：「每 片 约 1.02 元」
function unitPriceTextOf(v) {
  var up = variantUnitPrice(v);
  if (up === null || !isFinite(up)) return '';
  var cap = variantBoughtCapacity(v);
  var u = cap.unit || '份';
  var shown = up < 0.01 ? up.toFixed(4) : (up < 1 ? up.toFixed(3) : up.toFixed(2));
  return '每 ' + u + ' 约 ' + trimNum(parseFloat(shown)) + ' 元';
}
// 库存展示文本：packQty>1 时显示"X套 (+余Y个)"
function variantPackText(v, item) {
  // 【第 19 轮 · 即时消耗】即时型绝不显示容量：剩余 = 还能再用多少次（份/包），按规格单位计数
  // 【第 20 轮】加总用 specRemainPieces（片类=片数），单位用 instantCountUnit（g/ml 类→「包」）
  if (consumeModelOf(item) === 'instant') {
    var spAllI = variantSpecsOf(v);
    if (spAllI.length) {
      var leftI = 0;
      spAllI.forEach(function (s) { leftI += specRemainPieces(v, s); });
      return round1(leftI) + instantCountUnit(item);
    }
    return round1(v.stock || 0) + instantCountUnit(item);
  }
  var spAll = variantSpecsOf(v);
  if (spAll.length) {
    // 【第 23 轮】「当前库存」只报真实剩余：Σ 各规格「未开包数 × 每包含量」动态求和。
    // 绝不让购入总量（历史入库）混进这一行 —— 用户必须一眼看出"现在还能用多少"，
    // 而且这个数要可验算（如：日用 2包×5片 + 护垫 1包×5片 = 15片）。
    var u0 = variantSpecUnit(v);
    var leftW = variantSpecContent(v);           // Σ 未开包 × 每包含量 × 每份规格（动态求和）
    var leftPacks = 0, perSpecParts = [];
    spAll.forEach(function (s) {
      var rp = specPacksRemaining(v, s);
      if (rp > 0) {
        leftPacks += rp;
        perSpecParts.push((String(s.name || '').trim() || '规格') + ' ' + trimNum(rp) + '包');
      }
    });
    leftPacks = Math.round(leftPacks * 100) / 100;
    var t = '剩 ' + trimNum(leftW) + u0;
    if (leftPacks > 0) {
      t += '（未开 ' + trimNum(leftPacks) + ' 包';
      if (perSpecParts.length > 1) t += '：' + perSpecParts.join(' + ');
      t += '）';
    } else {
      t += '（无未开包）';
    }
    // 在用包（已开封、还没记「用完」）单独提示，绝不与未开数混算
    var actN = item ? variantActiveOpenRecs(item, v).length : 0;
    if (actN > 0) t += ' · 另有 ' + trimNum(actN) + ' 包在用';
    return t;
  }
  var stock = v.stock || 0;
  var pq = v.packQty || 1;
  var unit = packQtyUnitOf(v); // 件数单位（包/瓶/支…），不会是 ml 这类含量单位
  if (pq > 1 && stock > 0) {
    var packs = Math.floor(stock / pq);
    var rem = stock % pq;
    var t2 = packs + ' 套';
    if (rem > 0) t2 += ' + ' + rem + ' ' + unit;
    return t2 + '（' + stock + unit + '）';
  }
  return stock + ' ' + unit;
}
// 按含量单位折算可比单价文本（kg→每kg；g/ml→每100g/每100ml；L→每L）
// 比价文本（唯一口径）：「每 <单位原文> 约 X 元」
function variantPriceCompareText(v) { return unitPriceTextOf(v); }
// 跨品牌比价：同物品内按单价升序，标出最划算的一款
function cheapestVariantOf(item) {
  var best = null;
  (item && item.variants ? item.variants : []).forEach(function (v) {
    var up = variantUnitPrice(v);
    if (up === null || !isFinite(up)) return;
    if (!best || up < best.up) best = { v: v, up: up };
  });
  return best;
}

// 耐用品：计算单件物品的总金额（优先用各款 totalPrice，否则用 单价×件数）
function calcDurableTotalPrice(item) {
  if (!item.variants || item.variants.length === 0) return 0;
  var total = item.variants.reduce(function(s, v) {
    var t = v.totalPrice || ((v.price || 0) * (v.stock || 1));
    return s + t;
  }, 0);
  return parseFloat(total.toFixed(2));
}

// 耐用品：计算单件物品的实际件数（所有variant数量之和）
function calcDurableItemCount(item) {
  if (!item.variants || item.variants.length === 0) return 0;
  return item.variants.length;
}

// 耐用品：计算整个板块的总金额
function calcZoneTotalPrice(zone) {
  if (!zone || !zone.items) return 0;
  return zone.items.reduce(function(s, it) { return s + calcDurableTotalPrice(it); }, 0);
}

function ensureVariants(item) {
  if (!item.variants || item.variants.length === 0) {
    item.variants = [{
      id: genId(), brand: item.brand || item.name, stock: item.stock || 0,
      price: item.currentPrice || 0, channel: item.channel || '',
      photos: item.photos || [], opened: item.opened || false,
      openDate: item.openDate || null, finishDate: item.finishDate || null,
      usedUp: item.usedUp || false, openQty: item.openQty || 0,
      feeling: item.feeling || null, shelfLife: item.shelfLife || null,
      productionDate: item.productionDate || null,
      packCount: item.stock || 0, packPrice: item.currentPrice || 0, packQty: 1, packUnit: item.unit || '个', packWeight: 0
    }];
  }
}

function syncItemFromVariants(item) {
  ensureVariants(item);
  item.stock = item.variants.reduce(function(s, v) { return s + (v.stock || 0); }, 0);
  if (item.variants.length > 0) {
    // 补给品总金额 = 各品牌总价之和
    item.currentPrice = parseFloat(item.variants.reduce(function(s,v){ return s + (v.totalPrice || ((v.price||0)*(v.stock||0))); }, 0).toFixed(2));
    item.channel = item.variants[0].channel;
    // 合并所有变体的照片到 item.photos（用于首页卡片正面展示）
    var allVariantPhotos = [];
    item.variants.forEach(function(v) {
      if (v.photos && v.photos.length > 0) {
        v.photos.forEach(function(p) { allVariantPhotos.push(p); });
      }
    });
    // 优先保留顶层 item.photos 中已有的照片，再加上变体照片去重
    var seen = {};
    var merged = [];
    (item.photos || []).concat(allVariantPhotos).forEach(function(p) {
      if (p && !seen[p]) { seen[p] = true; merged.push(p); }
    });
    item.photos = merged;
    item.opened = item.variants.some(function(v) { return v.opened && !v.usedUp; });
    item.usedUp = item.variants.length > 0 && item.variants.every(function(v) { return v.usedUp; });
    var active = item.variants.find(function(v) { return v.opened && !v.usedUp; });
    if (active) {
      item.openDate = active.openDate;
      item.openQty = active.openQty;
    } else {
      // 没有使用中的品牌 → 顶层开封时间同步清空（杜绝幽灵残留）
      item.openDate = null;
      item.openQty = null;
    }
  }
}

// 耐用品：从variants同步到item级别
function syncDurableFromVariants(item) {
  if (!item.variants || item.variants.length === 0) {
    item.variants = [{ id: genId(), brand: item.name || '第1件', stock: 1, price: item.currentPrice || 0, photos: item.photos || [] }];
  }
  item.stock = item.variants.reduce(function(s,v){ return s + (v.stock||1); }, 0);
  item.unit = '件';
  // 合并所有variant照片到item级别（用于兼容旧逻辑）
  var allPhotos = [];
  item.variants.forEach(function(v) {
    if (v.photos && v.photos.length > 0) {
      allPhotos = allPhotos.concat(v.photos);
    }
  });
  item.photos = allPhotos;
  item.currentPrice = parseFloat((item.variants[0].price || 0).toFixed(2));
}

// ========== 页面切换 ==========
var currentZoneId = null;
var currentCategoryId = null;
var currentSearchQuery = '';

function openSettings() { showPage('settings'); }

// ========== 全局重绘入口 ==========
// 手动刷新后调用：重绘当前页面 + 卡片详情（若开着）
function renderAll() {
  refreshCurrentPage();
  if (currentDetailItem && currentDetailZone) {
    renderCardFront(currentDetailItem, currentDetailZone);
    renderCardBack(currentDetailItem, currentDetailZone);
  }
  // 云状态角标
  try { if (typeof updateCloudStatus === 'function') updateCloudStatus(); } catch (e) {}
}

// ========== 页面路由 ==========
var currentPage = 'home';
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');

  document.querySelectorAll('.navbar').forEach(function(n) { n.style.display = 'none'; });
  if (page === 'home') document.getElementById('nav-home').style.display = 'flex';
  else if (page === 'zone') document.getElementById('nav-zone').style.display = 'flex';
  else if (page === 'pool') document.getElementById('nav-pool').style.display = 'flex';
  else if (page === 'settings') document.getElementById('nav-settings').style.display = 'flex';
  else if (page === 'report') document.getElementById('nav-report').style.display = 'flex';

  document.querySelectorAll('.tabbar-item').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === page);
  });

  // 第 15 轮：页面渲染防御 —— 任何渲染崩溃都显示错误卡片，绝不留空白页
  var renderers = { home: renderHome, zone: renderZone, pool: renderTasks, settings: renderSettings, report: renderReport };
  try {
    (renderers[page] || function(){})();
  } catch (e) {
    console.error('页面渲染失败: ' + page, e);
    var box = document.getElementById(page + '-content');
    if (box) {
      var msg = (e && e.message) ? e.message : String(e);
      var stack = (e && e.stack) ? String(e.stack).split('\n').slice(0, 4).join('\n') : '';
      window.__errLog.push({ t: new Date().toLocaleTimeString(), msg: '页面' + page + '渲染失败: ' + msg, detail: stack });
      box.innerHTML = '<div style="margin:20px 14px;padding:16px;background:#fff;border-radius:14px">'
        + '<div style="font-weight:700;margin-bottom:8px">⚠️ 这个页面渲染失败了</div>'
        + '<div style="font-size:13px;color:#666;line-height:1.6">' + escapeHtml(msg) + '</div>'
        + '<pre style="font-size:11px;color:#999;margin-top:8px;white-space:pre-wrap">' + escapeHtml(stack) + '</pre>'
        + '<button class="btn btn-outline btn-sm" style="margin-top:10px" onclick="manualRefresh()">🔄 重试</button>'
        + '</div>';
    }
  }

  window.scrollTo(0, 0);
}

function enterZone(zoneId) {
  currentZoneId = zoneId;
  var zone = getZone(zoneId);
  document.getElementById('zone-title').textContent = zone.icon + ' ' + zone.name;
  currentCategoryId = 'all';
  currentSearchQuery = '';
  showPage('zone');
}

// ========== 数据查询 ==========
function getZone(zoneId) {
  for (var i = 0; i < DB.zones.length; i++) {
    if (DB.zones[i].id === zoneId) return DB.zones[i];
  }
  return null;
}
function getCategory(zoneId, catId) {
  var zone = getZone(zoneId);
  if (!zone) return null;
  for (var i = 0; i < zone.categories.length; i++) {
    if (zone.categories[i].id === catId) return zone.categories[i];
  }
  return null;
}

// ========== 两级分类辅助 ==========
// 取某大类的所有子分类（无 parentId 的分类视为大类）
function getSubcategories(zone, catId) {
  if (!zone || !zone.categories) return [];

// 返回分类路径："大类 · 子类"（大类本身只返回大类名）

// ========== 【第 24 轮】全 App 统一搜索 ==========
// 三档命中，逐档降级；一旦有高档命中就不再看低档。
//   L1 包含：名称 / 品牌 / 分类 / 备注 / 规格名 / 位置 任一字段原样包含 query
//   L2 拆词：query 按空格标点拆成多个词，每个词都能在 haystack 里找到
//   L3 模糊：query 的 2 字滑窗，在【同一个字段】内都能找到编辑距离 ≤1 的滑窗

}
// 物品的检索字段（含字段标签，用于标注「命中来源」）
function itemSearchFields(item, zone) {
  var f = [];
  f.push({ label: '名称', text: item.name || '' });
  (item.variants || []).forEach(function (v) {
    if (v.brand) f.push({ label: '品牌', text: v.brand });
    if (v.notes) f.push({ label: '备注', text: v.notes });
    ((v && v.specs) || []).forEach(function (s) { if (s && s.name) f.push({ label: '规格', text: s.name }); });
  });

// 单个物品的匹配判定；命中返回 {level, via, field}，未命中返回 null

  if (!qn) return null;
  var fields = itemSearchFields(item, zone);
  // L1 包含
  for (var i = 0; i < fields.length; i++) {
    if (searchNorm(fields[i].text).indexOf(qn) >= 0) {
      return { level: 1, via: fields[i].label, field: fields[i].text };
    }
  }
  // L2 拆词（各词都必须出现）
  var words = String(rawQ || '').toLowerCase().split(/[\s,，、;；\/·・\-_+]+/).filter(function (w) { return !!w; });
  if (words.length > 1) {
    var allHit = words.every(function (w) {
      var wn = searchNorm(w);
      if (!wn) return true;
      return fields.some(function (f) { return searchNorm(f.text).indexOf(wn) >= 0; });
    });
    if (allHit) return { level: 2, via: '拆词', field: words.join(' + ') };
  }
  // L3 模糊：query 的每个 2 字滑窗，必须在同一个字段内都找到编辑距离 ≤1 的滑窗。
  // 【红线收紧】长度 < 3 的词一律不做模糊 —— 2 字词做模糊必然噪音爆炸
  //   （搜「面霜」会把「面膜」「洗面奶」都捞出来），红线绝不允许。
  if (qn.length < 3) return null;

function matchesSearch(item, zone, q) { return !!matchItem(item, zone, q); }

// 开袋即用完：完全由用户手动开关控制，不再根据分类名/物品名自动猜测
function isOneShotItem(item) {

// 年报入口一行摘要：把最关键的两件事摆出来，避免用户点进去才知道有没有内容
function aiEntrySubText() {
