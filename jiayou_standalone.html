// ========== 物品状态判断 ==========
// ===== 【第 18 轮】正在使用中的实物库存（真实可用库存的另一半） =====
// 语义：开封动作在开包瞬间就把库存扣掉了（specs.openPacks+1 / v.stock-qty），
// 但那包/那件实物还在手里消耗 —— 「总库存 0 包」绝不等于断粮。
// 真实可用库存 = 未开库存 + 在用实物。本函数统计「在用实物」：
//   qty     —— 件数口径：多规格每条未结束记录 = 1 包（1 包 = 1 件）；普通开封记录按 r.qty 累计
//   content —— 含量口径（kg/ml 等）：多规格 = 该包容量；普通 = r.qty × 单包含量
//   hasContent —— 含量口径是否完整（有对不上的记录/变体没配含量 → false，禁用含量路径）
function inUseStockOf(item) {
  var out = { qty: 0, content: 0, hasContent: true };
  if (!item) return out;
  if (consumeModelOf(item) === 'instant') return out;   // 打卡型无「在用」：打卡即扣库存
  // 旧数据兜底：没有 variantId 的未结束开封记录（早期版本不写品牌归属）——物品级只算一次
  var recsNoV = (item.usageRecords || []).filter(function (r) {
    return r && !r.instant && r.type !== 'surplus' && !r.endDate && !r.variantId;
  });
  function plainAcc(qty, packW) {
    var q = parseFloat(qty);
    if (!(q > 0)) q = 1;
    out.qty += q;
    if (packW > 0) out.content += q * packW;
    else out.hasContent = false;
  }
  var wItem = (item.variants && item.variants[0] ? (parseFloat(item.variants[0].packWeight) || 0) : (parseFloat(item.packWeight) || 0));
  recsNoV.forEach(function (r) { plainAcc(r.qty, wItem); });
  var vs = (item.variants && item.variants.length) ? item.variants : [];
  vs.forEach(function (v) {
    var recs = variantActiveOpenRecs(item, v);
    if (!recs.length) return;
    var sp = variantSpecsOf(v);
    var w = parseFloat(v.packWeight) || 0;
    recs.forEach(function (r) {
      if (sp.length) {
        // 多规格：每条未结束开封记录 = 1 包在用；r.qty = 开启时自动带入的「每包含量/每包片数」
        out.qty += 1;
        var s1 = null;
        for (var i = 0; i < sp.length; i++) {
          if (String(sp[i].name || '') === String(r.specName || '')) { s1 = sp[i]; break; }
        }
        var perPack = parseFloat(r.qty);
        if (!(perPack > 0) && s1) perPack = specPackQty(s1);
        if (!(perPack > 0)) perPack = 1;
        if (s1 && isContentUnitText(s1.unit)) {
          out.content += perPack * (specContentOf(s1) || 1);
        } else {
          out.hasContent = false;   // 片/粒类或对不上规格 → 含量口径不完整
        }
      } else {
        var q = parseFloat(r.qty);
        if (!(q > 0)) q = 1;
        out.qty += q;
        if (w > 0) out.content += q * w;
        else out.hasContent = false;
      }
    });
  });
  out.qty = Math.round(out.qty * 100) / 100;
  out.content = Math.round(out.content * 100) / 100;
  return out;
}

// 【第 18 轮】真实剩余可用天数：（未开库存 + 在用实物）÷ 历史日均消耗
// 作为 statsOf 口径的兜底（statsOf 优先，保证与详情页「月消耗量/约够用 N 月」同口径）
function estimateRealDaysLeft(item) {
  if (!item) return null;
  var records = validPeriodRecords(item);
  if (!records.length) return null;
  var totalQty = 0, totalContent = 0, allContent = true;
  records.forEach(function (r) {
    totalQty += (r.qty || 1);
    if (r.contentUsed > 0) totalContent += r.contentUsed; else allContent = false;
  });
  if (totalQty === 0) return null;
  // 【第 22 轮】闭环总天数（Σ 各记录真实跨度），绝不用「最早记录 → 今天」的距今年数
  var totalDays = closedSpanDays(records);
  if (!(totalDays > 0)) return null;
  var iu = inUseStockOf(item);
  // 口径A：含量（未开含量 + 在用含量）÷ 日均含量消耗
  if (allContent && totalContent > 0 && iu.hasContent) {
    var scE = itemStockContent(item);
    if (scE !== null) {
      var perDayC = totalContent / totalDays;
      if (perDayC > 0) return Math.round((scE + iu.content) / perDayC);
    }
  }
  // 口径B：件数（未开件数 + 在用包/件）× 平均每件周期
  var avgDaysPerUnit = totalDays / totalQty;
  var stockQ = getActiveStock(item);
  return Math.round((stockQ + iu.qty) * avgDaysPerUnit);
}

function getItemStatus(item) {
  var status = {
    expired: false, expiring: false,
    lowStock: false, lowStockSoft: false, stockUpAlert: false,
    shelfPercent: 100, daysLeft: null, estDaysLeft: null, monthsLeft: null

  var totalStock = (consumeModelOf(item) === 'instant') ? instantTotalStock(item) : getActiveStock(item);   // 【第 19 轮】即时型按"份"计数

  // 保质期：取所有variants中最早过期的（不再买的品牌不参与提醒计算）
  var allVariants = (item.variants && item.variants.length > 0) ? item.variants : [item];
  var variants = allVariants.filter(function(v) { return !v.noRestock; });
  if (variants.length === 0) {
    // 全部品牌都标记了「不再买」→ 整个物品不再提醒，只保留保质期信息
    variants = [];
  }
  var earliestDaysLeft = null;
  var earliestShelfPercent = 100;
  variants.forEach(function(v) {
    var sl = v.shelfLife || item.shelfLife;
    var pd = v.productionDate || item.productionDate;
    if (sl && sl > 0 && pd) {
      var prod = new Date(pd);
      var expireDate = new Date(prod);
      expireDate.setMonth(expireDate.getMonth() + sl);
      var daysLeft = daysBetween(new Date(), expireDate);
      var totalDays = sl * 30;
      var shelfPercent = Math.max(0, Math.min(100, (daysLeft / totalDays) * 100));
      if (earliestDaysLeft === null || daysLeft < earliestDaysLeft) {
        earliestDaysLeft = daysLeft;
        earliestShelfPercent = shelfPercent;
      }
    }
  });
  if (earliestDaysLeft !== null) {
    status.daysLeft = earliestDaysLeft;

  // mismatch：规格把「单位」填成了容量单位（480ml/瓶）→ 主数字改用「份」，容量进括号
  if (cap && cap.mismatch) txt = trimNum(round1(n)) + '份';
  else txt = trimNum(round1(n)) + escapeHtml(u);
  if (cap && cap.qty > 1 && cap.unit && isContentUnitText(cap.unit)) {
    txt += '（约' + trimNum(round1(n * cap.qty)) + escapeHtml(cap.unit) + '）';
  }
  return txt;
}
// 「9个（≈940g）」—— 当前剩余的件数与容量并列（采购建议 / 详情页当前库存行专用）
function dualRestText(item) {
  var cap = unitCapacityOf(item);
  var main = mainPackUnit(item);
  // 规格把「单位」填成了容量单位（480ml/瓶）→ 主数字改用「份」，否则会说出「4ml」这种错话
  var a = (cap && cap.mismatch)
    ? trimNum(round1(restNowOf(item))) + '份'
    : trimNum(round1(restNowOf(item))) + escapeHtml(main);
  if (cap && cap.qty > 1 && cap.unit && isContentUnitText(cap.unit)
      && (cap.unit !== main || cap.mismatch)) {
    a += '（≈' + trimNum(round1(restCapOf(item))) + escapeHtml(cap.unit) + '）';
  }
  return a;
}
// 卡片右侧「剩余」= 剩余库存（随每次消耗/盘点实时变动）：有容量概念报容量，否则报件数
function restTextOf(item) {
  var cap = unitCapacityOf(item);
  if (cap && cap.qty > 1 && cap.unit && isContentUnitText(cap.unit)
      && (cap.unit !== mainPackUnit(item) || cap.mismatch)) {
    return trimNum(round1(restCapOf(item))) + escapeHtml(cap.unit);
  }
  return trimNum(round1(restNowOf(item))) + escapeHtml(mainPackUnit(item));
}
// 右侧数字字号自适应：以 6 个字符（如「1920ml」）为设计基准，超长自动缩小，绝不挤掉产品名
function autoNumFont(txt) {
  var n = String(txt || '').length;
  if (n <= 4) return 15;
  if (n <= 6) return 13.5;
  if (n <= 8) return 12;
  return 11;
}

// 速率展示文本：纯数字 + 单位原文（原样拼接，无任何换算）
// ========== 统计层：统一产出「月消耗 / 年消耗 / 当前剩余 / 建议采购」==========
function statsOf(item) {
  if (!item) return null;
  var model = consumeModelOf(item);
  var unit = mainPackUnit(item);
  var out = {
    model: model, unit: unit,
    perMonth: 0, perYearRaw: 0, perYearQty: 0, months: 0,
    rate: 0, rateUnit: unit + '/月',
    contentRate: 0, contentUnit: unit, contentPerMonth: 0,
    piecesPerSet: 1, unitSmall: unit,
    restNow: 0, restSmall: 0, monthsLeft: null,
    usedThisYear: 0, closedCount: 0, noClosedData: true,
    totalQty: 0, spanDays: 0, breakdown: [],
    cap: null, capUnit: unit
  };
  if (!item) return out;
  out.restNow = restNowOf(item);
  out.restSmall = out.restNow;
  out.cap = unitCapacityOf(item);
  out.capUnit = capacityUnitOf(item);

  if (model === 'instant') {
    // 即时型：每次打卡 = 一次完整消耗。月份数 = 跨度 ÷ 31（下限 1）；年 = (总耗 ÷ 月份数) × 12
    var recs = closedInstantRecords(item);
    var totalQ = 0, firstD = null, lastD = null;
    recs.forEach(function (r) {
      totalQ += (parseFloat(r.qty) || 0);
      var d = new Date(r.startDate || r.endDate);
      if (isNaN(d.getTime())) return;
      if (!firstD || d < firstD) firstD = d;
      if (!lastD || d > lastD) lastD = d;
    });
    var spanD = (firstD && lastD) ? Math.max(0, daysBetween(firstD, lastD)) : 0;
    var months = Math.max(1, spanD / R24_DAYS_PER_MONTH);
    out.closedCount = recs.length;
    out.totalQty = Math.round(totalQ * 100) / 100;
    out.spanDays = spanD;
    out.months = months;
    out.usedThisYear = instantUsedQty(item);
    out.noClosedData = !(recs.length > 0) || !(totalQ > 0);
    if (!out.noClosedData) {
      out.perMonth = totalQ / months;
      out.perYearRaw = (totalQ / months) * R24_MONTHS_PER_YEAR;
      out.perYearQty = Math.max(1, Math.ceil(out.perYearRaw));
      out.rate = out.perMonth;
      out.contentRate = out.perMonth;
      out.contentPerMonth = out.perMonth;
      out.monthsLeft = out.perMonth > 0 ? (out.restNow / out.perMonth) : null;
    }
    return out;
  }

  // period 周期型：日均 = Σ 闭环 qty ÷ 区间并集天数；月 = 日均 × 31；年 = 月 × 12
  var pr = validPeriodRecords(item);
  var tq = 0;
  pr.forEach(function (r) { tq += (parseFloat(r.qty) || 0); });
  var sp2 = closedSpanDays(pr);
  out.closedCount = pr.length;
  out.totalQty = Math.round(tq * 100) / 100;
  out.spanDays = sp2;
  out.noClosedData = !(pr.length > 0) || !(tq > 0) || !(sp2 > 0);
  if (!out.noClosedData) {
    var perDay = tq / sp2;
    out.perMonth = perDay * R24_DAYS_PER_MONTH;
    out.perYearRaw = out.perMonth * R24_MONTHS_PER_YEAR;
    out.perYearQty = Math.max(1, Math.ceil(out.perYearRaw));
    out.rate = out.perMonth;
    out.rateUnit = unit + '/月';
    out.contentRate = out.perMonth;
    out.contentUnit = unit;
    out.contentPerMonth = out.perMonth;
    out.months = sp2 / R24_DAYS_PER_MONTH;
    out.monthsLeft = out.perMonth > 0 ? (out.restNow / out.perMonth) : null;
  }
  out.breakdown = periodBreakdown(item);
  return out;
}

// ========== 采购建议 ==========
// 公式：Math.ceil(年消耗件数 − 当前剩余件数)；≤0 → 库存充足（容量只并列展示，绝不参与缺口运算）
function buyAdviceOf(item) {
  var st = statsOf(item);
  if (!st) return null;
  if (st.noClosedData) return { main: NO_DATA_TEXT, detail: null, noData: true };
  // 缺口 = 年消耗件数 − 当前剩余件数（两者同为件数口径，容量只在展示里并列出现）
  var need = Math.ceil(st.perYearRaw - st.restNow);
  if (!(need > 0)) {
    return {
      main: SUFFICIENT_TEXT,
      // 【第 26 轮】当前剩余 = 剩余件数（可并列容量），绝不再把容量当件数拼进这句话
      detail: '年耗 ≈' + dualUnitText(st.perYearRaw, item) + ' · 当前还剩 ' + dualRestText(item),
      noData: false, sufficient: true
    };
  }
  return {
    // 【第 25 轮】建议量同时给「包数 + 容量」：建议囤 21包（约105kg）
    main: '建议囤 <strong>' + dualUnitText(need, item) + '</strong>（约够一年）',
    detail: '年耗 ≈' + dualUnitText(st.perYearRaw, item) + ' · 当前剩 ' + dualRestText(item)
      + ' · 已闭环 ' + st.closedCount + ' 次',
    noData: false
  };
}

// ========== 首页 AI 摘要卡 ==========
// 分工：首页只给「一眼速览 + 一个入口」，消耗速率与采购建议的完整明细都在「年报」独立页。
// 之前把 4 个 section（速率 TOP5 / 采购建议 / 花费分析 / 大促倒计时）全塞在首页小卡里，
// 既挤又和年报重复，且「别买了」是永远为空的死代码 —— 现在统一收口到年报。
function renderAIAnalysis() {
  var r = buildAnnualReport();
  var html = '<div class="ai-card">';
  html += '<div class="ai-header"><span style="font-size:20px">🤖</span>';
  html += '<span class="ai-title">智能摘要</span>';
  html += '<span class="ai-badge">离线分析</span></div>';

  if (r.empty) {
    html += '<div class="ai-suggest">' + escapeHtml(r.emptyReason || '还没有可统计的数据') + '</div>';
    html += '</div>';
    return html;
  }

  // 一句话结论：最紧要的那件事
  html += '<div class="ai-suggest" style="margin-bottom:10px">' + escapeHtml(aiSummaryLine(r)) + '</div>';

  // 三个数字
  html += '<div class="ai-item"><span>有速率的物品</span><span class="ai-val">' + r.counts.rate + ' 件</span></div>';
  html += '<div class="ai-item"><span>需要补货</span><span class="ai-val">' + r.counts.buy + ' 件</span></div>';
  if (r.counts.noData > 0) {
    html += '<div class="ai-item"><span>还差数据</span><span class="ai-val">' + r.counts.noData + ' 件</span></div>';
  }

  // 采购建议：首页只露最紧的 3 条，完整列表在年报
  var buyRows = (r.groups.find(function (g) { return g.key === 'buy'; }) || { rows: [] }).rows;
  if (buyRows.length > 0) {
    html += '<div class="ai-section" style="margin-top:12px">';
    html += '<div class="ai-section-title">最先要补的</div>';
    buyRows.slice(0, 3).forEach(function (e) {
      var tail = e.leftText ? e.leftText.replace('按现在的速度', '').replace(/^[，,]?\s*/, '') : '';
      html += '<div class="ai-item"><span>' + escapeHtml(e.name) + '</span>';
      html += '<span class="ai-val">' + escapeHtml(tail || '该补货') + '</span></div>';
    });
    html += '</div>';
  }

  // 花费：只给今年总额，明细不在首页
  if (r.totalSpend > 0) {
    html += '<div class="ai-item" style="border-top:1px solid rgba(0,105,92,0.2);margin-top:8px">';
    html += '<span>今年已记录花费</span><span class="ai-val">¥' + r.totalSpend.toFixed(2) + '</span></div>';
  }

  // 入口
  html += '<button class="btn btn-primary btn-full" style="margin-top:12px" onclick="showPage(\'report\')">📊 查看完整年报</button>';
  html += '<div style="font-size:11px;color:#00695C;opacity:.75;margin-top:6px;text-align:center;line-height:1.5">年报含每件物品的消耗速率与建议采购量</div>';

  html += '</div>';
  return html;
}

// 首页摘要卡的一句话结论：按「告急 > 撑不到一年 > 数据不足 > 一切正常」优先级挑一件说
function aiSummaryLine(r) {
  var all = r.groups.reduce(function (a, g) { return a.concat(g.rows.map(function (x) { return { g: g.key, e: x }; })); }, []);
  var urgent = all.filter(function (x) { return x.g === 'buy' && x.e.lowStock; });
  if (urgent.length > 0) {
    return '⚠️ ' + urgent.length + ' 件已经告急，' + urgent[0].e.name + ' 最先要补。';
  }
  if (r.counts.buy > 0) {
    var first = (r.groups.find(function (g) { return g.key === 'buy'; }) || { rows: [] }).rows[0];
    return '🛒 ' + r.counts.buy + ' 件撑不到明年，' + first.name + ' 最紧。';
  }
  if (r.counts.rate === 0) {
    return '⏳ 还没有足够的消耗记录，先用几次再来看看。';
  }
  return '✅ 库存都够撑到下次采购，暂时不用买。';
}

// ========== 年报数据层 ==========
// 年报只回答两件事：① 消耗速率（现在用得多快）② 建议采购（这次该买多少）
// 口径统一走 statsOf / buyAdviceOf，四模型分流；这里只负责「凑成人话」
// 返回结构：
//   { empty, emptyReason, asOf, groups: [{key,title,hint,rows,extra}], counts:{...}, totalSpend, totalItems }

// 把「每月消耗速率」换成一句精确的人话（R24：纯数字 + 单位原文，无换算、无「套/ml」双口径）
function rateSentenceOf(item, st) {
  if (!st || !(st.perMonth > 0)) return '';
  var ru = st.unit || mainPackUnit(item);
  var head = '每月约 ' + trimNum(round1(st.perMonth)) + ru
    + ' · 每年约 ' + trimNum(round1(st.perYearRaw)) + ru;
  // 附加「每 N 天一个」——只有能落到「天数」的量才说，避免「每 0 天」
  var days = st.perMonth > 0 ? Math.round(R24_DAYS_PER_MONTH / st.perMonth) : 0;
  if (days >= 2) head += '，约 ' + days + ' 天用掉 1' + ru;
  return head;
}

// 「现在还剩多少」——统一口径：当前剩余（含在用）+ 单位原文
function restSentenceOf(item, st) {
  if (!st) return '';
  var u = st.unit || mainPackUnit(item);
  if (st.noClosedData) return '剩 ' + trimNum(st.restNow) + u + ' · 📭 缺数据';
  var txt = '剩 ' + trimNum(st.restNow) + u;
  if (st.monthsLeft !== null && st.monthsLeft > 0) {
    txt += '（约够 ' + trimNum(round1(st.monthsLeft)) + ' 个月）';
  }
  return txt;
}

// 「还能用多久」——monthsLeft 是四模型统一口径，这里只做区间化措辞（避免「还能用 0.3 个月」）
function monthsLeftSentenceOf(st) {
  if (!st || st.monthsLeft === null || !(st.rate > 0)) return '';
  var m = st.monthsLeft;
  if (m < 0.5) return '按现在的速度撑不到半个月';
  if (m < 1) return '按现在的速度还能用不到 1 个月';
  if (m < 1.5) return '按现在的速度还能用约 1 个月';
  if (m < 24) return '按现在的速度还能用约 ' + Math.round(m) + ' 个月';
  return '按现在的速度能用 2 年以上';
}

// 建议采购的一句话依据（把 buyAdviceOf.main 的 HTML 洗成纯文本）
// 主入口：把 DB 里所有消耗品凑成年报
function buildAnnualReport() {
  var out = {
    empty: true, emptyReason: '', asOf: new Date(),
    groups: [], counts: { rate: 0, buy: 0, stop: 0, noData: 0, history: 0 },
    totalSpend: 0, totalItems: 0
  };

  // 1. 收集全部消耗品（含已归档：归档只是不再提醒，历史速率仍值得看）
  var all = [];
  DB.zones.forEach(function (zone) {
    if (zone.type !== 'consumable') return;
    var push = function (it, arch) {
      all.push({ item: it, zone: zone, archived: !!arch });
    };
    visibleItems(zone).forEach(function (it) { push(it, false); });
    archivedItemsOf(zone).forEach(function (it) { push(it, true); });
  });
  out.totalItems = all.length;

  if (all.length === 0) {
    out.emptyReason = '还没有消耗品。先在领地里加几件日用消耗品吧。';
    return out;
  }

  // 2. 逐项算；分三组：该买 / 别买 / 数据不够
  var gBuy = [], gStop = [], gNoData = [], gRate = [];
  var thisYear = new Date().getFullYear();

  all.forEach(function (row) {
    var it = row.item, zone = row.zone;
    var st = statsOf(it);
    var status = getItemStatus(it);
    var recs = (it.usageRecords || []).length;

    var _adv = buyAdviceOf(it);
    var entry = {
      itemId: it.id, zoneId: zone.id,
      name: it.name, zoneName: zone.name, zoneIcon: zone.icon,
      archived: row.archived,
      model: st ? st.model : 'spec',
      unit: st ? (st.unit || '') : '',
      rate: st ? st.rate : 0,
      rateText: rateSentenceOf(it, st),
      restText: restSentenceOf(it, st),
      leftText: monthsLeftSentenceOf(st),
      monthsLeft: st ? st.monthsLeft : null,
      advice: _adv ? String(_adv.main || '').replace(/<[^>]+>/g, '') : '',
      adviceNoData: !!(_adv && _adv.noData),
      adviceDetail: _adv ? _adv.detail : null,
      usedThisYear: st && st.usedThisYear ? st.usedThisYear : 0,
      spendThisYear: 0,
      lowStock: !!(status.lowStock || status.stockUpAlert),
      noRestock: (it.variants || []).length > 0 && (it.variants || []).every(function (v) { return v.noRestock; }),
      hasData: recs > 0 && st && st.rate > 0
    };
    // 「不再买」判定：整件物品所有品牌都标了 noRestock，或已归档
    // —— 这类物品即便有速率也不该进「建议采购」，否则会一直催买用户明确不买的东西
    entry.stopBuy = entry.archived || entry.noRestock;

    // 今年花费（只算本物品自己的 priceHistory）
    (it.priceHistory || []).forEach(function (p) {
      if (!p.date) return;
      var d = new Date(p.date);
      if (d.getFullYear() === thisYear) {
        entry.spendThisYear += (p.totalPrice || 0);
        out.totalSpend += (p.totalPrice || 0);
      }
    });

    if (entry.hasData) {
      gRate.push(entry);
      // 有速率但明确不再买 → 只进「不用再买」，不给采购建议
      if (entry.stopBuy) gStop.push(entry);
      // 【第 22 轮】「数据不足」不是采购建议，绝不能混进「建议采购」分组
      else if (entry.advice && !entry.adviceNoData) gBuy.push(entry);
      else gNoData.push(entry);
    } else {
      // 没速率：不再买/已归档的进「不用再买」，其余进「还差数据」
      if (entry.stopBuy) gStop.push(entry);
      else gNoData.push(entry);
    }
  });

  // 3. 排序：速率榜按月耗量降序（跨单位不可比，只是「记录最活跃的排前面」）
  gRate.sort(function (a, b) { return b.rate - a.rate; });
  // 该买的排前面：先告急，再按剩余月数升序（越紧越前）
  gBuy.sort(function (a, b) {
    if (a.lowStock !== b.lowStock) return a.lowStock ? -1 : 1;
    var am = (a.monthsLeft === null) ? 999 : a.monthsLeft;
    var bm = (b.monthsLeft === null) ? 999 : b.monthsLeft;
    return am - bm;
  });

  // gNoData / gStop 去重（分组分支可能各 push 一次）
  var seenNo = {}, seenStop = {};
  gNoData = gNoData.filter(function (e) {
    if (seenNo[e.itemId]) return false;
    seenNo[e.itemId] = 1; return true;
  });
  gStop = gStop.filter(function (e) {
    if (seenStop[e.itemId]) return false;
    seenStop[e.itemId] = 1; return true;
  });
  // 已归档的不再重复出现在「数据不够」
  gNoData = gNoData.filter(function (e) { return !e.archived; });

  out.counts.rate = gRate.length;
  out.counts.buy = gBuy.length;
  out.counts.stop = gStop.length;
  out.counts.noData = gNoData.length;

  // 4. 组装分组
  if (gBuy.length) {
    out.groups.push({
      key: 'buy', title: '建议采购', icon: '🛒',
      hint: '按「一年只在双十一买一次」的节奏算：撑不到一年的才进这里。越紧的排越前。',
      rows: gBuy
    });
  }
  if (gRate.length) {
    out.groups.push({
      key: 'rate', title: '消耗速率', icon: '📈',
      hint: '速率 = 闭环记录（已用完）的总消耗量 ÷ 它们的真实跨度天数。「使用中」的记录不参与，用完一件才算数。',
      rows: gRate
    });
  }
  if (gStop.length) {
    out.groups.push({
      key: 'stop', title: '不用再买', icon: '⛔',
      hint: '标记了「不再买」或已归档的品牌，不算进补货提醒。',
      rows: gStop
    });
  }
  if (gNoData.length) {
    out.groups.push({
      key: 'nodata', title: '还差数据', icon: '⏳',
      hint: '还没有形成完整闭环（开启 → 用完）。只有用完整一件，系统才有资格算速率和采购建议；在此之前一律显示「数据不足」。',
      rows: gNoData
    });
  }

  // 5. 历史档案：已删除的物品从年度档案里捞回来
  // 档案生成时速率四要素已一并固化（rateText/leftText/adviceText），删除不影响这份数据
  var liveIds = {};
  all.forEach(function (r) { liveIds[r.item.id] = 1; });
  var histMap = {};
  Object.keys(DB.yearStats || {}).forEach(function (y) {
    ((DB.yearStats[y] && DB.yearStats[y].items) || []).forEach(function (e) {
      if (!e.itemId || liveIds[e.itemId]) return;   // 还在的（含归档）不算历史
      var h = histMap[e.itemId];
      if (!h) {
        h = histMap[e.itemId] = {
          itemId: e.itemId, zoneId: e.zoneId || '', zoneName: e.zoneName || '', zoneIcon: e.zoneIcon || '📦',
          name: e.name, deleted: true, archived: false,
          model: '', unit: e.unit || '', rate: 0,
          rateText: e.rateText || '', restText: '', leftText: e.leftText || '',
          advice: e.adviceText || '', adviceDetail: null,
          usedThisYear: 0, spendThisYear: 0,
          lowStock: false, noRestock: true,
          hasData: !!(e.rateText || (e.qty > 0)),
          years: []
        };
      }
      h.years.push({ year: y, qty: e.qty, unit: e.unit, capQty: e.capQty, capUnit: e.capUnit, spend: e.spend });
    });
  });
  var gHist = Object.keys(histMap).map(function (k) { return histMap[k]; });
  gHist.sort(function (a, b) { return b.years.length - a.years.length; });
  out.counts.history = gHist.length;
  if (gHist.length) {
    out.groups.push({
      key: 'history', title: '历史档案', icon: '🗄️',
      hint: '这些物品已删除，数据来自年度档案快照，不会再变化。',
      rows: gHist
    });
  }

  out.empty = (gBuy.length + gRate.length + gStop.length + gNoData.length + gHist.length) === 0;
  if (out.empty) out.emptyReason = '还没有可统计的消耗品。';
  return out;
}

// ========== 板块页渲染 ==========
function renderZone() {
  var zone = getZone(currentZoneId);
  if (!zone) { showPage('home'); return; }
  var html = '';

  // 搜索栏
  html += '<div class="search-bar">';
  html += '<span class="search-icon">🔍</span>';
  html += '<input type="text" placeholder="搜物品/分类/备注/描述..." value="' + escapeHtml(currentSearchQuery) + '" oninput="onSearch(this.value)">';
  html += '</div>';

  // 分类标签（第一行：全部 + 大类）
  var mainCats = zone.categories.filter(function(c) { return !c.parentId; });
  // 若当前选中的是子分类，找到其父大类用于第一行高亮和第二行渲染
  var activeMainId = 'all';
  var activeSubId = null;
  if (currentCategoryId !== 'all') {
    var curCat = getCategory(currentZoneId, currentCategoryId);
    if (curCat) {
      if (curCat.parentId) {
        activeMainId = curCat.parentId;
        activeSubId = curCat.id;
      } else {
        activeMainId = curCat.id;
      }
    }
  }
  html += '<div class="cat-tabs">';
  html += '<div class="cat-tab ' + (activeMainId === 'all' ? 'active' : '') + '" onclick="selectCategory(\'all\')">全部</div>';
  mainCats.forEach(function(cat) {
    html += '<div class="cat-tab ' + (activeMainId === cat.id ? 'active' : '') + '" onclick="selectCategory(\'' + cat.id + '\')">';
    html += escapeHtml(cat.name);
    html += '</div>';
  });
  html += '</div>';

  // 第二行：选中大类的子分类（有子分类才显示）
  if (activeMainId !== 'all') {
    var subs = getSubcategories(zone, activeMainId);
    if (subs.length > 0) {
      html += '<div class="cat-tabs" style="margin-top:-4px">';
      html += '<div class="cat-tab ' + (!activeSubId ? 'active' : '') + '" onclick="selectCategory(\'' + activeMainId + '\')">全部</div>';
      subs.forEach(function(sub) {
        html += '<div class="cat-tab ' + (activeSubId === sub.id ? 'active' : '') + '" onclick="selectCategory(\'' + sub.id + '\')">';
        html += escapeHtml(sub.name);
        html += '</div>';
      });
      html += '</div>';
    }
  }

  // 物品网格
  if (currentCategoryId !== 'all') {
    html += '<div style="margin:10px 0 14px"><button class="btn btn-outline btn-sm" style="width:100%" onclick="taskOpenFormFromCategory(\'' + currentZoneId + '\',\'' + currentCategoryId + '\')">📋 委托补货（引用本分类产品）</button></div>';
  }
  // 归档箱入口（用完不再买的物品都在这里，数据保留可恢复）
  var arcCnt = archivedCountAll();
  if (arcCnt > 0 && !currentSearchQuery) {
    html += '<div style="margin:0 0 14px"><button class="btn btn-outline btn-sm" style="width:100%;font-size:12px" onclick="showArchivedBox()">📦 归档箱（' + arcCnt + ' 件 · 用完不再买）</button></div>';
  }
  var items = getItemsByCategory(currentZoneId, currentCategoryId);
  if (items.length === 0) {
    html += '<div class="empty-state">';
    html += '<div class="empty-icon">📦</div>';
    html += '<div class="empty-text">还没有物品<br>点击右上角＋添加</div>';
    html += '</div>';
  } else {
    html += '<div class="item-grid">';
    items.forEach(function(it) {
      html += renderItemCard(it, zone);
    });
    html += '</div>';
  }

  document.getElementById('zone-content').innerHTML = html;
}

function onSearch(q) {
  currentSearchQuery = q;
  renderZone();
}

function selectCategory(catId) {
  currentCategoryId = catId;
  renderZone();
}

// ========== 物品卡片渲染 ==========
// 【第 9 轮状态标签铁律】数据不足绝不报警：
//   💭 呆滞品：库存>0 且从未开封
//   🌀 使用中：开封过但消耗数据不足（算不出 monthsLeft），或 预估可用 > 5 个月
//   ⚠️ 余量较少：数据充足 且 3~5 个月
//   ❗️ 告急：数据充足 且 < 3 个月（含库存归零）
// App 初期所有开封过的东西一律先显示 🌀，随使用自然过渡到 ⚠️/❗️，绝不引起焦虑。
function cardUsageStatusLabel(item) {
  var vs = (item.variants && item.variants.length) ? item.variants : [];
  var totalStock = vs.length ? vs.reduce(function (s, v) { return s + (parseFloat(v.stock) || 0); }, 0) : (parseFloat(item.stock) || 0);
  var hasOpenRec = (item.usageRecords || []).some(function (r) {
    return !r.instant && r.type !== 'surplus' && (r.startDate || r.endDate);
  });
  var anyOpened = vs.some(function (v) { return v.opened && !v.usedUp; });
  // 【第 17 轮】库存归零不再一律告急：
  //   没有任何使用中的 → 真正断粮，告急（红）
  //   【第 18 轮】阈值统一为用户定版规则：<1 个月(30天) ❗️红；1~5 个月(30~150天) ⚠️黄；>5 个月 🌀
  if (totalStock <= 0) {
    var anyUse0 = vs.some(function (v) { return v.opened && !v.usedUp; });
    if (!anyUse0) return { icon: '❗️', label: '告急', cls: 'st-danger' };
    var st0 = null;
    try { st0 = getItemStatus(item); } catch (e) { st0 = null; }
    var ed0 = st0 ? st0.estDaysLeft : null;
    if (typeof ed0 === 'number' && ed0 <= 30) return { icon: '❗️', label: '告急', cls: 'st-danger' };
    if (typeof ed0 === 'number' && ed0 <= 150) return { icon: '⚠️', label: '余量较少', cls: 'st-warn' };
    return { icon: '🌀', label: '使用中', cls: 'st-using' };
  }
  // 从未开封 + 有库存 → 呆滞品
  if (!hasOpenRec && !anyOpened) return { icon: '💭', label: '呆滞品', cls: 'st-idle' };
  // 开封过 → 看消耗数据是否充足
  var st = null;
  try { st = getItemStatus(item); } catch (e) { st = null; }
  var m = st ? st.monthsLeft : null;
  // 数据不足（算不出剩余可用月数）→ 一律 🌀，绝不乱报预警
  if (m === null || m === undefined || !(st && st.monthsLeft > -1 && (st.estDaysLeft !== null && st.estDaysLeft !== undefined))) {
    return { icon: '🌀', label: '使用中', cls: 'st-using' };
  }
  // 【第 18 轮】阈值 = 用户定版预警规则：>5 个月 🌀无边框；1~5 个月 ⚠️黄框；<1 个月 ❗️红框
  if (m > 5) return { icon: '🌀', label: '使用中', cls: 'st-using' };
  if (m >= 1) return { icon: '⚠️', label: '余量较少', cls: 'st-warn' };
  return { icon: '❗️', label: '告急', cls: 'st-danger' };
}
// 【第 10 轮】原 cardStockShort 已被 renderItemCard 内的 hero 拆分逻辑取代
// （主数字直接取 stockSummaryOf 的第一段，副段作为小灰字并列），故删除以避免死代码。

function renderItemCard(item, zone) {
  var status = getItemStatus(item);
  var isDurable = zone.type !== 'consumable';
  // 耐用品按各 variant 的 stock 汇总实际件数；无 stock 字段（旧数据）默认1
  var variantCount;
  if (isDurable) {
    variantCount = (item.variants && item.variants.length) ? item.variants.reduce(function(s,v){ return s + (v.stock||1); }, 0) : 1;
  } else {
    variantCount = (item.variants && item.variants.length) ? item.variants.length : 0;
  }

  var html = '<div class="item-card item-card-compact" onclick="openCardDetail(\'' + zone.id + '\',\'' + item.id + '\')">';

  // 角标：保质期（保留——过期是事实提醒，不是消耗预估）；状态标签移入 body 右侧
  if (item.archived) {
    html += '<div class="card-badge badge-archived">📦 已归档</div>';
  } else if (status.expired) {
    html += '<div class="card-badge badge-expire">已过期</div>';
  } else if (status.expiring) {
    html += '<div class="card-badge badge-warn">' + status.daysLeft + '天</div>';
  }

  // 卡片body
  html += '<div class="card-body">';
  var stL = isDurable ? null : cardUsageStatusLabel(item);
  var cModelC = isDurable ? null : consumeModelOf(item);
  var isInstantC = (cModelC === 'instant');

  // 第 10 轮：卡片视觉分级 —— 只有 ⚠️/❗️ 才动用橙/红，其余一律素雅灰白
  // card-calm / card-warn / card-alert 决定左边框与极淡底色，让需行动的卡「跳出来」
  // 注意：必须在 stL 赋值之后计算（var 提升会让提前引用恒为 undefined）
  var tierCls = ' card-calm';
  if (stL) {
    if (stL.cls === 'st-danger') tierCls = ' card-alert';
    else if (stL.cls === 'st-warn') tierCls = ' card-warn';
  }
  // 把分级类补进已开出的卡片标签
  html = html.replace('class="item-card item-card-compact"', 'class="item-card item-card-compact' + tierCls + '"');

  // ========== 第一段（第 13 轮重排）：产品名 + 核心库存数并排一行（粗体大字），图标竖向堆叠 ==========
  // 模型 ⚡/⌛ 与状态 💭/🌀/⚠️/❗️ 从横排改为竖排（上下堆叠），只占一个图标的宽度，
  // 释放出来的横向空间全部还给「标题（左）+ 核心数据（右）」
  // 【第 25 轮】右侧主数字 = 当前剩余库存（容量口径，随每次消耗/盘点实时变动）。
  // 例：洗发水剩 1920ml、猫粮剩 15kg、姨妈巾剩 60片 —— 一律「数字 + 容量单位原文」。
  var heroTxtC = '', heroSubC = '';
  if (!isDurable) {
    var st25 = null;
    try { st25 = statsOf(item); } catch (e) { st25 = null; }
    heroTxtC = restTextOf(item);
    // 副行补一句「在用 N」提示（有正在消耗中的实物时）
    if (st25 && st25.model !== 'instant') {
      var iuC = inUseAmountOf(item);
      if (iuC > 0) heroSubC = '· 在用 ' + trimNum(round1(iuC)) + mainPackUnit(item);
    }
  }
  html += '<div style="display:flex;align-items:center;gap:6px">';
  html += '<div class="card-name" style="flex:1;min-width:0">' + escapeHtml(item.name) + '</div>';
  if (!isDurable && heroTxtC) {
    // 字号自适应：以 6 字符（如「1920ml」）为基准，超长自动缩小，保证不挤掉产品名
    html += '<span class="card-hero" style="flex-shrink:0;text-align:right;font-size:' + autoNumFont(heroTxtC) + 'px;white-space:nowrap">' + escapeHtml(heroTxtC) + '</span>';
  }
  if (stL) {
    var mdlC = (cModelC === 'instant') ? '⚡' : '⌛';
    var mdlTxt = (cModelC === 'instant') ? '即时消耗型' : '周期消耗型';
    // 【第 13 轮】两个小图标竖向排列（上下堆叠）
    html += '<span style="flex-shrink:0;display:inline-flex;flex-direction:column;align-items:center;gap:2px;line-height:1">'
      + '<span class="card-model" title="' + mdlTxt + '">' + mdlC + '</span>'
      + '<span class="card-st ' + stL.cls + '" title="' + stL.label + '">' + stL.icon + '</span>'
      + '</span>';
  }
  html += '</div>';

  if (isDurable) {
    // 耐用品正面：显示件数 + 总金额
    html += '<div class="card-info" style="color:var(--accent);font-weight:600">' + variantCount + '件</div>';
    var totalPrice = calcDurableTotalPrice(item);
    html += '<div class="card-info" style="font-weight:600">总金额 ¥' + totalPrice.toFixed(2) + '</div>';
    if (item.location) {
      html += '<div class="card-info">📍 ' + escapeHtml(item.location) + '</div>';
    }
    if (item.lastUsedDate) {
      var dDays = daysBetween(new Date(item.lastUsedDate), new Date());
      if (dDays > 180) {
        html += '<div class="card-info" style="color:var(--purple);font-weight:600">🕐 ' + Math.floor(dDays/30) + '个月没用</div>';
      }
    }
  } else {
    // ========== 第二段（第 13 轮）：灰色小字行（库存构成 + 可用天数，同一行、左对齐、可换行）==========
    // 核心数据（如 41片）已上移到第一行与标题并排；本行只放灰色辅助小字，行距保持不挤压
    // 【第 25 轮】主标题下方固定留一行「可用天数」：
    //   有闭环数据 → 「可用 ≈ X 天」；没有闭环 → 「📭 缺少数据」，等有数据后自动更新。
    //   （绝不再出现整行空着、或拿「使用中」硬凑天数的情况）
    var daysTxtC = cardDaysText(item, status);
    html += '<div class="card-sec" style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">';
    if (heroSubC) html += '<span class="card-hero-sub">' + escapeHtml(heroSubC) + '</span>';
    html += '<span class="card-days">' + escapeHtml(daysTxtC) + '</span>';
    html += '</div>';

    // ========== 第三段：操作按钮（底部，压缩高度）==========
    html += '<div class="card-price-zone" style="display:flex;gap:7px">';
    if (isInstantC) {
      // 走选择器：多品牌时让用户明确选扣哪个，单一品牌时自动扣 1
      html += '<button class="btn btn-quiet btn-card-action" style="flex:1" onclick="event.stopPropagation();punchInstantPick(\'' + item.id + '\')">✨ 消耗</button>';
    } else {
      html += '<button class="btn btn-quiet btn-card-action" style="flex:1" onclick="event.stopPropagation();openItem(\'' + item.id + '\')">🔅 开封</button>';
    }
    html += '<button class="btn btn-card-action" style="flex:1;background:transparent;border:1px solid var(--separator);color:var(--text-secondary);font-weight:500" onclick="event.stopPropagation();openRestockForm(\'' + item.id + '\')">🛒 补货</button>';
    html += '</div>';
  }

  html += '</div></div>';
  return html;
}

// 【第 25 轮】卡片「可用天数」文案 —— 必须与详情页、年报同一套 statsOf 口径：
//   有闭环记录 → 「可用 ≈ X 天」（X = 当前剩余 ÷ 月消耗 × 31 天）；
//   无闭环记录 → 「📭 缺少数据」，绝不拿「使用中」硬凑天数，等有完整周期后自动更新。
//   保质期是事实提醒，优先级高于消耗预估。
function cardDaysText(item, status) {
  try {
    var stS = status;
    if (!stS) { try { stS = getItemStatus(item); } catch (e) { stS = null; } }
    if (stS && stS.expired) return '已过期';
    if (stS && stS.expiring && stS.daysLeft !== null && stS.daysLeft !== undefined) return '剩 ' + stS.daysLeft + ' 天过期';
    var st = statsOf(item);
    if (!st || st.noClosedData) return '📭 缺少数据';
    // 【第 26 轮】件数与容量彻底剥离：可用天数 = 剩余件数 ÷ 月消耗件数，容量只作展示参考
    var pm = st.perMonth;
    if (!(pm > 0)) return '📭 缺少数据';
    var d = st.restNow / pm * R24_DAYS_PER_MONTH;
    if (!isFinite(d)) return '📭 缺少数据';
    return '可用 ≈ ' + Math.max(0, Math.round(d)) + ' 天';
  } catch (e) { return '📭 缺少数据'; }
}

// ========== 状态对账（Reconcile）==========
// 唯一真源 = 使用记录（usageRecords）。任何记录的增/删/改之后都必须调用本函数，
// 由记录重新推导每个变体的 opened / usedUp，从而杜绝「记录删了、卡片还卡在『使用中』」
// 这类幽灵状态。同时把 0 天记录（startDate === endDate）当作「无效」剔除出速率统计。
function hasOpenRecordOf(item, variantId) {
  return (item.usageRecords || []).some(function (r) {
    if (r.variantId !== variantId) return false;
    // 即时消耗（打卡）不参与「开封/使用中」判定
    if (r.instant) return false;
    // 有待结束的开包/开封记录 → 该品牌处于使用中
    return !r.endDate;
  });
}
// 该品牌当前「正在使用中」的全部开封记录（并行真源）。
// 并行语义：同一品牌下允许多条未结束记录并存（如 2 瓶生发精华同时开封、
// 正装/中样/替换装A/替换装B 同时在用）。每条记录独立计时、独立收尾。
// 排序：按开始日期升序（最早开的在前），日期缺失的排最后。
// 说明：盘盈入库（type='surplus'）是进货不是开封，不参与「使用中」判定。
function variantActiveOpenRecs(item, v) {
  if (!item || !v) return [];
  var out = [];
  (item.usageRecords || []).forEach(function (r) {
    if (!r || r.variantId !== v.id) return;
    if (r.instant) return;                 // 打卡记录不参与开封生命周期
    if (r.type === 'surplus') return;      // 盘盈入库不是开封
    if (r.endDate) return;                 // 已结束 → 不在使用中
    var t = r.startDate ? new Date(r.startDate).getTime() : NaN;
    out.push({ r: r, t: isNaN(t) ? Infinity : t });
  });
  out.sort(function (a, b) { return a.t - b.t; });
  return out.map(function (x) { return x.r; });
}
// 开封时间唯一真源 = 使用记录：取该品牌最早一条记录的开始日期。
// 卡片绝不自己硬存「开封时间」——删了记录，时间自然消失，绝不出现数据打架。
function variantOpenDateOf(item, v) {
  if (!item || !v) return null;
  var best = null;
  (item.usageRecords || []).forEach(function (r) {
    if (!r || r.variantId !== v.id || r.instant) return;
    if (r.type === 'surplus') return; // 盘盈入库不是开封，不算
    if (!r.startDate) return;
    var t = new Date(r.startDate).getTime();
    if (isNaN(t)) return;
    if (best === null || t < best) best = t;
  });
  return best !== null ? new Date(best).toISOString() : null;
}
// ===== 【第 22 轮 · 共性修复】库存自愈：规格明细是唯一真源 =====
// 背景：历史上多个版本的口径演进（套数折算/单套构成/盘点落账）可能把 v.stock 写漂
//   （如姨妈巾 specs 明明是 100 片，v.stock 却残留 1000），而 specs 与 stock 一旦脱钩
//   没有任何机制拉回 —— 盘点页顶栏「当前记录」与输入区口径分裂、盘点产生假差额流水。
// 规则：只要变体有有效规格明细，v.stock 必须 === variantSpecContent(v)；
//   启动迁移 + 每次对账都强制拉齐。绝不碰无明细变体（它们的 stock 是人工/流水维护的）。
function healVariantStock(item) {
  if (!item || !item.variants) return 0;
  var n = 0;
  item.variants.forEach(function (v) {
    if (!variantSpecsOf(v).length) return;
    var truth = variantSpecContent(v);
    if (Math.round((parseFloat(v.stock) || 0) * 100) / 100 !== truth) {
      v.stock = truth;
      n++;
    }
  });
  if (n) syncItemFromVariants(item);
  return n;
}

function reconcileItemState(item) {
  if (!item) return;
  ensureVariants(item);
  // 即时消耗型（打卡）不参与「开封/使用中」生命周期：它的 opened/usedUp
  // 由 punchInstant / unpunchInstant 自己管理（扣到 0 折叠进已用完），对账不能碰
  if (consumeModelOf(item) === 'instant') { healVariantStock(item); syncItemFromVariants(item); return; }
  (item.variants || []).forEach(function (v) {
    var openRec = hasOpenRecordOf(item, v.id);
    var hasAnyRecord = (item.usageRecords || []).some(function (r) { return r.variantId === v.id && !r.instant; });
    var specs = variantSpecsOf(v);
    if (openRec) {
      // 还有未结束的记录 → 使用中
      v.opened = true;
      v.usedUp = false;
      v.finishDate = null;
      // 开封时间以使用记录为准（最早一条开始日期），记录缺失时才沿用旧值兜底
      var recOpen = variantOpenDateOf(item, v);
      v.openDate = recOpen || v.openDate || null;
    } else {
      // 没有未结束的记录 → 绝不残留「使用中」
      // 幽灵开封时间修复：记录已删/已结束 → 开封时间必须同步清空（动态真源是使用记录）
      v.openDate = null;
      // 判定是否已用完：多规格看规格是否全部开光；普通品牌看该品牌是否已被标记用完
      var allGone = false;
      if (specs.length) {
        allGone = specs.every(function (s) { return specPacksRemaining(v, s) <= 0; });
      } else {
        allGone = hasAnyRecord && (parseFloat(v.stock) || 0) <= 0;
      }
      v.opened = false;
      if (allGone) {
        v.usedUp = true;
        if (!v.finishDate) {
          // 用完日期取该品牌最后一条记录的结束日期
          var ends = (item.usageRecords || [])
            .filter(function (r) { return r.variantId === v.id && !r.instant && r.endDate; })
            .map(function (r) { return new Date(r.endDate); });
          v.finishDate = ends.length ? new Date(Math.max.apply(null, ends)).toISOString() : new Date().toISOString();
        }
      } else {
        v.usedUp = false;
        v.finishDate = null;
      }
    }
    // 多规格：把「已开包数」居中的一致性拉齐——若某规格有未结束记录，则标记 __openPack
    if (specs.length) {
      specs.forEach(function (s, si) {
        var nm = s.name || '规格';
        var inUse = (item.usageRecords || []).some(function (r) {
          return r.variantId === v.id && r.specName === nm && !r.endDate && !r.instant;
        });
        s.__openPack = inUse;
      });
    }
  });
  // 【第 22 轮】收尾自愈：把 specs 与 v.stock 重新拉齐（历史脏数据在此一次性修复）
  healVariantStock(item);
  syncItemFromVariants(item);
}

// 0 天记录：开始日期 == 结束日期 → 无效，绝不允许进入速率平均
function isZeroDayRecord(r) {
  if (!r || !r.startDate || !r.endDate) return false;
  return daysBetween(new Date(r.startDate), new Date(r.endDate)) <= 0;
}
// 清理无效记录（0 天 / 缺日期），返回清理条数
function purgeInvalidRecords(item) {
  if (!item || !item.usageRecords) return 0;
  var before = item.usageRecords.length;
  item.usageRecords = item.usageRecords.filter(function (r) {
    if (r.instant) return true; // 打卡记录没有周期概念，保留
    if (!r.startDate) return true; // 保留（历史脏数据交由用户手动处理）
    if (r.endDate && isZeroDayRecord(r)) return false; // 0 天 → 剔除
    return true;
  });
  return before - item.usageRecords.length;
}
// 一键清理 0 天记录（卡片上的「一键清理」入口）
function purgeZeroRecords(itemId) {
  var item = findItemByIdGlobal(itemId);
  if (!item) return;
  var n = purgeInvalidRecords(item);
  reconcileItemState(item);
  saveDB();
  refreshItemViews(item);
  toast(n > 0 ? '🧹 已清理 ' + n + ' 条 0 天记录，消耗数据已重算' : '没有需要清理的记录');
}

// ========== 使用记录编辑 ==========
// 第 11 轮：记录选择器 —— 点「✅用完」「🪄编辑」时弹出选择框，让用户明确挑一条记录，
// 而不是硬梆梆地猜测或显示两行长文字。
function _recBriefText(item, r) {
  var vsR = item.variants || [];
  var vR = r.variantId ? vsR.find(function (x) { return x.id === r.variantId; }) : null;
  var bTxt = vR ? escapeHtml(vR.brand || '') + ' · ' : '（无品牌）';
  var dTxt = r.startDate ? formatDate(r.startDate) : (r.date ? formatDate(r.date) : '未记日期');
  var u = (vR && vR.packUnit) || mainPackUnit(item) || '份';
  if (r.type === 'surplus') return '📥 ' + bTxt + '盘盈入库 +' + trimNum(r.qty) + ' ' + escapeHtml(u) + ' · ' + dTxt;
  if (r.isAudit) return '⚖️ ' + bTxt + '盘点 ' + trimNum(r.qty) + ' ' + escapeHtml(rateUnitName(item)) + ' · ' + dTxt + (r.endDate ? ' → ' + formatDate(r.endDate) : '');
  if (r.instant) return '✨ ' + bTxt + (r.batch ? '批量 ' : '') + '消耗 ' + trimNum(r.qty) + ' ' + escapeHtml(instantCountUnit(item)) + ' · ' + dTxt;
  if (r.endDate) return '📅 ' + bTxt + dTxt + ' → ' + formatDate(r.endDate) + ' · ' + daysBetween(new Date(r.startDate), new Date(r.endDate)) + '天';
  if (r.startDate) return '📅 ' + bTxt + dTxt + ' 起 · 使用中（已用 ' + daysBetween(new Date(r.startDate), new Date()) + ' 天）';
  return '📅 ' + bTxt + '记录';
}
// 「✅ 用完」：只列出「使用中」的记录，选中后直接收尾

// 执行批量修改：把勾选记录的开始/结束时间统一改为填写值，并同步库存与消耗速率
function applyBatchPeriod(itemId) {
  var item = findItemByIdGlobal(itemId);
  if (!item) { closeModal(); return; }
  var idxs = window._batchIdxs || [];
  var s = document.getElementById('bp-start').value;
  var e = document.getElementById('bp-end').value;
  if (!s) { toast('请填写统一的开始时间'); return; }
  var n = 0, skipped = 0;
  idxs.forEach(function (i) {
    var r = item.usageRecords[i];
    if (!r || r.instant) return;            // 即时打卡无周期，跳过
    if (e && e === s) { skipped++; return; } // 0 天记录跳过（不污染速率）
    r.startDate = s;
    if (e) r.endDate = e;
    else delete r.endDate;
    n++;
  });
  reconcileItemState(item);   // 周期变了 → 开封/用完状态与库存需重算
  saveDB();
  closeModal();
  refreshItemViews(item);
  openCardDetail(currentZoneId, itemId);
  toast('✅ 已批量更新 ' + n + ' 条使用周期' + (skipped ? '（跳过 ' + skipped + ' 条 0 天记录）' : ''));
}

// 即时打卡记录编辑：改数量时把差额同步回库存（改多 → 库存再减；改少 → 库存退回）
function saveInstantRecordEdit(itemId, idx) {
  var item = findItemByIdGlobal(itemId);
  if (!item || !item.usageRecords || !item.usageRecords[idx]) { closeModal(); return; }
  var r = item.usageRecords[idx];
  if (!r.instant) { closeModal(); return; }
  var q = parseFloat(document.getElementById('ur-qty').value);
  if (isNaN(q) || q <= 0) { toast('请输入大于 0 的数量'); return; }
  q = Math.floor(q);
  if (q < 1) { toast('数量至少为 1'); return; }
  var v = (item.variants || []).find(function (x) { return x.id === r.variantId; });
  var u = (v && v.packUnit) || mainPackUnit(item) || '份';
  var oldQ = parseFloat(r.qty) || 0;
  var delta = Math.round((q - oldQ) * 100) / 100;   // >0 需再扣；<0 需退回
  if (v) {
    var stock = parseFloat(v.stock) || 0;
    var newStock = Math.round((stock - delta) * 100) / 100;
    if (newStock < 0) { toast('⚠️ 库存不足：最多只能改成 ' + trimNum(stock + oldQ) + u); return; }
    v.stock = newStock;
    if (v.stock > 0 && v.usedUp) { v.usedUp = false; v.finishDate = null; }
    else if (v.stock <= 0 && !v.usedUp) { v.usedUp = true; v.finishDate = new Date().toISOString(); }
  }
  r.qty = q;
  var s = document.getElementById('ur-start').value;
  if (s) { r.startDate = s; r.endDate = s; }
  syncItemFromVariants(item);
  saveDB();
  closeModal();
  refreshItemViews(item);
  toast('✅ 打卡记录已更新，库存已同步');
}
function saveUsageEdit(itemId, idx) {
  var item = findItemByIdGlobal(itemId);
  if (!item || !item.usageRecords || !item.usageRecords[idx]) { closeModal(); return; }
  var r = item.usageRecords[idx];
  var isAuditR = !!r.isAudit || r.type === 'surplus';
  var q = parseFloat(document.getElementById('ur-qty').value);
  var oldQ = parseFloat(r.qty) || 0;
  r.qty = (isNaN(q) || q <= 0) ? 1 : Math.round(q * 100) / 100;
  var s = document.getElementById('ur-start').value;
  var e = document.getElementById('ur-end').value;
  if (s) r.startDate = s;
  if (e) { r.endDate = e; }
  else { delete r.endDate; }
  // 0 天记录拦截：填了结束日期且等于开始日期 → 直接拒绝保存
  if (r.startDate && r.endDate && isZeroDayRecord(r)) {
    toast('⚠️ 结束日期不能等于开始日期（0 天记录会污染消耗速率），请修正');
    return;
  }
  // === 盘点流水：数量差额同步回库存（盘亏改多 → 库存再减；改少 → 库存退回）===
  if (isAuditR) {
    var dq = Math.round((r.qty - oldQ) * 100) / 100;
    if (dq !== 0) {
      var vA = (item.variants || []).find(function (x) { return x.id === r.variantId; });
      if (vA) {
        var specsA = variantSpecsOf(vA);
        var sign = (r.type === 'surplus') ? -1 : 1;   // 盘盈：差额方向相反
        if (specsA.length && r.auditPacks) {
          // 多规格：按包数差额调整已开包数
          var pqA = 0;
          var sA = specsA.find(function (x) { return String(x.name || '') === String(r.specName || ''); });
          if (sA) pqA = specPackQty(sA);
          if (pqA > 0) {
            var dPacks = Math.round((dq / pqA) * 100) / 100 * sign;
            sA.openPacks = Math.max(0, Math.round((specOpenPacks(sA) + dPacks) * 100) / 100);
            sA.qty = Math.round(specPackCount(sA) * pqA * 100) / 100;
            r.auditPacks = Math.max(0, Math.round((parseFloat(r.auditPacks) + dPacks) * 100) / 100);
            vA.stock = variantSpecContent(vA);
          }
        } else {
          // 普通变体：盘亏 +差额 / 盘盈 −差额
          vA.stock = Math.max(0, Math.round(((parseFloat(vA.stock) || 0) - dq * sign) * 100) / 100);
          if (vA.stock > 0 && vA.usedUp) { vA.usedUp = false; vA.finishDate = null; }
        }
      }
    }
  }
  reconcileItemState(item);
  saveDB();
  closeModal();
  refreshItemViews(item);
  toast(isAuditR ? '✅ 盘点周期已更新' : '✅ 记录已更新');
}
function deleteUsageRecord(itemId, idx) {
  var item = findItemByIdGlobal(itemId);
  if (!item || !item.usageRecords || !item.usageRecords[idx]) { closeModal(); return; }
  var r = item.usageRecords[idx];
  // 删除记录时若该记录对应「开包/开封」动作，需同时回滚已开包数，
  // 否则会出现「记录删了、包数却少了一包」的库存错乱。
  rollbackRecordConsumption(item, r);
  item.usageRecords.splice(idx, 1);
  // 关键：删记录后必须对账，把「使用中」回滚到正确状态
  reconcileItemState(item);
  saveDB();
  closeModal();
  refreshItemViews(item);
  toast('🗑️ 记录已删除，状态已回滚');
}
// 回滚一条记录所代表的开包消耗（把对应规格的 openPacks 减回去）
function rollbackRecordConsumption(item, r) {
  if (!item || !r) return;
  if (r.instant) return; // 打卡记录的库存由 unpunchInstant 单独处理
  if (!r.variantId) return;
  var v = (item.variants || []).find(function (x) { return x.id === r.variantId; });
  if (!v) return;
  var specs = variantSpecsOf(v);
  if (!specs.length) {
    // 普通变体：盘点流水（盘亏/盘盈）删除时必须退回差额，保持「删记录=撤销这笔流水」
    if (r.isAudit) {
      var qA = Math.round((parseFloat(r.qty) || 0) * 100) / 100;
      if (qA > 0) {
        if (r.type === 'surplus') v.stock = Math.max(0, Math.round(((parseFloat(v.stock) || 0) - qA) * 100) / 100);
        else v.stock = Math.round(((parseFloat(v.stock) || 0) + qA) * 100) / 100;
      }
    }
    return; // 其余普通变体记录：开封时已扣 stock，删记录不自动回补（用户可另行盘点/补货）
  }
  // 多规格：按记录里的规格名把已开包数减回去
  var nm = String(r.specName || '');
  var s = specs.find(function (x) { return String(x.name || '') === nm; });
  if (!s) return;
  var pq = specPackQty(s);
  var back = 1;
  if (r.isAudit) {
    // 盘点流水：按生成时记录的包数精确回滚；盘盈删除则反向加回已开包数
    if (r.type === 'surplus') back = -(parseFloat(r.auditPacks) || 0);
    else back = parseFloat(r.auditPacks) || 1;
  } else if (pq > 0 && (parseFloat(r.qty) || 0) > pq) {
    back = Math.max(1, Math.ceil((parseFloat(r.qty) || pq) / pq - 1e-9));
  }
  s.openPacks = Math.max(0, Math.round((specOpenPacks(s) - back) * 100) / 100);
  s.qty = Math.round(specPackCount(s) * pq * 100) / 100;
  v.stock = variantSpecContent(v);
}
// ===== 【第 24 轮】清空记录 = 彻底回滚库存 =====
// 用户规则：点「清空全部使用记录」必须执行两件事 ——
//   ① 清空所有 usageRecords + 盘点审核历史（auditHistory），一条不留；
//   ② 把当前库存数字直接重置回该产品的「历史累计购入总量」
//      = 套餐数 × 规格数 × 单包容量（例：消耗得只剩 15 片 → 清空后立刻回到 100 片）。
// 清空后没有任何闭环记录 → 速率/采购建议一律归零，强制显示「📭 缺数据」，
// 绝不保留任何此前的速率推算。
function resetStockToBought(item) {
  if (!item) return 0;
  var bought = boughtTotalOf(item);
  (item.variants || []).forEach(function (v) {
    var sp = variantSpecsOf(v);
    if (sp.length) {
      (v.specs || []).forEach(function (s) {
        s.openPacks = 0;            // 已开包数归零 → 未开包数回到满额
        s.usedQty = 0;              // 即时型已消耗份数归零
        s.__openPack = false;
        s.qty = Math.round(specPackCount(s) * specPackQty(s) * 100) / 100;
      });
      v.stock = variantSpecContent(v);   // = Σ 购入件数 × 每包含量 × 每份规格
    } else {
      // 无规格明细：剩余件数 = 购入套餐数 × 每套件数
      var per = parseFloat(v.packQty) || 1;
      v.stock = Math.round(variantPacksBought(v) * per * 100) / 100;
    }
    v.opened = false;
    v.usedUp = false;
    v.finishDate = null;
    v.openDate = null;
    v.openQty = 0;
  });
  // 物品级兜底：没有变体的老数据，至少不能比「累计购入」还少
  if (!(item.variants && item.variants.length)) {
    item.stock = Math.max(parseFloat(item.stock) || 0, bought);
  }
  try { syncItemFromVariants(item); } catch (e) { console.error('syncItemFromVariants 异常已容错', e); }
  return bought;
}
// 一键清空某产品的全部使用记录（数据乱了时的救命按钮）
function clearAllUsageRecords(itemId) {

// 全局清空：清空所有产品的使用记录 + 回滚所有库存
function clearAllUsageRecordsGlobal() {
  var cnt = 0, items = 0;
  DB.zones.forEach(function (z) {
    (z.items || []).forEach(function (it) {
      if (!it || z.type !== 'consumable') return;
      var n = (it.usageRecords || []).length + (it.auditHistory || []).length;
      if (!n) return;
      cnt += n; items++;
      it.usageRecords = [];
      it.auditHistory = [];
      resetStockToBought(it);
    });
  });
  if (!items) { toast('还没有任何使用记录'); return; }
  saveDB();
  try { renderAll(); } catch (e) {}
  toast('🧹 已清空 ' + items + ' 个产品的 ' + cnt + ' 条记录，库存全部回滚到累计购入量');
}

function openCardDetail(zoneId, itemId) {

  // 【第 13 轮 · 修 Bug】盘点后再点产品偶尔打不开详情 —— 根因是某条脏数据让

  // 现在对账/正反面渲染全部加防御：任何异常都降级显示，保证详情 100% 能打开。
  if (zone.type === 'consumable') { try { reconcileItemState(item); } catch (e) { console.error('对账异常已容错', e); } }

      + '</div>';
  }

  // 默认直接显示背面（翻转状态），无需点两次
  document.getElementById('flip-inner').classList.add('flipped');
  document.getElementById('card-detail-overlay').classList.add('show');

  // 底层页面同步刷新：改动后返回列表时数据已是最新（不再需要退出重进）

function renderCardFront(item, zone) {

      if (isSetPackMode(item) && item.variants && item.variants.length && (item.variants[0].packQty || 1) > 1) {

      html += '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:13px;color:var(--text-secondary)">库存</span><span style="font-weight:700">' + totalStock + mainPackUnit(item) + packHintF + '</span></div>';
      html += '<div class="stock-bar ' + barClass + '"><div class="stock-fill" style="width:' + pct + '%"></div></div>';

    var variantTypes = (item.variants && item.variants.length) ? item.variants.length : 1;
    var totalPrice = calcDurableTotalPrice(item);

    if (editIdxF >= 0) {
      var editLabelF = (consumeModelOf(item) === 'instant') ? '✏️ 修改最近打卡' : '✏️ 修改使用中记录';
      html += '<button class="btn btn-outline btn-sm" style="width:100%;margin-top:10px;font-size:12px" onclick="openUsageEdit(\'' + item.id + '\',' + editIdxF + ')">' + editLabelF + '</button>';
    }

// 卡片正面「修改」按钮指向哪条记录：即时型 → 最近一条打卡；其余 → 最新一条「使用中」记录
function lastEditableRecordIdx(item) {
  var recs = (item && item.usageRecords) || [];
  if (!recs.length) return -1;
  if (consumeModelOf(item) === 'instant') {
    for (var i = recs.length - 1; i >= 0; i--) {
      if (recs[i] && recs[i].instant) return i;
    }
    return -1;
  }
  for (var j = recs.length - 1; j >= 0; j--) {
    var r = recs[j];
    if (r && !r.endDate && !r.instant && !r.isAudit && r.startDate) return j;
  }
  for (var k = recs.length - 1; k >= 0; k--) {
    if (recs[k] && !recs[k].instant) return k;
  }
  return -1;
}

            html += '<button class="btn btn-outline btn-sm" style="flex-shrink:0;font-size:11px;padding:5px 8px' + (packsRemain > 0 ? '' : ';opacity:.45') + '"' + (packsRemain > 0 ? '' : ' disabled') + ' onclick="openOnePack(\'' + item.id + '\',\'' + v.id + '\',' + si + ')">📦 开启新包</button>';
            html += '</div>';
          });
          // 逐条收尾：每条「使用中」的包在这里独立点「用完了」（不是一次性全部收尾）
          if (actCountV > 0) {
            html += '<div style="font-size:11px;color:var(--text-tertiary);margin-top:6px">☝️ 上面的「这件用完」按钮按包收尾，开几包就分别收几次</div>';
          }
          html += '</div>';   // 关闭内层「规格明细」容器
          html += '</div>';   // 关闭外层折叠容器
        }
        // 使用感受：有任意内容就显示（第 11 轮：支持就地编辑/删除，不再是死数据）
        if (v.feeling && (v.feeling.rating || (v.feeling.tags && v.feeling.tags.length > 0) || v.feeling.notes)) {
          html += '<div class="vc-feel">';
          html += '<div class="vc-feel-head">';
          html += '<span style="flex:1;font-size:11px;font-weight:500;color:var(--text-tertiary)">💕 我的感受</span>';
          html += '<button class="btn btn-outline rec-icon-btn" title="编辑感受" onclick="openVariantFeelingForm(\'' + item.id + '\',\'' + v.id + '\')">🪄</button>';
          html += '<button class="btn btn-outline rec-icon-btn rec-icon-danger" title="删除感受" onclick="removeVariantFeeling(\'' + item.id + '\',\'' + v.id + '\')">🗑️</button>';
          html += '</div>';
          if (v.feeling.rating) {
            html += '<div class="vc-stars">';
            for (var fi = 1; fi <= 5; fi++) html += fi <= v.feeling.rating ? '⭐' : '☆';
            html += '</div>';
          }
          if (v.feeling.tags && v.feeling.tags.length > 0) {
            html += '<div class="vc-tags">' + v.feeling.tags.map(escapeHtml).join(' · ') + '</div>';
          }
          if (v.feeling.notes) {
            html += '<div class="vc-note">💬 ' + escapeHtml(v.feeling.notes) + '</div>';
          }
          html += '</div>';
        } else {
          // 未填写：品牌名下给一个轻量提示入口（不占视觉重心）
          html += '<div style="margin-top:6px"><button class="btn btn-ghost btn-sm" style="font-size:11px;padding:3px 8px;color:var(--text-tertiary)" onclick="openVariantFeelingForm(\'' + item.id + '\',\'' + v.id + '\')">＋ 记录这个品牌的感受</button></div>';
        }
        // 操作：用完了 / 撤销（感受与弃用已上移到品牌名右侧）
        var footBtns = '';
        if (isUsing) {
          footBtns += '<button class="btn btn-outline btn-sm" onclick="finishVariant(\'' + item.id + '\',\'' + v.id + '\')">✅ ' + (actCountV > 1 ? '用完最早这' + (variantSpecsOf(v).length ? '包' : '件') : '用完了') + '</button>';
        } else if (isDone) {
          // 第 12 轮：撤销类按钮只留图标，去掉「撤销」二字
          footBtns += '<button class="btn btn-outline btn-sm" title="撤销「已用完」" onclick="undoFinishVariant(\'' + item.id + '\',\'' + v.id + '\')">↩️</button>';
        } else {
          var hasEndedRec = (item.usageRecords || []).some(function(r) { return r.variantId === v.id && r.endDate; });
          if (hasEndedRec) footBtns += '<button class="btn btn-outline btn-sm" title="撤销「已用完」" onclick="undoFinishVariant(\'' + item.id + '\',\'' + v.id + '\')">↩️</button>';
        }
        if (footBtns) { html += '<div class="vc-foot">' + footBtns + '</div>'; }
        html += '</div>';
      });
      // 折叠行：已用完 / 不再买的品牌
      if (doneVs.length > 0) {
        html += '<div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(142,142,147,0.10);font-size:12px;color:var(--text-secondary);text-align:center;cursor:pointer" onclick="toggleDoneVariants(\'' + item.id + '\')">';
        html += showDone ? '🔼 收起已用完 / 不再买的 ' + doneVs.length + ' 个品牌' : '👁 已藏 ' + doneVs.length + ' 个用完 / 不再买的品牌 · 点开查看';
        html += '</div>';
      }
      html += '</div>';
    }

    // === 区域3：消耗概览（第 11 轮：内含「使用记录」标题 + ✅用完 / 🪄编辑 选择器）===
    // 默认折叠 —— 不让一长串历史记录充斥屏幕；月/年耗量已上移至「库存与价格」模块。
    var hasRecsO = item.usageRecords && item.usageRecords.length > 0;
    if (hasRecsO || consumeModelOf(item) === 'instant') {
      // cModelR 已在上方「信息区」声明（第 10 轮上移），此处不再重复声明
      var actNowR = (item.variants || []).reduce(function (s, vv) { return s + variantActiveOpenRecs(item, vv).length; }, 0);
      var recCntO = hasRecsO ? item.usageRecords.length : 0;
      var rate = calcUsageRate(item);
      html += '<div class="back-section">';
      html += '<div class="back-section-title" style="display:flex;align-items:center;gap:6px;margin-bottom:6px">'
        + '<span style="flex:1">📒 使用记录 (' + recCntO + ' 条)</span>'
        + (actNowR > 0 ? '<span style="flex-shrink:0;font-size:11px;color:var(--orange);font-weight:500">' + actNowR + ' 件使用中</span>' : '')
        + '<button class="btn btn-outline rec-icon-btn" style="width:auto;padding:0 8px;font-size:11px" onclick="openFinishPick(\'' + item.id + '\')">✅ 用完</button>'
        + '<button class="btn btn-outline rec-icon-btn" style="width:auto;padding:0 8px;font-size:11px" onclick="openRecordPick(\'' + item.id + '\')">🪄 编辑</button>'
        + '</div>';
      html += '<details class="ledger-fold ov-fold">';
      html += '<summary><span style="font-size:14px">📊</span><span style="flex:1">消耗概览 (' + recCntO + ' 条记录)</span>';
      if (actNowR > 0) html += '<span style="font-size:11px;color:var(--orange);font-weight:500">' + actNowR + ' 件使用中</span>';
      html += '<span class="ov-caret">▼</span></summary>';
      html += '<div style="margin-top:10px">';
      // --- 摘要行 ---
      if (cModelR === 'instant') {
        var iuQty = instantUsedQty(item);
        var iuUnit = (item.variants && item.variants[0] ? (item.variants[0].packUnit || mainPackUnit(item)) : mainPackUnit(item)) || '份';
        html += '<div class="back-row"><span class="back-label">今年已用</span><span class="back-value" style="color:var(--accent);font-weight:700">' + trimNum(iuQty) + ' ' + escapeHtml(iuUnit) + '</span></div>';
        html += '<div class="back-row"><span class="back-label">剩余</span><span class="back-value">' + trimNum(restNowOf(item)) + ' ' + escapeHtml(iuUnit) + '</span></div>';
        var iuSt = statsOf(item);
        if (iuSt && iuSt.rate > 0 && iuSt.monthsLeft !== null) {
          html += '<div class="back-row"><span class="back-label">按当前速度</span><span class="back-value">还能用 ≈ ' + round1(iuSt.monthsLeft) + ' 个月</span></div>';
        }
        // 即时型：按品牌分账（第 11 轮：消耗记录同步展示在每个品牌条目下）
        var vsIu = (item.variants || []).filter(function (v) { return (parseFloat(v.stock) || 0) > 0 || instantUsedQty(item, v.id) > 0; });
        if (vsIu.length > 0) {
          html += '<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--separator)">';
          html += '<div style="font-size:11px;font-weight:600;color:var(--text-tertiary);margin-bottom:4px">按品牌分账</div>';
          vsIu.forEach(function (v) {
            var usedV = instantUsedQty(item, v.id);
            var leftV = variantRestPieces(v);
            html += '<div class="back-row" style="padding:3px 0"><span class="back-label" style="color:var(--text-secondary)">' + escapeHtml(v.brand || '未命名') + '</span>'
              + '<span class="back-value" style="font-size:12px">已用 ' + trimNum(usedV) + escapeHtml(iuUnit) + ' · 剩 ' + trimNum(leftV) + escapeHtml(iuUnit) + '</span></div>';
          });
          html += '</div>';
        }
      } else if (rate > 0) {
        // 第 10 轮：月消耗量 / 年消耗量已上移至「总库存」下方信息区，此处不再重复
        // 【第 26 轮】旧版在这里把「年需求件数 × 每套件数」标成「年需求容量」—— 那是拿件数冒充容量，已删除。
      }
      // --- 第 17 轮：详细「建议采购」已上移至顶部信息区（紧贴月/年消耗量），此处删除重复块 ---
      var stAll = statsOf(item);
      if (cModelR === 'instant' || (stAll && stAll.rate > 0)) {
        // 囤货提醒
        var stBack = getItemStatus(item);
        if (stBack.stockUpAlert) {
          html += '<div style="margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(175,82,222,0.08);font-size:12px;color:var(--purple);font-weight:600">🛒 按当前消耗约够 ' + (stBack.monthsLeft !== null ? stBack.monthsLeft : '?') + ' 个月，撑不到下次采购，建议囤货</div>';
        }
      }
      // --- 历史台账记录 ---
      if (hasRecsO) {
        html += '<div class="usage-log" style="margin-top:8px">';
        var allP = item.usageRecords.map(function(r, oi) { return { r: r, oi: oi }; });
        var actAll = allP.filter(function(w) { return !w.r.endDate && !w.r.instant && !w.r.isAudit && w.r.startDate; });
        var restAll = allP.filter(function(w) { return !(!w.r.endDate && !w.r.instant && !w.r.isAudit && w.r.startDate); });
        var shownRecs = actAll.concat(restAll.reverse()).slice(0, Math.max(8, actAll.length));
        shownRecs.forEach(function(w) {
          var r = w.r;
          var startStr = r.startDate ? formatDate(r.startDate) : (r.date ? formatDate(r.date) : '');
          var vsR0 = item.variants || [];
          var vR0 = r.variantId ? vsR0.find(function(x) { return x.id === r.variantId; }) : null;
          // 【第 26 轮 · 铁律】件数为主、容量为辅 →「7个（约840g）」
          // 旧版把「每套件数 9」乘进括号得到「1个（≈9个）」——那是拿件数冒充容量，已彻底禁止。
          var qtyTxt;
          var capU26 = capacityUnitOf(item);
          if (r.specText) {
            qtyTxt = escapeHtml(r.specText);
            // 只有容量类规格（g/ml）才补括号；片/粒类的 contentUsed 本身就是片数，补了会变成「≈15kg」这种错话
            if (r.contentUsed > 0 && isContentUnitText(capU26)) {
              qtyTxt += '（约' + trimNum(round1(r.contentUsed)) + escapeHtml(capU26) + '）';
            }
          } else {
            qtyTxt = recQtyText(r.qty || 1, item);
          }
          var recTxt;
          if (r.type === 'surplus') {
            var spU = (vR0 ? (vR0.packUnit || mainPackUnit(item)) : mainPackUnit(item)) || '份';
            recTxt = '📥 ' + (vR0 ? escapeHtml(vR0.brand) + ' · ' : '') + '盘盈入库 +' + trimNum(r.qty) + ' ' + escapeHtml(spU) + (startStr ? ' · ' + startStr : '');
          } else if (r.isAudit) {
            // 盘点盘亏流水：显示起止周期（可 ✏️ 修改开始/结束时间——第 9 轮要求）
            var endStrA = r.endDate ? formatDate(r.endDate) : '';
            recTxt = '⚖️ ' + (vR0 ? escapeHtml(vR0.brand) + ' · ' : '') + '盘点 ' + trimNum(r.qty) + ' ' + escapeHtml(rateUnitName(item)) + (startStr ? ' · ' + startStr + (endStrA ? ' → ' + endStrA : '') : '');
          } else if (r.instant) {
            var iu = instantCountUnit(item);   // 【第 20 轮】计数单位（片/包），绝不取 g/ml
            recTxt = '✨ ' + (vR0 ? escapeHtml(vR0.brand) + ' · ' : '') + (r.batch ? '批量 ' : '') + '消耗 ' + trimNum(r.qty) + ' ' + escapeHtml(iu) + (startStr ? ' · ' + startStr : '');
          } else if (r.endDate) {
            var days = daysBetween(new Date(r.startDate), new Date(r.endDate));
            recTxt = '📅 ' + startStr + ' → ' + formatDate(r.endDate) + ' · ' + days + '天 · ' + qtyTxt;
          } else if (startStr) {
            var actLine = variantActiveOpenRecs(item, vR0).length;
            recTxt = '📅 ' + startStr + ' · <span style="color:var(--orange);font-weight:600">使用中</span>（已用 ' + daysBetween(new Date(r.startDate), new Date()) + ' 天）· ' + qtyTxt + (actLine > 1 ? ' <span style="color:var(--text-tertiary)">· 并行 ' + actLine + ' 条</span>' : '');
          } else {
            recTxt = '📅 记录 · ' + qtyTxt;
          }
          html += '<div class="open-record" style="cursor:pointer;display:flex;align-items:center;gap:8px" onclick="openUsageEdit(\'' + item.id + '\',' + w.oi + ')"><span style="flex:1;min-width:0">' + recTxt + '</span>'
            + (r.isAudit
              ? '<button class="btn btn-outline rec-icon-btn" title="改周期" style="width:auto;padding:0 8px;color:var(--accent);border-color:rgba(90,200,250,0.45)" onclick="event.stopPropagation();openUsageEdit(\'' + item.id + '\',' + w.oi + ')">✏️ 改周期</button>'
              : '<button class="btn btn-outline rec-icon-btn" title="修改这条记录" onclick="event.stopPropagation();openUsageEdit(\'' + item.id + '\',' + w.oi + ')">🪄</button>')
            + '</div>';
        });
        html += '</div>';
        var zeroCnt = (item.usageRecords || []).filter(isZeroDayRecord).length;
        if (zeroCnt > 0) {
          html += '<div style="margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(255,149,0,0.10);font-size:12px;color:var(--orange);font-weight:600">⚠️ 检测到 ' + zeroCnt + ' 条 0 天记录（开始=结束），已自动剔除出消耗速率统计 · <span style="text-decoration:underline;cursor:pointer" onclick="purgeZeroRecords(\'' + item.id + '\')">一键清理</span></div>';
        }
        html += '<button class="btn btn-outline btn-sm" style="width:100%;margin-top:8px;color:var(--red);border-color:rgba(255,59,48,0.35)" onclick="clearAllUsageRecords(\'' + item.id + '\')">🗑️ 清空全部使用记录</button>';
      } else {
        html += '<div class="usage-log" style="margin-top:8px"><div style="font-size:12px;color:var(--text-tertiary);padding:8px 0">还没有记录。用上方按钮记一次消耗/开封，这里就会逐条留痕。</div></div>';
      }
      html += '</div>';
      html += '</details>';
      html += '</div>';
    }

    // === 价格历史 ===
    if (item.priceHistory && item.priceHistory.length > 0) {
      html += '<div class="back-section">';
      html += '<div class="back-section-title">价格历史 (' + item.priceHistory.length + '次)</div>';
      var prices = item.priceHistory.map(function(p) { return p.unitPrice || 0; });
      var minPrice = Math.min.apply(null, prices);
      var avgPrice = prices.reduce(function(s,p) { return s+p; }, 0) / prices.length;
      html += '<div class="back-row"><span class="back-label">历史最低</span><span class="back-value" style="color:var(--green)">¥' + minPrice.toFixed(2) + '</span></div>';
      html += '<div class="back-row"><span class="back-label">均价</span><span class="back-value">¥' + avgPrice.toFixed(2) + '</span></div>';
      html += '<div style="margin-top:8px">';
      item.priceHistory.slice().reverse().slice(0, 5).forEach(function(p) {
        html += '<div class="open-record">📅 ' + formatDate(p.date) + ' · ' + escapeHtml(p.channel||'') + ' · ¥' + parseFloat((p.unitPrice||0)).toFixed(2) + '/' + mainPackUnit(item);
        if (p.notes) html += ' · ' + escapeHtml(p.notes);
        html += '</div>';
      });
      html += '</div>';
      html += '</div>';
    }
  }

  // === 使用感受（第 11 轮：逻辑去重 —— 感受只属于具体品牌变体，主卡不再提供入口） ===
  // 没有具体品牌哪来感受：主卡的「感受」区块与按钮已全部移除，
  // 统一在「品牌变体 → 品牌名右侧 💕感受」或变体卡片内「💕 我的感受」处记录/编辑/删除。

  // === 耐用品：件数清单 + 使用情况 ===
  if (zone.type === 'durable') {
    ensureVariants(item);
    var variants = item.variants || [];
    html += '<div class="back-section">';
    var totalQty = variants.reduce(function(s,v){ return s + (v.stock||1); }, 0);
    html += '<div class="back-section-title" style="display:flex;justify-content:space-between;align-items:center">件数清单 (' + totalQty + '件 / ' + variants.length + '款)<button class="btn btn-outline btn-sm" style="font-size:12px;padding:4px 10px" onclick="addVariantFromDetail(\'' + item.id + '\')">＋ 添加</button></div>';
    if (variants.length > 0) {
      html += '<div class="variant-thumb-grid">';
      variants.forEach(function(v, vi) {
        var vPhotos = v.photos || [];
        html += '<div class="variant-thumb">';
        // 删除按钮
        html += '<button class="variant-del" onclick="event.stopPropagation();deleteVariant(\'' + item.id + '\',\'' + v.id + '\')">✕</button>';
        // 多件时在照片右上角叠 ×N 角标
        if (vPhotos.length > 0) {
          var allPhotos = vPhotos.map(function(p){ return p.replace(/"/g,'&quot;'); }).join('||');
          html += '<img src="' + vPhotos[0] + '" onclick="openPhotoViewer([\'' + vPhotos.join("','") + '\'],0)">';
          if ((v.stock||1) > 1) {
            html += '<div style="position:absolute;bottom:0;right:0;background:rgba(0,122,255,0.85);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px 0 0 0">×' + (v.stock||1) + '</div>';
          }
        } else {
          html += '<div class="variant-thumb-no-photo">📷</div>';
          if ((v.stock||1) > 1) {
            html += '<div style="position:absolute;bottom:0;right:0;background:rgba(0,122,255,0.85);color:#fff;font-size:11px;font-weight:700;padding:1px 6px">×' + (v.stock||1) + '</div>';
          }
        }
        html += '<div class="variant-label">' + escapeHtml(v.brand || ('第' + (vi+1) + '件')) + '</div>';
        // 价格展示：单件显示单价；多件显示 "单价 ×N = 总价"
        var vQty = v.stock || 1;
        var vUnitP = v.price || 0;
        var vTotalP = v.totalPrice || (vUnitP * vQty);
        if (vQty > 1 && vUnitP > 0) {
          html += '<div class="variant-sub">¥' + vUnitP.toFixed(2) + ' × ' + vQty + ' = ¥' + vTotalP.toFixed(2) + '</div>';
        } else if (vTotalP > 0) {
          html += '<div class="variant-sub">¥' + vTotalP.toFixed(2) + '</div>';
        }
        if (v.notes) html += '<div class="variant-sub" style="color:var(--text-secondary);font-size:11px;line-height:1.4;margin-top:2px">' + escapeHtml(v.notes) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    } else {
      html += '<div style="padding:8px 0;font-size:13px;color:var(--text-tertiary)">还没有件数记录</div>';
    }
    html += '</div>';
  }

  html += '</div>';
  document.getElementById('flip-back').innerHTML = html;
  return html;
}

// ========== 全屏照片查看器 ==========
var _viewerPhotos = [];
var _viewerIndex = 0;
var _viewerScale = 1;
var _viewerLastDist = 0;

function openPhotoViewer(photos, index) {
  if (!photos || photos.length === 0) return;
  _viewerPhotos = photos;
  _viewerIndex = index || 0;
  _viewerScale = 1;

  var html = '<div class="photo-viewer" id="photoViewer">';
  html += '<button class="photo-viewer-close" onclick="closePhotoViewer()">✕</button>';
  html += '<img id="viewerImg" src="' + photos[_viewerIndex] + '">';
  if (photos.length > 1) {
    html += '<div class="photo-viewer-counter" id="viewerCounter">' + (_viewerIndex+1) + ' / ' + photos.length + '</div>';
  }
  html += '</div>';

  // 移除旧的
  var old = document.getElementById('photoViewer');
  if (old) old.remove();

  document.body.insertAdjacentHTML('beforeend', html);

  var img = document.getElementById('viewerImg');
  var viewer = document.getElementById('photoViewer');

  // 单击关闭
  viewer.addEventListener('click', function(e) {
    if (e.target === viewer) closePhotoViewer();
  });

  // 左右滑动切换
  var touchStartX = 0, touchStartY = 0, touchMoved = false;
  img.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchMoved = false;
    }
    if (e.touches.length === 2) {
      _viewerLastDist = getTouchDist(e);
    }
  }, { passive: true });

  img.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dist = getTouchDist(e);
      if (_viewerLastDist > 0) {
        _viewerScale = Math.max(0.5, Math.min(4, _viewerScale * (dist / _viewerLastDist)));
        img.style.transform = 'scale(' + _viewerScale + ')';
      }
      _viewerLastDist = dist;
    } else if (e.touches.length === 1 && _viewerScale <= 1) {
      var dx = e.touches[0].clientX - touchStartX;
      var dy = e.touches[0].clientY - touchStartY;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) touchMoved = true;
    }
  }, { passive: false });

  img.addEventListener('touchend', function(e) {
    if (_viewerScale > 1) return; // 缩放状态下不切换
    if (!touchMoved) return;
    var touch = e.changedTouches[0];
    var dx = touch.clientX - touchStartX;
    var dy = touch.clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0 && _viewerIndex > 0) {
        _viewerIndex--;
        updateViewerImg();
      } else if (dx < 0 && _viewerIndex < _viewerPhotos.length - 1) {
        _viewerIndex++;
        updateViewerImg();
      }
    }
    _viewerScale = 1;
    img.style.transform = 'scale(1)';
  }, { passive: true });
}

function getTouchDist(e) {
  var dx = e.touches[0].clientX - e.touches[1].clientX;
  var dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function updateViewerImg() {
  var img = document.getElementById('viewerImg');
  var counter = document.getElementById('viewerCounter');
  if (img) {
    img.src = _viewerPhotos[_viewerIndex];
    img.style.transform = 'scale(1)';
    _viewerScale = 1;
  }
  if (counter) counter.textContent = (_viewerIndex+1) + ' / ' + _viewerPhotos.length;
}

// 保守策略：只补空缺，绝不改写已有数据（旧变体历史不动）。
function migrateTaskParent() {
  var fixed = 0;
  (DB.tasks || []).forEach(function (t) {
    if (!t.sourceItemId) {
      var found = null;
      (t.plans || []).forEach(function (p) { if (!found && p && p.sourceItemId) found = p.sourceItemId; });
      if (found && findItemByIdGlobal(found)) { t.sourceItemId = found; fixed++; }
    }
    (t.plans || []).forEach(function (p) {
      if (!p) return;
      if (!p.sourceItemId && t.sourceItemId) p.sourceItemId = t.sourceItemId;
      (p.subItems || []).forEach(function (s) { if (!s.kind) s.kind = 'normal'; });
    });
  });
  return fixed;
}

window.__errLog = [];
function showErrBar(msg, detail) {
  try {
    window.__errLog.push({ t: new Date().toLocaleTimeString(), msg: String(msg), detail: String(detail || '') });
    if (window.__errLog.length > 10) window.__errLog.shift();
    var bar = document.getElementById('err-bar');
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'err-bar';
      bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#d32f2f;color:#fff;font-size:12px;line-height:1.4;padding:7px 12px;word-break:break-all;box-shadow:0 2px 8px rgba(0,0,0,.25)';
      bar.onclick = function() {
        var d = window.__errLog.map(function(e) { return '[' + e.t + '] ' + e.msg + (e.detail ? '\n' + e.detail : ''); }).join('\n\n');
        var box = document.getElementById('err-bar-detail');
        if (box) { box.remove(); return; }
        box = document.createElement('pre');
        box.id = 'err-bar-detail';

        box.textContent = d + '\n\n（点此关闭）';
        box.onclick = function() {
          if (navigator.clipboard) navigator.clipboard.writeText(d).catch(function(){});
          box.remove();
        };
        document.body.appendChild(box);
      };
      (document.body || document.documentElement).appendChild(bar);
    }
    bar.textContent = '⚠️ ' + String(msg).slice(0, 160) + '（点按看详情/复制）';
  } catch (e) {}
}
window.addEventListener('error', function(ev) {
  showErrBar(ev.message, (ev.filename || '').split('/').pop() + ':' + ev.lineno + ':' + ev.colno);
});
window.addEventListener('unhandledrejection', function(ev) {
  var r = ev.reason;
  showErrBar('未处理的Promise异常: ' + ((r && r.message) ? r.message : String(r)), r && r.stack ? String(r.stack).slice(0, 500) : '');

// ========== 自动更新检查 ==========
// deploy.py 部署时会把 1791388211 替换为构建时间戳，并上传同目录 version.json
var APP_VERSION = '1791485550';

function checkAppUpdate(manual) {
  try {
    if (!APP_VERSION || APP_VERSION.indexOf('__BUILD') === 0) {
      if (manual) toast('当前为本地版本，无法检查更新');
      return;
    }
    if (manual) toast('🔍 正在检查更新…');
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        var remote = data && String(data.version || '');
        if (!remote) {
          if (manual) toast('检查失败，请检查网络');
          return;
        }
        // 数值比较（时间戳）：只在「线上确实比本机新」时才提示更新。
        // 若 version.json 反而更旧（部署方漏传），绝不能拿旧号去刷新 —— 否则会陷入
        // 「发现新版本 → 刷新 → 版本还是对不上 → 请关闭重开」的死循环（第 14 轮实锤 Bug）。
        var remoteNum = parseInt(remote, 10) || 0;
        var localNum = parseInt(APP_VERSION, 10) || 0;
        if (remoteNum === localNum) { // 版本一致，无需更新
          if (manual) toast('✅ 已是最新版本');
          return;
        }
        if (remoteNum < localNum) { // version.json 滞后于页面本身：视为最新，不折腾
          if (manual) toast('✅ 已是最新版本');
          return;
        }
        var key = 'jiayou_redirected_' + remote;
        if (sessionStorage.getItem(key)) { // 已为该版本跳转过，防循环
          if (manual) toast('已加载新版本，请关闭后重新打开');
          return;
        }
        sessionStorage.setItem(key, '1');
        toast('🔄 发现新版本，正在更新…');
        setTimeout(function() {
          // 带版本参数刷新，绕过 iOS PWA 的顽固缓存
          location.replace(location.pathname + '?v=' + remote + (location.hash || ''));
        }, 600);
      })
      .catch(function() {
        if (manual) toast('检查失败，请检查网络');
      });
  } catch(e) {}
}
// 每次切回前台（从后台唤醒 App）时静默检查一次
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) checkAppUpdate(false);
});

// 把构建时间戳转成可读的更新时间
function getAppVersionText() {
  if (!APP_VERSION || APP_VERSION.indexOf('__BUILD') === 0) return '本地开发版';
  var d = new Date(parseInt(APP_VERSION, 10) * 1000);
  if (isNaN(d.getTime())) return APP_VERSION;
  return formatDateTime(d.toISOString()) || APP_VERSION;
}

// ========== 开封 ==========
// 【并行开封铁律】判断「能不能开」只看**那个具体规格里还有没有未开封的库存**，
// 绝对不允许用「卡片总状态 / 品牌是否使用中」来限制子规格。
//   · 生发精华 2 瓶：开了第 1 瓶，第 2 瓶必须仍可随时开 → 两条记录同时「使用中」
//   · 粉底液正装+替换装：开了正装，替换装必须仍可开
//   · off relax 洗发水：正装/中样在用，只要替换装还有未开包，顶层【开封】菜单就必须显示它
function variantCanOpen(v, item) {
  if (!v) return false;
  if (variantSpecsOf(v).length) {
    // 多规格：只要「任一规格」还有未开的包 → 可开（不看品牌 opened 状态）
    return variantSpecsOf(v).some(function (s) { return specPacksRemaining(v, s) > 0; });
  }
  // 普通品牌：只看该品牌自身还有没有库存
  return (parseFloat(v.stock) || 0) > 0;
}
function openItem(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  ensureVariants(item);

  // 「开封」弹窗 = 展示「还有未开封库存」的全部品牌（含正在使用中的品牌）。
  // 关键：使用中 ≠ 不能开新的。只要该品牌还有剩余件数，就允许并行开封，
  // 不受卡片总状态的任何限制。
  var available = item.variants.filter(function(v) { return variantCanOpen(v, item); });
  if (available.length === 0) {
    var inUseCnt = item.variants.filter(function(v) { return variantActiveOpenRecs(item, v).length > 0; }).length;
    if (inUseCnt > 0) toast('所有品牌都已开满，没有未开封的库存了');
    else toast('没有可开封的库存了');
    return;
  }

  if (item.variants.length > 1) {
    // 多个品牌 → 先选品牌（支持同时开封多个）
    var isOneShot = (consumeModelOf(item) === 'instant');
    var html = '<div class="modal-handle"></div>';
    html += '<div class="modal-title">' + (isOneShot ? '✨ 消耗打卡 - 选品牌' : '🔓 开封 - 选品牌') + '</div>';
    html += '<div style="text-align:center;margin-bottom:12px;font-size:14px;font-weight:600">' + escapeHtml(item.name) + '</div>';
    if (isOneShot) {
      html += '<div style="text-align:center;margin-bottom:10px;font-size:12px;color:var(--text-secondary)">点一次扣一份，可反复点；扣到 0 自动归入「已用完」</div>';
    }
    available.forEach(function(v) {
      // 并行展示：该品牌正在使用中的开封条数（允许 >1，如 2 瓶同时开）
      var actN = variantActiveOpenRecs(item, v).length;
      var statusBadge = '';
      if (actN > 1) statusBadge = ' <span style="color:var(--orange);font-size:11px">· ' + actN + ' 件使用中</span>';
      else if (actN === 1) statusBadge = ' <span style="color:var(--orange);font-size:11px">· 使用中</span>';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:10px;background:#F8F8FA;margin-bottom:8px;cursor:pointer" onclick="openVariantItem(\'' + itemId + '\',\'' + v.id + '\')">';
      html += '<div style="font-weight:600">' + escapeHtml(v.brand || '未命名') + statusBadge + '</div>';
      if (variantSpecsOf(v).length) {
        var spT = variantSpecText(v);
        var remP = variantSpecPieces(v);
        if (isOneShot) {
          // 【第 20 轮】即时型：按计数单位显示真实剩余（Σ specRemainPieces），绝不出现「N 包可开」的开启语义
          var leftOne20 = 0;
          variantSpecsOf(v).forEach(function (s20) { leftOne20 += specRemainPieces(v, s20); });
          html += '<div style="color:var(--text-secondary);font-size:12px;text-align:right;max-width:60%">' + escapeHtml(spT) + (leftOne20 > 0 ? ' · 剩 ' + trimNum(leftOne20) + instantCountUnit(item) : '') + ' →</div>';
        } else {
          html += '<div style="color:var(--text-secondary);font-size:12px;text-align:right;max-width:60%">' + escapeHtml(spT) + (remP > 0 ? ' · 还剩 ' + trimNum(remP) + ' 包可开' : '') + ' →</div>';
        }
      } else {
        if (isOneShot) {
          html += '<div style="color:var(--text-secondary);font-size:13px">库存 ' + (v.stock||0) + instantCountUnit(item) + ' →</div>';
        } else {
          html += '<div style="color:var(--text-secondary);font-size:13px">库存 ' + (v.stock||0) + (v.packUnit || mainPackUnit(item)) + ' →</div>';
        }
      }
      html += '</div>';
    });
    if (!isOneShot) {
      html += '<div style="font-size:11px;color:var(--text-tertiary);text-align:center;margin-top:6px;line-height:1.5">可以同时开多个品牌 / 多个规格，互不影响；每条开封记录独立计时</div>';
    }
    html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">取消</button>';
    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('modal-overlay').classList.add('show');
  } else {
    // 只有一个品牌 → 直接开封
    openVariantItem(itemId, item.variants[0].id);
  }
}

// 开封具体品牌
function openVariantItem(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(v) { return v.id === variantId; });
