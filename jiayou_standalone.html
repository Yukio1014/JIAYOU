function generateYearStatsAndOpen(year) {
  var st = buildYearStats(Number(year));
  toast(year + ' 年档案已生成 · ' + st.itemCount + ' 件物品 · ¥' + st.totalSpend.toFixed(2));
  openYearReview(year);
}

// 清理：删掉已用完 / 不再买的品牌卡片（含照片与使用记录），年度档案已固化结论
function cleanupFinishedVariants(year) {
  year = year || String(new Date().getFullYear());
  if (!(DB.yearStats && DB.yearStats[String(year)])) {
    if (!confirm('还没有 ' + year + ' 年度档案。\n\n建议先生成档案，把这一年的消耗/花费固化下来，再清理。\n\n现在生成并继续？')) return;
    buildYearStats(Number(year));
  }
  var vCnt = 0, itemCnt = 0, photoCnt = 0;
  var plan = [];
  DB.zones.forEach(function(z) {
    (z.items || []).forEach(function(it) {
      if (!it.variants || !it.variants.length) return;
      var keep = it.variants.filter(function(v) { return !(v.usedUp || v.noRestock); });
      var drop = it.variants.filter(function(v) { return v.usedUp || v.noRestock; });
      if (drop.length === 0) return;
      drop.forEach(function(v) { photoCnt += ((v.photos || []).length); });
      vCnt += drop.length;
      if (keep.length === 0) itemCnt += 1;
      plan.push({ zone: z, item: it, keep: keep, dropAll: keep.length === 0 });
    });
  });
  if (vCnt === 0) {
    toast('没有用完 / 不再买的品牌可清理');
    return;
  }
  var msg = '将清理 ' + vCnt + ' 个品牌卡片';
  if (itemCnt > 0) msg += '（其中 ' + itemCnt + ' 个物品的品牌会全部清空，物品本身一并移除）';
  msg += '，含约 ' + photoCnt + ' 张照片。\n\n' + year + ' 年度档案已保存消耗量/花费/品牌评价，删了也留着结论。\n\n确定清理？此操作不可撤销。';
  if (!confirm(msg)) return;
  plan.forEach(function(p) {
    if (p.dropAll) {
      p.zone.items = p.zone.items.filter(function(x) { return x.id !== p.item.id; });
    } else {
      p.item.variants = p.keep;
      syncItemFromVariants(p.item);
    }
  });
  saveDB();
  closeModal();
  renderZone();
  if (document.getElementById('home-content')) renderHome();
  toast('🧹 已清理 ' + vCnt + ' 个品牌 · 年度档案保留');
}

// 详情页：展开/收起「已用完 / 不再买」的品牌卡片的品牌卡片

// 归档：不再提醒/不再出现在列表，但使用记录等历史数据全部保留
function archiveItem(itemId) {
  var item = findItemByIdGlobal(itemId);
  if (!item) return;
  var recCnt = (item.usageRecords && item.usageRecords.length) || 0;
  var msg = '归档「' + item.name + '」？\n\n归档后：不再出现在首页提醒和分类列表，也不再催你补货。\n\n' + recCnt + ' 条使用记录、价格、使用感受全部保留，随时可一键恢复。';
  if (!confirm(msg)) return;

  item.archivedAt = new Date().toISOString();
  saveDB();
  closeModal();
  closeCardDetail();
  renderZone();
  if (document.getElementById('home-content')) renderHome();
  toast('📦 已归档 · 数据都留着');
}

function unarchiveItem(itemId) {
  var item = findItemByIdGlobal(itemId);
  if (!item) return;
  item.archived = false;
  delete item.archivedAt;
  saveDB();
  closeModal();
  closeCardDetail();
  renderZone();
  if (document.getElementById('home-content')) renderHome();

}

// 归档箱：列出全部已归档物品，可恢复或彻底删除
function showArchivedBox() {
  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">📦 归档箱</div>';
  var rows = [];

  });

  }

    html += '<button class="btn btn-outline btn-sm" onclick="unarchiveItem(\'' + it.id + '\')">↩️ 恢复</button>';
    html += '</div>';
    html += '<div style="margin-top:8px;display:flex;gap:8px">';
    html += '<button class="btn btn-outline btn-sm" style="flex:1" onclick="closeModal();openCardDetail(\'' + z.id + '\',\'' + it.id + '\')">👀 查看记录</button>';
    html += '<button class="btn btn-danger btn-sm" onclick="deleteItemFromArchive(\'' + z.id + '\',\'' + it.id + '\')">🗑 删除</button>';
    html += '</div>';
    html += '</div>';

// 撤销单品牌/顶层用完状态
function undoFinish(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  ensureVariants(item);
  // 找到最近一个已用完的变体，恢复为使用中
  var lastFinished = null;
  for (var i = item.variants.length - 1; i >= 0; i--) {
    var v = item.variants[i];
    if (v.usedUp) { lastFinished = v; break; }
  }
  if (!lastFinished) {
    toast('没有可撤销的用完记录');
    return;
  }
  lastFinished.usedUp = false;
  lastFinished.finishDate = null;
  // 恢复使用记录
  if (item.usageRecords && item.usageRecords.length > 0) {
    for (var j = item.usageRecords.length - 1; j >= 0; j--) {
      var r = item.usageRecords[j];
      if (r.variantId === lastFinished.id && r.endDate) {
        r.endDate = null;
        break;
      }
    }
  }
  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已撤销用完');
}

// 撤销多变体某个变体的用完状态
function undoFinishVariant(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(vv) { return vv.id === variantId; });
  if (!v) { toast('该变体不存在'); return; }
  if (!v.usedUp) {
    // 多规格「本批用完」后的撤销：库存还剩着，只是把最近一次记录恢复为使用中
    var reopened = false;
    if (item.usageRecords) {
      for (var i = item.usageRecords.length - 1; i >= 0; i--) {
        var r0 = item.usageRecords[i];
        if (r0.variantId === variantId && r0.endDate) { r0.endDate = null; reopened = true; break; }
      }
    }
    if (!reopened) { toast('该变体未标记用完'); return; }
    v.opened = true;
    v.finishDate = null;
    syncItemFromVariants(item);
    saveDB();
    openCardDetail(currentZoneId, itemId);
    toast('已撤销：该批继续使用中');
    return;
  }
  v.usedUp = false;
  v.finishDate = null;
  if (item.usageRecords && item.usageRecords.length > 0) {
    for (var i = item.usageRecords.length - 1; i >= 0; i--) {
      var r = item.usageRecords[i];
      if (r.variantId === variantId && r.endDate) {
        r.endDate = null;
        break;
      }
    }
  }
  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已撤销用完');
}

      } else if (spA) {

          html += '<input type="number" class="form-input audit-spec-input" data-vi="' + i + '" data-si="' + si + '" data-content="' + (+s.content || 0) + '" data-recorded-qty="' + (+s.qty || 0) + '" value="' + (+s.qty || 0) + '" min="0" step="1" style="width:64px;text-align:center;font-weight:600" oninput="updateAuditTotal()">';
          html += '<span style="font-size:11px;color:var(--text-tertiary)">份</span>';
          html += '</div>';
        });

      } else {
        html += '<input type="number" class="form-input audit-variant-stock" data-idx="' + i + '" data-recorded="' + (v.stock || 0) + '" value="' + (v.stock || 0) + '" min="0" step="0.5" style="width:90px;text-align:center;font-size:16px;font-weight:600;flex-shrink:0" oninput="updateAuditTotal()">';
      }

  } else {

  }

  html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">按实物清点后填写，用于校正共用物品的消耗。</div>';

  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">取消</button>';

function updateAuditTotal() {
  var total = 0, recorded = 0;
  document.querySelectorAll('.audit-variant-stock').forEach(function(el) {
    total += parseFloat(el.value) || 0;
    recorded += parseFloat(el.getAttribute('data-recorded')) || 0;
  });
  // 多规格：份数 × 每份含量
  document.querySelectorAll('.audit-spec-input').forEach(function(el) {
    var c = parseFloat(el.getAttribute('data-content')) || 0;
    total += (parseFloat(el.value) || 0) * c;
    recorded += (parseFloat(el.getAttribute('data-recorded-qty')) || 0) * c;
  });
  total = Math.round(total * 100) / 100;
  recorded = Math.round(recorded * 100) / 100;
  var totalEl = document.getElementById('audit-total');
  if (totalEl) {
    var unit = totalEl.getAttribute('data-unit') || '个';
    totalEl.textContent = total + unit;
  }
  var diffEl = document.getElementById('audit-diff');
  if (diffEl) {
    var diff = Math.round((recorded - total) * 100) / 100;
    if (Math.abs(diff) >= 0.5) {
      diffEl.innerHTML = '⚠️ 与系统记录差 ' + (diff > 0 ? '+' : '') + diff + (totalEl ? totalEl.getAttribute('data-unit') : '个') + '（保存将按实际校正，你可再微调）';
      diffEl.style.color = 'var(--red)';
    } else {
      diffEl.textContent = '与系统记录一致 ✓';
      diffEl.style.color = 'var(--green)';
    }
  }
}

function saveStockAudit(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var variants = item.variants && item.variants.length > 0 ? item.variants : [];
  var recorded = 0;
  (item.variants || []).forEach(function(v) { if (!(item.consumeMode === 'pack' && v.opened && !v.usedUp)) recorded += (v.stock || 0); });
  var actual = 0;

  if (variants.length > 0) {
    var ok = true;
    variants.forEach(function(v, i) {
      var spS = (v.specs && v.specs.length) ? v.specs : null;
      if (spS) {
        // 多规格：按规格份数落账，库存由明细重算；盘出库存后自动解除「用完」
        var touched = false;
        spS.forEach(function (s, si) {
          var el = document.querySelector('.audit-spec-input[data-vi="' + i + '"][data-si="' + si + '"]');
          if (!el) return;
          var n = parseFloat(el.value);
          if (isNaN(n) || n < 0) { toast('请输入有效份数'); ok = false; return; }
          s.qty = n;
          touched = true;
        });
        if (touched) {
          v.stock = variantSpecContent(v);
          v.packCount = variantSpecPieces(v);
          v.packQty = 1;
          if (v.stock > 0) {
            v.usedUp = false; v.finishDate = null;
            // 使用中与否以「有没有未结束的开封记录」为准
            v.opened = (item.usageRecords || []).some(function(r) { return r.variantId === v.id && !r.endDate; });
          }
          else { v.usedUp = true; v.opened = false; if (!v.finishDate) v.finishDate = new Date().toISOString(); }
        }
        actual += v.stock || 0;
        return;
      }
      var input = document.querySelector('.audit-variant-stock[data-idx="' + i + '"]');
      if (!input) return; // 使用中跳过盘点，保留原 stock
      var val = parseFloat(input.value);
      if (isNaN(val) || val < 0) { toast('请输入有效数量'); ok = false; return; }
      v.stock = val;
      actual += val;
    });
    if (!ok) return;
  } else {
    var input = document.getElementById('audit-stock');
    actual = parseFloat(input ? input.value : NaN);
    if (isNaN(actual) || actual < 0) { toast('请输入有效数量'); return; }
    item.stock = actual;
  }

  var diff = recorded - actual; // 正数=实际用得更快

  if (!item.auditHistory) item.auditHistory = [];
  item.auditHistory.push({
    date: new Date().toISOString(),
    recorded: recorded,
    actual: actual,
    diff: diff
  });

  // 校正库存：把差异记成一条使用记录
  // 场景：出差/家人代用 → 中间没写记录，盘点时消失的那部分也是被用掉了
  // 规则：起点 = 上一条记录的结束日（没有则用 30 天前兜底），终点 = 今天
  // 这样「这一段」才会作为一条真实使用记录参与速率计算
  if (diff > 0) {
    if (!item.usageRecords) item.usageRecords = [];
    var nowA = new Date();
    // 找最近一条已结束记录的 endDate 作为起点（按日期不按数组顺序，防止乱序）
    var lastEndMs = null;
    item.usageRecords.forEach(function (r) {
      if (!r.endDate) return;
      var t = new Date(r.endDate).getTime();
      if (isNaN(t)) return;
      if (lastEndMs === null || t > lastEndMs) lastEndMs = t;
    });
    var startA = lastEndMs !== null ? new Date(lastEndMs) : new Date(nowA.getTime() - 30 * 86400000);
    // 起点不能晚于今天
    if (startA.getTime() > nowA.getTime()) startA = new Date(nowA.getTime() - 86400000);
    item.usageRecords.push({
      startDate: startA.toISOString(),
      endDate: nowA.toISOString(),
      qty: diff,
      variantId: null,
      brand: '盘点差异(共用)',
      isAudit: true
    });
  }

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  if (diff === 0) {
    toast('盘点完成，数量一致');
  } else if (diff > 0) {
    toast('盘点完成，差异 ' + diff + mainPackUnit(item) + '（实际用得更快）已校正');
  } else {
    toast('盘点完成，实际比记录多 ' + Math.abs(diff) + mainPackUnit(item));
  }
}

// ========== 分类管理 ==========
function openCategoryManager() {
  var zone = getZone(currentZoneId);
  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">分类管理</div>';
  html += '<div style="font-size:12px;color:var(--text-tertiary);margin-bottom:8px">大类下可加子分类（如：上装 → 春秋/夏/冬），添加物品时子分类选填</div>';
  html += '<div id="cat-list">';
  var mainCats = zone.categories.filter(function(c) { return !c.parentId; });
  if (mainCats.length === 0) {
    html += '<div style="padding:20px;text-align:center;color:var(--text-tertiary);font-size:13px">还没有分类</div>';
  }
  mainCats.forEach(function(cat) {
    var subs = getSubcategories(zone, cat.id);
    // 大类计数 = 自身 + 子分类的物品总数
    var subIds = subs.map(function(s) { return s.id; });
    var count = visibleItems(zone).filter(function(it) {
      return it.categoryId === cat.id || subIds.indexOf(it.categoryId) >= 0;
    }).length;
    html += '<div class="setting-row" style="border-radius:0;background:var(--card-bg)">';
    html += '<div><span class="setting-label" style="font-weight:700">' + escapeHtml(cat.name) + '</span><br><span class="setting-value">' + count + '件' + (subs.length > 0 ? ' · ' + subs.length + '个子类' : '') + '</span></div>';
    html += '<div style="display:flex;gap:6px">';
    html += '<button class="btn btn-outline btn-sm" onclick="addSubcategory(\'' + cat.id + '\')">＋子类</button>';
    html += '<button class="btn btn-outline btn-sm" onclick="editCategory(\'' + cat.id + '\')">改名</button>';
    html += '<button class="btn btn-danger btn-sm" onclick="deleteCategory(\'' + cat.id + '\')">删</button>';
    html += '</div></div>';
    // 子分类行（缩进）
    subs.forEach(function(sub) {
      var subCount = visibleItems(zone).filter(function(it) { return it.categoryId === sub.id; }).length;
      html += '<div class="setting-row" style="border-radius:0;padding-left:28px">';
      html += '<div><span class="setting-label">└ ' + escapeHtml(sub.name) + '</span><br><span class="setting-value">' + subCount + '件</span></div>';
      html += '<div style="display:flex;gap:6px">';

      html += '<button class="btn btn-danger btn-sm" onclick="deleteCategory(\'' + sub.id + '\')">删</button>';
      html += '</div></div>';
    });
  });
  html += '</div>';
  html += '<button class="btn btn-primary btn-full" style="margin-top:16px" onclick="addCategory()">＋ 添加大类</button>';
  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal();renderZone()">完成</button>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

// ========== 任务委托（原「目标锁定」完全重写） ==========
var taskState = { tab: '待接', searchOpen: false, search: '', sel: null, formPlans: [], batchIds: [] };

var TASK_TABS = [
  { key: '待接',   color: '#007AFF', label: '委托待接' },
  { key: '进行中', color: '#5856D8', label: '任务进行' },
  { key: '凯旋',   color: '#FFB300', label: '任务凯旋' },
  { key: '搁置',   color: '#FF9500', label: '任务搁置' }
];

function taskHaptic() { try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {} }
function escTask(s) { return escapeHtml(s); }
function trimNum(n) { var x = +n || 0; return (Math.round(x * 100) / 100).toString(); }
function fmtMoney(n) { var v = Math.round((+n || 0) * 100) / 100; return '¥' + v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function taskById(id) { var s = String(id); for (var i = 0; i < DB.tasks.length; i++) { if (String(DB.tasks[i].id) === s) return DB.tasks[i]; } return null; }
function taskNextId() { var m = 0; DB.tasks.forEach(function (t) { if (t.id > m) m = t.id; }); return m + 1; }
function planNextId() { var m = 0; DB.tasks.forEach(function (t) { (t.plans || []).forEach(function (p) { if (p.id > m) m = p.id; }); }); if (taskState && taskState.formPlans) taskState.formPlans.forEach(function (p) { if (p.id > m) m = p.id; }); return m + 1; }
function findPlan(t, pid) { if (!t.plans) return null; var s = String(pid); for (var i = 0; i < t.plans.length; i++) { if (String(t.plans[i].id) === s) return t.plans[i]; } return null; }
function cheapestPlan(t) { var best = null; (t.plans || []).forEach(function (p) { var a = +p.amount || 0; if (a > 0 && (!best || a < best.amount)) best = p; }); return best; }

// ---------- 混合套餐：一个方案可含多种规格（如 44粒装×3盒 + 70粒装×2盒 = 272粒）----------
function planSubList(p) {
  return (p.subItems || []).filter(function (s) { return (+s.spec > 0) && (+s.count > 0); });
}
function planSubSpec(p) { // 每套（一份套餐）的总含量
  var subs = planSubList(p);
  if (!subs.length) return 0;
  var per = 0;
  subs.forEach(function (s) { per += (+s.spec || 0) * (+s.count || 0); });
  return Math.round(per * 100) / 100;
}
function planSpecText(p) { // "44粒装×3 + 70粒装×2 = 272粒"
  var subs = planSubList(p);
  if (!subs.length) return '';
  var u0 = subs[0].unit || '';
  var parts = subs.map(function (s) {
    var nm = String(s.name || '').trim() || (trimNum(+s.spec) + (s.unit || ''));
    return nm + '×' + trimNum(+s.count);
  });
  return parts.join(' + ') + ' = ' + trimNum(planSubSpec(p)) + u0;
}
function planMultiUnit(p) {
  var subs = planSubList(p);
  if (subs.length && subs[0].unit) return subs[0].unit;
  return p.unit || '';
}
function planDerived(p) {
  var amount = +p.amount || 0;
  var qty = (+p.qty > 0) ? +p.qty : 1;
  var perSpec = planSubSpec(p);
  var spec = perSpec > 0 ? perSpec : (+p.spec || 0);
  var comboPrice = (+p.comboPrice > 0) ? +p.comboPrice : (qty > 0 ? amount / qty : amount);
  var totalSpec = spec * qty;
  var unitPrice = totalSpec > 0 ? amount / totalSpec : 0;
  return { amount: amount, qty: qty, spec: spec, comboPrice: comboPrice, totalSpec: totalSpec, unitPrice: unitPrice, perSpec: perSpec, multi: perSpec > 0 };
}
// 从方案"单位"文本解析每小单位含量："1kg"→1kg、"3kg"→3kg、"500g"→0.5kg、"200ml/瓶"→200ml+小单位名"瓶"
// 解析不了（如纯文字"包"）返回 null
function parseUnitContent(unit) {
  var s = String(unit || '').toLowerCase().trim();
  if (!s) return null;
  var m = s.match(/([0-9.]+)\s*(kg|千克|公斤|g|克|ml|毫升|l|升)/);
  if (!m) return null;
  var v = parseFloat(m[1]); if (!(v > 0)) return null;
  var u = m[2];
  if (u === '千克' || u === '公斤') u = 'kg';
  else if (u === '克') u = 'g';
  else if (u === '毫升') u = 'ml';
  else if (u === 'l' || u === '升') u = 'L';
  if (u === 'g' && v >= 1000) { u = 'kg'; v = v / 1000; }
  if (u === 'ml' && v >= 1000) { u = 'L'; v = v / 1000; }
  // 小单位名：含量匹配之后的剩余文本（"1kg/包"→包）；纯重量则无名
  var name = s.slice(m.index + m[0].length).replace(/^[\s\/\\*x×每\.\-、]+/, '').trim();
  if (/^[0-9]*$/.test(name)) name = '';
  return { v: v, u: u, name: name };
}
// 方案总含量：总份数 × 每份含量（单位文本可解析时），如 3套×4包×1kg = 12kg
function planTotalContent(p) {
  var d = planDerived(p);
  var c = parseUnitContent(p.unit);
  if (!c || !(d.totalSpec > 0)) return null;
  return { total: d.totalSpec * c.v, u: c.u, perUnit: c.v, name: c.name, totalUnits: d.totalSpec };
}
function planMin(t) { var m = Infinity; (t.plans || []).forEach(function (p) { var a = +p.amount || 0; if (a > 0 && a < m) m = a; }); return m === Infinity ? 0 : m; }
function planMax(t) { var m = 0; (t.plans || []).forEach(function (p) { var a = +p.amount || 0; if (a > m) m = a; }); return m; }
function planWeightStr(p) {
  var d = planDerived(p);
  if (d.multi) { var mt = planSpecText(p); return mt ? ('📦 ' + mt) : ''; }
  if (!(d.totalSpec > 0)) return '';
  var tc = planTotalContent(p);
  if (tc) return '📦 ≈' + trimNum(tc.total) + tc.u; // 真总重量（套×每套含×每份含量）
  return '📦 共 ' + trimNum(d.totalSpec) + (p.unit ? ' ' + p.unit : ' 份');
}
function taskWeightStr(t) {
  var inProgress = (t.status === '进行中' || t.status === '凯旋');
  var arr = [];
  (t.plans || []).forEach(function (p) {
    if (inProgress && p.buy === false) return;
    var tc = planTotalContent(p);
    if (tc) { arr.push({ v: tc.total, s: tc.u }); return; }
    var d = planDerived(p);
    if (d.totalSpec > 0) arr.push({ v: d.totalSpec, s: p.unit ? ' ' + p.unit : ' 份' });
  });
  if (arr.length === 0) return '';
  var suffixes = {};
  arr.forEach(function (x) { suffixes[x.s] = true; });
  var keys = Object.keys(suffixes);
  var vals = arr.map(function (x) { return x.v; });
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (keys.length > 1) return '📦 ' + arr.map(function (x) { return trimNum(x.v) + x.s; }).join(' + ');
  if (mn === mx) return '📦 ' + trimNum(mn) + keys[0];
  return '📦 ' + trimNum(mn) + '~' + trimNum(mx) + keys[0];
}
function taskAbandonAmt(t) {
  if (t.status === '搁置') return planMin(t);
  if (t.status === '凯旋') { var s = 0; (t.plans || []).forEach(function (p) { if (p.buy !== false) s += (+p.amount || 0); }); return s; }
  return 0;
}
function sortPlans(t) { return (t.plans || []).slice().sort(function (a, b) { if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1; return (a.id || 0) - (b.id || 0); }); }
function taskMatch(t, q) { q = (q || '').toLowerCase(); if (!q) return true; if ((t.name || '').toLowerCase().indexOf(q) >= 0) return true; return (t.plans || []).some(function (p) { return (p.name || '').toLowerCase().indexOf(q) >= 0; }); }
function taskPriceLabel(t) { var mn = planMin(t), mx = planMax(t); if (mn === mx) return '💰 价格 ' + fmtMoney(mn); return '💰 价格区间 ' + fmtMoney(mn) + ' ~ ' + fmtMoney(mx); }

// ---------- 渲染入口 ----------
function renderTasks() {
  var s = taskState;
  var html = '';

  // 标签页
  html += '<div class="task-tabs">';
  TASK_TABS.forEach(function (tb) {
    var on = s.tab === tb.key;
    html += '<div class="task-tab' + (on ? ' on' : '') + '" style="' + (on ? 'background:' + tb.color + ';border-color:' + tb.color : '') + '" onclick="taskSwitchTab(\'' + tb.key + '\')">' + tb.label + '</div>';
  });
  html += '</div>';

  // 战报条（按规范：仅待接/搁置，进行中/凯旋不显示，避免干扰主线）
  if (s.tab === '待接') {
    var need = 0, cnt = 0;
    DB.tasks.forEach(function (t) { if (t.status === '待接') { need += planMin(t); cnt++; } });
    html += '<div class="task-banner orange">解锁本区域全部目标，需消耗金币总额：' + fmtMoney(need) + '（' + cnt + ' 项）</div>';
  } else if (s.tab === '搁置') {

    DB.tasks.forEach(function (t) { if (t.status === '搁置') { saved += planMin(t); sc++; } });
    html += '<div class="task-banner green">成功抵御欲望侵蚀，回收 ' + fmtMoney(saved) + ' 金币！（' + sc + ' 项）</div>';
  }

  // 工具栏
  html += '<div class="task-toolbar">';
  html += '<button class="task-tool-btn" onclick="taskToggleSearch()">🔍 搜索</button>';
  html += '<button class="task-tool-btn' + (s.sel ? ' on' : '') + '" onclick="taskToggleSel()">' + (s.sel ? '✓ 退出多选' : '☑️ 多选') + '</button>';
  if (s.tab === '待接') html += '<button class="task-tool-btn primary" style="margin-left:auto" onclick="taskOpenForm()">＋ 新增委托</button>';
  else if (s.tab === '凯旋' || s.tab === '搁置') html += '<button class="task-tool-btn" style="margin-left:auto" onclick="taskClearModal()">🔄 重置</button>';
  else html += '<span class="spacer"></span>';
  html += '</div>';

  // 搜索框
  if (s.searchOpen) {
    html += '<div class="task-search-row"><input type="text" class="form-input" id="task-search-input" placeholder="搜委托名或方案名…" value="' + escTask(s.search) + '" oninput="taskOnSearch(this.value)"></div>';
  }

  // 列表
  var list = DB.tasks.filter(function (t) { return t.status === s.tab; });
  if (s.search) list = list.filter(function (t) { return taskMatch(t, s.search); });
  if (list.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">这里还没有委托<br>点击右上角「＋ 新增委托」开始登记</div></div>';
  } else {
    list.forEach(function (t) { html += taskCard(t); });
  }

  // 多选操作条
  if (s.sel) {
    html += '<div class="task-selbar">';
    var allSel = list.length > 0 && list.every(function (t) { return s.sel.has(t.id); });
    html += '<button class="task-tool-btn" onclick="taskSelAll()">' + (allSel ? '取消全选' : '全选') + '</button>';
    if (s.tab === '待接') {
      html += '<button class="btn btn-primary btn-sm" onclick="taskBatchStrike()">⚔️ 出击</button>';
      html += '<button class="btn btn-outline btn-sm" onclick="taskBatchAbandon()">🚫 放弃</button>';
    } else if (s.tab === '进行中') {
      html += '<button class="btn btn-success btn-sm" onclick="taskBatchWin()">🏆 凯旋</button>';
      html += '<button class="btn btn-outline btn-sm" onclick="taskBatchAbandon()">🚫 放弃</button>';
    } else {
      html += '<button class="btn btn-primary btn-sm" onclick="taskBatchRestart()">🔁 重启</button>';
    }
    html += '<button class="btn btn-danger btn-sm" onclick="taskBatchDestroy()">🗑️ 删除</button>';
    html += '</div>';
  }

  document.getElementById('pool-content').innerHTML = html;
}

// ---------- 卡片 ----------
function taskCard(t) {
  var s = taskState;
  var selMode = !!s.sel;
  var selected = selMode && s.sel.has(t.id);
  var html = '<div class="pool-item task-card' + (selected ? ' selon' : '') + '" data-task-id="' + t.id + '" onclick="taskCardTap(\'' + t.id + '\')">';

  // 头部：标题 + 状态标签
  html += '<div class="pool-header">';
  if (selMode) {
    html += '<div class="task-check" onclick="event.stopPropagation();taskSelToggle(\'' + t.id + '\')">' + (selected ? '✓' : '') + '</div>';
  }
  var title = escTask(t.name);
  if (t.status === '进行中') { var buyCnt = (t.plans || []).filter(function (p) { return p.buy !== false; }).length; if (buyCnt > 0) title += '（采购 ' + buyCnt + ' 项）'; }
  html += '<div style="flex:1;min-width:0"><div class="pool-name">' + title + '</div>';
  var meta = '';
  if (t.zoneId) { var zone = getZone(t.zoneId); if (zone) meta += zone.icon + ' ' + zone.name; }
  if (t.categoryId) { var cp = getCategoryPath(t.zoneId, t.categoryId); if (cp) meta += ' · ' + cp; }
  if (t.createdAt) meta += ' · ' + t.createdAt;
  if (meta) html += '<div class="pool-meta">' + meta + '</div>';
  html += '</div>';
  var stCls = t.status === '待接' ? 'status-pending' : (t.status === '进行中' ? 'status-decided' : (t.status === '凯旋' ? 'status-win' : 'status-given-up'));
  var stTxt = t.status === '待接' ? '待接' : (t.status === '进行中' ? '进行中' : (t.status === '凯旋' ? '凯旋' : '搁置'));
  html += '<span class="pool-status ' + stCls + '">' + stTxt + '</span>';
  html += '</div>';

  // 价格 / 重量行
  if (t.status === '进行中' || t.status === '凯旋') {
    var lpw = taskWeightStr(t);
    var lpAmt = t.lockedPlanId ? findPlan(t, t.lockedPlanId) : null;
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">💰 赏金 ' + (lpAmt ? fmtMoney(lpAmt.amount) : '') + (lpw ? ' · ' + lpw : '') + '</div>';
  } else if (t.status === '搁置') {
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">💰 放下省下 ' + fmtMoney(planMin(t)) + '</div>';
  } else {
    var w = taskWeightStr(t);
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">' + taskPriceLabel(t) + (w ? ' · ' + w : '') + '</div>';
    var pn = (t.plans || []).length;
    if (pn > 1) {
      var buyN = 0, selAmt = 0;
      (t.plans || []).forEach(function (p) { if (p.buy !== false) { buyN++; selAmt += (+p.amount || 0); } });
      html += '<div style="font-size:12px;font-weight:700;margin-top:4px;color:' + (buyN ? 'var(--accent)' : 'var(--red)') + '">☑️ 已选 ' + buyN + '/' + pn + ' 项采购 · 合计 ' + fmtMoney(selAmt) + (buyN ? '' : '（出击前请勾选要买的）') + '</div>';
    }
  }

  // 备注
  if (t.note) html += '<div class="pool-meta" style="margin-top:6px;color:var(--text-secondary)">' + escTask(t.note) + '</div>';

  // 同类库存提醒（保留特色）
  html += taskStockWarn(t);

  // 任务级照片（旧数据迁移带过来的）
  if (t.photos && t.photos.length) {
    html += '<div style="display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none">';
    t.photos.forEach(function (ph) { html += '<img src="' + ph + '" style="width:54px;height:54px;border-radius:8px;object-fit:cover;flex-shrink:0">'; });
    html += '</div>';
  }

  // 翻面提示
  if (!selMode && t.plans && t.plans.length > 0) {
    html += '<div style="margin-top:8px;font-size:12px;color:var(--accent)">👆 点卡片翻面看 ' + t.plans.length + ' 个备选方案</div>';
  }

  // 操作按钮
  html += '<div class="pool-actions">' + taskActionButtons(t) + '</div>';

  // 背面：备选方案
  html += '<div class="task-back"><div class="task-back-inner">';
  html += '<div style="font-size:13px;font-weight:700;margin-bottom:8px">📋 备选方案</div>';
  sortPlans(t).forEach(function (p) {
    var mark = '';
    if (t.status === '凯旋') mark = (p.buy !== false) ? '✅ 已执行' : '—';
    else if (t.status === '进行中') mark = (p.buy !== false) ? '⚔️ 采购中' : '—';
    else mark = '🟢 待选';
    var d = planDerived(p);
    var line = fmtMoney(p.amount);

    var tcL = planTotalContent(p);
    if (tcL && tcL.total > 0) line += ' · ≈' + fmtMoney((+p.amount || 0) / tcL.total) + '/' + tcL.u;
    else if (d.unitPrice > 0) line += ' · ≈' + fmtMoney(d.unitPrice) + '/' + (p.unit || '');
    if (p.note) line += ' · ' + escTask(p.note);
    html += '<div class="task-plan-row">';

    else html += '<div style="width:46px;height:46px;border-radius:8px;background:var(--separator);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px">📷</div>';
    html += '<div style="flex:1;min-width:0"><div class="pp-name">' + escTask(p.name || '未命名') + ' <span style="font-size:11px;font-weight:600;color:var(--text-secondary)">' + mark + '</span>' + planBuyChip(t, p) + (p.sourceVariantId ? ' <span style="font-size:11px;color:var(--accent)">↩库存</span>' : (p.sourceItemId ? ' <span style="font-size:11px;color:var(--accent)">↩新品</span>' : '')) + '</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px">' + line + '</div></div>';
    html += '</div>';
  });
  html += '</div></div>';

  html += '</div>';
  return html;
}

function taskStockWarn(t) {
  if (!t.zoneId) return '';
  var zone = getZone(t.zoneId); if (!zone) return '';
  var tName = String(t.name || '').trim().toLowerCase();
  if (!tName) return '';
  // 「同类」以产品本身为准：任务方案关联的物品，或物品名与任务名一致。
  // 不按分类聚合——宠物王国里的猫砂/零食/保健品替代不了猫粮，混在一起提示毫无意义
  var linkedItemIds = {};
  (t.plans || []).forEach(function (p) {
    if (p.sourceItemId) linkedItemIds[p.sourceItemId] = true;
    if (p.sourceVariantId) {
      zone.items.forEach(function (it) {
        if ((it.variants || []).some(function (v) { return v.id === p.sourceVariantId; })) linkedItemIds[it.id] = true;
      });
    }
  });
  var existing = zone.items.filter(function (it) {
    if (it.archived) return false;
    return linkedItemIds[it.id] || String(it.name || '').trim().toLowerCase() === tName;
  });
  if (existing.length > 0) {
    if (zone.type === 'durable') return '<div class="pool-warn">⚠️ 你已经有 ' + existing.length + ' 件「' + escTask(t.name) + '」了，确定要买吗？</div>';
    var parts = existing.slice(0, 3).map(function (it) { return it.name + ' ' + stockSummaryOf(it); });
    var more = existing.length > 3 ? ' 等 ' + existing.length + ' 种' : '';
    return '<div class="pool-warn">⚠️ 已有库存：' + escTask(parts.join('、')) + more + '</div>';
  }
  return '<div class="pool-ok">✓ 该产品暂无库存，可以买</div>';
}

    sortPlans(t).forEach(function (p) {

      else if (d.unitPrice > 0) line += ' · ≈' + fmtMoney(d.unitPrice) + '/' + (p.unit || '');
      if (p.note) line += ' · ' + escTask(p.note);
      html += '<label class="strike-plan' + (on ? ' on' : '') + '"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="strikeTogglePlan(\'' + t.id + '\',\'' + p.id + '\',this.checked)">';
      html += '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">' + escTask(p.name || '未命名') + (p.sourceVariantId ? ' <span style="font-size:11px;color:var(--accent)">↩库存</span>' : (p.sourceItemId ? ' <span style="font-size:11px;color:var(--accent)">↩新品</span>' : '')) + '</div><div style="font-size:12px;color:var(--text-secondary);margin-top:2px">' + line + '</div></div></label>';

function confirmStrike() {

  });

  closeModal(); saveDB(); renderTasks();
  toast('⚔️ 出击 ' + struck + ' 项' + (skipped ? '，' + skipped + ' 项未勾选保持待接' : ''));

}

function findItemByIdGlobal(itemId) {
  for (var zi = 0; zi < DB.zones.length; zi++) {
    var z = DB.zones[zi];
    for (var ii = 0; ii < (z.items || []).length; ii++) {
      if (z.items[ii].id === itemId) return z.items[ii];
    }
  }
  return null;
}

// 混合套餐凯旋：每个规格落成独立变体（套餐价按用户选择不分摊，整体记在第一个规格上）
function winMultiSpec(t, plan, totalPrice) {
  var d = planDerived(plan);
  var qty = d.qty > 0 ? d.qty : 1;
  var subs = planSubList(plan);
  var specTxt = planSpecText(plan);
  // 上次凯旋若已自动建过物品，这次继续累加到同一个物品（否则会重复建新品）
  var item = findItemByIdGlobal(plan.sourceItemId || plan.syncedItemId || '');
  if (!item) {
    if (!t.zoneId) return false;
    var zone = getZone(t.zoneId); if (!zone) return false;
    var u0 = subs[0].unit || (zone.type === 'durable' ? '件' : '个');
    var note0 = (t.note || '');
    note0 += (note0 ? '\n' : '') + '套餐规格：' + specTxt + ' · 套餐价 ¥' + trimNum(totalPrice) + '（多规格，价格未分摊）';
    item = {
      id: genId(), name: plan.name || t.name, categoryId: t.categoryId || null,
      consumeMode: 'pack', variants: [], unit: u0, stock: 0, currentPrice: 0,
      channel: '', location: '', notes: note0,
      photos: (plan.photos ? plan.photos.slice() : []), usageRecords: [], priceHistory: [], createdAt: new Date().toISOString()
    };
    if (zone.type === 'consumable') { item.shelfLife = null; item.productionDate = null; item.stockThreshold = 1; }
    zone.items.push(item);
    plan.syncedItemId = item.id;
  }
  if (!item.variants) item.variants = [];
  subs.forEach(function (s) {
    var perSpec = +s.spec || 0;
    var addCount = (+s.count || 0) * qty; // 该规格的份数（盒数）
    var u = s.unit || '';
    var nm = String(s.name || '').trim() || (trimNum(perSpec) + u);
    var v = null;
    (item.variants || []).forEach(function (vv) { if (String(vv.brand || '').trim() === nm) v = vv; });
    if (!v) {
      v = {
        id: genId(), brand: nm, packCount: 0, packPrice: 0, packQty: perSpec, packUnit: u || '个',
        packWeight: 0, packWeightUnit: 'kg', stock: 0, price: 0, totalPrice: 0,
        photos: (plan.photos || []).slice(), notes: '含于套餐：' + specTxt,
        opened: false, usedUp: false, openQty: 0, feeling: null, shelfLife: null, productionDate: null
      };
      item.variants.push(v);
    }
    v.packQty = perSpec;
    if (u) v.packUnit = u;
    v.packCount = (v.packCount || 0) + addCount;
    v.stock = (v.stock || 0) + addCount * perSpec;
    delete v.noRestock;
    // 价格不分摊：变体只记数量，金额统一由套餐价 × 套餐数得出
    v.packPrice = 0; v.price = 0; v.totalPrice = 0;
  });
  // 套餐价不分摊：记在第一个规格变体上，保证物品账面总额正确
  var firstV = item.variants.filter(function (x) { return subs.some(function (s) { return String(s.name || '').trim() === String(x.brand || '').trim(); }); })[0];
  if (firstV) {
    firstV.packPrice = plan.comboPrice || 0;
    firstV.totalPrice = totalPrice;
    firstV.price = firstV.stock > 0 ? Math.round((totalPrice / firstV.stock) * 100) / 100 : 0;
  }
  item.currentPrice = item.variants.reduce(function (s2, x) { return s2 + (x.totalPrice || ((x.price || 0) * (x.stock || 0))); }, 0);
  if (!item.priceHistory) item.priceHistory = [];
  item.priceHistory.push({ date: new Date().toISOString(), channel: '', quantity: qty, totalPrice: totalPrice, unitPrice: d.unitPrice || 0, notes: '任务委托·凯旋补货（混合套餐 ' + specTxt + '，价格未分摊）', brand: '', attachments: (plan.photos || []).slice() });
  return true;
}

// 凯旋：按勾选的「本次购买」方案逐条回写库存
function doWin(t) {
  var buys = (t.plans || []).filter(function (p) { return p.buy !== false; });
  if (buys.length === 0) return false;
  var anyOk = false;
  buys.forEach(function (plan) {
    var d = planDerived(plan);
    var qty = d.qty > 0 ? d.qty : 1;
    var totalPrice = Math.round((+plan.amount || 0) * 100) / 100;
    // ⓪ 混合套餐（多种规格）：每种规格落成独立变体，套餐价不分摊
    if (planSubList(plan).length) {
      if (winMultiSpec(t, plan, totalPrice)) anyOk = true;
      return;
    }
    if (plan.sourceVariantId && plan.sourceItemId) {
      // ① 已有品牌：直接给原物品变体加库存
      var item = findItemByIdGlobal(plan.sourceItemId);
      if (item) {
        var v = null;
        (item.variants || []).forEach(function (vv) { if (vv.id === plan.sourceVariantId) v = vv; });
        if (v) {
          // 容量数：以本次采购为准（线上套餐内含若变化，同步更新）
          var isWV = /kg|公斤|千克/i.test(plan.unit || '');
          var pcW = parseUnitContent(plan.unit);
          var vPackQty = (+plan.spec > 0) ? +plan.spec : (v.packQty || 1);
          v.packQty = vPackQty;
          // 单位文本可解析含量（"1kg"/"3kg"/"500g"）→ 每包重量按解析值记录，不再写死 1kg
          if (pcW && +plan.spec > 0) {
            v.packWeight = pcW.v; v.packWeightUnit = pcW.u;
            if (pcW.name && (!v.packUnit || v.packUnit === '个')) v.packUnit = pcW.name; // "1kg/包"→包
          } else if (isWV && +plan.spec > 0) { v.packWeight = 1; v.packWeightUnit = 'kg'; }
          if (plan.unit && !pcW) v.packUnit = plan.unit; // 非重量文本才作为小单位名覆盖
          delete v.noRestock; // 又买回来了 → 自动恢复计入补货提醒
          v.packCount = (v.packCount || 0) + qty;
          v.stock = (v.stock || 0) + qty * vPackQty;
          if (plan.comboPrice > 0) v.packPrice = plan.comboPrice;
          if (plan.amount > 0) { v.totalPrice = totalPrice; v.price = v.stock > 0 ? Math.round((totalPrice / v.stock) * 100) / 100 : plan.amount; }
          if (plan.photos && plan.photos.length) v.photos = plan.photos.slice();
          if (!item.variants) item.variants = [];
          item.currentPrice = item.variants.reduce(function (s, x) { return s + (x.totalPrice || ((x.price || 0) * (x.stock || 0))); }, 0);
          if (!item.priceHistory) item.priceHistory = [];
          item.priceHistory.push({ date: new Date().toISOString(), channel: '', quantity: qty, totalPrice: totalPrice, unitPrice: d.unitPrice || 0, notes: '任务委托·凯旋补货', brand: v.brand || '', attachments: (plan.photos || []).slice() });
          anyOk = true;
        }
      }
    } else if (plan.sourceItemId) {
      // ② 引用产品 + 新品牌：在该物品下自动新建变体并加库存（无需手动再添加）
      var item2 = findItemByIdGlobal(plan.sourceItemId);
      if (item2) {
        if (!item2.variants) item2.variants = [];
        var isW = /kg|公斤|千克/i.test(plan.unit || '');
        var pcN = parseUnitContent(plan.unit);
        var nvSpec = plan.spec || 1;
        var nvPackQty = nvSpec;
        var nvPackWeight = pcN ? pcN.v : (isW ? 1 : 0);
        var nvPackUnit = pcN ? (pcN.name || '包') : (plan.unit || '个');
        var nvStock = qty * nvPackQty;
        var nv = {
          id: genId(), brand: plan.name || '新品牌',
          packCount: qty, packPrice: plan.comboPrice || 0, packQty: nvPackQty, packUnit: nvPackUnit, packWeight: nvPackWeight, packWeightUnit: pcN ? pcN.u : 'kg',
          stock: nvStock, price: nvStock > 0 ? Math.round((totalPrice / nvStock) * 100) / 100 : (plan.amount || 0), totalPrice: totalPrice,
          photos: (plan.photos || []).slice(), notes: (plan.note || ''), opened: false, usedUp: false, openQty: 0, feeling: null, shelfLife: null, productionDate: null
        };
        item2.variants.push(nv);
        item2.currentPrice = item2.variants.reduce(function (s, x) { return s + (x.totalPrice || ((x.price || 0) * (x.stock || 0))); }, 0);
        if (!item2.priceHistory) item2.priceHistory = [];
        item2.priceHistory.push({ date: new Date().toISOString(), channel: '', quantity: qty, totalPrice: totalPrice, unitPrice: d.unitPrice || 0, notes: '任务委托·凯旋补货', brand: nv.brand, attachments: (plan.photos || []).slice() });
        anyOk = true;
      }
    } else {
      // ③ 纯新：在绑定领地/分类下新建物品
      if (!t.zoneId) return;
      var zone = getZone(t.zoneId); if (!zone) return;
      var unit = plan.unit || (zone.type === 'durable' ? '件' : '个');
      var note3 = (t.note || '');
      var tc3 = planTotalContent(plan);

function taskFormPlanCalc(i, field, val) {
  var p = taskState.formPlans[i]; if (!p) return;
  p[field] = val;
  var rawCombo = +p.comboPrice || 0, rawQty = +p.qty > 0 ? +p.qty : 0, rawAmt = +p.amount || 0;
  if (field === 'comboPrice') { if (rawQty > 0) p.amount = Math.round(rawCombo * rawQty * 100) / 100; }
  else if (field === 'qty') { if (rawCombo > 0) p.amount = Math.round(rawCombo * rawQty * 100) / 100; else if (rawAmt > 0 && rawQty > 0) p.comboPrice = Math.round(rawAmt / rawQty * 100) / 100; }
  else if (field === 'amount') { if (rawQty > 0) p.comboPrice = Math.round(rawAmt / rawQty * 100) / 100; }
  var amt = document.getElementById('task-plan-amount-' + i); if (amt) amt.value = p.amount;
  var co = document.getElementById('task-plan-calc-' + i); if (co) co.innerHTML = taskCalcOutHtml(p);
  var lbl = document.querySelector('[onclick="taskToggleCalc(' + i + ')"]'); if (lbl) lbl.innerHTML = taskCalcLabel(p);
  taskUpdateRange();
}
function taskUpdateRange() {

// 引用搜索：跨领地匹配物品名/品牌名，点选即引用（不用记领地/分类）
function taskRefSearch(kw) {
  var box = document.getElementById('ref-results'); if (!box) return;
  var zfEl = document.getElementById('ref-zone');
  var zoneFilter = zfEl ? zfEl.value : '';
  var preset = taskState.refPreset || null;

  var hits = [];
  DB.zones.forEach(function (z) {
    if (zoneFilter && z.id !== zoneFilter) return;
    visibleItems(z).forEach(function (it) {
      if (preset && (z.id !== preset.zoneId || (it.categoryId || null) !== (preset.categoryId || null))) return;
      if (kw === '') { hits.push({ zone: z, item: it }); return; }
      var inName = (it.name || '').toLowerCase().indexOf(kw) >= 0;
      var inBrand = (it.variants || []).some(function (v) { return (v.brand || '').toLowerCase().indexOf(kw) >= 0; });
      if (inName || inBrand) hits.push({ zone: z, item: it });
    });
  });
  if (kw === '' && !preset && !zoneFilter) {
    box.innerHTML = '<div style="font-size:12px;color:var(--text-tertiary);padding:6px 2px">🔍 输入名称搜索（跨所有领地），或选领地浏览全部产品</div>';
    return;

  if (!hits.length) { box.innerHTML = '<div style="font-size:12px;color:var(--text-tertiary);padding:6px 2px">未找到匹配的产品</div>'; return; }
  var html = '';

    var cp = getCategoryPath(h.zone.id, h.item.categoryId);

    html += '<div style="font-size:11px;color:var(--text-secondary)">' + h.zone.icon + ' ' + escTask(h.zone.name) + (cp ? ' · ' + escTask(cp) : '') + ' · ' + nb + ' 个品牌</div></div>';
    html += '<div style="font-size:12px;color:var(--accent);font-weight:600;flex-shrink:0">引用 ›</div>';
    html += '</div>';
  });
  if (hits.length > 30) html += '<div style="font-size:11px;color:var(--text-tertiary);padding:2px">仅显示前 30 条，继续输入可缩小范围</div>';

// 一键把已有物品「复制成待接委托」：免手输，进去再补套餐数/价格，凯旋后自动回写库存
function taskFromItem(zoneId, itemId, skipJump) {
  var zone = getZone(zoneId);
  if (!zone) { toast('领地不存在'); return; }
  var item = null;
  for (var i = 0; i < (zone.items || []).length; i++) {
    if (zone.items[i].id === itemId) { item = zone.items[i]; break; }
  }
  if (!item) { toast('物品不存在'); return; }
  // 已有未完成的同物品委托 → 不重复建，直接跳转
  var exist = null;
  DB.tasks.forEach(function (t) {
    if (t.sourceItemId === item.id && (t.status === '待接' || t.status === '进行中')) exist = t;
  });
  if (exist) {
    closeModal();
    if (!skipJump) {
      try { closeCardDetail(); } catch (e) {}
      showPage('pool');
    }
    toast('已有「' + item.name + '」的' + exist.status + '委托');
    return exist;
  }
  var variants = (item.variants && item.variants.length) ? item.variants
    : [{ id: null, brand: item.name, packPrice: item.currentPrice || 0, packQty: 1, packUnit: item.unit || '个', photos: [] }];
  var pid = planNextId();
  var plans = variants.map(function (v) {
    return {
      id: pid++,
      name: v.brand || item.name,
      amount: 0,
      comboPrice: Math.round(((+v.packPrice || +v.price || 0)) * 100) / 100,
      qty: 0,
      spec: v.packQty || 1,
      unit: v.packUnit || item.unit || '个',
      note: '',
      status: 'open',
      pinned: false,
      buy: true,
      photos: (v.photos || []).slice(),
      sourceItemId: item.id,
      sourceVariantId: v.id || null,
      _calcOpen: false
    };
  });
  var newId = 1;
  DB.tasks.forEach(function (t) { if (t.id >= newId) newId = t.id + 1; });
  var task = {
    id: newId,
    name: item.name,
    zoneId: zoneId,
    categoryId: item.categoryId || null,
    status: '待接',
    note: '由「' + zone.name + '」库存一键生成 · 凯旋后自动回写库存',
    plans: plans,
    pinned: false,
    sourceItemId: item.id,
    fromItem: true,
    createdAt: new Date().toISOString()
  };
  DB.tasks.push(task);
  saveDB();
  closeModal();
  if (!skipJump) {
    try { closeCardDetail(); } catch (e) {}
    showPage('pool');
  }
  toast('📋 已加入待接：' + item.name + '（' + plans.length + ' 个品牌待填价格）');
  return task;
}

// ========== 数据导入导出 ==========
function exportJSON() {
  var data = JSON.stringify(DB, null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '家有-备份-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出');
}

function importJSON(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.zones) { toast('文件格式不对'); return; }
      // 先解析好数据，再确认导入（避免confirm在异步回调中的问题）
      var newDB = mergeDB({
        zones: [], tasks: [],
        settings: {},
        version: 1
      }, data);
      // 直接导入，不再用confirm阻塞
      DB = newDB;
      saveDB();
      // 验证存储是否成功
      var saved = localStorage.getItem('jiayou_db');
      if (saved) {
        showPage('home');
        toast('导入成功，共' + (DB.zones||[]).length + '个领地');
      } else {
        toast('存储失败，请重试');
      }
    } catch(err) {
      console.error('导入失败:', err);
      toast('文件解析失败: ' + err.message);
    }
  };
  reader.onerror = function() {
    toast('文件读取失败');
  };
  reader.readAsText(file);
}

// ========== 工具函数 ==========
function daysBetween(d1, d2) {
  return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

function formatDateTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

// 图片压缩
function compressImage(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxDim = 800;
      var w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = h * maxDim / w; w = maxDim; }
        else { w = w * maxDim / h; h = maxDim; }
      }
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 导入文件监听
document.getElementById('import-input').addEventListener('change', function(e) {
  if (e.target.files[0]) importJSON(e.target.files[0]);
  e.target.value = '';
});

// ========== 预警详情弹窗 ==========
function showAlertDetail(type) {
  var title = '', items = [];
  if (type === 'expired') {
    title = '🔴 已过期';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).expired) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'expiring') {
    title = '🟡 即将过期（30天内）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).expiring) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'lowStock') {
    title = '🟡 库存告急';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).lowStock) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'lowStockSoft') {
    title = '🔵 余量较少';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).lowStockSoft) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'stockUp') {
    title = '🟣 该囤货了（撑不到下次采购）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).stockUpAlert) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'inUse') {
    title = '🔓 使用中（已开封正在用）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).hasInUse) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'stockpile') {
    title = '📦 囤货区（买了未开封）';
    DB.zones.forEach(function(zone) {
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).allUnopened) items.push({item: it, zone: zone});
      });
    });
  }

  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">' + title + '</div>';
  if (items.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">✓</div><div class="empty-text">没有需要关注的</div></div>';
  } else {
    if (type === 'stockpile') {
      items.sort(function(a, b) { return a.zone.name.localeCompare(b.zone.name); });
    }
    html += '<div style="margin-bottom:16px;font-size:13px;color:var(--text-secondary)">共 ' + items.length + ' 件</div>';
    var lastZone = null;
    var zoneCount = {};
    if (type === 'stockpile') {
      items.forEach(function(e) { zoneCount[e.zone.name] = (zoneCount[e.zone.name] || 0) + 1; });
    }
    items.forEach(function(entry) {
      var it = entry.item, zone = entry.zone;
      var status = getItemStatus(it);
      if (type === 'stockpile' && zone.name !== lastZone) {
        html += '<div style="font-weight:700;font-size:14px;margin:14px 0 6px;color:var(--text)">' + zone.icon + ' ' + escapeHtml(zone.name) + ' · ' + zoneCount[zone.name] + '件未开封</div>';
        lastZone = zone.name;
      }
      var bgColor = '#fff';
      if (type === 'expired') bgColor = 'rgba(255,59,48,0.06)';
      else if (type === 'expiring') bgColor = 'rgba(255,149,0,0.06)';
      else if (type === 'lowStock') bgColor = 'rgba(255,149,0,0.06)';
      else if (type === 'lowStockSoft') bgColor = 'rgba(90,200,250,0.06)';
      else if (type === 'stockUp') bgColor = 'rgba(175,82,222,0.06)';
      else if (type === 'stockpile') bgColor = 'rgba(142,142,147,0.06)';

      html += '<div style="display:flex;gap:10px;padding:12px;border-radius:10px;background:' + bgColor + ';margin-bottom:8px;cursor:pointer" onclick="closeModal();setTimeout(function(){enterZone(\'' + zone.id + '\')},200)">';
      // 照片
      html += '<div style="width:50px;height:50px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px">';
      if (it.photos && it.photos.length > 0) {
        html += '<img src="' + it.photos[0] + '" style="width:100%;height:100%;object-fit:cover">';
      } else {
        html += '📦';
      }
      html += '</div>';
      // 信息
      html += '<div style="flex:1;min-width:0">';
      html += '<div style="font-weight:700;font-size:15px">' + escapeHtml(it.name) + (it.oneShot ? ' <span style="font-size:11px;color:#fff;background:rgba(255,149,0,0.92);padding:1px 6px;border-radius:6px;font-weight:600;vertical-align:middle">⚡即用完</span>' : '') + '</div>';
      html += '<div style="font-size:12px;color:var(--text-secondary)">' + zone.icon + ' ' + escapeHtml(zone.name) + '</div>';
      if (type === 'expired') {
        html += '<div style="font-size:13px;color:var(--red);font-weight:600;margin-top:2px">⚠️ 已过期' + (status.daysLeft!==null?'（超期'+Math.abs(status.daysLeft)+'天）':'') + '</div>';
      } else if (type === 'expiring') {
        html += '<div style="font-size:13px;color:var(--orange);font-weight:600;margin-top:2px">⏰ 还剩 ' + status.daysLeft + ' 天过期</div>';
      } else if (type === 'lowStock') {
        var lowPack = '';
        if (it.consumeMode === 'pack' && it.variants && it.variants.length && (it.variants[0].packQty || 1) > 1) {
          var totS = getTotalStock(it);
          lowPack = '（约 ' + Math.floor(totS / Math.max(1, it.variants[0].packQty)) + ' 套）';
        }
        html += '<div style="font-size:13px;color:var(--orange);font-weight:600;margin-top:2px">📦 库存仅剩 ' + getTotalStock(it) + mainPackUnit(it) + lowPack + '（告急阈值' + (it.stockThreshold||1) + '）</div>';
      } else if (type === 'lowStockSoft') {
        var est = status.estDaysLeft;
        html += '<div style="font-size:13px;color:var(--blue);font-weight:600;margin-top:2px">⏳ 预计 ' + (est!==null?est:'?') + ' 天内用完</div>';
      } else if (type === 'stockUp') {
        var ml = status.monthsLeft;
        var estS = status.estDaysLeft;
        html += '<div style="font-size:13px;color:var(--purple);font-weight:600;margin-top:2px">🛒 约够用 ' + (ml!==null?ml:'?') + ' 个月' + (estS!==null&&estS!==undefined?'（'+estS+' 天）':'') + '，撑不到下次采购</div>';
      } else if (type === 'inUse') {
        var activeBrands = (it.variants||[]).filter(function(v){ return v.opened && !v.usedUp; }).map(function(v){ return v.brand||'未命名'; });
        html += '<div style="font-size:13px;color:var(--green);font-weight:600;margin-top:2px">🔓 使用中：' + (activeBrands.join('、') || '—') + '</div>';
      } else if (type === 'stockpile') {
        var totalS = getTotalStock(it);
        html += '<div style="font-size:13px;color:var(--text-secondary);font-weight:600;margin-top:2px">📦 库存 ' + (totalS||0) + mainPackUnit(it) + ' · 未开封</div>';
      }
      html += '</div>';
      html += '<button class="btn btn-outline btn-sm" style="flex-shrink:0;align-self:center;font-size:12px;padding:6px 10px" onclick="event.stopPropagation();taskFromItem(\'' + zone.id + '\',\'' + it.id + '\')">📋 委托</button>';
      html += '</div>';
    });
  }
  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">关闭</button>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

// ========== 首页过滤快捷（改为弹窗显示详情）==========
function filterExpired() { showAlertDetail('expired'); }
function filterExpiring() { showAlertDetail('expiring'); }
function filterLowStock() { showAlertDetail('lowStock'); }
function filterLowStockSoft() { showAlertDetail('lowStockSoft'); }
function filterStockUp() { showAlertDetail('stockUp'); }
function filterInUse() { showAlertDetail('inUse'); }
function filterStockpile() { showAlertDetail('stockpile'); }
</script>
</body>
</html>
