  if (consumeModelOf(item) === 'instant') {
    // 【第 20 轮】有规格明细的即时型：打卡必须选到具体规格，绝不按 v.stock（容量口径）扣
    if (variantSpecsOf(v).length) { openPunchSpecPick(itemId, variantId); return; }
    var iuUnit = instantCountUnit(item);
    var iuStock = parseFloat(v.stock) || 0;
    var iuUsed = instantUsedQty(item, variantId);
    var html = '<div class="modal-handle"></div>';
    html += '<div class="modal-title">✨ 消耗打卡</div>';
    html += '<div style="text-align:center;margin-bottom:16px">';
    html += '<div style="font-size:16px;font-weight:700">' + escapeHtml(item.name) + '</div>';
    html += '<div style="font-size:14px;color:var(--accent)">' + escapeHtml(v.brand) + '</div>';
    html += '<div style="font-size:13px;color:var(--text-secondary)">剩 ' + trimNum(iuStock) + iuUnit + ' · 今年已用 ' + trimNum(iuUsed) + iuUnit + '</div>';
    html += '</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);text-align:center;margin-bottom:12px">点一次只扣 <b>1</b> 份（绝不整批清零）；要一次扣多份请用「🔢 批量消耗」自己填数量</div>';
    html += '<div style="display:flex;gap:8px">';
    html += '<button class="btn btn-primary btn-full" ' + (iuStock > 0 ? '' : 'disabled style="opacity:.5"') + ' onclick="punchInstant(\'' + itemId + '\',\'' + variantId + '\');closeModal()">✨ 消耗一份</button>';
    html += '<button class="btn btn-outline btn-full" ' + (iuUsed > 0 ? '' : 'disabled style="opacity:.5"') + ' onclick="unpunchInstant(\'' + itemId + '\',\'' + variantId + '\');closeModal()">↩️ 撤销一次</button>';
    html += '</div>';
    html += '<div style="display:flex;gap:8px;margin-top:8px">';
    html += '<button class="btn btn-outline btn-sm" style="flex:1" onclick="batchPunchInstant(\'' + itemId + '\',\'' + variantId + '\')">🔢 批量消耗</button>';
    html += '<button class="btn btn-outline btn-sm" style="flex:1" onclick="closeModal();openStockAuditForm(\'' + itemId + '\')">📦 盘点</button>';
    html += '</div>';
    html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">关闭</button>';
    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('modal-overlay').classList.add('show');
    return;
  }

  // 混合规格：按子规格分行。**统一为「每次只开 1 包」**——
  // 点一次【开启新包】只扣这 1 包、只生成 1 条记录；要开 2 包就再点一次。
  // 绝不批量开启、绝不把整批一次性标记为使用中。
  var spOpen = variantSpecsOf(v);
  if (spOpen.length) {
    var nowDateStr = new Date().toISOString().split('T')[0];
    var html = '<div class="modal-handle"></div>';
    html += '<div class="modal-title">🔅 开启新包（按规格）</div>';
    // 左品牌 + 右未开总量；下方日期，再规格列表（第 9 轮统一排版）
    html += '<div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px">';
    html += '<div style="flex:1;min-width:0">';
    html += '<div style="font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(v.brand || item.name) + '</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px">未开 ' + trimNum(variantSpecContent(v)) + variantSpecUnit(v) + ' · 共 ' + trimNum(variantTotalWeight(v)) + variantSpecUnit(v) + '</div>';
    html += '</div>';
    html += '<div style="flex-shrink:0;text-align:right">';
    html += '<div style="font-size:18px;font-weight:700">' + trimNum(variantSpecPieces(v)) + ' <span style="font-size:12px;font-weight:500">包</span></div>';
    html += '<div style="font-size:11px;color:var(--text-tertiary)">未开</div>';
    html += '</div>';
    html += '</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">📦 点一次只开 <strong>1 包</strong>；开几包记几条，库存和记录一一对应。</div>';
    // 各规格剩余包数超出「单套包数」需要开多套：用户在此指定「按第几套开」
    var perSetNeed = spOpen.some(function (s) { return specPacksRemaining(v, s) > specPackCount(s); });
    var setIdx = 1;
    if (perSetNeed) {
      var maxSets = Math.max(1, Math.ceil(variantPacksBought(v)));
      html += '<div class="form-group"><label class="form-label">本次开的是第几套（买 ' + trimNum(variantPacksBought(v)) + ' 套）</label>';
      html += '<select class="form-input" id="open-set-idx" onchange="window._openSetIdx=parseInt(this.value)||1">';
      for (var si2 = 1; si2 <= maxSets; si2++) {
        html += '<option value="' + si2 + '">第 ' + si2 + ' 套</option>';
      }
      html += '</select></div>';
    } else {
      html += '<input type="hidden" id="open-set-idx" value="1">';
    }
    html += '<div class="form-group">';
    html += '<label class="form-label">开始使用日期</label>';
    html += '<input type="date" class="form-input" id="open-date" value="' + nowDateStr + '">';
    html += '</div>';
    spOpen.forEach(function (s) {
      var k = (v.specs || []).indexOf(s); // 原始下标：openOnePack 按 v.specs 解析
      var packsRemain = specPacksRemaining(v, s), pq = specPackQty(s), u = s.unit || '';
      var pieces = Math.round(packsRemain * pq * 100) / 100;
      var actRecs = variantActiveOpenRecs(item, v).filter(function (r) { return String(r.specName || '') === String(s.name || ''); });
      html += '<div style="padding:10px;background:var(--bg);border-radius:10px;margin-bottom:6px">';
      html += '<div style="display:flex;gap:8px;align-items:center">';
      html += '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">' + escapeHtml(s.name || ('规格' + (k + 1))) + '</div>';
      html += '<div style="font-size:12px;color:var(--text-secondary)">剩 ' + trimNum(pieces) + u + '（' + trimNum(packsRemain) + '包未开' + (pq !== 1 ? ' × ' + trimNum(pq) + u + '/包' : '') + '）' + (actRecs.length ? ' · <span style="color:var(--orange)">' + actRecs.length + ' 包使用中</span>' : '') + '</div></div>';
      html += '<button class="btn btn-outline btn-sm" style="flex-shrink:0;' + (packsRemain > 0 ? '' : 'opacity:.45') + '"' + (packsRemain > 0 ? '' : ' disabled') + ' onclick="openOnePack(\'' + itemId + '\',\'' + variantId + '\',' + k + ')">📦 开启新包</button>';
      html += '</div>';
      html += '</div>';
    });
    html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">关闭</button>';
    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('modal-overlay').classList.add('show');
    window._openQty = 1;
    window._maxOpenQty = 1;
    window._openSetIdx = setIdx;
    window._openVariantId = variantId;
    window._openItemId = itemId;
    return;
  }

  // 套餐消耗：开一整套，用完再开下一整套。
  // 并行修复：不再强制「必须用完上一套才能开下一套」——只要还有库存就允许再开一套。
  if ((item.consumeMode || 'pack') === 'pack') {
    var pq = Math.min(v.packQty || 1, v.stock || 1);
    if (pq <= 0) { toast('没有可开封的库存了'); return; }
    var actP = variantActiveOpenRecs(item, v).length;
    var html = '<div class="modal-handle"></div>';
    html += '<div class="modal-title">🔅 开封（整套）</div>';
    // 左品牌 + 右整套数量；下方日期（第 9 轮统一排版）
    html += '<div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px">';
    html += '<div style="flex:1;min-width:0">';
    html += '<div style="font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(v.brand || item.name) + '</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px">库存 ' + v.stock + (v.packUnit || mainPackUnit(item)) + ' · 每套 ' + (v.packQty||1) + (v.packUnit||'个') + (actP > 0 ? ' · <span style="color:var(--orange)">' + actP + ' 套使用中</span>' : '') + '</div>';
    html += '</div>';
    html += '<div style="flex-shrink:0;text-align:right">';
    html += '<div style="font-size:18px;font-weight:700">' + pq + ' <span style="font-size:12px;font-weight:500">' + (v.packUnit||'个') + '</span></div>';
    html += '<div style="font-size:11px;color:var(--text-tertiary)">整套开封</div>';
    html += '</div>';
    html += '</div>';
    html += '<div class="form-group">';
    html += '<label class="form-label">开始使用日期</label>';
    html += '<input type="date" class="form-input" id="open-date" value="' + new Date().toISOString().split('T')[0] + '">';
    html += '</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);text-align:center;margin-bottom:10px">' + (actP > 0 ? '上一套还在用？没关系，可并行开新的一套' : '用完这一整套后再开下一整套') + '</div>';
    html += '<button class="btn btn-primary btn-full" onclick="confirmOpen(\'' + itemId + '\',\'' + variantId + '\')">确认开封一整套</button>';
    html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">取消</button>';
    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('modal-overlay').classList.add('show');
    window._openQty = pq;
    window._maxOpenQty = v.stock || 1;
    window._openVariantId = variantId;
    return;
  }

  // 普通变体：**默认只开 1 件**（不批量）。要同时开 2 件就点两次【开封】。
  // 第 9 轮排版：左侧品牌名（+库存小字），右侧数量输入框；下一行开始使用日期。垂直对齐。
  var maxQty = v.stock || 1;
  if (maxQty <= 0) { toast('没有可开封的库存了'); return; }
  var actN2 = variantActiveOpenRecs(item, v).length;
  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">🔅 开封</div>';
  html += '<div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px">';
  html += '<div style="flex:1;min-width:0">';
  html += '<div style="font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(v.brand || item.name) + '</div>';
  html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px">库存 ' + v.stock + (v.packUnit || mainPackUnit(item)) + (actN2 > 0 ? ' · <span style="color:var(--orange)">' + actN2 + ' 件使用中</span>' : '') + '</div>';
  html += '</div>';
  html += '<div style="flex-shrink:0;display:flex;align-items:center;gap:6px">';
  html += '<input type="number" class="form-input" id="open-qty-input" step="1" min="1" max="' + Math.floor(maxQty) + '" value="1" style="width:76px;text-align:center;font-size:18px;font-weight:700" oninput="window._openQty=Math.max(1,Math.min(window._maxOpenQty,parseFloat(this.value)||1))">';
  html += '<span style="font-size:12px;color:var(--text-secondary)">件</span>';
  html += '</div>';
  html += '</div>';
  html += '<div class="form-group">';
  html += '<label class="form-label">开始使用日期</label>';
  html += '<input type="date" class="form-input" id="open-date" value="' + new Date().toISOString().split('T')[0] + '">';
  html += '</div>';
  html += '<div style="font-size:12px;color:var(--text-secondary);text-align:center;margin-bottom:10px">默认只开 <strong>1 件</strong>，开几件记几条独立记录' + (actN2 > 0 ? '；已开着 ' + actN2 + ' 件，可继续并行' : '') + '</div>';
  html += '<button class="btn btn-primary btn-full" onclick="confirmOpen(\'' + itemId + '\',\'' + variantId + '\')">确认开封</button>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');

  window._openQty = 1;
  window._maxOpenQty = maxQty;
  window._openVariantId = variantId;
  window._openItemId = itemId;
}

// 【已废弃】多规格步进器已移除（旧逻辑上限是「件数」而非「剩余包数」，会导致一键清零）。
// 上限已修正为「该规格剩余包数」，仅保留函数体供历史调用兼容。
function adjustSpecOpen(k, delta) {
  var q = window._openSpecQty || {};
  var item = getItem(currentZoneId, window._openItemId);
  var v = item && item.variants ? item.variants.find(function (x) { return x.id === window._openVariantId; }) : null;
  var s = v ? (v.specs || [])[k] : null;
  // 上限 = 该规格「剩余未开包数」（不是件数），且不允许超过剩余
  var max = (v && s) ? specPacksRemaining(v, s) : 0;
  q[k] = Math.max(0, Math.min(max, (q[k] || 0) + delta));
  window._openSpecQty = q;
  var el = document.getElementById('spec-open-' + k);
  if (el) el.textContent = q[k];
}

// ========== 组合/规格型：动作按「包」，统计按「件」 ==========
// 说明：specIdx 是 v.specs 的原始下标（UI 与记录都用它），但只有「有效规格」才可操作
// 【单包开启铁律】点一次只开 1 包：库存 -1 包，使用记录 +1 条，严格一一对应。
// 并行铁律：同规格允许多条未结束记录并存（开第 2 包不会结束第 1 包）；
//           不看品牌/卡片的 opened 状态，只看**这个规格**还有没有未开的包。
function openOnePack(itemId, variantId, specIdx) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function (x) { return x.id === variantId; });
  if (!v) return;
  var s = (v.specs || [])[specIdx];
  if (!s) return;
  // 该规格必须还有未开的包（剩余包数 > 0），否则视为不可操作
  var remaining = specPacksRemaining(v, s);
  if (remaining <= 0) { toast('这个规格已经没有新包了，等新的一批到货或补货吧'); return; }
  var pq = specPackQty(s), u = s.unit || '';
  var nm = s.name || ('规格' + (specIdx + 1));

  // === 关键修复：只开 1 包 ===
  // 库存扣减 = 该规格「已开包数」+1（跨套累计）。绝不多扣、绝不批量。
  s.openPacks = Math.round((specOpenPacks(s) + 1) * 100) / 100;
  // 兼容字段 qty：该规格「单套内包数 × 每包含量」（构成口径，保持稳定不变）
  s.qty = Math.round(specPackCount(s) * pq * 100) / 100;
  // 记下「这一包正在用」的开始时间（同规格可多包并行，各自独立计时）
  var pkey = '__packOpenAt_' + specIdx;
  if (!s[pkey]) s[pkey] = new Date().toISOString();
  s.__openPack = true;

  // 开封日期：优先用弹窗里用户选的日期，缺省为当前时间
  var dEl = document.getElementById('open-date');
  var dVal = (dEl && dEl.value) ? dEl.value : '';
  var nowISO;
  if (dVal) {
    var dt = new Date(dVal + 'T00:00:00');
    nowISO = isNaN(dt.getTime()) ? new Date().toISOString() : dt.toISOString();
  } else {
    nowISO = new Date().toISOString();
  }

  // === 库存与日志严格一对一：开 1 包 = 生成 1 条记录 ===
  if (!item.usageRecords) item.usageRecords = [];
  // 注意：这里**不结束**同规格的上一条记录 —— 开新包只代表「开始用新的一包」，
  // 上一条记录可以继续使用中（并行）。每条记录在各自「用完」时独立收尾。
  item.usageRecords.push({
    startDate: nowISO, endDate: null,
    qty: pq, variantId: variantId, brand: v.brand,
    specName: nm, packIdx: specIdx, packPieces: pq,
    specText: nm + '×1包' + (pq !== 1 ? '（' + trimNum(pq) + u + '）' : '')
  });

  if (variantSpecsOf(v).length) v.stock = variantSpecContent(v);
  v.opened = true;
  v.openDate = nowISO;
  var allGone = variantSpecsOf(v).every(function (x) { return specPacksRemaining(v, x) <= 0; });
  if (allGone && variantSpecContent(v) <= 0) { v.usedUp = true; v.finishDate = nowISO; }
  else { v.usedUp = false; v.finishDate = null; }
  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  var nowRemain = specPacksRemaining(v, s);
  var actN = variantActiveOpenRecs(item, v).filter(function (r) { return String(r.specName || '') === String(nm); }).length;
  toast('已开启 ' + nm + ' ×1包' + (pq !== 1 ? '（' + trimNum(pq) + u + '）' : '') + ' · 该规格剩 ' + trimNum(nowRemain) + ' 包未开' + (actN > 1 ? ' · ' + actN + ' 包并行使用中' : ''));
}

// 【并行收尾】按单条开封记录独立结束（不再一次性结束该规格的全部记录）。
// recIdx 为 usageRecords 中的下标；缺省时结束该品牌最早的一条未结束记录。
function finishOpenRec(itemId, recIdx) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var recs = item.usageRecords || [];
  var rec = null;
  if (recIdx !== undefined && recIdx !== null && recs[recIdx] && !recs[recIdx].endDate) {
    rec = recs[recIdx];
  } else {
    // 缺省：优先结束最早一条未结束的普通开封记录
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i];
      if (r && !r.endDate && !r.instant && r.type !== 'surplus') { rec = r; break; }
    }
  }
  if (!rec) { toast('没有正在使用的开封记录'); return; }
  var v = (item.variants || []).find(function (x) { return x.id === rec.variantId; });
  var nowISO = new Date().toISOString();
  var isToday = false;
  if (rec.startDate) {
    var nd = new Date();
    isToday = new Date(rec.startDate).toDateString() === nd.toDateString();
  }
  // 0 天防御：同一天开、同一天用完 → 结束日期退到次日，避免生成 0 天记录污染速率
  rec.endDate = isToday ? new Date(new Date(rec.startDate).getTime() + 86400000).toISOString() : nowISO;
  reconcileItemState(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  var nmTxt = rec.specName ? ('「' + rec.specName + '」') : (v ? ('「' + (v.brand || '') + '」') : '');
  toast('✅ ' + nmTxt + '这' + (rec.specName ? '包' : '件') + '已记用完');
}

function confirmOpen(itemId, variantId, markAsUsed) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(v) { return v.id === variantId; });
  if (!v) return;
  var dateInput = document.getElementById('open-date');
  var date = dateInput ? dateInput.value : new Date().toISOString().split('T')[0];
  var nowISO = new Date(date).toISOString();

  // 多规格：逐步进器批量开封（历史入口，保留兼容）——**按规格各自生成一条记录**，
  // 绝不把多个规格合并成一条（库存与日志严格一对一）。
  var spOpen = variantSpecsOf(v);
  if (spOpen.length && window._openSpecQty) {
    var usedParts = [], pieces = 0, contentUsed = 0;
    var spUnit = variantSpecUnit(v); // 先取单位：扣完可能全部归零，之后再取就空了
    var newRecs = [];
    spOpen.forEach(function (s) {
      var k = (v.specs || []).indexOf(s); // 原始下标：与 adjustSpecOpen / 表单一致
      // 上限严格 = 该规格剩余未开包数（绝不超过剩余，绝不批量清零）
      var packs = Math.max(0, Math.min(Math.floor(window._openSpecQty[k] || 0), specPacksRemaining(v, s)));
      if (packs <= 0) return;
      var pq = specPackQty(s);
      var nmS = s.name || ('规格' + (k + 1));
      s.openPacks = Math.round((specOpenPacks(s) + packs) * 100) / 100;
      s.qty = Math.round(specPackCount(s) * specPackQty(s) * 100) / 100; // 兼容字段：构成口径
      usedParts.push(nmS + '×' + trimNum(packs) + '包');
      pieces += packs * pq;
      contentUsed += packs * pq * specContentOf(s);
      // 一一对应：开 N 包就生成 N 条独立记录，各自独立计时、独立收尾
      for (var n = 0; n < packs; n++) {
        newRecs.push({
          startDate: nowISO,
          endDate: null,
          qty: pq,
          variantId: variantId,
          brand: v.brand,
          specName: nmS,
          packIdx: k,
          packPieces: pq,
          specText: nmS + '×1包' + (pq !== 1 ? '（' + trimNum(pq) + spUnit + '）' : '')
        });
      }
    });
    if (!newRecs.length) { toast('先选择要开封的规格'); return; }
    v.opened = true;
    v.openDate = nowISO;
    v.openQty = pieces;
    v.stock = variantSpecContent(v);
    if (!item.usageRecords) item.usageRecords = [];
    newRecs.forEach(function (nr) { item.usageRecords.push(nr); });
    var allEmpty = spOpen.every(function (s) { return specPacksRemaining(v, s) <= 0; });
    if (allEmpty && variantSpecContent(v) <= 0) { v.usedUp = true; v.finishDate = nowISO; }
    else { v.usedUp = false; v.finishDate = null; }
    syncItemFromVariants(item);
    saveDB();
    closeModal();
    openCardDetail(currentZoneId, itemId);
    toast('已开封 ' + escapeHtml(v.brand) + '：' + usedParts.join(' + ') + '，共 ' + newRecs.length + ' 条记录，- ' + trimNum(contentUsed) + spUnit);
    return;
  }

  var qty = window._openQty || 1;
  if (qty > (v.stock || 0)) qty = v.stock || 0; // 不超过现有库存
  if (qty <= 0) { toast('没有可开封的库存了'); return; }

  // 并行：不再强制「用完才能再开」，本次开封只新增记录，不影响已有未结束记录
  v.opened = true;
  v.usedUp = !!markAsUsed;
  v.openDate = nowISO;
  v.openQty = qty;
  v.stock = Math.max(0, (v.stock || 0) - qty);
  if (markAsUsed) {
    // 一次性「开了就记用完」：0 天防御，结束日期退到次日
    v.finishDate = new Date(new Date(nowISO).getTime() + 86400000).toISOString();
  }

  // 【严格一对一】开了几件 = 几条记录（每件独立计时，并行互不干扰）
  if (!item.usageRecords) item.usageRecords = [];
  var nItems = Math.max(1, Math.floor(qty));
  var unitEach = Math.round((qty / nItems) * 100) / 100;
  for (var ii = 0; ii < nItems; ii++) {
    item.usageRecords.push({
      startDate: nowISO,
      endDate: markAsUsed ? v.finishDate : null,
      qty: (ii === nItems - 1) ? Math.round((qty - unitEach * (nItems - 1)) * 100) / 100 : unitEach,
      variantId: variantId,
      brand: v.brand
    });
  }

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  toast('已' + (markAsUsed ? '开封并标记用完' : '开封') + ' ' + escapeHtml(v.brand) + '，库存-' + qty);
}

// ========== 模型③ 即时消耗型：纯打卡扣减 ==========
// 语义铁律（第 8 轮统一）：
//   ① 点一次「消耗一份」= 只扣 1 个库存，绝不整批清零；
//   ② 每一次打卡 = 一条**独立记录**（绝不 rec.qty += 合并成滚动批次），
//      这样历史台账才能回答「什么时候消耗了多少」；
//   ③ 批量扣减必须走独立入口 batchPunchInstant（用户自己输入数量），
//      任何默认路径都不许一次扣光整批；
//   ④ 扣到 0 才自动折叠进「已用完」。
function punchInstant(itemId, variantId, delta, silent) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function (x) { return x.id === variantId; });
  if (!v) return;
  // 【铁律①】未显式传 delta 时，永远只扣 1；即使传了也强制夹到 [1, stock]
  var d = (delta === undefined || delta === null || delta === '') ? 1 : parseFloat(delta);
  if (!(d > 0)) d = 1;
  d = Math.floor(d);                 // 件数是整数，杜绝 0.5 之类误传
  if (!(d > 0)) d = 1;
  var stock = parseFloat(v.stock) || 0;
  if (stock <= 0) { toast('已经用完了'); return; }
  var take = Math.min(d, stock);
  var u = v.packUnit || mainPackUnit(item) || '份';

  v.stock = Math.round((stock - take) * 100) / 100;
  if (!item.usageRecords) item.usageRecords = [];
  var nowISO = new Date().toISOString();
  // 【铁律②】每次打卡独立落一条记录（qty = 本次扣减量），不再合并成滚动批次。
  //   保留 `instant:true` 便于统计口径区分；`note` 记录是否批量操作。
  item.usageRecords.push({
    startDate: nowISO, endDate: nowISO, qty: take,
    variantId: variantId, brand: v.brand, instant: true,
    batch: take > 1 ? true : undefined
  });
  // 扣到 0 才算真正用完 → 折叠
  if (v.stock <= 0) {
    v.usedUp = true;
    v.finishDate = nowISO;
    syncItemFromVariants(item);
    saveDB();
    // silent（列表小卡片快捷消耗）：原地刷新列表，不弹详情
    if (silent) { renderZone(); if (document.getElementById('home-content')) renderHome(); }
    else openCardDetail(currentZoneId, itemId);
    toast('已用完（今年累计 ' + trimNum(instantUsedQty(item, variantId)) + u + '）');
    return;
  }
  syncItemFromVariants(item);
  saveDB();
  if (silent) { renderZone(); if (document.getElementById('home-content')) renderHome(); }
  else openCardDetail(currentZoneId, itemId);
  toast('✨ 消耗 -' + trimNum(take) + u + '，剩 ' + trimNum(v.stock) + u);
}

// 【批量消耗入口】用户自己输入数量 —— 唯一允许一次扣多份的路径。
// 绝不默认清零整批：输入框默认值恒为 1，超过库存时按库存封顶并明确提示。
function batchPunchInstant(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function (x) { return x.id === variantId; });
  if (!v) { v = item.variants.find(function (x) { return (parseFloat(x.stock) || 0) > 0; }); }
  if (!v) { toast('没有可消耗的品牌'); return; }
  // 【第 20 轮】有规格明细的即时型：批量也必须按规格扣，绝不直接扣 v.stock（容量口径）
  if (variantSpecsOf(v).length) { closeModal(); openPunchSpecPick(itemId, v.id); return; }
  var u = instantCountUnit(item);   // 计数单位（片/包），绝不取 g/ml
  var stock = parseFloat(v.stock) || 0;
  if (stock <= 0) { toast('已经用完了'); return; }
  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">✨ 批量消耗</div>';
  html += '<div style="text-align:center;margin-bottom:14px">';
  html += '<div style="font-size:16px;font-weight:700">' + escapeHtml(item.name) + '</div>';
  html += '<div style="font-size:13px;color:var(--accent)">' + escapeHtml(v.brand || '') + '</div>';
  html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:4px">当前剩余 ' + trimNum(stock) + u + '</div>';
  html += '</div>';
  if (item.variants && item.variants.length > 1) {
    html += '<div class="form-group"><label class="form-label">扣减品牌</label><select class="form-select" id="bp-variant">';
    item.variants.forEach(function (x) {
      html += '<option value="' + x.id + '"' + (x.id === v.id ? ' selected' : '') + '>' + escapeHtml(x.brand || '') + '（剩 ' + trimNum(parseFloat(x.stock) || 0) + u + '）</option>';
    });
    html += '</select></div>';
  }
  html += '<div class="form-group"><label class="form-label">本次消耗数量（' + u + '）</label>';
  html += '<input type="number" class="form-input" id="bp-qty" min="1" step="1" value="1" max="' + stock + '" style="font-size:22px;text-align:center;font-weight:700"></div>';
  html += '<div style="font-size:12px;color:var(--text-tertiary);margin-bottom:12px">⚠️ 只能扣除 1 ~ ' + trimNum(stock) + u + '；系统不会自动清空整批，请输入你想扣的实际数量。</div>';
  html += '<button class="btn btn-primary btn-full" onclick="confirmBatchPunch(\'' + item.id + '\')">确认消耗</button>';
  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">取消</button>';
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}
function confirmBatchPunch(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var selEl = document.getElementById('bp-variant');
  var variantId = selEl ? selEl.value : '';
  var v = item.variants.find(function (x) { return x.id === variantId; });
  if (!v) { v = item.variants.find(function (x) { return (parseFloat(x.stock) || 0) > 0; }); }
  if (!v) { toast('没有可消耗的品牌'); return; }
  var qEl = document.getElementById('bp-qty');
  var q = parseFloat(qEl ? qEl.value : 1);
  var u = instantCountUnit(item);   // 【第 20 轮】计数单位（片/包）
  var stock = parseFloat(v.stock) || 0;
  if (!(q > 0)) { toast('请输入大于 0 的数量'); return; }
  q = Math.floor(q);
  if (q < 1) { toast('请输入大于 0 的整数'); return; }
  if (q > stock) { toast('最多只能扣 ' + trimNum(stock) + u + '，已按库存封顶'); q = Math.floor(stock); }
  if (!(q > 0)) { toast('已经用完了'); return; }
  closeModal();
  punchInstant(itemId, v.id, q);
}

// 删除单条即时打卡记录（即时型记录不进 rollbackRecordConsumption，需单独回退库存）
function deleteInstantRecord(itemId, idx) {
  var item = findItemByIdGlobal(itemId);
  if (!item || !item.usageRecords || !item.usageRecords[idx]) { closeModal(); return; }
  var r = item.usageRecords[idx];
  if (!r.instant) { closeModal(); return; }
  var v = (item.variants || []).find(function (x) { return x.id === r.variantId; });
  if (v) {
    revertInstantRecord(item, v, r); // 【第 13 轮】规格级打卡精确退回该规格
  }
  item.usageRecords.splice(idx, 1);
  syncItemFromVariants(item);
  saveDB();
  closeModal();
  refreshItemViews(item);
  toast('🗑️ 已删除该次打卡并退回库存');
}
// 品牌条目内联删除即时消耗记录（第 11 轮）：确认后回退库存
function deleteInstantRecordConfirm(itemId, idx) {
  var item = findItemByIdGlobal(itemId);
  if (!item || !item.usageRecords || !item.usageRecords[idx]) return;
  var r = item.usageRecords[idx];
  if (!r.instant) return;
  var v = (item.variants || []).find(function (x) { return x.id === r.variantId; });
  var u = (v && v.packUnit) || mainPackUnit(item) || '份';
  if (!window.confirm('删除这条消耗记录？\n' + (v ? (v.brand || '') + ' · ' : '') + '-' + trimNum(r.qty) + u + (r.startDate ? ' · ' + formatDate(r.startDate) : '') + '\n删除后会把 ' + trimNum(r.qty) + u + ' 退回该品牌库存。')) return;
  deleteInstantRecord(itemId, idx);
}

// 某变体本年的即时消耗量（按记录年份汇总）
function instantUsedQty(item, variantId, year) {
  var y = year || new Date().getFullYear();
  return (item.usageRecords || [])
    .filter(function (r) {
      if (!r.instant) return false;
      if (variantId && r.variantId !== variantId) return false;
      var d = new Date(r.endDate || r.startDate);
      return d.getFullYear() === y;
    })
    .reduce(function (s, r) { return s + (parseFloat(r.qty) || 0); }, 0);
}
// 【第 13 轮】撤销/删除即时打卡时的库存回退：规格级打卡精确退回该规格，普通打卡退回变体
function revertInstantRecord(item, v, rec) {
  var back = parseFloat(rec && rec.qty) || 0;
  if (!(back > 0)) return;
  var s = null;
  if (rec.specId || rec.specName) {
    s = (v.specs || []).find(function (x) {
      if (!x) return false;
      if (rec.specId && x.id) return String(x.id) === String(rec.specId);
      return String(x.name || '') === String(rec.specName || '');
    });
  }
  if (s) {
    if (isContentUnitText(s.unit)) s.openPacks = Math.max(0, Math.round((specOpenPacks(s) - back) * 100) / 100);
    else s.usedQty = Math.max(0, Math.round((specUsedQty(s) - back) * 100) / 100);
    v.stock = variantSpecContent(v);
  } else {
    v.stock = Math.round(((parseFloat(v.stock) || 0) + back) * 100) / 100;
  }
  if (v.stock > 0 && v.usedUp) { v.usedUp = false; v.finishDate = null; }
}

// 模型③撤销：回退**最近一条**打卡记录（整条撤销，退回其全部 qty）
// 与「一次只扣 1」对称：单次打卡撤销 1，批量打卡撤销那一批（用户可再逐条删）
function unpunchInstant(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function (x) { return x.id === variantId; });
  if (!v) return;
  if (!item.usageRecords) { toast('没有可撤销的打卡'); return; }
  var rec = null;
  for (var i = item.usageRecords.length - 1; i >= 0; i--) {
    var r = item.usageRecords[i];
    if (r.variantId === variantId && r.instant && (parseFloat(r.qty) || 0) > 0) { rec = r; break; }
  }
  if (!rec) { toast('没有可撤销的打卡'); return; }
  var u = v.packUnit || mainPackUnit(item) || '份';
  var back = parseFloat(rec.qty) || 0;
  item.usageRecords.splice(item.usageRecords.indexOf(rec), 1);
  revertInstantRecord(item, v, rec);
  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('↩️ 已撤销最近一次打卡 ' + trimNum(back) + u + '，剩 ' + trimNum(v.stock) + u);
}

// 即时消耗型：点「消耗一份」时作用在哪个品牌上
// 规则：优先还有库存的品牌；多个都有 → 取第一个（用户可在卡片里切换品牌后单独点）
// 【第 10 轮 · 修 Bug】即时型「点消耗」必须让用户明确选了哪个品牌。
// 【第 13 轮 · 级联选择】多品牌时第一步选品牌；品牌下还有规格明细（如「修护型面膜」下的
// 「胶原蛋白面膜 / 玻尿酸面膜」）时，第二步**必须**继续选具体规格，绝不能跳过、
// 也绝不能默认消耗第一个规格 —— 选中具体规格后才扣那 1 份库存。
function punchInstantPick(itemId) {
  var item = getItem(currentZoneId, itemId) || findItemByIdGlobal(itemId);
  if (!item) return;
  if (!item.variants || !item.variants.length) { toast('这个物品还没有品牌变体'); return; }
  var u = mainPackUnit(item) || '份';
  var avail = item.variants.filter(function (v) { return !v.usedUp && (parseFloat(v.stock) || 0) > 0; });
  if (!avail.length) { toast('所有品牌都用完了，先补货吧'); return; }
  // 只有一个可消耗品牌、且该品牌没有规格明细 → 无需任何选择，直接扣 1（保持快捷）
  if (avail.length === 1 && !variantSpecsOf(avail[0]).length) { punchInstant(item.id, avail[0].id, 1, true); return; }

  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">✨ 消耗一份 · 第 1 步</div>';
  html += '<div style="text-align:center;margin-bottom:14px">';
  html += '<div style="font-size:16px;font-weight:700">' + escapeHtml(item.name) + '</div>';
  html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px">这次消耗的是哪个品牌？</div>';
  html += '</div>';
  avail.forEach(function (v) {
    // 【第 20 轮】即时型剩余一律按计数单位（片/包）：有明细 = Σ specRemainPieces；绝不显示 v.stock（容量口径）或 g/ml
    var hasSpI20 = variantSpecsOf(v).length > 0;
    var su = hasSpI20 ? '' : instantCountUnit(item);
    var st = hasSpI20 ? 0 : (parseFloat(v.stock) || 0);
    if (hasSpI20) {
      st = 0;
      variantSpecsOf(v).forEach(function (s20) { st += specRemainPieces(v, s20); });
      su = instantCountUnit(item);
    }
    var hasSp = hasSpI20;
    html += '<button class="btn btn-outline btn-full" style="margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;text-align:left"'
      + ' onclick="closeModal();openPunchSpecPick(\'' + item.id + '\',\'' + v.id + '\')">'
      + '<span style="font-size:15px;font-weight:600;color:var(--text-primary)">'
      + escapeHtml(v.brand || '未命名') + (v.noRestock ? ' <span style="font-size:11px;color:var(--text-tertiary)">· 不再买</span>' : '')
      + (hasSp ? ' <span style="font-size:11px;color:var(--accent)">· 选规格 ›</span>' : '')
      + '</span>'
      + '<span style="font-size:13px;color:var(--text-secondary);font-weight:500">剩 ' + trimNum(st) + su + '</span>'
      + '</button>';
  });
  html += '<div style="font-size:11px;color:var(--text-tertiary);text-align:center;margin-top:4px">品牌下有具体规格时会继续让你选规格；要一次扣多份请进详情页用「🪄 批量」</div>';
  html += '<button class="btn btn-ghost btn-full" style="margin-top:10px" onclick="closeModal()">取消</button>';
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

// 【第 13 轮】级联第二步：选择该品牌下的具体规格（绝不默认第一个）
function openPunchSpecPick(itemId, variantId) {
  var item = getItem(currentZoneId, itemId) || findItemByIdGlobal(itemId);
  if (!item) return;
  var v = (item.variants || []).find(function (x) { return x.id === variantId; });
  if (!v) return;
  var u = v.packUnit || mainPackUnit(item) || '份';
  var ss = variantSpecsOf(v);
  if (!ss.length) {
    // 该品牌没有规格明细 → 直接扣 1（维持原「多品牌选品牌」的快捷路径）
    punchInstant(item.id, v.id, 1, true);
    return;
  }
  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">✨ 消耗一份 · 第 2 步</div>';
  html += '<div style="text-align:center;margin-bottom:14px">';
  html += '<div style="font-size:16px;font-weight:700">' + escapeHtml(v.brand || item.name) + '</div>';
  html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px">具体是哪个规格？点哪个就扣哪个的库存</div>';
  html += '</div>';
  ss.forEach(function (s) {
    var si = (v.specs || []).indexOf(s); // 原始下标（punchInstantSpec 按 v.specs 解析）
    var nmL = s.name || ('规格' + (si + 1));
    var uL = s.unit || u;
    var uCountL20 = isContentUnitText(uL) ? '包' : uL;   // 【第 20 轮】g/ml 类 → 按「包」
    var leftQ = specRemainPieces(v, s);
    var dis = leftQ <= 0;
    html += '<button class="btn btn-outline btn-full"' + (dis ? ' disabled style="opacity:.45;margin-bottom:9px"' : ' style="margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;text-align:left"')
      + (dis ? '' : ' onclick="closeModal();punchInstantSpec(\'' + item.id + '\',\'' + v.id + '\',' + si + ')"') + '>'
      + '<span style="font-size:15px;font-weight:600;color:var(--text-primary)">' + escapeHtml(nmL) + '</span>'
      + '<span style="font-size:13px;color:' + (dis ? 'var(--text-tertiary)' : 'var(--text-secondary)') + ';font-weight:500">' + (dis ? '已用完' : ('剩 ' + trimNum(leftQ) + uCountL20)) + '</span>'
      + '</button>';
  });
  html += '<button class="btn btn-ghost btn-full" style="margin-top:6px" onclick="closeModal();punchInstantPick(\'' + item.id + '\')">← 重选品牌</button>';
  html += '<button class="btn btn-ghost btn-full" style="margin-top:6px" onclick="closeModal()">取消</button>';
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

// 【第 13 轮】规格级消耗执行：选中具体规格后才扣对应的 1 份库存
//   片/粒类：spec.usedQty += 1（1 份 = 1 片）；含量单位：spec.openPacks += 1（1 份 = 1 包）
//   每次打卡独立落一条记录（带 specId/specName），撤销/删除时精确回退到该规格
function punchInstantSpec(itemId, variantId, specIdx, silent) {
  var item = getItem(currentZoneId, itemId) || findItemByIdGlobal(itemId);
  if (!item) return;
  var v = (item.variants || []).find(function (x) { return x.id === variantId; });
  if (!v) return;
  var ss = v.specs || [];
  var s = ss[specIdx];
  if (!s) { punchInstant(itemId, variantId, 1, silent); return; }
  var isContent = isContentUnitText(s.unit);
  var leftQ = specRemainPieces(v, s);
  var u = s.unit || v.packUnit || mainPackUnit(item) || '份';
  if (leftQ <= 0) { toast('「' + (s.name || '该规格') + '」已经用完了，换个规格或先补货'); return; }
  var nowISO = new Date().toISOString();
  if (isContent) {
    s.openPacks = Math.round((specOpenPacks(s) + 1) * 100) / 100;
  } else {
    s.usedQty = Math.round((specUsedQty(s) + 1) * 100) / 100;
  }
  v.stock = variantSpecContent(v); // 变体库存 = Σ 各规格剩余（含 usedQty 扣减）
  if (v.stock <= 0) { v.usedUp = true; v.finishDate = nowISO; }
  if (!item.usageRecords) item.usageRecords = [];
  item.usageRecords.push({
    startDate: nowISO, endDate: nowISO, qty: 1,
    variantId: variantId, brand: v.brand, instant: true,
    specId: s.id || '', specName: s.name || ''
  });
  syncItemFromVariants(item);
  saveDB();
  refreshItemViews(item);
  var uShow = isContent ? '包' : u;   // 【第 20 轮】toast 用计数单位：g/ml 类显示「包」，绝不显示重量
  toast('✨ ' + (s.name ? '「' + s.name + '」' : '') + '消耗 -1' + uShow + '，该规格剩 ' + trimNum(specRemainPieces(v, s)) + uShow);
}

// 直接标记某个变体用完（用于多变体的"用完了"按钮，食品类直接完成）
// 【并行收尾】recIdx 指定结束哪一条开封记录；缺省只结束**最早一条**未结束记录，
// 绝不一次性结束该品牌下其它并行记录（如 2 瓶同时开着，用完 1 瓶只收尾 1 条）。
function finishVariant(itemId, variantId, recIdx) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(vv) { return vv.id === variantId; });
  if (!v) return;

  // 统一找「要收尾的那一条」：指定下标优先，否则取最早一条未结束记录
  var recF = null;
  var recs = item.usageRecords || [];
  if (recIdx !== undefined && recIdx !== null && recs[recIdx] && !recs[recIdx].endDate && !recs[recIdx].instant && recs[recIdx].type !== 'surplus') {
    recF = recs[recIdx];
  } else {
    for (var pi = 0; pi < recs.length; pi++) {
      var rr = recs[pi];
      if (rr && rr.variantId === variantId && !rr.endDate && !rr.instant && rr.type !== 'surplus') { recF = rr; break; }
    }
  }
  var nowF = new Date().toISOString();
  // 0 天防御：同日开、同日用完 → 结束日期退到次日，避免 0 天记录污染速率
  if (recF) {
    if (recF.startDate && new Date(recF.startDate).toDateString() === new Date().toDateString()) {
      recF.endDate = new Date(new Date(recF.startDate).getTime() + 86400000).toISOString();
    } else {
      recF.endDate = nowF;
    }
  }

  // 多规格：开封那一刻已按「规格」扣过库存，
  // 这里的「用完了」= 手头开的**这一包**用完 → 只结束这条记录，其余并行记录照常进行
  if (variantSpecsOf(v).length) {
    var usedC = (recF && recF.contentUsed > 0) ? recF.contentUsed : 0;
    var nmF = recF ? String(recF.specName || '') : '';
    reconcileItemState(item);
    var stillAct = variantActiveOpenRecs(item, v).length;
    var remainC = variantSpecContent(v), remainP = variantSpecPieces(v), spU = variantSpecUnit(v);
    if (remainC <= 0 && remainP <= 0) {
      var alreadyDone = v.usedUp && v.finishDate;
      v.usedUp = true;
      if (!alreadyDone) v.finishDate = v.finishDate || nowF;
    }
    syncItemFromVariants(item);
    saveDB();
    openCardDetail(currentZoneId, itemId);
    if (v.usedUp && remainC <= 0) {
      toast('已用完' + (usedC > 0 ? '（≈' + trimNum(usedC) + spU + '）' : ''));
    } else {
      toast((nmF ? '「' + nmF + '」这包' : '本包') + '已记用完' + (usedC > 0 ? '（≈' + trimNum(usedC) + spU + '）' : '')
        + (stillAct > 0 ? ' · 还有 ' + stillAct + ' 包在使用中' : '')
        + '，剩 ' + trimNum(remainP) + ' 包未开待开封');
    }
    return;
  }

  // 普通变体：还有剩余库存 → 「用完了」只结束当前开封的这一件，剩余的继续待开封
  // （如 10支装用了7支还剩3支：结束使用记录，但不能把整个品牌折叠进「已用完」）
  if ((v.stock || 0) > 0) {
    reconcileItemState(item);
    var stillActN = variantActiveOpenRecs(item, v).length;
    var uN = v.packUnit || mainPackUnit(item);
    syncItemFromVariants(item);
    saveDB();
    openCardDetail(currentZoneId, itemId);
    toast('本件已记用完' + (stillActN > 0 ? ' · 还有 ' + stillActN + ' 件在使用中' : '') + '，剩 ' + trimNum(v.stock) + uN + ' 待开封');
    return;
  }

  // 库存已为 0 → 真正用完，折叠进「已用完」区
  // 收尾该品牌全部未结束记录（此刻确实没有剩余了，不存在并行歧义）
  recs.forEach(function (r) {
    if (r && r.variantId === variantId && !r.endDate && !r.instant && r.type !== 'surplus') r.endDate = nowF;
  });
  v.usedUp = true;
  v.finishDate = v.finishDate || nowF;

  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已记录用完');
}

// 单品牌物品：标记当前使用中的变体为用完// 品牌级「不再买」：该品牌不再计入补货提醒，卡片和历史数据都保留
function toggleVariantNoRestock(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = (item.variants || []).find(function(x) { return x.id === variantId; });
  if (!v) return;
  if (!v.noRestock) {
    v.noRestock = true;
    saveDB();
    openCardDetail(currentZoneId, itemId);
    toast('🚫 「' + (v.brand || '未命名') + '」不再买 · 不再计入补货提醒');
  } else {
    delete v.noRestock;
    saveDB();
    openCardDetail(currentZoneId, itemId);
    toast('↩️ 「' + (v.brand || '未命名') + '」已恢复回购');
  }
}

// 多规格品牌的补货明细：按规格录份数；也支持直接按含量补
function renderRestockSpecs(item) {
  var box = document.getElementById('restock-spec-block');
  if (!box) return;
  var sel = document.getElementById('restock-brand');
  var vid = sel ? sel.value : '';
  var v = null;
  item.variants.forEach(function(x) { if (x.id === vid) v = x; });
  var sp = (v && v.specs) ? v.specs : [];
  var qtyRow = document.getElementById('restock-qty-row');
  if (!sp.length || !v) {
    box.style.display = 'none'; box.innerHTML = '';
    if (qtyRow) qtyRow.style.display = 'flex';
    return;
  }
  box.style.display = 'block';
  var h = '<div style="font-size:13px;font-weight:700;margin:4px 0 6px">🧩 补货（按「套」补）</div>';
  h += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">单套构成：' + escapeHtml(variantSpecText(v)) + '<br>当前 套餐数 ' + trimNum(variantPacksBought(v)) + ' 套 · 剩 ' + trimNum(variantPacksLeftCalc(v)) + ' 套</div>';
  h += '<div class="form-row" style="align-items:center;margin-bottom:6px">';
  h += '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">这次补几套？</div>';
  h += '<div style="font-size:11px;color:var(--text-secondary)">补 N 套 = 每种子规格各多 N × 单套包数</div></div>';
  h += '<input type="number" class="form-input" style="width:92px;flex:none" id="restock-spec-sets" value="0" min="0" step="1" oninput="syncRestockSpecQty()">';
  h += '</div>';
  sp.forEach(function (s, k) {
    h += '<div class="form-row" style="align-items:center;margin-bottom:4px">';
    h += '<div style="flex:1;min-width:0;font-size:12px;color:var(--text-secondary)">' + escapeHtml(s.name || ('规格' + (k + 1))) + '（单套 ' + trimNum(specPackCount(s)) + ' 包 × ' + trimNum(specPackQty(s)) + (s.unit || '') + '）</div>';
    h += '</div>';
  });
  h += '<div class="form-row">';
  h += '<div class="form-group" style="flex:1"><label class="form-label">或按含量补（选填）</label><input type="number" class="form-input" id="restock-spec-content" value="" placeholder="如 100" oninput="syncRestockSpecQty()"></div>';
  h += '<div class="form-group" style="width:96px;flex:none"><label class="form-label">单位</label><input type="text" class="form-input" id="restock-spec-unit" value="' + escapeHtml(sp[0].unit || '') + '"></div>';
  h += '</div>';
  box.innerHTML = h;
  window._restockSpecs = sp;
  if (qtyRow) qtyRow.style.display = 'flex'; // 数量行保留（用于算单价），由规格自动回填
}
// 补套数 → 自动回填「补货数量」（含量口径），省得再手算
function syncRestockSpecQty() {
  var sp = window._restockSpecs || [];
  var total = 0, unit = '';
  var setsEl = document.getElementById('restock-spec-sets');
  var sets = setsEl ? (parseFloat(setsEl.value) || 0) : 0;
  if (sets > 0 && sp.length) {
    // 每套含量 = Σ 单套内包数 × 每包含量 × 每份规格
    var perSet = 0;
    sp.forEach(function (s) { perSet += specPackCount(s) * specPackQty(s) * specContentOf(s); });
    total += sets * perSet;
  }
  if (sp.length) unit = sp[0].unit || '';
  var cEl = document.getElementById('restock-spec-content');
  if (cEl) {
    total += (parseFloat(cEl.value) || 0);
    var uEl = document.getElementById('restock-spec-unit');
    if (uEl && uEl.value) unit = uEl.value;
  }
  var qEl = document.getElementById('restock-qty');
  if (qEl && total > 0) qEl.value = Math.round(total * 100) / 100;
  var unEl = document.getElementById('restock-unit');
  if (unEl && unit) unEl.value = unit;
  if (window._restockItemId) {
    var it = getItem(currentZoneId, window._restockItemId);
    if (it) updateRestockCompare(it);
  }
}

function updateRestockCompare(item) {
  var qty = parseFloat(document.getElementById('restock-qty').value) || 0;
  var total = parseFloat(document.getElementById('restock-total').value) || 0;
  var unitPrice = qty > 0 ? total / qty : 0;
  document.getElementById('restock-unit-price').value = unitPrice.toFixed(2);

  var compareDiv = document.getElementById('restock-compare');
  if (unitPrice > 0 && item.priceHistory && item.priceHistory.length > 0) {
    var prices = item.priceHistory.map(function(p) { return p.unitPrice || 0; });
    var minPrice = Math.min.apply(null, prices);
    var lastPrice = prices[prices.length - 1];

    if (unitPrice < minPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-cheaper">🎉 新低！比历史最低 ¥' + minPrice.toFixed(2) + ' 便宜 ¥' + (minPrice - unitPrice).toFixed(2) + '</div>';
    } else if (unitPrice < lastPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-cheaper">✓ 比上次 ¥' + lastPrice.toFixed(2) + ' 便宜</div>';
    } else if (unitPrice > lastPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-expensive">⚠ 比上次 ¥' + lastPrice.toFixed(2) + ' 贵 ¥' + (unitPrice - lastPrice).toFixed(2) + '</div>';
    } else {
      compareDiv.innerHTML = '<div class="price-compare price-same">和上次价格相同</div>';
    }
  }
}

var restockPhotos = [];
function uploadRestockPhoto() {
  var input = document.getElementById('photo-input');
  input.onchange = function(e) {
    var files = e.target.files;
    for (var i = 0; i < files.length && restockPhotos.length < 3; i++) {
      compressImage(files[i], function(dataUrl) {
        restockPhotos.push(dataUrl);
        renderRestockPhotos();
      });
    }
    input.value = '';
  };
  input.click();
}

function renderRestockPhotos() {
  var container = document.getElementById('restock-photos');
  var html = '';
  restockPhotos.forEach(function(p, i) {
    html += '<div class="photo-slot has-photo"><img src="' + p + '"><button class="remove-photo" onclick="removeRestockPhoto(' + i + ')">✕</button></div>';
  });
  if (restockPhotos.length < 3) {
    html += '<div class="photo-slot" onclick="uploadRestockPhoto()">📷</div>';
  }
  container.innerHTML = html;
}

function removeRestockPhoto(idx) {
  restockPhotos.splice(idx, 1);
  renderRestockPhotos();
}

function confirmRestock(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  ensureVariants(item);
  var qty = parseFloat(document.getElementById('restock-qty').value) || 0;
  var total = parseFloat(document.getElementById('restock-total').value) || 0;
  var unitPrice = qty > 0 ? total / qty : 0;
  var channel = document.getElementById('restock-channel').value;
  var date = document.getElementById('restock-date').value;
  var notes = document.getElementById('restock-notes').value;
  var unit = document.getElementById('restock-unit').value;

  if (qty <= 0) { toast('请输入数量'); return; }

  item.unit = unit;
  item.channel = channel;

  // 更新或新增variant
  var brandSelect = document.getElementById('restock-brand').value;
  var variant;
  if (brandSelect === '__new__') {
    var newBrand = document.getElementById('restock-new-brand').value.trim() || ('品牌' + (item.variants.length + 1));
    variant = { id: genId(), brand: newBrand, stock: qty, price: parseFloat(unitPrice.toFixed(2)), totalPrice: parseFloat(total.toFixed(2)), channel: channel, photos: [], opened: false, openDate: null, finishDate: null, usedUp: false, openQty: 0, feeling: null, shelfLife: item.shelfLife, productionDate: null };
    item.variants.push(variant);
  } else {
    variant = item.variants.find(function(v) { return v.id === brandSelect; });
    if (variant) {
      // 多规格品牌：补货 = 又买了 N 套 → 套餐数 +N（构成不变，剩余量随之增加）
      var spR = (variant.specs && variant.specs.length) ? variant.specs : null;
      var addedPieces = 0;
      if (spR) {
        var setsEl = document.getElementById('restock-spec-sets');
        var setsAdd = setsEl ? (parseFloat(setsEl.value) || 0) : 0;
        if (setsAdd > 0) {
          variant.packCount = Math.round((variantPacksBought(variant) + setsAdd) * 100) / 100;
          addedPieces = setsAdd;
        } else {
          // 没填套数 → 按含量补：把含量折算成「套数」加上去（不足一套按一套）
          var cEl0 = document.getElementById('restock-spec-content');
          var c0 = cEl0 ? (parseFloat(cEl0.value) || 0) : 0;
          if (c0 <= 0) c0 = qty;
          var perSet0 = variantSpecPerSet(variant);
          if (perSet0 > 0 && c0 > 0) {
            var setsFromContent = Math.ceil(c0 / perSet0 - 1e-9);
            variant.packCount = Math.round((variantPacksBought(variant) + setsFromContent) * 100) / 100;
            addedPieces = setsFromContent;
          }
        }
        variant.stock = variantSpecContent(variant);
        // 套餐数是「购买记录」，补货累加到套餐数上；构成（specs）不动
        if (!variant.specsFolded) variant.specsFolded = true;
        variant.packUnit = (spR[0].unit || variant.packUnit);
        variant.usedUp = false;   // 又补上了 → 不再是「用完」状态
        variant.finishDate = null;
      } else {
        variant.stock = (variant.stock || 0) + qty;
      }
      variant.price = parseFloat(unitPrice.toFixed(2));
      variant.totalPrice = parseFloat((variant.price * (variant.stock || 0)).toFixed(2));
      variant.channel = channel;
    }
  }

  // 价格历史
  if (!item.priceHistory) item.priceHistory = [];
  item.priceHistory.push({
    date: new Date(date).toISOString(),
    channel: channel,
    quantity: qty,
    totalPrice: total,
    unitPrice: parseFloat(unitPrice.toFixed(1)),
    notes: notes,
    brand: variant ? variant.brand : '',
    attachments: restockPhotos.slice()
  });

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  restockPhotos = [];
  toast('补货成功 +' + qty + ' (' + (variant ? variant.brand : '') + ')');
  renderZone();
}

// ========== 物品表单 ==========

      html += '<option value="' + k + '"' + (cmNow === k ? ' selected' : '') + '>' + m.icon + ' ' + m.name + '</option>';

    html += '</select></div>';
    html += '<div class="form-group" style="flex:1;min-width:0;margin-bottom:0">';
    html += '<label class="form-label">名称</label>';
    html += '<input type="text" class="form-input" id="item-name" value="' + (item?escapeHtml(item.name):'') + '" placeholder="如：洗发水">';

    html += '<div id="cm-hint" style="font-size:12px;color:var(--text-secondary);margin:-2px 0 14px;line-height:1.5">' + CONSUME_MODELS[cmNow].desc + '</div>';
  } else {
    html += '<div class="form-group"><label class="form-label">名称</label>';
    html += '<input type="text" class="form-input" id="item-name" value="' + (item?escapeHtml(item.name):'') + '" placeholder="如：洗发水"></div>';
  }

  // 两级分类：大类必选，子分类选填
  var mainCats = zone.categories.filter(function(c) { return !c.parentId; });
  var selMainId = mainCats.length > 0 ? mainCats[0].id : '';
  var selSubId = '';
  if (item && item.categoryId) {
    var itemCat = getCategory(zone.id, item.categoryId);
    if (itemCat) {
      if (itemCat.parentId) { selMainId = itemCat.parentId; selSubId = itemCat.id; }

  html += '<div class="form-group"><label class="form-label">大类</label>';
  html += '<select class="form-select" id="item-category" onchange="updateItemSubcategoryOptions(\'' + zone.id + '\', this.value)">';
  mainCats.forEach(function(c) {
    html += '<option value="' + c.id + '"' + (selMainId===c.id?' selected':'') + '>' + escapeHtml(c.name) + '</option>';
  });
  html += '</select></div>';
  html += '<div class="form-group"><label class="form-label">子分类（选填）</label>';
  html += '<select class="form-select" id="item-subcategory"></select></div>';
  html += '</div>';

  // 耐用品：件数编辑器（每件=描述+照片+可选价格+备注）
  if (zone.type !== 'consumable') {
    html += '<div class="form-group"><label class="form-label">件数清单</label>';

      dVariants = item.variants.map(function(v) {
        return { id: v.id, brand: v.brand||'', photos: (v.photos||[]).slice(), price: v.price||0, notes: v.notes||'', stock: v.stock||1, totalPrice: v.totalPrice||0 };
      });
    } else {
      dVariants = [{ id: genId(), brand: '', photos: [], price: 0, notes: '', stock: 1, totalPrice: 0 }];
    }
    window._editVariants = dVariants;
    window._editVariantPhotos = dVariants.map(function(v) { return v.photos.slice(); });
    html += renderDurableVariantRows();
    html += '</div>';
    html += '<button class="btn btn-outline btn-sm" style="margin-top:6px;width:100%" onclick="addDurableVariantRow()">＋ 添加一件</button>';
    html += '</div>';
  }

  // 存放位置不再单独设字段：写在备注里即可（placeholder 有提示）

  if (zone.type === 'consumable') {

    html += '<div class="form-group"><label class="form-label">品牌变体</label>';

    window._editVariants = variants.map(function(v) {
      return {
        id: v.id, brand: v.brand||'', stock: v.stock||0, price: v.price||0, totalPrice: v.totalPrice||0,
        packCount: (typeof v.packCount!=='undefined'?v.packCount:(v.stock||0)),
        packPrice: (typeof v.packPrice!=='undefined'?v.packPrice:(v.totalPrice||0)),
        packQty: (typeof v.packQty!=='undefined'?v.packQty:''),
        packQtyUnit: (typeof v.packQtyUnit!=='undefined'?(v.packQtyUnit||''):''),   // 件数单位（瓶/包/个…）

        packWeight: (typeof v.packWeight!=='undefined'?v.packWeight:''),
        packWeightUnit: v.packWeightUnit || '',
        noRestock: !!v.noRestock,
        specsFolded: !!v.specsFolded,
        specs: (v.specs || []).map(function (s) { return { name: s.name || '', packCount: (s.packCount !== undefined && s.packCount !== null) ? s.packCount : '', packQty: (s.packQty !== undefined && s.packQty !== null && s.packQty !== '') ? s.packQty : '', qty: +s.qty || 0, content: +s.content || 0, unit: s.unit || '', openPacks: specOpenPacks(s), usedQty: specUsedQty(s) }; }),
        photos: (v.photos||[]).slice()

    window._editVariantPhotos = variants.map(function(v) { return (v.photos||[]).slice(); });
    html += renderConsumableVariantRows();
    html += '</div>';
    html += '<button class="btn btn-outline btn-sm" style="margin-top:6px;width:100%" onclick="addConsumableVariantRow()">＋ 添加品牌</button>';
    html += '</div>';

    // 消耗模型已上移到「名称」左侧的下拉框；这里只保留阈值
    html += '<div class="form-group"><label class="form-label">库存告急阈值</label><input type="number" class="form-input" id="item-threshold" value="' + (item?(item.stockThreshold||1):1) + '" step="0.5"></div>';
    html += '</div>';

  if (zone.type === 'consumable') {
    html += '<div class="form-group"><label class="form-label">备注（选填）</label>';
    html += '<textarea class="form-textarea" id="item-notes" placeholder="存放位置（如：冰箱冷藏层）、购买渠道、使用感受…">' + (item?escapeHtml(item.notes||''):'') + '</textarea></div>';
  }

  html += '<button class="btn btn-primary btn-full" onclick="saveItem()">' + (item?'保存修改':'添加') + '</button>';
  if (item) {
    html += '<button class="btn btn-danger btn-full" style="margin-top:8px" onclick="deleteItem(\'' + item.id + '\')">删除</button>';

  document.getElementById('modal-content').innerHTML = html;

  var subs = getSubcategories(zone, mainCatId);

function uploadItemPhoto() {
  var input = document.getElementById('photo-input');
  input.onchange = function(e) {
    var files = e.target.files;

}

}

// ========== 补给品品牌变体编辑器（带照片） ==========

// 🧩 展开/收起规格明细

// 补给品：库存 × 单价 = 总价 三联动
// 简单算式求值：只允许数字与 + - * / ( ) . 空格，如混合套餐 3*77+2*45
function evalSimpleExpr(str) {

}
function onConsumablePriceInput(idx, which, val) {

  if (!row) return;
  var inputs = row.querySelectorAll('input[type=number]');
  // inputs[0]=总套餐数 [1]=套餐单价 [2]=套餐总价 [3]=套餐内包数 [4]=单包规格
  var packEl = inputs[0], priceEl = inputs[1], totalEl = inputs[2], qtyEl = inputs[3], weightEl = inputs[4];
  // 空值语义统一：数量类字段留空 → 记为 ''（按 1 参与计算），显式 0 → 记为 0

  if (which === 'pack') {

    v.packPrice = parseFloat(val) || 0;
  } else if (which === 'total') {

    var evQ = evalSimpleExpr(val);
    v.packQty = (!isNaN(evQ) && evQ >= 0) ? evQ : numOrEmpty(val);
  } else if (which === 'weight') {
    v.packWeight = numOrEmpty(val);
  }
  // 参与计算时：留空 = 1，填 0 = 0
  var pc = (v.packCount === '' || v.packCount == null) ? 1 : (parseFloat(v.packCount) || 0);
  var pq = (v.packQty === '' || v.packQty == null) ? 1 : (parseFloat(v.packQty) || 0);
  var priceV = parseFloat(v.packPrice) || 0;
  var weightV = (v.packWeight === '' || v.packWeight == null) ? 1 : (parseFloat(v.packWeight) || 0);
  // 联动：填一个自动算另一个（保留两位小数）
  // 单价 → 总价 = 单价 × 套餐数；总价 → 单价 = 总价 ÷ 套餐数（用户正在编辑的框不回压）
  if (which !== 'total') v.totalPrice = Math.round(pc * priceV * 100) / 100;
  else { v.packPrice = pc > 0 ? Math.round((v.totalPrice / pc) * 100) / 100 : 0; priceV = v.packPrice; }
  // 库存 = 总套餐数 × 套餐内包数（件数口径）；含量 = 再 × 单包规格（保存时统一以明细/主结构重算）
  var pieces = Math.round(pc * pq * 100) / 100;
  if (!(v.specs && v.specs.length)) v.stock = Math.max(0, pieces);
  var contentStock = Math.round(pieces * weightV * 100) / 100;
  v.price = contentStock > 0 ? Math.round((v.totalPrice / contentStock) * 100) / 100 : priceV;
  // 只回写"非当前正在编辑"的框，避免打断小数点输入
  var curEl = which === 'pack' ? packEl : which === 'packprice' ? priceEl : which === 'total' ? totalEl : which === 'packqty' ? qtyEl : weightEl;
  if (packEl && packEl !== curEl) packEl.value = (v.packCount === 0 ? 0 : (v.packCount || ''));
  if (priceEl && priceEl !== curEl) priceEl.value = priceV ? priceV.toFixed(2) : '';
  if (totalEl && totalEl !== curEl) totalEl.value = v.totalPrice ? v.totalPrice.toFixed(2) : '';
  if (qtyEl && qtyEl !== curEl) qtyEl.value = (v.packQty === 0 ? 0 : (v.packQty || ''));
  if (weightEl && weightEl !== curEl) weightEl.value = (v.packWeight === 0 ? 0 : (v.packWeight || ''));
  var hint = document.getElementById('packstock-' + idx);
  if (hint) hint.innerHTML = packHintOf(v);
}
// 失焦时把当前框格式化为两位小数，并触发一次联动重算
function onConsumablePriceBlur(idx, which, val) {
  var v = window._editVariants && window._editVariants[idx];
  if (!v) return;
  var raw = (val === undefined || val === null) ? '' : String(val).trim();
  var num = raw === '' ? 0 : (parseFloat(raw) || 0);
  // 空值语义：留空记 ''（按 1 计算），显式 0 记 0
  if (which === 'pack') v.packCount = raw === '' ? '' : num;
  else if (which === 'packprice') v.packPrice = num;
  else if (which === 'total') v.totalPrice = num;
  else if (which === 'packqty') {
    var evB = evalSimpleExpr(raw);
    num = (!isNaN(evB) && evB >= 0) ? evB : num;
    v.packQty = raw === '' ? '' : num;
  }
  else if (which === 'weight') v.packWeight = raw === '' ? '' : num;
  var row = document.querySelectorAll('.consumable-variant-row')[idx];
  if (!row) return;
  var inputs = row.querySelectorAll('input[type=number]');
  var el = which === 'pack' ? inputs[0] : which === 'packprice' ? inputs[1] : which === 'total' ? inputs[2] : which === 'packqty' ? inputs[3] : inputs[4];
  if (el) {
    if (raw === '') el.value = '';
    else if (which === 'pack' || which === 'packqty') el.value = String(num);
    else if (which === 'weight') el.value = String(num);   // 容量保持原样（30 就是 30，不强加 .00）
    else el.value = num.toFixed(2);                         // 单价 / 总价：两位小数
  }
  onConsumablePriceInput(idx, which, String(num));
}
// 库存提示：带计算过程（总套餐数 × 套餐内包数 × 单包规格 = 库存）
// 规则：留空的一律按 1 参与计算（也可以填 0）；全部留空则只显示「未填写」
// plain=true 时输出纯文本（卡片背面直接塞进 escapeHtml 上下文，带 HTML 标签会显示成「代码」）
function packHintOf(v, plain, item) {
  var MUL = plain ? ' × ' : ' <span style="color:var(--text-tertiary)">×</span> ';
  var DIM = plain ? function (x) { return x; } : function (x) { return '<i style="color:var(--text-tertiary)">' + x + '</i>'; };
  // 【第 19 轮 · 即时消耗】即时型绝不算/显容量：库存构成只报"还能再用多少次（份/包）"
  // 【第 20 轮】加总用 specRemainPieces、单位用 instantCountUnit（g/ml 类 → 「包」）
  if (item && consumeModelOf(item) === 'instant') {
    var spI = variantSpecsOf(v);
    if (spI.length) {
      var leftI = 0, openedI = 0;
      spI.forEach(function (s) { leftI += specRemainPieces(v, s); openedI += specOpenPacks(s); });
      var uI = instantCountUnit(item);
      var head = '🔢 还能再用 ' + trimNum(leftI) + uI;
      if (openedI > 0) head += '（已开 ' + trimNum(openedI) + ' 包）';
      return head;
    }
    return '🔢 还能再用 ' + trimNum(v.stock || 0) + instantCountUnit(item);
  }
  // 混合规格：明细 = 单套构成。v1.7 双轨制展示：
  //   总量 = 单套总量 × 套餐数（约 N 份，按均值折算）· 未开 = 剩余未开包的容量
  //   「剩 X 套」在混合规格下反直觉（替换装还有 2 包却「剩 0 套」），不再展示。
  var sp = variantSpecsOf(v);
  if (sp.length) {
    var u0 = variantSpecUnit(v);
    var parts = sp.map(function (s) {
      var nm = String(s.name || '').trim();
      var u = s.unit || '';
      return (nm ? nm + ' ' : '') + trimNum(specPackCount(s)) + '包' + MUL + trimNum(specPackQty(s)) + u + '/包';
    });
    var perSet = variantSpecPerSet(v);
    var pcS = variantPacksBought(v);
    var totalBought = Math.round(perSet * pcS * 100) / 100;   // 购入总量（历史入库，绝不冒充当前剩余）
    var avg = variantAvgPiece(v);
    var openedPacks = 0;
    sp.forEach(function (s) { openedPacks += specOpenPacks(s); });
    var line = '单套 = ' + parts.join(' + ') + ' = ' + trimNum(perSet) + u0;
    // 【第 23 轮】这一行只描述「买进来过什么」（累计购入）；当前剩余一律在「当前库存」格展示，
    // 两个口径绝不混在一行（用户反馈：100片入库总量 + 未开15片 挤一行，根本看不出可用库存）。
    var head = '📦 累计购入 = (' + line + ')' + MUL + trimNum(pcS) + '套 = ' + trimNum(totalBought) + u0;
    if (avg > 0) head += '（约 ' + trimNum(round1(totalBought / avg)) + ' 份）';
    if (openedPacks > 0) {
      head += '（已开 ' + trimNum(openedPacks) + ' 包）';
    }
    return head;
  }
  // 主结构：总套餐数 × 套餐内包数 × 单包规格 = 库存
  var pcRaw = (v.packCount === '' || v.packCount === undefined || v.packCount === null) ? '' : String(v.packCount);
  var pqRaw = (v.packQty === '' || v.packQty === undefined || v.packQty === null) ? '' : String(v.packQty);
  var wRaw = (v.packWeight === '' || v.packWeight === undefined || v.packWeight === null) ? '' : String(v.packWeight);
  if (pcRaw === '' && pqRaw === '' && wRaw === '') return '📦 库存：填写总套餐数 / 套餐内包数 / 单包规格后自动计算（留空按 1）';
  var pc = parseFloat(pcRaw) || 0;                 // 空 = 1 → pc 取 1；填 0 就是 0
  if (pcRaw === '') pc = 1;
  var pq = parseFloat(pqRaw); if (!isFinite(pq)) pq = 1;
  var w = wRaw === '' ? 1 : (parseFloat(wRaw) || 0);
  var content = Math.round(pc * pq * w * 100) / 100; // 库存口径（总含量）
  var pieces = Math.round(pc * pq * 100) / 100;      // 件数口径（包数）
  var cu = (v.packWeightUnit || '').trim();          // 规格单位（ml / kg / 片…）
  var pu = packQtyUnitOf(v);                          // 件数单位（包/瓶/支…，绝不取含量单位）
  var seg = [];
  seg.push((pcRaw === '' ? DIM('1') : trimNum(pc)) + '套');
  seg.push((pqRaw === '' ? DIM('1') : trimNum(pq)) + pu + '/套');
  if (cu || wRaw !== '') seg.push((wRaw === '' ? DIM('1') : trimNum(w)) + cu + '/' + pu);
  var txt = seg.join(MUL) + ' = ' + trimNum(content) + cu;
  return '📦 库存 = ' + txt + '（' + trimNum(pieces) + ' ' + pu + '）';
}
// 含量单位：kg / g / ml / L（影响比价口径与库存/明细的单位展示）
function onConsumableWeightUnitInput(idx, val) {

  var row = document.querySelectorAll('.consumable-variant-row')[idx];

}

// ========== 耐用品件数编辑器 ==========
function renderDurableVariantRows() {
  var html = '';
  var variants = window._editVariants || [];
  var photos = window._editVariantPhotos || [];
  variants.forEach(function(v, i) {
    html += '<div class="durable-variant-row" style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px">';
    html += '<div style="display:flex;gap:8px;align-items:flex-start">';
    // 照片上传区
    html += '<div class="durable-photo-slot" onclick="uploadDurableVariantPhoto(' + i + ')" style="width:56px;height:56px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;cursor:pointer;position:relative">';
    if (photos[i] && photos[i].length > 0) {
      html += '<img src="' + photos[i][0] + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px">';
      html += '<div style="position:absolute;bottom:0;right:0;background:rgba(0,0,0,0.6);color:#fff;font-size:10px;padding:1px 4px;border-radius:4px 0 8px 0">' + (photos[i].length > 1 ? '+' + photos[i].length : '') + '</div>';
    } else {
      html += '<span style="font-size:20px;color:var(--text-tertiary)">📷</span>';
    }
    html += '</div>';
    // 描述 + 单价/件数/总价(联动) + 备注
    html += '<div style="flex:1;display:flex;flex-direction:column;gap:4px">';
    html += '<input type="text" class="form-input" style="font-size:14px" placeholder="描述（如：白色圆领 / 女隐形袜·黑色）" value="' + escapeHtml(v.brand) + '" onchange="updateDurableVariantField(' + i + ',\'brand\',this.value)">';
    // 单价 / 件数 / 总价 三联动
    var vUnit = v.price || 0;
    var vQty = v.stock || 1;
    var vTotal = v.totalPrice || (vUnit * vQty);
    html += '<div style="display:flex;gap:6px;align-items:center">';
    html += '<input type="number" class="form-input" style="font-size:13px;flex:1" placeholder="单价" value="' + (vUnit||'') + '" oninput="onDurablePriceInput(' + i + ',\'unit\',this.value)">';
    html += '<span style="font-size:12px;color:var(--text-tertiary)">×</span>';
    html += '<input type="number" class="form-input" style="font-size:13px;width:56px;flex-shrink:0" placeholder="件" min="1" step="1" value="' + vQty + '" oninput="onDurablePriceInput(' + i + ',\'qty\',this.value)">';
    html += '<span style="font-size:12px;color:var(--text-tertiary)">=</span>';
    html += '<input type="number" class="form-input" style="font-size:13px;flex:1" placeholder="总价" value="' + (vTotal||'') + '" oninput="onDurablePriceInput(' + i + ',\'total\',this.value)">';
    html += '</div>';
    html += '<input type="text" class="form-input" style="font-size:13px;color:var(--text-secondary)" placeholder="备注（如：真丝/手洗/25.3购）" value="' + escapeHtml(v.notes||'') + '" onchange="updateDurableVariantField(' + i + ',\'notes\',this.value)">';
    html += '</div>';
    // 删除按钮
    html += '<button class="btn btn-danger btn-sm" style="flex-shrink:0;padding:6px 8px;font-size:12px" onclick="removeDurableVariantRow(' + i + ')">✕</button>';
    html += '</div>';
    // 已有照片缩略图列表
    if (photos[i] && photos[i].length > 0) {
      html += '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">';
      photos[i].forEach(function(p, pi) {
        html += '<div style="position:relative;width:40px;height:40px">';
        html += '<img src="' + p + '" style="width:40px;height:40px;border-radius:6px;object-fit:cover">';
        html += '<button onclick="removeDurableVariantPhoto(' + i + ',' + pi + ')" style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:10px;line-height:16px;cursor:pointer">✕</button>';
        html += '</div>';
      });

  return html;
}
function updateDurableVariantField(idx, field, val) {
  if (window._editVariants && window._editVariants[idx]) {
    window._editVariants[idx][field] = val;
  }
}
// 单价 × 件数 = 总价 三联动（实时计算，不重渲染整个列表避免输入焦点丢失）
function onDurablePriceInput(idx, which, val) {
  var v = window._editVariants && window._editVariants[idx];
  if (!v) return;
  var row = document.querySelectorAll('.durable-variant-row')[idx];
  if (!row) return;
  var inputs = row.querySelectorAll('input[type=number]');
  // inputs[0]=单价 [1]=件数 [2]=总价
  var unitEl = inputs[0], qtyEl = inputs[1], totalEl = inputs[2];
  if (which === 'unit') {
    var u = parseFloat(val) || 0;
    v.price = u;
    var q = v.stock || 1;
    v.totalPrice = +(u * q).toFixed(2);
    if (totalEl) totalEl.value = v.totalPrice || '';
  } else if (which === 'qty') {
    var q2 = Math.max(1, parseInt(val) || 1);
    v.stock = q2;
    var u2 = v.price || 0;
    v.totalPrice = +(u2 * q2).toFixed(2);
    if (totalEl) totalEl.value = v.totalPrice || '';
  } else if (which === 'total') {
    var t = parseFloat(val) || 0;
    v.totalPrice = t;
    var q3 = v.stock || 1;
    v.price = q3 > 0 ? +(t / q3).toFixed(2) : 0;
    if (unitEl) unitEl.value = v.price || '';
  }
}
function addDurableVariantRow() {
  window._editVariants = window._editVariants || [];
  window._editVariantPhotos = window._editVariantPhotos || [];
  window._editVariants.push({ id: genId(), brand: '', photos: [], price: 0, notes: '', stock: 1, totalPrice: 0 });
  window._editVariantPhotos.push([]);
  document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
}
function removeDurableVariantRow(idx) {
  if (window._editVariants.length <= 1) {
    toast('至少保留一件');
    return;
  }
  window._editVariants.splice(idx, 1);
  window._editVariantPhotos.splice(idx, 1);
  document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
}
function uploadDurableVariantPhoto(idx) {
  var input = document.getElementById('photo-input');
  input.onchange = function(e) {
    var files = e.target.files;
    var count = 0;
    var maxPhotos = 5;
    var currentPhotos = window._editVariantPhotos[idx] || [];
    var remaining = maxPhotos - currentPhotos.length;
    var toProcess = Math.min(files.length, remaining);
    
    function processNext(fileIdx) {
      if (fileIdx >= toProcess) {
        input.value = '';
        document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
        if (count === 0) toast('每件最多' + maxPhotos + '张照片');
        return;
      }
      compressImage(files[fileIdx], function(dataUrl) {
        window._editVariantPhotos[idx].push(dataUrl);
        count++;
        processNext(fileIdx + 1);
      });
    }
    processNext(0);
  };
  input.click();
}
function removeDurableVariantPhoto(variantIdx, photoIdx) {
  if (window._editVariantPhotos && window._editVariantPhotos[variantIdx]) {
    window._editVariantPhotos[variantIdx].splice(photoIdx, 1);
    document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
  }
}

// variant使用感受（在卡片背面点"感受"按钮）

function saveVariantFeeling(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);

  var v = item.variants.find(function(v) { return v.id === variantId; });
  if (!v) return;

    rating: window._feelingRating || 0,
    tags: window._feelingTags || [],

  };
