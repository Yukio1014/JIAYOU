// ========== 物品状态判断 ==========
function getItemStatus(item) {
  var status = {
    expired: false, expiring: false,
    lowStock: false, lowStockSoft: false, stockUpAlert: false,
    shelfPercent: 100, daysLeft: null, estDaysLeft: null, monthsLeft: null
  };

  var totalStock = getActiveStock(item);

  // 保质期：取所有variants中最早过期的（不再买的品牌不参与提醒计算）
  var allVariants = (item.variants && item.variants.length > 0) ? item.variants : [item];
  var variants = allVariants.filter(function(v) { return !v.noRestock; });
  if (variants.length === 0) {
    // 全部品牌都标记了「不再买」→ 整个物品不再提醒，只保留保质期信息
    variants = [];
  }
  var earliestDaysLeft = null;
  var earliestShelfPercent = 100;
  variants.forEach(function(v) {
    var sl = v.shelfLife || item.shelfLife;
    var pd = v.productionDate || item.productionDate;
    if (sl && sl > 0 && pd) {
      var prod = new Date(pd);
      var expireDate = new Date(prod);
      expireDate.setMonth(expireDate.getMonth() + sl);
      var daysLeft = daysBetween(new Date(), expireDate);
      var totalDays = sl * 30;
      var shelfPercent = Math.max(0, Math.min(100, (daysLeft / totalDays) * 100));
      if (earliestDaysLeft === null || daysLeft < earliestDaysLeft) {
        earliestDaysLeft = daysLeft;
        earliestShelfPercent = shelfPercent;
      }
    }
  });
  if (earliestDaysLeft !== null) {
    status.daysLeft = earliestDaysLeft;
    status.shelfPercent = earliestShelfPercent;
    if (earliestDaysLeft <= 0) status.expired = true;
    else if (earliestDaysLeft <= 30) status.expiring = true;
  }

  // === 使用状态 ===
  // 使用中：含「不再买」的品牌（还在开封用的，开封天数照常跟踪）
  status.hasInUse = allVariants.some(function(v) { return v.opened && !v.usedUp; });
  status.allUnopened = variants.length > 0 && variants.every(function(v) { return !v.opened; });

  // 全部品牌都标记「不再买」→ 整个物品不再提醒补货（保质期提醒保留）
  if (variants.length === 0) return status;

  // === 库存告急判断（基于消耗速率预估） ===
  var threshold = item.stockThreshold || 1;
  if (totalStock > 0) {
    // 有库存：基于历史消耗速率预估剩余可用天数
    var estDays = estimateStockDaysLeft(item, totalStock, variants);
    status.estDaysLeft = estDays;
    if (estDays !== null) {
      // 有历史数据：以「预估剩余天数」为主判据，不再额外要求库存数 ≤ 阈值
      // （抽纸剩 3 包、月耗 1.9 包 → 约 47 天，虽然件数 > 阈值也必须提示）
      if (estDays <= 30) status.lowStock = true;
      else if (estDays <= 90) status.lowStockSoft = true;
      // 预估天数还够，但库存已经降到阈值以内 → 温和提示
      else if (totalStock <= threshold) status.lowStockSoft = true;
    } else {
      // 没有历史数据：库存 ≤ 阈值，用温和提示（浅蓝色），不显示黄色告急
      if (totalStock <= threshold) status.lowStockSoft = true;
    }
  } else {
    // 库存为 0：手头没有任何后备库存，无论是否使用中都应提示补货
    var hasOpenedInUse = variants.some(function(v) { return v.opened && !v.usedUp; });
    if (hasOpenedInUse) {
      // 有使用中的变体：按消耗速率预估剩余天数
      var openedEstDays = estimateOpenedDaysLeft(item, variants);
      status.estDaysLeft = openedEstDays;
      if (openedEstDays !== null && openedEstDays > 0) {
        // 正在使用的那份还没用完，但用完就没库存了 → 温和提示补货（蓝）
        status.lowStockSoft = true;
      } else {
        // 已超过预估用完时间，或无法预估 → 真正告急（黄）
        status.lowStock = true;
      }
    } else {
      // 没有使用中的变体，库存为 0，真正告急
      status.lowStock = true;
    }
  }

  // 余量较少/告急：够用天数少或余量低都要提示，未开封也提示（抽纸未开封但只剩 3 包）
  var hasAnyStock = (item.variants && item.variants.length ? item.variants : [item]).some(function (v) { return (v.stock || 0) > 0; });
  if (!status.hasInUse && !hasAnyStock) status.lowStockSoft = false;

  // === 囤货提醒（独立于使用状态） ===
  // 用户的采购节奏：一年只在双 11 采购一次
  // 规则：只要「有过使用记录」且按消耗速率预估「撑不满一年」→ 就该囤货
  // 与是否开封、是否使用中无关；库存 0 也照常提示
  var hasAnyRecord = (item.usageRecords || []).some(function (r) { return r.startDate && r.endDate; });
  if (hasAnyRecord) {
    var estAll = null;
    if (totalStock > 0) {
      estAll = estimateStockDaysLeft(item, totalStock, variants);
    } else {
      // 库存为 0：还有使用中的那份在用 → 它用完就彻底没了，剩余天数取其预估值
      var inUseV = variants.filter(function (v) { return v.opened && !v.usedUp; });
      if (inUseV.length) estAll = Math.max(0, estimateOpenedDaysLeft(item, variants) || 0);
      else estAll = 0;
    }
    if (estAll !== null) {
      status.estDaysLeft = (status.estDaysLeft === null || status.estDaysLeft === undefined) ? estAll : status.estDaysLeft;
      status.monthsLeft = Math.round((estAll / 30) * 10) / 10;
      // 撑不满 365 天 → 该囤货了
      if (estAll < 365) status.stockUpAlert = true;
    }
  }

  return status;
}

// 短卡片库存线条颜色：以「预估剩余天数」为主，件数占比为辅
// 返回 'high'(绿) / 'mid'(黄) / 'low'(红)
function stockBarClass(item, status) {
  status = status || getItemStatus(item);
  var totalStock = getTotalStock(item);
  if (!totalStock) return 'low';
  var threshold = item.stockThreshold || 1;
  var pct = (totalStock / Math.max(totalStock, threshold * 3)) * 100;
  var barClass = 'low';
  if (pct > 60) barClass = 'high';
  else if (pct > 30) barClass = 'mid';
  // 有速率预估：按剩余天数覆盖（>180 天绿 / 90~180 黄 / ≤90 红）
  if (status.estDaysLeft !== null && status.estDaysLeft !== undefined) {
    if (status.estDaysLeft > 180) barClass = 'high';
    else if (status.estDaysLeft > 90) barClass = 'mid';
    else barClass = 'low';
  }
  // 真正告急 → 至少是红；温和提示 → 至多是黄
  if (status.lowStock) barClass = 'low';
  else if (status.lowStockSoft && barClass === 'high') barClass = 'mid';
  return barClass;
}

// 预估当前总库存还能用多少天（基于历史消耗速率）
function estimateStockDaysLeft(item, totalStock, variants) {
  if (!item.usageRecords || item.usageRecords.length === 0) return null;
  var records = item.usageRecords.filter(function(r) { return r.startDate && r.endDate; });
  if (records.length === 0) return null;
  // 统计总消耗量和首次使用日期
  var totalQty = 0, totalContent = 0, allContent = true, earliestDate = null;
  records.forEach(function(r) {
    totalQty += (r.qty || 1);
    if (r.contentUsed > 0) totalContent += r.contentUsed; else allContent = false;
    var start = new Date(r.startDate);
    if (!earliestDate || start < earliestDate) earliestDate = start;
  });
  if (totalQty === 0) return null;
  // 从首次使用到今天经过多少天
  var totalDays = daysBetween(earliestDate, new Date());
  if (totalDays < 1) totalDays = 1;
  // 多规格开封记录：库存本身就是含量口径，直接按「每天消耗多少含量」折算
  // 注意：入参 totalStock 是件数口径，不能直接除以含量速率 —— 用剩余含量（支×每支g）
  if (allContent && totalContent > 0) {
    var scE = itemStockContent(item, variants);
    if (scE !== null) {
      var perDay = totalContent / totalDays;
      if (perDay <= 0) return null;
      return Math.round(scE / perDay);
    }
  }
  var avgDaysPerUnit = totalDays / totalQty;
  // 剩余库存换算成"套"：消耗记录 qty 记的是套餐数，pack 模式 stock 是小单位总数，需除以每套含数
  var isPackMode = isSetPackMode(item);
  var avgPq = 1;
  if (isPackMode && variants && variants.length) {
    avgPq = variants.reduce(function(s, v) { return s + (v.packQty || 1); }, 0) / variants.length;
  }
  var remainingPacks = isPackMode ? (totalStock / Math.max(1, avgPq)) : totalStock;
  // 如果有使用中的变体，减去已用天数
  var activeVariant = variants.find(function(v) { return v.opened && !v.usedUp; });
  if (activeVariant && activeVariant.openDate) {
    var usedDays = daysBetween(new Date(activeVariant.openDate), new Date());
    var remainingInCurrent = Math.max(0, avgDaysPerUnit - usedDays);
    return Math.round(remainingInCurrent + Math.max(0, remainingPacks - 1) * avgDaysPerUnit);
  }
  return Math.round(remainingPacks * avgDaysPerUnit);
}

// ========== 消耗速率计算 ==========
// 基于"首次使用日期到今天"的总时间跨度，计算平均月/年消耗
// 消耗速率的单位名：pack 模式记录的是"开了几套"→套；unit 模式→小单位（优先变体的 packUnit，如 瓶/袋/包）
// 旧值 pack 已在迁移时归一为 spec/count；这里统一用「套装语义」判断：每套含 >1 视为按套记录
function isSetPackMode(item) {
  var m = consumeModelOf(item);
  if (m !== 'count' && m !== 'spec') return false;
  if (!item || !item.variants || !item.variants.length) return false;
  return item.variants.some(function (v) { return (parseFloat(v.packQty) || 1) > 1; });
}
function rateUnitName(item) { return isSetPackMode(item) ? '套' : mainPackUnit(item); }
// 平均每套含数（小单位/套）
function avgPackQtyOf(item) {
  if (!isSetPackMode(item) || !item.variants || !item.variants.length) return 1;
  return item.variants.reduce(function (s, v) { return s + (v.packQty || 1); }, 0) / item.variants.length;
}
// 含量单位识别：ml/L/g/kg 这类是「容量/重量」单位，属于 packWeightUnit（单包规格的单位）的职责，
// 不能当「件数单位」（套餐内几包/瓶/支）用——旧版表单曾把两者混在一个「单位」框里，
// 导致防晒出现「1套 × 2ml/套 × 30ml/ml = 60ml」的错乱算式
function isContentUnitText(u) {
  var s = String(u || '').trim().toLowerCase();
  return s === 'ml' || s === 'l' || s === 'g' || s === 'kg' || s === '毫升' || s === '升' || s === '克' || s === '千克' || s === '公斤';
}
// 变体的「件数单位」（规格 = 套餐内包数的单位：包/瓶/支/个…）
// 优先 packQtyUnit（表单第三行）；兼容旧 packUnit，但旧值若是含量单位（如 ml）则弃用回退「包」
function packQtyUnitOf(v) {
  var c = String((v && v.packQtyUnit) || '').trim();
  if (c) return c;
  c = String((v && v.packUnit) || '').trim();
  if (c && !isContentUnitText(c)) return c;
  return '包';
}
// 主变体的件数单位（阈值/总库存等物品级件数口径的展示单位）
function mainPackUnit(item) {
  if (item && item.variants && item.variants.length) {
    for (var i = 0; i < item.variants.length; i++) {
      var _v = item.variants[i];
      var _c = String(_v.packQtyUnit || '').trim();
      if (_c) return _c;
      _c = String(_v.packUnit || '').trim();
      if (_c && !isContentUnitText(_c)) return _c;
    }
  }
  var _u = String((item && item.unit) || '').trim();
  if (_u && !isContentUnitText(_u)) return _u;
  return '个';
}
function round1(x) { return Math.round((+x || 0) * 10) / 10; }
function calcUsageRate(item) {
  if (!item.usageRecords || item.usageRecords.length === 0) return 0;
  var records = item.usageRecords.filter(function(r) { return r.startDate && r.endDate; });
  if (records.length === 0) return 0;

  // 统计总消耗量
  var totalQty = 0;
  var earliestDate = null;
  records.forEach(function(r) {
    totalQty += (r.qty || 1);
    var start = new Date(r.startDate);
    if (!earliestDate || start < earliestDate) earliestDate = start;
  });
  if (totalQty === 0) return 0;

  // 从首次使用到今天经过了多少天
  var today = new Date();
  var totalDays = daysBetween(earliestDate, today);
  if (totalDays < 1) totalDays = 1; // 至少1天

  var perDay = totalQty / totalDays;
  return perDay * 30; // 月消耗
}

// ===== 含量口径的消耗速率：把使用记录折算成 ml/g 等含量单位 =====
// 记录口径：pack 模式 qty=套 → 含量 = qty × 每套含 × 每小单位含量；unit 模式 qty=小单位 → 含量 = qty × 每小单位含量
// 返回 { perMonth, unit }；任一记录无法换算（未配含量 / ml 混 kg）→ 返回 null，展示退回记录口径
// 含量单位换算表：容量/重量可换算，计数类（粒/个/片/颗）按自身计，不写死单位
var CONTENT_UNIT_TABLE = { ml: ['ml', 1], L: ['ml', 1000], g: ['g', 1], kg: ['g', 1000], 粒: ['粒', 1], 个: ['个', 1], 片: ['片', 1], 颗: ['颗', 1], 包: ['包', 1], 瓶: ['瓶', 1], 盒: ['盒', 1], 抽: ['抽', 1] };
function contentRateOf(item) {
  if (!item.usageRecords || !item.usageRecords.length) return null;
  var vs = item.variants || [];
  var recs = item.usageRecords.filter(function(r) { return r.startDate && r.endDate; });
  if (!recs.length) return null;
  // 基准含量单位：第一个配了含量且单位可换算的变体
  var baseUnit = null;
  for (var i = 0; i < vs.length; i++) {
    if (variantSpecsOf(vs[i]).length) { baseUnit = variantSpecUnit(vs[i]); break; } // 混合规格：以明细单位为准
    if ((parseFloat(vs[i].packWeight) || 0) > 0 && CONTENT_UNIT_TABLE[weightUnitOf(vs[i])]) { baseUnit = weightUnitOf(vs[i]); break; }
  }
  if (!baseUnit) return null;
  var baseFactor = CONTENT_UNIT_TABLE[baseUnit][1];
  var total = 0, earliest = null, ok = true;
  recs.forEach(function(r) {
    var v = null;
    if (r.variantId) v = vs.find(function(x) { return x.id === r.variantId; });
    if (!v) v = vs.find(function(x) { return (parseFloat(x.packWeight) || 0) > 0; }); // 旧记录无variantId → 回退第一个有含量的
    var m = v ? CONTENT_UNIT_TABLE[weightUnitOf(v)] : null;
    if (r.contentUsed > 0) {
      // 多规格开封记录：直接记了本次消耗的总含量
      if (!m || m[0] !== CONTENT_UNIT_TABLE[baseUnit][0]) { ok = false; return; }
      total += r.contentUsed * m[1] / baseFactor;
      var s0 = new Date(r.startDate);
      if (!earliest || s0 < earliest) earliest = s0;
      return;
    }
    var w = v ? (parseFloat(v.packWeight) || 0) : 0;
    if (!v || w <= 0 || !m || m[0] !== CONTENT_UNIT_TABLE[baseUnit][0]) { ok = false; return; }
    var mult = isSetPackMode(item) ? (parseFloat(v.packQty) || 1) : 1;
    total += (r.qty || 1) * w * mult * m[1] / baseFactor;
    var s = new Date(r.startDate);
    if (!earliest || s < earliest) earliest = s;
  });
  if (!ok || total <= 0 || !earliest) return null;
  var days = daysBetween(earliest, new Date());
  if (days < 1) days = 1;
  // v1.7：同时给出「总量 + 跨度天数」，年化时按 365 天精确折算，
  // 避免「/天数×30 再 ×12」两次近似的误差（762.4ml 被显示成 752ml 的根源）。
  return { perMonth: total / days * 30, unit: baseUnit, totalContent: Math.round(total * 100) / 100, days: days };
}
// 速率展示文本：有含量口径 → 「≈9.6ml/月（0.6个/月）」；没有 → 「0.6个/月」
function rateValueText(item, perMonth, suffix) {
  var ru = rateUnitName(item);
  // 多规格记录的 perMonth 口径是「份」，不能借用 mainPackUnit 的名字
  if ((item.usageRecords || []).some(function (r) { return r.specText; })) ru = '份';
  var c = contentRateOf(item);
  if (c && c.perMonth > 0) {
    // v1.7：年化走「总含量 ÷ 跨度 × 365」精确路径（两次近似会失真）；
    // 月化仍用 perMonth。份数在年化时取整（用户要「约 2 份/年」），月化保留 2 位。
    var isYear = (suffix === '/年');
    var cv;
    if (isYear) {
      cv = (c.totalContent > 0 && c.days > 0) ? (c.totalContent / c.days * 365) : (c.perMonth * 12);
    } else {
      cv = c.perMonth;
    }
    var txt = '≈' + trimNum(round1(cv)) + c.unit + suffix;
    // v1.7 双轨制：份数 = 含量速率 ÷ 均值单件容量（63.5ml/月 ÷ 380ml/份 ≈ 0.17 份/月）。
    // 绝不把 ml 数直接冒充「份」（旧版「63.5份/月」「762.4份/年」的根源）。
    var avg = itemAvgPieceOf(item);
    if (avg > 0) {
      var setsV = isYear ? Math.max(1, Math.round(cv / avg)) : (Math.round(cv / avg * 100) / 100);
      txt += '（约 ' + trimNum(setsV) + ' 份' + suffix + '）';
    } else if (ru !== c.unit) {
      txt += '（' + trimNum(round1(perMonth)) + ru + suffix + '）';
    }
    return txt;
  }
  return trimNum(round1(perMonth)) + ru + suffix;
}

// ===== 四模型统计层：统一产出「月消耗 / 剩余月数 / 建议采购」=====
// 口径按模型区分：
//   ①count  件数周期：记录 qty = 开了几件 → 件/月；库存件数 ÷ 速率
//   ②spec   规格周期：记录 qty = 开了几份 → 份/月；剩余含量 ÷ 含量速率（退化到件/月）
//   ③instant即时消耗：无周期概念 → 累计份数 ÷ 使用跨度（首末记录），今年已用单独统计
//   ④combo  组合消耗：动作按包、统计按片 → 先算各子规格「片/月」，再换算成「套/月」（按套建议）
function statsOf(item) {
  if (!item) return null;
  var model = consumeModelOf(item);
  var recs = (item.usageRecords || []).filter(function (r) { return r.startDate; });
  var out = { model: model, rate: 0, rateUnit: '', monthsLeft: null, perYearQty: 0, unit: '', breakdown: [] };

  if (model === 'instant') {
    // 模型③：打卡没有起止周期 → 用「首末记录跨度」；只有一条记录时用「距今」
    var iq = instantUsedQty(item);
    var dated = (item.usageRecords || []).filter(function (r) { return r.instant; });
    var firstD = null, lastD = null;
    dated.forEach(function (r) {
      var d1 = new Date(r.startDate), d2 = new Date(r.endDate || r.startDate);
      if (!firstD || d1 < firstD) firstD = d1;
      if (!lastD || d2 > lastD) lastD = d2;
    });
    var spanDays = firstD ? Math.max(1, daysBetween(firstD, new Date())) : 1;
    var rateM = iq / spanDays * 30;
    var iu = (item.variants && item.variants[0] ? (item.variants[0].packUnit || mainPackUnit(item)) : mainPackUnit(item)) || '份';
    out.rate = rateM; out.rateUnit = iu + '/月'; out.unit = iu;
    out.usedThisYear = iq;
    out.perYearQty = Math.max(1, Math.ceil(rateM * 12));
    var restI = getTotalStock(item);
    out.monthsLeft = rateM > 0 ? (restI / rateM) : null;
    return out;
  }

  if (model === 'combo') {
    // 模型④：按子规格分别统计。v1.7 双轨制：
    //   件数口径：1 包 = 1 件（含量单位绝不拿 ml 冒充件数；片/粒类按片数）；
    //   含量口径：Σ 各规格 ml/月（按实际所选规格容量累计），用于年度采购的「份」折算。
    var v0 = (item.variants || []).find(function (x) { return variantSpecsOf(x).length; }) || (item.variants || [])[0];
    var sp = v0 ? variantSpecsOf(v0) : [];
    var u = sp.length ? variantSpecUnit(v0) : (item.unit || '片');
    // 开包即算消耗（库存已在开包时扣减）→ 统计所有带 specName 的记录，不区分是否已结束
    var specRecs = recs.filter(function (r) { return r.specName && !r.instant; });
    var earliest = null, totalPieces = 0, totalContentMl = 0;
    specRecs.forEach(function (r) {
      var pqR = parseFloat(r.packPieces) || 1;
      var nmR = String(r.specName || '');
      var sR = sp.find(function (x) { return String(x.name || '') === nmR; });
      var uR = sR ? (sR.unit || '') : '';
      if (isContentUnitText(uR)) {
        totalPieces += (parseFloat(r.qty) || 0) / pqR;   // ml 记录 → 件数 = ml ÷ 每包含量（包数）
        totalContentMl += (parseFloat(r.qty) || 0);      // 含量口径直接累计
      } else {
        totalPieces += (parseFloat(r.qty) || 0);        // 片/粒记录 qty 就是片数
        totalContentMl += (parseFloat(r.qty) || 0) / pqR * (sR ? (parseFloat(sR.packQty) || 1) : 1);
      }
      var d = new Date(r.startDate);
      if (!earliest || d < earliest) earliest = d;
    });
    var spanD = earliest ? Math.max(1, daysBetween(earliest, new Date())) : 1;
    var ratePiecesM = totalPieces > 0 ? (totalPieces / spanD * 30) : 0;

    // 「每套件数」= 单套构成合计（Σ 单套内包数），1 包 = 1 件
    var setsTotal = variantPacksBought(v0);
    if (setsTotal <= 0) setsTotal = 1;
    var piecesPerSet = 0;
    var computedPerSet = variantSpecPerSetPieces(v0);
    if (computedPerSet > 0) {
      piecesPerSet = Math.max(1, Math.round(computedPerSet * 100) / 100);
    } else {
      piecesPerSet = 1;
    }

    out.ratePieces = ratePiecesM;
    out.rate = ratePiecesM > 0 ? (ratePiecesM / piecesPerSet) : 0;   // 套/月
    out.rateUnit = '套/月';
    out.unit = '套';
    out.unitSmall = u;
    out.piecesPerSet = piecesPerSet;
    out.piecesPerMonth = ratePiecesM;
    out.contentPerMonth = totalContentMl > 0 ? (totalContentMl / spanD * 30) : 0;  // ml/月（按实际规格容量）
    out.perYearQty = out.rate > 0 ? Math.max(1, Math.ceil(out.rate * 12)) : 0;
    var restPieces = 0;
    sp.forEach(function (s) {
      var uS = s.unit || '';
      restPieces += isContentUnitText(uS) ? specPacksRemaining(v0, s) : specPacksRemaining(v0, s) * specPackQty(s);
    });
    out.restSmall = restPieces;
    out.monthsLeft = (ratePiecesM > 0) ? (restPieces / ratePiecesM) : null;
    // 子规格明细（作为「按套」结论下的参考）
    // 注意：直接遍历 v0.specs（不能用 variantSpecsOf 过滤，否则已用完的规格会漏掉）
    var allSpecs = (v0 && v0.specs) ? v0.specs : [];
    allSpecs.forEach(function (s) {
      var nm = s.name || '规格';
      var sub = specRecs.filter(function (r) { return r.specName === nm; });
      var q = 0, e = null;
      sub.forEach(function (r) {
        q += (parseFloat(r.qty) || 0);
        var d = new Date(r.startDate);
        if (!e || d < e) e = d;
      });
      var dd = e ? Math.max(1, daysBetween(e, new Date())) : 1;
      var pm = q > 0 ? (q / dd * 30) : 0;
      var uS = s.unit || '';
      var restP = specPacksRemaining(v0, s) * specPackQty(s);   // 该规格剩余容量（ml/片）
      out.breakdown.push({
        name: nm, unit: uS || u, perMonth: pm,
        rest: restP,
        monthsLeft: pm > 0 ? (restP / pm) : null
      });
    });
    return out;
  }

  // ①count / ②spec：原有周期口径（记录 qty = 件 / 份）
  var rate = calcUsageRate(item);
  var ru = rateUnitName(item);
  if ((item.usageRecords || []).some(function (r) { return r.specText; })) ru = '份';
  out.rate = rate; out.rateUnit = ru + '/月'; out.unit = ru;
  out.perYearQty = rate > 0 ? Math.max(1, Math.ceil(rate * 12)) : 0;
  var cr = contentRateOf(item);
  if (cr && cr.perMonth > 0) { out.contentRate = cr.perMonth; out.contentUnit = cr.unit; }
  var totS = getTotalStock(item);
  var scS = itemStockContent(item);
  // 库存与速率同口径：含量优先，否则件/份
  if (cr && cr.perMonth > 0 && scS !== null) out.monthsLeft = scS / cr.perMonth;
  else if (rate > 0 && !(item.usageRecords || []).some(function (r) { return r.specText; })) out.monthsLeft = (totS || 0) / rate;
  return out;
}

// 采购建议文本（按模型分流）；返回 { main, detail }
// 用户规则：一年只在双 11 采购一次 → 一律按「够一年」给建议
function buyAdviceOf(item) {
  var st = statsOf(item);
  if (!st) return null;
  if (st.model === 'instant') {
    if (!(st.usedThisYear > 0)) return null;
    var perYear = st.perYearQty;
    var boxes = Math.max(1, Math.ceil(perYear / 10)); // 常见 10 片/盒
    return {
      main: '今年已用 ' + trimNum(st.usedThisYear) + st.unit + '，按此速度一年约 ' + perYear + st.unit + '，建议备 ' + boxes + ' 盒',
      detail: null
    };
  }
  if (st.model === 'combo') {
    if (!(st.rate > 0) && !(st.contentPerMonth > 0)) return null;
    var avgC = itemAvgPieceOf(item);
    // v1.7 双轨制：采购一律按「份」（均值单件容量折算）——
    // 年消耗 762.4ml ÷ 380ml/份 ≈ 2 份 → 「建议囤 2 份（约 760ml）」。绝不显示「763 份」。
    if (avgC > 0 && st.contentPerMonth > 0) {
      var perYearMl = st.contentPerMonth * 12;
      var nSets = Math.max(1, Math.round(perYearMl / avgC));
      var mlTxt = trimNum(round1(nSets * avgC));
      var detail2 = null;
      if (st.breakdown && st.breakdown.length) {
        detail2 = st.breakdown.map(function (b) {
          return b.name + ' 剩 ' + trimNum(b.rest) + b.unit
            + (b.monthsLeft !== null ? '（够 ' + Math.max(0, Math.round(b.monthsLeft)) + ' 月）' : '');
        }).join(' · ');
      }
      return {
        main: '建议囤 <strong>' + nSets + ' 份</strong>（约 ' + mlTxt + '，约够一年）',
        detail: detail2
      };
    }
    // 片/粒类（无均值容量）：维持「套」口径
    var sets = st.perYearQty;
    var detail = null;
    if (st.breakdown && st.breakdown.length) {
      detail = st.breakdown.map(function (b) {
        return b.name + ' 剩 ' + trimNum(b.rest) + b.unit
          + (b.monthsLeft !== null ? '（够 ' + Math.max(0, Math.round(b.monthsLeft)) + ' 月）' : '');
      }).join(' · ');
    }
    return {
      main: '建议囤 <strong>' + sets + ' 套</strong>（约够一年，含 '
        + trimNum(round1(st.piecesPerSet)) + st.unitSmall + '/套）',
      detail: detail
    };
  }
  // ①count / ②spec
  if (!(st.rate > 0)) return null;
  // v1.7 双轨制：含量口径下「份」= 年消耗 ml ÷ 均值单件容量（2 份），不显示「763 份」
  var avgS = itemAvgPieceOf(item);
  if (avgS > 0 && st.contentRate > 0) {
    var perYearMlS = st.contentRate * 12;
    var nSetsS = Math.max(1, Math.round(perYearMlS / avgS));
    return {
      main: '建议囤 <strong>' + nSetsS + ' 份</strong>（约 ' + trimNum(round1(nSetsS * avgS)) + '，约够一年）',
      detail: '≈' + trimNum(round1(perYearMlS)) + st.contentUnit + '/年'
    };
  }
  var qty = st.perYearQty;
  var main = '建议囤 <strong>' + qty + ' ' + st.unit + '</strong>（约够一年）';
  var extra = '';
  if (st.contentUnit && st.contentRate > 0) {
    extra = '≈' + trimNum(round1(st.contentRate * 12)) + st.contentUnit + '/年';
  } else if (isSetPackMode(item)) {
    var aq = avgPackQtyOf(item);
    if (aq > 1) extra = '≈' + round1(st.rate * 12 * aq) + mainPackUnit(item) + '/年';
  }
  return { main: main, detail: extra || null };
}

// ========== 预估使用中变体的剩余天数 ==========
// 基于"首次使用到今天"的总时间跨度，预估剩余可用天数
function estimateOpenedDaysLeft(item, variants) {
  if (!item.usageRecords || item.usageRecords.length === 0) return null;
  var records = item.usageRecords.filter(function(r) { return r.startDate && r.endDate; });
  if (records.length === 0) return null;

  // 统计总消耗量和首次使用日期
  var totalQty = 0, totalContent = 0, allContent = true, earliestDate = null;
  records.forEach(function(r) {
    totalQty += (r.qty || 1);
    if (r.contentUsed > 0) totalContent += r.contentUsed; else allContent = false;
    var start = new Date(r.startDate);
    if (!earliestDate || start < earliestDate) earliestDate = start;
  });
  if (totalQty === 0) return null;
  var totalDays = daysBetween(earliestDate, new Date());
  if (totalDays < 1) totalDays = 1;
  var avgDaysPerUnit = totalDays / totalQty;

  // 找到当前使用中的变体
  var activeVariant = variants.find(function(v) { return v.opened && !v.usedUp; });
  if (!activeVariant || !activeVariant.openDate) return null;

  // 已使用天数
  var usedDays = daysBetween(new Date(activeVariant.openDate), new Date());
  // 多规格：库存是含量口径，直接按「剩余含量 ÷ 每天消耗含量」估
  if (allContent && totalContent > 0) {
    var perDayC = totalContent / totalDays;
    if (perDayC <= 0) return null;
    return Math.round((activeVariant.stock || 0) / perDayC - usedDays);
  }
  // 预估剩余天数 = 平均周期 - 已使用天数
  return Math.round(avgDaysPerUnit - usedDays);
}

// ========== 首页 AI 摘要卡 ==========
// 分工：首页只给「一眼速览 + 一个入口」，消耗速率与采购建议的完整明细都在「年报」独立页。
// 之前把 4 个 section（速率 TOP5 / 采购建议 / 花费分析 / 大促倒计时）全塞在首页小卡里，
// 既挤又和年报重复，且「别买了」是永远为空的死代码 —— 现在统一收口到年报。
function renderAIAnalysis() {
  var r = buildAnnualReport();
  var html = '<div class="ai-card">';
  html += '<div class="ai-header"><span style="font-size:20px">🤖</span>';
  html += '<span class="ai-title">智能摘要</span>';
  html += '<span class="ai-badge">离线分析</span></div>';

  if (r.empty) {
    html += '<div class="ai-suggest">' + escapeHtml(r.emptyReason || '还没有可统计的数据') + '</div>';
    html += '</div>';
    return html;
  }

  // 一句话结论：最紧要的那件事
  html += '<div class="ai-suggest" style="margin-bottom:10px">' + escapeHtml(aiSummaryLine(r)) + '</div>';

  // 三个数字
  html += '<div class="ai-item"><span>有速率的物品</span><span class="ai-val">' + r.counts.rate + ' 件</span></div>';
  html += '<div class="ai-item"><span>需要补货</span><span class="ai-val">' + r.counts.buy + ' 件</span></div>';
  if (r.counts.noData > 0) {
    html += '<div class="ai-item"><span>还差数据</span><span class="ai-val">' + r.counts.noData + ' 件</span></div>';
  }

  // 采购建议：首页只露最紧的 3 条，完整列表在年报
  var buyRows = (r.groups.find(function (g) { return g.key === 'buy'; }) || { rows: [] }).rows;
  if (buyRows.length > 0) {
    html += '<div class="ai-section" style="margin-top:12px">';
    html += '<div class="ai-section-title">最先要补的</div>';
    buyRows.slice(0, 3).forEach(function (e) {
      var tail = e.leftText ? e.leftText.replace('按现在的速度', '').replace(/^[，,]?\s*/, '') : '';
      html += '<div class="ai-item"><span>' + escapeHtml(e.name) + '</span>';
      html += '<span class="ai-val">' + escapeHtml(tail || '该补货') + '</span></div>';
    });
    html += '</div>';
  }

  // 花费：只给今年总额，明细不在首页
  if (r.totalSpend > 0) {
    html += '<div class="ai-item" style="border-top:1px solid rgba(0,105,92,0.2);margin-top:8px">';
    html += '<span>今年已记录花费</span><span class="ai-val">¥' + r.totalSpend.toFixed(2) + '</span></div>';
  }

  // 入口
  html += '<button class="btn btn-primary btn-full" style="margin-top:12px" onclick="showPage(\'report\')">📊 查看完整年报</button>';
  html += '<div style="font-size:11px;color:#00695C;opacity:.75;margin-top:6px;text-align:center;line-height:1.5">年报含每件物品的消耗速率与建议采购量</div>';

  html += '</div>';
  return html;
}

// 首页摘要卡的一句话结论：按「告急 > 撑不到一年 > 数据不足 > 一切正常」优先级挑一件说
function aiSummaryLine(r) {
  var all = r.groups.reduce(function (a, g) { return a.concat(g.rows.map(function (x) { return { g: g.key, e: x }; })); }, []);
  var urgent = all.filter(function (x) { return x.g === 'buy' && x.e.lowStock; });
  if (urgent.length > 0) {
    return '⚠️ ' + urgent.length + ' 件已经告急，' + urgent[0].e.name + ' 最先要补。';
  }
  if (r.counts.buy > 0) {
    var first = (r.groups.find(function (g) { return g.key === 'buy'; }) || { rows: [] }).rows[0];
    return '🛒 ' + r.counts.buy + ' 件撑不到明年，' + first.name + ' 最紧。';
  }
  if (r.counts.rate === 0) {
    return '⏳ 还没有足够的消耗记录，先用几次再来看看。';
  }
  return '✅ 库存都够撑到下次采购，暂时不用买。';
}

// ========== 年报数据层 ==========
// 年报只回答两件事：① 消耗速率（现在用得多快）② 建议采购（这次该买多少）
// 口径统一走 statsOf / buyAdviceOf，四模型分流；这里只负责「凑成人话」
// 返回结构：
//   { empty, emptyReason, asOf, groups: [{key,title,hint,rows,extra}], counts:{...}, totalSpend, totalItems }

// 把「每月消耗速率」换成一句精确的人话
//   count  → 「每月约 0.7 支（每 43 天一支）」
//   spec   → 「每月约 2.1 份」
//   combo  → 「每月约 0.8 套（每套 67 片）」
//   instant→ 「每月约 12 片」+ 由调用方补「今年累计」
// 有含量口径（ml/g）时优先给含量，并把件数口径放进括号，避免「用掉一kg」这类错话
function rateSentenceOf(item, st) {
  if (!st || !(st.rate > 0)) return '';
  var ru = st.unit || rateUnitName(item);
  var head = '每月约 ' + trimNum(round1(st.rate)) + ru;
  if (st.model === 'combo') {
    head += '（每套 ' + trimNum(round1(st.piecesPerSet)) + (st.unitSmall || '片') + '）';
  }
  if (st.contentRate > 0 && st.contentUnit) {
    head = '每月约 ' + trimNum(round1(st.contentRate)) + st.contentUnit
      + '（≈' + trimNum(round1(st.rate)) + ru + '）';
  }
  // 附加「每 N 天一个」——只有能落到「天数」的量才说，避免「每 0 天」
  var days = st.rate > 0 ? Math.round(30 / st.rate) : 0;
  if (days >= 2) {
    var dUnit = st.model === 'combo' ? '套' : ru;
    head += '，约 ' + days + ' 天用掉 1' + dUnit;
  }
  return head;
}

// 「现在还剩多少」——四模型口径各不同，统一在这里说清
function restSentenceOf(item, st) {
  if (!st) return '';
  if (st.model === 'combo') {
    var pieces = round1(st.restSmall || 0);
    var sets = (st.piecesPerSet > 0) ? Math.floor((st.restSmall || 0) / st.piecesPerSet) : 0;
    return '剩 ' + trimNum(pieces) + (st.unitSmall || '片') + '（≈' + sets + ' 套）';
  }
  if (st.model === 'instant') {
    return '剩 ' + trimNum(getTotalStock(item)) + (st.unit || '份');
  }
  var tot = getTotalStock(item);
  var txt = '剩 ' + trimNum(tot) + (st.unit || '个');
  var sc = itemStockContent(item);
  if (sc !== null && sc > 0) txt += '（≈' + trimNum(round1(sc)) + (mainPackUnit(item)) + '）';
  return txt;
}

// 「还能用多久」——monthsLeft 是四模型统一口径，这里只做区间化措辞（避免「还能用 0.3 个月」）
function monthsLeftSentenceOf(st) {
  if (!st || st.monthsLeft === null || !(st.rate > 0)) return '';
  var m = st.monthsLeft;
  if (m < 0.5) return '按现在的速度撑不到半个月';
  if (m < 1) return '按现在的速度还能用不到 1 个月';
  if (m < 1.5) return '按现在的速度还能用约 1 个月';
  if (m < 24) return '按现在的速度还能用约 ' + Math.round(m) + ' 个月';
  return '按现在的速度能用 2 年以上';
}

// 建议采购的一句话依据（把 buyAdviceOf.main 的 HTML 洗成纯文本）
function adviceMainText(item) {
  var adv = buyAdviceOf(item);
  if (!adv) return '';
  return String(adv.main || '').replace(/<[^>]+>/g, '');
}

// 主入口：把 DB 里所有消耗品凑成年报
function buildAnnualReport() {
  var out = {
    empty: true, emptyReason: '', asOf: new Date(),
    groups: [], counts: { rate: 0, buy: 0, stop: 0, noData: 0, history: 0 },
    totalSpend: 0, totalItems: 0
  };

  // 1. 收集全部消耗品（含已归档：归档只是不再提醒，历史速率仍值得看）
  var all = [];
  DB.zones.forEach(function (zone) {
    if (zone.type !== 'consumable') return;
    var push = function (it, arch) {
      all.push({ item: it, zone: zone, archived: !!arch });
    };
    visibleItems(zone).forEach(function (it) { push(it, false); });
    archivedItemsOf(zone).forEach(function (it) { push(it, true); });
  });
  out.totalItems = all.length;

  if (all.length === 0) {
    out.emptyReason = '还没有消耗品。先在领地里加几件日用消耗品吧。';
    return out;
  }

  // 2. 逐项算；分三组：该买 / 别买 / 数据不够
  var gBuy = [], gStop = [], gNoData = [], gRate = [];
  var thisYear = new Date().getFullYear();

  all.forEach(function (row) {
    var it = row.item, zone = row.zone;
    var st = statsOf(it);
    var status = getItemStatus(it);
    var recs = (it.usageRecords || []).length;

    var entry = {
      itemId: it.id, zoneId: zone.id,
      name: it.name, zoneName: zone.name, zoneIcon: zone.icon,
      archived: row.archived,
      model: st ? st.model : 'spec',
      unit: st ? (st.unit || '') : '',
      rate: st ? st.rate : 0,
      rateText: rateSentenceOf(it, st),
      restText: restSentenceOf(it, st),
      leftText: monthsLeftSentenceOf(st),
      monthsLeft: st ? st.monthsLeft : null,
      advice: adviceMainText(it),
      adviceDetail: (function () { var a = buyAdviceOf(it); return a ? a.detail : null; })(),
      usedThisYear: st && st.usedThisYear ? st.usedThisYear : 0,
      spendThisYear: 0,
      lowStock: !!(status.lowStock || status.stockUpAlert),
      noRestock: (it.variants || []).length > 0 && (it.variants || []).every(function (v) { return v.noRestock; }),
      hasData: recs > 0 && st && st.rate > 0
    };
    // 「不再买」判定：整件物品所有品牌都标了 noRestock，或已归档
    // —— 这类物品即便有速率也不该进「建议采购」，否则会一直催买用户明确不买的东西
    entry.stopBuy = entry.archived || entry.noRestock;

    // 今年花费（只算本物品自己的 priceHistory）
    (it.priceHistory || []).forEach(function (p) {
      if (!p.date) return;
      var d = new Date(p.date);
      if (d.getFullYear() === thisYear) {
        entry.spendThisYear += (p.totalPrice || 0);
        out.totalSpend += (p.totalPrice || 0);
      }
    });

    if (entry.hasData) {
      gRate.push(entry);
      // 有速率但明确不再买 → 只进「不用再买」，不给采购建议
      if (entry.stopBuy) gStop.push(entry);
      else if (entry.advice) gBuy.push(entry);
    } else {
      // 没速率：不再买/已归档的进「不用再买」，其余进「还差数据」
      if (entry.stopBuy) gStop.push(entry);
      else gNoData.push(entry);
    }
  });

  // 3. 排序：速率榜按月耗量降序（跨单位不可比，只是「记录最活跃的排前面」）
  gRate.sort(function (a, b) { return b.rate - a.rate; });
  // 该买的排前面：先告急，再按剩余月数升序（越紧越前）
  gBuy.sort(function (a, b) {
    if (a.lowStock !== b.lowStock) return a.lowStock ? -1 : 1;
    var am = (a.monthsLeft === null) ? 999 : a.monthsLeft;
    var bm = (b.monthsLeft === null) ? 999 : b.monthsLeft;
    return am - bm;
  });

  // gNoData / gStop 去重（分组分支可能各 push 一次）
  var seenNo = {}, seenStop = {};
  gNoData = gNoData.filter(function (e) {
    if (seenNo[e.itemId]) return false;
    seenNo[e.itemId] = 1; return true;
  });
  gStop = gStop.filter(function (e) {
    if (seenStop[e.itemId]) return false;
    seenStop[e.itemId] = 1; return true;
  });
  // 已归档的不再重复出现在「数据不够」
  gNoData = gNoData.filter(function (e) { return !e.archived; });

  out.counts.rate = gRate.length;
  out.counts.buy = gBuy.length;
  out.counts.stop = gStop.length;
  out.counts.noData = gNoData.length;

  // 4. 组装分组
  if (gBuy.length) {
    out.groups.push({
      key: 'buy', title: '建议采购', icon: '🛒',
      hint: '按「一年只在双十一买一次」的节奏算：撑不到一年的才进这里。越紧的排越前。',
      rows: gBuy
    });
  }
  if (gRate.length) {
    out.groups.push({
      key: 'rate', title: '消耗速率', icon: '📈',
      hint: '速率 = 已记录消耗量 ÷ 首末记录跨度。记录越多越准。',
      rows: gRate
    });
  }
  if (gStop.length) {
    out.groups.push({
      key: 'stop', title: '不用再买', icon: '⛔',
      hint: '标记了「不再买」或已归档的品牌，不算进补货提醒。',
      rows: gStop
    });
  }
  if (gNoData.length) {
    out.groups.push({
      key: 'nodata', title: '还差数据', icon: '⏳',
      hint: '还没有使用记录，先用几次、记一次消耗，这里就会出速率与建议。',
      rows: gNoData
    });
  }

  // 5. 历史档案：已删除的物品从年度档案里捞回来
  // 档案生成时速率四要素已一并固化（rateText/leftText/adviceText），删除不影响这份数据
  var liveIds = {};
  all.forEach(function (r) { liveIds[r.item.id] = 1; });
  var histMap = {};
  Object.keys(DB.yearStats || {}).forEach(function (y) {
    ((DB.yearStats[y] && DB.yearStats[y].items) || []).forEach(function (e) {
      if (!e.itemId || liveIds[e.itemId]) return;   // 还在的（含归档）不算历史
      var h = histMap[e.itemId];
      if (!h) {
        h = histMap[e.itemId] = {
          itemId: e.itemId, zoneId: e.zoneId || '', zoneName: e.zoneName || '', zoneIcon: e.zoneIcon || '📦',
          name: e.name, deleted: true, archived: false,
          model: '', unit: e.unit || '', rate: 0,
          rateText: e.rateText || '', restText: '', leftText: e.leftText || '',
          advice: e.adviceText || '', adviceDetail: null,
          usedThisYear: 0, spendThisYear: 0,
          lowStock: false, noRestock: true,
          hasData: !!(e.rateText || (e.qty > 0)),
          years: []
        };
      }
      h.years.push({ year: y, qty: e.qty, unit: e.unit, capQty: e.capQty, capUnit: e.capUnit, spend: e.spend });
    });
  });
  var gHist = Object.keys(histMap).map(function (k) { return histMap[k]; });
  gHist.sort(function (a, b) { return b.years.length - a.years.length; });
  out.counts.history = gHist.length;
  if (gHist.length) {
    out.groups.push({
      key: 'history', title: '历史档案', icon: '🗄️',
      hint: '这些物品已删除，数据来自年度档案快照，不会再变化。',
      rows: gHist
    });
  }

  out.empty = (gBuy.length + gRate.length + gStop.length + gNoData.length + gHist.length) === 0;
  if (out.empty) out.emptyReason = '还没有可统计的消耗品。';
  return out;
}

// ========== 板块页渲染 ==========
function renderZone() {
  var zone = getZone(currentZoneId);
  if (!zone) { showPage('home'); return; }
  var html = '';

  // 搜索栏
  html += '<div class="search-bar">';
  html += '<span class="search-icon">🔍</span>';
  html += '<input type="text" placeholder="搜物品/分类/备注/描述..." value="' + escapeHtml(currentSearchQuery) + '" oninput="onSearch(this.value)">';
  html += '</div>';

  // 分类标签（第一行：全部 + 大类）
  var mainCats = zone.categories.filter(function(c) { return !c.parentId; });
  // 若当前选中的是子分类，找到其父大类用于第一行高亮和第二行渲染
  var activeMainId = 'all';
  var activeSubId = null;
  if (currentCategoryId !== 'all') {
    var curCat = getCategory(currentZoneId, currentCategoryId);
    if (curCat) {
      if (curCat.parentId) {
        activeMainId = curCat.parentId;
        activeSubId = curCat.id;
      } else {
        activeMainId = curCat.id;
      }
    }
  }
  html += '<div class="cat-tabs">';
  html += '<div class="cat-tab ' + (activeMainId === 'all' ? 'active' : '') + '" onclick="selectCategory(\'all\')">全部</div>';
  mainCats.forEach(function(cat) {
    html += '<div class="cat-tab ' + (activeMainId === cat.id ? 'active' : '') + '" onclick="selectCategory(\'' + cat.id + '\')">';
    html += escapeHtml(cat.name);
    html += '</div>';
  });
  html += '</div>';

  // 第二行：选中大类的子分类（有子分类才显示）
  if (activeMainId !== 'all') {
    var subs = getSubcategories(zone, activeMainId);
    if (subs.length > 0) {
      html += '<div class="cat-tabs" style="margin-top:-4px">';
      html += '<div class="cat-tab ' + (!activeSubId ? 'active' : '') + '" onclick="selectCategory(\'' + activeMainId + '\')">全部</div>';
      subs.forEach(function(sub) {
        html += '<div class="cat-tab ' + (activeSubId === sub.id ? 'active' : '') + '" onclick="selectCategory(\'' + sub.id + '\')">';
        html += escapeHtml(sub.name);
        html += '</div>';
      });
      html += '</div>';
    }
  }

  // 物品网格
  if (currentCategoryId !== 'all') {
    html += '<div style="margin:10px 0 14px"><button class="btn btn-outline btn-sm" style="width:100%" onclick="taskOpenFormFromCategory(\'' + currentZoneId + '\',\'' + currentCategoryId + '\')">📋 委托补货（引用本分类产品）</button></div>';
  }
  // 归档箱入口（用完不再买的物品都在这里，数据保留可恢复）
  var arcCnt = archivedCountAll();
  if (arcCnt > 0 && !currentSearchQuery) {
    html += '<div style="margin:0 0 14px"><button class="btn btn-outline btn-sm" style="width:100%;font-size:12px" onclick="showArchivedBox()">📦 归档箱（' + arcCnt + ' 件 · 用完不再买）</button></div>';
  }
  var items = getItemsByCategory(currentZoneId, currentCategoryId);
  if (items.length === 0) {
    html += '<div class="empty-state">';
    html += '<div class="empty-icon">📦</div>';
    html += '<div class="empty-text">还没有物品<br>点击右上角＋添加</div>';
    html += '</div>';
  } else {
    html += '<div class="item-grid">';
    items.forEach(function(it) {
      html += renderItemCard(it, zone);
    });
    html += '</div>';
  }

  document.getElementById('zone-content').innerHTML = html;
}

function onSearch(q) {
  currentSearchQuery = q;
  renderZone();
}

function selectCategory(catId) {
  currentCategoryId = catId;
  renderZone();
}

// ========== 物品卡片渲染 ==========
function renderItemCard(item, zone) {
  var status = getItemStatus(item);
  var isDurable = zone.type !== 'consumable';
  // 耐用品按各 variant 的 stock 汇总实际件数；无 stock 字段（旧数据）默认1
  var variantCount;
  if (isDurable) {
    variantCount = (item.variants && item.variants.length) ? item.variants.reduce(function(s,v){ return s + (v.stock||1); }, 0) : 1;
  } else {
    variantCount = (item.variants && item.variants.length) ? item.variants.length : 0;
  }

  var html = '<div class="item-card item-card-compact" onclick="openCardDetail(\'' + zone.id + '\',\'' + item.id + '\')">';

  // 角标
  if (item.archived) {
    html += '<div class="card-badge badge-archived">📦 已归档</div>';
  } else if (status.expired) {
    html += '<div class="card-badge badge-expire">已过期</div>';
  } else if (status.expiring) {
    html += '<div class="card-badge badge-warn">' + status.daysLeft + '天</div>';
  } else if (status.lowStock) {
    html += '<div class="card-badge badge-low">告急</div>';
  } else if (status.stockUpAlert) {
    html += '<div class="card-badge badge-restock">🛒 囤货</div>';
  }
  // 开袋即用完标记（用于排查被误开的开关）
  if (item.oneShot === true) {
    html += '<div class="card-badge badge-oneshot">⚡即用完</div>';
  }
  // 使用感受标记
  if (item.feeling && item.feeling.rating) {
    if (item.feeling.rating >= 4) {
      html += '<div class="card-badge badge-good">👍</div>';
    } else if (item.feeling.rating <= 2) {
      html += '<div class="card-badge badge-bad">👎</div>';
    }
  }

  // 卡片body
  html += '<div class="card-body">';
  html += '<div class="card-name">' + escapeHtml(item.name) + '</div>';

  if (isDurable) {
    // 耐用品正面：显示件数 + 总金额
    html += '<div class="card-info" style="color:var(--accent);font-weight:600">' + variantCount + '件</div>';
    var totalPrice = calcDurableTotalPrice(item);
    html += '<div class="card-info" style="font-weight:600">总金额 ¥' + totalPrice.toFixed(2) + '</div>';
    if (item.location) {
      html += '<div class="card-info">📍 ' + escapeHtml(item.location) + '</div>';
    }
    if (item.lastUsedDate) {
      var dDays = daysBetween(new Date(item.lastUsedDate), new Date());
      if (dDays > 180) {
        html += '<div class="card-info" style="color:var(--purple);font-weight:600">🕐 ' + Math.floor(dDays/30) + '个月没用</div>';
      }
    }
  } else {
    // 补给品品牌变体数
    if (item.variants && item.variants.length > 0) {
      html += '<div class="card-info" style="color:var(--accent);font-weight:500">' + item.variants.length + '个品牌</div>';
    }
    // 消耗品正面：库存条 + 保质期
    var totalStock = getTotalStock(item);
    if (totalStock !== undefined) {
      var threshold = item.stockThreshold || 1;
      var maxBar = Math.max(totalStock, threshold * 3);
      var pct = maxBar > 0 ? (totalStock / maxBar * 100) : 0;
      var barClass = stockBarClass(item, status);
      html += '<div class="card-info">' + stockSummaryOf(item) + ' · ¥' + parseFloat((item.currentPrice || 0)).toFixed(2) + '</div>';
      html += '<div class="stock-bar ' + barClass + ' card-mini-bar"><div class="stock-fill" style="width:' + pct + '%"></div></div>';
    }
    if (status.daysLeft !== null && !status.expired) {
      var shelfColor = status.daysLeft <= 30 ? 'var(--red)' : (status.daysLeft <= 90 ? 'var(--orange)' : 'var(--green)');
      html += '<div class="card-info" style="color:' + shelfColor + ';font-weight:600">⏰ ' + status.daysLeft + '天</div>';
    }
  }

  html += '</div></div>';
  return html;
}

// ========== 使用记录编辑 ==========
function openUsageEdit(itemId, idx) {
  var item = findItemByIdGlobal(itemId);
  if (!item || !item.usageRecords || !item.usageRecords[idx]) { toast('记录不存在'); return; }
  var r = item.usageRecords[idx];
  var fmt = function(s) { return s ? String(s).slice(0, 10) : ''; };
  var html = '<div class="modal-handle"></div><div class="modal-title">✏️ 编辑使用记录</div>';
  html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">' + escapeHtml(item.name) + ' · 可修正数量与日期（历史记录若按套餐误记，请按实际' + rateUnitName(item) + '数修正）</div>';
  html += '<div class="form-group"><label class="form-label">消耗数量（' + rateUnitName(item) + '）</label><input type="number" class="form-input" id="ur-qty" step="0.01" min="0" value="' + (r.qty || 1) + '"></div>';
  html += '<div class="form-group"><label class="form-label">开始日期</label><input type="date" class="form-input" id="ur-start" value="' + fmt(r.startDate) + '"></div>';
  html += '<div class="form-group"><label class="form-label">结束日期（留空 = 使用中）</label><input type="date" class="form-input" id="ur-end" value="' + fmt(r.endDate) + '"></div>';
  html += '<div style="display:flex;gap:10px;margin-top:14px">';
  html += '<button class="btn btn-danger" style="flex:1" onclick="deleteUsageRecord(\'' + itemId + '\',' + idx + ')">🗑️ 删除</button>';
  html += '<button class="btn btn-primary" style="flex:2" onclick="saveUsageEdit(\'' + itemId + '\',' + idx + ')">保存</button>';
  html += '</div>';
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}
function saveUsageEdit(itemId, idx) {
  var item = findItemByIdGlobal(itemId);
  if (!item || !item.usageRecords || !item.usageRecords[idx]) { closeModal(); return; }
  var r = item.usageRecords[idx];
  var q = parseFloat(document.getElementById('ur-qty').value);
  r.qty = (isNaN(q) || q <= 0) ? 1 : Math.round(q * 100) / 100;
  var s = document.getElementById('ur-start').value;
  var e = document.getElementById('ur-end').value;
  if (s) r.startDate = s;
  if (e) { r.endDate = e; }
  else { delete r.endDate; }
  saveDB();
  closeModal();
  if (currentDetailItem && currentDetailItem.id === item.id) renderCardBack(currentDetailItem, currentDetailZone);
  toast('✅ 记录已更新');
}
function deleteUsageRecord(itemId, idx) {
  var item = findItemByIdGlobal(itemId);
  if (!item || !item.usageRecords || !item.usageRecords[idx]) { closeModal(); return; }
  item.usageRecords.splice(idx, 1);
  saveDB();
  closeModal();
  if (currentDetailItem && currentDetailItem.id === item.id) renderCardBack(currentDetailItem, currentDetailZone);
  toast('🗑️ 记录已删除');
}

// ========== 卡片详情（翻面）==========
var currentDetailItem = null;
var currentDetailZone = null;

function openCardDetail(zoneId, itemId) {
  var zone = getZone(zoneId);
  var item = getItem(zoneId, itemId);
  if (!zone || !item) return;
  currentDetailItem = item;
  currentDetailZone = zone;

  renderCardFront(item, zone);
  renderCardBack(item, zone);

  // 默认直接显示背面（翻转状态），无需点两次
  document.getElementById('flip-inner').classList.add('flipped');
  document.getElementById('card-detail-overlay').classList.add('show');
}

// 消耗模型徽章：卡片标题右手边直接显示当前模型（件数/规格/即时/组合），
// 免得每个物品都要点进编辑页才能看到/确认是哪个模型。点击徽章直达编辑。
function consumeModelBadgeHtml(item) {
  var mk = consumeModelOf(item);
  var mm = CONSUME_MODELS[mk] || { icon: '❓', name: mk, desc: '' };
  return '<button onclick="event.stopPropagation();editItem(\'' + item.id + '\')" '
    + 'title="' + (mm.desc || '').replace(/"/g, '&quot;') + '（点此修改模型）" '
    + 'style="display:inline-block;margin-left:8px;padding:2px 8px;border-radius:6px;background:rgba(10,132,255,0.10);color:var(--accent);font-size:12px;font-weight:600;vertical-align:middle;border:none;cursor:pointer;white-space:nowrap">'
    + mm.icon + ' ' + mm.name + '</button>';
}
function renderCardFront(item, zone) {
  var isDurable = zone.type !== 'consumable';
  var html = '<div class="detail-front">';
  // 所有类型都用紧凑模式，不显示大照片区
  html += '<div class="detail-photo" style="background:var(--bg);">';
  html += isDurable ? '👕' : '📦';
  html += '</div>';
  html += '<div class="detail-body">';
  html += '<div class="detail-name">' + escapeHtml(item.name) + consumeModelBadgeHtml(item) + '</div>';
  var catPath = getCategoryPath(zone.id, item.categoryId);
  html += '<div class="detail-cat">' + zone.icon + ' ' + zone.name + (catPath ? ' · ' + catPath : '') + '</div>';

  if (zone.type === 'consumable') {
    var status = getItemStatus(item);
    var totalStock = getTotalStock(item);
    if (totalStock !== undefined) {
      var threshold = item.stockThreshold || 1;
      var maxBar = Math.max(totalStock, threshold * 3);
      var pct = maxBar > 0 ? (totalStock / maxBar * 100) : 0;
      var barClass = stockBarClass(item, status);
      html += '<div style="margin-top:14px">';
      var packHintF = '';
      if (isSetPackMode(item) && item.variants && item.variants.length && (item.variants[0].packQty || 1) > 1) {
        var avgPqF = item.variants.reduce(function(s, v) { return s + (v.packQty || 1); }, 0) / item.variants.length;
        packHintF = '（约 ' + Math.floor(totalStock / avgPqF) + ' 套）';
      }
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:13px;color:var(--text-secondary)">库存</span><span style="font-weight:700">' + totalStock + mainPackUnit(item) + packHintF + '</span></div>';
      html += '<div class="stock-bar ' + barClass + '"><div class="stock-fill" style="width:' + pct + '%"></div></div>';
      html += '</div>';
    }
    if (status.daysLeft !== null) {
      var shelfColor = status.expired ? 'var(--red)' : (status.daysLeft <= 30 ? 'var(--red)' : (status.daysLeft <= 90 ? 'var(--orange)' : 'var(--green)'));
      html += '<div style="margin-top:10px;text-align:center;padding:10px;border-radius:8px;background:' + shelfColor + '15;color:' + shelfColor + ';font-weight:700">';
      if (status.expired) html += '⚠️ 已过期';
      else html += '⏰ 还有 ' + status.daysLeft + ' 天过期';
      html += '</div>';
    }
  } else {
    // 耐用品正面：件数（按 stock 汇总）+ 总金额
    var variantCount = (item.variants && item.variants.length) ? item.variants.reduce(function(s,v){ return s + (v.stock||1); }, 0) : 1;
    var variantTypes = (item.variants && item.variants.length) ? item.variants.length : 1;
    var totalPrice = calcDurableTotalPrice(item);
    html += '<div style="margin-top:14px;text-align:center;padding:16px;border-radius:10px;background:rgba(0,122,255,0.08);color:var(--accent);font-weight:700">';
    html += '共 ' + variantCount + ' 件' + (variantCount !== variantTypes ? ' · ' + variantTypes + '款' : '');
    html += '<div style="font-size:15px;margin-top:4px">总金额 ¥' + totalPrice.toFixed(2) + '</div>';
    html += '</div>';
    if (item.location) {
      html += '<div style="margin-top:8px;text-align:center;font-size:13px;color:var(--text-secondary)">📍 ' + escapeHtml(item.location) + '</div>';
    }
  }

  html += '<div class="detail-tap-hint">👆 点击翻面查看全部</div>';
  html += '</div></div>';
  document.getElementById('flip-front').innerHTML = html;
}

function renderCardBack(item, zone) {
  var html = '<div class="detail-back">';
  html += '<div class="back-header">';
  html += '<div class="back-title">' + escapeHtml(item.name) + consumeModelBadgeHtml(item) + '</div>';
  if (item.oneShot === true) {
    html += '<div style="display:inline-block;margin-left:8px;padding:2px 8px;border-radius:6px;background:rgba(255,149,0,0.12);color:var(--orange);font-size:12px;font-weight:600;vertical-align:middle">⚡ 开袋即用完</div>';
  }
  // 顶部快捷操作：⋯（编辑/归档/删除）+ 关闭，保持标题宽松不挤
  html += '<div style="display:flex;gap:6px;align-items:center">';
  html += '<button class="back-close" onclick="openItemActionsMenu(\'' + item.id + '\')" style="font-size:18px;font-weight:700">⋯</button>';
  html += '<button class="back-close" onclick="closeCardDetail()">✕</button>';
  html += '</div>';
  html += '</div>';

  // === 吸顶操作条（补给品：开封/补货/盘点，滚动时始终可见） ===
  if (zone.type === 'consumable') {
    var cModel = consumeModelOf(item);
    html += '<div class="sticky-actions">';
    if (cModel === 'instant') {
      // 模型③：纯打卡，主按钮 = 消耗一份（可反复点），副按钮 = 撤销一次
      html += '<button class="btn btn-primary btn-sm" style="flex:1.6" onclick="punchInstant(\'' + item.id + '\',\'' + instantTargetVariant(item) + '\')">✨ 消耗一份</button>';
      html += '<button class="btn btn-outline btn-sm" style="flex:1" onclick="unpunchInstant(\'' + item.id + '\',\'' + instantTargetVariant(item) + '\')">↩️ 撤销</button>';
      html += '<button class="btn btn-outline btn-sm" style="flex:1" onclick="openRestockForm(\'' + item.id + '\')">📦 补货</button>';
    } else {
      html += '<button class="btn btn-primary btn-sm" style="flex:1" onclick="openItem(\'' + item.id + '\')">🔓 开封</button>';
      html += '<button class="btn btn-outline btn-sm" style="flex:1" onclick="openRestockForm(\'' + item.id + '\')">📦 补货</button>';
      html += '<button class="btn btn-outline btn-sm" style="flex:1" onclick="openStockAuditForm(\'' + item.id + '\')">📦 盘点</button>';
    }
    html += '</div>';
    html += '<div style="margin:8px 0 2px"><button class="btn btn-outline btn-sm" style="width:100%;font-size:12px" onclick="taskFromItem(\'' + zone.id + '\',\'' + item.id + '\')">📋 加入待接委托（免手输，去填价格）</button></div>';
  }

  // === 基本信息 ===
  html += '<div class="back-section">';
  html += '<div class="back-section-title">基本信息</div>';
  // 补给品不再显示照片（用户决定：信息已足够明确，照片只在耐用品保留）
  html += '<div class="back-row"><span class="back-label">分类</span><span class="back-value">' + (getCategoryPath(zone.id, item.categoryId) || '未分类') + '</span></div>';
  if (item.location) html += '<div class="back-row"><span class="back-label">存放位置</span><span class="back-value">' + escapeHtml(item.location) + '</span></div>';
  if (item.notes && zone.type === 'consumable') html += '<div class="back-row"><span class="back-label">备注</span><span class="back-value">' + escapeHtml(item.notes) + '</span></div>';
  html += '</div>';

  // === 库存与价格 ===
  if (zone.type === 'consumable') {
    html += '<div class="back-section">';
    html += '<div class="back-section-title">库存与价格</div>';
    var totalStock = getTotalStock(item);
    if (totalStock !== undefined) html += '<div class="back-row"><span class="back-label">总库存</span><span class="back-value">' + stockSummaryOf(item) + '</span></div>';
    if (item.stockThreshold) html += '<div class="back-row"><span class="back-label">告急阈值</span><span class="back-value">' + item.stockThreshold + mainPackUnit(item) + '</span></div>';
    html += '</div>';

    // === 品牌变体（已用完/不再买的默认折叠，保持面板清爽）===
    if (item.variants && item.variants.length > 0) {
      var doneVs = item.variants.filter(function(v) { return isVariantDone(v, item) || v.noRestock; });
      var liveVs = item.variants.filter(function(v) { return !(isVariantDone(v, item) || v.noRestock); });
      var showDone = !!(window._showDoneVariants && window._showDoneVariants[item.id]);
      var listVs = showDone ? item.variants : liveVs;
      html += '<div class="back-section">';
      html += '<div class="back-section-title">品牌变体 (' + liveVs.length + '个在用' + (doneVs.length ? ' · 已藏' + doneVs.length + '个' : '') + ')</div>';
      listVs.forEach(function(v, vi) {
        var isUsing = v.opened && !v.usedUp;
        var isDone = isVariantDone(v, item);
        var cardCls = 'variant-card' + (isUsing ? ' vc-using' : (isDone ? ' vc-done' : '')) + (v.noRestock ? ' vc-norestock' : '');
        html += '<div class="' + cardCls + '">';
        // 头部：品牌名 + 状态徽章 + 不再买标记
        html += '<div class="vc-head">';
        html += '<div class="vc-brand">' + escapeHtml(v.brand || '未命名') + '</div>';
        if (v.noRestock) html += '<span class="vc-badge norestock">🚫 不再买</span>';
        else if (isUsing) html += '<span class="vc-badge using">使用中</span>';
        else if (isDone) html += '<span class="vc-badge done">已用完</span>';
        else if (variantSpecsOf(v).length || (v.stock || 0) > 0) html += '<span class="vc-badge" style="background:rgba(142,142,147,0.12);color:var(--text-secondary)">待开封</span>';
        html += '</div>';
        // 价格：总价为主数字，套餐构成作为副说明
        var cVTotal = v.totalPrice || 0;
        html += '<div class="vc-price-line">';
        html += '<span class="vc-price">¥' + cVTotal.toFixed(2) + '</span>';
        if (v.packCount) {
          html += '<span class="vc-price-note">' + v.packCount + ' 套 × ¥' + (v.packPrice || 0).toFixed(2) + '</span>';
        }
        html += '</div>';
        // 信息网格：折算单价 / 库存 / 库存构成 / 开封时间
        html += '<div class="vc-meta">';
        html += '<div class="vc-meta-item"><div class="vc-meta-label">折算单价</div><div class="vc-meta-value">' + variantPriceCompareText(v) + '</div></div>';
        html += '<div class="vc-meta-item"><div class="vc-meta-label">当前库存</div><div class="vc-meta-value">' + variantPackText(v, item) + '</div></div>';
        html += '<div class="vc-meta-item wide"><div class="vc-meta-label">库存构成</div><div class="vc-meta-value">' + escapeHtml(packHintOf(v, true)) + '</div></div>';
        var hasWeight = v.packWeight && v.packWeight > 0;
        var hasSpecs = variantSpecsOf(v).length > 0;
        if (hasSpecs) {
          // v1.7 双轨制：有明细时「单包容量 1ml」是迁移残留（packWeight=1），改显示均值/单份容量
          var avgP = variantAvgPiece(v);
          var u0v = variantSpecUnit(v);
          if (avgP > 0) {
            if (variantIsMixed(v)) {
              html += '<div class="vc-meta-item"><div class="vc-meta-label">均值单件</div><div class="vc-meta-value">' + trimNum(avgP) + ' ' + u0v + '/份</div></div>';
            } else {
              html += '<div class="vc-meta-item"><div class="vc-meta-label">单份容量</div><div class="vc-meta-value">' + trimNum(avgP) + ' ' + u0v + '</div></div>';
            }
          }
        } else if (hasWeight) {
          var wu = weightUnitOf(v);
          html += '<div class="vc-meta-item"><div class="vc-meta-label">单包容量</div><div class="vc-meta-value">' + round1(v.packWeight) + ' ' + wu + '</div></div>';
        }
        if (v.openDate) {
          var dateTxt;
          if (isDone && v.finishDate) {
            dateTxt = formatDate(v.openDate) + ' → ' + formatDate(v.finishDate) + '（' + daysBetween(new Date(v.openDate), new Date(v.finishDate)) + '天）';
          } else if (isDone) {
            dateTxt = formatDate(v.openDate) + ' 起';
          } else if (!isUsing && v.openDate) {
            // 「本份用完但还有剩余」：显示上一批的起止，而不是无限增长的「已用 X 天」
            var lastEndD = null;
            (item.usageRecords || []).forEach(function(r) { if (r.variantId === v.id && r.endDate) lastEndD = r.endDate; });
            dateTxt = lastEndD ? ('上批 ' + formatDate(v.openDate) + ' → ' + formatDate(lastEndD)) : (formatDate(v.openDate) + ' 起');
          } else {
            dateTxt = formatDate(v.openDate) + ' 起 · 已用 ' + daysBetween(new Date(v.openDate), new Date()) + ' 天';
          }
          html += '<div class="vc-meta-item' + (hasWeight ? '' : ' wide') + '"><div class="vc-meta-label">开封时间</div><div class="vc-meta-value">' + dateTxt + '</div></div>';
        }
        html += '</div>';
        // === 组合消耗型④：按子规格分行，每行可独立「开启新包 / 这包用完」===
        if (consumeModelOf(item) === 'combo' && variantSpecsOf(v).length && !isDone) {
          html += '<div style="margin-top:8px;border-top:1px dashed var(--separator);padding-top:8px">';
          variantSpecsOf(v).forEach(function (s) {
            var si = (v.specs || []).indexOf(s); // 原始下标（openOnePack 按 v.specs 解析）
            var packsRemain = specPacksRemaining(v, s), pqL = specPackQty(s), uL = s.unit || '';
            var nmL = s.name || ('规格' + (si + 1));
            var leftPieces = Math.round(packsRemain * pqL * 100) / 100;
            var perSetL = specPackCount(s);
            html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0">';
            html += '<div style="flex:1;min-width:0">';
            html += '<div style="font-size:13px;font-weight:600">' + escapeHtml(nmL) + '</div>';
            html += '<div style="font-size:11px;color:var(--text-secondary)">剩 ' + trimNum(leftPieces) + uL + '（' + trimNum(packsRemain) + '包未开' + (pqL !== 1 ? ' × ' + trimNum(pqL) + uL + '/包' : '') + ' · 单套 ' + trimNum(perSetL) + '包）</div>';
            html += '</div>';
            html += '<button class="btn btn-outline btn-sm" style="flex-shrink:0;font-size:11px;padding:5px 8px' + (packsRemain > 0 ? '' : ';opacity:.45') + '"' + (packsRemain > 0 ? '' : ' disabled') + ' onclick="openOnePack(\'' + item.id + '\',\'' + v.id + '\',' + si + ')">📦 开启新包</button>';
            html += '</div>';
          });
          html += '<button class="btn btn-outline btn-sm" style="width:100%;margin-top:6px;font-size:12px" onclick="confirmOpenCombo(\'' + item.id + '\',\'' + v.id + '\')">✅ 这包用完了</button>';
          html += '</div>';
        }
        // 使用感受：有任意内容就显示
        if (v.feeling && (v.feeling.rating || (v.feeling.tags && v.feeling.tags.length > 0) || v.feeling.notes)) {
          html += '<div class="vc-feel">';
          if (v.feeling.rating) {
            html += '<div class="vc-stars">';
            for (var fi = 1; fi <= 5; fi++) html += fi <= v.feeling.rating ? '⭐' : '☆';
            html += '</div>';
          }
          if (v.feeling.tags && v.feeling.tags.length > 0) {
            html += '<div class="vc-tags">' + v.feeling.tags.map(escapeHtml).join(' · ') + '</div>';
          }
          if (v.feeling.notes) {
            html += '<div class="vc-note">💬 ' + escapeHtml(v.feeling.notes) + '</div>';
          }
          html += '</div>';
        }
        // 操作：用完了/撤销 + 感受 + 不再买
        html += '<div class="vc-foot">';
        if (v.noRestock) {
          html += '<button class="btn btn-outline btn-sm" onclick="toggleVariantNoRestock(\'' + item.id + '\',\'' + v.id + '\')">↩️ 恢复回购</button>';
        } else {
          html += '<button class="btn btn-outline btn-sm" onclick="toggleVariantNoRestock(\'' + item.id + '\',\'' + v.id + '\')">🚫 不再买</button>';
        }
        if (isUsing) {
          html += '<button class="btn btn-outline btn-sm" onclick="finishVariant(\'' + item.id + '\',\'' + v.id + '\')">✅ 用完了</button>';
        } else if (isDone) {
          html += '<button class="btn btn-outline btn-sm" onclick="undoFinishVariant(\'' + item.id + '\',\'' + v.id + '\')">↩️ 撤销</button>';
        } else {
          // 「本份用完但还有剩余」的状态 → 可撤销回到使用中
          var hasEndedRec = (item.usageRecords || []).some(function(r) { return r.variantId === v.id && r.endDate; });
          if (hasEndedRec) html += '<button class="btn btn-outline btn-sm" onclick="undoFinishVariant(\'' + item.id + '\',\'' + v.id + '\')">↩️ 撤销</button>';
        }
        html += '<button class="btn btn-outline btn-sm" onclick="openVariantFeelingForm(\'' + item.id + '\',\'' + v.id + '\')">✏️ 感受</button>';
        html += '</div>';
        html += '</div>';
      });
      // 折叠行：已用完 / 不再买的品牌
      if (doneVs.length > 0) {
        html += '<div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(142,142,147,0.10);font-size:12px;color:var(--text-secondary);text-align:center;cursor:pointer" onclick="toggleDoneVariants(\'' + item.id + '\')">';
        html += showDone ? '🔼 收起已用完 / 不再买的 ' + doneVs.length + ' 个品牌' : '👁 已藏 ' + doneVs.length + ' 个用完 / 不再买的品牌 · 点开查看';
        html += '</div>';
      }
      html += '</div>';
    }

    // === 开封（多变体时按变体分别展示）===
    var hasMany = item.variants && item.variants.length > 1;
    html += '<div class="back-section">';
    html += '<div class="back-section-title">使用周期</div>';
    if (hasMany) {
      // 多变体：分别列出每个变体的状态
      var hasAnyActive = item.variants.some(function(v) { return v.opened && !v.usedUp; });
      var hasAnyFinished = item.variants.some(function(v) { return isVariantDone(v, item); });
      var allUnused = !hasAnyActive && !hasAnyFinished;
      // 每个变体的状态/日期/操作已集中在「品牌变体」卡片里，这里只留一句汇总，避免重复堆砌
      var cntUsing = item.variants.filter(function(v) { return v.opened && !v.usedUp; }).length;
      var cntDone = item.variants.filter(function(v) { return isVariantDone(v, item); }).length;
      if (allUnused) {
        html += '<div class="back-row"><span class="back-label" style="color:var(--text-tertiary)">全部未开封</span></div>';
      } else {
        var sumTxt = [];
        if (cntUsing > 0) sumTxt.push('<span style="color:var(--orange);font-weight:600">使用中 ' + cntUsing + ' 个</span>');
        if (cntDone > 0) sumTxt.push('<span style="color:var(--green);font-weight:600">已用完 ' + cntDone + ' 个</span>');
        html += '<div class="back-row"><span class="back-label">当前状态</span><span class="back-value" style="font-size:13px">' + sumTxt.join(' · ') + '</span></div>';
      }
    } else if (item.opened) {
      if (item.usedUp) {
        // 已用完
        html += '<div class="back-row"><span class="back-label">状态</span><span class="back-value" style="color:var(--green)">✓ 已用完</span></div>';
        if (item.openDate) html += '<div class="back-row"><span class="back-label">开始使用</span><span class="back-value">' + formatDate(item.openDate) + '</span></div>';
        if (item.finishDate) html += '<div class="back-row"><span class="back-label">用完日期</span><span class="back-value">' + formatDate(item.finishDate) + '</span></div>';
        if (item.openDate && item.finishDate) {
          var usedDays = daysBetween(new Date(item.openDate), new Date(item.finishDate));
          html += '<div class="back-row"><span class="back-label">耗时</span><span class="back-value">' + usedDays + '天</span></div>';
        }
        html += '<div style="display:flex;gap:8px;margin-top:8px">';
        html += '<button class="open-btn done" style="flex:1" onclick="openItem(\'' + item.id + '\')">🔓 开封下一个</button>';
        html += '<button class="btn btn-outline btn-sm" style="flex:0 0 auto" onclick="undoFinish(\'' + item.id + '\')">↩️ 撤销</button>';
        html += '</div>';
      } else {
        // 使用中
        html += '<div class="back-row"><span class="back-label">状态</span><span class="back-value" style="color:var(--orange)">使用中</span></div>';
        if (item.openDate) html += '<div class="back-row"><span class="back-label">开始使用</span><span class="back-value">' + formatDate(item.openDate) + '</span></div>';
        if (item.openQty) html += '<div class="back-row"><span class="back-label">开封数量</span><span class="back-value">' + item.openQty + (item.unit||'') + '</span></div>';
        var usingDays = daysBetween(new Date(item.openDate), new Date());
        html += '<div class="back-row"><span class="back-label">已使用</span><span class="back-value">' + usingDays + '天</span></div>';
        html += '<button class="open-btn" onclick="finishCurrentVariant(\'' + item.id + '\')">✅ 用完了</button>';
      }
    } else {
      var foodBtnText = (consumeModelOf(item) === 'instant') ? '✨ 消耗打卡' : '🔓 点击开封';
      // 还有剩余没在用的（多规格剩余 / 普通变体剩支）→ 显示待开封而非未开封
      var pendV = null;

          if (aq0 > 1) html += '<div class="back-row"><span class="back-label">年需求容量</span><span class="back-value">≈ ' + round1(rate*12*aq0) + escapeHtml(mainPackUnit(item)) + '/年</span></div>';

      var aqR = avgPackQtyOf(item);
      var shownRecs = item.usageRecords.map(function(r, oi) { return { r: r, oi: oi }; }).reverse().slice(0, 5);
      shownRecs.forEach(function(w) {

  // === 使用感受（仅补给品；耐用品每件有独立备注，不再显示此区） ===
  var hasMultipleVariants = item.variants && item.variants.length > 1 && zone.type === 'consumable';

      });

// ========== 全屏照片查看器 ==========
var _viewerPhotos = [];
var _viewerIndex = 0;
var _viewerScale = 1;
var _viewerStartX = 0;
var _viewerStartY = 0;
var _viewerLastDist = 0;

function openPhotoViewer(photos, index) {
  if (!photos || photos.length === 0) return;
  _viewerPhotos = photos;
  _viewerIndex = index || 0;
  _viewerScale = 1;

  var html = '<div class="photo-viewer" id="photoViewer">';
  html += '<button class="photo-viewer-close" onclick="closePhotoViewer()">✕</button>';
  html += '<img id="viewerImg" src="' + photos[_viewerIndex] + '">';
  if (photos.length > 1) {
    html += '<div class="photo-viewer-counter" id="viewerCounter">' + (_viewerIndex+1) + ' / ' + photos.length + '</div>';
  }
  html += '</div>';

  // 移除旧的
  var old = document.getElementById('photoViewer');
  if (old) old.remove();

  document.body.insertAdjacentHTML('beforeend', html);

  var img = document.getElementById('viewerImg');
  var viewer = document.getElementById('photoViewer');

  // 单击关闭
  viewer.addEventListener('click', function(e) {
    if (e.target === viewer) closePhotoViewer();
  });

  // 左右滑动切换
  var touchStartX = 0, touchStartY = 0, touchMoved = false;
  img.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchMoved = false;
    }
    if (e.touches.length === 2) {
      _viewerLastDist = getTouchDist(e);
    }
  }, { passive: true });

  img.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dist = getTouchDist(e);
      if (_viewerLastDist > 0) {
        _viewerScale = Math.max(0.5, Math.min(4, _viewerScale * (dist / _viewerLastDist)));
        img.style.transform = 'scale(' + _viewerScale + ')';
      }
      _viewerLastDist = dist;
    } else if (e.touches.length === 1 && _viewerScale <= 1) {
      var dx = e.touches[0].clientX - touchStartX;
      var dy = e.touches[0].clientY - touchStartY;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) touchMoved = true;
    }
  }, { passive: false });

  img.addEventListener('touchend', function(e) {
    if (_viewerScale > 1) return; // 缩放状态下不切换
    if (!touchMoved) return;
    var touch = e.changedTouches[0];
    var dx = touch.clientX - touchStartX;
    var dy = touch.clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0 && _viewerIndex > 0) {
        _viewerIndex--;
        updateViewerImg();
      } else if (dx < 0 && _viewerIndex < _viewerPhotos.length - 1) {
        _viewerIndex++;
        updateViewerImg();
      }
    }
    _viewerScale = 1;
    img.style.transform = 'scale(1)';
  }, { passive: true });
}

function getTouchDist(e) {
  var dx = e.touches[0].clientX - e.touches[1].clientX;
  var dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function updateViewerImg() {
  var img = document.getElementById('viewerImg');
  var counter = document.getElementById('viewerCounter');
  if (img) {
    img.src = _viewerPhotos[_viewerIndex];
    img.style.transform = 'scale(1)';
    _viewerScale = 1;
  }
  if (counter) counter.textContent = (_viewerIndex+1) + ' / ' + _viewerPhotos.length;
}

function closePhotoViewer() {
  var v = document.getElementById('photoViewer');
  if (v) v.remove();
}

// ========== 删除单件变体 ==========
// 详情页快速添加一件（耐用品）：直接向 item.variants 追加空件
function addVariantFromDetail(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  if (!item.variants) item.variants = [];
  item.variants.push({
    id: genId(),
    brand: '新增第' + (item.variants.length + 1) + '件',
    stock: 1,
    price: 0,
    channel: '',
    photos: [],
    notes: '',
    opened: false, openDate: null, finishDate: null,
    usedUp: false, openQty: 0, feeling: null,
    shelfLife: null, productionDate: null
  });
  syncDurableFromVariants(item);
  saveDB();
  renderCardBack(item, getZone(currentZoneId));
  renderZone();
  toast('已添加一件，点「✏ 编辑」可补照片和备注');
}

function deleteVariant(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item || !item.variants) return;
  var v = item.variants.find(function(v) { return v.id === variantId; });
  if (!v) return;
  var label = v.brand || '这件';
  if (item.variants.length <= 1) {
    // 最后一件
    if (confirm('这是最后一件「' + label + '」，删除后整个卡片将移除。确定？')) {
      var zone = getZone(currentZoneId);
      zone.items = zone.items.filter(function(it) { return it.id !== itemId; });
      saveDB();
      closeCardDetail();
      renderZone();
      toast('已删除');
    }
    return;
  }
  if (confirm('删除「' + label + '」？此操作不可撤销。')) {
    item.variants = item.variants.filter(function(v) { return v.id !== variantId; });
    var zone = getZone(currentZoneId);
    if (zone && zone.type !== 'consumable') {
      syncDurableFromVariants(item);
    } else {
      syncItemFromVariants(item);
    }
    saveDB();
    renderCardBack(item, zone);
    toast('已删除1件');
  }
}

// v1.7 强制归属迁移：给历史委托补父级物品 ID，给方案明细补「性质」默认值。
// 保守策略：只补空缺，绝不改写已有数据（旧变体历史不动）。
function migrateTaskParent() {
  var fixed = 0;
  (DB.tasks || []).forEach(function (t) {
    if (!t.sourceItemId) {
      var found = null;
      (t.plans || []).forEach(function (p) { if (!found && p && p.sourceItemId) found = p.sourceItemId; });
      if (found && findItemByIdGlobal(found)) { t.sourceItemId = found; fixed++; }
    }
    (t.plans || []).forEach(function (p) {
      if (!p) return;
      if (!p.sourceItemId && t.sourceItemId) p.sourceItemId = t.sourceItemId;
      (p.subItems || []).forEach(function (s) { if (!s.kind) s.kind = 'normal'; });
    });
  });
  return fixed;
}

// ========== 自动更新检查 ==========
// deploy.py 部署时会把 1791353332 替换为构建时间戳，并上传同目录 version.json
var APP_VERSION = '1791353332';

function checkAppUpdate(manual) {
  try {
    if (!APP_VERSION || APP_VERSION.indexOf('__BUILD') === 0) {
      if (manual) toast('当前为本地版本，无法检查更新');
      return;
    }
    if (manual) toast('🔍 正在检查更新…');
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        var remote = data && String(data.version || '');
        if (!remote) {
          if (manual) toast('检查失败，请检查网络');
          return;
        }
        if (remote === APP_VERSION) { // 版本一致，无需更新
          if (manual) toast('✅ 已是最新版本');
          return;
        }
        var key = 'jiayou_redirected_' + remote;
        if (sessionStorage.getItem(key)) { // 已为该版本跳转过，防循环
          if (manual) toast('已加载新版本，请关闭后重新打开');
          return;
        }
        sessionStorage.setItem(key, '1');
        toast('🔄 发现新版本，正在更新…');
        setTimeout(function() {
          // 带版本参数刷新，绕过 iOS PWA 的顽固缓存
          location.replace(location.pathname + '?v=' + remote + (location.hash || ''));
        }, 600);
      })
      .catch(function() {
        if (manual) toast('检查失败，请检查网络');
      });
  } catch(e) {}
}
// 每次切回前台（从后台唤醒 App）时静默检查一次
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) checkAppUpdate(false);
});

// 把构建时间戳转成可读的更新时间
function getAppVersionText() {
  if (!APP_VERSION || APP_VERSION.indexOf('__BUILD') === 0) return '本地开发版';
  var d = new Date(parseInt(APP_VERSION, 10) * 1000);
  if (isNaN(d.getTime())) return APP_VERSION;
  return formatDateTime(d.toISOString()) || APP_VERSION;
}

// ========== 开封 ==========
function openItem(itemId) {

    html += '</div>';

    spOpen.forEach(function (s) {

      var packsRemain = specPacksRemaining(v, s), pq = specPackQty(s), u = s.unit || '';
      var pieces = Math.round(packsRemain * pq * 100) / 100;

      if (isCombo) {

        html += '<button class="btn btn-outline btn-sm" style="flex-shrink:0" ' + (packsRemain > 0 ? '' : 'disabled') + ' onclick="openOnePack(\'' + itemId + '\',\'' + variantId + '\',' + k + ')">📦 开启新包</button>';

  // 套餐消耗：开一整套，用完再开下一整套

  html += '<div style="font-size:13px;color:var(--text-secondary)">库存：' + v.stock + (v.packUnit || mainPackUnit(item)) + '</div>';
  html += '</div>';
  html += '<div class="stepper" style="margin-bottom:16px">';
  html += '<button onclick="adjustOpenQty(-1)">−</button>';

  html += '<button onclick="adjustOpenQty(1)">＋</button>';
  html += '</div>';
  html += '<div class="form-group">';
  html += '<label class="form-label">开始使用日期</label>';
