// ========== 【第 24 轮】年报：大类折叠 + 跨年搜索 ==========
// 结构：第一层是「大类」（跨领地合并的折叠面板），默认全折叠；
//       展开后按年消耗降序；卡片只有四要素 —— 名称 / 年耗 / 单位容量单价 / 建议囤。
//       无闭环 → 右上角灰色「📭 缺数据」；已归档 → 「📦 已归档」并排到末尾。
//       顶部全局跨年搜索：多年数据加权平均（Σ消耗 ÷ Σ月份数 × 12）。
var reportFoldState = {};     // 大类折叠：{ catKey: true }；默认全折叠
var reportCrossQuery = '';    // 顶部跨年搜索词

function reportToggle(key) { reportFoldState[key] = !(reportFoldState[key] === false); renderReport(); }
function reportOnCrossSearch(v) { reportCrossQuery = String(v || ''); renderReport(); }
function reportClearCrossSearch() { reportCrossQuery = ''; renderReport(); }

// 【第 25 轮】年报只认补给品下的四大类，绝不再把「日用清洁·日用」「馋逼佬·宠物王国」
// 这种二级分类单独拆成一个面板 —— 一律并到它的一级大类底下，展开后直接列产品。
var MAIN_CATEGORIES = ['面子工程', '日用清洁', '馋逼佬', '休闲悦己'];
var ARCHIVED_KEY = 'cat___archived';

// 大类 key：分类路径的第一级（跨领地合并，同名大类算同一个）
function itemTopCategory(item, zone) {
  var p = (zone && item.categoryId) ? (getCategoryPath(zone.id, item.categoryId) || '') : '';
  // 分类路径形如「日用清洁 · 身体沐浴」或「馋逼佬 / 宠物王国」——一律取第一段
  var t = String(p).split(/\s*[·•/|]\s*/)[0] || '';
  t = String(t).trim();
  if (MAIN_CATEGORIES.indexOf(t) >= 0) return t;
  return t || '未分类';
}

// 卡片四要素：名称 / 年耗 / 单位容量单价 / 建议囤
function reportCardOf(it, zone) {
  var st = statsOf(it);
  var adv = buyAdviceOf(it);
  var upText = '';
  var best = cheapestVariantOf(it);
  if (best) upText = unitPriceTextOf(best.v);
  else if ((it.variants || []).length) upText = unitPriceTextOf(it.variants[0]);
  var noData = !!(st && st.noClosedData);
  return {
    itemId: it.id, zoneId: zone.id,
    zoneName: zone.name, zoneIcon: zone.icon || '📦',
    name: it.name || '',
    unit: st ? st.unit : mainPackUnit(it),
    perYear: noData ? null : st.perYearRaw,
    perYearQty: noData ? null : st.perYearQty,
    restNow: st ? st.restNow : 0,
    yearText: dualUnitText(st ? st.perYearRaw : 0, it),      // 「22.7包（约113.6kg）」
    restText: restTextOf(it),                                // 当前剩余（件数为主，容量类并列容量）
    monthsLeft: st ? st.monthsLeft : null,
    unitPriceText: upText,
    adviceText: adv ? String(adv.main || '').replace(/<[^>]+>/g, '') : '',
    adviceDetail: adv ? adv.detail : null,
    noData: noData,
    archived: !!it.archived
  };
}

function buildCategoryReport() {
  var out = {
    empty: true, emptyReason: '', asOf: new Date(),
    cats: [], counts: { items: 0, noData: 0, archived: 0, cats: 0 }
  };
  // 四大类常驻（顺序固定），已归档单独一组，其余（未命中四大类的）追加到末尾
  var map = {}, order = MAIN_CATEGORIES.slice();
  order.forEach(function (k) { map[k] = { key: 'cat_' + k, title: k, rows: [] }; });
  var archivedRows = [];
  DB.zones.forEach(function (zone) {
    if (zone.type !== 'consumable') return;
    (zone.items || []).forEach(function (it) {
      out.counts.items++;
      if (it.archived) { archivedRows.push(reportCardOf(it, zone)); out.counts.archived++; return; }
      var top = itemTopCategory(it, zone);
      if (!map[top]) { map[top] = { key: 'cat_' + top, title: top, rows: [] }; order.push(top); }
      map[top].rows.push(reportCardOf(it, zone));
    });
  });
  out.cats = order.map(function (k) { return map[k]; })
    .filter(function (c) { return MAIN_CATEGORIES.indexOf(c.title) >= 0 || c.rows.length > 0; });
  if (archivedRows.length) {
    out.cats.push({ key: ARCHIVED_KEY, title: '已归档', rows: archivedRows, archived: true });
  }
  out.cats.forEach(function (c) {
    c.noDataCount = c.rows.filter(function (r) { return r.noData; }).length;
    c.rows.sort(function (a, b) {
      if (a.archived !== b.archived) return a.archived ? 1 : -1;   // 已归档排末尾
      if (a.noData !== b.noData) return a.noData ? 1 : -1;         // 缺数据排末尾
      return (b.perYear || 0) - (a.perYear || 0);                  // 年耗降序
    });
  });
  // 大类之间：按「有数据的条目数」降序，其次按年耗合计降序
  out.cats.forEach(function (c) {
    c.sumYear = c.rows.reduce(function (s, r) { return s + (r.perYear || 0); }, 0);
    c.dataCount = c.rows.filter(function (r) { return !r.noData; }).length;
  });
  out.cats.sort(function (a, b) {
    if (!!a.archived !== !!b.archived) return a.archived ? 1 : -1;   // 「已归档」永远排最后
    var ia = MAIN_CATEGORIES.indexOf(a.title), ib = MAIN_CATEGORIES.indexOf(b.title);
    if (ia >= 0 && ib >= 0) return ia - ib;                          // 四大类顺序固定：面子工程→日用清洁→馋逼佬→休闲悦己
    if (ia >= 0) return -1;                                          // 四大类排在其他分类之前
    if (ib >= 0) return 1;
    if (a.dataCount !== b.dataCount) return b.dataCount - a.dataCount;
    return b.sumYear - a.sumYear;
  });
  out.counts.cats = out.cats.length;
  out.counts.noData = out.cats.reduce(function (s, c) { return s + c.noDataCount; }, 0);
  out.empty = out.cats.length === 0;
  if (out.empty) out.emptyReason = '还没有消耗品。先在领地里加几件日用消耗品吧。';
  return out;
}

// 跨年搜索：多年数据加权平均年耗 = Σ各年消耗 ÷ Σ各年覆盖月份数 × 12
function crossYearStats(query) {
  var res = [];
  var rawQ = String(query || '').trim();
  if (!rawQ) return res;
  DB.zones.forEach(function (zone) {
    if (zone.type !== 'consumable') return;
    (zone.items || []).forEach(function (it) {
      var m = matchItem(it, zone, rawQ);
      if (!m) return;
      var sumQ = 0, sumM = 0, years = [];
      Object.keys(DB.yearStats || {}).forEach(function (y) {
        (((DB.yearStats[y] || {}).items) || []).forEach(function (e) {
          if (!e || e.itemId !== it.id) return;
          var q = parseFloat(e.qty) || 0;
          if (!(q > 0)) return;
          var times = parseFloat(e.times) || 0;
          var avgD = parseFloat(e.avgDays) || 0;
          var months = (times > 0 && avgD > 0) ? (times * avgD / R24_DAYS_PER_MONTH) : 0;
          if (!(months > 0)) months = 1;                 // 兜底：至少记 1 个月
          sumQ += q; sumM += months;
          years.push({ year: y, qty: Math.round(q * 10) / 10, unit: e.unit || '', months: Math.round(months * 10) / 10 });
        });
      });
      // 当年（还没固化）也纳入：用当前闭环记录
      var st = statsOf(it);
      var unit = st ? st.unit : mainPackUnit(it);
      if (st && !st.noClosedData && st.months > 0) {
        var curY = String(new Date().getFullYear());
        var exists = years.some(function (x) { return x.year === curY; });
        if (!exists) {
          sumQ += st.perMonth * st.months;
          sumM += st.months;
          years.push({ year: curY, qty: Math.round(st.perMonth * st.months * 10) / 10, unit: unit, months: Math.round(st.months * 10) / 10 });
        }
      }
      years.sort(function (a, b) { return Number(a.year) - Number(b.year); });
      res.push({
        item: it, zone: zone, level: m.level, via: m.via,
        years: years,
        totalQty: Math.round(sumQ * 100) / 100,
        totalMonths: Math.round(sumM * 10) / 10,
        avgPerYear: sumM > 0 ? (sumQ / sumM * R24_MONTHS_PER_YEAR) : null,
        unit: unit
      });
    });
  });
  res.sort(function (a, b) { return (b.avgPerYear || -1) - (a.avgPerYear || -1); });
  return res;
}

// ========== 数据导入导出 ==========
// 备份自检结果缓存（每次大更新后应保持「正常」，一旦失效说明导出/导入链路被破坏）
var backupCheckResult = '';
// 数据指纹：用「物品数 / 记录数 / 委托数」的轻量统计代替逐字节比较，
// 用于「导出→导入」往返自检时判断内容是否一致。
function dbFingerprint(db) {
  var zones = (db && db.zones) || [];
  var items = 0, records = 0, tasks = ((db && db.tasks) || []).length;
  zones.forEach(function (z) {
    (z.items || []).forEach(function (it) {
      items++;
      records += ((it.usageRecords || []).length);
    });
  });
  return { items: items, records: records, tasks: tasks };
}
function fingerprintsDiffer(a, b) {
  if (!a || !b) return true;
  return a.items !== b.items || a.records !== b.records || a.tasks !== b.tasks;
}
// 不影响真实数据的往返自检：序列化当前 DB → 反序列化 → 跑一遍 mergeDB → 比对指纹。
// 不写库，纯粹验证「导出/导入」这条保命链路是否完好。
function runBackupSelfCheck() {
  try {
    var json = JSON.stringify(DB);
    var back = JSON.parse(json);
    if (!back || !back.zones) { backupCheckResult = '❌ 异常：数据结构不完整'; toast('备份自检未通过，请立即导出并反馈'); renderSettings(); return false; }
    var merged = mergeDB({ zones: [], tasks: [], settings: {}, version: 1 }, back);
    var a = dbFingerprint(DB), b = dbFingerprint(merged);
    var ok = !fingerprintsDiffer(a, b);
    var sizeKB = Math.round(json.length / 1024);
    backupCheckResult = ok ? ('✅ 正常 · ' + sizeKB + 'KB') : '⚠️ 往返后有差异，请谨慎';
    toast(ok ? '🛡️ 备份链路正常（' + sizeKB + 'KB）' : '⚠️ 备份自检发现差异');
    renderSettings();
    return ok;
  } catch (e) {
    backupCheckResult = '❌ 失败：' + (e.message || e);
    toast('备份自检失败：' + (e.message || e));
    renderSettings();
    return false;
  }
}

function exportJSON() {

function importJSON(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.zones) { toast('文件格式不对'); return; }
      // 先解析好数据，再确认导入（避免confirm在异步回调中的问题）
      var newDB = mergeDB({
        zones: [], tasks: [],
        settings: {},
        version: 1
      }, data);
      // 直接导入，不再用confirm阻塞
      DB = newDB;
      saveDB();
      // 验证存储是否成功
      var saved = localStorage.getItem('jiayou_db');
      if (saved) {
        showPage('home');
        toast('导入成功，共' + (DB.zones||[]).length + '个领地');
      } else {
        toast('存储失败，请重试');
      }
    } catch(err) {
      console.error('导入失败:', err);
      toast('文件解析失败: ' + err.message);
    }
  };
  reader.onerror = function() {
    toast('文件读取失败');
  };
  reader.readAsText(file);
}

// ========== 工具函数 ==========
function daysBetween(d1, d2) {
  return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

function formatDateTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// 图片压缩
function compressImage(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxDim = 800;
      var w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = h * maxDim / w; w = maxDim; }
        else { w = w * maxDim / h; h = maxDim; }
      }
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

  } else if (type === 'stockpile') {
    title = '📦 囤货区（买了未开封）';
    DB.zones.forEach(function(zone) {
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).allUnopened) items.push({item: it, zone: zone});
      });
    });
  }

  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">' + title + '</div>';
  if (items.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">✓</div><div class="empty-text">没有需要关注的</div></div>';
  } else {
    if (type === 'stockpile') {
      items.sort(function(a, b) { return a.zone.name.localeCompare(b.zone.name); });
    }
    html += '<div style="margin-bottom:16px;font-size:13px;color:var(--text-secondary)">共 ' + items.length + ' 件</div>';
    var lastZone = null;
    var zoneCount = {};
    if (type === 'stockpile') {
      items.forEach(function(e) { zoneCount[e.zone.name] = (zoneCount[e.zone.name] || 0) + 1; });
    }
    items.forEach(function(entry) {
      var it = entry.item, zone = entry.zone;
      var status = getItemStatus(it);
      if (type === 'stockpile' && zone.name !== lastZone) {
        html += '<div style="font-weight:700;font-size:14px;margin:14px 0 6px;color:var(--text)">' + zone.icon + ' ' + escapeHtml(zone.name) + ' · ' + zoneCount[zone.name] + '件未开封</div>';
        lastZone = zone.name;
      }
      var bgColor = '#fff';
      if (type === 'expired') bgColor = 'rgba(255,59,48,0.06)';
      else if (type === 'expiring') bgColor = 'rgba(255,149,0,0.06)';
      else if (type === 'lowStock') bgColor = 'rgba(255,149,0,0.06)';
      else if (type === 'lowStockSoft') bgColor = 'rgba(90,200,250,0.06)';
      else if (type === 'stockUp') bgColor = 'rgba(175,82,222,0.06)';
      else if (type === 'stockpile') bgColor = 'rgba(142,142,147,0.06)';

      html += '<div style="display:flex;gap:10px;padding:12px;border-radius:10px;background:' + bgColor + ';margin-bottom:8px;cursor:pointer" onclick="closeModal();setTimeout(function(){enterZone(\'' + zone.id + '\')},200)">';
      // 照片
      html += '<div style="width:50px;height:50px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px">';
      if (it.photos && it.photos.length > 0) {
        html += '<img src="' + it.photos[0] + '" style="width:100%;height:100%;object-fit:cover">';
      } else {
        html += '📦';
      }
      html += '</div>';
      // 信息
      html += '<div style="flex:1;min-width:0">';
      html += '<div style="font-weight:700;font-size:15px">' + escapeHtml(it.name) + (it.oneShot ? ' <span style="font-size:11px;color:#fff;background:rgba(255,149,0,0.92);padding:1px 6px;border-radius:6px;font-weight:600;vertical-align:middle">⚡即用完</span>' : '') + '</div>';
      html += '<div style="font-size:12px;color:var(--text-secondary)">' + zone.icon + ' ' + escapeHtml(zone.name) + '</div>';
      if (type === 'expired') {
        html += '<div style="font-size:13px;color:var(--red);font-weight:600;margin-top:2px">⚠️ 已过期' + (status.daysLeft!==null?'（超期'+Math.abs(status.daysLeft)+'天）':'') + '</div>';
      } else if (type === 'expiring') {
        html += '<div style="font-size:13px;color:var(--orange);font-weight:600;margin-top:2px">⏰ 还剩 ' + status.daysLeft + ' 天过期</div>';
      } else if (type === 'lowStock') {
        var lowPack = '';
        if (isSetPackMode(it) && it.variants && it.variants.length && (it.variants[0].packQty || 1) > 1) {
          var totS = getTotalStock(it);
          lowPack = '（约 ' + Math.floor(totS / Math.max(1, it.variants[0].packQty)) + ' 套）';
        }
        html += '<div style="font-size:13px;color:var(--orange);font-weight:600;margin-top:2px">📦 库存仅剩 ' + getTotalStock(it) + mainPackUnit(it) + lowPack + '（告急阈值' + (it.stockThreshold||1) + '）</div>';
      } else if (type === 'lowStockSoft') {
        var est = status.estDaysLeft;
        html += '<div style="font-size:13px;color:var(--blue);font-weight:600;margin-top:2px">⏳ 预计 ' + (est!==null?est:'?') + ' 天内用完</div>';
      } else if (type === 'stockUp') {
        var ml = status.monthsLeft;
        var estS = status.estDaysLeft;
        html += '<div style="font-size:13px;color:var(--purple);font-weight:600;margin-top:2px">🛒 约够用 ' + (ml!==null?ml:'?') + ' 个月' + (estS!==null&&estS!==undefined?'（'+estS+' 天）':'') + '，撑不到下次采购</div>';
      } else if (type === 'inUse') {
        var activeBrands = (it.variants||[]).filter(function(v){ return v.opened && !v.usedUp; }).map(function(v){ return v.brand||'未命名'; });
        html += '<div style="font-size:13px;color:var(--green);font-weight:600;margin-top:2px">🔓 使用中：' + (activeBrands.join('、') || '—') + '</div>';
      } else if (type === 'stockpile') {
        var totalS = getTotalStock(it);
        html += '<div style="font-size:13px;color:var(--text-secondary);font-weight:600;margin-top:2px">📦 库存 ' + (totalS||0) + mainPackUnit(it) + ' · 未开封</div>';
      }
      html += '</div>';
      html += '<button class="btn btn-outline btn-sm" style="flex-shrink:0;align-self:center;font-size:12px;padding:6px 10px" onclick="event.stopPropagation();taskFromItem(\'' + zone.id + '\',\'' + it.id + '\')">📋 委托</button>';
      html += '</div>';
    });
  }
  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">关闭</button>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

// ========== 首页过滤快捷（改为弹窗显示详情）==========
function filterExpired() { showAlertDetail('expired'); }
function filterExpiring() { showAlertDetail('expiring'); }
function filterLowStock() { showAlertDetail('lowStock'); }
function filterLowStockSoft() { showAlertDetail('lowStockSoft'); }
function filterStockUp() { showAlertDetail('stockUp'); }
function filterInUse() { showAlertDetail('inUse'); }
function filterStockpile() { showAlertDetail('stockpile'); }
</script>
</body>
</html>
