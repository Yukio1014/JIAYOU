// ---------- 卡片 ----------
function taskCard(t) {
  var s = taskState;
  var selMode = !!s.sel;
  var selected = selMode && s.sel.has(t.id);
  var html = '<div class="pool-item task-card' + (selected ? ' selon' : '') + '" data-task-id="' + t.id + '" onclick="taskCardTap(\'' + t.id + '\')">';

  // 头部：标题 + 状态标签
  html += '<div class="pool-header">';
  if (selMode) {
    html += '<div class="task-check" onclick="event.stopPropagation();taskSelToggle(\'' + t.id + '\')">' + (selected ? '✓' : '') + '</div>';
  }
  var title = escTask(t.name);
  if (t.status === '进行中') { var buyCnt = (t.plans || []).filter(function (p) { return p.buy !== false; }).length; if (buyCnt > 0) title += '（采购 ' + buyCnt + ' 项）'; }
  html += '<div style="flex:1;min-width:0"><div class="pool-name">' + title + '</div>';
  var meta = '';
  if (t.zoneId) { var zone = getZone(t.zoneId); if (zone) meta += zone.icon + ' ' + zone.name; }
  if (t.categoryId) { var cp = getCategoryPath(t.zoneId, t.categoryId); if (cp) meta += ' · ' + cp; }
  if (t.createdAt) meta += ' · ' + t.createdAt;
  if (meta) html += '<div class="pool-meta">' + meta + '</div>';
  html += '</div>';
  var stCls = t.status === '待接' ? 'status-pending' : (t.status === '进行中' ? 'status-decided' : (t.status === '凯旋' ? 'status-win' : 'status-given-up'));
  var stTxt = t.status === '待接' ? '待接' : (t.status === '进行中' ? '进行中' : (t.status === '凯旋' ? '凯旋' : '搁置'));
  html += '<span class="pool-status ' + stCls + '">' + stTxt + '</span>';
  html += '</div>';

  // 价格 / 重量行
  if (t.status === '进行中' || t.status === '凯旋') {
    var lpw = taskWeightStr(t);
    var lpAmt = t.lockedPlanId ? findPlan(t, t.lockedPlanId) : null;
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">💰 赏金 ' + (lpAmt ? fmtMoney(lpAmt.amount) : '') + (lpw ? ' · ' + lpw : '') + '</div>';
  } else if (t.status === '搁置') {
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">💰 放下省下 ' + fmtMoney(planMin(t)) + '</div>';
  } else {
    var w = taskWeightStr(t);
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">' + taskPriceLabel(t) + (w ? ' · ' + w : '') + '</div>';
    var pn = (t.plans || []).length;
    if (pn > 1) {
      var buyN = 0, selAmt = 0;
      (t.plans || []).forEach(function (p) { if (p.buy !== false) { buyN++; selAmt += (+p.amount || 0); } });
      html += '<div style="font-size:12px;font-weight:700;margin-top:4px;color:' + (buyN ? 'var(--accent)' : 'var(--red)') + '">☑️ 已选 ' + buyN + '/' + pn + ' 项采购 · 合计 ' + fmtMoney(selAmt) + (buyN ? '' : '（出击前请勾选要买的）') + '</div>';
    }
  }

  // 备注
  if (t.note) html += '<div class="pool-meta" style="margin-top:6px;color:var(--text-secondary)">' + escTask(t.note) + '</div>';

  // 同类库存提醒（保留特色）
  html += taskStockWarn(t);

  // 任务级照片（旧数据迁移带过来的）
  if (t.photos && t.photos.length) {
    html += '<div style="display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none">';
    t.photos.forEach(function (ph) { html += '<img src="' + ph + '" style="width:54px;height:54px;border-radius:8px;object-fit:cover;flex-shrink:0">'; });
    html += '</div>';
  }

  // 翻面提示
  if (!selMode && t.plans && t.plans.length > 0) {

    else if (d.unitPrice > 0) line += ' · ≈' + fmtMoney(d.unitPrice) + '/' + (p.unit || '');
    if (p.note) line += ' · ' + escTask(p.note);
    html += '<div class="task-plan-row">';

    else html += '<div style="width:46px;height:46px;border-radius:8px;background:var(--separator);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px">📷</div>';
    html += '<div style="flex:1;min-width:0"><div class="pp-name">' + escTask(p.name || '未命名') + ' <span style="font-size:11px;font-weight:600;color:var(--text-secondary)">' + mark + '</span>' + planBuyChip(t, p) + (p.sourceVariantId ? ' <span style="font-size:11px;color:var(--accent)">↩库存</span>' : (p.sourceItemId ? ' <span style="font-size:11px;color:var(--accent)">↩新品</span>' : '')) + '</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px">' + line + '</div></div>';
    html += '</div>';
  });
  html += '</div></div>';

  html += '</div>';
  return html;
}

function taskStockWarn(t) {
  if (!t.zoneId) return '';
  var zone = getZone(t.zoneId); if (!zone) return '';
  var tName = String(t.name || '').trim().toLowerCase();
  if (!tName) return '';
  // 「同类」以产品本身为准：任务方案关联的物品，或物品名与任务名一致。
  // 不按分类聚合——宠物王国里的猫砂/零食/保健品替代不了猫粮，混在一起提示毫无意义
  var linkedItemIds = {};
  (t.plans || []).forEach(function (p) {
    if (p.sourceItemId) linkedItemIds[p.sourceItemId] = true;
    if (p.sourceVariantId) {
      zone.items.forEach(function (it) {
        if ((it.variants || []).some(function (v) { return v.id === p.sourceVariantId; })) linkedItemIds[it.id] = true;
      });
    }
  });
  var existing = zone.items.filter(function (it) {
    if (it.archived) return false;
    return linkedItemIds[it.id] || String(it.name || '').trim().toLowerCase() === tName;
  });
  if (existing.length > 0) {
    if (zone.type === 'durable') return '<div class="pool-warn">⚠️ 你已经有 ' + existing.length + ' 件「' + escTask(t.name) + '」了，确定要买吗？</div>';
    var parts = existing.slice(0, 3).map(function (it) { return it.name + ' ' + stockSummaryOf(it); });
    var more = existing.length > 3 ? ' 等 ' + existing.length + ' 种' : '';
    return '<div class="pool-warn">⚠️ 已有库存：' + escTask(parts.join('、')) + more + '</div>';
  }
  return '<div class="pool-ok">✓ 该产品暂无库存，可以买</div>';
}

    sortPlans(t).forEach(function (p) {

      if (p.note) line += ' · ' + escTask(p.note);
      html += '<label class="strike-plan' + (on ? ' on' : '') + '"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="strikeTogglePlan(\'' + t.id + '\',\'' + p.id + '\',this.checked)">';
      html += '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">' + escTask(p.name || '未命名') + (p.sourceVariantId ? ' <span style="font-size:11px;color:var(--accent)">↩库存</span>' : (p.sourceItemId ? ' <span style="font-size:11px;color:var(--accent)">↩新品</span>' : '')) + '</div><div style="font-size:12px;color:var(--text-secondary);margin-top:2px">' + line + '</div></div></label>';

function confirmStrike() {
  if (!_strikeSel) return;
  var tasks = _strikeSel.tasks.map(taskById).filter(Boolean);
  var struck = 0, skipped = 0;
  tasks.forEach(function (t) {
    var buys = [];
    (t.plans || []).forEach(function (p) {
      var on = !!_strikeSel.buy[t.id + '|' + p.id];
      p.buy = on;
      if (on) buys.push(p);
    });
    if (!buys.length) { skipped++; return; }
    t.status = '进行中';
    buys.forEach(function (p) { p.status = 'purchasing'; });
    struck++;
  });
  _strikeSel = null;
  if (!struck) { toast('至少为一个委托勾选要买的方案'); return; }
  closeModal(); saveDB(); renderTasks();
  toast('⚔️ 出击 ' + struck + ' 项' + (skipped ? '，' + skipped + ' 项未勾选保持待接' : ''));
  taskHaptic();
}

function findItemByIdGlobal(itemId) {
  for (var zi = 0; zi < DB.zones.length; zi++) {
    var z = DB.zones[zi];
    for (var ii = 0; ii < (z.items || []).length; ii++) {
      if (z.items[ii].id === itemId) return z.items[ii];
    }
  }
  return null;
}

// v1.7：旧的 doWin / winMultiSpec（会「凭空建独立物品」）已被 doWinSettle 全面取代。
// ===== v1.7 凯旋回填：智能归位（不覆盖，只新增）=====
// 铁律：
//   ① 只在父级物品（仓库）下操作，绝不新建独立物品；
//   ② 品牌名匹配到已有变体 → 合并；匹配不到 → 在父级下新建货架；
//   ③ 旧变体（哪怕库存为 0）的历史数据一字不动；
//   ④ 价格只写「实付金额」与价格历史，绝不参与库存数量/消耗计算。
function doWinSettle(ws) {
  var rows = ws.rows || [];
  var createdVariants = 0, mergedVariants = 0;
  // 按 任务|方案|目标变体 聚合：同一方案的多条明细（正装/替换装/赠品）落到同一个变体的 specs 里
  var groups = {};
  rows.forEach(function (r) {
    var gk = r.taskId + '|' + r.planId + '|' + (r.targetVariantId || r._defaultTarget || '__new__');
    if (!groups[gk]) {
      groups[gk] = {
        taskId: r.taskId, planId: r.planId, parentId: r.parentId,
        targetVariantId: r.targetVariantId || r._defaultTarget || '__new__',
        rows: [], amount: Math.round((+r.amount || 0) * 100) / 100,
        comboPrice: r.comboPrice || 0, brand: r.name
      };
    }
    groups[gk].rows.push(r);
  });
  Object.keys(groups).forEach(function (gk) {
    var g = groups[gk];
    g.brand = g.rows[0].name;
  });

  Object.keys(groups).forEach(function (gk) {
    var g = groups[gk];
    // ① 父级物品（仓库）必须存在 —— 否则跳过（绝不凭空建物品）
    var item = findItemByIdGlobal(g.parentId);
    if (!item) return;
    if (!item.variants) item.variants = [];

    // ② 确定目标变体：显式指定 > 品牌名匹配 > 新建
    var v = null;
    if (g.targetVariantId && g.targetVariantId !== '__new__') {
      item.variants.forEach(function (x) { if (x.id === g.targetVariantId) v = x; });
    }
    if (!v) v = findVariantByName(item, g.brand);
    var isNewVariant = false;
    if (!v) {
      // 新建货架：初始为空，明细与库存随后填入（不碰任何旧变体）
      v = {
        id: genId(), brand: g.brand || '新品牌',
        packCount: 0, packPrice: 0, packQty: 1, packUnit: (g.rows[0].unit || '个'),
        packWeight: 0, packWeightUnit: 'kg',
        specs: [], stock: 0, price: 0, totalPrice: 0,
        photos: [], notes: '', opened: false, usedUp: false, openQty: 0,
        feeling: null, shelfLife: null, productionDate: null,
        createdAt: new Date().toISOString()
      };
      item.variants.push(v);
      isNewVariant = true;
      createdVariants++;
    } else {
      mergedVariants++;
    }

    // ③ 本次到货明细 → 该变体的「单套构成」specs（v1.6 语义）
    //    本次凯旋 = 又买了 1 套（含若干件）：明细按实际写，套餐数 +1
    if (!v.specs) v.specs = [];
    var u0 = g.rows[0].unit || '';
    g.rows.forEach(function (r) {
      var cnt = +r.actCount || 0, sp = +r.actSpec || 0;
      if (!(cnt > 0)) return;
      // 同一变体内，按「名称+性质」视为同一规格（避免重复堆行）
      var hit = null;
      v.specs.forEach(function (s) {
        if (hit) return;
        if (String(s.name || '').trim() === String(r.name || '').trim() && specKindOf(s) === r.kind) hit = s;
      });
      if (hit) {
        hit.packCount = Math.round(((+hit.packCount || 0) + cnt) * 100) / 100;
        hit.packQty = sp;
        if (!hit.unit) hit.unit = r.unit || '';
        hit.kind = r.kind;
        hit.qty = Math.round((+hit.packCount || 0) * sp * 100) / 100;
      } else {
        v.specs.push({
          id: genId(), name: r.name, kind: r.kind,
          packCount: cnt,                       // 单套内该规格件数
          packQty: sp,                          // 每件容量
          content: 1,                           // 每份规格（默认 1）
          unit: r.unit || '',
          qty: Math.round(cnt * sp * 100) / 100,
          openPacks: 0
        });
      }
    });
    // 套餐数 +1（本次买到 1 套）；构成永不被折算写回
    v.packCount = Math.round(((+v.packCount || 0) + 1) * 100) / 100;
    if (u0) v.packUnit = u0;
    var firstUnit = (v.specs[0] && v.specs[0].unit) || '';
    if (firstUnit) v.packWeightUnit = firstUnit;
    var perSetPieces = variantSpecPerSetPieces(v);
    if (perSetPieces > 0) v.packQty = perSetPieces;
    // 库存 = Σ 剩余包数 × 每包含量 × 每份规格（自动含本次新增）
    v.stock = variantSpecStockCalc(v);
    if (v.stock > 0) { v.usedUp = false; v.finishDate = null; }
    delete v.noRestock;   // 又买回来了 → 恢复计入补货提醒
    // ④ 价格只记账
    var amt = Math.round((+g.amount || 0) * 100) / 100;
    if (amt > 0) {
      v.totalPrice = Math.round(((+v.totalPrice || 0) + amt) * 100) / 100;
      if (g.comboPrice > 0) v.packPrice = g.comboPrice;
      v.price = v.stock > 0 ? Math.round((v.totalPrice / v.stock) * 100) / 100 : (v.price || 0);
    }
    // ⑤ 价格历史（含完整明细文字）
    if (!item.priceHistory) item.priceHistory = [];
    var specTxt = v.specs.map(function (s) {
      return specKindIcon(specKindOf(s)) + (s.name || '') + '×' + trimNum(s.packCount) + (s.unit || '');
    }).join(' + ');
    item.priceHistory.push({
      date: new Date().toISOString(), channel: '', quantity: 1,
      totalPrice: amt, unitPrice: 0,
      notes: '任务委托·凯旋结算' + (isNewVariant ? '（新建货架 ' + v.brand + '）' : '（并入货架 ' + v.brand + '）') + '：' + specTxt,
      brand: v.brand || '', attachments: []
    });
    // ⑥ 物品级汇总（其它变体不受影响）
    syncItemFromVariants(item);
    item.currentPrice = (item.variants || []).reduce(function (s, x) {
      return s + (x.totalPrice || ((x.price || 0) * (x.stock || 0)));
    }, 0);
  });

  // ⑦ 实付金额覆盖（仅记账，不影响库存数量）
  if (ws.amountOverride !== undefined && ws.amountOverride !== null && ws.amountOverride !== '') {
    Object.keys(groups).forEach(function (gk) {
      var g = groups[gk];
      var it = findItemByIdGlobal(g.parentId);
      if (!it || !it.priceHistory || !it.priceHistory.length) return;
      var last = it.priceHistory[it.priceHistory.length - 1];
      last.totalPrice = Math.round((parseFloat(ws.amountOverride) || 0) * 100) / 100;
      last.notes += '（实付 ' + trimNum(parseFloat(ws.amountOverride) || 0) + '）';
    });
  }

  // ⑧ 任务状态流转
  (ws.taskIds || []).forEach(function (tid) {
    var t = taskById(tid);
    if (!t) return;
    t.status = '凯旋';
    t.lockedPlanId = null;
    (t.plans || []).forEach(function (p) { if (p.buy !== false) p.status = 'done'; });
  });

  var sum = '';

// 一键把已有物品「复制成待接委托」：免手输，进去再补套餐数/价格，凯旋后自动回写库存
function taskFromItem(zoneId, itemId, skipJump) {
  var zone = getZone(zoneId);
  if (!zone) { toast('领地不存在'); return; }
  var item = null;
  for (var i = 0; i < (zone.items || []).length; i++) {
    if (zone.items[i].id === itemId) { item = zone.items[i]; break; }
  }
  if (!item) { toast('物品不存在'); return; }
  // 已有未完成的同物品委托 → 不重复建，直接跳转
  var exist = null;
  DB.tasks.forEach(function (t) {
    if (t.sourceItemId === item.id && (t.status === '待接' || t.status === '进行中')) exist = t;
  });
  if (exist) {
    closeModal();
    if (!skipJump) {
      try { closeCardDetail(); } catch (e) {}
      showPage('pool');
    }
    toast('已有「' + item.name + '」的' + exist.status + '委托');
    return exist;
  }
  var variants = (item.variants && item.variants.length) ? item.variants
    : [{ id: null, brand: item.name, packPrice: item.currentPrice || 0, packQty: 1, packUnit: item.unit || '个', photos: [] }];
  var pid = planNextId();
  var plans = variants.map(function (v) {
    return {
      id: pid++,
      name: v.brand || item.name,
      amount: 0,
      comboPrice: Math.round(((+v.packPrice || +v.price || 0)) * 100) / 100,
      qty: 0,
      spec: v.packQty || 1,
      unit: v.packUnit || item.unit || '个',
      note: '',
      status: 'open',
      pinned: false,
      buy: true,
      photos: (v.photos || []).slice(),
      sourceItemId: item.id,
      sourceVariantId: v.id || null,
      _calcOpen: false
    };
  });
  var newId = 1;
  DB.tasks.forEach(function (t) { if (t.id >= newId) newId = t.id + 1; });
  var task = {
    id: newId,
    name: item.name,
    zoneId: zoneId,
    categoryId: item.categoryId || null,
    status: '待接',
    note: '由「' + zone.name + '」库存一键生成 · 凯旋后自动回写库存',
    plans: plans,
    pinned: false,
    sourceItemId: item.id,
    fromItem: true,
    createdAt: new Date().toISOString()
  };
  DB.tasks.push(task);
  saveDB();
  closeModal();
  if (!skipJump) {
    try { closeCardDetail(); } catch (e) {}
    showPage('pool');
  }
  toast('📋 已加入待接：' + item.name + '（' + plans.length + ' 个品牌待填价格）');
  return task;
}

function renderReportRow(e) {
  var html = '';

  html += '<div class="report-row"' + (e.deleted ? '' : ' onclick="openCardDetail(\'' + e.zoneId + '\',\'' + e.itemId + '\')"') + '>';

  if (e.usedThisYear > 0 && e.model === 'instant') facts.push('今年累计用掉 ' + trimNum(e.usedThisYear) + (e.unit || '份'));
  // 历史条目：列出档案里每一年的用量与花费

    facts.push(t);

    html += '<div class="report-facts">';
    facts.forEach(function (f) { html += '<span class="report-fact">' + escapeHtml(f) + '</span>'; });

  html += '</div>';

// ========== 数据导入导出 ==========
function exportJSON() {
  var data = JSON.stringify(DB, null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '家有-备份-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出');
}

function importJSON(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.zones) { toast('文件格式不对'); return; }
      // 先解析好数据，再确认导入（避免confirm在异步回调中的问题）
      var newDB = mergeDB({
        zones: [], tasks: [],
        settings: {},
        version: 1
      }, data);
      // 直接导入，不再用confirm阻塞
      DB = newDB;
      saveDB();
      // 验证存储是否成功
      var saved = localStorage.getItem('jiayou_db');
      if (saved) {
        showPage('home');
        toast('导入成功，共' + (DB.zones||[]).length + '个领地');
      } else {
        toast('存储失败，请重试');
      }
    } catch(err) {
      console.error('导入失败:', err);
      toast('文件解析失败: ' + err.message);
    }
  };
  reader.onerror = function() {
    toast('文件读取失败');
  };
  reader.readAsText(file);
}

// ========== 工具函数 ==========
function daysBetween(d1, d2) {
  return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

function formatDateTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

// 图片压缩
function compressImage(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxDim = 800;
      var w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = h * maxDim / w; w = maxDim; }
        else { w = w * maxDim / h; h = maxDim; }
      }
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 导入文件监听
document.getElementById('import-input').addEventListener('change', function(e) {
  if (e.target.files[0]) importJSON(e.target.files[0]);
  e.target.value = '';
});

// ========== 预警详情弹窗 ==========
function showAlertDetail(type) {
  var title = '', items = [];
  if (type === 'expired') {
    title = '🔴 已过期';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).expired) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'expiring') {
    title = '🟡 即将过期（30天内）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).expiring) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'lowStock') {
    title = '🟡 库存告急';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).lowStock) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'lowStockSoft') {
    title = '🔵 余量较少';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).lowStockSoft) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'stockUp') {
    title = '🟣 该囤货了（撑不到下次采购）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).stockUpAlert) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'inUse') {
    title = '🔓 使用中（已开封正在用）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).hasInUse) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'stockpile') {
    title = '📦 囤货区（买了未开封）';
    DB.zones.forEach(function(zone) {
      visibleItems(zone).forEach(function(it) {
        if (getItemStatus(it).allUnopened) items.push({item: it, zone: zone});
      });
    });
  }

  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">' + title + '</div>';
  if (items.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">✓</div><div class="empty-text">没有需要关注的</div></div>';
  } else {
    if (type === 'stockpile') {
      items.sort(function(a, b) { return a.zone.name.localeCompare(b.zone.name); });
    }
    html += '<div style="margin-bottom:16px;font-size:13px;color:var(--text-secondary)">共 ' + items.length + ' 件</div>';
    var lastZone = null;
    var zoneCount = {};
    if (type === 'stockpile') {
      items.forEach(function(e) { zoneCount[e.zone.name] = (zoneCount[e.zone.name] || 0) + 1; });
    }
    items.forEach(function(entry) {
      var it = entry.item, zone = entry.zone;
      var status = getItemStatus(it);
      if (type === 'stockpile' && zone.name !== lastZone) {
        html += '<div style="font-weight:700;font-size:14px;margin:14px 0 6px;color:var(--text)">' + zone.icon + ' ' + escapeHtml(zone.name) + ' · ' + zoneCount[zone.name] + '件未开封</div>';
        lastZone = zone.name;
      }
      var bgColor = '#fff';
      if (type === 'expired') bgColor = 'rgba(255,59,48,0.06)';
      else if (type === 'expiring') bgColor = 'rgba(255,149,0,0.06)';
      else if (type === 'lowStock') bgColor = 'rgba(255,149,0,0.06)';
      else if (type === 'lowStockSoft') bgColor = 'rgba(90,200,250,0.06)';
      else if (type === 'stockUp') bgColor = 'rgba(175,82,222,0.06)';
      else if (type === 'stockpile') bgColor = 'rgba(142,142,147,0.06)';

      html += '<div style="display:flex;gap:10px;padding:12px;border-radius:10px;background:' + bgColor + ';margin-bottom:8px;cursor:pointer" onclick="closeModal();setTimeout(function(){enterZone(\'' + zone.id + '\')},200)">';
      // 照片
      html += '<div style="width:50px;height:50px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px">';
      if (it.photos && it.photos.length > 0) {
        html += '<img src="' + it.photos[0] + '" style="width:100%;height:100%;object-fit:cover">';
      } else {
        html += '📦';
      }
      html += '</div>';
      // 信息
      html += '<div style="flex:1;min-width:0">';
      html += '<div style="font-weight:700;font-size:15px">' + escapeHtml(it.name) + (it.oneShot ? ' <span style="font-size:11px;color:#fff;background:rgba(255,149,0,0.92);padding:1px 6px;border-radius:6px;font-weight:600;vertical-align:middle">⚡即用完</span>' : '') + '</div>';
      html += '<div style="font-size:12px;color:var(--text-secondary)">' + zone.icon + ' ' + escapeHtml(zone.name) + '</div>';
      if (type === 'expired') {
        html += '<div style="font-size:13px;color:var(--red);font-weight:600;margin-top:2px">⚠️ 已过期' + (status.daysLeft!==null?'（超期'+Math.abs(status.daysLeft)+'天）':'') + '</div>';
      } else if (type === 'expiring') {
        html += '<div style="font-size:13px;color:var(--orange);font-weight:600;margin-top:2px">⏰ 还剩 ' + status.daysLeft + ' 天过期</div>';
      } else if (type === 'lowStock') {
        var lowPack = '';
        if (isSetPackMode(it) && it.variants && it.variants.length && (it.variants[0].packQty || 1) > 1) {
          var totS = getTotalStock(it);
          lowPack = '（约 ' + Math.floor(totS / Math.max(1, it.variants[0].packQty)) + ' 套）';
        }
        html += '<div style="font-size:13px;color:var(--orange);font-weight:600;margin-top:2px">📦 库存仅剩 ' + getTotalStock(it) + mainPackUnit(it) + lowPack + '（告急阈值' + (it.stockThreshold||1) + '）</div>';
      } else if (type === 'lowStockSoft') {
        var est = status.estDaysLeft;
        html += '<div style="font-size:13px;color:var(--blue);font-weight:600;margin-top:2px">⏳ 预计 ' + (est!==null?est:'?') + ' 天内用完</div>';
      } else if (type === 'stockUp') {
        var ml = status.monthsLeft;
        var estS = status.estDaysLeft;
        html += '<div style="font-size:13px;color:var(--purple);font-weight:600;margin-top:2px">🛒 约够用 ' + (ml!==null?ml:'?') + ' 个月' + (estS!==null&&estS!==undefined?'（'+estS+' 天）':'') + '，撑不到下次采购</div>';
      } else if (type === 'inUse') {
        var activeBrands = (it.variants||[]).filter(function(v){ return v.opened && !v.usedUp; }).map(function(v){ return v.brand||'未命名'; });
        html += '<div style="font-size:13px;color:var(--green);font-weight:600;margin-top:2px">🔓 使用中：' + (activeBrands.join('、') || '—') + '</div>';
      } else if (type === 'stockpile') {
        var totalS = getTotalStock(it);
        html += '<div style="font-size:13px;color:var(--text-secondary);font-weight:600;margin-top:2px">📦 库存 ' + (totalS||0) + mainPackUnit(it) + ' · 未开封</div>';
      }
      html += '</div>';
      html += '<button class="btn btn-outline btn-sm" style="flex-shrink:0;align-self:center;font-size:12px;padding:6px 10px" onclick="event.stopPropagation();taskFromItem(\'' + zone.id + '\',\'' + it.id + '\')">📋 委托</button>';
      html += '</div>';
    });
  }
  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">关闭</button>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

// ========== 首页过滤快捷（改为弹窗显示详情）==========
function filterExpired() { showAlertDetail('expired'); }
function filterExpiring() { showAlertDetail('expiring'); }
function filterLowStock() { showAlertDetail('lowStock'); }
function filterLowStockSoft() { showAlertDetail('lowStockSoft'); }
function filterStockUp() { showAlertDetail('stockUp'); }
function filterInUse() { showAlertDetail('inUse'); }
function filterStockpile() { showAlertDetail('stockpile'); }
</script>
</body>
</html>
