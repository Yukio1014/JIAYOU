  toast('感受已保存');
}

// 第 11 轮：删除品牌的使用感受（清空后主卡不再显示该区块，可重新记录）
function removeVariantFeeling(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function (x) { return x.id === variantId; });
  if (!v) return;
  var hasVal = v.feeling && (v.feeling.rating || (v.feeling.tags && v.feeling.tags.length) || v.feeling.notes);
  if (!hasVal) { toast('这个品牌还没有感受记录'); return; }
  if (!window.confirm('删除「' + (v.brand || '') + '」的使用感受？\n删除后评分、标签、心得都会清空，无法找回。')) return;
  delete v.feeling;
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('🗑️ 已删除该品牌的使用感受');
}

function saveItem() {
  var zone = getZone(currentZoneId);
  if (!zone) { toast('领地上下文已失效，请关闭后重新打开表单'); return; }
  var name = document.getElementById('item-name').value.trim();
  if (!name) { toast('请输入名称'); return; }

  // 分类：选了子分类用子分类，否则用大类
  var finalCategoryId = document.getElementById('item-category').value;
  var subSel = document.getElementById('item-subcategory');
  if (subSel && subSel.value) finalCategoryId = subSel.value;

  var data = {
    name: name,
    categoryId: finalCategoryId,
    // 存放位置字段已并入备注；编辑旧物品时保留原 location 值，不丢数据
    location: (function () {
      var el = document.getElementById('item-location');
      if (el) return el.value;
      var oldIt = editingItemId ? getItem(currentZoneId, editingItemId) : null;
      return oldIt ? (oldIt.location || '') : '';
    })(),
    notes: (function() { var el = document.getElementById('item-notes'); return el ? el.value : ''; })(),
    photos: itemPhotos.slice()
  };

  if (zone.type === 'consumable') {
    // 从品牌变体编辑器读取
    var editVariants = window._editVariants || [];
    // 旧变体快照：用于把「已开包数」从旧数据带过来（按名称+单位匹配）
    var _oldItem = editingItemId ? getItem(currentZoneId, editingItemId) : null;
    var oldVariantsForLeft = (_oldItem && _oldItem.variants) ? _oldItem.variants : [];
    data.variants = editVariants.map(function(ev, i) {
      // 留空 = 1，填 0 = 0：所有数量类字段统一按此语义归一
      function normQty(x) { var s = String(x == null ? '' : x).trim(); if (s === '') return 1; return parseFloat(s) || 0; }
      var evStock = parseFloat(ev.stock) || 0;
      var evPrice = parseFloat(ev.price) || 0;
      // 以编辑行数据为基础（保留 packWeightUnit / noRestock / notes 等扩展字段，避免保存时丢失），
      // 再覆盖本表单实际管理的字段
      var nv = {};
      Object.keys(ev).forEach(function(k) { nv[k] = ev[k]; });
      nv.id = ev.id;
      nv.brand = ev.brand || '未命名';
      nv.stock = evStock;
      nv.price = evPrice;
      nv.totalPrice = ev.totalPrice || +(evPrice * evStock).toFixed(2);
      nv.channel = '';
      nv.photos = []; // 补给品不再使用照片（只在耐用品保留）；保存时清掉存量旧图，卡片更精简
      nv.opened = false; nv.openDate = null; nv.finishDate = null;
      nv.usedUp = false; nv.openQty = 0; nv.feeling = null; nv.shelfLife = null; nv.productionDate = null;
      nv.packCount = normQty(ev.packCount);
      nv.packPrice = (typeof ev.packPrice !== 'undefined' ? ev.packPrice : (ev.totalPrice || 0));
      nv.packQty = normQty(ev.packQty);
      nv.packQtyUnit = String(ev.packQtyUnit || '').trim();   // 件数单位（瓶/包/个…）
      nv.packUnit = (ev.packUnit && !isContentUnitText(ev.packUnit)) ? ev.packUnit : nv.packQtyUnit; // 旧字段兼容；含量单位一律不收
      nv.packWeight = normQty(ev.packWeight);
      // 混合规格（本品牌可选）：specs = 「一套里装了什么」（单套构成），永不被套餐数折算写回
      // 库存 = Σ 各规格(套餐数 × 单套包数 − 已开包数) × 每包含量 × 每份规格；消耗记在 specs[i].openPacks
      // 规格两层结构：packCount(单套内包数) × packQty(每包含量) × content(每份规格)；留空 = 1，填 0 = 0
      nv.specs = (ev.specs || []).map(function (s) {
        var spc_ = (s.packCount !== undefined && s.packCount !== null && s.packCount !== '') ? (parseFloat(s.packCount) || 0) : ((+s.qty || 0) > 0 ? +s.qty : 1);
        var spq_ = (s.packQty !== undefined && s.packQty !== null && s.packQty !== '') ? (parseFloat(s.packQty) || 0) : 1;
        var sct_ = (s.content !== undefined && s.content !== null && s.content !== '') ? (+s.content || 0) : 1;
        // 【第 13 轮】即时消耗型的规格级已消耗份数必须随表单带回，编辑保存不得清零
        return { name: (s.name || '').trim(), packCount: spc_, packQty: spq_, content: sct_, unit: (s.unit || '').trim(), qty: Math.round(spc_ * spq_ * 100) / 100, openPacks: specOpenPacks(s), usedQty: specUsedQty(s) };
      }).filter(function (s) { return +s.packCount > 0; });
      if (nv.specs.length) {
        // ① 套餐数：用户填多少就存多少（留空 = 1）；不做任何折算写回（消灭「横跳」）
        var packsN = variantPacksBought(nv);
        nv.packCount = packsN;
        // ② 明细归一：补齐 content=1、同步 qty；已开包数由表单原样带回（openPacks）
        var oldV = null;
        (oldVariantsForLeft || []).forEach(function (x) { if (x && x.id === nv.id) oldV = x; });
        var oldSpecs = (oldV && oldV.specs) ? oldV.specs : [];
        nv.specs.forEach(function (s, si) {
          if (!(+s.content > 0)) s.content = 1;
          // 已开包数：优先用表单带回的值；为 0 时按「名称+单位」从旧数据补（防止表单未初始化）
          var keep = specOpenPacks(s);
          var keepUsed = specUsedQty(s);
          if (!(keep > 0)) {
            oldSpecs.forEach(function (os) {
              if (keep > 0) return;
              var sameName = String(os.name || '').trim() === String(s.name || '').trim();
              var sameUnit = String(os.unit || '').trim() === String(s.unit || '').trim();
              if (sameName && sameUnit) keep = specOpenPacks(os);
            });
          }
          if (!(keep > 0) && oldSpecs[si]) keep = specOpenPacks(oldSpecs[si]);
          // 【第 13 轮】规格级已消耗份数（即时型）：同样按「名称+单位」从旧数据兜底继承
          if (!(keepUsed > 0)) {
            oldSpecs.forEach(function (os) {
              if (keepUsed > 0) return;
              var sameName2 = String(os.name || '').trim() === String(s.name || '').trim();
              var sameUnit2 = String(os.unit || '').trim() === String(s.unit || '').trim();
              if (sameName2 && sameUnit2) keepUsed = specUsedQty(os);
            });
          }
          if (!(keepUsed > 0) && oldSpecs[si]) keepUsed = specUsedQty(oldSpecs[si]);
          // 已开包数不能超过「套餐数 × 单套包数」
          var maxOpen = packsN * specPackCount(s);
          s.openPacks = Math.round(Math.min(keep, maxOpen) * 100) / 100;
          s.usedQty = Math.max(0, Math.round(keepUsed * 100) / 100);
          s.qty = Math.round(specPackCount(s) * specPackQty(s) * 100) / 100; // 兼容字段：单套内包数 × 每包含量
        });
        // ③ 库存 = Σ 各规格剩余包数 × 每包含量 × 每份规格
        nv.stock = variantSpecStockCalc(nv);
        // ④ 父级规格行已被明细接管：不再从明细反写 packQty（避免「套数 × 每套含」的旧矛盾）
        nv.specsFolded = true;
        nv.packUnit = nv.specs[0].unit || nv.packUnit;
        nv.packWeight = 1;
        nv.packWeightUnit = nv.specs[0].unit || nv.packWeightUnit;
        // ⑤ 重启消费状态：库存还有 → 不是「用完」；仍有未结束的开封记录 → 保持「使用中」
        if (nv.stock > 0) {
          nv.usedUp = false; nv.finishDate = null;
          nv.opened = !!(_oldItem && (_oldItem.usageRecords || []).some(function (r) { return r.variantId === nv.id && !r.endDate; }));
          nv.openDate = nv.opened ? ((oldV && oldV.openDate) || new Date().toISOString()) : null;
        }
      } else {
        nv.specs = [];
      }
      return nv;
    });
    // 合并变体照片，用于卡片展示
    var variantPhotos = [];
    data.variants.forEach(function(v) { variantPhotos = variantPhotos.concat(v.photos); });
    var seenP = {};
    var allP = [];
    variantPhotos.forEach(function(p) { if (p && !seenP[p]) { seenP[p] = true; allP.push(p); } });
    data.photos = allP;
    data.stock = data.variants.reduce(function(s,v) { return s + (v.stock||0); }, 0);
    // 补给品总金额 = 各品牌总价之和
    data.currentPrice = data.variants.reduce(function(s,v){ return s + (v.totalPrice || ((v.price||0)*(v.stock||0))); }, 0);
    data.stockThreshold = parseFloat(document.getElementById('item-threshold').value) || 1;
    var cmEl = document.getElementById('item-consumemode');
    data.consumeMode = (cmEl && CONSUME_MODELS[cmEl.value]) ? cmEl.value : 'period';
    data.oneShot = (data.consumeMode === 'instant'); // 即时消耗 = 旧 oneShot 语义，保持字段兼容
  } else {
    // 耐用品：从件数编辑器读取
    var dEditVariants = window._editVariants || [];
    var dEditPhotos = window._editVariantPhotos || [];
    data.variants = dEditVariants.map(function(ev, i) {
      return {
        id: ev.id,
        brand: ev.brand || ('第' + (i+1) + '件'),
        stock: Math.max(1, parseInt(ev.stock) || 1),
        price: ev.price || 0,
        totalPrice: ev.totalPrice || ((ev.price || 0) * (Math.max(1, parseInt(ev.stock) || 1))),
        channel: '',
        photos: (dEditPhotos[i] || []).slice(),
        notes: ev.notes || '',
        opened: false, openDate: null, finishDate: null,
        usedUp: false, openQty: 0, feeling: null,
        shelfLife: null, productionDate: null
      };
    });
    data.stock = data.variants.reduce(function(s,v){ return s + (v.stock||1); }, 0);
    data.unit = '件';
    // 耐用品总金额 = 各款总价之和
    data.currentPrice = data.variants.reduce(function(s,v){ return s + (v.totalPrice || ((v.price||0)*(v.stock||1))); }, 0);
    data.channel = '';
  }

  if (editingItemId) {
    var item = getItem(currentZoneId, editingItemId);
    if (zone.type === 'consumable') {
      // 补给品：保留已有的variant使用数据
      var oldVariants = item.variants || [];
      var newVariants = data.variants;
      newVariants.forEach(function(nv) {
        var old = oldVariants.find(function(ov) { return ov.id === nv.id; });
        if (old) {
          nv.opened = old.opened;
          nv.usedUp = old.usedUp;
          nv.openDate = old.openDate;
          nv.finishDate = old.finishDate;
          nv.openQty = old.openQty;
          nv.feeling = old.feeling;
          nv.shelfLife = old.shelfLife;
          nv.productionDate = old.productionDate;
          // 照片以编辑表单为准（表单里有完整的缩略图 + 删除按钮）：
          // 不再从旧数据「复活」照片——否则用户删光照片保存后又被拷回来（曾误报「照片写死了」）
        }
      });
    } else {
      // 耐用品：保留已有的variant使用感受和备注
      var oldDVariants = item.variants || [];
      data.variants.forEach(function(nv) {
        var old = oldDVariants.find(function(ov) { return ov.id === nv.id; });
        if (old) {
          nv.feeling = old.feeling;
          if (!nv.notes && old.notes) nv.notes = old.notes;
          if (!nv.totalPrice && old.totalPrice) nv.totalPrice = old.totalPrice;
        }
      });
    }
    // 耐用品编辑表单已无整物品备注输入框，保留旧值不被空覆盖
    if (zone.type !== 'consumable' && !data.notes && item.notes) data.notes = item.notes;
    Object.assign(item, data);
    if (zone.type === 'consumable') syncItemFromVariants(item);
    else syncDurableFromVariants(item);
  } else {
    data.id = genId();
    data.usageRecords = [];
    data.priceHistory = [];
    data.createdAt = new Date().toISOString();
    zone.items.push(data);
  }

  saveDB();
  closeModal();
  if (zone.type === 'consumable' && editingItemId) {
    // 保存后：对账状态 + 重算统计，让界面立刻反映最新数据
    var saved = getItem(currentZoneId, editingItemId);
    if (saved) reconcileItemState(saved);
    saveDB();
  }
  renderZone();
  refreshCurrentPage();
  toast(editingItemId ? '已保存' : '已添加');
}

function editItem(itemId) {
  closeCardDetail();
  openItemForm(itemId);
}

// 删除：会连同使用记录一起消失，所以先说清楚，并给「归档」这个更稳的出路
function deleteItem(itemId) {
  var item = findItemByIdGlobal(itemId);
  var recCnt = (item && item.usageRecords) ? item.usageRecords.length : 0;
  var msg = '确定永久删除？此操作不可撤销。';
  if (item) {
    msg = '确定永久删除「' + item.name + '」？\n\n⚠️ 它的 ' + recCnt + ' 条使用记录、价格历史、使用感受会一起消失，且无法找回。\n\n如果只是「用完不再买」，建议改用 📦 归档：不再提醒补货，数据全部保留，随时可恢复。\n\n仍要永久删除吗？';
  }
  if (!confirm(msg)) return;
  // 【第 23 轮 · 防崩】优先定位物品真实所在的领地（跨领地/无上下文都不再炸、不再删错位置）
  var zone = null;
  if (item) {
    zone = DB.zones.find(function (z) { return (z.items || []).some(function (it) { return it.id === itemId; }); }) || null;
  }
  if (!zone) zone = getZone(currentZoneId);
  if (!zone) { toast('未找到该物品所在的领地'); return; }
  currentZoneId = zone.id;
  zone.items = zone.items.filter(function(it) { return it.id !== itemId; });
  saveDB();
  closeModal();
  closeCardDetail();
  renderZone();
  if (document.getElementById('home-content')) renderHome();
  toast('已永久删除');
}

// ========== 年度档案：把明细压缩成一句「这一年的使用效率」==========
// 固化后，用完的品牌/物品就可以放心删掉，结论不会丢
function buildYearStats(year) {
  if (!DB.yearStats) DB.yearStats = {};
  var items = [];
  var totalSpend = 0;
  DB.zones.forEach(function(z) {
    (z.items || []).forEach(function(it) {
      var yq = 0, times = 0, daySum = 0, dayCnt = 0, spend = 0;
      var brandMap = {};
      // 消耗量：使用记录落在这一年的
      (it.usageRecords || []).forEach(function(r) {
        var d = r.endDate || r.startDate || r.date;
        if (!d) return;
        if (new Date(d).getFullYear() !== year) return;
        yq += (r.qty || 1);
        times += 1;
        if (r.startDate && r.endDate) {
          var dd = daysBetween(new Date(r.startDate), new Date(r.endDate));
          if (dd >= 0) { daySum += dd; dayCnt += 1; }
        }
        var bn = r.brand || '未命名';
        if (!brandMap[bn]) brandMap[bn] = { name: bn, spend: 0, restock: null };
      });
      // 花费：价格历史落在这一年的（按品牌归集）
      (it.priceHistory || []).forEach(function(p) {
        if (!p.date || new Date(p.date).getFullYear() !== year) return;
        spend += (p.totalPrice || 0);
        var bn2 = p.brand || '未命名';
        if (!brandMap[bn2]) brandMap[bn2] = { name: bn2, spend: 0, restock: null };
        brandMap[bn2].spend += (p.totalPrice || 0);
      });
      // 品牌评分 / 是否回购（从变体取当前结论）
      (it.variants || []).forEach(function(v) {
        var bn3 = v.brand || '未命名';
        if (!brandMap[bn3]) brandMap[bn3] = { name: bn3, spend: 0, restock: null };
        var b = brandMap[bn3];
        b.rating = (v.feeling && v.feeling.rating) || 0;
        b.tags = (v.feeling && v.feeling.tags) ? v.feeling.tags.slice() : [];
        if (v.noRestock) b.restock = false; else if (v.usedUp) b.restock = true;
      });
      // 没有价格历史（很多物品只在变体上记了单价）→ 按当前单价估算花费，标注「约」
      var estimated = false;
      if (spend <= 0 && yq > 0) {
        var perUnit = 0;
        if (it.variants && it.variants.length) {
          perUnit = it.variants.reduce(function(s, v) { return s + (v.packPrice || v.price || 0); }, 0) / it.variants.length;
        } else {
          perUnit = it.price || 0;
        }
        spend = Math.round(perUnit * yq * 100) / 100;
        estimated = true;
      }
      if (yq <= 0 && spend <= 0) return; // 这一年没有任何动静，不进档案
      // 年报表展示口径：记录里的 qty 是「用户开/用的件·份数」（步进器选的数），
      // 不是「套」——套只是展示层的折算说法。所以主口径一律用件/份/片，
      // 有含量（每个多重/多少）时再补一个含量口径。
      var model = consumeModelOf(it);
      var capUnit = mainPackUnit(it);
      var unitName = it.unit || capUnit || '个';
      var mainQty = Math.round(yq * 10) / 10;
      var capQty = 0, showCapUnit = capUnit;
      if (model === 'combo') {
        unitName = (it.variants && it.variants[0] ? variantSpecUnit(it.variants[0]) : '') || it.unit || '件';
        capQty = 0;                     // combo 的 qty 已是片/件，不再折算
      } else {
        // 周期型：qty = 开了几件/几份；用「每件含量」补一个含量口径（如 3件 → ≈27kg）
        var wAvg = 0, wAvgUnit = '';
        (it.variants || []).forEach(function (v) {
          var w = parseFloat(v.packWeight) || 0;
          if (w > 0) { wAvg = w; wAvgUnit = weightUnitOf(v); }
        });
        // 【第 26 轮】只有真·容量单位（g/ml/kg…）才允许出现在括号里；
        // 片/粒类即便误填了 packWeight，也绝不能把「件数 × 重量」说成容量。
        if (wAvg > 0 && isContentUnitText(wAvgUnit)) {
          // 若这一年的记录带 contentUsed（规格开封时算过含量），优先用它
          var contentSum = 0, hasContent = false;
          (it.usageRecords || []).forEach(function (r) {
            var d = r.endDate || r.startDate || r.date;
            if (!d || new Date(d).getFullYear() !== year) return;
            if (r.contentUsed > 0) { contentSum += r.contentUsed; hasContent = true; }
          });
          capQty = hasContent ? round1(contentSum) : round1(yq * wAvg);
          showCapUnit = wAvgUnit;
        }
      }
      var brands = Object.keys(brandMap).map(function(k) { return brandMap[k]; });
      totalSpend += spend;
      // 速率四要素也一并固化：物品删除后年报仍能展示它的「用得多快 / 建议买多少」
      // （固化时物品还在，statsOf/buyAdviceOf 可正常计算；此后这份数据不再变化）
      var stY = statsOf(it);
      var advY = buyAdviceOf(it);
      items.push({
        itemId: it.id,
        zoneId: z.id, zoneName: z.name, zoneIcon: z.icon || '📦',
        categoryPath: getCategoryPath(z.id, it.categoryId) || '未分类',
        name: it.name, unit: unitName,
        qty: mainQty,
        capQty: capQty,
        capUnit: showCapUnit,
        spend: Math.round(spend * 100) / 100,
        unitPrice: yq > 0 ? Math.round((spend / yq) * 100) / 100 : 0,
        times: times,
        avgDays: dayCnt > 0 ? Math.round(daySum / dayCnt) : 0,
        estimated: estimated,
        rateText: rateSentenceOf(it, stY),
        restText: restSentenceOf(it, stY),
        leftText: monthsLeftSentenceOf(stY),
        adviceText: advY ? String(advY.main || '').replace(/<[^>]+>/g, '') : '',
        brands: brands
      });
    });
  });
  items.sort(function(a, b) { return b.spend - a.spend; });
  DB.yearStats[String(year)] = {
    generatedAt: new Date().toISOString(),
    itemCount: items.length,
    totalSpend: Math.round(totalSpend * 100) / 100,
    items: items
  };
  saveDB();
  return DB.yearStats[String(year)];
}

// ==========================================================================
// 【第 24 轮】年终固化与清理
// ==========================================================================
// 1 月 1 日起，每次启动提醒「固化上一年」（可点「稍后」，本次会话不再打扰）：
//   ① 把还挂在「使用中」的开封记录统一收尾到上年 12 月 31 日 —— 完成闭环，进入统计；
//   ② 生成《年度报告》存档（DB.yearStats[上年]，永久快照，删了物品也还在）；
//   ③ 固化后可一键「清空旧年份数据」：
//        · 永久删除「已完结且不再补货」的产品（所有变体都 noRestock / 已用完且库存为 0）；
//        · 仅清掉上一年的使用记录，当年及以后的记录一条不动。
// ==========================================================================
var yearEndDismissed = null;   // 用户点了「稍后」的年份（本次会话内不再弹）

function yearEndHasData(year) {
  var has = false;
  DB.zones.forEach(function (z) {
    (z.items || []).forEach(function (it) {
      if (has) return;
      (it.usageRecords || []).forEach(function (r) {
        var d = r && (r.endDate || r.startDate || r.date);
        if (d && new Date(d).getFullYear() === year) has = true;
      });
      (it.priceHistory || []).forEach(function (p) {
        if (p && p.date && new Date(p.date).getFullYear() === year) has = true;
      });
    });
  });
  return has;
}
// 待固化的年份：上一年有数据、且还没固化过 → 返回年份；否则 null
function yearEndPendingYear() {
  var prev = new Date().getFullYear() - 1;
  if (yearEndDismissed === prev) return null;
  var snap = DB.yearStats && DB.yearStats[String(prev)];
  if (snap && snap.settled) return null;
  return yearEndHasData(prev) ? prev : null;
}
// 启动时调用：有未固化的上年就弹一次
function checkYearEndSettle() {
  try {
    var y = yearEndPendingYear();
    if (y === null) return false;
    openYearEndSettle(y);
    return true;
  } catch (e) { console.error('年终固化检查异常已容错', e); return false; }
}
function openYearEndSettle(year) {
  var y = year;
  var pending = 0;
  DB.zones.forEach(function (z) {
    (z.items || []).forEach(function (it) {
      (it.usageRecords || []).forEach(function (r) {
        if (!r || r.instant || r.endDate) return;
        var d = r.startDate ? new Date(r.startDate) : null;
        if (d && d.getFullYear() <= y) pending++;
      });
    });
  });
  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">🎊 固化 ' + y + ' 年</div>';
  html += '<div style="font-size:13px;color:var(--text-secondary);line-height:1.7;margin-bottom:14px">';
  html += '新的一年开始了，把 <strong>' + y + '</strong> 年的账封存：<br>';
  html += '· 还挂着的「使用中」记录统一收尾到 <strong>' + y + '-12-31</strong>（共 ' + pending + ' 条），完成闭环、进入统计；<br>';
  html += '· 生成《' + y + ' 年度报告》存档，永久保存，之后删除产品也还能查到。';
  html += '</div>';
  html += '<div style="display:flex;gap:8px">';
  html += '<button class="btn btn-primary" style="flex:1" onclick="settleYearEnd(' + y + ')">📦 立即固化</button>';
  html += '<button class="btn btn-outline" style="flex-shrink:0" onclick="yearEndDismiss(' + y + ')">稍后</button>';
  html += '</div>';
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}
function yearEndDismiss(year) { yearEndDismissed = year; closeModal(); }
function settleYearEnd(year) {
  var y = Number(year);
  var endOfYear = new Date(y, 11, 31, 23, 59, 59).toISOString();
  var closed = 0;
  DB.zones.forEach(function (z) {
    if (z.type !== 'consumable') return;
    (z.items || []).forEach(function (it) {
      (it.usageRecords || []).forEach(function (r) {
        if (!r || r.instant || r.endDate) return;
        var d = r.startDate ? new Date(r.startDate) : null;
        if (!d || d.getFullYear() > y) return;      // 当年才开始用的不动
        r.endDate = endOfYear;
        closed++;
      });
      try { reconcileItemState(it); } catch (e) {}
    });
  });
  // 生成年度报告存档
  var snap = null;
  try { snap = buildYearStats(y); } catch (e) { console.error('buildYearStats失败', e); }
  if (!DB.yearStats) DB.yearStats = {};
  if (!DB.yearStats[String(y)]) DB.yearStats[String(y)] = { items: [] };
  DB.yearStats[String(y)].settled = true;
  DB.yearStats[String(y)].settledAt = new Date().toISOString();
  DB.yearStats[String(y)].closedRecords = closed;
  saveDB();
  closeModal();
  openYearCleanup(y, closed, snap ? snap.itemCount : 0);
}
// 固化后的清理向导
function openYearCleanup(year, closed, itemCount) {
  var y = Number(year);
  var done = [], oldRecs = 0;
  DB.zones.forEach(function (z) {
    if (z.type !== 'consumable') return;
    (z.items || []).forEach(function (it) {
      var vs = it.variants || [];
      var finished = vs.length > 0 && vs.every(function (v) {
        return !!v.noRestock || (!!v.usedUp && !(parseFloat(v.stock) > 0));
      });
      if (finished) done.push({ zone: z, item: it });
      (it.usageRecords || []).forEach(function (r) {
        var d = r && (r.endDate || r.startDate || r.date);
        if (d && new Date(d).getFullYear() <= y) oldRecs++;
      });
    });
  });
  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">🧹 清理旧年份数据</div>';
  html += '<div style="font-size:13px;color:var(--text-secondary);line-height:1.7;margin-bottom:14px">';
  html += '✅ ' + y + ' 年已固化：收尾 ' + closed + ' 条使用中记录，归档 ' + itemCount + ' 件产品。<br><br>';
  html += '接下来可选清理（<strong>不可撤销</strong>，建议先「📤 导出数据」备份）：<br>';
  html += '· 永久删除 <strong>' + done.length + '</strong> 件「已完结且不再补货」的产品；<br>';
  html += '· 清掉 <strong>' + oldRecs + '</strong> 条 ' + y + ' 年及以前的使用记录（当年及以后一条不动）。';
  html += '</div>';
  html += '<div style="display:flex;gap:8px;flex-direction:column">';
  html += '<button class="btn btn-danger" onclick="cleanupOldYear(' + y + ',true,true)">🗑 全部清理（删产品 + 清记录）</button>';
  html += '<button class="btn btn-outline" onclick="cleanupOldYear(' + y + ',false,true)">🧾 只清 ' + y + ' 年记录</button>';
  html += '<button class="btn btn-outline" onclick="closeModal()">先不用</button>';
  html += '</div>';
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}
// delFinished=true → 永久删除已完结且不再补货的产品；clearRecs=true → 清掉该年及以前的记录
function cleanupOldYear(year, delFinished, clearRecs) {
  var y = Number(year);
  if (!window.confirm('确定执行清理吗？此操作不可撤销。\n建议先到「设置 → 📤 导出数据」备份一份。')) return;
  var deleted = 0, cleared = 0;
  DB.zones.forEach(function (z) {
    if (z.type !== 'consumable') return;
    if (delFinished) {
      z.items = (z.items || []).filter(function (it) {
        var vs = it.variants || [];
        var finished = vs.length > 0 && vs.every(function (v) {
          return !!v.noRestock || (!!v.usedUp && !(parseFloat(v.stock) > 0));
        });
        if (finished) { deleted++; return false; }
        return true;
      });
    }
    if (clearRecs) {
      (z.items || []).forEach(function (it) {
        var before = (it.usageRecords || []).length;
        it.usageRecords = (it.usageRecords || []).filter(function (r) {
          var d = r && (r.endDate || r.startDate || r.date);
          if (!d) return true;
          return new Date(d).getFullYear() > y;    // 只留该年之后的
        });
        cleared += (before - (it.usageRecords || []).length);
      });
    }
  });
  saveDB();
  closeModal();
  try { renderAll(); } catch (e) {}
  toast('🧹 已删除 ' + deleted + ' 件产品，清理 ' + cleared + ' 条旧记录');
}

function yearStatsYears() {
  var ys = Object.keys(DB.yearStats || {});
  var cur = String(new Date().getFullYear());
  if (ys.indexOf(cur) < 0) ys.push(cur);
  ys.sort(function(a, b) { return Number(b) - Number(a); });
  return ys;
}

// 清理：删掉已用完 / 不再买的品牌卡片（含照片与使用记录），年度档案已固化结论
function cleanupFinishedVariants(year) {
  year = year || String(new Date().getFullYear());
  if (!(DB.yearStats && DB.yearStats[String(year)])) {
    if (!confirm('还没有 ' + year + ' 年度档案。\n\n建议先生成档案，把这一年的消耗/花费固化下来，再清理。\n\n现在生成并继续？')) return;
    buildYearStats(Number(year));
  }
  var vCnt = 0, itemCnt = 0, photoCnt = 0;
  var plan = [];
  DB.zones.forEach(function(z) {
    (z.items || []).forEach(function(it) {
      if (!it.variants || !it.variants.length) return;
      var keep = it.variants.filter(function(v) { return !(isVariantDone(v, it) || v.noRestock); });
      var drop = it.variants.filter(function(v) { return isVariantDone(v, it) || v.noRestock; });
      if (drop.length === 0) return;
      drop.forEach(function(v) { photoCnt += ((v.photos || []).length); });
      vCnt += drop.length;
      if (keep.length === 0) itemCnt += 1;
      plan.push({ zone: z, item: it, keep: keep, dropAll: keep.length === 0 });
    });
  });
  if (vCnt === 0) {
    toast('没有用完 / 不再买的品牌可清理');
    return;
  }
  var msg = '将清理 ' + vCnt + ' 个品牌卡片';
  if (itemCnt > 0) msg += '（其中 ' + itemCnt + ' 个物品的品牌会全部清空，物品本身一并移除）';
  msg += '，含约 ' + photoCnt + ' 张照片。\n\n' + year + ' 年度档案已保存消耗量/花费/品牌评价，删了也留着结论。\n\n确定清理？此操作不可撤销。';
  if (!confirm(msg)) return;
  plan.forEach(function(p) {
    if (p.dropAll) {
      p.zone.items = p.zone.items.filter(function(x) { return x.id !== p.item.id; });
    } else {
      p.item.variants = p.keep;
      syncItemFromVariants(p.item);
    }
  });
  saveDB();
  closeModal();
  renderZone();
  if (document.getElementById('home-content')) renderHome();
  toast('🧹 已清理 ' + vCnt + ' 个品牌 · 年度档案保留');
}

function undoFinishVariant(itemId, variantId) {

  if (!item) return;
  var v = item.variants.find(function(vv) { return vv.id === variantId; });

  if (!v.usedUp) {
    // 多规格「本包用完」后的撤销：库存还剩着，只把最近结束的一条记录恢复为使用中
    // （并行场景：只恢复一条，不碰其它仍在使用的记录）
    var reopened = false;
    if (item.usageRecords) {
      for (var i = item.usageRecords.length - 1; i >= 0; i--) {
        var r0 = item.usageRecords[i];
        if (r0.variantId === variantId && r0.endDate && !r0.instant) { r0.endDate = null; reopened = true; break; }
      }
    }
    if (!reopened) { toast('该变体未标记用完'); return; }
    syncItemFromVariants(item);
    saveDB();
    openCardDetail(currentZoneId, itemId);
    toast('已撤销：该包继续使用中');
    return;
  }
  v.usedUp = false;
  v.finishDate = null;
  if (item.usageRecords && item.usageRecords.length > 0) {
    for (var j = item.usageRecords.length - 1; j >= 0; j--) {
      var r = item.usageRecords[j];
      if (r.variantId === variantId && r.endDate && !r.instant) {
        r.endDate = null;
        break;
      }
    }
  }
  reconcileItemState(item);
  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已撤销用完');
}

// ========== 库存盘点（方案A） ==========
// 盘点时间锚点：这笔「盘点差额流水」从哪天开始算？
// 规则：取「最近一条消耗记录的结束日期」与「最近一次盘点日期」中更晚的那个；
//      都没有 → 30 天前兜底。保证盘亏的量落在一段真实空窗期里，不污染之前的记录。
function auditAnchorDate(item) {
  var latest = null;
  (item && item.usageRecords || []).forEach(function (r) {
    if (!r || !r.endDate) return;
    var t = new Date(r.endDate).getTime();
    if (!isNaN(t) && (latest === null || t > latest)) latest = t;
  });
  (item && item.auditHistory || []).forEach(function (a) {
    if (!a || !a.date) return;
    var t = new Date(a.date).getTime();
    if (!isNaN(t) && (latest === null || t > latest)) latest = t;
  });
  if (latest === null) return new Date(Date.now() - 30 * 86400000);
  var d = new Date(latest);
  if (d.getTime() >= Date.now()) return new Date(Date.now() - 86400000); // 锚点不能落在今天及以后
  return d;
}
// 盘点流水工厂：盘亏 → 消耗记录（进速率）；盘盈 → 入库记录（不进速率，只进流水）
// 口径与开封记录对齐：qty=份数（多规格）、contentUsed=含量、specText=展示文本、auditPacks=包数（精确回滚用）
// 【第 13 轮】unitTxt：specText 的单位（即时型按「片/粒」展示；缺省「包」，兼容组合型）
function makeAuditRecord(anchor, now, v, specName, qty, contentUsed, diffPacks, isSurplus, unitTxt) {
  var rec = {
    qty: Math.round(Math.abs(qty) * 100) / 100,
    variantId: v ? v.id : null,
    brand: (v && v.brand) || '',
    isAudit: true,
    note: isSurplus ? '盘盈入库' : '盘点盘亏'
  };
  if (specName) {
    rec.specName = specName;
    rec.specText = specName + '×' + trimNum(Math.abs(diffPacks || 0)) + (unitTxt || '包');
  }
  if (contentUsed) rec.contentUsed = Math.round(Math.abs(contentUsed) * 100) / 100;
  if (diffPacks) rec.auditPacks = Math.round(Math.abs(diffPacks) * 100) / 100;
  if (isSurplus) {
    rec.type = 'surplus';
    rec.date = now.toISOString();
  } else {
    // 防御：锚点与盘点日同天（如一天内盘点两次）→ 起点退到昨天，
    // 绝不让盘亏记录变成 0 天记录被速率过滤掉
    var a2 = anchor;
    if (daysBetween(a2, now) <= 0) a2 = new Date(now.getTime() - 86400000);
    rec.startDate = a2.toISOString();
    rec.endDate = now.toISOString();
  }
  return rec;
}
// ===== 【第 22 轮 · 共性修复】盘点口径统一 =====
// 有规格明细的变体：库存唯一真源 = variantSpecContent（Σ 剩余包数×每包含量×每份规格）。
// v.stock 可能被历史版本写漂（如 1000 vs 明细 100），盘点页绝不能再信任它，
// 否则「当前记录」与规格输入区口径分裂，还会产生假差额流水。
function variantAuditStockOf(v) {
  return variantSpecsOf(v).length ? variantSpecContent(v) : (parseFloat(v.stock) || 0);
}
// 该变体未开包总数（Σ 各规格剩余包数）——「N 包未开」必须用包数，绝不能拿片数冒充
function variantSpecPacksLeft(v) {
  var ss = variantSpecsOf(v); if (!ss.length) return 0;
  var t = 0;
  ss.forEach(function (s) { t += specPacksRemaining(v, s); });
  return Math.round(t * 100) / 100;
}

          html += '<span style="font-size:12px;color:var(--text-secondary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escapeHtml(s.name || ('规格' + (si + 1))) + '</span>';
          html += '<input type="number" class="form-input audit-spec-input" data-vi="' + i + '" data-si="' + si + '" data-mode="' + (isInstA2 ? 'qty' : 'packs') + '" data-unit="' + escapeHtml(s.unit || '') + '" data-content="' + (+s.content || 0) + '" data-packqty="' + pqA + '" data-recorded-packs="' + remainA + '" value="' + remainA + '" min="0" step="1" style="width:70px;text-align:center;font-weight:600" oninput="updateAuditTotal()">';
          html += '<span style="font-size:11px;color:var(--text-tertiary)">' + unitTip + '</span>';
          html += '</div>';
        });

      } else {
        html += '<input type="number" class="form-input audit-variant-stock" data-idx="' + i + '" data-recorded="' + (v.stock || 0) + '" value="' + (v.stock || 0) + '" min="0" step="0.5" style="width:90px;text-align:center;font-size:16px;font-weight:600;flex-shrink:0" oninput="updateAuditTotal()">';
      }

    });
    html += '</div>';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;margin-bottom:8px;border-top:1px solid var(--separator)">';
    html += '<span style="font-size:14px;font-weight:700">实际总数</span>';
    html += '<span style="font-size:18px;font-weight:700;color:var(--primary)" id="audit-total" data-unit="' + unit + '">' + currentStock + unit + '</span>';
    html += '</div>';

  } else {

  html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:12px">按实物清点后填写，用于校正共用物品的消耗。</div>';
  html += '<button class="btn btn-primary btn-full" onclick="saveStockAudit(\'' + itemId + '\')">确认盘点</button>';
  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">取消</button>';
  document.getElementById('modal-content').innerHTML = html;

function updateAuditTotal() {
  var total = 0, recorded = 0;
  document.querySelectorAll('.audit-variant-stock').forEach(function(el) {
    total += parseFloat(el.value) || 0;
    recorded += parseFloat(el.getAttribute('data-recorded')) || 0;
  });
  // 多规格：剩余包数 × 每包含量 × 每份规格；即时型（qty 模式）输入的就是剩余份数（片），× 每份规格
  document.querySelectorAll('.audit-spec-input').forEach(function(el) {
    var c = parseFloat(el.getAttribute('data-content')) || 0;
    var pq = parseFloat(el.getAttribute('data-packqty')) || 1;
    if (el.getAttribute('data-mode') === 'qty') {
      total += (parseFloat(el.value) || 0) * c;
      recorded += (parseFloat(el.getAttribute('data-recorded-packs')) || 0) * c;
    } else {
      total += (parseFloat(el.value) || 0) * pq * c;
      recorded += (parseFloat(el.getAttribute('data-recorded-packs')) || 0) * pq * c;
    }
  });
  total = Math.round(total * 100) / 100;
  recorded = Math.round(recorded * 100) / 100;
  var totalEl = document.getElementById('audit-total');
  if (totalEl) {
    var unit = totalEl.getAttribute('data-unit') || '个';
    totalEl.textContent = total + unit;
  }
  var diffEl = document.getElementById('audit-diff');
  if (diffEl) {
    var diff = Math.round((recorded - total) * 100) / 100;
    if (Math.abs(diff) >= 0.5) {
      diffEl.innerHTML = '⚠️ 与系统记录差 ' + (diff > 0 ? '+' : '') + diff + (totalEl ? totalEl.getAttribute('data-unit') : '个') + '（保存将按实际校正，你可再微调）';
      diffEl.style.color = 'var(--red)';
    } else {
      diffEl.textContent = '与系统记录一致 ✓';
      diffEl.style.color = 'var(--green)';
    }
  }
}

function saveStockAudit(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var variants = item.variants && item.variants.length > 0 ? item.variants : [];
  // 【第 22 轮】recorded 与「当前记录」同源：多规格变体取规格明细真源（绝不信任可能漂移的 v.stock）
  var recorded = 0;
  (item.variants || []).forEach(function(v) { if (!(isSetPackMode(item) && v.opened && !v.usedUp)) recorded += variantAuditStockOf(v); });
  var actual = 0;
  // 盘点流水容器：盘亏/盘盈都先收集，落账后统一写入 usageRecords
  var auditFlows = [];
  var anchorA = auditAnchorDate(item);   // 起点：上次记录结束日 / 上次盘点日
  var nowA = new Date();

  if (variants.length > 0) {
    var ok = true;
    variants.forEach(function(v, i) {
      var spS = (v.specs && v.specs.length) ? v.specs : null;
      if (spS) {
        // 多规格盘点。组合消耗型按「剩余包数」落账；即时消耗型按「剩余份数（片/粒）」落账
        var isInstS13 = (consumeModelOf(item) === 'instant');
        var touched = false;
        var allBad = false;
        spS.forEach(function (s, si) {
          var el = document.querySelector('.audit-spec-input[data-vi="' + i + '"][data-si="' + si + '"]');
          if (!el) return;
          var n = parseFloat(el.value);
          if (isNaN(n) || n < 0) { toast('请输入有效的剩余数量'); ok = false; allBad = true; return; }
          if (isInstS13) {
            // 【第 13 轮】即时型：差额记入规格的已消耗份数（usedQty）或已开包数（含量单位），
            // 构成（单套内包数）与套餐数是购买记录，绝不覆盖
            var remainNowQ = specRemainPieces(v, s);
            var diffQ = Math.round((remainNowQ - n) * 100) / 100; // >0 盘亏份数；<0 盘盈份数
            if (isContentUnitText(s.unit)) {
              s.openPacks = Math.round(Math.max(0, specOpenPacks(s) + diffQ) * 100) / 100;
            } else {
              s.usedQty = Math.round(Math.max(0, specUsedQty(s) + diffQ) * 100) / 100;
            }
            if (diffQ !== 0) {
              auditFlows.push(makeAuditRecord(
                anchorA, nowA, v, (s.name || ('规格' + (si + 1))),
                diffQ,                       // qty = 份数差额（片/粒）
                Math.abs(diffQ) * (+s.content > 0 ? s.content : 1), // 含量口径
                Math.abs(diffQ),             // 回滚基数 = 份数
                diffQ < 0,
                (s.unit || '份')             // specText 单位（片，而不是「包」）
              ));
            }
            touched = true;
            return;
          }
          var remainBefore = specPacksRemaining(v, s);
          var sDiff = Math.round((remainBefore - n) * 100) / 100; // >0 盘亏包数；<0 盘盈包数
          // 剩余包数 → 反算已开包数：openPacks = 套餐数 × 单套包数 − 剩余包数
          var total = variantPacksBought(v) * specPackCount(s);
          s.openPacks = Math.round(Math.max(0, total - n) * 100) / 100;
          s.qty = Math.round(specPackCount(s) * specPackQty(s) * 100) / 100; // 兼容字段：构成口径
          // 盘点差额 → 自动转化为流水（用户要求：绝不悄悄覆盖数字）
          if (sDiff !== 0) {
            var pqS = specPackQty(s), cS = specContentOf(s);
            auditFlows.push(makeAuditRecord(
              anchorA, nowA, v, (s.name || ('规格' + (si + 1))),
              sDiff * pqS,                    // qty = 份数（包数 × 每包含量）
              Math.abs(sDiff) * pqS * cS,     // 含量（与开封记录 contentUsed 同口径）
              Math.abs(sDiff),                // 包数（精确回滚用）
              sDiff < 0
            ));
          }
          touched = true;
        });
        if (allBad) { actual += v.stock || 0; return; }
        if (touched) {
          v.stock = variantSpecContent(v);
          // 套餐数是「购买记录」，盘点只校正剩余量，不覆盖
          if (!v.specsFolded) v.specsFolded = true;
          if (v.stock > 0) {
            v.usedUp = false; v.finishDate = null;
            // 使用中与否以「有没有未结束的开封记录」为准
            v.opened = (item.usageRecords || []).some(function(r) { return r.variantId === v.id && !r.endDate; });
          }
          else { v.usedUp = true; v.opened = false; if (!v.finishDate) v.finishDate = new Date().toISOString(); }
        }
        actual += v.stock || 0;
        return;
      }
      var input = document.querySelector('.audit-variant-stock[data-idx="' + i + '"]');
      if (!input) return; // 使用中跳过盘点，保留原 stock
      var val = parseFloat(input.value);
      if (isNaN(val) || val < 0) { toast('请输入有效数量'); ok = false; return; }
      // 普通变体：差额 → 流水（盘亏=消耗记录；盘盈=入库记录），绝不悄悄覆盖
      var oldStock = Math.round((parseFloat(v.stock) || 0) * 100) / 100;
      var nv = Math.round(val * 100) / 100;
      v.stock = nv;
      var vDiff = Math.round((oldStock - nv) * 100) / 100;
      if (vDiff !== 0) {
        auditFlows.push(makeAuditRecord(anchorA, nowA, v, null, vDiff, null, null, vDiff < 0));
      }
      actual += val;
    });
    if (!ok) return;
  } else {
    var input = document.getElementById('audit-stock');
    actual = parseFloat(input ? input.value : NaN);
    if (isNaN(actual) || actual < 0) { toast('请输入有效数量'); return; }
    var oldItemStock = Math.round((parseFloat(item.stock) || 0) * 100) / 100;
    item.stock = actual;
    var iDiff = Math.round((oldItemStock - actual) * 100) / 100;
    if (iDiff !== 0) {
      auditFlows.push(makeAuditRecord(anchorA, nowA, null, null, iDiff, null, null, iDiff < 0));
    }
  }

  var diff = recorded - actual; // 正数=实际用得更快

  if (!item.auditHistory) item.auditHistory = [];
  item.auditHistory.push({
    date: new Date().toISOString(),
    recorded: recorded,
    actual: actual,
    diff: diff,
    flows: auditFlows.length
  });

  // 盘点差额流水落账：盘亏 → 消耗记录（自动参与速率/年度消耗）；盘盈 → 入库记录（只进流水）
  if (auditFlows.length) {
    if (!item.usageRecords) item.usageRecords = [];
    auditFlows.forEach(function (f) { item.usageRecords.push(f); });
  }

  // 状态对账：按新库存量重算开封/用完状态 + 顶层汇总（日均消耗/年度建议随后自动重算）
  try { reconcileItemState(item); } catch (e) { console.error('盘点对账异常已容错', e); }
  saveDB();
  closeModal();
  try { refreshItemViews(item); } catch (e) { console.error('盘点刷新异常已容错', e); }
  // 【第 13 轮】盘点后重开详情加防御：任何渲染异常都不允许阻断 toast 与后续点击
  try { openCardDetail(currentZoneId, itemId); } catch (e) { console.error('盘点后重开详情异常已容错', e); }
  var lossN = auditFlows.filter(function (f) { return f.type !== 'surplus'; }).length;
  var gainN = auditFlows.length - lossN;
  if (diff === 0 && !auditFlows.length) {
    toast('盘点完成，数量一致');
  } else if (lossN && gainN) {
    toast('📋 盘点完成：' + lossN + ' 条盘亏消耗 + ' + gainN + ' 条盘盈入库已记账');
  } else if (lossN) {
    toast('📋 盘点完成：差额已记为 ' + lossN + ' 条消耗记录（年度消耗自动更新）');
  } else if (gainN) {
    toast('📋 盘点完成：多出的量已记为 ' + gainN + ' 条盘盈入库（不计入消耗）');
  } else {
    toast('盘点完成，数量一致');
  }
}

// ========== 分类管理 ==========
function openCategoryManager() {
  // 【第 23 轮 · 防崩】底部导航「✎」同样是全局按钮，无领地上下文时自动定位（同 openItemForm）
  var zone = getZone(currentZoneId);
  if (!zone) {
    zone = DB.zones.find(function (z) { return z.type === 'consumable'; }) || DB.zones[0] || null;
    if (!zone) { toast('请先创建一个领地'); return; }
    currentZoneId = zone.id;
  }
  var html = '<div class="modal-handle"></div>';

  if (!cat.parentId) {

// ========== 任务委托（原「目标锁定」完全重写） ==========

// ---------- 混合套餐：一个方案可含多种规格（如 44粒装×3盒 + 70粒装×2盒 = 272粒）----------

var SPEC_KINDS = [

  for (var i = 0; i < SPEC_KINDS.length; i++) { if (SPEC_KINDS[i].k === k) return SPEC_KINDS[i].icon; }
  return '🫙';
}
function planSubList(p) {
  return (p.subItems || []).filter(function (s) { return (+s.spec > 0) && (+s.count > 0); });
}
// ---------- v1.7 强制归属：委托必须有父级物品，方案一律继承父级 ----------
// 父级 = 库存里的「物品」（如 面霜），是仓库；方案里的各品牌 = 仓库下的货架。
function taskParentIdOf(t) {
  if (!t) return null;
  if (t.sourceItemId) return t.sourceItemId;
  // 兼容历史数据：从任一方案里回溯来源物品
  var found = null;
  (t.plans || []).forEach(function (p) { if (!found && p && p.sourceItemId) found = p.sourceItemId; });
  return found;
}
// 该委托是否具备凯旋资格（必须挂父级）
function taskCanWin(t) {
  return !!taskParentIdOf(t);
}
// 在父级物品下按品牌名找变体（去掉首尾空白、忽略大小写）
function findVariantByName(item, brandName) {
  if (!item || !item.variants) return null;
  var nm = String(brandName || '').trim().toLowerCase();
  if (!nm) return null;
  var hit = null;
  item.variants.forEach(function (v) {
    if (hit) return;
    if (String(v.brand || '').trim().toLowerCase() === nm) hit = v;

  return hit;
}
function planSubSpec(p) { // 每套（一份套餐）的总含量
  var subs = planSubList(p);
  if (!subs.length) return 0;
  var per = 0;
  subs.forEach(function (s) { per += (+s.spec || 0) * (+s.count || 0); });
  return Math.round(per * 100) / 100;
}
function planSpecText(p) { // "44粒装×3 + 70粒装×2 = 272粒"；带性质图标（🫙正装/♻️替换装/🎁赠品）
  var subs = planSubList(p);
  if (!subs.length) return '';
  var u0 = subs[0].unit || '';
  var parts = subs.map(function (s) {
    var nm = String(s.name || '').trim() || (trimNum(+s.spec) + (s.unit || ''));
    var kd = specKindOf(s);
    var ic = (kd !== 'normal') ? (specKindIcon(kd) + ' ') : '';

}
function planMultiUnit(p) {

}
function planDerived(p) {

  var comboPrice = (+p.comboPrice > 0) ? +p.comboPrice : (qty > 0 ? amount / qty : amount);
  var totalSpec = spec * qty;

}
// 从方案"单位"文本解析每小单位含量："1kg"→1kg、"3kg"→3kg、"500g"→0.5kg、"200ml/瓶"→200ml+小单位名"瓶"
// 解析不了（如纯文字"包"）返回 null
function parseUnitContent(unit) {
  var s = String(unit || '').toLowerCase().trim();
  if (!s) return null;
  var m = s.match(/([0-9.]+)\s*(kg|千克|公斤|g|克|ml|毫升|l|升)/);
  if (!m) return null;
  var v = parseFloat(m[1]); if (!(v > 0)) return null;
  var u = m[2];
  if (u === '千克' || u === '公斤') u = 'kg';
  else if (u === '克') u = 'g';
  else if (u === '毫升') u = 'ml';
  else if (u === 'l' || u === '升') u = 'L';
  if (u === 'g' && v >= 1000) { u = 'kg'; v = v / 1000; }
  if (u === 'ml' && v >= 1000) { u = 'L'; v = v / 1000; }
  // 小单位名：含量匹配之后的剩余文本（"1kg/包"→包）；纯重量则无名
  var name = s.slice(m.index + m[0].length).replace(/^[\s\/\\*x×每\.\-、]+/, '').trim();

}
// 方案总含量：总份数 × 每份含量（单位文本可解析时），如 3套×4包×1kg = 12kg
function planTotalContent(p) {

  var c = parseUnitContent(p.unit);
  if (!c || !(d.totalSpec > 0)) return null;

function planMin(t) { var m = Infinity; (t.plans || []).forEach(function (p) { var a = +p.amount || 0; if (a > 0 && a < m) m = a; }); return m === Infinity ? 0 : m; }
function planMax(t) { var m = 0; (t.plans || []).forEach(function (p) { var a = +p.amount || 0; if (a > m) m = a; }); return m; }
// 已勾选「本次购买」的方案金额合计（p.buy !== false 视为勾选）
function taskSelectedAmount(t) {

  return Math.round(s * 100) / 100;

function taskSelectedCount(t) {

}
// 顶部主横幅：实时反映当前勾选合计金额（无勾选显示 ¥0.00）
function taskBannerMainHtml() {

  return '🛒 当前已选采购总额：' + fmtMoney(selAmt) + '（' + selCnt + ' 项）';

// 顶部副横幅：本区域全部目标的最低解锁成本（保持原有信息，不丢失）
function taskBannerSubHtml(need, cnt) {

function refreshTaskBanner() {

function planWeightStr(p) {

  var tc = planTotalContent(p);
  if (tc) return '📦 ≈' + trimNum(tc.total) + tc.u; // 真总重量（套×每套含×每份含量）
  return '📦 共 ' + trimNum(d.totalSpec) + (p.unit ? ' ' + p.unit : ' 份');
}
function taskWeightStr(t) {
  var inProgress = (t.status === '进行中' || t.status === '凯旋');
  var arr = [];
  (t.plans || []).forEach(function (p) {
    if (inProgress && p.buy === false) return;
    var tc = planTotalContent(p);
    if (tc) { arr.push({ v: tc.total, s: tc.u }); return; }
    var d = planDerived(p);
    if (d.totalSpec > 0) arr.push({ v: d.totalSpec, s: p.unit ? ' ' + p.unit : ' 份' });
  });

  var keys = Object.keys(suffixes);

}

// ---------- 渲染入口 ----------
function renderTasks() {

    var need = 0, cnt = 0, selAmt = 0, selCnt = 0;
    DB.tasks.forEach(function (t) {
      if (t.status !== '待接') return;
      need += planMin(t); cnt++;
      selAmt += taskSelectedAmount(t);
      selCnt += taskSelectedCount(t);
    });
    // 顶部横幅数字随「本次购买」勾选实时联动：
    //   无勾选 → 「当前已选采购总额：¥0.00」
    //   有勾选 → 显示已勾选方案合计金额
    // 用 id 挂载，勾选时原地刷新（taskPlanBuyToggle 调用），零延迟
    html += '<div class="task-banner orange" id="task-banner-main">' + taskBannerMainHtml() + '</div>';
    html += '<div class="task-banner-sub" id="task-banner-sub">' + taskBannerSubHtml(need, cnt) + '</div>';
  } else if (s.tab === '搁置') {
    var saved = 0, sc = 0;
    DB.tasks.forEach(function (t) { if (t.status === '搁置') { saved += planMin(t); sc++; } });
    html += '<div class="task-banner green">成功抵御欲望侵蚀，回收 ' + fmtMoney(saved) + ' 金币！（' + sc + ' 项）</div>';
  }

  // 工具栏
  html += '<div class="task-toolbar">';
  html += '<button class="task-tool-btn" onclick="taskToggleSearch()">🔍 搜索</button>';
  html += '<button class="task-tool-btn' + (s.sel ? ' on' : '') + '" onclick="taskToggleSel()">' + (s.sel ? '✓ 退出多选' : '☑️ 多选') + '</button>';
  if (s.tab === '待接') html += '<button class="task-tool-btn primary" style="margin-left:auto" onclick="taskOpenForm()">＋ 新增委托</button>';
  else if (s.tab === '凯旋' || s.tab === '搁置') html += '<button class="task-tool-btn" style="margin-left:auto" onclick="taskClearModal()">🔄 重置</button>';
  else html += '<span class="spacer"></span>';
  html += '</div>';

  // 搜索框
  if (s.searchOpen) {
    html += '<div class="task-search-row"><input type="text" class="form-input" id="task-search-input" placeholder="搜委托名或方案名…" value="' + escTask(s.search) + '" oninput="taskOnSearch(this.value)"></div>';
  }

  // 列表
  var list = DB.tasks.filter(function (t) { return t.status === s.tab; });
  if (s.search) list = list.filter(function (t) { return taskMatch(t, s.search); });
  if (list.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">这里还没有委托<br>点击右上角「＋ 新增委托」开始登记</div></div>';
  } else {
    list.forEach(function (t) { html += taskCard(t); });
  }

  // 多选操作条
  if (s.sel) {
    html += '<div class="task-selbar">';
    var allSel = list.length > 0 && list.every(function (t) { return s.sel.has(t.id); });
    html += '<button class="task-tool-btn" onclick="taskSelAll()">' + (allSel ? '取消全选' : '全选') + '</button>';
    if (s.tab === '待接') {
      html += '<button class="btn btn-primary btn-sm" onclick="taskBatchStrike()">⚔️ 出击</button>';
      html += '<button class="btn btn-outline btn-sm" onclick="taskBatchAbandon()">🚫 放弃</button>';
    } else if (s.tab === '进行中') {
      html += '<button class="btn btn-success btn-sm" onclick="taskBatchWin()">🏆 凯旋</button>';
      html += '<button class="btn btn-outline btn-sm" onclick="taskBatchAbandon()">🚫 放弃</button>';
    } else {
      html += '<button class="btn btn-primary btn-sm" onclick="taskBatchRestart()">🔁 重启</button>';
    }
    html += '<button class="btn btn-danger btn-sm" onclick="taskBatchDestroy()">🗑️ 删除</button>';
    html += '</div>';
  }

  document.getElementById('pool-content').innerHTML = html;
}

// ---------- 卡片 ----------
function taskCard(t) {
  var s = taskState;
  var selMode = !!s.sel;
  var selected = selMode && s.sel.has(t.id);
  var html = '<div class="pool-item task-card' + (selected ? ' selon' : '') + '" data-task-id="' + t.id + '" onclick="taskCardTap(\'' + t.id + '\')">';

  // 头部：标题 + 状态标签
  html += '<div class="pool-header">';
  if (selMode) {
    html += '<div class="task-check" onclick="event.stopPropagation();taskSelToggle(\'' + t.id + '\')">' + (selected ? '✓' : '') + '</div>';
  }
  var title = escTask(t.name);
  if (t.status === '进行中') { var buyCnt = (t.plans || []).filter(function (p) { return p.buy !== false; }).length; if (buyCnt > 0) title += '（采购 ' + buyCnt + ' 项）'; }
  html += '<div style="flex:1;min-width:0"><div class="pool-name">' + title + '</div>';
  var meta = '';
  if (t.zoneId) { var zone = getZone(t.zoneId); if (zone) meta += zone.icon + ' ' + zone.name; }
  if (t.categoryId) { var cp = getCategoryPath(t.zoneId, t.categoryId); if (cp) meta += ' · ' + cp; }
  if (t.createdAt) meta += ' · ' + t.createdAt;
  if (meta) html += '<div class="pool-meta">' + meta + '</div>';
  html += '</div>';
  var stCls = t.status === '待接' ? 'status-pending' : (t.status === '进行中' ? 'status-decided' : (t.status === '凯旋' ? 'status-win' : 'status-given-up'));
  var stTxt = t.status === '待接' ? '待接' : (t.status === '进行中' ? '进行中' : (t.status === '凯旋' ? '凯旋' : '搁置'));
  html += '<span class="pool-status ' + stCls + '">' + stTxt + '</span>';
  html += '</div>';

  // 价格 / 重量行
  if (t.status === '进行中' || t.status === '凯旋') {
    var lpw = taskWeightStr(t);
    var lpAmt = t.lockedPlanId ? findPlan(t, t.lockedPlanId) : null;
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">💰 赏金 ' + (lpAmt ? fmtMoney(lpAmt.amount) : '') + (lpw ? ' · ' + lpw : '') + '</div>';
  } else if (t.status === '搁置') {
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">💰 放下省下 ' + fmtMoney(planMin(t)) + '</div>';
  } else {
    var w = taskWeightStr(t);
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:2px">' + taskPriceLabel(t) + (w ? ' · ' + w : '') + '</div>';
    var pn = (t.plans || []).length;
    if (pn > 1) {
      var buyN = 0, selAmt = 0;
      (t.plans || []).forEach(function (p) { if (p.buy !== false) { buyN++; selAmt += (+p.amount || 0); } });
      html += '<div style="font-size:12px;font-weight:700;margin-top:4px;color:' + (buyN ? 'var(--accent)' : 'var(--red)') + '">☑️ 已选 ' + buyN + '/' + pn + ' 项采购 · 合计 ' + fmtMoney(selAmt) + (buyN ? '' : '（出击前请勾选要买的）') + '</div>';
    }
  }

  // 备注
  if (t.note) html += '<div class="pool-meta" style="margin-top:6px;color:var(--text-secondary)">' + escTask(t.note) + '</div>';

  // 同类库存提醒（保留特色）
  html += taskStockWarn(t);

  // 任务级照片（旧数据迁移带过来的）
  if (t.photos && t.photos.length) {
    html += '<div style="display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none">';
    t.photos.forEach(function (ph) { html += '<img src="' + ph + '" style="width:54px;height:54px;border-radius:8px;object-fit:cover;flex-shrink:0">'; });
    html += '</div>';
  }

  // 翻面提示
  if (!selMode && t.plans && t.plans.length > 0) {
    html += '<div style="margin-top:8px;font-size:12px;color:var(--accent)">👆 点卡片翻面看 ' + t.plans.length + ' 个备选方案</div>';
  }

  // 操作按钮
  html += '<div class="pool-actions">' + taskActionButtons(t) + '</div>';

  // 背面：备选方案
  html += '<div class="task-back"><div class="task-back-inner">';
  html += '<div style="font-size:13px;font-weight:700;margin-bottom:8px">📋 备选方案</div>';
  sortPlans(t).forEach(function (p) {
    var mark = '';
    if (t.status === '凯旋') mark = (p.buy !== false) ? '✅ 已执行' : '—';
    else if (t.status === '进行中') mark = (p.buy !== false) ? '⚔️ 采购中' : '—';
    else mark = '🟢 待选';
    var d = planDerived(p);
    var line = fmtMoney(p.amount);
    var ws = planWeightStr(p); if (ws) line += ' · ' + ws;
    var tcL = planTotalContent(p);
    if (tcL && tcL.total > 0) line += ' · ≈' + fmtMoney((+p.amount || 0) / tcL.total) + '/' + tcL.u;
    else if (d.unitPrice > 0) line += ' · ≈' + fmtMoney(d.unitPrice) + '/' + (p.unit || '');
    if (p.note) line += ' · ' + escTask(p.note);
    html += '<div class="task-plan-row">';
    if (p.photos && p.photos.length) html += '<img src="' + p.photos[0] + '" style="width:46px;height:46px;border-radius:8px;object-fit:cover;flex-shrink:0">';
    else html += '<div style="width:46px;height:46px;border-radius:8px;background:var(--separator);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px">📷</div>';
    html += '<div style="flex:1;min-width:0"><div class="pp-name">' + escTask(p.name || '未命名') + ' <span style="font-size:11px;font-weight:600;color:var(--text-secondary)">' + mark + '</span>' + planBuyChip(t, p) + (p.sourceVariantId ? ' <span style="font-size:11px;color:var(--accent)">↩库存</span>' : (p.sourceItemId ? ' <span style="font-size:11px;color:var(--accent)">↩新品</span>' : '')) + '</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px">' + line + '</div></div>';
    html += '</div>';
  });
  html += '</div></div>';

  html += '</div>';
  return html;
}

// 备选方案的「本次购买」标记：待接状态下可点击直接切换是否采购
function planBuyChip(t, p) {
  var on = p.buy !== false;
  if (t.status === '待接') {
    return '<span class="pp-buy tap' + (on ? '' : ' off') + '" onclick="event.stopPropagation();taskPlanBuyToggle(\'' + t.id + '\',\'' + p.id + '\')">' + (on ? '本次购买✓' : '不采购') + '</span>';
  }
  return '<span class="pp-buy' + (on ? '' : ' off') + '">' + (on ? '本次购买✓' : '不采购') + '</span>';
}
function taskPlanBuyToggle(tid, pid) {
  var t = taskById(tid); if (!t) return;
  if (t.status !== '待接') { toast('已出击的委托改不了啦'); return; }
  var p = findPlan(t, pid); if (!p) return;
  var on = (p.buy === false);
  p.buy = on;
  saveDB();
  toast(on ? '☑️ 本次购买：' + (p.name || '方案') : '⬜ 不采购：' + (p.name || '方案'));
  // 关键：横幅金额随勾选实时刷新（原地更新，勾选/取消的瞬间生效，无需退出重进）
  refreshTaskBanner();
  renderTasks();
  // 刷新后重新同步一次横幅（renderTasks 已重绘含横幅，此处兜底保证数字正确）
  refreshTaskBanner();
  var card = document.querySelector('.task-card[data-task-id="' + Number(tid) + '"]');
  if (card) card.classList.add('flipped');
  taskHaptic();
}

function taskStockWarn(t) {
  if (!t.zoneId) return '';
  var zone = getZone(t.zoneId); if (!zone) return '';
  var tName = String(t.name || '').trim().toLowerCase();
  if (!tName) return '';
  // 「同类」以产品本身为准：任务方案关联的物品，或物品名与任务名一致。
  // 不按分类聚合——宠物王国里的猫砂/零食/保健品替代不了猫粮，混在一起提示毫无意义
  var linkedItemIds = {};
  (t.plans || []).forEach(function (p) {
    if (p.sourceItemId) linkedItemIds[p.sourceItemId] = true;
    if (p.sourceVariantId) {
      zone.items.forEach(function (it) {
        if ((it.variants || []).some(function (v) { return v.id === p.sourceVariantId; })) linkedItemIds[it.id] = true;
      });
    }
  });
  var existing = zone.items.filter(function (it) {
    if (it.archived) return false;
    return linkedItemIds[it.id] || String(it.name || '').trim().toLowerCase() === tName;
  });
  if (existing.length > 0) {
    if (zone.type === 'durable') return '<div class="pool-warn">⚠️ 你已经有 ' + existing.length + ' 件「' + escTask(t.name) + '」了，确定要买吗？</div>';
    var parts = existing.slice(0, 3).map(function (it) { return it.name + ' ' + stockSummaryOf(it); });
    var more = existing.length > 3 ? ' 等 ' + existing.length + ' 种' : '';
    return '<div class="pool-warn">⚠️ 已有库存：' + escTask(parts.join('、')) + more + '</div>';
  }
  return '<div class="pool-ok">✓ 该产品暂无库存，可以买</div>';
}

function taskActionButtons(t) {
  var h = '';
  if (t.status === '待接') {
    h += '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();taskEdit(\'' + t.id + '\')">✎ 编辑</button>';
    h += '<button class="btn btn-primary btn-sm" style="flex:1" onclick="event.stopPropagation();taskStrike(\'' + t.id + '\')">⚔️ 出击</button>';
    h += '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();taskAbandon(\'' + t.id + '\')">放弃</button>';
    h += '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();taskDestroy(\'' + t.id + '\')">🗑️</button>';
  } else if (t.status === '进行中') {
    // v1.7：未绑定父级物品 → 凯旋按钮禁用（点不动），并给出原因
    var canWin = taskCanWin(t);
    h += '<button class="btn btn-success btn-sm" style="flex:1' + (canWin ? '' : ';opacity:.45') + '" '
      + (canWin ? ('onclick="event.stopPropagation();taskWin(\'' + t.id + '\')"') : 'onclick="event.stopPropagation();toast(\'⚠️ 请先编辑本委托，从库存引用一个父级物品\')"')
      + '>' + (canWin ? '🏆 凯旋' : '🏆 凯旋（需先绑父级）') + '</button>';
    h += '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();taskAbandon(\'' + t.id + '\')">放弃</button>';
    h += '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();taskDestroy(\'' + t.id + '\')">🗑️</button>';
  } else {
    h += '<button class="btn btn-primary btn-sm" style="flex:1" onclick="event.stopPropagation();taskRestart(\'' + t.id + '\')">🔁 重启</button>';
    h += '<button class="btn btn-outline btn-sm" onclick="event.stopPropagation();taskDestroy(\'' + t.id + '\')">🗑️ 删除</button>';
  }
  return h;
}

function taskCardTap(id) {
  var n = Number(id);
  var s = taskState;
  if (s.sel) { taskSelToggle(n); return; }
  var card = document.querySelector('.task-card[data-task-id="' + n + '"]');
  if (card) card.classList.toggle('flipped');
  taskHaptic();
}

// ---------- 标签 / 搜索 / 多选 ----------
function taskSwitchTab(key) { taskState.tab = key; taskState.sel = null; taskState.searchOpen = false; taskState.search = ''; renderTasks(); taskHaptic(); }
function taskToggleSearch() { taskState.searchOpen = !taskState.searchOpen; if (!taskState.searchOpen) taskState.search = ''; renderTasks(); }
function taskOnSearch(v) {
  taskState.search = v;
  renderTasks();
  var inp = document.getElementById('task-search-input');
  if (inp) { inp.focus(); var len = inp.value.length; try { inp.setSelectionRange(len, len); } catch (e) {} }
}
function taskToggleSel() { taskState.sel = taskState.sel ? null : new Set(); renderTasks(); }
function taskSelToggle(id) {
  var n = Number(id);
  if (!taskState.sel) return;
  if (taskState.sel.has(n)) taskState.sel.delete(n); else taskState.sel.add(n);
  var card = document.querySelector('.task-card[data-task-id="' + n + '"]');
  if (card) card.classList.toggle('selon', taskState.sel.has(n));
}
function taskSelAll() {
  var s = taskState; if (!s.sel) return;
  var list = DB.tasks.filter(function (t) { return t.status === s.tab; });
  if (s.search) list = list.filter(function (t) { return taskMatch(t, s.search); });
  var allSel = list.length > 0 && list.every(function (t) { return s.sel.has(t.id); });
  list.forEach(function (t) { if (allSel) s.sel.delete(t.id); else s.sel.add(t.id); });
  renderTasks();
}

// ---------- 单条操作 ----------
// ---------- 出击：弹窗内逐委托勾选本次要买的方案 ----------
var _strikeSel = null;
function taskStrike(id) {
  var t = taskById(id); if (!t) return;
  if (!t.plans || t.plans.length === 0) { toast('先添加备选方案'); return; }
  if (t.plans.length === 1) {
    t.plans[0].buy = true; t.status = '进行中';
    saveDB(); renderTasks(); toast('⚔️ 已出击 · ' + (t.plans[0].name || '方案')); taskHaptic(); return;
  }
  openStrikeModal([t]);
}
function openStrikeModal(tasks) {
  _strikeSel = { tasks: tasks.map(function (t) { return t.id; }), buy: {} };
  tasks.forEach(function (t) {
    (t.plans || []).forEach(function (p) { _strikeSel.buy[t.id + '|' + p.id] = (p.buy !== false); });
  });
  renderStrikeModal();
  document.getElementById('modal-overlay').classList.add('show');
  taskHaptic();
}
function strikeTogglePlan(tid, pid, on) {
  if (!_strikeSel) return;
  _strikeSel.buy[tid + '|' + pid] = !!on;
  renderStrikeModal(); taskHaptic();
}
function strikeChecked() {
  var n = 0, amt = 0;
  if (!_strikeSel) return { n: 0, amt: 0 };
  _strikeSel.tasks.forEach(function (tid) {
    var t = taskById(tid); if (!t) return;
    (t.plans || []).forEach(function (p) {
      if (_strikeSel.buy[tid + '|' + p.id]) { n++; amt += (+p.amount || 0); }
    });
  });
  return { n: n, amt: amt };
}
function renderStrikeModal() {
  if (!_strikeSel) return;
  var tasks = _strikeSel.tasks.map(taskById).filter(Boolean);
  var head = tasks.length > 1 ? (tasks.length + ' 个委托') : escTask(tasks[0].name);
  var html = '<div class="modal-handle"></div><div class="modal-title">⚔️ 出击 · 选择本次采购</div>';
  html += '<div style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">' + head + ' · 在每个委托下勾选要买的方案，凯旋时只回写勾选项</div>';
  tasks.forEach(function (t) {
    html += '<div style="margin-bottom:14px"><div style="font-size:13px;font-weight:700;margin-bottom:6px">' + escTask(t.name) + ' <span style="font-weight:400;font-size:12px;color:var(--text-secondary)">（' + (t.plans || []).length + ' 个备选）</span></div>';
    sortPlans(t).forEach(function (p) {
      var key = t.id + '|' + p.id;
      var on = !!_strikeSel.buy[key];
      var d = planDerived(p);
      var line = fmtMoney(p.amount);
      var ws = planWeightStr(p); if (ws) line += ' · ' + ws;
      var tcL = planTotalContent(p);
      if (tcL && tcL.total > 0) line += ' · ≈' + fmtMoney((+p.amount || 0) / tcL.total) + '/' + tcL.u;
      else if (d.unitPrice > 0) line += ' · ≈' + fmtMoney(d.unitPrice) + '/' + (p.unit || '');
      if (p.note) line += ' · ' + escTask(p.note);
      html += '<label class="strike-plan' + (on ? ' on' : '') + '"><input type="checkbox" ' + (on ? 'checked' : '') + ' onchange="strikeTogglePlan(\'' + t.id + '\',\'' + p.id + '\',this.checked)">';
      html += '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">' + escTask(p.name || '未命名') + (p.sourceVariantId ? ' <span style="font-size:11px;color:var(--accent)">↩库存</span>' : (p.sourceItemId ? ' <span style="font-size:11px;color:var(--accent)">↩新品</span>' : '')) + '</div><div style="font-size:12px;color:var(--text-secondary);margin-top:2px">' + line + '</div></div></label>';
    });
    html += '</div>';
  });
  var cc = strikeChecked();
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0 10px"><span style="font-size:13px;color:var(--text-secondary)">已勾选 <b style="color:var(--text)">' + cc.n + '</b> 项</span><span style="font-size:16px;font-weight:800">合计 ' + fmtMoney(cc.amt) + '</span></div>';
  html += '<button class="btn btn-primary btn-full" onclick="confirmStrike()" ' + (cc.n ? '' : 'disabled style="opacity:.45"') + '>⚔️ 确认出击</button>';
  if (!cc.n) html += '<div style="font-size:12px;color:var(--red);text-align:center;margin-top:8px">至少为一个委托勾选要买的方案</div>';
  document.getElementById('modal-content').innerHTML = html;
}
function confirmStrike() {
  if (!_strikeSel) return;
  var tasks = _strikeSel.tasks.map(taskById).filter(Boolean);
  var struck = 0, skipped = 0;
  tasks.forEach(function (t) {
    var buys = [];
    (t.plans || []).forEach(function (p) {
      var on = !!_strikeSel.buy[t.id + '|' + p.id];
      p.buy = on;
      if (on) buys.push(p);
    });
    if (!buys.length) { skipped++; return; }
    t.status = '进行中';
    struck++;
  });
  _strikeSel = null;
  if (!struck) { toast('至少为一个委托勾选要买的方案'); return; }
  closeModal(); saveDB(); renderTasks();
  toast('⚔️ 出击 ' + struck + ' 项' + (skipped ? '，' + skipped + ' 项未勾选保持待接' : ''));
  taskHaptic();
}

function findItemByIdGlobal(itemId) {
  for (var zi = 0; zi < DB.zones.length; zi++) {
    var z = DB.zones[zi];
    for (var ii = 0; ii < (z.items || []).length; ii++) {
      if (z.items[ii].id === itemId) return z.items[ii];
    }
  }
  return null;
}

// v1.7：旧的 doWin / winMultiSpec（会「凭空建独立物品」）已被 doWinSettle 全面取代。
// ===== v1.7 凯旋回填：智能归位（不覆盖，只新增）=====
// 铁律：
//   ① 只在父级物品（仓库）下操作，绝不新建独立物品；
//   ② 品牌名匹配到已有变体 → 合并；匹配不到 → 在父级下新建货架；
//   ③ 旧变体（哪怕库存为 0）的历史数据一字不动；
//   ④ 价格只写「实付金额」与价格历史，绝不参与库存数量/消耗计算。
function doWinSettle(ws) {
  var rows = ws.rows || [];
  var createdVariants = 0, mergedVariants = 0;
  // 按 任务|方案|目标变体 聚合：同一方案的多条明细（正装/替换装/赠品）落到同一个变体的 specs 里
  var groups = {};
  rows.forEach(function (r) {
    var gk = r.taskId + '|' + r.planId + '|' + (r.targetVariantId || r._defaultTarget || '__new__');
    if (!groups[gk]) {
      groups[gk] = {
        taskId: r.taskId, planId: r.planId, parentId: r.parentId,
        targetVariantId: r.targetVariantId || r._defaultTarget || '__new__',
        rows: [], amount: Math.round((+r.amount || 0) * 100) / 100,
        comboPrice: r.comboPrice || 0, brand: r.name
      };
    }
    groups[gk].rows.push(r);
  });
  Object.keys(groups).forEach(function (gk) {
    var g = groups[gk];
    g.brand = g.rows[0].name;
  });

  Object.keys(groups).forEach(function (gk) {
    var g = groups[gk];
    // ① 父级物品（仓库）必须存在 —— 否则跳过（绝不凭空建物品）
    var item = findItemByIdGlobal(g.parentId);
    if (!item) return;
    if (!item.variants) item.variants = [];

    // ② 确定目标变体：显式指定 > 品牌名匹配 > 新建
    var v = null;
    if (g.targetVariantId && g.targetVariantId !== '__new__') {
      item.variants.forEach(function (x) { if (x.id === g.targetVariantId) v = x; });
    }
    if (!v) v = findVariantByName(item, g.brand);
    var isNewVariant = false;
    if (!v) {
      // 新建货架：初始为空，明细与库存随后填入（不碰任何旧变体）
      v = {
        id: genId(), brand: g.brand || '新品牌',
        packCount: 0, packPrice: 0, packQty: 1, packUnit: (g.rows[0].unit || '个'),
        packWeight: 0, packWeightUnit: 'kg',
        specs: [], stock: 0, price: 0, totalPrice: 0,
        photos: [], notes: '', opened: false, usedUp: false, openQty: 0,
        feeling: null, shelfLife: null, productionDate: null,
        createdAt: new Date().toISOString()
      };
      item.variants.push(v);
      isNewVariant = true;
      createdVariants++;
    } else {
      mergedVariants++;
    }

    // ③ 本次到货明细 → 该变体的「单套构成」specs（v1.6 语义）
    //    本次凯旋 = 又买了 1 套（含若干件）：明细按实际写，套餐数 +1
    if (!v.specs) v.specs = [];
    var u0 = g.rows[0].unit || '';
    g.rows.forEach(function (r) {
      var cnt = +r.actCount || 0, sp = +r.actSpec || 0;
      if (!(cnt > 0)) return;
      // 同一变体内，按「名称+性质」视为同一规格（避免重复堆行）
      var hit = null;
      v.specs.forEach(function (s) {
        if (hit) return;
        if (String(s.name || '').trim() === String(r.name || '').trim() && specKindOf(s) === r.kind) hit = s;
      });
      if (hit) {
        hit.packCount = Math.round(((+hit.packCount || 0) + cnt) * 100) / 100;
        hit.packQty = sp;
        if (!hit.unit) hit.unit = r.unit || '';
        hit.kind = r.kind;
        hit.qty = Math.round((+hit.packCount || 0) * sp * 100) / 100;
      } else {
        v.specs.push({
          id: genId(), name: r.name, kind: r.kind,
          packCount: cnt,                       // 单套内该规格件数
          packQty: sp,                          // 每件容量
          content: 1,                           // 每份规格（默认 1）
          unit: r.unit || '',
          qty: Math.round(cnt * sp * 100) / 100,
          openPacks: 0
        });
      }
    });
    // 套餐数 +1（本次买到 1 套）；构成永不被折算写回
    v.packCount = Math.round(((+v.packCount || 0) + 1) * 100) / 100;
    if (u0) v.packUnit = u0;
    var firstUnit = (v.specs[0] && v.specs[0].unit) || '';
    if (firstUnit) v.packWeightUnit = firstUnit;
    var perSetPieces = variantSpecPerSetPieces(v);
    if (perSetPieces > 0) v.packQty = perSetPieces;
    // 库存 = Σ 剩余包数 × 每包含量 × 每份规格（自动含本次新增）
    v.stock = variantSpecStockCalc(v);
    if (v.stock > 0) { v.usedUp = false; v.finishDate = null; }
    delete v.noRestock;   // 又买回来了 → 恢复计入补货提醒
    // ④ 价格只记账
    var amt = Math.round((+g.amount || 0) * 100) / 100;
    if (amt > 0) {
      v.totalPrice = Math.round(((+v.totalPrice || 0) + amt) * 100) / 100;
      if (g.comboPrice > 0) v.packPrice = g.comboPrice;
      v.price = v.stock > 0 ? Math.round((v.totalPrice / v.stock) * 100) / 100 : (v.price || 0);
    }
    // ⑤ 价格历史（含完整明细文字）
    if (!item.priceHistory) item.priceHistory = [];
    var specTxt = v.specs.map(function (s) {
      return specKindIcon(specKindOf(s)) + (s.name || '') + '×' + trimNum(s.packCount) + (s.unit || '');
    }).join(' + ');
    item.priceHistory.push({
      date: new Date().toISOString(), channel: '', quantity: 1,
      totalPrice: amt, unitPrice: 0,
      notes: '任务委托·凯旋结算' + (isNewVariant ? '（新建货架 ' + v.brand + '）' : '（并入货架 ' + v.brand + '）') + '：' + specTxt,
      brand: v.brand || '', attachments: []
    });
    // ⑥ 物品级汇总（其它变体不受影响）
    syncItemFromVariants(item);
    item.currentPrice = (item.variants || []).reduce(function (s, x) {
      return s + (x.totalPrice || ((x.price || 0) * (x.stock || 0)));
    }, 0);
  });

  // ⑦ 实付金额覆盖（仅记账，不影响库存数量）
  if (ws.amountOverride !== undefined && ws.amountOverride !== null && ws.amountOverride !== '') {
    Object.keys(groups).forEach(function (gk) {
      var g = groups[gk];
      var it = findItemByIdGlobal(g.parentId);
      if (!it || !it.priceHistory || !it.priceHistory.length) return;
      var last = it.priceHistory[it.priceHistory.length - 1];
      last.totalPrice = Math.round((parseFloat(ws.amountOverride) || 0) * 100) / 100;
      last.notes += '（实付 ' + trimNum(parseFloat(ws.amountOverride) || 0) + '）';
    });
  }

  // ⑧ 任务状态流转
  (ws.taskIds || []).forEach(function (tid) {
    var t = taskById(tid);
    if (!t) return;
    t.status = '凯旋';
    t.lockedPlanId = null;
  });

  var sum = '';
  if (createdVariants) sum += '新建 ' + createdVariants + ' 个货架';
  if (mergedVariants) sum += (sum ? '，' : '') + '并入 ' + mergedVariants + ' 个货架';
  return { createdVariants: createdVariants, mergedVariants: mergedVariants, summary: sum };
}

// ===== v1.7 凯旋结算页 =====
// 抗现实波动：预估 ≠ 实际。凯旋第一步永远是打开结算页，核对「实付金额 / 实际件数 / 实际规格 / 归属变体」，
// 用户点「确认入库」后，右侧实际数据才会写进库存。绝不再直接自动入库。
var _winSettle = null;   // { taskIds:[], rows:[...], mode:'single'|'batch', idx }

// 每行 = 一个「方案 × 明细性质」，是结算与入库的最小单位
function settleRowsOf(t, plan) {
  var rows = [];
  var subs = planSubList(plan);
  var d = planDerived(plan);
  var qty = d.qty > 0 ? d.qty : 1;
  if (subs.length) {
    // 有明细：逐条明细 → 一行（正装/替换装/赠品各自独立核对）
    subs.forEach(function (s, k) {
      rows.push({
        key: String(plan.id) + '#' + k,
        planId: plan.id, subIdx: k,
        kind: specKindOf(s),
        name: String(s.name || '').trim() || (trimNum(+s.spec) + (s.unit || '')),
        planCount: (+s.count || 0) * qty,        // 预估件数（单套件数 × 套数）
        planSpec: +s.spec || 0,                   // 预估单件容量
        unit: s.unit || '',
        actCount: (+s.count || 0) * qty,          // 实际件数（默认=预估，可改）
        actSpec: +s.spec || 0,                    // 实际单件容量（可改）
        _c: String((+s.count || 0) * qty), _s: String(+s.spec || 0)
      });
    });
  } else {
    // 无明细：整条方案 → 一行
    rows.push({
      key: String(plan.id) + '#-1',
      planId: plan.id, subIdx: -1,
      kind: 'normal',
      name: String(plan.name || '').trim() || '（未命名）',
      planCount: qty, planSpec: +plan.spec || 1, unit: plan.unit || '',
      actCount: qty, actSpec: +plan.spec || 1,
      _c: String(qty), _s: String(+plan.spec || 1)
    });
  }
  return rows;
}
// 打开结算页：单个或批量（批量时逐个确认）
function taskWin(id) {
  var t = taskById(id); if (!t) return;
  if (!taskCanWin(t)) { toast('⚠️ 这个委托没有绑定父级物品，无法凯旋入库'); return; }
  var buys = (t.plans || []).filter(function (p) { return p.buy !== false; });
  if (buys.length === 0) { toast('请先勾选「本次购买」方案'); return; }
  openWinSettle([t], 'single');
}
function openWinSettle(tasks, mode) {
  var rows = [], order = [];
  tasks.forEach(function (t) {
    (t.plans || []).forEach(function (p) {
      if (p.buy === false) return;
      settleRowsOf(t, p).forEach(function (r) {
        r.taskId = t.id;
        r.amount = Math.round((+p.amount || 0) * 100) / 100;   // 该方案预估金额（记在方案级）
        r.comboPrice = +p.comboPrice || 0;
        r.parentId = taskParentIdOf(t);
        rows.push(r);
      });
    });
    order.push(t.id);
  });
  if (!rows.length) { toast('没有可入库的方案'); return; }
  // 归属：默认父级物品；已有变体默认选中（按方案来源 or 品牌名匹配）
  _winSettle = { taskIds: order, rows: rows, mode: mode || 'single' };
  renderWinSettle();
  document.getElementById('modal-overlay').classList.add('show');
  taskHaptic();
}

function winSettleSet(i, field, val) {
  if (!_winSettle || !_winSettle.rows[i]) return;
  var r = _winSettle.rows[i];
  if (field === 'actCount') { r._c = val; r.actCount = parseFloat(val) || 0; }
  else if (field === 'actSpec') { r._s = val; r.actSpec = parseFloat(val) || 0; }
  else if (field === 'targetVariantId') { r.targetVariantId = val; }
  // 重绘结算页（保留输入框焦点，避免打字中断）
  renderWinSettleKeepFocus(i);
}
// 重绘但保护焦点：记录当前焦点索引后恢复
function renderWinSettleKeepFocus(idx) {
  var act = document.activeElement;
  var tag = act ? act.tagName : '', val = act ? act.value : '';
  var all = document.querySelectorAll('#modal-content input, #modal-content select');
  var pos = -1;
  for (var i = 0; i < all.length; i++) { if (all[i] === act) { pos = i; break; } }
  renderWinSettle();

    var na = document.querySelectorAll('#modal-content input, #modal-content select');
    if (na[pos]) { na[pos].focus(); try { na[pos].setSelectionRange(val.length, val.length); } catch (e) {} }

  var ts = getSelTasks().filter(function (t) { return t.status === '进行中'; });
  if (!ts.length) { toast('没有「进行中」的委托'); return; }
  var ok = ts.filter(function (t) { return taskCanWin(t) && (t.plans || []).some(function (p) { return p.buy !== false; }); });
  var skip = ts.length - ok.length;
  if (!ok.length) { toast('选中的委托都没有绑定父级物品，无法凯旋入库'); return; }
  // v1.7：批量凯旋也走结算页 —— 逐条核对实际数据，绝不静默入库
  openWinSettle(ok, 'batch');
  if (skip) toast('⚔️ 将结算 ' + ok.length + ' 项（' + skip + ' 项因缺父级被跳过）');
}
function taskBatchAbandon() {
  var ts = getSelTasks().filter(function (t) { return t.status === '待接' || t.status === '进行中'; });
  if (!ts.length) { toast('没有可放弃的'); return; }
  if (!confirm('将选中的 ' + ts.length + ' 项转入搁置？')) return;
  ts.forEach(function (t) { t.status = '搁置'; t.lockedPlanId = null; });
  afterBatch('已转搁置 ' + ts.length + ' 项');
}
function taskBatchRestart() {
  var ts = getSelTasks().filter(function (t) { return t.status === '凯旋' || t.status === '搁置'; });
  if (!ts.length) { toast('没有可重启的'); return; }
  ts.forEach(function (t) { t.status = '待接'; t.lockedPlanId = null; });
  afterBatch('🔁 重启 ' + ts.length + ' 项');
}
function taskBatchDestroy() {
  var ts = getSelTasks();
  if (!ts.length) { toast('未选择'); return; }
  if (!confirm('彻底删除选中的 ' + ts.length + ' 项？不可恢复。')) return;
  var ids = {}; ts.forEach(function (t) { ids[t.id] = true; });
  DB.tasks = DB.tasks.filter(function (t) { return !ids[t.id]; });
  if (taskState.sel) taskState.sel.clear();
  afterBatch('已删除 ' + ts.length + ' 项');
}
function afterBatch(msg) { saveDB(); renderTasks(); toast(msg); taskHaptic(); }

// ---------- 一键清零 ----------
function taskClearModal() {
  var clr = DB.tasks.filter(function (t) { return t.status === '凯旋' || t.status === '搁置'; });
  if (clr.length === 0) { toast('没有可清理的委托'); return; }

  html += '<div style="font-size:13px;color:var(--text-secondary);margin:8px 0">勾选「保留蓝图」的会移回「委托待接」可复购；未勾选的彻底删除。</div>';
  clr.forEach(function (t) {

    html += '<input type="checkbox" class="clr-keep" value="' + t.id + '">';
    html += '<div><div style="font-weight:600">' + escTask(t.name) + '</div><div style="font-size:12px;color:var(--text-secondary)">' + (t.status === '凯旋' ? '🏆 凯旋' : '🟠 搁置') + ' · ' + fmtMoney(planMin(t)) + '</div></div>';

  document.getElementById('modal-overlay').classList.add('show');
}
function doTaskClear() {
  var keep = {};
  document.querySelectorAll('.clr-keep:checked').forEach(function (c) { keep[c.value] = true; });
  var del = {};
  DB.tasks.forEach(function (t) { if ((t.status === '凯旋' || t.status === '搁置') && !keep[t.id]) del[t.id] = true; });
  DB.tasks.forEach(function (t) {
    if ((t.status === '凯旋' || t.status === '搁置') && keep[t.id]) {
      t.status = '待接'; t.lockedPlanId = null;
        }
  });
  DB.tasks = DB.tasks.filter(function (t) { return !del[t.id]; });
  closeModal(); saveDB(); renderTasks(); toast('清零完成');
}

function taskPlanSet(i, field, val) { if (taskState.formPlans[i]) taskState.formPlans[i][field] = val; }

function taskCalcLabel(p) {
  var d = planDerived(p);

function taskCalcOutHtml(p) {

function taskFormPlanCalc(i, field, val) {
