// ========== 补给品品牌变体编辑器（带照片） ==========
function renderConsumableVariantRows() {
  var html = '';
  var variants = window._editVariants || [];
  var photos = window._editVariantPhotos || [];
  variants.forEach(function(v, i) {
    html += '<div class="consumable-variant-row" style="border:1px solid var(--separator);border-radius:10px;padding:10px;margin-bottom:8px">';
    html += '<div style="display:flex;gap:8px;align-items:flex-start">';
    // 照片上传区
    html += '<div class="consumable-photo-slot" onclick="uploadConsumableVariantPhoto(' + i + ')" style="width:56px;height:56px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;cursor:pointer;position:relative">';
    if (photos[i] && photos[i].length > 0) {
      html += '<img src="' + photos[i][0] + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px">';
      html += '<div style="position:absolute;bottom:0;right:0;background:rgba(0,0,0,0.6);color:#fff;font-size:10px;padding:1px 4px;border-radius:4px 0 8px 0">' + (photos[i].length > 1 ? '+' + photos[i].length : '') + '</div>';
    } else {
      html += '<span style="font-size:20px;color:var(--text-tertiary)">📷</span>';
    }
    html += '</div>';
    // 品牌名+库存+单价
    html += '<div style="flex:1;display:flex;flex-direction:column;gap:4px">';
    html += '<input type="text" class="form-input" style="font-size:14px" placeholder="品牌名" value="' + escapeHtml(v.brand) + '" onchange="updateConsumableVariantField(' + i + ',\'brand\',this.value)">';
    html += '<div style="display:flex;gap:6px">';
    html += '<input type="number" class="form-input" style="font-size:14px;flex:1" placeholder="库存" value="' + (v.stock||0) + '" onchange="updateConsumableVariantField(' + i + ',\'stock\',parseFloat(this.value)||0)" step="0.5">';
    html += '<input type="number" class="form-input" style="font-size:14px;flex:1" placeholder="单价" value="' + (v.price||0) + '" onchange="updateConsumableVariantField(' + i + ',\'price\',parseFloat(this.value)||0)">';
    html += '</div>';
    html += '</div>';
    // 删除按钮
    if (variants.length > 1) {
      html += '<button class="btn btn-danger btn-sm" style="flex-shrink:0;padding:6px 8px;font-size:12px" onclick="removeConsumableVariantRow(' + i + ')">✕</button>';
    }
    html += '</div>';
    // 已有照片缩略图列表
    if (photos[i] && photos[i].length > 0) {
      html += '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">';
      photos[i].forEach(function(p, pi) {
        html += '<div style="position:relative;width:40px;height:40px">';
        html += '<img src="' + p + '" style="width:40px;height:40px;border-radius:6px;object-fit:cover">';
        html += '<button onclick="removeConsumableVariantPhoto(' + i + ',' + pi + ')" style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:10px;line-height:16px;cursor:pointer">✕</button>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

  return html;
}
function updateConsumableVariantField(idx, field, val) {
  if (window._editVariants && window._editVariants[idx]) {
    window._editVariants[idx][field] = val;
  }
}
function addConsumableVariantRow() {
  window._editVariants = window._editVariants || [];
  window._editVariantPhotos = window._editVariantPhotos || [];
  window._editVariants.push({ id: genId(), brand: '', stock: 0, price: 0, photos: [] });
  window._editVariantPhotos.push([]);
  document.getElementById('variant-list').innerHTML = renderConsumableVariantRows();
}
function removeConsumableVariantRow(idx) {
  if (window._editVariants.length <= 1) {
    toast('至少保留一个品牌');
    return;
  }
  window._editVariants.splice(idx, 1);
  window._editVariantPhotos.splice(idx, 1);
  document.getElementById('variant-list').innerHTML = renderConsumableVariantRows();
}
function uploadConsumableVariantPhoto(idx) {
  var input = document.getElementById('photo-input');
  input.onchange = function(e) {
    var files = e.target.files;
    var count = 0;
    var maxPhotos = 5;
    var currentPhotos = window._editVariantPhotos[idx] || [];
    var remaining = maxPhotos - currentPhotos.length;
    var toProcess = Math.min(files.length, remaining);
    function processNext(fileIdx) {
      if (fileIdx >= toProcess) {
        input.value = '';
        document.getElementById('variant-list').innerHTML = renderConsumableVariantRows();
        if (count === 0) toast('每个品牌最多' + maxPhotos + '张照片');
        return;
      }
      compressImage(files[fileIdx], function(dataUrl) {
        window._editVariantPhotos[idx].push(dataUrl);
        count++;
        processNext(fileIdx + 1);
      });
    }
    processNext(0);
  };
  input.click();
}
function removeConsumableVariantPhoto(variantIdx, photoIdx) {
  if (window._editVariantPhotos && window._editVariantPhotos[variantIdx]) {
    window._editVariantPhotos[variantIdx].splice(photoIdx, 1);
    document.getElementById('variant-list').innerHTML = renderConsumableVariantRows();
  }
}

    } else {
      html += '<span style="font-size:20px;color:var(--text-tertiary)">📷</span>';
    }
    html += '</div>';
    // 描述+价格
    html += '<div style="flex:1;display:flex;flex-direction:column;gap:4px">';
    html += '<input type="text" class="form-input" style="font-size:14px" placeholder="描述（如：白色圆领）" value="' + escapeHtml(v.brand) + '" onchange="updateDurableVariantField(' + i + ',\'brand\',this.value)">';
    html += '<input type="number" class="form-input" style="font-size:14px" placeholder="价格（选填）" value="' + (v.price||'') + '" onchange="updateDurableVariantField(' + i + ',\'price\',parseFloat(this.value)||0)">';
    html += '</div>';
    // 删除按钮
    html += '<button class="btn btn-danger btn-sm" style="flex-shrink:0;padding:6px 8px;font-size:12px" onclick="removeDurableVariantRow(' + i + ')">✕</button>';
    html += '</div>';
    // 已有照片缩略图列表
    if (photos[i] && photos[i].length > 0) {
      html += '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">';
      photos[i].forEach(function(p, pi) {
        html += '<div style="position:relative;width:40px;height:40px">';
        html += '<img src="' + p + '" style="width:40px;height:40px;border-radius:6px;object-fit:cover">';
        html += '<button onclick="removeDurableVariantPhoto(' + i + ',' + pi + ')" style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:10px;line-height:16px;cursor:pointer">✕</button>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  return html;
}
function updateDurableVariantField(idx, field, val) {
  if (window._editVariants && window._editVariants[idx]) {
    window._editVariants[idx][field] = val;
  }
}
function addDurableVariantRow() {
  window._editVariants = window._editVariants || [];
  window._editVariantPhotos = window._editVariantPhotos || [];
  window._editVariants.push({ id: genId(), brand: '', photos: [], price: 0 });
  window._editVariantPhotos.push([]);
  document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
}
function removeDurableVariantRow(idx) {
  if (window._editVariants.length <= 1) {
    toast('至少保留一件');
    return;
  }
  window._editVariants.splice(idx, 1);
  window._editVariantPhotos.splice(idx, 1);
  document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
}
function uploadDurableVariantPhoto(idx) {
  var input = document.getElementById('photo-input');
  input.onchange = function(e) {
    var files = e.target.files;
    var count = 0;
    var maxPhotos = 5;
    var currentPhotos = window._editVariantPhotos[idx] || [];
    var remaining = maxPhotos - currentPhotos.length;
    var toProcess = Math.min(files.length, remaining);
    
    function processNext(fileIdx) {
      if (fileIdx >= toProcess) {
        input.value = '';
        document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
        if (count === 0) toast('每件最多' + maxPhotos + '张照片');
        return;
      }
      compressImage(files[fileIdx], function(dataUrl) {
        window._editVariantPhotos[idx].push(dataUrl);
        count++;
        processNext(fileIdx + 1);
      });
    }
    processNext(0);
  };
  input.click();
}
function removeDurableVariantPhoto(variantIdx, photoIdx) {
  if (window._editVariantPhotos && window._editVariantPhotos[variantIdx]) {
    window._editVariantPhotos[variantIdx].splice(photoIdx, 1);
    document.getElementById('variant-list').innerHTML = renderDurableVariantRows();
  }
}

function saveItem() {
  var zone = getZone(currentZoneId);
  var name = document.getElementById('item-name').value.trim();
  if (!name) { toast('请输入名称'); return; }

  var data = {
    name: name,
    categoryId: document.getElementById('item-category').value,
    location: document.getElementById('item-location').value,
    notes: document.getElementById('item-notes').value,
    photos: itemPhotos.slice()
  };

  if (zone.type === 'consumable') {
    // 从品牌变体编辑器读取
    var editVariants = window._editVariants || [];
    var editPhotos = window._editVariantPhotos || [];
    data.variants = editVariants.map(function(ev, i) {
      return {
        id: ev.id, brand: ev.brand || '未命名', stock: ev.stock || 0, price: ev.price || 0,
        channel: '', photos: (editPhotos[i] || []).slice(),
        opened: false, openDate: null, finishDate: null,
        usedUp: false, openQty: 0, feeling: null, shelfLife: null, productionDate: null
      };
    });
    // 合并变体照片，用于卡片展示
    var variantPhotos = [];
    data.variants.forEach(function(v) { variantPhotos = variantPhotos.concat(v.photos); });
    var seenP = {};
    var allP = [];
    variantPhotos.forEach(function(p) { if (p && !seenP[p]) { seenP[p] = true; allP.push(p); } });
    data.photos = allP;
    data.stock = data.variants.reduce(function(s,v) { return s + (v.stock||0); }, 0);
    data.currentPrice = data.variants.length > 0 ? data.variants[0].price : 0;
    data.unit = document.getElementById('item-unit').value || '个';
    data.shelfLife = parseInt(document.getElementById('item-shelf').value) || null;
    var prodDate = document.getElementById('item-prod-date').value;
    data.productionDate = prodDate ? new Date(prodDate).toISOString() : null;
    data.stockThreshold = parseFloat(document.getElementById('item-threshold').value) || 1;
  } else {
    // 耐用品：从件数编辑器读取
    var dEditVariants = window._editVariants || [];
    var dEditPhotos = window._editVariantPhotos || [];
    data.variants = dEditVariants.map(function(ev, i) {
      return {
        id: ev.id,
        brand: ev.brand || ('第' + (i+1) + '件'),
        stock: 1,
        price: ev.price || 0,
        channel: '',
        photos: (dEditPhotos[i] || []).slice(),
        opened: false, openDate: null, finishDate: null,
        usedUp: false, openQty: 0, feeling: null,
        shelfLife: null, productionDate: null
      };
    });
    data.stock = data.variants.length;
    data.unit = '件';
    data.currentPrice = data.variants.length > 0 ? data.variants[0].price : 0;
    data.channel = '';
  }

  if (editingItemId) {
    var item = getItem(currentZoneId, editingItemId);
    if (zone.type === 'consumable') {
      // 补给品：保留已有的variant使用数据
      var oldVariants = item.variants || [];
      var newVariants = data.variants;
      newVariants.forEach(function(nv) {
        var old = oldVariants.find(function(ov) { return ov.id === nv.id; });
        if (old) {
          nv.opened = old.opened;
          nv.usedUp = old.usedUp;
          nv.openDate = old.openDate;
          nv.finishDate = old.finishDate;
          nv.openQty = old.openQty;
          nv.feeling = old.feeling;
          nv.shelfLife = old.shelfLife;
          nv.productionDate = old.productionDate;
          // 注意：不覆盖 nv.photos，让用户编辑时新上传的照片生效
          // 但如果新上传为空且旧照片存在，保留旧照片
          if ((!nv.photos || nv.photos.length === 0) && old.photos && old.photos.length > 0) {
            nv.photos = old.photos.slice();
          }
        }
      });
      // 兼容旧数据：如果variant没有照片但item.photos有，把item.photos分给第一个variant
      var hasAnyVariantPhoto = newVariants.some(function(v) { return v.photos && v.photos.length > 0; });
      if (!hasAnyVariantPhoto && item.photos && item.photos.length > 0) {
        if (newVariants.length > 0) {
          newVariants[0].photos = item.photos.slice();
        }
      }
    } else {
      // 耐用品：保留已有的variant使用感受
      var oldDVariants = item.variants || [];
      data.variants.forEach(function(nv) {
        var old = oldDVariants.find(function(ov) { return ov.id === nv.id; });
        if (old) {
          nv.feeling = old.feeling;
        }
      });
    }
    Object.assign(item, data);
    if (zone.type === 'consumable') syncItemFromVariants(item);
    else syncDurableFromVariants(item);
  } else {
    data.id = genId();
    data.usageRecords = [];
    data.priceHistory = [];
    data.createdAt = new Date().toISOString();
    zone.items.push(data);
  }

  saveDB();
  closeModal();
  renderZone();
  toast(editingItemId ? '已保存' : '已添加');
}

// 撤销单品牌/顶层用完状态
function undoFinish(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  ensureVariants(item);
  // 找到最近一个已用完的变体，恢复为使用中
  var lastFinished = null;
  for (var i = item.variants.length - 1; i >= 0; i--) {
    var v = item.variants[i];
    if (v.usedUp) { lastFinished = v; break; }
  }
  if (!lastFinished) {
    toast('没有可撤销的用完记录');
    return;
  }
  lastFinished.usedUp = false;
  lastFinished.finishDate = null;
  // 恢复使用记录
  if (item.usageRecords && item.usageRecords.length > 0) {
    for (var j = item.usageRecords.length - 1; j >= 0; j--) {
      var r = item.usageRecords[j];
      if (r.variantId === lastFinished.id && r.endDate) {
        r.endDate = null;
        break;
      }
    }
  }
  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已撤销用完');
}

// 撤销多变体某个变体的用完状态
function undoFinishVariant(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(vv) { return vv.id === variantId; });
  if (!v || !v.usedUp) {
    toast('该变体未标记用完');
    return;
  }
  v.usedUp = false;
  v.finishDate = null;
  if (item.usageRecords && item.usageRecords.length > 0) {
    for (var i = item.usageRecords.length - 1; i >= 0; i--) {
      var r = item.usageRecords[i];
      if (r.variantId === variantId && r.endDate) {
        r.endDate = null;
        break;
      }
    }
  }
  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已撤销用完');
}

function renderPoolItem(p) {
  var html = '<div class="pool-item">';
  html += '<div class="pool-header">';
  html += '<div><div class="pool-name">' + escapeHtml(p.name) + '</div>';
  var meta = '';
  if (p.zoneId) {
    var zone = getZone(p.zoneId);
    if (zone) meta += zone.icon + ' ' + zone.name;
  }
  if (p.categoryId) {
    var cat = getCategory(p.zoneId, p.categoryId);
    if (cat) meta += ' · ' + cat.name;
  }
  if (p.date) meta += ' · ' + formatDate(p.date);
  html += '<div class="pool-meta">' + meta + '</div></div>';
  html += '<div class="pool-price">¥' + (p.price||0) + '</div>';
  html += '</div>';

  html += '<div style="margin-top:4px"><span class="pool-status status-' + (p.status==='pending'?'pending':'decided') + '">' + (p.status==='pending'?'目标冻结':'目标锁定') + '</span></div>';

  // 品牌变体显示
  if (p.variants && p.variants.length > 1) {
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:6px">';
    html += p.variants.length + '个品牌：';
    p.variants.forEach(function(v) {
      html += escapeHtml(v.brand||'?') + '(¥' + (v.price||0) + ') ';
    });
    html += '</div>';
  }

  if (p.notes) {
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:6px">' + escapeHtml(p.notes) + '</div>';
  }

  // 库存对比提醒
  if (p.zoneId && p.categoryId) {
    var zone = getZone(p.zoneId);
    if (zone) {
      var existing = zone.items.filter(function(it) { return it.categoryId === p.categoryId; });
      if (existing.length > 0) {
        if (zone.type === 'durable') {
          html += '<div class="pool-warn">⚠️ 你已经有 ' + existing.length + ' 件同类物品了，确定要买吗？</div>';
        } else {
          var totalStock = existing.reduce(function(s,it){return s+(it.stock||0);},0);
          html += '<div class="pool-warn">⚠️ 同类已有 ' + totalStock + '件库存</div>';
        }
      } else {
        html += '<div class="pool-ok">✓ 同类暂无库存，可以买</div>';
      }
    }
  }

  if (p.photos && p.photos.length > 0) {
    html += '<div style="display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none">';
    p.photos.forEach(function(ph) {
      html += '<img src="' + ph + '" style="width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0">';
    });
    html += '</div>';
  }

  // 操作按钮
  html += '<div class="pool-actions">';
  if (p.status === 'pending') {
    html += '<button class="btn btn-primary btn-sm" style="flex:1" onclick="poolDecide(\'' + p.id + '\')">🎯 锁定目标</button>';
  }
  html += '<button class="btn btn-success btn-sm" style="flex:1" onclick="poolToItem(\'' + p.id + '\')">📦 已入手</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="poolGiveUp(\'' + p.id + '\')">解除</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="poolDelete(\'' + p.id + '\')">删</button>';
  html += '</div>';

  html += '</div>';
  return html;
}

  var idx = DB.pool.findIndex(function(p) { return p.id === itemId; });
  if (idx >= 0) {
    var item = DB.pool[idx];
    item.status = 'given-up';
    item.giveUpDate = new Date().toISOString();
    if (!DB.poolHistory) DB.poolHistory = [];
    DB.poolHistory.push(item);
    DB.pool.splice(idx, 1);
    saveDB();
    renderPool();
    toast('目标已解除（保留记录）');

// ========== 数据导入导出 ==========
function exportJSON() {
  var data = JSON.stringify(DB, null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '家有-备份-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出');
}

function importJSON(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.zones) { toast('文件格式不对'); return; }
      // 先解析好数据，再确认导入（避免confirm在异步回调中的问题）
      var newDB = mergeDB({
        zones: [], pool: [], poolHistory: [],
        settings: {},
        version: 1
      }, data);
      // 直接导入，不再用confirm阻塞
      DB = newDB;
      saveDB();
      // 验证存储是否成功
      var saved = localStorage.getItem('jiayou_db');
      if (saved) {
        showPage('home');
        toast('导入成功，共' + (DB.zones||[]).length + '个领地');
      } else {
        toast('存储失败，请重试');
      }
    } catch(err) {
      console.error('导入失败:', err);
      toast('文件解析失败: ' + err.message);
    }
  };
  reader.onerror = function() {
    toast('文件读取失败');
  };
  reader.readAsText(file);
}

// ========== 工具函数 ==========
function daysBetween(d1, d2) {
  return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

function formatDateTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

// 图片压缩
function compressImage(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxDim = 800;
      var w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = h * maxDim / w; w = maxDim; }
        else { w = w * maxDim / h; h = maxDim; }
      }
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 导入文件监听
document.getElementById('import-input').addEventListener('change', function(e) {
  if (e.target.files[0]) importJSON(e.target.files[0]);
  e.target.value = '';
});

// ========== 预警详情弹窗 ==========
function showAlertDetail(type) {
  var title = '', items = [];
  if (type === 'expired') {
    title = '🔴 已过期';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      zone.items.forEach(function(it) {
        if (getItemStatus(it).expired) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'expiring') {
    title = '🟡 即将过期（30天内）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      zone.items.forEach(function(it) {
        if (getItemStatus(it).expiring) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'lowStock') {
    title = '🟡 库存告急';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      zone.items.forEach(function(it) {
        if (getItemStatus(it).lowStock) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'overStock') {
    title = '🔵 囤太多（用到过期也用不完）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      zone.items.forEach(function(it) {
        if (getItemStatus(it).overStock) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'idle') {
    title = '🟣 闲置中（超过6个月没用）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'durable') return;
      zone.items.forEach(function(it) {
        if (it.lastUsedDate) {
          var days = daysBetween(new Date(it.lastUsedDate), new Date());
          if (days > 180) items.push({item: it, zone: zone, days: days});
        }
      });
    });
  }

  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">' + title + '</div>';
  if (items.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">✓</div><div class="empty-text">没有需要关注的</div></div>';
  } else {
    html += '<div style="margin-bottom:16px;font-size:13px;color:var(--text-secondary)">共 ' + items.length + ' 件</div>';
    items.forEach(function(entry) {
      var it = entry.item, zone = entry.zone;
      var status = getItemStatus(it);
      var bgColor = '#fff';
      if (type === 'expired') bgColor = 'rgba(255,59,48,0.06)';
      else if (type === 'expiring') bgColor = 'rgba(255,149,0,0.06)';
      else if (type === 'lowStock') bgColor = 'rgba(255,149,0,0.06)';
      else if (type === 'overStock') bgColor = 'rgba(90,200,250,0.06)';
      else if (type === 'idle') bgColor = 'rgba(175,82,222,0.06)';

      html += '<div style="display:flex;gap:10px;padding:12px;border-radius:10px;background:' + bgColor + ';margin-bottom:8px;cursor:pointer" onclick="closeModal();setTimeout(function(){enterZone(\'' + zone.id + '\')},200)">';
      // 照片
      html += '<div style="width:50px;height:50px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px">';
      if (it.photos && it.photos.length > 0) {
        html += '<img src="' + it.photos[0] + '" style="width:100%;height:100%;object-fit:cover">';
      } else {
        html += '📦';
      }
      html += '</div>';
      // 信息
      html += '<div style="flex:1;min-width:0">';
      html += '<div style="font-weight:700;font-size:15px">' + escapeHtml(it.name) + '</div>';
      html += '<div style="font-size:12px;color:var(--text-secondary)">' + zone.icon + ' ' + escapeHtml(zone.name) + '</div>';
      if (type === 'expired') {
        html += '<div style="font-size:13px;color:var(--red);font-weight:600;margin-top:2px">⚠️ 已过期' + (status.daysLeft!==null?'（超期'+Math.abs(status.daysLeft)+'天）':'') + '</div>';
      } else if (type === 'expiring') {
        html += '<div style="font-size:13px;color:var(--orange);font-weight:600;margin-top:2px">⏰ 还剩 ' + status.daysLeft + ' 天过期</div>';
      } else if (type === 'lowStock') {
        html += '<div style="font-size:13px;color:var(--orange);font-weight:600;margin-top:2px">📦 库存仅剩 ' + it.stock + (it.unit||'') + '（告急阈值' + (it.stockThreshold||1) + '）</div>';
      } else if (type === 'overStock') {
        var rate = calcUsageRate(it);
        var monthsLeft = rate > 0 ? (it.stock / rate).toFixed(1) : '?';
        html += '<div style="font-size:13px;color:var(--blue);font-weight:600;margin-top:2px">📦 库存' + it.stock + (it.unit||'') + '，按消耗速率够用' + monthsLeft + '月</div>';
      } else if (type === 'idle') {
        html += '<div style="font-size:13px;color:var(--purple);font-weight:600;margin-top:2px">🕐 已' + Math.floor(entry.days/30) + '个月没用</div>';
      }
      html += '</div>';
      html += '</div>';
    });
  }
  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">关闭</button>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

// ========== 首页过滤快捷（改为弹窗显示详情）==========
function filterExpired() { showAlertDetail('expired'); }
function filterExpiring() { showAlertDetail('expiring'); }
function filterLowStock() { showAlertDetail('lowStock'); }
function filterOverStock() { showAlertDetail('overStock'); }
function filterIdle() { showAlertDetail('idle'); }
</script>
</body>
</html>
