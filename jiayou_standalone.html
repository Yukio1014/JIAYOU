<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4A90E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家有">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>家有</title>
<script src="supabase.js?v=2" defer></script>
<style>
/* ========== 设计系统 ========== */
:root {
  --bg: #F2F2F7;
  --card-bg: #FFFFFF;
  --text: #1C1C1E;
  --text-secondary: #8E8E93;
  --text-tertiary: #C7C7CC;
  --separator: #E5E5EA;
  --accent: #007AFF;
  --red: #FF3B30;
  --orange: #FF9500;
  --yellow: #FFCC00;
  --green: #34C759;
  --blue: #5AC8FA;
  --purple: #AF52DE;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ========== 导航栏 ========== */
.navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(242,242,247,0.85);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid var(--separator);
  padding: 12px 16px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.navbar h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.navbar .nav-actions { display: flex; gap: 8px; align-items: center; }
.cloud-status {
  font-size: 12px; font-weight: 600;
  padding: 5px 10px; border-radius: 12px;
  background: rgba(0,122,255,0.08); color: var(--accent);
  white-space: nowrap; cursor: pointer;
  transition: opacity 0.15s;
}
.cloud-status:active { opacity: 0.6; }
.cloud-status.synced { background: rgba(52,199,89,0.12); color: var(--green); }
.cloud-status.syncing { background: rgba(0,122,255,0.12); color: var(--accent); }
.cloud-status.pending { background: rgba(255,149,0,0.12); color: var(--orange); }
.cloud-status.offline { background: rgba(142,142,147,0.12); color: var(--text-secondary); }
.cloud-status.error { background: rgba(255,59,48,0.12); color: var(--red); }
.nav-btn {
  width: 32px; height: 32px;
  border-radius: 50%; border: none;
  background: rgba(0,122,255,0.1);
  color: var(--accent);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s;
}
.nav-btn:active { transform: scale(0.88); }

/* ========== 底部Tab栏 ========== */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--separator);
  display: flex; padding: 6px 0 20px;
  max-width: 600px; margin: 0 auto;
}
.tabbar-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 2px; cursor: pointer;
  transition: opacity 0.15s; -webkit-user-select: none; user-select: none;
}
.tabbar-item:active { opacity: 0.5; }
.tabbar-item .tab-icon { font-size: 24px; line-height: 1; }
.tabbar-item .tab-label { font-size: 10px; color: var(--text-secondary); font-weight: 500; }
.tabbar-item.active .tab-label { color: var(--accent); }
.tabbar-item.active .tab-icon { transform: scale(1.1); }

/* ========== 页面容器 ========== */
.page {
  max-width: 600px; margin: 0 auto;
  padding: 0 16px 100px;
  display: none;
}
.page.active { display: block; }

/* ========== 按钮系统 ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600; border: none;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  font-family: var(--font);
}
.btn:active { transform: scale(0.96); opacity: 0.7; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-success { background: var(--green); color: #fff; }
.btn-warn { background: var(--orange); color: #fff; }
.btn-ghost { background: transparent; color: var(--accent); }
.btn-full { width: 100%; padding: 14px; font-size: 16px; }
.btn-outline { background: transparent; border: 1.5px solid var(--separator); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 13px; }

/* ========== 卡片 ========== */
.card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

/* ========== 首页预警条 ========== */
.alert-strip {
  display: flex; gap: 8px; margin-bottom: 16px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 2px 0;
}
.alert-strip::-webkit-scrollbar { display: none; }
.alert-badge {
  flex-shrink: 0; padding: 10px 14px; border-radius: 12px;
  display: flex; flex-direction: column; gap: 2px;
  min-width: 100px; cursor: pointer;
  transition: transform 0.15s;
}
.alert-badge:active { transform: scale(0.95); }
.alert-badge .badge-num { font-size: 24px; font-weight: 800; line-height: 1.1; }
.alert-badge .badge-label { font-size: 11px; opacity: 0.9; font-weight: 500; }
.alert-red { background: linear-gradient(135deg, #FF3B30, #FF6B6B); color: #fff; }
.alert-yellow { background: linear-gradient(135deg, #FF9500, #FFB340); color: #fff; }
.alert-blue { background: linear-gradient(135deg, #5AC8FA, #7AD9FF); color: #fff; }
.alert-green { background: linear-gradient(135deg, #34C759, #5AD680); color: #fff; }
.alert-gray { background: linear-gradient(135deg, #8E8E93, #AEAEB2); color: #fff; }
.alert-purple { background: linear-gradient(135deg, #AF52DE, #C97AF0); color: #fff; }
@keyframes pulse-red {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(255,59,48,0); }
}
.alert-red.pulse { animation: pulse-red 2s infinite; }

/* ========== 区块标题 ========== */
.section-title {
  font-size: 20px; font-weight: 700;
  margin: 20px 0 12px; letter-spacing: -0.3px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title .section-action {
  font-size: 14px; font-weight: 500; color: var(--accent); cursor: pointer;
}

/* ========== 拥有量卡 ========== */
.own-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.own-card {
  background: var(--card-bg); border-radius: var(--radius); padding: 14px;
  box-shadow: var(--shadow); cursor: pointer; transition: transform 0.15s;
}
.own-card:active { transform: scale(0.97); }
.own-card .own-icon { font-size: 28px; }
.own-card .own-name { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.own-card .own-num { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
.own-card .own-unit { font-size: 13px; color: var(--text-secondary); }
.own-card .own-idle { font-size: 11px; color: var(--orange); margin-top: 2px; font-weight: 600; }

/* ========== AI分析卡 ========== */
.ai-card {
  background: linear-gradient(135deg, #E0F7FA, #B2DFDB, #E1BEE7);
  color: #1C1C1E; border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-lg);
  border: 1px solid rgba(178,223,219,0.4);
}
.ai-card .ai-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.ai-card .ai-title { font-size: 16px; font-weight: 700; color: #00695C; }
.ai-card .ai-badge {
  font-size: 10px; background: rgba(0,105,92,0.12);
  padding: 2px 8px; border-radius: 6px; font-weight: 600; color: #00695C;
}
.ai-card .ai-section { margin-bottom: 14px; }
.ai-card .ai-section:last-child { margin-bottom: 0; }
.ai-card .ai-section-title {
  font-size: 12px; color: #00897B;
  margin-bottom: 6px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.ai-card .ai-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 0.5px solid rgba(0,105,92,0.12);
  font-size: 14px;
}
.ai-card .ai-item:last-child { border-bottom: none; }
.ai-card .ai-item .ai-val { font-weight: 700; color: #00695C; }
.ai-card .ai-suggest {
  background: rgba(255,255,255,0.5); border-radius: 8px;
  padding: 10px 12px; font-size: 13px; line-height: 1.6; color: #1C1C1E;
}
.ai-card .ai-suggest strong { color: #00897B; }
.ai-card .ai-suggest .donate-buy { color: #007AFF; font-weight: 700; }
.ai-card .ai-suggest .stop-buy { color: var(--red); font-weight: 700; }

/* ========== 年报页 ========== */
.report-hero {
  margin: 0 0 16px; padding: 18px; border-radius: var(--radius);
  background: linear-gradient(135deg, #E0F7FA, #B2DFDB, #E1BEE7);
  border: 1px solid rgba(178,223,219,0.4); box-shadow: var(--shadow-lg);
}
.report-hero-title { font-size: 19px; font-weight: 700; color: #00695C; }
.report-hero-sub { font-size: 12px; color: #00695C; opacity: .8; margin-top: 4px; line-height: 1.5; }
.report-hero-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px;
}
.report-stat {
  background: rgba(255,255,255,0.62); border-radius: 10px;
  padding: 10px 4px; text-align: center;
}
.report-stat-num { font-size: 20px; font-weight: 700; color: #00695C; line-height: 1.1; }
.report-stat-num.report-stat-warn { color: var(--orange); }
.report-stat-label { font-size: 10px; color: #00695C; opacity: .75; margin-top: 3px; }
.report-hero-spend {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(0,105,92,0.15);
  font-size: 13px; color: #00695C;
}
.report-hero-spend strong { font-size: 16px; }

.report-group {
  margin-bottom: 18px; background: var(--card);
  border-radius: var(--radius); border: 0.5px solid var(--separator);
  overflow: hidden;
}
.report-group-head {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 16px 6px; cursor: pointer; user-select: none;
}
.report-group-icon { font-size: 18px; }
.report-group-title { font-size: 15px; font-weight: 700; flex: 1; }
.report-group-count {
  font-size: 12px; font-weight: 700; color: var(--text-secondary);
  background: var(--bg); border-radius: 999px; padding: 2px 9px;
}
.report-group-arrow {
  font-size: 16px; color: var(--text-tertiary);
  transition: transform .2s ease; transform: rotate(0deg);
}
.report-group-arrow.folded { transform: rotate(-90deg); }
.report-group-hint {
  padding: 0 16px 10px; font-size: 11px; line-height: 1.55; color: var(--text-tertiary);
}
.report-group-body { padding: 0 16px 8px; }

.report-row {
  padding: 12px 0; border-top: 0.5px solid var(--separator); cursor: pointer;
}
.report-row:first-child { border-top: none; }
.report-row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.report-row-name { font-size: 15px; font-weight: 700; min-width: 0; }
.report-row-zone { font-size: 11px; color: var(--text-tertiary); flex-shrink: 0; }
.report-tag {
  font-size: 10px; font-weight: 600; vertical-align: middle;
  padding: 1px 6px; border-radius: 6px; margin-left: 5px;
  background: var(--bg); color: var(--text-secondary);
}
.report-tag-warn { background: rgba(255,149,0,0.16); color: var(--orange); }
.report-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.report-fact {
  font-size: 12px; line-height: 1.4; padding: 3px 9px; border-radius: 8px;
  background: var(--bg); color: var(--text-secondary);
}
.report-left { font-size: 12px; color: var(--purple); font-weight: 600; margin-top: 7px; }
.report-advice {
  font-size: 13px; line-height: 1.55; color: #00695C; font-weight: 600; margin-top: 7px;
}
.report-detail { font-size: 11px; line-height: 1.6; color: var(--text-tertiary); margin-top: 4px; }
.report-foot {
  padding: 16px 0 8px; font-size: 11px; line-height: 1.6;
  color: var(--text-tertiary); text-align: center;
}

/* 表单变体卡：左标签右输入的行式字段（「总套餐数：[1]」模式） */
.vfield { display:flex; align-items:center; gap:6px; margin-bottom:8px; }
.vfield-dot { color:var(--text-tertiary); font-weight:700; flex-shrink:0; width:10px; text-align:center; }
.vfield-label { font-size:12px; color:var(--text-secondary); flex-shrink:0; min-width:78px; text-align:right; }
.vfield .form-input { flex:1; min-width:0; font-size:13px; padding:7px 9px; }
.vfield-unit { font-size:12px; color:var(--text-tertiary); flex-shrink:0; }
/* 表单变体卡：标签在上的小格（一行多格：「规格 [2] 单位 [瓶] 容量 [30] 单位 [ml]」） */
.vcell { display:flex; flex-direction:column; min-width:0; }
.vcell .vlab { font-size:11px; color:var(--text-tertiary); margin:0 0 3px 2px; }
.vcell .form-input { width:100%; font-size:14px; padding:8px 9px; min-height:40px; }
.vcalc {
  background:var(--bg); border-radius:8px; padding:8px 10px;
  font-size:12px; line-height:1.55; color:var(--text-secondary); margin-top:2px;
}
.vside-btn {
  width:56px; padding:5px 0; border-radius:8px; border:1px solid var(--separator);
  background:var(--bg); font-size:14px; line-height:1.1; cursor:pointer; text-align:center;
}
.vside-btn small { display:block; font-size:9px; color:var(--text-secondary); margin-top:1px; }
.vside-btn.on { background:var(--red); border-color:var(--red); }
.vside-btn.on small { color:#fff; }
.vside-btn.on.spec { background:var(--accent); border-color:var(--accent); }
/* 横排小按钮（名称行右侧：🧩规格 / ❌不再买 / 🗑删除） */
.vside-btn.h { width:46px; min-height:42px; padding:4px 0; flex-shrink:0; }

/* 首页年报入口 */.report-entry {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; margin-bottom: 12px;
  background: var(--card); border-radius: var(--radius);
  border: 0.5px solid var(--separator); box-shadow: var(--shadow);
  cursor: pointer;
}
.report-entry:active { opacity: .7; }
.report-entry-icon { font-size: 24px; flex-shrink: 0; }
.report-entry-body { flex: 1; min-width: 0; }
.report-entry-title { font-size: 15px; font-weight: 700; color: var(--text); }
.report-entry-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.report-entry-arrow { font-size: 22px; color: var(--text-tertiary); flex-shrink: 0; line-height: 1; }

/* ========== 进度条 ========== */
.bar-wrap { width: 100%; height: 8px; background: var(--separator); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.bar-green { background: var(--green); }
.bar-yellow { background: var(--yellow); }
.bar-orange { background: var(--orange); }
.bar-red { background: var(--red); }
.bar-blue { background: var(--blue); }
.bar-purple { background: var(--purple); }

/* 大进度条（库存可视化） */
.stock-bar {
  width: 100%; height: 12px; border-radius: 6px;
  overflow: hidden; background: var(--separator); position: relative;
}
.stock-bar .stock-fill {
  height: 100%; border-radius: 6px; transition: width 0.5s ease;
}
.stock-bar.low .stock-fill { background: linear-gradient(90deg, #FF3B30, #FF6B6B); }
.stock-bar.mid .stock-fill { background: linear-gradient(90deg, #FF9500, #FFB340); }
.stock-bar.high .stock-fill { background: linear-gradient(90deg, #34C759, #5AD680); }
.stock-bar.over .stock-fill { background: linear-gradient(90deg, #5AC8FA, #7AD9FF); }

/* 保质期进度条 */
.shelf-bar {
  width: 100%; height: 6px; border-radius: 3px;
  overflow: hidden; background: var(--separator);
}
.shelf-bar .shelf-fill { height: 100%; transition: width 0.5s ease; }

/* ========== 物品卡片网格 ========== */
.item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.item-card {
  background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
  cursor: pointer; transition: transform 0.15s;
  position: relative;
}
.item-card:active { transform: scale(0.97); }
.item-card .card-photo {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-size: 40px; color: var(--text-tertiary);
}
.item-card .card-photo img { width: 100%; height: 100%; object-fit: cover; }
.item-card .card-body { padding: 10px 12px; }
.item-card .card-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-card .card-info { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.item-card .card-mini-bar { margin-top: 6px; }

/* 耐用品紧凑卡片（无大照片区，隐私模式） */
.item-card-compact {
  min-height: 80px;
  display: flex; flex-direction: column; justify-content: center;
}
.item-card-compact .card-body { padding: 16px 14px; }
.item-card-compact .card-name { font-size: 16px; }

/* 变体缩略图网格（卡片背面） */
.variant-thumb-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
.variant-thumb { position:relative; border-radius:10px; overflow:hidden; background:var(--bg); }
.variant-thumb img { width:100%; aspect-ratio:1; object-fit:cover; display:block; cursor:pointer; }
.variant-thumb-no-photo { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--text-tertiary); background:var(--bg); }
.variant-thumb .variant-label { padding:6px 8px; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.variant-thumb .variant-sub { padding:0 8px 8px; font-size:11px; color:var(--text-secondary); }
.variant-thumb .variant-del {
  position:absolute; top:6px; right:6px;
  width:24px; height:24px; border-radius:50%;
  background:rgba(0,0,0,0.5); color:#fff;
  border:none; font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  z-index:2;
}

/* 全屏照片查看器 */
.photo-viewer {
  position:fixed; inset:0; z-index:500; background:#000;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.photo-viewer img {
  max-width:100%; max-height:100%; object-fit:contain;
  touch-action:none; will-change:transform;
}
.photo-viewer-close {
  position:absolute; top:16px; right:16px; z-index:501;
  width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,0.2); color:#fff;
  border:none; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.photo-viewer-counter {
  position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
  color:#fff; font-size:14px; font-weight:600; z-index:501;
  background:rgba(0,0,0,0.4); padding:6px 16px; border-radius:20px;
}

/* 卡片角标 */
.card-badge {
  position: absolute; top: 8px; right: 8px;
  padding: 3px 8px; border-radius: 8px;
  font-size: 10px; font-weight: 700; color: #fff;
  backdrop-filter: blur(4px);
}
.badge-expire { background: rgba(255,59,48,0.9); }
.badge-warn { background: rgba(255,149,0,0.9); }
.badge-low { background: rgba(255,149,0,0.9); }
.badge-restock { background: rgba(175,82,222,0.9); }
.badge-good { background: rgba(52,199,89,0.85); }
.badge-bad { background: rgba(255,59,48,0.85); }
.badge-oneshot { background: rgba(255,149,0,0.92); }
.badge-archived { background: rgba(142,142,147,0.92); }

/* 卡片3D翻面 */
.card-detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 16px;
}
.card-detail-overlay.show { display: flex; }
.flip-card {
  width: 100%; max-width: 360px; max-height: 85vh;
  perspective: 1200px; position: relative;
}

<script>
/* ================================================================
   家有 App - 核心逻辑

// ========== Supabase 云同步配置 ==========
const SUPABASE_URL = 'https://pnahlubyqqzcjrzhnzfa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UpBLW71YgaQCcm6YGCrGsw_urK1cVTd';
const BUCKET_NAME = 'jiayou-photos';
const CLOUD_SYNC_DEBOUNCE_MS = 2500;

var supabaseClient = null;
var currentUser = null;
var cloudSyncState = { status: 'idle', message: '', lastSyncAt: null, pending: false };
var cloudSyncTimer = null;
var cloudSyncInProgress = false;

// 懒初始化 Supabase 客户端：
// supabase.js 是 defer 加载（HTML 解析完才执行），而内联主脚本先执行，
// 因此不能在顶层直接读 window.supabase —— 必须等真正用到时再创建。
function ensureSupabaseClient() {
  if (supabaseClient) return true;
  if (!window.supabase || !window.supabase.createClient) {
    cloudSyncState.message = 'Supabase 库未加载（检查 supabase.js 是否存在）';
    return false;
  }
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
    return true;
  } catch(e) {
    console.error('Supabase初始化失败', e);
    cloudSyncState.message = 'Supabase初始化失败: ' + (e.message || e);
    return false;
  }
}

// 生成稳定设备ID（用于匿名用户识别）
function getDeviceId() {
  var id = localStorage.getItem('jiayou_device_id');
  if (!id) {
    id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('jiayou_device_id', id);
  }
  return id;
}

// 尝试匿名登录；失败则使用设备本地模式（仍可用，只是不同步）
async function initAuth() {
  if (!ensureSupabaseClient()) {
    updateCloudUI();
    return;
  }
  try {
    var { data: { session }, error } = await supabaseClient.auth.getSession();
    if (error) throw error;
    if (session && session.user) {
      currentUser = session.user;
      cloudSyncState.message = '';
      updateCloudUI();
      return;
    }
    // 尝试匿名登录
    var { data, error: signErr } = await supabaseClient.auth.signInAnonymously();
    if (signErr) {
      console.log('匿名登录失败，尝试邮箱降级:', signErr.message);
      await fallbackAnonymousLogin();
      return;
    }
    currentUser = data.user;
    localStorage.setItem('jiayou_anon_email', data.user.email || '');
    cloudSyncState.message = '';
    updateCloudUI();
  } catch(e) {
    console.error('认证初始化失败', e);
    cloudSyncState.message = '认证失败: ' + (e.message || e);
    updateCloudUI();
    await fallbackAnonymousLogin();
  }
}

async function fallbackAnonymousLogin() {
  if (!ensureSupabaseClient()) return;
  var deviceId = getDeviceId();
  var email = localStorage.getItem('jiayou_anon_email');
  var password = localStorage.getItem('jiayou_anon_password');
  var isNew = false;
  if (!email) {
    email = deviceId + '@jiayou.app';
    password = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    isNew = true;
  }
  try {
    if (isNew) {
      // 新设备：直接注册
      var { data: signUpData, error: signUpErr } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: { data: { source: 'jiayou_app' } }
      });
      if (signUpErr) throw signUpErr;
      if (!signUpData.user) throw new Error('注册后未返回用户');
      currentUser = signUpData.user;
      localStorage.setItem('jiayou_anon_email', email);
      localStorage.setItem('jiayou_anon_password', password);
      cloudSyncState.message = '';
      updateCloudUI();
      toast('已创建云端账号');
      return;
    }
    // 已有账号：尝试登录
    var { data: signInData, error: signInErr } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });
    if (!signInErr && signInData.user) {
      currentUser = signInData.user;
      cloudSyncState.message = '';
      updateCloudUI();
      return;
    }
    // 登录失败：可能账号被删或密码错，重新注册
    var { data: signUpData2, error: signUpErr2 } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: { data: { source: 'jiayou_app' } }
    });
    if (signUpErr2) throw signUpErr2;
    if (!signUpData2.user) throw new Error('重新注册后未返回用户');
    currentUser = signUpData2.user;
    cloudSyncState.message = '';
    updateCloudUI();
    toast('已创建云端账号');
  } catch(e) {
    console.error('降级认证失败', e);
    cloudSyncState.message = '云端登录失败: ' + (e.message || e);
    updateCloudUI();
  }
}

// 重试登录（清除旧凭据后重新走一遍）
async function retryCloudLogin() {
  toast('正在重试登录...');
  cloudSyncState.message = '正在重试...';
  updateCloudUI();
  if (!ensureSupabaseClient()) { toast('Supabase 库未加载'); return; }
  // 清除旧凭据，强制重新注册
  localStorage.removeItem('jiayou_anon_email');
  localStorage.removeItem('jiayou_anon_password');
  // 清除 supabase 本地 session
  try { await supabaseClient.auth.signOut(); } catch(e) {}
  currentUser = null;
  await initAuth();
  if (currentUser) {
    var changed = await syncFromCloud();
    if (changed) renderAll();
    toast('登录成功');
  } else {
    toast('登录仍失败，请检查网络或稍后再试');
  }
}

function updateCloudUI() {
  var el = document.getElementById('cloud-status');
  var settingsEl = document.getElementById('settings-cloud-status');
  var text = '☁️ 未登录', cls = 'cloud-status offline';
  if (!currentUser) {
    text = '☁️ 未登录'; cls = 'cloud-status offline';
  } else if (cloudSyncInProgress) {
    text = '🔄 同步中...'; cls = 'cloud-status syncing';
  } else if (cloudSyncState.pending) {
    text = '⏳ 待同步'; cls = 'cloud-status pending';
  } else if (cloudSyncState.lastSyncAt) {
    var t = new Date(cloudSyncState.lastSyncAt);
    text = '✓ 已同步 ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
    cls = 'cloud-status synced';
  } else {
    text = '☁️ 已登录'; cls = 'cloud-status online';
  }
  if (el) { el.textContent = text; el.className = cls; }
  if (settingsEl) { settingsEl.textContent = text.replace(/^[^\s]+\s/, ''); }
}

function setCloudStatus(status, message) {
  cloudSyncState.status = status;
  if (message) cloudSyncState.message = message;
  updateCloudUI();
}

// 从本地数据中提取所有照片（base64），上传到 Storage，替换为 URL
async function uploadAllLocalPhotos() {
  if (!currentUser) return;
  if (!ensureSupabaseClient()) return;
  var uploads = [];
  DB.zones.forEach(function(zone) {
    zone.items.forEach(function(item) {
      (item.photos || []).forEach(function(photo, idx) {
        if (photo && photo.startsWith && photo.startsWith('data:')) {
          uploads.push({ zoneId: zone.id, itemId: item.id, field: 'photos', idx: idx, data: photo });
        }
      });
      (item.variants || []).forEach(function(v, vidx) {
        (v.photos || []).forEach(function(photo, pidx) {
          if (photo && photo.startsWith && photo.startsWith('data:')) {
            uploads.push({ zoneId: zone.id, itemId: item.id, field: 'variant_photos', vidx: vidx, pidx: pidx, data: photo });
          }
        });
      });
    });
  });
  if (uploads.length === 0) return;
  setCloudStatus('syncing', '上传照片中...');
  for (var i = 0; i < uploads.length; i++) {
    var u = uploads[i];
    try {
      var url = await uploadPhotoToStorage(u.data, u.zoneId, u.itemId);
      if (url) {
        if (u.field === 'photos') {
          var item = findItemByIds(u.zoneId, u.itemId);
          if (item && item.photos && item.photos[u.idx]) item.photos[u.idx] = url;
        } else {
          var item = findItemByIds(u.zoneId, u.itemId);
          if (item && item.variants && item.variants[u.vidx] && item.variants[u.vidx].photos) {
            item.variants[u.vidx].photos[u.pidx] = url;
          }
        }
      }
    } catch(e) { console.error('照片上传失败', e); }
  }
}

function findItemByIds(zoneId, itemId) {
  var zone = DB.zones.find(function(z) { return z.id === zoneId; });
  if (!zone) return null;
  return zone.items.find(function(it) { return it.id === itemId; }) || null;
}

async function uploadPhotoToStorage(base64Data, zoneId, itemId) {
  if (!currentUser) return null;
  if (!ensureSupabaseClient()) return null;
  try {
    var arr = base64Data.split(',');
    var mime = arr[0].match(/:(.*?);/)[1];
    var bstr = atob(arr[1]);
    var n = bstr.length;
    var u8arr = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
    var ext = mime.split('/')[1] || 'jpg';
    var fileName = currentUser.id + '/' + zoneId + '/' + itemId + '/' + Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
    var file = new File([u8arr], fileName.split('/').pop(), { type: mime });
    var { data, error } = await supabaseClient.storage.from(BUCKET_NAME).upload(fileName, file, { upsert: true });
    if (error) throw error;
    var { data: urlData } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(fileName);
    return urlData.publicUrl;
  } catch(e) {
    console.error('上传照片到Storage失败', e);
    return null;
  }
}

// 保存数据到云端
async function syncToCloud(force) {
  if (!currentUser) return;
  if (!ensureSupabaseClient()) return;
  if (cloudSyncInProgress) {
    cloudSyncState.pending = true;
    updateCloudUI();
    return;
  }
  cloudSyncInProgress = true;
  cloudSyncState.pending = false;
  setCloudStatus('syncing', '正在同步...');
  try {
    // 先上传本地 base64 照片
    await uploadAllLocalPhotos();
    // 保存元数据
    var payload = {
      user_id: currentUser.id,
      data: DB,
      updated_at: new Date().toISOString(),
      version: (DB.version || 1)
    };
    var { error } = await supabaseClient
      .from('app_data')
      .upsert(payload, { onConflict: 'user_id' });
    if (error) throw error;
    cloudSyncState.lastSyncAt = Date.now();
    setCloudStatus('synced', '同步完成');
  } catch(e) {
    console.error('同步到云端失败', e);
    cloudSyncState.pending = true;
    setCloudStatus('error', '同步失败');
  } finally {
    cloudSyncInProgress = false;
    updateCloudUI();
    // 如果有排队中的同步，debounce 后重试
    if (cloudSyncState.pending) {
      clearTimeout(cloudSyncTimer);
      cloudSyncTimer = setTimeout(function() { syncToCloud(true); }, CLOUD_SYNC_DEBOUNCE_MS);
    }
  }
}

function queueCloudSync() {
  if (!currentUser) return;
  if (!ensureSupabaseClient()) return;
  cloudSyncState.pending = true;
  updateCloudUI();
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(function() { syncToCloud(true); }, CLOUD_SYNC_DEBOUNCE_MS);
}

// 从云端拉取数据
async function syncFromCloud() {
  if (!currentUser) return false;
  if (!ensureSupabaseClient()) return false;
  setCloudStatus('syncing', '从云端恢复...');
  try {
    var { data, error } = await supabaseClient
      .from('app_data')
      .select('data, updated_at')
      .eq('user_id', currentUser.id)
      .single();
    if (error) {
      if (error.code === 'PGRST116') {
        // 云端没有数据，把本地数据推上去
        await syncToCloud(true);
        return true;
      }
      throw error;
    }
    if (!data || !data.data) return false;
    // 合并云端数据到本地
    var cloudData = data.data;
    var localZones = (DB.zones || []);
    var cloudZones = (cloudData.zones || []);
    var localItemsCount = localZones.reduce(function(s, z) { return s + (z.items ? z.items.length : 0); }, 0);
    var cloudItemsCount = cloudZones.reduce(function(s, z) { return s + (z.items ? z.items.length : 0); }, 0);
    if (cloudItemsCount > 0) {
      // 云端有真实数据，用云端覆盖
      DB = mergeDB(DB, cloudData);
      // 立即同步到本地存储
      try { localStorage.setItem('jiayou_db', JSON.stringify(DB)); } catch(e) {}
      saveDBIndexed().catch(function(){});
    } else if (localItemsCount > 0) {
      // 本地有数据但云端没有，推送到云端
      await syncToCloud(true);
      return true;
    } else {
      // 双方都空，用云端（默认空）
      DB = mergeDB(DB, cloudData);
    }
    cloudSyncState.lastSyncAt = Date.now();
    setCloudStatus('synced', '恢复完成');
    return true;
  } catch(e) {
    console.error('从云端恢复失败', e);
    setCloudStatus('error', '恢复失败');
    return false;
  }
}

// 手动触发同步按钮
function manualSync() {
  if (!navigator.onLine) { toast('当前离线，恢复网络后自动同步'); return; }
  if (!ensureSupabaseClient()) { toast('Supabase 库未加载，无法同步'); return; }
  if (!currentUser) { toast('未登录，无法同步'); return; }
  toast('开始同步...');
  syncToCloud(true).then(function() {
    renderAll();
    toast('同步完成');
  });
}

// ========== 数据层 ==========
var DB = {
  zones: [],
  tasks: [],
  yearStats: {},
  settings: {},
  version: 1
};

// 板块类型: consumable(补给品) / durable(耐用品)
var ZONE_TYPES = {
  consumable: { name: '补给品', icon: '🦦', desc: '会用完、会过期、需要补货' },
  durable: { name: '耐用品', icon: '🐨', desc: '外观库、配件等耐用品' }
};

// ========== IndexedDB 存储（iOS PWA 更可靠） ==========
var DB_NAME = 'jiayou_app_db';
var STORE_NAME = 'data';
var dbPromise = null;

function initIndexedDB() {
  return new Promise(function(resolve) {
    if (dbPromise) { resolve(dbPromise); return; }
    if (!window.indexedDB) { resolve(null); return; }
    var req = indexedDB.open(DB_NAME, 1);
    req.onerror = function() { console.error('IndexedDB打开失败'); resolve(null); };
    req.onsuccess = function(e) { dbPromise = e.target.result; resolve(dbPromise); };
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
  });
}

function saveDBIndexed() {
  return initIndexedDB().then(function(db) {
    if (!db) return Promise.reject('no db');
    return new Promise(function(resolve, reject) {
      try {
        var tx = db.transaction(STORE_NAME, 'readwrite');
        var store = tx.objectStore(STORE_NAME);
        var req = store.put(DB, 'jiayou_db');
        req.onsuccess = function() { resolve(); };
        req.onerror = function(e) { reject(e); };
      } catch(e) { reject(e); }
    });
  });
}

function loadDBIndexed() {
  return initIndexedDB().then(function(db) {
    if (!db) return Promise.resolve(null);
    return new Promise(function(resolve) {
      try {
        var tx = db.transaction(STORE_NAME, 'readonly');
        var store = tx.objectStore(STORE_NAME);
        var req = store.get('jiayou_db');
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function() { resolve(null); };
      } catch(e) { resolve(null); }
    });
  });
}

// ========== 存储管理 ==========
function saveDB() {
  try {
    var json = JSON.stringify(DB);
    // 主存：IndexedDB（容量大，可存数十MB）
    saveDBIndexed().catch(function(e) { console.error('IndexedDB保存失败', e); });
    // 次存：localStorage（5-10MB限制，存不下会失败但不阻塞）
    try { localStorage.setItem('jiayou_db', json); } catch(lsErr) { console.warn('localStorage保存失败', lsErr); }
    // 排队同步到 Supabase 云端（最可靠）
    queueCloudSync();
  } catch(e) {
    console.error('saveDB错误:', e);
    if (e.name === 'QuotaExceededError') {
      toast('本地存储空间不足（云端已存）');
    } else {
      toast('存储失败: ' + e.message);
    }
  }
}

async function loadDB() {
  var loaded = false;
  var localRaw = null, idbData = null;
  // 先读 localStorage（5MB 限制可能失败）
  try {
    localRaw = localStorage.getItem('jiayou_db');
  } catch(e) { console.warn('读 localStorage 失败', e); }
  if (localRaw) {
    try {
      var parsed = JSON.parse(localRaw);
      if (parsed && parsed.zones && parsed.zones.length > 0) {
        DB = mergeDB(DB, parsed);
        loaded = true;
      }
    } catch(e) {
      console.warn('localStorage数据加载失败', e);
    }
  }
  // 再读 IndexedDB（容量大）
  try {
    idbData = await loadDBIndexed();
    if (idbData && idbData.zones && idbData.zones.length > 0) {
      var idbItemCount = idbData.zones.reduce(function(s,z){return s+(z.items?z.items.length:0);}, 0);
      var localItemCount = (DB.zones||[]).reduce(function(s,z){return s+(z.items?z.items.length:0);}, 0);
      if (idbItemCount > localItemCount) {
        DB = mergeDB(DB, idbData);
        loaded = true;
      } else if (!loaded) {
        DB = mergeDB(DB, idbData);
        loaded = true;
      }
    }
  } catch(e) { console.error('IndexedDB加载失败', e); }

  // 首次使用：创建默认板块
  if (!DB.zones || DB.zones.length === 0) {
    DB.zones = [
      {
        id: genId(), name: '补给品', type: 'consumable', icon: '🦦', theme: 'consumable',

  // 总含量按单位分组显示（如「≈600ml」；混合单位时「≈6kg · ≈600ml」）
  // 含量单位若与容量单位相同（混合规格下容量就是含量），不再重复显示
  var wTxt = '';
  var wParts = wOrder.filter(function(u) { return u !== unit; }).map(function(u) { return '≈' + round1(wTotals[u]) + u; });
  if (wParts.length) wTxt = ' · ' + wParts.join(' · ');
  if (hasPacks && packs > 0) {
    // 每套=1 时容量数和套数是同一个数，说了等于没说 → 只显示套数
    if (capTxt && Math.round(st) !== packs) return packs + '套 · ' + capTxt + wTxt;
    return packs + '套' + wTxt;
  }
  return round1(st) + unit + wTxt;
}

function getTotalStock(item) {
  if (item.variants && item.variants.length > 0) {
    return item.variants.reduce(function(s, v) { return s + (v.stock || 0); }, 0);
  }
  return item.stock || 0;
}
// 有效库存：排除标记了「不再买」的品牌（它们不算进补货提醒）
function getActiveStock(item) {
  if (item.variants && item.variants.length > 0) {
    return item.variants.filter(function(v) { return !v.noRestock; }).reduce(function(s, v) { return s + (v.stock || 0); }, 0);
  }
  return item.stock || 0;
}

// ===== 「已用完」的统一判断 + 历史脏数据自愈 =====
// 正常流程下 usedUp=true 时库存必为 0。但旧版本点「用完了」只写 usedUp=true、
// 不清库存（如牙膏剩 3 支却被折叠进已用完区），留下矛盾状态。
// 判断规则：usedUp 且确实没有剩余库存才算「已用完」；
// 「开封即用完」的一次性物品（oneShot）开封后即使还有库存也算用完（其本身语义如此）。
function isVariantDone(v, item) {
  if (!v.usedUp) return false;
  if ((parseFloat(v.stock) || 0) > 0 && !(item && isOneShotItem(item))) return false;
  return true;
}
// 数据自愈：启动/云端同步后，把「标记了用完但仍有库存」的普通变体恢复为待开封
function migrateDirtyUsedUp() {
  var fixed = 0;
  DB.zones.forEach(function(zone) {
    (zone.items || []).forEach(function(item) {
      if (!item.variants || !item.variants.length) return;
      var touched = false;
      item.variants.forEach(function(v) {
        if (v.usedUp && (parseFloat(v.stock) || 0) > 0 && !v.noRestock && !isOneShotItem(item)) {
          v.usedUp = false; v.finishDate = null; v.opened = false;
          touched = true; fixed++;
        }
      });
      if (touched) syncItemFromVariants(item);
    });
  });
  if (fixed) {
    saveDB();
    console.log('[自愈] 修复了 ' + fixed + ' 个「已用完但仍有库存」的变体 → 待开封');
  }
  return fixed;
}

// 数据自愈②：多规格变体的「套数」口径统一（v1.6：明细 = 单套构成）
// 旧版落账把规格份数和写进 packCount（如姨妈巾显示成「67套 × ¥45.34」、库存只算一套 67片）
// v1.6 起：specs 恒为「单套构成」，库存 = Σ 各规格(套餐数 × 单套包数 − 已开包数) × 每包含量 × 每份规格
//   存量明细无法可靠判断是「单套构成」还是「全部总量」→ 一律保守按「全部总量」处理：
//   packCount 归 1 批（1 套 = 全部总量，库存数值完全不变），并标记 specsFolded=true。
//   这样旧数据在展示与消耗上自洽；用户重新编辑保存时，填上真实套餐数即可切换成「单套构成」口径。
function migrateSpecPacks() {
  var marked = 0;
  DB.zones.forEach(function(zone) {
    (zone.items || []).forEach(function(item) {
      if (!item.variants || !item.variants.length) return;
      var touched = false;
      item.variants.forEach(function(v) {
        var sp = variantSpecsOf(v);
        if (!sp.length) return;
        // 已开包数归零（新字段，旧数据没有）
        (v.specs || []).forEach(function (s) { if (typeof s.openPacks === 'undefined') s.openPacks = 0; });
        if (v.specsFolded) return;
        v.packCount = 1;
        v.packQty = Math.round(variantSpecPerSetPieces(v) * 100) / 100;
        v.packWeight = 1;
        v.packUnit = sp[0].unit || v.packUnit;
        v.packWeightUnit = sp[0].unit || v.packWeightUnit;
        v.specsFolded = true;
        marked++;
        touched = true;
      });
      if (touched) syncItemFromVariants(item);
    });
  });
  if (marked) {
    saveDB();
    console.log('[自愈] 多规格口径：统一标记 ' + marked + ' 个变体为「1 套 = 全部总量」');
  }
  return marked;
}

// ===== 四模型重定义：数据迁移 =====
// consumeMode 四值：count(①件数周期) / spec(②规格周期) / instant(③即时消耗) / combo(④组合消耗)
// 旧值映射：pack→spec、unit→count、oneShot=true→instant、有 specs→combo 优先
var CONSUME_MODELS = {
  count:   { key: 'count',   icon: '🧴', name: '件数周期型', desc: '开瓶→空瓶，按"件/瓶"消耗（面霜、牙膏、洗发水）' },
  spec:    { key: 'spec',    icon: '🐱', name: '规格周期型', desc: '开包→吃完，按 KG/L 消耗（猫粮、大米、大桶洗衣液）' },
  instant: { key: 'instant', icon: '🧻', name: '即时消耗型', desc: '点一次扣一份，开袋即用完（面膜、棉片、一次性内裤）' },
  combo:   { key: 'combo',   icon: '🧩', name: '组合消耗型', desc: '按子规格分别开包，包数周期+片数汇总（姨妈巾、混合套餐）' }
};
function consumeModelOf(item) {
  if (!item) return 'spec';
  var m = item.consumeMode;
  if (m === 'count' || m === 'spec' || m === 'instant' || m === 'combo') return m;
  // 旧值兼容：oneShot 是最强信号（开封即用完）→ 先判 instant；
  // 有 specs 的优先判 combo（旧的多规格物品本就是组合语义）；pack→spec、unit→count
  if (item.oneShot === true) return 'instant';
  if ((item.variants || []).some(function (v) { return variantSpecsOf(v).length; })) return 'combo';
  if (m === 'unit') return 'count';
  return 'spec';
}
// 迁移：specs 从一层(qty×content)升级为两层(packCount包数 × packQty每包含量 × content每份规格)
// 原则：库存数值必须不变 —— qty=3,content=44 → packCount=3,packQty=1,content=44（3×1×44=132，与旧值一致）
function migrateSpecTwoLayer(target) {
  var db = target || DB;
  if (!db || !db.zones) return 0;
  var fixed = 0;
  db.zones.forEach(function(zone) {
    (zone.items || []).forEach(function(item) {
      if (!item.variants || !item.variants.length) return;
      var touched = false;
      item.variants.forEach(function(v) {
        (v.specs || []).forEach(function(s) {
          if (s.packCount === undefined || s.packCount === null) {
            s.packCount = +s.qty || 0;                 // 旧 qty → 包数
            if (s.packQty === undefined || s.packQty === null || s.packQty === '') s.packQty = 1;
            if (s.content === undefined || s.content === null || s.content === '') s.content = 1;
            fixed++; touched = true;
          }
          // 保留 qty 字段做兼容读取（旧代码路径），但以 packCount 为准
        });
      });
      // consumeMode 归一（写入四值之一，避免每次都要跑兼容分支）
      var want = consumeModelOf(item);
      if (item.consumeMode !== want) { item.consumeMode = want; touched = true; }
      if (touched) syncItemFromVariants(item);
    });
  });
  if (fixed && typeof DB !== 'undefined' && db === DB) {
    saveDB();
    console.log('[自愈] 规格两层结构：迁移 ' + fixed + ' 条规格明细（库存数值不变）');
  }
  return fixed;
}

// 数据自愈③：清洗「件数单位」字段
// 套餐内单位（packUnit）语义 = 包/瓶/支这类件数单位；旧版表单曾把它和「规格单位」混填，
// 存量数据里出现 packUnit='ml' → 显示成「2ml/套 × 30ml/ml」「当前库存 1 套（2ml）」「告急阈值 1ml」
// → 清掉含量单位值，显示层由 packQtyUnitOf/mainPackUnit 回退「包」；同时把用户显式填的 packQtyUnit 保住
function migratePackUnit(target) {
  var db = target || DB;
  if (!db || !db.zones) return 0;
  var fixed = 0;
  db.zones.forEach(function(zone) {
    (zone.items || []).forEach(function(item) {
      if (!item.variants || !item.variants.length) return;
      item.variants.forEach(function(v) {
        if (v.packUnit && isContentUnitText(v.packUnit)) {
          v.packUnit = '';
          // 若没有显式的件数单位，给「包」兜底（保存后显示稳定，不再依赖回退链）
          if (!v.packQtyUnit) v.packQtyUnit = '包';
          fixed++;
        }
        // packQtyUnit 本身若被填成含量单位（手滑），同样纠正
        if (v.packQtyUnit && isContentUnitText(v.packQtyUnit)) { v.packQtyUnit = '包'; fixed++; }
      });
    });
  });
  if (fixed && typeof DB !== 'undefined' && db === DB) {
    saveDB();
    console.log('[自愈] 件数单位：清洗 ' + fixed + ' 个变体被误填成含量单位（ml/g/kg）的套餐内单位');
  }
  return fixed;
}

// ===== 套餐模型展示辅助 =====
// 变体「购买总量」含量（用于折算单价，不随消耗变化）
//   混合规格 = 套餐数 × 单套构成合计
function variantTotalWeight(v) {
  if (variantSpecsOf(v).length) {
    return Math.round(variantPacksBought(v) * variantSpecPerSet(v) * 100) / 100;
  }
  var w = parseFloat(v.packWeight) || 0;
  if (w <= 0) return 0;
  var pc = parseFloat(v.packCount) || 0;
  var pq = parseFloat(v.packQty) || 1;
  return pc * pq * w;
}
// 含量单位：默认 kg（兼容旧数据未存该字段的情况）
function weightUnitOf(v) { return v.packWeightUnit || 'kg'; }
// 变体当前剩余含量：混合规格走明细汇总；普通变体 = 剩余件数(stock) × 每小单位含量(packWeight)
// 注意区分 variantTotalWeight（购买总量，用于折算单价）；这里算的是「现在还剩多少」
// 没配含量（packWeight 缺失）→ null（无法折算）
function variantStockContent(v) {
  if (variantSpecsOf(v).length) return variantSpecContent(v);
  var w = parseFloat(v.packWeight) || 0;
  if (w <= 0) return null;
  return Math.round(((parseFloat(v.stock) || 0) * w) * 100) / 100;
}
// 物品当前总剩余含量：每个变体都能折算含量才返回总数；任一变体没配含量 → null
function itemStockContent(item, onlyVariants) {
  var vs = (onlyVariants && onlyVariants.length) ? onlyVariants : (item.variants || []);
  if (!vs.length) return null;
  var t = 0;
  for (var i = 0; i < vs.length; i++) {
    var c = variantStockContent(vs[i]);
    if (c === null) return null;
    t += c;
  }
  return Math.round(t * 100) / 100;
}
// 折算单价：有重量→每KG单价，否则→每小单位单价
function variantUnitPrice(v) {
  var tp = v.totalPrice || 0;
  if (v.packWeight && v.packWeight > 0) {
    var tw = variantTotalWeight(v);
    if (tw > 0) return tp / tw;
  }
  var stock = v.stock || 0;
  if (stock > 0) return tp / stock;
  return v.price || 0;
}
// 库存展示文本：packQty>1 时显示"X套 (+余Y个)"
function variantPackText(v, item) {
  var spAll = variantSpecsOf(v);
  if (spAll.length) {
    // v1.7 双轨制：主数字 = 购入总量（套数 × 单套总量），括号按均值折算「份」；未开量作补充。
    // 混合规格的「剩余套数」没有意义（凑不出整套但替换装还有 2 包），绝不显示 ml 冒充件数。
    var totalW = variantTotalWeight(v);          // 购入总量（1520ml）
    var u0 = variantSpecUnit(v);
    var avg = variantAvgPiece(v);
    var leftW = variantSpecContent(v);           // 未开剩余（400ml）
    var t = trimNum(totalW) + u0;
    if (avg > 0) t += '（约 ' + trimNum(round1(totalW / avg)) + ' 份）';
    if (leftW > 0 && leftW < totalW) t += ' · 未开 ' + trimNum(leftW) + u0;
    else if (leftW <= 0) t += ' · 已开完';
    return t;
  }
  var stock = v.stock || 0;
  var pq = v.packQty || 1;
  var unit = packQtyUnitOf(v); // 件数单位（包/瓶/支…），不会是 ml 这类含量单位
  if (pq > 1 && stock > 0) {
    var packs = Math.floor(stock / pq);
    var rem = stock % pq;
    var t2 = packs + ' 套';
    if (rem > 0) t2 += ' + ' + rem + ' ' + unit;
    return t2 + '（' + stock + unit + '）';
  }
  return stock + ' ' + unit;
}
// 按含量单位折算可比单价文本（kg→每kg；g/ml→每100g/每100ml；L→每L）
function unitPricePerWeightText(v) {
  var u = weightUnitOf(v);
  var up = variantUnitPrice(v); // 已是基于原始单位的单价（每 kg/g/ml/L）
  if (u === 'g') return '每100g ¥' + (up * 100).toFixed(2);
  if (u === 'ml') return '每100ml ¥' + (up * 100).toFixed(2);
  if (u === 'L') return '每L ¥' + up.toFixed(2);
  return '每kg ¥' + up.toFixed(2); // kg 或默认
}
// 比价提示文本（重量或单价维度）
function variantPriceCompareText(v) {
  if (v.packWeight && v.packWeight > 0) return unitPricePerWeightText(v);
  var stock = v.stock || 0;
  if (stock > 0) return '每' + (v.packUnit || '个') + ' ¥' + (variantUnitPrice(v)).toFixed(2);
  return '每' + (v.packUnit || '个') + ' ¥' + (v.price || 0).toFixed(2);
}

// 耐用品：计算单件物品的总金额（优先用各款 totalPrice，否则用 单价×件数）
function calcDurableTotalPrice(item) {
  if (!item.variants || item.variants.length === 0) return 0;
  var total = item.variants.reduce(function(s, v) {
    var t = v.totalPrice || ((v.price || 0) * (v.stock || 1));
    return s + t;
  }, 0);
  return parseFloat(total.toFixed(2));
}

// 耐用品：计算单件物品的实际件数（所有variant数量之和）
function calcDurableItemCount(item) {
  if (!item.variants || item.variants.length === 0) return 0;
  return item.variants.length;
}

// 耐用品：计算整个板块的总金额
function calcZoneTotalPrice(zone) {
  if (!zone || !zone.items) return 0;
  return zone.items.reduce(function(s, it) { return s + calcDurableTotalPrice(it); }, 0);
}

function ensureVariants(item) {
  if (!item.variants || item.variants.length === 0) {
    item.variants = [{
      id: genId(), brand: item.brand || item.name, stock: item.stock || 0,
      price: item.currentPrice || 0, channel: item.channel || '',
      photos: item.photos || [], opened: item.opened || false,
      openDate: item.openDate || null, finishDate: item.finishDate || null,
      usedUp: item.usedUp || false, openQty: item.openQty || 0,
      feeling: item.feeling || null, shelfLife: item.shelfLife || null,
      productionDate: item.productionDate || null,
      packCount: item.stock || 0, packPrice: item.currentPrice || 0, packQty: 1, packUnit: item.unit || '个', packWeight: 0
    }];
  }
}

function syncItemFromVariants(item) {
  ensureVariants(item);
  item.stock = item.variants.reduce(function(s, v) { return s + (v.stock || 0); }, 0);
  if (item.variants.length > 0) {
    // 补给品总金额 = 各品牌总价之和
    item.currentPrice = parseFloat(item.variants.reduce(function(s,v){ return s + (v.totalPrice || ((v.price||0)*(v.stock||0))); }, 0).toFixed(2));
    item.channel = item.variants[0].channel;
    // 合并所有变体的照片到 item.photos（用于首页卡片正面展示）
    var allVariantPhotos = [];
    item.variants.forEach(function(v) {
      if (v.photos && v.photos.length > 0) {
        v.photos.forEach(function(p) { allVariantPhotos.push(p); });
      }
    });
    // 优先保留顶层 item.photos 中已有的照片，再加上变体照片去重
    var seen = {};
    var merged = [];
    (item.photos || []).concat(allVariantPhotos).forEach(function(p) {
      if (p && !seen[p]) { seen[p] = true; merged.push(p); }
    });
    item.photos = merged;
    item.opened = item.variants.some(function(v) { return v.opened && !v.usedUp; });
    item.usedUp = item.variants.length > 0 && item.variants.every(function(v) { return v.usedUp; });
    var active = item.variants.find(function(v) { return v.opened && !v.usedUp; });
    if (active) { item.openDate = active.openDate; item.openQty = active.openQty; }
  }
}

// 耐用品：从variants同步到item级别
function syncDurableFromVariants(item) {
  if (!item.variants || item.variants.length === 0) {
    item.variants = [{ id: genId(), brand: item.name || '第1件', stock: 1, price: item.currentPrice || 0, photos: item.photos || [] }];
  }
  item.stock = item.variants.reduce(function(s,v){ return s + (v.stock||1); }, 0);
  item.unit = '件';
  // 合并所有variant照片到item级别（用于兼容旧逻辑）
  var allPhotos = [];
  item.variants.forEach(function(v) {
    if (v.photos && v.photos.length > 0) {
      allPhotos = allPhotos.concat(v.photos);
    }
  });
  item.photos = allPhotos;
  item.currentPrice = parseFloat((item.variants[0].price || 0).toFixed(2));
}

// ========== 页面切换 ==========
var currentZoneId = null;
var currentCategoryId = null;
var currentSearchQuery = '';

function openSettings() { showPage('settings'); }

function showPage(page) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById('page-' + page).classList.add('active');

  document.querySelectorAll('.navbar').forEach(function(n) { n.style.display = 'none'; });
  if (page === 'home') document.getElementById('nav-home').style.display = 'flex';
  else if (page === 'zone') document.getElementById('nav-zone').style.display = 'flex';
  else if (page === 'pool') document.getElementById('nav-pool').style.display = 'flex';
  else if (page === 'settings') document.getElementById('nav-settings').style.display = 'flex';
  else if (page === 'report') document.getElementById('nav-report').style.display = 'flex';

  document.querySelectorAll('.tabbar-item').forEach(function(t) {
    t.classList.toggle('active', t.dataset.tab === page);
  });

  if (page === 'home') renderHome();
  else if (page === 'zone') renderZone();
  else if (page === 'pool') renderTasks();
  else if (page === 'settings') renderSettings();
  else if (page === 'report') renderReport();

  window.scrollTo(0, 0);
}

function enterZone(zoneId) {
  currentZoneId = zoneId;
  var zone = getZone(zoneId);
  document.getElementById('zone-title').textContent = zone.icon + ' ' + zone.name;
  currentCategoryId = 'all';
  currentSearchQuery = '';
  showPage('zone');
}

// ========== 数据查询 ==========
function getZone(zoneId) {
  for (var i = 0; i < DB.zones.length; i++) {
    if (DB.zones[i].id === zoneId) return DB.zones[i];
  }
  return null;
}
function getCategory(zoneId, catId) {
  var zone = getZone(zoneId);
  if (!zone) return null;
  for (var i = 0; i < zone.categories.length; i++) {
    if (zone.categories[i].id === catId) return zone.categories[i];
  }
  return null;
}

// ========== 两级分类辅助 ==========
// 取某大类的所有子分类（无 parentId 的分类视为大类）
function getSubcategories(zone, catId) {
  if (!zone || !zone.categories) return [];
  return zone.categories.filter(function(c) { return c.parentId === catId; });
}
// 判断分类是否为子分类
function isSubcategory(zone, cat) {
  return !!(cat && cat.parentId && zone.categories.some(function(c) { return c.id === cat.parentId; }));
}
// 返回分类路径："大类 · 子类"（大类本身只返回大类名）
function getCategoryPath(zoneId, catId) {
  var zone = getZone(zoneId);
  if (!zone) return '';
  var cat = getCategory(zoneId, catId);
  if (!cat) return '';
  if (cat.parentId) {
    var parent = getCategory(zoneId, cat.parentId);
    if (parent) return parent.name + ' · ' + cat.name;
  }
  return cat.name;
}
// 搜索匹配：物品名/备注/位置/分类路径/每件描述与备注
function matchesSearch(item, zone, q) {
  q = (q || '').toLowerCase();
  if (!q) return true;
  var hay = [
    item.name || '',
    item.notes || '',
    item.location || ''
  ];
  if (item.categoryId) hay.push(getCategoryPath(zone.id, item.categoryId));
  (item.variants || []).forEach(function(v) {
    hay.push(v.brand || '');
    if (v.notes) hay.push(v.notes);
  });
  return hay.some(function(s) { return s.toLowerCase().indexOf(q) >= 0; });
}

// 开袋即用完：完全由用户手动开关控制，不再根据分类名/物品名自动猜测

// ========== 归档（不再补货/不再提醒，但保留全部历史数据）==========
function isArchived(it) { return !!(it && it.archived); }
function visibleItems(zone) { return (zone.items || []).filter(function(it) { return !it.archived; }); }
function archivedItemsOf(zone) { return (zone.items || []).filter(function(it) { return !!it.archived; }); }
function archivedCountAll() {

function getItemsByCategory(zoneId, catId) {

  var allowedIds = null;
