<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4A90E2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家有">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>家有</title>
<script src="supabase.js" defer></script>
<style>
/* ========== 设计系统 ========== */
:root {
  --bg: #F2F2F7;
  --card-bg: #FFFFFF;
  --text: #1C1C1E;
  --text-secondary: #8E8E93;
  --text-tertiary: #C7C7CC;
  --separator: #E5E5EA;
  --accent: #007AFF;
  --red: #FF3B30;
  --orange: #FF9500;
  --yellow: #FFCC00;
  --green: #34C759;
  --blue: #5AC8FA;
  --purple: #AF52DE;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ========== 导航栏 ========== */
.navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(242,242,247,0.85);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 0.5px solid var(--separator);
  padding: 12px 16px 8px;
  display: flex; align-items: center; justify-content: space-between;
}
.navbar h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.navbar .nav-actions { display: flex; gap: 8px; align-items: center; }
.cloud-status {
  font-size: 12px; font-weight: 600;
  padding: 5px 10px; border-radius: 12px;
  background: rgba(0,122,255,0.08); color: var(--accent);
  white-space: nowrap; cursor: pointer;
  transition: opacity 0.15s;
}
.cloud-status:active { opacity: 0.6; }
.cloud-status.synced { background: rgba(52,199,89,0.12); color: var(--green); }
.cloud-status.syncing { background: rgba(0,122,255,0.12); color: var(--accent); }
.cloud-status.pending { background: rgba(255,149,0,0.12); color: var(--orange); }
.cloud-status.offline { background: rgba(142,142,147,0.12); color: var(--text-secondary); }
.cloud-status.error { background: rgba(255,59,48,0.12); color: var(--red); }
.nav-btn {
  width: 32px; height: 32px;
  border-radius: 50%; border: none;
  background: rgba(0,122,255,0.1);
  color: var(--accent);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s;
}
.nav-btn:active { transform: scale(0.88); }

/* ========== 底部Tab栏 ========== */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255,255,255,0.92);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--separator);
  display: flex; padding: 6px 0 20px;
  max-width: 600px; margin: 0 auto;
}
.tabbar-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 2px; cursor: pointer;
  transition: opacity 0.15s; -webkit-user-select: none; user-select: none;
}
.tabbar-item:active { opacity: 0.5; }
.tabbar-item .tab-icon { font-size: 24px; line-height: 1; }
.tabbar-item .tab-label { font-size: 10px; color: var(--text-secondary); font-weight: 500; }
.tabbar-item.active .tab-label { color: var(--accent); }
.tabbar-item.active .tab-icon { transform: scale(1.1); }

/* ========== 页面容器 ========== */
.page {
  max-width: 600px; margin: 0 auto;
  padding: 0 16px 100px;
  display: none;
}
.page.active { display: block; }

/* ========== 按钮系统 ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600; border: none;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  font-family: var(--font);
}
.btn:active { transform: scale(0.96); opacity: 0.7; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn-success { background: var(--green); color: #fff; }
.btn-warn { background: var(--orange); color: #fff; }
.btn-ghost { background: transparent; color: var(--accent); }
.btn-full { width: 100%; padding: 14px; font-size: 16px; }
.btn-outline { background: transparent; border: 1.5px solid var(--separator); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 13px; }

/* ========== 卡片 ========== */
.card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

/* ========== 首页预警条 ========== */
.alert-strip {
  display: flex; gap: 8px; margin-bottom: 16px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 2px 0;
}
.alert-strip::-webkit-scrollbar { display: none; }
.alert-badge {
  flex-shrink: 0; padding: 10px 14px; border-radius: 12px;
  display: flex; flex-direction: column; gap: 2px;
  min-width: 100px; cursor: pointer;
  transition: transform 0.15s;
}
.alert-badge:active { transform: scale(0.95); }
.alert-badge .badge-num { font-size: 24px; font-weight: 800; line-height: 1.1; }
.alert-badge .badge-label { font-size: 11px; opacity: 0.9; font-weight: 500; }
.alert-red { background: linear-gradient(135deg, #FF3B30, #FF6B6B); color: #fff; }
.alert-yellow { background: linear-gradient(135deg, #FF9500, #FFB340); color: #fff; }
.alert-blue { background: linear-gradient(135deg, #5AC8FA, #7AD9FF); color: #fff; }
.alert-green { background: linear-gradient(135deg, #34C759, #5AD680); color: #fff; }
.alert-gray { background: linear-gradient(135deg, #8E8E93, #AEAEB2); color: #fff; }
.alert-purple { background: linear-gradient(135deg, #AF52DE, #C97AF0); color: #fff; }
@keyframes pulse-red {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(255,59,48,0); }
}
.alert-red.pulse { animation: pulse-red 2s infinite; }

/* ========== 区块标题 ========== */
.section-title {
  font-size: 20px; font-weight: 700;
  margin: 20px 0 12px; letter-spacing: -0.3px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title .section-action {
  font-size: 14px; font-weight: 500; color: var(--accent); cursor: pointer;
}

/* ========== 拥有量卡 ========== */
.own-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.own-card {
  background: var(--card-bg); border-radius: var(--radius); padding: 14px;
  box-shadow: var(--shadow); cursor: pointer; transition: transform 0.15s;
}
.own-card:active { transform: scale(0.97); }
.own-card .own-icon { font-size: 28px; }
.own-card .own-name { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
.own-card .own-num { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
.own-card .own-unit { font-size: 13px; color: var(--text-secondary); }
.own-card .own-idle { font-size: 11px; color: var(--orange); margin-top: 2px; font-weight: 600; }

/* ========== AI分析卡 ========== */
.ai-card {
  background: linear-gradient(135deg, #E0F7FA, #B2DFDB, #E1BEE7);
  color: #1C1C1E; border-radius: var(--radius);
  padding: 18px; margin-bottom: 16px; box-shadow: var(--shadow-lg);
  border: 1px solid rgba(178,223,219,0.4);
}
.ai-card .ai-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.ai-card .ai-title { font-size: 16px; font-weight: 700; color: #00695C; }
.ai-card .ai-badge {
  font-size: 10px; background: rgba(0,105,92,0.12);
  padding: 2px 8px; border-radius: 6px; font-weight: 600; color: #00695C;
}
.ai-card .ai-section { margin-bottom: 14px; }
.ai-card .ai-section:last-child { margin-bottom: 0; }
.ai-card .ai-section-title {
  font-size: 12px; color: #00897B;
  margin-bottom: 6px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.ai-card .ai-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 0.5px solid rgba(0,105,92,0.12);
  font-size: 14px;
}
.ai-card .ai-item:last-child { border-bottom: none; }
.ai-card .ai-item .ai-val { font-weight: 700; color: #00695C; }
.ai-card .ai-suggest {
  background: rgba(255,255,255,0.5); border-radius: 8px;
  padding: 10px 12px; font-size: 13px; line-height: 1.6; color: #1C1C1E;
}
.ai-card .ai-suggest strong { color: #00897B; }
.ai-card .ai-suggest .donate-buy { color: #007AFF; font-weight: 700; }
.ai-card .ai-suggest .stop-buy { color: var(--red); font-weight: 700; }

/* ========== 进度条 ========== */
.bar-wrap { width: 100%; height: 8px; background: var(--separator); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.bar-green { background: var(--green); }
.bar-yellow { background: var(--yellow); }
.bar-orange { background: var(--orange); }
.bar-red { background: var(--red); }
.bar-blue { background: var(--blue); }
.bar-purple { background: var(--purple); }

/* 大进度条（库存可视化） */
.stock-bar {
  width: 100%; height: 12px; border-radius: 6px;
  overflow: hidden; background: var(--separator); position: relative;
}
.stock-bar .stock-fill {
  height: 100%; border-radius: 6px; transition: width 0.5s ease;
}
.stock-bar.low .stock-fill { background: linear-gradient(90deg, #FF3B30, #FF6B6B); }
.stock-bar.mid .stock-fill { background: linear-gradient(90deg, #FF9500, #FFB340); }
.stock-bar.high .stock-fill { background: linear-gradient(90deg, #34C759, #5AD680); }
.stock-bar.over .stock-fill { background: linear-gradient(90deg, #5AC8FA, #7AD9FF); }

/* 保质期进度条 */
.shelf-bar {
  width: 100%; height: 6px; border-radius: 3px;
  overflow: hidden; background: var(--separator);
}
.shelf-bar .shelf-fill { height: 100%; transition: width 0.5s ease; }

/* ========== 物品卡片网格 ========== */
.item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.item-card {
  background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
  cursor: pointer; transition: transform 0.15s;
  position: relative;
}
.item-card:active { transform: scale(0.97); }
.item-card .card-photo {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-size: 40px; color: var(--text-tertiary);
}
.item-card .card-photo img { width: 100%; height: 100%; object-fit: cover; }
.item-card .card-body { padding: 10px 12px; }
.item-card .card-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-card .card-info { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.item-card .card-mini-bar { margin-top: 6px; }

/* 耐用品紧凑卡片（无大照片区，隐私模式） */
.item-card-compact {
  min-height: 80px;
  display: flex; flex-direction: column; justify-content: center;
}
.item-card-compact .card-body { padding: 16px 14px; }
.item-card-compact .card-name { font-size: 16px; }

/* 变体缩略图网格（卡片背面） */
.variant-thumb-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
.variant-thumb { position:relative; border-radius:10px; overflow:hidden; background:var(--bg); }
.variant-thumb img { width:100%; aspect-ratio:1; object-fit:cover; display:block; cursor:pointer; }
.variant-thumb-no-photo { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:28px; color:var(--text-tertiary); background:var(--bg); }
.variant-thumb .variant-label { padding:6px 8px; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.variant-thumb .variant-sub { padding:0 8px 8px; font-size:11px; color:var(--text-secondary); }
.variant-thumb .variant-del {
  position:absolute; top:6px; right:6px;
  width:24px; height:24px; border-radius:50%;
  background:rgba(0,0,0,0.5); color:#fff;
  border:none; font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  z-index:2;
}

/* 全屏照片查看器 */
.photo-viewer {
  position:fixed; inset:0; z-index:500; background:#000;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.photo-viewer img {
  max-width:100%; max-height:100%; object-fit:contain;
  touch-action:none; will-change:transform;
}
.photo-viewer-close {
  position:absolute; top:16px; right:16px; z-index:501;
  width:40px; height:40px; border-radius:50%;
  background:rgba(255,255,255,0.2); color:#fff;
  border:none; font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.photo-viewer-counter {
  position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
  color:#fff; font-size:14px; font-weight:600; z-index:501;
  background:rgba(0,0,0,0.4); padding:6px 16px; border-radius:20px;
}

/* 卡片角标 */
.card-badge {
  position: absolute; top: 8px; right: 8px;
  padding: 3px 8px; border-radius: 8px;
  font-size: 10px; font-weight: 700; color: #fff;
  backdrop-filter: blur(4px);
}
.badge-expire { background: rgba(255,59,48,0.9); }
.badge-warn { background: rgba(255,149,0,0.9); }
.badge-low { background: rgba(255,149,0,0.9); }
.badge-over { background: rgba(90,200,250,0.9); }
.badge-idle { background: rgba(175,82,222,0.9); }
.badge-good { background: rgba(52,199,89,0.85); }
.badge-bad { background: rgba(255,59,48,0.85); }

/* 卡片3D翻面 */
.card-detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 16px;
}
.card-detail-overlay.show { display: flex; }
.flip-card {
  width: 100%; max-width: 360px; max-height: 85vh;
  perspective: 1200px; position: relative;
}
.flip-inner {
  width: 100%; position: relative;
  transition: transform 0.6s cubic-bezier(0.4,0,0.2,1);
  transform-style: preserve-3d;
}
.flip-inner.flipped { transform: rotateY(180deg); }
.flip-face {
  width: 100%; backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 20px; overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.flip-front { background: var(--card-bg); }
.flip-back {
  position: absolute; top: 0; left: 0;
  transform: rotateY(180deg); background: var(--card-bg);
  max-height: 85vh; overflow-y: auto;
}

/* 卡片正面（弹窗版） */
.detail-front { padding: 0; }
.detail-front .detail-photo {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
  font-size: 60px; color: var(--text-tertiary); position: relative;
}
.detail-front .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
.detail-front .detail-body { padding: 16px; }
.detail-front .detail-name { font-size: 22px; font-weight: 700; }
.detail-front .detail-cat { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
.detail-front .detail-tap-hint {
  text-align: center; font-size: 12px; color: var(--text-tertiary);
  margin-top: 12px; padding: 8px;
  border: 1px dashed var(--separator); border-radius: 8px;
}

/* 卡片背面 */
.detail-back { padding: 16px; }
.detail-back .back-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.detail-back .back-title { font-size: 18px; font-weight: 700; }
.detail-back .back-close {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg); border: none; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.back-section { margin-bottom: 16px; }
.back-section-title {
  font-size: 12px; color: var(--text-secondary);
  font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 8px;
}
.back-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 0.5px solid var(--separator); font-size: 14px;
}
.back-row:last-child { border-bottom: none; }
.back-row .back-label { color: var(--text-secondary); }
.back-row .back-value { font-weight: 600; }

/* ========== 表单 ========== */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 13px; color: var(--text-secondary); font-weight: 600; margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--separator); background: var(--card-bg);
  font-size: 15px; font-family: var(--font); color: var(--text);
  outline: none; transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: none; min-height: 60px; }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }

/* 图片上传 */
.photo-upload {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.photo-slot {
  aspect-ratio: 1; border-radius: var(--radius-sm);
  border: 2px dashed var(--separator); background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; color: var(--text-tertiary);
  cursor: pointer; overflow: hidden; position: relative;
}
.photo-slot img { width: 100%; height: 100%; object-fit: cover; }
.photo-slot.has-photo { border-style: solid; border-color: var(--separator); }
.photo-slot .remove-photo {
  position: absolute; top: 4px; right: 4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,0.5); color: #fff;
  border: none; font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

/* ========== 搜索栏 ========== */
.search-bar {
  position: relative; margin-bottom: 12px;
}
.search-bar input {
  width: 100%; padding: 10px 14px 10px 36px;
  border-radius: 10px; border: none;
  background: rgba(118,118,128,0.12);
  font-size: 15px; font-family: var(--font); outline: none;
}
.search-bar .search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 16px; color: var(--text-tertiary);
}

/* ========== 分类标签 ========== */
.cat-tabs {
  display: flex; gap: 8px; margin-bottom: 14px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; padding: 2px 0;
}
.cat-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  flex-shrink: 0; padding: 6px 14px; border-radius: 16px;
  background: var(--card-bg); font-size: 14px; font-weight: 500;
  color: var(--text-secondary); cursor: pointer;
  border: 1.5px solid transparent; transition: all 0.2s;
  -webkit-user-select: none; user-select: none;
  display: flex; align-items: center; gap: 4px;
}
.cat-tab:active { transform: scale(0.95); }
.cat-tab.active { background: var(--accent); color: #fff; }
.cat-tab .cat-edit-icon { font-size: 12px; opacity: 0.6; }

/* ========== 弹窗 ========== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.4);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center;
  overflow: hidden;
  overscroll-behavior: contain;
  touch-action: pan-y;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card-bg); border-radius: 20px 20px 0 0;
  width: 100%; max-width: 600px; max-height: 90vh;
  overflow-x: hidden; overflow-y: auto;
  padding: 20px 16px 30px;
  animation: slideUp 0.3s ease;
  box-sizing: border-box;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
  width: 36px; height: 5px; border-radius: 3px;
  background: var(--text-tertiary); margin: 0 auto 16px;
}
.modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; text-align: center; }

/* ========== 空状态 ========== */
.empty-state {
  text-align: center; padding: 40px 20px;
  color: var(--text-tertiary);
}

<script>
/* ================================================================
   家有 App - 核心逻辑
   ================================================================ */

// ========== Supabase 云同步配置 ==========
const SUPABASE_URL = 'https://pnahlubyqqzcjrzhnzfa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UpBLW71YgaQCcm6YGCrGsw_urK1cVTd';
const BUCKET_NAME = 'jiayou-photos';
const CLOUD_SYNC_DEBOUNCE_MS = 2500;

var supabaseClient = null;
var currentUser = null;
var cloudSyncState = { status: 'idle', message: '', lastSyncAt: null, pending: false };
var cloudSyncTimer = null;
var cloudSyncInProgress = false;

try {
  if (window.supabase && window.supabase.createClient) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
  } else {
    console.error('window.supabase 不存在');
    toast('Supabase 库未加载，请检查网络');
  }
} catch(e) {
  console.error('Supabase初始化失败', e);
  toast('Supabase初始化失败: ' + (e.message || e));
}

// 生成稳定设备ID（用于匿名用户识别）
function getDeviceId() {
  var id = localStorage.getItem('jiayou_device_id');
  if (!id) {
    id = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('jiayou_device_id', id);
  }
  return id;
}

// 尝试匿名登录；失败则使用设备本地模式（仍可用，只是不同步）
async function initAuth() {
  if (!supabaseClient) {
    toast('未连接云端服务');
    return;
  }
  try {
    var { data: { session }, error } = await supabaseClient.auth.getSession();
    if (error) throw error;
    if (session && session.user) {
      currentUser = session.user;
      updateCloudUI();
      return;
    }
    // 尝试匿名登录
    var { data, error: signErr } = await supabaseClient.auth.signInAnonymously();
    if (signErr) {
      console.log('匿名登录失败，尝试邮箱降级:', signErr.message);
      await fallbackAnonymousLogin();
      return;
    }
    currentUser = data.user;
    localStorage.setItem('jiayou_anon_email', data.user.email || '');
    updateCloudUI();
  } catch(e) {
    console.error('认证初始化失败', e);
    toast('认证失败: ' + (e.message || e));
    await fallbackAnonymousLogin();
  }
}

async function fallbackAnonymousLogin() {
  if (!supabaseClient) return;
  var deviceId = getDeviceId();
  var email = localStorage.getItem('jiayou_anon_email');
  var password = localStorage.getItem('jiayou_anon_password');
  var isNew = false;
  if (!email) {
    email = deviceId + '@jiayou.app';
    password = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    isNew = true;
  }
  try {
    if (isNew) {
      // 新设备：直接注册
      var { data: signUpData, error: signUpErr } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: { data: { source: 'jiayou_app' } }
      });
      if (signUpErr) throw signUpErr;
      if (!signUpData.user) throw new Error('注册后未返回用户');
      currentUser = signUpData.user;
      localStorage.setItem('jiayou_anon_email', email);
      localStorage.setItem('jiayou_anon_password', password);
      updateCloudUI();
      toast('已创建云端账号');
      return;
    }
    // 已有账号：尝试登录
    var { data: signInData, error: signInErr } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });
    if (!signInErr && signInData.user) {
      currentUser = signInData.user;
      updateCloudUI();
      return;
    }
    // 登录失败：可能账号被删或密码错，重新注册
    var { data: signUpData2, error: signUpErr2 } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: { data: { source: 'jiayou_app' } }
    });
    if (signUpErr2) throw signUpErr2;
    if (!signUpData2.user) throw new Error('重新注册后未返回用户');
    currentUser = signUpData2.user;
    updateCloudUI();
    toast('已创建云端账号');
  } catch(e) {
    console.error('降级认证失败', e);
    toast('云端登录失败: ' + (e.message || e));
    updateCloudUI();
  }
}

function updateCloudUI() {
  var el = document.getElementById('cloud-status');
  var settingsEl = document.getElementById('settings-cloud-status');
  var text = '☁️ 未登录', cls = 'cloud-status offline';
  if (!currentUser) {
    text = '☁️ 未登录'; cls = 'cloud-status offline';
  } else if (cloudSyncInProgress) {
    text = '🔄 同步中...'; cls = 'cloud-status syncing';
  } else if (cloudSyncState.pending) {
    text = '⏳ 待同步'; cls = 'cloud-status pending';
  } else if (cloudSyncState.lastSyncAt) {
    var t = new Date(cloudSyncState.lastSyncAt);
    text = '✓ 已同步 ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
    cls = 'cloud-status synced';
  } else {
    text = '☁️ 已登录'; cls = 'cloud-status online';
  }
  if (el) { el.textContent = text; el.className = cls; }
  if (settingsEl) { settingsEl.textContent = text.replace(/^[^\s]+\s/, ''); }
}

function setCloudStatus(status, message) {
  cloudSyncState.status = status;
  if (message) cloudSyncState.message = message;
  updateCloudUI();
}

// 从本地数据中提取所有照片（base64），上传到 Storage，替换为 URL
async function uploadAllLocalPhotos() {
  if (!supabaseClient || !currentUser) return;
  var uploads = [];
  DB.zones.forEach(function(zone) {
    zone.items.forEach(function(item) {
      (item.photos || []).forEach(function(photo, idx) {
        if (photo && photo.startsWith && photo.startsWith('data:')) {
          uploads.push({ zoneId: zone.id, itemId: item.id, field: 'photos', idx: idx, data: photo });
        }
      });
      (item.variants || []).forEach(function(v, vidx) {
        (v.photos || []).forEach(function(photo, pidx) {
          if (photo && photo.startsWith && photo.startsWith('data:')) {
            uploads.push({ zoneId: zone.id, itemId: item.id, field: 'variant_photos', vidx: vidx, pidx: pidx, data: photo });
          }
        });
      });
    });
  });
  if (uploads.length === 0) return;
  setCloudStatus('syncing', '上传照片中...');
  for (var i = 0; i < uploads.length; i++) {
    var u = uploads[i];
    try {
      var url = await uploadPhotoToStorage(u.data, u.zoneId, u.itemId);
      if (url) {
        if (u.field === 'photos') {
          var item = findItemByIds(u.zoneId, u.itemId);
          if (item && item.photos && item.photos[u.idx]) item.photos[u.idx] = url;
        } else {
          var item = findItemByIds(u.zoneId, u.itemId);
          if (item && item.variants && item.variants[u.vidx] && item.variants[u.vidx].photos) {
            item.variants[u.vidx].photos[u.pidx] = url;
          }
        }
      }
    } catch(e) { console.error('照片上传失败', e); }
  }
}

function findItemByIds(zoneId, itemId) {
  var zone = DB.zones.find(function(z) { return z.id === zoneId; });
  if (!zone) return null;
  return zone.items.find(function(it) { return it.id === itemId; }) || null;
}

async function uploadPhotoToStorage(base64Data, zoneId, itemId) {
  if (!supabaseClient || !currentUser) return null;
  try {
    var arr = base64Data.split(',');
    var mime = arr[0].match(/:(.*?);/)[1];
    var bstr = atob(arr[1]);
    var n = bstr.length;
    var u8arr = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
    var ext = mime.split('/')[1] || 'jpg';
    var fileName = currentUser.id + '/' + zoneId + '/' + itemId + '/' + Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
    var file = new File([u8arr], fileName.split('/').pop(), { type: mime });
    var { data, error } = await supabaseClient.storage.from(BUCKET_NAME).upload(fileName, file, { upsert: true });
    if (error) throw error;
    var { data: urlData } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(fileName);
    return urlData.publicUrl;
  } catch(e) {
    console.error('上传照片到Storage失败', e);
    return null;
  }
}

// 保存数据到云端
async function syncToCloud(force) {
  if (!supabaseClient || !currentUser) return;
  if (cloudSyncInProgress) {
    cloudSyncState.pending = true;
    updateCloudUI();
    return;
  }
  cloudSyncInProgress = true;
  cloudSyncState.pending = false;
  setCloudStatus('syncing', '正在同步...');
  try {
    // 先上传本地 base64 照片
    await uploadAllLocalPhotos();
    // 保存元数据
    var payload = {
      user_id: currentUser.id,
      data: DB,
      updated_at: new Date().toISOString(),
      version: (DB.version || 1)
    };
    var { error } = await supabaseClient
      .from('app_data')
      .upsert(payload, { onConflict: 'user_id' });
    if (error) throw error;
    cloudSyncState.lastSyncAt = Date.now();
    setCloudStatus('synced', '同步完成');
  } catch(e) {
    console.error('同步到云端失败', e);
    cloudSyncState.pending = true;
    setCloudStatus('error', '同步失败');
  } finally {
    cloudSyncInProgress = false;
    updateCloudUI();
    // 如果有排队中的同步，debounce 后重试
    if (cloudSyncState.pending) {
      clearTimeout(cloudSyncTimer);
      cloudSyncTimer = setTimeout(function() { syncToCloud(true); }, CLOUD_SYNC_DEBOUNCE_MS);
    }
  }
}

function queueCloudSync() {
  if (!supabaseClient || !currentUser) return;
  cloudSyncState.pending = true;
  updateCloudUI();
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(function() { syncToCloud(true); }, CLOUD_SYNC_DEBOUNCE_MS);
}

// 从云端拉取数据
async function syncFromCloud() {
  if (!supabaseClient || !currentUser) return false;
  setCloudStatus('syncing', '从云端恢复...');
  try {
    var { data, error } = await supabaseClient
      .from('app_data')
      .select('data, updated_at')
      .eq('user_id', currentUser.id)
      .single();
    if (error) {
      if (error.code === 'PGRST116') {
        // 云端没有数据，把本地数据推上去
        await syncToCloud(true);
        return true;
      }
      throw error;
    }
    if (!data || !data.data) return false;
    // 合并云端数据到本地
    var cloudData = data.data;
    var localZones = (DB.zones || []);
    var cloudZones = (cloudData.zones || []);
    var localItemsCount = localZones.reduce(function(s, z) { return s + (z.items ? z.items.length : 0); }, 0);
    var cloudItemsCount = cloudZones.reduce(function(s, z) { return s + (z.items ? z.items.length : 0); }, 0);
    if (cloudItemsCount > 0) {
      // 云端有真实数据，用云端覆盖
      DB = mergeDB(DB, cloudData);
      // 立即同步到本地存储
      try { localStorage.setItem('jiayou_db', JSON.stringify(DB)); } catch(e) {}
      saveDBIndexed().catch(function(){});
    } else if (localItemsCount > 0) {
      // 本地有数据但云端没有，推送到云端
      await syncToCloud(true);
      return true;
    } else {
      // 双方都空，用云端（默认空）
      DB = mergeDB(DB, cloudData);
    }
    cloudSyncState.lastSyncAt = Date.now();
    setCloudStatus('synced', '恢复完成');
    return true;
  } catch(e) {
    console.error('从云端恢复失败', e);
    setCloudStatus('error', '恢复失败');
    return false;
  }
}

// ========== IndexedDB 存储（iOS PWA 更可靠） ==========
var DB_NAME = 'jiayou_app_db';
var STORE_NAME = 'data';
var dbPromise = null;

function initIndexedDB() {
  return new Promise(function(resolve) {
    if (dbPromise) { resolve(dbPromise); return; }
    if (!window.indexedDB) { resolve(null); return; }
    var req = indexedDB.open(DB_NAME, 1);
    req.onerror = function() { console.error('IndexedDB打开失败'); resolve(null); };
    req.onsuccess = function(e) { dbPromise = e.target.result; resolve(dbPromise); };
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
  });
}

function saveDBIndexed() {
  return initIndexedDB().then(function(db) {
    if (!db) return Promise.reject('no db');
    return new Promise(function(resolve, reject) {
      try {
        var tx = db.transaction(STORE_NAME, 'readwrite');
        var store = tx.objectStore(STORE_NAME);
        var req = store.put(DB, 'jiayou_db');
        req.onsuccess = function() { resolve(); };
        req.onerror = function(e) { reject(e); };
      } catch(e) { reject(e); }
    });
  });
}

function loadDBIndexed() {
  return initIndexedDB().then(function(db) {
    if (!db) return Promise.resolve(null);
    return new Promise(function(resolve) {
      try {
        var tx = db.transaction(STORE_NAME, 'readonly');
        var store = tx.objectStore(STORE_NAME);
        var req = store.get('jiayou_db');
        req.onsuccess = function(e) { resolve(e.target.result); };
        req.onerror = function() { resolve(null); };
      } catch(e) { resolve(null); }
    });
  });
}

// ========== 存储管理 ==========
function saveDB() {

    try { localStorage.setItem('jiayou_db', json); } catch(lsErr) { console.warn('localStorage保存失败', lsErr); }
    // 排队同步到 Supabase 云端（最可靠）

      toast('本地存储空间不足（云端已存）');

}

async function loadDB() {
  var loaded = false;
  var localRaw = null, idbData = null;
  // 先读 localStorage（5MB 限制可能失败）
  try {
    localRaw = localStorage.getItem('jiayou_db');
  } catch(e) { console.warn('读 localStorage 失败', e); }
  if (localRaw) {
    try {
      var parsed = JSON.parse(localRaw);
      if (parsed && parsed.zones && parsed.zones.length > 0) {
        DB = mergeDB(DB, parsed);
        loaded = true;
      }
    } catch(e) {
      console.warn('localStorage数据加载失败', e);
    }
  }
  // 再读 IndexedDB（容量大）
  try {
    idbData = await loadDBIndexed();
    if (idbData && idbData.zones && idbData.zones.length > 0) {
      var idbItemCount = idbData.zones.reduce(function(s,z){return s+(z.items?z.items.length:0);}, 0);
      var localItemCount = (DB.zones||[]).reduce(function(s,z){return s+(z.items?z.items.length:0);}, 0);
      if (idbItemCount > localItemCount) {

      } else if (!loaded) {

function mergeDB(defaults, loaded) {
  var result = Object.assign({}, defaults, loaded);
  if (!result.settings) result.settings = defaults.settings;
  if (!result.zones) result.zones = [];
  if (!result.pool) result.pool = [];
  if (!result.poolHistory) result.poolHistory = [];
  return result;
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);

// ========== 子物品（品牌变体）辅助 ==========
function getTotalStock(item) {
  if (item.variants && item.variants.length > 0) {
    return item.variants.reduce(function(s, v) { return s + (v.stock || 0); }, 0);
  }
  return item.stock || 0;
}

// 耐用品：计算单件物品的总金额（所有variant的price累加）
function calcDurableTotalPrice(item) {
  if (!item.variants || item.variants.length === 0) return 0;
  return item.variants.reduce(function(s, v) { return s + (v.price || 0); }, 0);
}

// 耐用品：计算单件物品的实际件数（所有variant数量之和）
function calcDurableItemCount(item) {
  if (!item.variants || item.variants.length === 0) return 0;
  return item.variants.length;
}

// 耐用品：计算整个板块的总金额
function calcZoneTotalPrice(zone) {
  if (!zone || !zone.items) return 0;
  return zone.items.reduce(function(s, it) { return s + calcDurableTotalPrice(it); }, 0);
}

function ensureVariants(item) {
  if (!item.variants || item.variants.length === 0) {
    item.variants = [{
      id: genId(), brand: item.brand || item.name, stock: item.stock || 0,
      price: item.currentPrice || 0, channel: item.channel || '',
      photos: item.photos || [], opened: item.opened || false,
      openDate: item.openDate || null, finishDate: item.finishDate || null,
      usedUp: item.usedUp || false, openQty: item.openQty || 0,
      feeling: item.feeling || null, shelfLife: item.shelfLife || null,
      productionDate: item.productionDate || null
    }];
  }
}

function syncItemFromVariants(item) {
  ensureVariants(item);
  item.stock = item.variants.reduce(function(s, v) { return s + (v.stock || 0); }, 0);
  if (item.variants.length > 0) {
    item.currentPrice = item.variants[0].price;
    item.channel = item.variants[0].channel;
    // 合并所有变体的照片到 item.photos（用于首页卡片正面展示）
    var allVariantPhotos = [];
    item.variants.forEach(function(v) {
      if (v.photos && v.photos.length > 0) {
        v.photos.forEach(function(p) { allVariantPhotos.push(p); });
      }
    });
    // 优先保留顶层 item.photos 中已有的照片，再加上变体照片去重
    var seen = {};
    var merged = [];
    (item.photos || []).concat(allVariantPhotos).forEach(function(p) {
      if (p && !seen[p]) { seen[p] = true; merged.push(p); }
    });
    item.photos = merged;
    item.opened = item.variants.some(function(v) { return v.opened && !v.usedUp; });
    item.usedUp = item.variants.length > 0 && item.variants.every(function(v) { return v.usedUp; });
    var active = item.variants.find(function(v) { return v.opened && !v.usedUp; });
    if (active) { item.openDate = active.openDate; item.openQty = active.openQty; }
  }
}

// 耐用品：从variants同步到item级别
function syncDurableFromVariants(item) {
  if (!item.variants || item.variants.length === 0) {
    item.variants = [{ id: genId(), brand: item.name || '第1件', stock: 1, price: item.currentPrice || 0, photos: item.photos || [] }];
  }
  item.stock = item.variants.length;
  item.unit = '件';
  // 合并所有variant照片到item级别（用于兼容旧逻辑）
  var allPhotos = [];
  item.variants.forEach(function(v) {
    if (v.photos && v.photos.length > 0) {
      allPhotos = allPhotos.concat(v.photos);
    }
  });
  item.photos = allPhotos;
  item.currentPrice = item.variants[0].price || 0;
}

// ========== 物品状态判断 ==========
function getItemStatus(item) {
  var status = {
    expired: false, expiring: false,
    lowStock: false, overStock: false,
    shelfPercent: 100, daysLeft: null
  };

  var totalStock = getTotalStock(item);

  // 保质期：取所有variants中最早过期的
  var variants = (item.variants && item.variants.length > 0) ? item.variants : [item];
  var earliestDaysLeft = null;
  var earliestShelfPercent = 100;
  variants.forEach(function(v) {
    var sl = v.shelfLife || item.shelfLife;
    var pd = v.productionDate || item.productionDate;
    if (sl && sl > 0 && pd) {
      var prod = new Date(pd);
      var expireDate = new Date(prod);
      expireDate.setMonth(expireDate.getMonth() + sl);
      var daysLeft = daysBetween(new Date(), expireDate);
      var totalDays = sl * 30;
      var shelfPercent = Math.max(0, Math.min(100, (daysLeft / totalDays) * 100));
      if (earliestDaysLeft === null || daysLeft < earliestDaysLeft) {
        earliestDaysLeft = daysLeft;
        earliestShelfPercent = shelfPercent;
      }
    }
  });
  if (earliestDaysLeft !== null) {
    status.daysLeft = earliestDaysLeft;
    status.shelfPercent = earliestShelfPercent;
    if (earliestDaysLeft <= 0) status.expired = true;
    else if (earliestDaysLeft <= 30) status.expiring = true;
  }

  // 库存（使用总库存）
  if (item.stockThreshold && totalStock !== undefined) {
    if (totalStock > 0) {
      // 有库存：维持原逻辑
      if (totalStock <= item.stockThreshold) status.lowStock = true;
    } else {
      // 库存为0：检查是否有"使用中"的变体
      var hasOpenedInUse = variants.some(function(v) { return v.opened && !v.usedUp; });
      if (hasOpenedInUse) {
        // 有使用中的变体：按消耗速率预估，没到预估用完时间不告急
        var estDaysLeft = estimateOpenedDaysLeft(item, variants);
        if (estDaysLeft !== null && estDaysLeft <= 0) {
          // 已超过预估使用周期，该补货了
          status.lowStock = true;
        }
        // estDaysLeft === null 表示没有足够历史数据，不告急（给宽容期）
      } else {
        // 没有使用中的变体（全部用完或从未开封），库存为0，触发告急
        status.lowStock = true;
      }
    }
  }

  // 囤太多：消耗速率计算
  if (item.usageRecords && item.usageRecords.length > 2) {
    var rate = calcUsageRate(item);
    if (rate > 0 && totalStock > 0) {
      var monthsToFinish = totalStock / rate;
      var shelfMonthsLeft = status.daysLeft ? status.daysLeft / 30 : 999;
      if (monthsToFinish > shelfMonthsLeft && shelfMonthsLeft < 999) {
        status.overStock = true;
      }
    }
  }

  return status;
}

// ========== 消耗速率计算 ==========
function calcUsageRate(item) {
  if (!item.usageRecords || item.usageRecords.length === 0) return 0;
  var records = item.usageRecords.filter(function(r) { return r.startDate && r.endDate; });
  if (records.length === 0) return 0;

  // 计算每条记录的日均消耗，然后汇总
  var totalQty = 0, totalDays = 0;
  records.forEach(function(r) {
    var days = daysBetween(new Date(r.startDate), new Date(r.endDate));
    if (days < 1) days = 1; // 至少1天
    totalQty += (r.qty || 1);
    totalDays += days;
  });
  if (totalDays === 0) return 0;
  var perDay = totalQty / totalDays;
  return perDay * 30; // 转为月消耗
}

// ========== 预估使用中变体的剩余天数 ==========
// 基于历史使用记录的平均使用周期，预估当前使用中变体还能用多少天
// 返回 null 表示没有足够历史数据无法预估
function estimateOpenedDaysLeft(item, variants) {
  if (!item.usageRecords || item.usageRecords.length === 0) return null;
  var records = item.usageRecords.filter(function(r) { return r.startDate && r.endDate; });
  if (records.length === 0) return null;

  // 计算历史平均使用周期（天）
  var totalDays = 0;
  records.forEach(function(r) {
    var days = daysBetween(new Date(r.startDate), new Date(r.endDate));
    if (days < 1) days = 1;
    totalDays += days;
  });
  var avgCycleDays = totalDays / records.length;

  // 找到当前使用中的变体
  var activeVariant = variants.find(function(v) { return v.opened && !v.usedUp; });
  if (!activeVariant || !activeVariant.openDate) return null;

  // 已使用天数
  var usedDays = daysBetween(new Date(activeVariant.openDate), new Date());
  // 预估剩余天数 = 平均周期 - 已使用天数
  return Math.round(avgCycleDays - usedDays);
}

// ========== AI分析渲染 ==========
function renderAIAnalysis() {
  var html = '<div class="section-title">AI 分析</div>';
  html += '<div class="ai-card">';
  html += '<div class="ai-header"><span style="font-size:20px">🤖</span>';
  html += '<span class="ai-title">智能报告</span>';
  html += '<span class="ai-badge">离线分析</span></div>';

  // 1. 年消耗画像
  var consumableZone = DB.zones.find(function(z) { return z.type === 'consumable'; });
  if (consumableZone && consumableZone.items.length > 0) {
    html += '<div class="ai-section">';
    html += '<div class="ai-section-title">消耗速率 TOP5</div>';
    var items = consumableZone.items.map(function(it) {
      return { name: it.name, rate: calcUsageRate(it), unit: it.unit || '个' };
    }).filter(function(it) { return it.rate > 0; })
      .sort(function(a,b) { return b.rate - a.rate; })
      .slice(0, 5);

    if (items.length > 0) {
      items.forEach(function(it) {
        var perYear = (it.rate * 12).toFixed(1);
        html += '<div class="ai-item"><span>' + escapeHtml(it.name) + '</span>';
        html += '<span class="ai-val">' + perYear + it.unit + '/年</span></div>';
      });
    } else {
      html += '<div class="ai-item"><span>数据收集中...</span><span>多用几次就有啦</span></div>';
    }
    html += '</div>';
  }

  // 2. 采购建议
  html += '<div class="ai-section">';
  html += '<div class="ai-section-title">采购建议</div>';
  var buySuggestions = [], stopSuggestions = [];
  DB.zones.forEach(function(zone) {
    if (zone.type !== 'consumable') return;
    zone.items.forEach(function(it) {
      var rate = calcUsageRate(it);
      var status = getItemStatus(it);
      if (rate > 0 && it.stock !== undefined) {
        var monthsLeft = it.stock / rate;
        if (status.lowStock || monthsLeft < 1) {
          var suggestQty = Math.ceil(rate * 6); // 建议买半年量
          buySuggestions.push({ name: it.name, qty: suggestQty, unit: it.unit || '个', reason: '库存仅够' + monthsLeft.toFixed(1) + '月' });
        }
      }
      if (status.overStock) {
        stopSuggestions.push({ name: it.name, reason: '用到过期也用不完' });
      }
    });
  });

  if (buySuggestions.length > 0) {
    html += '<div class="ai-suggest">';
    html += '<strong>✅ 建议买：</strong><br>';
    buySuggestions.slice(0, 5).forEach(function(s) {
      html += '· ' + s.name + ' ' + s.qty + s.unit + '（' + s.reason + '）<br>';
    });
    html += '</div>';
  }
  if (stopSuggestions.length > 0) {
    html += '<div class="ai-suggest" style="margin-top:8px">';
    html += '<span class="stop-buy">⛔ 别买了：</span><br>';
    stopSuggestions.slice(0, 3).forEach(function(s) {
      html += '· ' + s.name + '（' + s.reason + '）<br>';
    });
    html += '</div>';
  }
  if (buySuggestions.length === 0 && stopSuggestions.length === 0) {
    html += '<div class="ai-suggest">暂无采购建议。继续记录使用情况，数据会更准哦。</div>';
  }
  html += '</div>';

  // 3. 花费分析
  html += '<div class="ai-section">';
  html += '<div class="ai-section-title">花费分析（今年）</div>';
  var now = new Date();
  var yearSpend = {};
  var totalSpend = 0;
  DB.zones.forEach(function(zone) {
    zone.items.forEach(function(it) {
      if (it.priceHistory) {
        it.priceHistory.forEach(function(p) {
          if (p.date) {
            var d = new Date(p.date);
            if (d.getFullYear() === now.getFullYear()) {
              var zname = zone.name;
              if (!yearSpend[zname]) yearSpend[zname] = 0;
              yearSpend[zname] += (p.totalPrice || 0);
              totalSpend += (p.totalPrice || 0);
            }
          }
        });
      }
    });
  });

  if (totalSpend > 0) {
    var sorted = Object.keys(yearSpend).map(function(k) {
      return { name: k, amount: yearSpend[k] };
    }).sort(function(a,b) { return b.amount - a.amount; });

    sorted.forEach(function(s) {
      var pct = (s.amount / totalSpend * 100).toFixed(0);
      html += '<div class="ai-item"><span>' + s.name + '</span>';
      html += '<span class="ai-val">¥' + s.amount.toFixed(0) + ' (' + pct + '%)</span></div>';
    });
    html += '<div class="ai-item" style="border-top:1px solid rgba(0,105,92,0.2)"><span>总计</span>';
    html += '<span class="ai-val" style="color:#00695C;font-size:16px">¥' + totalSpend.toFixed(0) + '</span></div>';
  } else {
    html += '<div class="ai-suggest">今年还没有花费记录。</div>';
  }
  html += '</div>';

  // 4. 大促倒计时
  html += '<div class="ai-section">';
  html += '<div class="ai-section-title">大促倒计时</div>';
  var next618 = getNextPromo(6, 18);
  var next1111 = getNextPromo(11, 11);
  html += '<div class="ai-item"><span>618</span><span class="ai-val">' + next618 + '</span></div>';
  html += '<div class="ai-item"><span>双十一</span><span class="ai-val">' + next1111 + '</span></div>';
  html += '</div>';

  html += '</div>';
  return html;
}

function getNextPromo(month, day) {
  var now = new Date();
  var promo = new Date(now.getFullYear(), month - 1, day);
  if (promo < now) promo = new Date(now.getFullYear() + 1, month - 1, day);
  var days = Math.ceil((promo - now) / (1000 * 60 * 60 * 24));
  if (days === 0) return '就是今天！';
  return '还有' + days + '天';
}

// ========== 物品卡片渲染 ==========
function renderItemCard(item, zone) {
  var status = getItemStatus(item);
  var isDurable = zone.type !== 'consumable';
  var variantCount = (item.variants && item.variants.length) ? item.variants.length : (isDurable ? 1 : 0);

  var html = '<div class="item-card item-card-compact" onclick="openCardDetail(\'' + zone.id + '\',\'' + item.id + '\')">';

  // 角标
  if (status.expired) {
    html += '<div class="card-badge badge-expire">已过期</div>';
  } else if (status.expiring) {
    html += '<div class="card-badge badge-warn">' + status.daysLeft + '天</div>';
  } else if (status.lowStock) {
    html += '<div class="card-badge badge-low">告急</div>';
  } else if (status.overStock) {
    html += '<div class="card-badge badge-over">囤太多</div>';
  }
  // 耐用品闲置
  if (isDurable && item.lastUsedDate) {
    var days = daysBetween(new Date(item.lastUsedDate), new Date());
    if (days > 180) {
      html += '<div class="card-badge badge-idle">闲置</div>';
    }
  }
  // 使用感受标记
  if (item.feeling && item.feeling.rating) {
    if (item.feeling.rating >= 4) {
      html += '<div class="card-badge badge-good">👍</div>';
    } else if (item.feeling.rating <= 2) {
      html += '<div class="card-badge badge-bad">👎</div>';
    }
  }

  // 卡片body
  html += '<div class="card-body">';
  html += '<div class="card-name">' + escapeHtml(item.name) + '</div>';

  if (isDurable) {
    // 耐用品正面：显示件数 + 总金额
    html += '<div class="card-info" style="color:var(--accent);font-weight:600">' + variantCount + '件</div>';
    var totalPrice = calcDurableTotalPrice(item);
    html += '<div class="card-info" style="font-weight:600">总金额 ¥' + totalPrice.toFixed(2) + '</div>';
    if (item.location) {
      html += '<div class="card-info">📍 ' + escapeHtml(item.location) + '</div>';
    }
    if (item.lastUsedDate) {
      var dDays = daysBetween(new Date(item.lastUsedDate), new Date());
      if (dDays > 180) {
        html += '<div class="card-info" style="color:var(--purple);font-weight:600">🕐 ' + Math.floor(dDays/30) + '个月没用</div>';
      }
    }
  } else {
    // 补给品品牌变体数
    if (item.variants && item.variants.length > 1) {
      html += '<div class="card-info" style="color:var(--accent);font-weight:500">' + item.variants.length + '个品牌</div>';
    }
    // 消耗品正面：库存条 + 保质期
    var totalStock = getTotalStock(item);
    if (totalStock !== undefined) {
      var threshold = item.stockThreshold || 1;
      var maxBar = Math.max(totalStock, threshold * 3);
      var pct = maxBar > 0 ? (totalStock / maxBar * 100) : 0;
      var barClass = 'low';
      if (status.overStock) barClass = 'over';
      else if (pct > 60) barClass = 'high';
      else if (pct > 30) barClass = 'mid';
      html += '<div class="card-info">' + totalStock + (item.unit || '') + ' · ¥' + (item.currentPrice || 0) + '</div>';
      html += '<div class="stock-bar ' + barClass + ' card-mini-bar"><div class="stock-fill" style="width:' + pct + '%"></div></div>';
    }
    if (status.daysLeft !== null && !status.expired) {
      var shelfColor = status.daysLeft <= 30 ? 'var(--red)' : (status.daysLeft <= 90 ? 'var(--orange)' : 'var(--green)');
      html += '<div class="card-info" style="color:' + shelfColor + ';font-weight:600">⏰ ' + status.daysLeft + '天</div>';
    }
  }

  html += '</div></div>';
  return html;
}

        if (item.openDate && item.finishDate) {

          html += '<div class="back-row"><span class="back-label">耗时</span><span class="back-value">' + usedDays + '天</span></div>';
        }
        html += '<div style="display:flex;gap:8px;margin-top:8px">';
        html += '<button class="open-btn done" style="flex:1" onclick="openItem(\'' + item.id + '\')">🔓 开封下一个</button>';
        html += '<button class="btn btn-outline btn-sm" style="flex:0 0 auto" onclick="undoFinish(\'' + item.id + '\')">↩️ 撤销</button>';
        html += '</div>';
      } else {
        // 使用中
        html += '<div class="back-row"><span class="back-label">状态</span><span class="back-value" style="color:var(--orange)">使用中</span></div>';
        if (item.openDate) html += '<div class="back-row"><span class="back-label">开始使用</span><span class="back-value">' + formatDate(item.openDate) + '</span></div>';
        if (item.openQty) html += '<div class="back-row"><span class="back-label">开封数量</span><span class="back-value">' + item.openQty + (item.unit||'') + '</span></div>';
        var usingDays = daysBetween(new Date(item.openDate), new Date());
        html += '<div class="back-row"><span class="back-label">已使用</span><span class="back-value">' + usingDays + '天</span></div>';
        html += '<button class="open-btn" onclick="finishCurrentVariant(\'' + item.id + '\')">✅ 用完了</button>';
      }
    } else {
      var foodBtnText = isFoodItem(item, currentZoneId) ? '🍴 开封食用' : '🔓 点击开封';
      html += '<div class="back-row"><span class="back-label">状态</span><span class="back-value">未开封</span></div>';
      html += '<button class="open-btn" onclick="openItem(\'' + item.id + '\')">' + foodBtnText + '</button>';
    }
    html += '</div>';

    // === 使用记录 ===
    if (item.usageRecords && item.usageRecords.length > 0) {
      html += '<div class="back-section">';
      html += '<div class="back-section-title">使用记录 (' + item.usageRecords.length + '次)</div>';
      var rate = calcUsageRate(item);
      if (rate > 0) {
        html += '<div class="back-row"><span class="back-label">月消耗量</span><span class="back-value">' + rate.toFixed(1) + (item.unit||'') + '/月</span></div>';
        html += '<div class="back-row"><span class="back-label">年消耗量</span><span class="back-value">' + (rate*12).toFixed(1) + (item.unit||'') + '/年</span></div>';
      }
      html += '<div class="usage-log" style="margin-top:8px">';
      item.usageRecords.slice().reverse().slice(0, 5).forEach(function(r) {
        var startStr = r.startDate ? formatDate(r.startDate) : (r.date ? formatDate(r.date) : '');
        if (r.endDate) {
          var days = daysBetween(new Date(r.startDate), new Date(r.endDate));
          html += '<div class="open-record">📅 ' + startStr + ' → ' + formatDate(r.endDate) + ' · ' + days + '天 · ' + (r.qty||1) + (item.unit||'') + '</div>';
        } else if (startStr) {
          html += '<div class="open-record">📅 ' + startStr + ' · 使用中 · ' + (r.qty||1) + (item.unit||'') + '</div>';
        }
      });
      html += '</div>';
      html += '</div>';
    }

    // === 价格历史 ===
    if (item.priceHistory && item.priceHistory.length > 0) {
      html += '<div class="back-section">';
      html += '<div class="back-section-title">价格历史 (' + item.priceHistory.length + '次)</div>';
      var prices = item.priceHistory.map(function(p) { return p.unitPrice || 0; });
      var minPrice = Math.min.apply(null, prices);
      var avgPrice = prices.reduce(function(s,p) { return s+p; }, 0) / prices.length;
      html += '<div class="back-row"><span class="back-label">历史最低</span><span class="back-value" style="color:var(--green)">¥' + minPrice + '</span></div>';
      html += '<div class="back-row"><span class="back-label">均价</span><span class="back-value">¥' + avgPrice.toFixed(1) + '</span></div>';
      html += '<div style="margin-top:8px">';
      item.priceHistory.slice().reverse().slice(0, 5).forEach(function(p) {
        html += '<div class="open-record">📅 ' + formatDate(p.date) + ' · ' + escapeHtml(p.channel||'') + ' · ¥' + (p.unitPrice||0) + '/' + (item.unit||'个');
        if (p.notes) html += ' · ' + escapeHtml(p.notes);
        html += '</div>';
      });
      html += '</div>';
      html += '</div>';
    }
  }

  // === 使用感受（可选）/ 耐用品备注 ===
  // 补给品且有多变体时，感受在每个变体旁独立编辑；补给品单品用顶层感受；耐用品用备注
  var hasMultipleVariants = item.variants && item.variants.length > 1 && zone.type === 'consumable';
  if (!hasMultipleVariants) {
    html += '<div class="back-section">';
    if (zone.type === 'durable') {
      html += '<div class="back-section-title">备注</div>';
      if (item.notes) {
        html += '<div style="font-size:14px;line-height:1.5;color:var(--text);white-space:pre-wrap">' + escapeHtml(item.notes) + '</div>';
      } else {
        html += '<div class="back-row"><span class="back-label" style="color:var(--text-tertiary)">暂无备注</span></div>';
      }
      html += '<button class="btn btn-outline btn-sm" style="margin-top:8px;width:100%" onclick="openNotesForm(\'' + item.id + '\')">✏ 编辑备注</button>';
    } else {
      html += '<div class="back-section-title">使用感受（选填）</div>';
      if (item.feeling) {
        if (item.feeling.rating) {
          html += '<div class="back-row"><span class="back-label">评分</span><span class="back-value">';
          for (var i = 1; i <= 5; i++) html += i <= item.feeling.rating ? '⭐' : '☆';
          html += '</span></div>';
        }
        if (item.feeling.tags && item.feeling.tags.length > 0) {
          html += '<div class="back-row"><span class="back-label">标签</span><span class="back-value">' + item.feeling.tags.map(escapeHtml).join('、') + '</span></div>';
        }
        if (item.feeling.notes) {
          html += '<div class="back-row"><span class="back-label">心得</span><span class="back-value">' + escapeHtml(item.feeling.notes) + '</span></div>';
        }
      } else {
        html += '<div class="back-row"><span class="back-label" style="color:var(--text-tertiary)">暂无记录</span></div>';
      }
      html += '<button class="btn btn-outline btn-sm" style="margin-top:8px;width:100%" onclick="openFeelingForm(\'' + item.id + '\')">✏ 编辑使用感受</button>';
    }
    html += '</div>';
  }

  // === 耐用品：件数清单 + 使用情况 ===
  if (zone.type === 'durable') {
    ensureVariants(item);
    var variants = item.variants || [];
    html += '<div class="back-section">';
    html += '<div class="back-section-title">件数清单 (' + variants.length + '件)</div>';
    if (variants.length > 0) {
      html += '<div class="variant-thumb-grid">';
      variants.forEach(function(v, vi) {
        var vPhotos = v.photos || [];
        html += '<div class="variant-thumb">';
        // 删除按钮
        html += '<button class="variant-del" onclick="event.stopPropagation();deleteVariant(\'' + item.id + '\',\'' + v.id + '\')">✕</button>';
        if (vPhotos.length > 0) {
          // 收集所有照片用于全屏查看
          var allPhotos = vPhotos.map(function(p){ return p.replace(/"/g,'&quot;'); }).join('||');
          html += '<img src="' + vPhotos[0] + '" onclick="openPhotoViewer([\'' + vPhotos.join("','") + '\'],0)">';
        } else {
          html += '<div class="variant-thumb-no-photo">📷</div>';
        }
        html += '<div class="variant-label">' + escapeHtml(v.brand || ('第' + (vi+1) + '件')) + '</div>';
        if (v.price) html += '<div class="variant-sub">¥' + v.price + '</div>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    // 使用情况
    html += '<div class="back-section">';
    html += '<div class="back-section-title">使用情况</div>';
    if (item.lastUsedDate) {
      var dDays2 = daysBetween(new Date(item.lastUsedDate), new Date());
      html += '<div class="back-row"><span class="back-label">最后使用</span><span class="back-value">' + formatDate(item.lastUsedDate) + '</span></div>';
      if (dDays2 > 180) {
        html += '<div style="padding:8px;border-radius:8px;background:rgba(175,82,222,0.1);color:var(--purple);font-size:13px;font-weight:600;margin-top:4px">🕐 已' + Math.floor(dDays2/30) + '个月没用，考虑断舍离？</div>';
      }
    } else {
      html += '<div class="back-row"><span class="back-label" style="color:var(--text-tertiary)">未记录</span></div>';
    }
    html += '<button class="btn btn-outline btn-sm" style="margin-top:8px;width:100%" onclick="markUsed(\'' + item.id + '\')">📍 标记今天用过</button>';
    html += '</div>';
  }

  // === 操作按钮 ===
  html += '<div style="display:flex;gap:8px;margin-top:8px">';
  html += '<button class="btn btn-outline" style="flex:1" onclick="editItem(\'' + item.id + '\')">✏ 编辑</button>';
  if (zone.type === 'consumable') {
    html += '<button class="btn btn-outline" style="flex:1" onclick="openRestockForm(\'' + item.id + '\')">📦 补货</button>';
  }
  html += '</div>';
  html += '<button class="btn btn-danger" style="width:100%;margin-top:8px" onclick="deleteItem(\'' + item.id + '\')">🗑 删除</button>';

  html += '</div>';
  document.getElementById('flip-back').innerHTML = html;
}

// ========== 全屏照片查看器 ==========
var _viewerPhotos = [];
var _viewerIndex = 0;
var _viewerScale = 1;
var _viewerStartX = 0;
var _viewerStartY = 0;
var _viewerLastDist = 0;

function openPhotoViewer(photos, index) {
  if (!photos || photos.length === 0) return;
  _viewerPhotos = photos;
  _viewerIndex = index || 0;
  _viewerScale = 1;

  var html = '<div class="photo-viewer" id="photoViewer">';
  html += '<button class="photo-viewer-close" onclick="closePhotoViewer()">✕</button>';
  html += '<img id="viewerImg" src="' + photos[_viewerIndex] + '">';
  if (photos.length > 1) {
    html += '<div class="photo-viewer-counter" id="viewerCounter">' + (_viewerIndex+1) + ' / ' + photos.length + '</div>';
  }
  html += '</div>';

  // 移除旧的
  var old = document.getElementById('photoViewer');
  if (old) old.remove();

  document.body.insertAdjacentHTML('beforeend', html);

  var img = document.getElementById('viewerImg');
  var viewer = document.getElementById('photoViewer');

  // 单击关闭
  viewer.addEventListener('click', function(e) {
    if (e.target === viewer) closePhotoViewer();
  });

  // 左右滑动切换
  var touchStartX = 0, touchStartY = 0, touchMoved = false;
  img.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchMoved = false;
    }
    if (e.touches.length === 2) {
      _viewerLastDist = getTouchDist(e);
    }
  }, { passive: true });

  img.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dist = getTouchDist(e);
      if (_viewerLastDist > 0) {
        _viewerScale = Math.max(0.5, Math.min(4, _viewerScale * (dist / _viewerLastDist)));
        img.style.transform = 'scale(' + _viewerScale + ')';
      }
      _viewerLastDist = dist;
    } else if (e.touches.length === 1 && _viewerScale <= 1) {
      var dx = e.touches[0].clientX - touchStartX;
      var dy = e.touches[0].clientY - touchStartY;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) touchMoved = true;
    }
  }, { passive: false });

  img.addEventListener('touchend', function(e) {
    if (_viewerScale > 1) return; // 缩放状态下不切换
    if (!touchMoved) return;
    var touch = e.changedTouches[0];
    var dx = touch.clientX - touchStartX;
    var dy = touch.clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0 && _viewerIndex > 0) {
        _viewerIndex--;
        updateViewerImg();
      } else if (dx < 0 && _viewerIndex < _viewerPhotos.length - 1) {
        _viewerIndex++;
        updateViewerImg();
      }
    }
    _viewerScale = 1;
    img.style.transform = 'scale(1)';
  }, { passive: true });
}

function getTouchDist(e) {
  var dx = e.touches[0].clientX - e.touches[1].clientX;
  var dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function updateViewerImg() {
  var img = document.getElementById('viewerImg');
  var counter = document.getElementById('viewerCounter');
  if (img) {
    img.src = _viewerPhotos[_viewerIndex];
    img.style.transform = 'scale(1)';
    _viewerScale = 1;
  }
  if (counter) counter.textContent = (_viewerIndex+1) + ' / ' + _viewerPhotos.length;
}

function closePhotoViewer() {
  var v = document.getElementById('photoViewer');
  if (v) v.remove();
}

// ========== 删除单件变体 ==========
function deleteVariant(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item || !item.variants) return;
  var v = item.variants.find(function(v) { return v.id === variantId; });
  if (!v) return;
  var label = v.brand || '这件';
  if (item.variants.length <= 1) {
    // 最后一件
    if (confirm('这是最后一件「' + label + '」，删除后整个卡片将移除。确定？')) {
      var zone = getZone(currentZoneId);
      zone.items = zone.items.filter(function(it) { return it.id !== itemId; });
      saveDB();
      closeCardDetail();
      renderZone();
      toast('已删除');
    }
    return;
  }
  if (confirm('删除「' + label + '」？此操作不可撤销。')) {
    item.variants = item.variants.filter(function(v) { return v.id !== variantId; });
    var zone = getZone(currentZoneId);
    if (zone && zone.type !== 'consumable') {
      syncDurableFromVariants(item);
    } else {
      syncItemFromVariants(item);
    }
    saveDB();
    renderCardBack(item, zone);
    toast('已删除1件');
  }
}

document.addEventListener('DOMContentLoaded', async function() {
  await loadDB();
  // 立即用本地数据渲染首页（不等待网络，秒开）
  showPage('home');

  // 初始化认证 + 云端同步，全部后台进行，不阻塞界面
  setTimeout(async function() {
    try {
      await initAuth();
      if (currentUser) {
        var cloudChanged = await syncFromCloud();
        if (cloudChanged) {
          renderAll();
        }
      }
    } catch(e) {
      console.error('云端初始化失败', e);
    }
  }, 50);

  // 清理无用的临时变量/缓存标记（如果有）
  try { delete window._openVariantId; } catch(e) {}
  try { delete window._openQty; } catch(e) {}
  try { delete window._maxOpenQty; } catch(e) {}

  document.getElementById('flip-front').addEventListener('click', function(e) {
    if (e.target.closest('.back-close')) return;
    flipCard();
  });
  document.getElementById('flip-back').addEventListener('click', function(e) {
    // 背面点击空白处不翻回，有按钮关闭
  });

  document.getElementById('modal-overlay').addEventListener('click', function(e) {

  });

  // 网络恢复时自动同步

    updateCloudUI();
    if (currentUser) queueCloudSync();
  });

    updateCloudUI();
  });
});

function closeCardDetail() {
  document.getElementById('card-detail-overlay').classList.remove('show');
  currentDetailItem = null;
  currentDetailZone = null;
}

// ========== 开封 ==========
function openItem(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  ensureVariants(item);

  // 选择开封哪个品牌（移除"已有正在使用的就锁定"的限制，允许多个同时使用）
  var available = item.variants.filter(function(v) { return v.stock > 0 && (!v.opened || v.usedUp); });
  if (available.length === 0) {
    toast('没有可开封的库存了');
    return;
  }

  if (item.variants.length > 1) {
    // 多个品牌 → 先选品牌（支持同时开封多个）
    var isFood = isFoodItem(item, currentZoneId);
    var html = '<div class="modal-handle"></div>';
    html += '<div class="modal-title">' + (isFood ? '🍴 开封即用完' : '🔓 开封 - 选品牌') + '</div>';
    html += '<div style="text-align:center;margin-bottom:12px;font-size:14px;font-weight:600">' + escapeHtml(item.name) + '</div>';
    if (isFood) {
      html += '<div style="text-align:center;margin-bottom:10px;font-size:12px;color:var(--text-secondary)">食品类开封后自动标记为已用完</div>';
    }
    available.forEach(function(v) {
      var statusBadge = '';
      if (v.opened && !v.usedUp) statusBadge = ' <span style="color:var(--orange);font-size:11px">· 使用中</span>';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:10px;background:#F8F8FA;margin-bottom:8px;cursor:pointer" onclick="openVariantItem(\'' + itemId + '\',\'' + v.id + '\')">';
      html += '<div style="font-weight:600">' + escapeHtml(v.brand || '未命名') + statusBadge + '</div>';
      html += '<div style="color:var(--text-secondary);font-size:13px">库存 ' + (v.stock||0) + (item.unit||'') + ' →</div>';
      html += '</div>';
    });
    html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">取消</button>';
    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('modal-overlay').classList.add('show');
  } else {
    // 只有一个品牌 → 直接开封
    openVariantItem(itemId, item.variants[0].id);
  }
}

// 开封具体品牌
function openVariantItem(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(v) { return v.id === variantId; });
  if (!v) return;

  // 食品类：开封即用完，直接完成，不弹窗
  if (isFoodItem(item, currentZoneId)) {
    var now = new Date().toISOString();
    v.opened = true;
    v.usedUp = true;
    v.openDate = now;
    v.finishDate = now;
    v.openQty = v.stock || 1;
    v.stock = 0;
    if (!item.usageRecords) item.usageRecords = [];
    item.usageRecords.push({ startDate: now, endDate: now, qty: v.openQty, variantId: variantId, brand: v.brand });
    syncItemFromVariants(item);
    saveDB();
    toast('已开封并标记用完：' + escapeHtml(v.brand));
    return;
  }

  var maxQty = v.stock || 1;
  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">🔓 开封使用</div>';
  html += '<div style="text-align:center;margin-bottom:16px">';
  html += '<div style="font-size:16px;font-weight:700">' + escapeHtml(item.name) + '</div>';
  html += '<div style="font-size:14px;color:var(--accent)">' + escapeHtml(v.brand) + '</div>';
  html += '<div style="font-size:13px;color:var(--text-secondary)">库存：' + v.stock + (item.unit||'') + '</div>';
  html += '</div>';
  html += '<div class="stepper" style="margin-bottom:16px">';
  html += '<button onclick="adjustOpenQty(-1)">−</button>';
  html += '<span class="stepper-val" id="open-qty-val">1</span>';
  html += '<button onclick="adjustOpenQty(1)">＋</button>';
  html += '</div>';
  html += '<div class="form-group">';
  html += '<label class="form-label">开始使用日期</label>';
  html += '<input type="date" class="form-input" id="open-date" value="' + new Date().toISOString().split('T')[0] + '">';
  html += '</div>';
  html += '<button class="btn btn-primary btn-full" onclick="confirmOpen(\'' + itemId + '\',\'' + variantId + '\')">确认开封</button>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');

  window._openQty = 1;
  window._maxOpenQty = maxQty;
  window._openVariantId = variantId;
}

function adjustOpenQty(delta) {
  window._openQty = Math.max(1, Math.min(window._maxOpenQty, window._openQty + delta));
  var valEl = document.getElementById('open-qty-val');
  if (valEl) valEl.textContent = window._openQty;
}

function confirmOpen(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(v) { return v.id === variantId; });
  if (!v) return;
  var qty = window._openQty || 1;
  var date = document.getElementById('open-date').value;

  v.opened = true;
  v.usedUp = false;
  v.openDate = new Date(date).toISOString();
  v.openQty = qty;
  v.stock = Math.max(0, (v.stock || 0) - qty);

  if (!item.usageRecords) item.usageRecords = [];
  item.usageRecords.push({ startDate: new Date(date).toISOString(), endDate: null, qty: qty, variantId: variantId, brand: v.brand });

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  toast('已开封 ' + escapeHtml(v.brand) + '，库存-' + qty);
}

function confirmFinish(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(v) { return v.id === variantId; });
  if (!v) return;
  var date = document.getElementById('finish-date').value;

  v.usedUp = true;
  v.finishDate = new Date(date).toISOString();

  if (item.usageRecords && item.usageRecords.length > 0) {
    var lastRecord = item.usageRecords[item.usageRecords.length - 1];
    if (!lastRecord.endDate) {
      lastRecord.endDate = new Date(date).toISOString();
    }
  }

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  toast('已记录用完。消耗数据已更新');
}

// 直接标记某个变体用完（用于多变体的"用完了"按钮，食品类直接完成）
function finishVariant(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(vv) { return vv.id === variantId; });
  if (!v) return;

  v.usedUp = true;
  v.finishDate = v.finishDate || new Date().toISOString();

  if (item.usageRecords && item.usageRecords.length > 0) {
    var lastRecord = item.usageRecords[item.usageRecords.length - 1];
    if (lastRecord && !lastRecord.endDate && lastRecord.variantId === variantId) {
      lastRecord.endDate = v.finishDate;
    }
  }

  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已记录用完');
}

// 单品牌物品：标记当前使用中的变体为用完
function finishCurrentVariant(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  ensureVariants(item);
  var active = item.variants.find(function(v) { return v.opened && !v.usedUp; });
  if (!active) {
    toast('没有使用中的记录');
    return;
  }
  finishVariant(itemId, active.id);
}

// ========== 补货 ==========

  ensureVariants(item);

  var html = '<div class="modal-handle"></div>';

  html += '<select class="form-select" id="restock-brand">';

    html += '<div class="price-compare price-first">历史最低 ¥' + minPrice + ' · 上次 ¥' + lastPrice + '</div>';

  html += '<div class="form-row">';
  html += '<div class="form-group"><label class="form-label">补货数量</label><input type="number" class="form-input" id="restock-qty" value="1" min="0" step="0.5"></div>';

  html += '</div>';
  html += '<div class="form-row">';
  html += '<div class="form-group"><label class="form-label">总价</label><input type="number" class="form-input" id="restock-total" value="" placeholder="0"></div>';
  html += '<div class="form-group"><label class="form-label">单价（自动算）</label><input type="number" class="form-input" id="restock-unit-price" value="" placeholder="自动"></div>';
  html += '</div>';
  html += '<div class="form-group"><label class="form-label">购买渠道</label>';
  html += '<select class="form-select" id="restock-channel">';
  ['淘宝','京东','拼多多','线下','其他'].forEach(function(c) {
    html += '<option value="' + c + '"' + (item.channel===c?' selected':'') + '>' + c + '</option>';
  });
  html += '</select></div>';
  html += '<div class="form-group"><label class="form-label">购买日期</label><input type="date" class="form-input" id="restock-date" value="' + new Date().toISOString().split('T')[0] + '"></div>';
  html += '<div class="form-group"><label class="form-label">价格备注（选填）</label>';
  html += '<textarea class="form-textarea" id="restock-notes" placeholder="如：双十一满300减50"></textarea></div>';
  html += '<div class="form-group"><label class="form-label">订单截图（选填）</label>';
  html += '<div class="photo-upload" id="restock-photos">';
  html += '<div class="photo-slot" onclick="uploadRestockPhoto()">📷</div>';
  html += '</div></div>';

  // 实时价格对比
  html += '<div id="restock-compare"></div>';

  html += '<button class="btn btn-primary btn-full" onclick="confirmRestock(\'' + itemId + '\')">确认补货</button>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');

  // 监听品牌选择
  document.getElementById('restock-brand').addEventListener('change', function() {
    var ng = document.getElementById('new-brand-group');
    ng.style.display = this.value === '__new__' ? 'block' : 'none';
  });

  // 监听价格变化
  document.getElementById('restock-total').addEventListener('input', function() { updateRestockCompare(item); });
  document.getElementById('restock-qty').addEventListener('input', function() { updateRestockCompare(item); });
}

function updateRestockCompare(item) {
  var qty = parseFloat(document.getElementById('restock-qty').value) || 0;
  var total = parseFloat(document.getElementById('restock-total').value) || 0;
  var unitPrice = qty > 0 ? total / qty : 0;
  document.getElementById('restock-unit-price').value = unitPrice.toFixed(1);

  var compareDiv = document.getElementById('restock-compare');
  if (unitPrice > 0 && item.priceHistory && item.priceHistory.length > 0) {
    var prices = item.priceHistory.map(function(p) { return p.unitPrice || 0; });
    var minPrice = Math.min.apply(null, prices);
    var lastPrice = prices[prices.length - 1];

    if (unitPrice < minPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-cheaper">🎉 新低！比历史最低 ¥' + minPrice + ' 便宜 ¥' + (minPrice - unitPrice).toFixed(1) + '</div>';
    } else if (unitPrice < lastPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-cheaper">✓ 比上次 ¥' + lastPrice + ' 便宜</div>';
    } else if (unitPrice > lastPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-expensive">⚠ 比上次 ¥' + lastPrice + ' 贵 ¥' + (unitPrice - lastPrice).toFixed(1) + '</div>';
    } else {
      compareDiv.innerHTML = '<div class="price-compare price-same">和上次价格相同</div>';
    }
  }
}

var restockPhotos = [];
function uploadRestockPhoto() {
  var input = document.getElementById('photo-input');
  input.onchange = function(e) {
    var files = e.target.files;
    for (var i = 0; i < files.length && restockPhotos.length < 3; i++) {
      compressImage(files[i], function(dataUrl) {
        restockPhotos.push(dataUrl);
        renderRestockPhotos();
      });
    }
    input.value = '';
  };
  input.click();
}

function renderRestockPhotos() {
  var container = document.getElementById('restock-photos');
  var html = '';
  restockPhotos.forEach(function(p, i) {
    html += '<div class="photo-slot has-photo"><img src="' + p + '"><button class="remove-photo" onclick="removeRestockPhoto(' + i + ')">✕</button></div>';
  });
  if (restockPhotos.length < 3) {
    html += '<div class="photo-slot" onclick="uploadRestockPhoto()">📷</div>';
  }
  container.innerHTML = html;
}

function removeRestockPhoto(idx) {
  restockPhotos.splice(idx, 1);
  renderRestockPhotos();
}

function confirmRestock(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  ensureVariants(item);
  var qty = parseFloat(document.getElementById('restock-qty').value) || 0;
  var total = parseFloat(document.getElementById('restock-total').value) || 0;
  var unitPrice = qty > 0 ? total / qty : 0;
  var channel = document.getElementById('restock-channel').value;
  var date = document.getElementById('restock-date').value;
  var notes = document.getElementById('restock-notes').value;
  var unit = document.getElementById('restock-unit').value;

  if (qty <= 0) { toast('请输入数量'); return; }

  item.unit = unit;
  item.channel = channel;

  // 更新或新增variant
  var brandSelect = document.getElementById('restock-brand').value;
  var variant;
  if (brandSelect === '__new__') {
    var newBrand = document.getElementById('restock-new-brand').value.trim() || ('品牌' + (item.variants.length + 1));
    variant = { id: genId(), brand: newBrand, stock: qty, price: parseFloat(unitPrice.toFixed(1)), channel: channel, photos: [], opened: false, openDate: null, finishDate: null, usedUp: false, openQty: 0, feeling: null, shelfLife: item.shelfLife, productionDate: null };
    item.variants.push(variant);
  } else {
    variant = item.variants.find(function(v) { return v.id === brandSelect; });
    if (variant) {
      variant.stock = (variant.stock || 0) + qty;
      variant.price = parseFloat(unitPrice.toFixed(1));
      variant.channel = channel;
    }
  }

  // 价格历史
  if (!item.priceHistory) item.priceHistory = [];
  item.priceHistory.push({
    date: new Date(date).toISOString(),
    channel: channel,
    quantity: qty,
    totalPrice: total,
    unitPrice: parseFloat(unitPrice.toFixed(1)),
    notes: notes,
    brand: variant ? variant.brand : '',
    attachments: restockPhotos.slice()
  });

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  restockPhotos = [];
  toast('补货成功 +' + qty + ' (' + (variant ? variant.brand : '') + ')');
  renderZone();
}
