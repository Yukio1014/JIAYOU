      var pct = (s.amount / totalSpend * 100).toFixed(0);
      html += '<div class="ai-item"><span>' + s.name + '</span>';
      html += '<span class="ai-val">¥' + s.amount.toFixed(0) + ' (' + pct + '%)</span></div>';
    });
    html += '<div class="ai-item" style="border-top:1px solid rgba(0,105,92,0.2)"><span>总计</span>';
    html += '<span class="ai-val" style="color:#00695C;font-size:16px">¥' + totalSpend.toFixed(0) + '</span></div>';
  } else {
    html += '<div class="ai-suggest">今年还没有花费记录。</div>';
  }
  html += '</div>';

  // 4. 大促倒计时
  html += '<div class="ai-section">';
  html += '<div class="ai-section-title">大促倒计时</div>';
  var next618 = getNextPromo(6, 18);
  var next1111 = getNextPromo(11, 11);
  html += '<div class="ai-item"><span>618</span><span class="ai-val">' + next618 + '</span></div>';
  html += '<div class="ai-item"><span>双十一</span><span class="ai-val">' + next1111 + '</span></div>';
  html += '</div>';

  html += '</div>';
  return html;
}

function getNextPromo(month, day) {
  var now = new Date();
  var promo = new Date(now.getFullYear(), month - 1, day);
  if (promo < now) promo = new Date(now.getFullYear() + 1, month - 1, day);
  var days = Math.ceil((promo - now) / (1000 * 60 * 60 * 24));
  if (days === 0) return '就是今天！';
  return '还有' + days + '天';
}

// ========== 板块页渲染 ==========
function renderZone() {
  var zone = getZone(currentZoneId);
  if (!zone) { showPage('home'); return; }
  var html = '';

  // 搜索栏
  html += '<div class="search-bar">';
  html += '<span class="search-icon">🔍</span>';
  html += '<input type="text" placeholder="搜物品/分类/备注/描述..." value="' + escapeHtml(currentSearchQuery) + '" oninput="onSearch(this.value)">';
  html += '</div>';

  // 分类标签（第一行：全部 + 大类）
  var mainCats = zone.categories.filter(function(c) { return !c.parentId; });
  // 若当前选中的是子分类，找到其父大类用于第一行高亮和第二行渲染
  var activeMainId = 'all';
  var activeSubId = null;
  if (currentCategoryId !== 'all') {
    var curCat = getCategory(currentZoneId, currentCategoryId);
    if (curCat) {
      if (curCat.parentId) {
        activeMainId = curCat.parentId;
        activeSubId = curCat.id;
      } else {
        activeMainId = curCat.id;
      }
    }
  }
  html += '<div class="cat-tabs">';
  html += '<div class="cat-tab ' + (activeMainId === 'all' ? 'active' : '') + '" onclick="selectCategory(\'all\')">全部</div>';
  mainCats.forEach(function(cat) {
    html += '<div class="cat-tab ' + (activeMainId === cat.id ? 'active' : '') + '" onclick="selectCategory(\'' + cat.id + '\')">';
    html += escapeHtml(cat.name);
    html += '</div>';
  });
  html += '</div>';

  // 第二行：选中大类的子分类（有子分类才显示）
  if (activeMainId !== 'all') {
    var subs = getSubcategories(zone, activeMainId);
    if (subs.length > 0) {
      html += '<div class="cat-tabs" style="margin-top:-4px">';
      html += '<div class="cat-tab ' + (!activeSubId ? 'active' : '') + '" onclick="selectCategory(\'' + activeMainId + '\')">全部</div>';
      subs.forEach(function(sub) {
        html += '<div class="cat-tab ' + (activeSubId === sub.id ? 'active' : '') + '" onclick="selectCategory(\'' + sub.id + '\')">';
        html += escapeHtml(sub.name);
        html += '</div>';
      });
      html += '</div>';
    }
  }

  // 物品网格
  if (currentCategoryId !== 'all') {
    html += '<div style="margin:10px 0 14px"><button class="btn btn-outline btn-sm" style="width:100%" onclick="taskOpenFormFromCategory(\'' + currentZoneId + '\',\'' + currentCategoryId + '\')">📋 委托补货（引用本分类产品）</button></div>';
  }
  // 归档箱入口（用完不再买的物品都在这里，数据保留可恢复）
  var arcCnt = archivedCountAll();
  if (arcCnt > 0 && !currentSearchQuery) {
    html += '<div style="margin:0 0 14px"><button class="btn btn-outline btn-sm" style="width:100%;font-size:12px" onclick="showArchivedBox()">📦 归档箱（' + arcCnt + ' 件 · 用完不再买）</button></div>';
  }
  var items = getItemsByCategory(currentZoneId, currentCategoryId);
  if (items.length === 0) {
    html += '<div class="empty-state">';
    html += '<div class="empty-icon">📦</div>';
    html += '<div class="empty-text">还没有物品<br>点击右上角＋添加</div>';
    html += '</div>';
  } else {
    html += '<div class="item-grid">';
    items.forEach(function(it) {
      html += renderItemCard(it, zone);
    });
    html += '</div>';
  }

  document.getElementById('zone-content').innerHTML = html;
}

function onSearch(q) {
  currentSearchQuery = q;
  renderZone();
}

function selectCategory(catId) {
  currentCategoryId = catId;
  renderZone();
}

// ========== 物品卡片渲染 ==========
function renderItemCard(item, zone) {
  var status = getItemStatus(item);
  var isDurable = zone.type !== 'consumable';
  // 耐用品按各 variant 的 stock 汇总实际件数；无 stock 字段（旧数据）默认1
  var variantCount;
  if (isDurable) {
    variantCount = (item.variants && item.variants.length) ? item.variants.reduce(function(s,v){ return s + (v.stock||1); }, 0) : 1;
  } else {
    variantCount = (item.variants && item.variants.length) ? item.variants.length : 0;
  }

  var html = '<div class="item-card item-card-compact" onclick="openCardDetail(\'' + zone.id + '\',\'' + item.id + '\')">';

  // 角标
  if (item.archived) {
    html += '<div class="card-badge badge-archived">📦 已归档</div>';
  } else if (status.expired) {
    html += '<div class="card-badge badge-expire">已过期</div>';
  } else if (status.expiring) {
    html += '<div class="card-badge badge-warn">' + status.daysLeft + '天</div>';
  } else if (status.lowStock) {
    html += '<div class="card-badge badge-low">告急</div>';
  } else if (status.stockUpAlert) {
    html += '<div class="card-badge badge-restock">🛒 囤货</div>';
  }
  // 开袋即用完标记（用于排查被误开的开关）
  if (item.oneShot === true) {
    html += '<div class="card-badge badge-oneshot">⚡即用完</div>';
  }
  // 使用感受标记
  if (item.feeling && item.feeling.rating) {
    if (item.feeling.rating >= 4) {
      html += '<div class="card-badge badge-good">👍</div>';
    } else if (item.feeling.rating <= 2) {
      html += '<div class="card-badge badge-bad">👎</div>';
    }
  }

  // 卡片body
  html += '<div class="card-body">';
  html += '<div class="card-name">' + escapeHtml(item.name) + '</div>';

  if (isDurable) {
    // 耐用品正面：显示件数 + 总金额
    html += '<div class="card-info" style="color:var(--accent);font-weight:600">' + variantCount + '件</div>';
    var totalPrice = calcDurableTotalPrice(item);
    html += '<div class="card-info" style="font-weight:600">总金额 ¥' + totalPrice.toFixed(2) + '</div>';
    if (item.location) {
      html += '<div class="card-info">📍 ' + escapeHtml(item.location) + '</div>';
    }
    if (item.lastUsedDate) {
      var dDays = daysBetween(new Date(item.lastUsedDate), new Date());
      if (dDays > 180) {
        html += '<div class="card-info" style="color:var(--purple);font-weight:600">🕐 ' + Math.floor(dDays/30) + '个月没用</div>';
      }
    }
  } else {
    // 补给品品牌变体数
    if (item.variants && item.variants.length > 0) {
      html += '<div class="card-info" style="color:var(--accent);font-weight:500">' + item.variants.length + '个品牌</div>';
    }
    // 消耗品正面：库存条 + 保质期
    var totalStock = getTotalStock(item);
    if (totalStock !== undefined) {
      var threshold = item.stockThreshold || 1;
      var maxBar = Math.max(totalStock, threshold * 3);
      var pct = maxBar > 0 ? (totalStock / maxBar * 100) : 0;
      var barClass = stockBarClass(item, status);
      html += '<div class="card-info">' + stockSummaryOf(item) + ' · ¥' + parseFloat((item.currentPrice || 0)).toFixed(2) + '</div>';
      html += '<div class="stock-bar ' + barClass + ' card-mini-bar"><div class="stock-fill" style="width:' + pct + '%"></div></div>';
    }
    if (status.daysLeft !== null && !status.expired) {
      var shelfColor = status.daysLeft <= 30 ? 'var(--red)' : (status.daysLeft <= 90 ? 'var(--orange)' : 'var(--green)');
      html += '<div class="card-info" style="color:' + shelfColor + ';font-weight:600">⏰ ' + status.daysLeft + '天</div>';
    }
  }

  html += '</div></div>';
  return html;
}

// ========== 使用记录编辑 ==========
function openUsageEdit(itemId, idx) {
  var item = findItemByIdGlobal(itemId);
  if (!item || !item.usageRecords || !item.usageRecords[idx]) { toast('记录不存在'); return; }
  var r = item.usageRecords[idx];
  var fmt = function(s) { return s ? String(s).slice(0, 10) : ''; };
  var html = '<div class="modal-handle"></div><div class="modal-title">✏️ 编辑使用记录</div>';
  html += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px">' + escapeHtml(item.name) + ' · 可修正数量与日期（历史记录若按套餐误记，请按实际' + rateUnitName(item) + '数修正）</div>';
  html += '<div class="form-group"><label class="form-label">消耗数量（' + rateUnitName(item) + '）</label><input type="number" class="form-input" id="ur-qty" step="0.01" min="0" value="' + (r.qty || 1) + '"></div>';
  html += '<div class="form-group"><label class="form-label">开始日期</label><input type="date" class="form-input" id="ur-start" value="' + fmt(r.startDate) + '"></div>';
  html += '<div class="form-group"><label class="form-label">结束日期（留空 = 使用中）</label><input type="date" class="form-input" id="ur-end" value="' + fmt(r.endDate) + '"></div>';
  html += '<div style="display:flex;gap:10px;margin-top:14px">';
  html += '<button class="btn btn-danger" style="flex:1" onclick="deleteUsageRecord(\'' + itemId + '\',' + idx + ')">🗑️ 删除</button>';
  html += '<button class="btn btn-primary" style="flex:2" onclick="saveUsageEdit(\'' + itemId + '\',' + idx + ')">保存</button>';
  html += '</div>';
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}
function saveUsageEdit(itemId, idx) {
  var item = findItemByIdGlobal(itemId);
  if (!item || !item.usageRecords || !item.usageRecords[idx]) { closeModal(); return; }
  var r = item.usageRecords[idx];
  var q = parseFloat(document.getElementById('ur-qty').value);
  r.qty = (isNaN(q) || q <= 0) ? 1 : Math.round(q * 100) / 100;
  var s = document.getElementById('ur-start').value;
  var e = document.getElementById('ur-end').value;
  if (s) r.startDate = s;
  if (e) { r.endDate = e; }
  else { delete r.endDate; }
  saveDB();
  closeModal();
  if (currentDetailItem && currentDetailItem.id === item.id) renderCardBack(currentDetailItem, currentDetailZone);
  toast('✅ 记录已更新');
}
function deleteUsageRecord(itemId, idx) {
  var item = findItemByIdGlobal(itemId);
  if (!item || !item.usageRecords || !item.usageRecords[idx]) { closeModal(); return; }
  item.usageRecords.splice(idx, 1);
  saveDB();
  closeModal();
  if (currentDetailItem && currentDetailItem.id === item.id) renderCardBack(currentDetailItem, currentDetailZone);
  toast('🗑️ 记录已删除');
}

// ========== 卡片详情（翻面）==========
var currentDetailItem = null;
var currentDetailZone = null;

function openCardDetail(zoneId, itemId) {
  var zone = getZone(zoneId);
  var item = getItem(zoneId, itemId);
  if (!zone || !item) return;
  currentDetailItem = item;
  currentDetailZone = zone;

  renderCardFront(item, zone);
  renderCardBack(item, zone);

  // 默认直接显示背面（翻转状态），无需点两次
  document.getElementById('flip-inner').classList.add('flipped');
  document.getElementById('card-detail-overlay').classList.add('show');
}

function renderCardFront(item, zone) {
  var isDurable = zone.type !== 'consumable';
  var html = '<div class="detail-front">';
  // 所有类型都用紧凑模式，不显示大照片区
  html += '<div class="detail-photo" style="background:var(--bg);">';
  html += isDurable ? '👕' : '📦';
  html += '</div>';
  html += '<div class="detail-body">';
  html += '<div class="detail-name">' + escapeHtml(item.name) + '</div>';
  var catPath = getCategoryPath(zone.id, item.categoryId);
  html += '<div class="detail-cat">' + zone.icon + ' ' + zone.name + (catPath ? ' · ' + catPath : '') + '</div>';

  if (zone.type === 'consumable') {
    var status = getItemStatus(item);
    var totalStock = getTotalStock(item);
    if (totalStock !== undefined) {
      var threshold = item.stockThreshold || 1;
      var maxBar = Math.max(totalStock, threshold * 3);
      var pct = maxBar > 0 ? (totalStock / maxBar * 100) : 0;
      var barClass = stockBarClass(item, status);
      html += '<div style="margin-top:14px">';
      var packHintF = '';
      if (item.consumeMode === 'pack' && item.variants && item.variants.length && (item.variants[0].packQty || 1) > 1) {
        var avgPqF = item.variants.reduce(function(s, v) { return s + (v.packQty || 1); }, 0) / item.variants.length;
        packHintF = '（约 ' + Math.floor(totalStock / avgPqF) + ' 套）';
      }
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:13px;color:var(--text-secondary)">库存</span><span style="font-weight:700">' + totalStock + mainPackUnit(item) + packHintF + '</span></div>';
      html += '<div class="stock-bar ' + barClass + '"><div class="stock-fill" style="width:' + pct + '%"></div></div>';
      html += '</div>';
    }
    if (status.daysLeft !== null) {
      var shelfColor = status.expired ? 'var(--red)' : (status.daysLeft <= 30 ? 'var(--red)' : (status.daysLeft <= 90 ? 'var(--orange)' : 'var(--green)'));
      html += '<div style="margin-top:10px;text-align:center;padding:10px;border-radius:8px;background:' + shelfColor + '15;color:' + shelfColor + ';font-weight:700">';
      if (status.expired) html += '⚠️ 已过期';
      else html += '⏰ 还有 ' + status.daysLeft + ' 天过期';
      html += '</div>';
    }
  } else {
    // 耐用品正面：件数（按 stock 汇总）+ 总金额
    var variantCount = (item.variants && item.variants.length) ? item.variants.reduce(function(s,v){ return s + (v.stock||1); }, 0) : 1;
    var variantTypes = (item.variants && item.variants.length) ? item.variants.length : 1;
    var totalPrice = calcDurableTotalPrice(item);
    html += '<div style="margin-top:14px;text-align:center;padding:16px;border-radius:10px;background:rgba(0,122,255,0.08);color:var(--accent);font-weight:700">';
    html += '共 ' + variantCount + ' 件' + (variantCount !== variantTypes ? ' · ' + variantTypes + '款' : '');
    html += '<div style="font-size:15px;margin-top:4px">总金额 ¥' + totalPrice.toFixed(2) + '</div>';
    html += '</div>';
    if (item.location) {
      html += '<div style="margin-top:8px;text-align:center;font-size:13px;color:var(--text-secondary)">📍 ' + escapeHtml(item.location) + '</div>';
    }
  }

  html += '<div class="detail-tap-hint">👆 点击翻面查看全部</div>';
  html += '</div></div>';
  document.getElementById('flip-front').innerHTML = html;
}

function renderCardBack(item, zone) {
  var html = '<div class="detail-back">';
  html += '<div class="back-header">';
  html += '<div class="back-title">' + escapeHtml(item.name) + '</div>';
  if (item.oneShot === true) {
    html += '<div style="display:inline-block;margin-left:8px;padding:2px 8px;border-radius:6px;background:rgba(255,149,0,0.12);color:var(--orange);font-size:12px;font-weight:600;vertical-align:middle">⚡ 开袋即用完</div>';
  }
  // 顶部快捷操作：⋯（编辑/归档/删除）+ 关闭，保持标题宽松不挤
  html += '<div style="display:flex;gap:6px;align-items:center">';
  html += '<button class="back-close" onclick="openItemActionsMenu(\'' + item.id + '\')" style="font-size:18px;font-weight:700">⋯</button>';
  html += '<button class="back-close" onclick="closeCardDetail()">✕</button>';
  html += '</div>';
  html += '</div>';

  // === 吸顶操作条（补给品：开封/补货/盘点，滚动时始终可见） ===
  if (zone.type === 'consumable') {
    html += '<div class="sticky-actions">';
    html += '<button class="btn btn-primary btn-sm" style="flex:1" onclick="openItem(\'' + item.id + '\')">🔓 开封</button>';
    html += '<button class="btn btn-outline btn-sm" style="flex:1" onclick="openRestockForm(\'' + item.id + '\')">📦 补货</button>';
    html += '<button class="btn btn-outline btn-sm" style="flex:1" onclick="openStockAuditForm(\'' + item.id + '\')">📦 盘点</button>';
    html += '</div>';
    html += '<div style="margin:8px 0 2px"><button class="btn btn-outline btn-sm" style="width:100%;font-size:12px" onclick="taskFromItem(\'' + zone.id + '\',\'' + item.id + '\')">📋 加入待接委托（免手输，去填价格）</button></div>';
  }

  // === 基本信息 ===
  html += '<div class="back-section">';
  html += '<div class="back-section-title">基本信息</div>';
  // 照片墙仅补给品保留（耐用品件数清单已有每件照片，顶部总览冗余）
  if (zone.type === 'consumable' && item.photos && item.photos.length > 1) {
    html += '<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none">';
    item.photos.forEach(function(p) {
      html += '<img src="' + p + '" style="width:80px;height:80px;border-radius:8px;object-fit:cover;flex-shrink:0">';
    });
    html += '</div>';
  }
  html += '<div class="back-row"><span class="back-label">分类</span><span class="back-value">' + (getCategoryPath(zone.id, item.categoryId) || '未分类') + '</span></div>';
  if (item.location) html += '<div class="back-row"><span class="back-label">存放位置</span><span class="back-value">' + escapeHtml(item.location) + '</span></div>';
  if (item.notes && zone.type === 'consumable') html += '<div class="back-row"><span class="back-label">备注</span><span class="back-value">' + escapeHtml(item.notes) + '</span></div>';
  html += '</div>';

  // === 库存与价格 ===
  if (zone.type === 'consumable') {
    html += '<div class="back-section">';
    html += '<div class="back-section-title">库存与价格</div>';
    var totalStock = getTotalStock(item);
    if (totalStock !== undefined) html += '<div class="back-row"><span class="back-label">总库存</span><span class="back-value">' + stockSummaryOf(item) + '</span></div>';
    if (item.stockThreshold) html += '<div class="back-row"><span class="back-label">告急阈值</span><span class="back-value">' + item.stockThreshold + mainPackUnit(item) + '</span></div>';
    html += '</div>';

    // === 品牌变体（已用完/不再买的默认折叠，保持面板清爽）===
    if (item.variants && item.variants.length > 0) {
      var doneVs = item.variants.filter(function(v) { return v.usedUp || v.noRestock; });
      var liveVs = item.variants.filter(function(v) { return !(v.usedUp || v.noRestock); });
      var showDone = !!(window._showDoneVariants && window._showDoneVariants[item.id]);
      var listVs = showDone ? item.variants : liveVs;
      html += '<div class="back-section">';
      html += '<div class="back-section-title">品牌变体 (' + liveVs.length + '个在用' + (doneVs.length ? ' · 已藏' + doneVs.length + '个' : '') + ')</div>';
      listVs.forEach(function(v, vi) {
        var isUsing = v.opened && !v.usedUp;
        var isDone = !!v.usedUp;
        var cardCls = 'variant-card' + (isUsing ? ' vc-using' : (isDone ? ' vc-done' : '')) + (v.noRestock ? ' vc-norestock' : '');
        html += '<div class="' + cardCls + '">';
        // 头部：品牌名 + 状态徽章 + 不再买标记
        html += '<div class="vc-head">';
        html += '<div class="vc-brand">' + escapeHtml(v.brand || '未命名') + '</div>';
        if (v.noRestock) html += '<span class="vc-badge norestock">🚫 不再买</span>';
        else if (isUsing) html += '<span class="vc-badge using">使用中</span>';
        else if (isDone) html += '<span class="vc-badge done">已用完</span>';
        else if (variantSpecsOf(v).length || (v.stock || 0) > 0) html += '<span class="vc-badge" style="background:rgba(142,142,147,0.12);color:var(--text-secondary)">待开封</span>';
        html += '</div>';
        // 价格：总价为主数字，套餐构成作为副说明
        var cVTotal = v.totalPrice || 0;
        html += '<div class="vc-price-line">';
        html += '<span class="vc-price">¥' + cVTotal.toFixed(2) + '</span>';
        if (v.packCount) {
          html += '<span class="vc-price-note">' + v.packCount + ' 套 × ¥' + (v.packPrice || 0).toFixed(2) + '</span>';
        }
        html += '</div>';
        // 信息网格：折算单价 / 库存 / 库存构成 / 开封时间
        html += '<div class="vc-meta">';
        html += '<div class="vc-meta-item"><div class="vc-meta-label">折算单价</div><div class="vc-meta-value">' + variantPriceCompareText(v) + '</div></div>';
        html += '<div class="vc-meta-item"><div class="vc-meta-label">当前库存</div><div class="vc-meta-value">' + variantPackText(v, item) + '</div></div>';
        html += '<div class="vc-meta-item wide"><div class="vc-meta-label">库存构成</div><div class="vc-meta-value">' + escapeHtml(packHintOf(v)) + '</div></div>';
        var hasWeight = v.packWeight && v.packWeight > 0;
        if (hasWeight) {
          var wu = weightUnitOf(v);
          html += '<div class="vc-meta-item"><div class="vc-meta-label">每' + (v.packUnit || '个') + '含量</div><div class="vc-meta-value">' + round1(v.packWeight) + ' ' + wu + '</div></div>';

            html += '<div style="position:absolute;bottom:0;right:0;background:rgba(0,122,255,0.85);color:#fff;font-size:11px;font-weight:700;padding:1px 6px">×' + (v.stock||1) + '</div>';
          }
        }
        html += '<div class="variant-label">' + escapeHtml(v.brand || ('第' + (vi+1) + '件')) + '</div>';
        // 价格展示：单件显示单价；多件显示 "单价 ×N = 总价"
        var vQty = v.stock || 1;
        var vUnitP = v.price || 0;
        var vTotalP = v.totalPrice || (vUnitP * vQty);
        if (vQty > 1 && vUnitP > 0) {
          html += '<div class="variant-sub">¥' + vUnitP.toFixed(2) + ' × ' + vQty + ' = ¥' + vTotalP.toFixed(2) + '</div>';
        } else if (vTotalP > 0) {
          html += '<div class="variant-sub">¥' + vTotalP.toFixed(2) + '</div>';

        html += '</div>';
      });

    } else {
      html += '<div style="padding:8px 0;font-size:13px;color:var(--text-tertiary)">还没有件数记录</div>';
    }
    html += '</div>';
  }

  html += '</div>';
  document.getElementById('flip-back').innerHTML = html;
}

// ========== 全屏照片查看器 ==========
var _viewerPhotos = [];
var _viewerIndex = 0;
var _viewerScale = 1;
var _viewerStartX = 0;
var _viewerStartY = 0;
var _viewerLastDist = 0;

function openPhotoViewer(photos, index) {
  if (!photos || photos.length === 0) return;
  _viewerPhotos = photos;
  _viewerIndex = index || 0;
  _viewerScale = 1;

  var html = '<div class="photo-viewer" id="photoViewer">';
  html += '<button class="photo-viewer-close" onclick="closePhotoViewer()">✕</button>';
  html += '<img id="viewerImg" src="' + photos[_viewerIndex] + '">';
  if (photos.length > 1) {
    html += '<div class="photo-viewer-counter" id="viewerCounter">' + (_viewerIndex+1) + ' / ' + photos.length + '</div>';
  }
  html += '</div>';

  // 移除旧的
  var old = document.getElementById('photoViewer');
  if (old) old.remove();

  document.body.insertAdjacentHTML('beforeend', html);

  var img = document.getElementById('viewerImg');
  var viewer = document.getElementById('photoViewer');

  // 单击关闭
  viewer.addEventListener('click', function(e) {
    if (e.target === viewer) closePhotoViewer();
  });

  // 左右滑动切换
  var touchStartX = 0, touchStartY = 0, touchMoved = false;
  img.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchMoved = false;
    }
    if (e.touches.length === 2) {
      _viewerLastDist = getTouchDist(e);
    }
  }, { passive: true });

  img.addEventListener('touchmove', function(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      var dist = getTouchDist(e);
      if (_viewerLastDist > 0) {
        _viewerScale = Math.max(0.5, Math.min(4, _viewerScale * (dist / _viewerLastDist)));
        img.style.transform = 'scale(' + _viewerScale + ')';
      }
      _viewerLastDist = dist;
    } else if (e.touches.length === 1 && _viewerScale <= 1) {
      var dx = e.touches[0].clientX - touchStartX;
      var dy = e.touches[0].clientY - touchStartY;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) touchMoved = true;
    }
  }, { passive: false });

  img.addEventListener('touchend', function(e) {
    if (_viewerScale > 1) return; // 缩放状态下不切换
    if (!touchMoved) return;
    var touch = e.changedTouches[0];
    var dx = touch.clientX - touchStartX;
    var dy = touch.clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0 && _viewerIndex > 0) {
        _viewerIndex--;
        updateViewerImg();
      } else if (dx < 0 && _viewerIndex < _viewerPhotos.length - 1) {
        _viewerIndex++;
        updateViewerImg();
      }
    }
    _viewerScale = 1;
    img.style.transform = 'scale(1)';
  }, { passive: true });
}

function getTouchDist(e) {
  var dx = e.touches[0].clientX - e.touches[1].clientX;
  var dy = e.touches[0].clientY - e.touches[1].clientY;
  return Math.sqrt(dx*dx + dy*dy);
}

function updateViewerImg() {
  var img = document.getElementById('viewerImg');
  var counter = document.getElementById('viewerCounter');
  if (img) {
    img.src = _viewerPhotos[_viewerIndex];
    img.style.transform = 'scale(1)';
    _viewerScale = 1;
  }
  if (counter) counter.textContent = (_viewerIndex+1) + ' / ' + _viewerPhotos.length;
}

function closePhotoViewer() {
  var v = document.getElementById('photoViewer');
  if (v) v.remove();
}

  var v = item.variants.find(function(v) { return v.id === variantId; });

// ========== 自动更新检查 ==========
// deploy.py 部署时会把 1791293532 替换为构建时间戳，并上传同目录 version.json
var APP_VERSION = '1791293532';

function checkAppUpdate(manual) {
  try {
    if (!APP_VERSION || APP_VERSION.indexOf('__BUILD') === 0) {
      if (manual) toast('当前为本地版本，无法检查更新');
      return;
    }
    if (manual) toast('🔍 正在检查更新…');
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        var remote = data && String(data.version || '');
        if (!remote) {
          if (manual) toast('检查失败，请检查网络');
          return;
        }
        if (remote === APP_VERSION) { // 版本一致，无需更新
          if (manual) toast('✅ 已是最新版本');
          return;
        }
        var key = 'jiayou_redirected_' + remote;
        if (sessionStorage.getItem(key)) { // 已为该版本跳转过，防循环
          if (manual) toast('已加载新版本，请关闭后重新打开');
          return;
        }
        sessionStorage.setItem(key, '1');
        toast('🔄 发现新版本，正在更新…');
        setTimeout(function() {
          // 带版本参数刷新，绕过 iOS PWA 的顽固缓存
          location.replace(location.pathname + '?v=' + remote + (location.hash || ''));
        }, 600);
      })
      .catch(function() {
        if (manual) toast('检查失败，请检查网络');
      });
  } catch(e) {}
}
// 每次切回前台（从后台唤醒 App）时静默检查一次
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) checkAppUpdate(false);
});

// 把构建时间戳转成可读的更新时间
function getAppVersionText() {
  if (!APP_VERSION || APP_VERSION.indexOf('__BUILD') === 0) return '本地开发版';
  var d = new Date(parseInt(APP_VERSION, 10) * 1000);
  if (isNaN(d.getTime())) return APP_VERSION;
  return formatDateTime(d.toISOString()) || APP_VERSION;
}

function openItem(itemId) {

  }

  // 混合规格：消耗对象是规格本身（1个小样 / 1盒3合1），按份扣减，不是按含量扣

    html += '<div style="font-size:13px;color:var(--text-secondary)">库存：' + trimNum(variantSpecContent(v)) + variantSpecUnit(v) + '（共 ' + trimNum(variantSpecPieces(v)) + ' 件）</div>';
    html += '</div>';
    html += '<div style="font-size:13px;font-weight:700;margin-bottom:6px">选择本次开封的规格（按份扣）</div>';
    window._openSpecQty = {};
    spOpen.forEach(function (s, k) {
      window._openSpecQty[k] = 0;
      html += '<div style="display:flex;gap:8px;align-items:center;padding:10px;background:var(--bg);border-radius:10px;margin-bottom:6px">';
      html += '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">' + escapeHtml(s.name || ('规格' + (k + 1))) + '</div>';
      html += '<div style="font-size:12px;color:var(--text-secondary)">' + trimNum(s.content) + (s.unit || '') + '/份 · 剩 ' + trimNum(s.qty) + ' 份</div></div>';
      html += '<div class="stepper"><button onclick="adjustSpecOpen(' + k + ',-1)">−</button><span class="stepper-val" id="spec-open-' + k + '">0</span><button onclick="adjustSpecOpen(' + k + ',1)">＋</button></div>';
      html += '</div>';
    });
    html += '<div class="form-group">';
    html += '<label class="form-label">开始使用日期</label>';
    html += '<input type="date" class="form-input" id="open-date" value="' + new Date().toISOString().split('T')[0] + '">';
    html += '</div>';
    html += '<button class="btn btn-primary btn-full" onclick="confirmOpen(\'' + itemId + '\',\'' + variantId + '\')">确认开封</button>';
    html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">取消</button>';
    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('modal-overlay').classList.add('show');
    window._openQty = 1;
    window._maxOpenQty = 1;
    window._openVariantId = variantId;
    window._openItemId = itemId;
    return;
  }

  // 套餐消耗：开一整套，用完再开下一整套
  if ((item.consumeMode || 'pack') === 'pack') {
    var pq = Math.min(v.packQty || 1, v.stock || 1);
    var html = '<div class="modal-handle"></div>';
    html += '<div class="modal-title">🔓 开封使用（套餐）</div>';
    html += '<div style="text-align:center;margin-bottom:16px">';
    html += '<div style="font-size:16px;font-weight:700">' + escapeHtml(item.name) + '</div>';
    html += '<div style="font-size:14px;color:var(--accent)">' + escapeHtml(v.brand) + '</div>';
    html += '<div style="font-size:13px;color:var(--text-secondary)">库存：' + v.stock + (v.packUnit || mainPackUnit(item)) + '（每套 ' + (v.packQty||1) + (v.packUnit||'个') + '）</div>';

    html += '将开一整套：<strong>' + pq + ' ' + (v.packUnit||'个') + '</strong><br><span style="font-size:12px;color:var(--text-secondary)">用完这一整套后再开下一整套</span></div>';

    return;
  }

  var maxQty = v.stock || 1;
  var html = '<div class="modal-handle"></div>';

  html += '<div class="form-group">';

  html += '</div>';
  html += '<button class="btn btn-primary btn-full" onclick="confirmOpen(\'' + itemId + '\',\'' + variantId + '\')">确认开封</button>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');

  window._openQty = 1;
  window._maxOpenQty = maxQty;
  window._openVariantId = variantId;
}

function adjustOpenQty(delta) {
  window._openQty = Math.max(1, Math.min(window._maxOpenQty, window._openQty + delta));
  var valEl = document.getElementById('open-qty-val');
  if (valEl) valEl.textContent = window._openQty;
}
// 多规格开封：每个规格独立步进（0 ~ 该规格剩余份数）
function adjustSpecOpen(k, delta) {
  var q = window._openSpecQty || {};
  var item = getItem(currentZoneId, window._openItemId);
  var v = item && item.variants ? item.variants.find(function (x) { return x.id === window._openVariantId; }) : null;
  var sp = v ? variantSpecsOf(v) : [];
  var max = sp[k] ? sp[k].qty : 0;
  q[k] = Math.max(0, Math.min(max, (q[k] || 0) + delta));
  window._openSpecQty = q;
  var el = document.getElementById('spec-open-' + k);
  if (el) el.textContent = q[k];
}

function confirmOpen(itemId, variantId, markAsUsed) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(v) { return v.id === variantId; });
  if (!v) return;
  var dateInput = document.getElementById('open-date');
  var date = dateInput ? dateInput.value : new Date().toISOString().split('T')[0];
  var nowISO = new Date(date).toISOString();

  // 混合规格：按「规格×份数」扣减，如 小样×1、3合1×2
  var spOpen = variantSpecsOf(v);
  if (spOpen.length && window._openSpecQty) {
    var usedParts = [], pieces = 0, contentUsed = 0;
    var spUnit = variantSpecUnit(v); // 先取单位：扣完可能全部归零，之后再取就空了
    spOpen.forEach(function (s, k) {
      var n = Math.min(window._openSpecQty[k] || 0, s.qty);
      if (n <= 0) return;
      s.qty -= n;
      usedParts.push((s.name || '规格' + (k + 1)) + '×' + n);
      pieces += n;
      contentUsed += n * (+s.content || 0);
    });
    if (!pieces) { toast('先选择要开封的规格'); return; }
    v.opened = true;
    v.openDate = nowISO;
    v.openQty = pieces;
    v.stock = variantSpecContent(v);
    var allEmpty = spOpen.every(function (s) { return s.qty <= 0; });
    if (allEmpty) { v.usedUp = true; v.finishDate = nowISO; }
    if (!item.usageRecords) item.usageRecords = [];
    item.usageRecords.push({
      startDate: nowISO,
      endDate: allEmpty ? nowISO : null,
      qty: pieces,
      variantId: variantId,
      brand: v.brand,
      specText: usedParts.join(' + '),
      contentUsed: Math.round(contentUsed * 100) / 100
    });
    syncItemFromVariants(item);
    saveDB();
    closeModal();
    openCardDetail(currentZoneId, itemId);
    toast('已开封 ' + escapeHtml(v.brand) + '：' + usedParts.join(' + ') + '，- ' + trimNum(contentUsed) + spUnit);
    return;
  }

  var qty = window._openQty || 1;
  if (qty > (v.stock || 0)) qty = v.stock || 0; // 不超过现有库存

  v.opened = true;
  v.usedUp = !!markAsUsed;
  v.openDate = nowISO;
  v.openQty = qty;
  v.stock = Math.max(0, (v.stock || 0) - qty);
  if (markAsUsed) v.finishDate = nowISO;

  if (!item.usageRecords) item.usageRecords = [];
  item.usageRecords.push({
    startDate: nowISO,
    endDate: markAsUsed ? nowISO : null,
    qty: qty,
    variantId: variantId,
    brand: v.brand
  });

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  toast('已' + (markAsUsed ? '开封并标记用完' : '开封') + ' ' + escapeHtml(v.brand) + '，库存-' + qty);
}

function confirmFinish(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(v) { return v.id === variantId; });
  if (!v) return;
  var date = document.getElementById('finish-date').value;

  v.usedUp = true;
  v.finishDate = new Date(date).toISOString();

  if (item.usageRecords && item.usageRecords.length > 0) {
    var lastRecord = item.usageRecords[item.usageRecords.length - 1];
    if (!lastRecord.endDate) {
      lastRecord.endDate = new Date(date).toISOString();
    }
  }

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  openCardDetail(currentZoneId, itemId);
  toast('已记录用完。消耗数据已更新');
}

// 直接标记某个变体用完（用于多变体的"用完了"按钮，食品类直接完成）
function finishVariant(itemId, variantId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  var v = item.variants.find(function(vv) { return vv.id === variantId; });
  if (!v) return;

  // 多规格：开封那一刻已按「规格×份数」扣过库存，
  // 这里的「用完了」= 手头开的这一批用完 → 只结束本次使用记录，剩余规格照常待开封
  if (variantSpecsOf(v).length) {
    var recF = null;
    if (item.usageRecords) {
      for (var fi = item.usageRecords.length - 1; fi >= 0; fi--) {
        if (item.usageRecords[fi].variantId === variantId && !item.usageRecords[fi].endDate) { recF = item.usageRecords[fi]; break; }
      }
    }
    var nowF = new Date().toISOString();
    if (recF) recF.endDate = nowF;
    v.usedUp = false;
    v.finishDate = null;
    v.opened = false; // 本批结束，剩余库存等下次开封
    var usedC = (recF && recF.contentUsed > 0) ? recF.contentUsed : 0;
    var remainC = variantSpecContent(v), remainP = variantSpecPieces(v), spU = variantSpecUnit(v);
    syncItemFromVariants(item);
    saveDB();
    openCardDetail(currentZoneId, itemId);
    toast('本批已记用完' + (usedC > 0 ? '（≈' + trimNum(usedC) + spU + '）' : '') + '，剩 ' + trimNum(remainC) + spU + '（' + trimNum(remainP) + ' 件）待开封');
    return;
  }

  // 普通变体：还有剩余库存 → 「用完了」只结束当前开封的这一份，剩余的继续待开封
  // （如 10支装用了7支还剩3支：结束使用记录，但不能把整个品牌折叠进「已用完」）
  if ((v.stock || 0) > 0) {
    var recN = null;
    if (item.usageRecords) {
      for (var ni = item.usageRecords.length - 1; ni >= 0; ni--) {
        if (item.usageRecords[ni].variantId === variantId && !item.usageRecords[ni].endDate) { recN = item.usageRecords[ni]; break; }
      }
    }
    var nowN = new Date().toISOString();
    if (recN) recN.endDate = nowN;
    v.usedUp = false;
    v.finishDate = null;
    v.opened = false; // 本份结束，剩余库存等下次开封
    var uN = v.packUnit || mainPackUnit(item);
    syncItemFromVariants(item);
    saveDB();
    openCardDetail(currentZoneId, itemId);
    toast('本份已记用完，剩 ' + trimNum(v.stock) + uN + ' 待开封');
    return;
  }

  // 库存已为 0 → 真正用完，折叠进「已用完」区
  v.usedUp = true;
  v.finishDate = v.finishDate || new Date().toISOString();

  if (item.usageRecords && item.usageRecords.length > 0) {
    var lastRecord = item.usageRecords[item.usageRecords.length - 1];
    if (lastRecord && !lastRecord.endDate && lastRecord.variantId === variantId) {
      lastRecord.endDate = v.finishDate;
    }
  }

  syncItemFromVariants(item);
  saveDB();
  openCardDetail(currentZoneId, itemId);
  toast('已记录用完');
}

// 单品牌物品：标记当前使用中的变体为用完
function finishCurrentVariant(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  ensureVariants(item);

}

// 品牌级「不再买」：该品牌不再计入补货提醒，卡片和历史数据都保留

// 多规格品牌的补货明细：按规格录份数；也支持直接按含量补
function renderRestockSpecs(item) {
  var box = document.getElementById('restock-spec-block');
  if (!box) return;
  var sel = document.getElementById('restock-brand');
  var vid = sel ? sel.value : '';
  var v = null;
  item.variants.forEach(function(x) { if (x.id === vid) v = x; });
  var sp = (v && v.specs) ? v.specs : [];
  var qtyRow = document.getElementById('restock-qty-row');
  if (!sp.length || !v) {
    box.style.display = 'none'; box.innerHTML = '';
    if (qtyRow) qtyRow.style.display = 'flex';
    return;
  }
  box.style.display = 'block';
  var h = '<div style="font-size:13px;font-weight:700;margin:4px 0 6px">🧩 补货规格（按份数）</div>';
  h += '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">现有：' + escapeHtml(variantSpecText(v)) + '</div>';
  sp.forEach(function (s, k) {
    h += '<div class="form-row" style="align-items:center;margin-bottom:6px">';
    h += '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">' + escapeHtml(s.name || ('规格' + (k + 1))) + '</div>';
    h += '<div style="font-size:11px;color:var(--text-secondary)">' + trimNum(s.content) + (s.unit || '') + '/份 · 现有 ' + trimNum(s.qty) + ' 份</div></div>';
    h += '<input type="number" class="form-input" style="width:92px;flex:none" id="restock-spec-' + k + '" value="0" min="0" step="1" oninput="syncRestockSpecQty()">';
    h += '</div>';
  });
  h += '<div class="form-row">';
  h += '<div class="form-group" style="flex:1"><label class="form-label">或按含量补（选填）</label><input type="number" class="form-input" id="restock-spec-content" value="" placeholder="如 100" oninput="syncRestockSpecQty()"></div>';
  h += '<div class="form-group" style="width:96px;flex:none"><label class="form-label">单位</label><input type="text" class="form-input" id="restock-spec-unit" value="' + escapeHtml(sp[0].unit || '') + '"></div>';
  h += '</div>';
  box.innerHTML = h;
  window._restockSpecs = sp;
  if (qtyRow) qtyRow.style.display = 'flex'; // 数量行保留（用于算单价），由规格自动回填
}
// 规格份数 → 自动回填「补货数量」（含量口径），省得再手算
function syncRestockSpecQty() {
  var sp = window._restockSpecs || [];
  var total = 0, unit = '';
  for (var i = 0; i < sp.length; i++) {
    var e = document.getElementById('restock-spec-' + i);
    if (e) total += (parseFloat(e.value) || 0) * (+sp[i].content || 0);
  }
  if (sp.length) unit = sp[0].unit || '';
  var cEl = document.getElementById('restock-spec-content');
  if (cEl) {
    total += (parseFloat(cEl.value) || 0);
    var uEl = document.getElementById('restock-spec-unit');
    if (uEl && uEl.value) unit = uEl.value;
  }
  var qEl = document.getElementById('restock-qty');
  if (qEl && total > 0) qEl.value = Math.round(total * 100) / 100;
  var unEl = document.getElementById('restock-unit');
  if (unEl && unit) unEl.value = unit;
  if (window._restockItemId) {
    var it = getItem(currentZoneId, window._restockItemId);
    if (it) updateRestockCompare(it);
  }
}

function updateRestockCompare(item) {
  var qty = parseFloat(document.getElementById('restock-qty').value) || 0;
  var total = parseFloat(document.getElementById('restock-total').value) || 0;
  var unitPrice = qty > 0 ? total / qty : 0;
  document.getElementById('restock-unit-price').value = unitPrice.toFixed(2);

  var compareDiv = document.getElementById('restock-compare');
  if (unitPrice > 0 && item.priceHistory && item.priceHistory.length > 0) {
    var prices = item.priceHistory.map(function(p) { return p.unitPrice || 0; });
    var minPrice = Math.min.apply(null, prices);
    var lastPrice = prices[prices.length - 1];

    if (unitPrice < minPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-cheaper">🎉 新低！比历史最低 ¥' + minPrice.toFixed(2) + ' 便宜 ¥' + (minPrice - unitPrice).toFixed(2) + '</div>';
    } else if (unitPrice < lastPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-cheaper">✓ 比上次 ¥' + lastPrice.toFixed(2) + ' 便宜</div>';
    } else if (unitPrice > lastPrice) {
      compareDiv.innerHTML = '<div class="price-compare price-expensive">⚠ 比上次 ¥' + lastPrice.toFixed(2) + ' 贵 ¥' + (unitPrice - lastPrice).toFixed(2) + '</div>';
    } else {
      compareDiv.innerHTML = '<div class="price-compare price-same">和上次价格相同</div>';
    }
  }
}

var restockPhotos = [];
function uploadRestockPhoto() {
  var input = document.getElementById('photo-input');
  input.onchange = function(e) {
    var files = e.target.files;
    for (var i = 0; i < files.length && restockPhotos.length < 3; i++) {
      compressImage(files[i], function(dataUrl) {
        restockPhotos.push(dataUrl);
        renderRestockPhotos();
      });
    }
    input.value = '';
  };
  input.click();
}

function renderRestockPhotos() {
  var container = document.getElementById('restock-photos');
  var html = '';
  restockPhotos.forEach(function(p, i) {
    html += '<div class="photo-slot has-photo"><img src="' + p + '"><button class="remove-photo" onclick="removeRestockPhoto(' + i + ')">✕</button></div>';
  });
  if (restockPhotos.length < 3) {
    html += '<div class="photo-slot" onclick="uploadRestockPhoto()">📷</div>';
  }
  container.innerHTML = html;
}

function removeRestockPhoto(idx) {
  restockPhotos.splice(idx, 1);
  renderRestockPhotos();
}

function confirmRestock(itemId) {
  var item = getItem(currentZoneId, itemId);
  if (!item) return;
  ensureVariants(item);
  var qty = parseFloat(document.getElementById('restock-qty').value) || 0;
  var total = parseFloat(document.getElementById('restock-total').value) || 0;
  var unitPrice = qty > 0 ? total / qty : 0;
  var channel = document.getElementById('restock-channel').value;
  var date = document.getElementById('restock-date').value;
  var notes = document.getElementById('restock-notes').value;
  var unit = document.getElementById('restock-unit').value;

  if (qty <= 0) { toast('请输入数量'); return; }

  item.unit = unit;
  item.channel = channel;

  // 更新或新增variant
  var brandSelect = document.getElementById('restock-brand').value;
  var variant;
  if (brandSelect === '__new__') {
    var newBrand = document.getElementById('restock-new-brand').value.trim() || ('品牌' + (item.variants.length + 1));
    variant = { id: genId(), brand: newBrand, stock: qty, price: parseFloat(unitPrice.toFixed(2)), totalPrice: parseFloat(total.toFixed(2)), channel: channel, photos: [], opened: false, openDate: null, finishDate: null, usedUp: false, openQty: 0, feeling: null, shelfLife: item.shelfLife, productionDate: null };
    item.variants.push(variant);
  } else {
    variant = item.variants.find(function(v) { return v.id === brandSelect; });
    if (variant) {
      // 多规格品牌：按「规格×份数」补，库存由规格明细重算（否则会被下次开封覆盖）
      var spR = (variant.specs && variant.specs.length) ? variant.specs : null;
      var addedPieces = 0;
      if (spR) {
        spR.forEach(function (s, k) {
          var el = document.getElementById('restock-spec-' + k);
          var n = el ? (parseFloat(el.value) || 0) : 0;
          if (n > 0) { s.qty = (+s.qty || 0) + n; addedPieces += n; }
        });
        if (!addedPieces) {
          // 没填份数 → 按含量补：同含量同单位的规格合并，否则新增一行「补货」
          var cEl = document.getElementById('restock-spec-content');
          var c = cEl ? (parseFloat(cEl.value) || 0) : 0;
          if (c <= 0) c = qty;
          var uEl = document.getElementById('restock-spec-unit');
          var u = uEl ? (uEl.value || '').trim() : '';
          var hit = null;
          spR.forEach(function (s) {
            if (!hit && Math.abs((+s.content || 0) - c) < 1e-6 && (s.unit || '') === u) hit = s;
          });
          if (hit) hit.qty = (+hit.qty || 0) + 1;
          else spR.push({ name: '补货', qty: 1, content: c, unit: u });
          addedPieces = 1;
        }
        variant.stock = variantSpecContent(variant);
        variant.packCount = variantSpecPieces(variant);
        variant.packQty = 1;
        variant.packWeight = 1;
        variant.packUnit = (spR[0].unit || variant.packUnit);
        variant.packWeightUnit = (spR[0].unit || variant.packWeightUnit);
        variant.usedUp = false;   // 又补上了 → 不再是「用完」状态
        variant.finishDate = null;
      } else {
        variant.stock = (variant.stock || 0) + qty;
      }
      variant.price = parseFloat(unitPrice.toFixed(2));
      variant.totalPrice = parseFloat((variant.price * (variant.stock || 0)).toFixed(2));
      variant.channel = channel;
    }
  }

  // 价格历史
  if (!item.priceHistory) item.priceHistory = [];
  item.priceHistory.push({
    date: new Date(date).toISOString(),
    channel: channel,
    quantity: qty,
    totalPrice: total,
    unitPrice: parseFloat(unitPrice.toFixed(1)),
    notes: notes,
    brand: variant ? variant.brand : '',
    attachments: restockPhotos.slice()
  });

  syncItemFromVariants(item);
  saveDB();
  closeModal();
  restockPhotos = [];
  toast('补货成功 +' + qty + ' (' + (variant ? variant.brand : '') + ')');
  renderZone();
}

  // 顶部快捷操作：保存 / 删除（字段多时免滑到底部）

  html += '<button class="btn btn-primary" style="flex:1" onclick="saveItem()">💾 保存</button>';
  if (item) {
    html += '<button class="btn btn-danger" style="flex-shrink:0" onclick="deleteItem(\'' + item.id + '\')">🗑 删除</button>';
  }
  html += '</div>';

  html += '<div class="form-group"><label class="form-label">名称</label>';
  html += '<input type="text" class="form-input" id="item-name" value="' + (item?escapeHtml(item.name):'') + '" placeholder="如：洗发水"></div>';

  // 两级分类：大类必选，子分类选填
  var mainCats = zone.categories.filter(function(c) { return !c.parentId; });
  var selMainId = mainCats.length > 0 ? mainCats[0].id : '';
  var selSubId = '';
  if (item && item.categoryId) {
    var itemCat = getCategory(zone.id, item.categoryId);
    if (itemCat) {
      if (itemCat.parentId) { selMainId = itemCat.parentId; selSubId = itemCat.id; }
      else { selMainId = itemCat.id; }
    }
  }
  html += '<div class="form-row">';
  html += '<div class="form-group"><label class="form-label">大类</label>';
  html += '<select class="form-select" id="item-category" onchange="updateItemSubcategoryOptions(\'' + zone.id + '\', this.value)">';
  mainCats.forEach(function(c) {
    html += '<option value="' + c.id + '"' + (selMainId===c.id?' selected':'') + '>' + escapeHtml(c.name) + '</option>';
  });
  html += '</select></div>';
  html += '<div class="form-group"><label class="form-label">子分类（选填）</label>';
  html += '<select class="form-select" id="item-subcategory"></select></div>';
  html += '</div>';

  // 耐用品：件数编辑器（每件=描述+照片+可选价格+备注）
  if (zone.type !== 'consumable') {
    html += '<div class="form-group"><label class="form-label">件数清单</label>';
    // 顶部快捷添加（衣服多时免滑到底）
    html += '<button class="btn btn-outline btn-sm" style="width:100%;margin-bottom:8px" onclick="addDurableVariantRow()">＋ 添加一件</button>';
    html += '<div id="variant-list">';
    var dVariants = [];
    if (item && item.variants && item.variants.length > 0) {
      dVariants = item.variants.map(function(v) {
        return { id: v.id, brand: v.brand||'', photos: (v.photos||[]).slice(), price: v.price||0, notes: v.notes||'', stock: v.stock||1, totalPrice: v.totalPrice||0 };
      });
    } else {
      dVariants = [{ id: genId(), brand: '', photos: [], price: 0, notes: '', stock: 1, totalPrice: 0 }];
    }
    window._editVariants = dVariants;
    window._editVariantPhotos = dVariants.map(function(v) { return v.photos.slice(); });
    html += renderDurableVariantRows();
    html += '</div>';
    html += '<button class="btn btn-outline btn-sm" style="margin-top:6px;width:100%" onclick="addDurableVariantRow()">＋ 添加一件</button>';
    html += '</div>';
  }

  html += '<div class="form-group"><label class="form-label">存放位置（选填）</label>';
  html += '<input type="text" class="form-input" id="item-location" value="' + (item?escapeHtml(item.location||''):'') + '" placeholder="如：衣柜A层"></div>';

  if (zone.type === 'consumable') {
    // 品牌变体区域（带照片上传）
    html += '<div class="form-group"><label class="form-label">品牌变体</label>';
    html += '<div id="variant-list">';
    var variants = (item && item.variants && item.variants.length > 0) ? item.variants : [];
    if (variants.length === 0) variants = [{ id: genId(), brand: item?item.name:'', stock: item?(item.stock||0):0, price: item?(item.currentPrice||0):0, totalPrice: 0, photos: [] }];
    window._editVariants = variants.map(function(v) {
      return {
        id: v.id, brand: v.brand||'', stock: v.stock||0, price: v.price||0, totalPrice: v.totalPrice||0,
        packCount: (typeof v.packCount!=='undefined'?v.packCount:(v.stock||0)),
        packPrice: (typeof v.packPrice!=='undefined'?v.packPrice:(v.totalPrice||0)),
        packQty: (typeof v.packQty!=='undefined'?v.packQty:1),
        packUnit: v.packUnit||(item?item.unit||'个':'个'),
        packWeight: (typeof v.packWeight!=='undefined'?v.packWeight:0),
        packWeightUnit: v.packWeightUnit || 'kg',
        noRestock: !!v.noRestock,
        specs: (v.specs || []).map(function (s) { return { name: s.name || '', qty: +s.qty || 0, content: +s.content || 0, unit: s.unit || '' }; }),
        photos: (v.photos||[]).slice()
      };
    });
    window._editVariantPhotos = variants.map(function(v) { return (v.photos||[]).slice(); });
    html += renderConsumableVariantRows();
    html += '</div>';
    html += '<button class="btn btn-outline btn-sm" style="margin-top:6px;width:100%" onclick="addConsumableVariantRow()">＋ 添加品牌</button>';
    html += '</div>';

    // 消耗模式（用户手动定义，系统不自动猜）
    var mPack = (!item || item.consumeMode !== 'unit');
    var mUnit = (item && item.consumeMode === 'unit');
    html += '<div class="form-group">';
    html += '<label class="form-label">消耗模式（你手动定义）</label>';
    html += '<div style="display:flex;gap:8px">';
    html += '<button type="button" class="btn ' + (mPack ? 'btn-primary' : 'btn-outline') + '" style="flex:1" data-cmode="pack" onclick="setConsumeMode(\'pack\')">📦 套餐消耗</button>';
    html += '<button type="button" class="btn ' + (mUnit ? 'btn-primary' : 'btn-outline') + '" style="flex:1" data-cmode="unit" onclick="setConsumeMode(\'unit\')">🔢 小单位消耗</button>';
    html += '</div>';
    html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px">套餐消耗：开一整套用，用完再开下一整套（纸巾/猫粮/凝珠）。小单位消耗：每次取一个小单位，包装只是采购打包（面膜/小样）。</div>';
    html += '<input type="hidden" id="item-consumemode" value="' + (mUnit ? 'unit' : 'pack') + '">';
    html += '</div>';

    html += '<div class="form-group">';
    html += '<label class="form-label">开袋即用完</label>';
    html += '<div class="switch-row"><span class="switch-desc">开封后自动标记为已用完（适合食品、小样、一次性用品，由你手动决定）</span>';
    html += '<label class="switch"><input type="checkbox" id="item-oneshot"' + (item && item.oneShot === true ? ' checked' : '') + '><span class="slider"></span></label>';
    html += '</div></div>';

    html += '<div class="form-row">';
    html += '<div class="form-group"><label class="form-label">保质期（月）</label><input type="number" class="form-input" id="item-shelf" value="' + (item?(item.shelfLife||''):'') + '" placeholder="如：12"></div>';
    html += '<div class="form-group"><label class="form-label">生产日期</label><input type="date" class="form-input" id="item-prod-date" value="' + (item&&item.productionDate?item.productionDate.split('T')[0]:'') + '"></div>';
    html += '</div>';
    html += '<div class="form-row">';
    html += '<div class="form-group"><label class="form-label">单位</label><input type="text" class="form-input" id="item-unit" value="' + (item?escapeHtml(item.unit||''):'个') + '"></div>';
    html += '<div class="form-group"><label class="form-label">库存告急阈值</label><input type="number" class="form-input" id="item-threshold" value="' + (item?(item.stockThreshold||1):1) + '" step="0.5"></div>';
    html += '</div>';
  }

  // 整物品备注仅补给品（耐用品用每件独立备注）
  if (zone.type === 'consumable') {
    html += '<div class="form-group"><label class="form-label">备注（选填）</label>';
    html += '<textarea class="form-textarea" id="item-notes" placeholder="...">' + (item?escapeHtml(item.notes||''):'') + '</textarea></div>';
  }

  html += '<button class="btn btn-primary btn-full" onclick="saveItem()">' + (item?'保存修改':'添加') + '</button>';
  if (item) {
    html += '<button class="btn btn-danger btn-full" style="margin-top:8px" onclick="deleteItem(\'' + item.id + '\')">删除</button>';
  }

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
  // 初始化子分类选项（编辑时回填已选子分类）
  window._itemSelSubId = selSubId || '';
  updateItemSubcategoryOptions(zone.id, selMainId);
}

// 切换消耗模式（套餐/小单位）
function setConsumeMode(m) {
  var el = document.getElementById('item-consumemode');
  if (el) el.value = m;
  document.querySelectorAll('[data-cmode]').forEach(function(b) {
    var on = b.getAttribute('data-cmode') === m;
    b.className = 'btn ' + (on ? 'btn-primary' : 'btn-outline');
  });
}

// 根据所选大类填充子分类下拉（选填）
function updateItemSubcategoryOptions(zoneId, mainCatId) {
  var sel = document.getElementById('item-subcategory');
  if (!sel) return;
  var zone = getZone(zoneId);
  if (!zone) return;
  var subs = getSubcategories(zone, mainCatId);
  var html = '<option value="">不选子分类</option>';
  subs.forEach(function(s) {
    html += '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>';
  });
  sel.innerHTML = html;
  // 回填编辑时已选的子分类（仅当它属于当前大类）
  if (window._itemSelSubId && subs.some(function(s) { return s.id === window._itemSelSubId; })) {
    sel.value = window._itemSelSubId;
  }
  // 用户手动切换大类后清除回填记忆
  window._itemSelSubId = sel.value;
}

function uploadItemPhoto() {
  var input = document.getElementById('photo-input');
  input.onchange = function(e) {
    var files = e.target.files;
    for (var i = 0; i < files.length && itemPhotos.length < 9; i++) {
      compressImage(files[i], function(dataUrl) {
        itemPhotos.push(dataUrl);
        renderItemPhotos();
      });
    }
    input.value = '';
  };
  input.click();
}

function renderItemPhotos() {
  var container = document.getElementById('item-photos');
  if (!container) return;
  var html = '';
  itemPhotos.forEach(function(p, i) {
    html += '<div class="photo-slot has-photo"><img src="' + p + '"><button class="remove-photo" onclick="removeItemPhoto(' + i + ')">✕</button></div>';
  });
  if (itemPhotos.length < 9) {
    html += '<div class="photo-slot" onclick="uploadItemPhoto()">📷</div>';
  }
  container.innerHTML = html;
}

function removeItemPhoto(idx) {
  itemPhotos.splice(idx, 1);
  renderItemPhotos();
}

// ========== 补给品品牌变体编辑器（带照片） ==========
// 物品级混合套餐编辑块

function renderConsumableVariantRows() {
  var html = '';
  var variants = window._editVariants || [];
  var photos = window._editVariantPhotos || [];
  variants.forEach(function(v, i) {
    html += '<div class="consumable-variant-row" style="border:1px solid var(--separator);border-radius:12px;padding:12px;margin-bottom:12px">';

    } else {
      html += '<span style="font-size:20px;color:var(--text-tertiary)">📷</span>';
    }
    html += '</div>';
    // 品牌名 + 套餐数 × 套餐价 = 总价（套餐模型）
    html += '<div style="flex:1;display:flex;flex-direction:column;gap:8px">';
    html += '<input type="text" class="form-input" style="font-size:14px" placeholder="品牌名" value="' + escapeHtml(v.brand) + '" onchange="updateConsumableVariantField(' + i + ',\'brand\',this.value)">';
    // 套餐数 × 套餐价 = 总价（单行紧凑）
    var cPack = v.packCount || 0;
    var cPackPrice = v.packPrice || 0;
    var cPackQty = v.packQty || 1;
    var cWeight = v.packWeight || 0;
    var cWeightUnit = v.packWeightUnit || 'kg';
    var cStock = v.stock || 0;
    var cTotal = v.totalPrice || (cPackPrice * cPack);
    html += '<div style="display:flex;gap:6px;align-items:center">';
    html += '<input type="number" class="form-input" style="font-size:13px;flex:1;min-width:0" placeholder="套餐数" value="' + (cPack||'') + '" oninput="onConsumablePriceInput(' + i + ',\'pack\',this.value)" onblur="onConsumablePriceBlur(' + i + ',\'pack\',this.value)" step="1">';
    html += '<span style="font-size:12px;color:var(--text-tertiary)">×</span>';
    html += '<input type="number" class="form-input" style="font-size:13px;flex:1;min-width:0" placeholder="套餐价" value="' + (cPackPrice||'') + '" oninput="onConsumablePriceInput(' + i + ',\'packprice\',this.value)" onblur="onConsumablePriceBlur(' + i + ',\'packprice\',this.value)" step="0.01">';
    html += '<span style="font-size:12px;color:var(--text-tertiary)">=</span>';
    html += '<input type="number" class="form-input" style="font-size:13px;flex:1;min-width:0" placeholder="总价" value="' + (cTotal||'') + '" oninput="onConsumablePriceInput(' + i + ',\'total\',this.value)" onblur="onConsumablePriceBlur(' + i + ',\'total\',this.value)" step="0.01">';
    html += '</div>';
    // 每套含数 + 每套单位 + 每小单位含量 + 含量单位（用于比价 + 库存含量显示）

    html += '<input type="number" class="form-input" style="font-size:12px;flex:1;min-width:0" placeholder="每单位含量选填" value="' + (cWeight||'') + '" oninput="onConsumablePriceInput(' + i + ',\'weight\',this.value)" onblur="onConsumablePriceBlur(' + i + ',\'weight\',this.value)" step="0.01" title="填每个小单位的含量（如猫粮一袋1kg填1；护理液一瓶200ml填200）。填了就按含量单位比价，库存也会显示总含量">';

    html += '<input type="text" class="form-input" style="font-size:12px;width:58px;flex-shrink:0" list="spec-unit-list" placeholder="单位" value="' + escapeHtml(cWeightUnit || '') + '" onchange="onConsumableWeightUnitInput(' + i + ',this.value)" title="含量单位，可自己填：ml / kg / g / L / 粒 / 个 / 片 / 颗 …">';

      html += '<input type="number" class="form-input" style="font-size:12px;flex:.8;min-width:0;padding:5px 6px" placeholder="份数" value="' + (s.qty || '') + '" onchange="setVariantSpec(' + i + ',' + k + ',\'qty\',parseFloat(this.value)||0)">';

      html += '<button class="btn btn-danger btn-sm" style="flex-shrink:0;padding:5px 7px" onclick="removeVariantSpec(' + i + ',' + k + ')">✕</button>';

    var spTxt = variantSpecText(v);

    // 不再买：该品牌不回购，不计入补货提醒（卡片与历史数据保留）
    html += '<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:' + (v.noRestock ? 'var(--red)' : 'var(--text-secondary)') + ';margin-top:6px;cursor:pointer"><input type="checkbox" ' + (v.noRestock ? 'checked' : '') + ' onchange="updateConsumableVariantField(' + i + ',\'noRestock\',this.checked)"> 🚫 不再买（这个品牌不回购，不再计入补货提醒）</label>';
    html += '</div>';
    // 删除按钮
    if (variants.length > 1) {
      html += '<button class="btn btn-danger btn-sm" style="flex-shrink:0;padding:6px 8px;font-size:12px" onclick="removeConsumableVariantRow(' + i + ')">✕</button>';
    }
    html += '</div>';
    // 已有照片缩略图列表
    if (photos[i] && photos[i].length > 0) {
      html += '<div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">';
      photos[i].forEach(function(p, pi) {
        html += '<div style="position:relative;width:40px;height:40px">';
        html += '<img src="' + p + '" style="width:40px;height:40px;border-radius:6px;object-fit:cover">';
        html += '<button onclick="removeConsumableVariantPhoto(' + i + ',' + pi + ')" style="position:absolute;top:-4px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;border:none;font-size:10px;line-height:16px;cursor:pointer">✕</button>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });
  return html;
}
// 变体级混合规格编辑：改完只重绘品牌列表（数量变化必须重绘，改值只刷提示）
function addVariantSpec(i) {
  var v = (window._editVariants || [])[i]; if (!v) return;
  if (!v.specs) v.specs = [];
  v.specs.push({ name: '', qty: 1, content: 0, unit: (v.specs[0] ? v.specs[0].unit : (v.packWeightUnit || '')) });
  renderVariantList();
}
function removeVariantSpec(i, k) {
  var v = (window._editVariants || [])[i]; if (!v || !v.specs) return;
  v.specs.splice(k, 1);
  renderVariantList();
}
function setVariantSpec(i, k, field, val) {
  var v = (window._editVariants || [])[i]; if (!v || !v.specs || !v.specs[k]) return;
  v.specs[k][field] = val;
  renderVariantList();
}
function renderVariantList() {
  var box = document.getElementById('variant-list');
  if (box) box.innerHTML = renderConsumableVariantRows();
}
function updateConsumableVariantField(idx, field, val) {
  if (window._editVariants && window._editVariants[idx]) {
    window._editVariants[idx][field] = val;
  }
}
// 补给品：库存 × 单价 = 总价 三联动
// 简单算式求值：只允许数字与 + - * / ( ) . 空格，如混合套餐 3*77+2*45
function evalSimpleExpr(str) {
  var s = String(str || '').trim();
  if (!s || !/^[0-9+\-*/().\s]+$/.test(s) || !/[0-9]/.test(s)) return NaN;
  try {
    var r = Function('"use strict";return (' + s + ')')();
    return (typeof r === 'number' && isFinite(r)) ? r : NaN;
  } catch (e) { return NaN; }
}
function onConsumablePriceInput(idx, which, val) {
  var v = window._editVariants && window._editVariants[idx];
  if (!v) return;
  var row = document.querySelectorAll('.consumable-variant-row')[idx];
  if (!row) return;
  var inputs = row.querySelectorAll('input[type=number]');
  // inputs[0]=套餐数 [1]=套餐价 [2]=总价 [3]=每套含数 [4]=重量
  var packEl = inputs[0], priceEl = inputs[1], totalEl = inputs[2], qtyEl = inputs[3], weightEl = inputs[4];
  var packCount = parseFloat(v.packCount) || 0;
  var packPrice = parseFloat(v.packPrice) || 0;
  var packQty = parseFloat(v.packQty) || 1;
  var weight = parseFloat(v.packWeight) || 0;
  if (which === 'pack') {
    packCount = parseFloat(val) || 0; v.packCount = packCount;
  } else if (which === 'packprice') {
    packPrice = parseFloat(val) || 0; v.packPrice = packPrice;
  } else if (which === 'total') {
    var t = parseFloat(val) || 0; v.totalPrice = t;
    if (packCount > 0) { packPrice = t / packCount; v.packPrice = packPrice; }
  } else if (which === 'packqty') {
    var evQ = evalSimpleExpr(val);
    packQty = (!isNaN(evQ) && evQ > 0) ? evQ : (parseFloat(val) || 1);
    v.packQty = packQty;
  } else if (which === 'weight') {
    weight = parseFloat(val) || 0; v.packWeight = weight;
  }
  // 重算：总价 = 套餐数 × 套餐价；库存 = 套餐数 × 每套含数；单价 = 总价 / 库存
  v.totalPrice = Math.round(packCount * packPrice * 100) / 100;
  var stock = Math.max(0, Math.round(packCount * packQty));
  v.stock = stock;
  v.price = stock > 0 ? Math.round((v.totalPrice / stock) * 100) / 100 : (packPrice || 0);
  // 只回写"非当前正在编辑"的框，避免打断小数点输入（如 44. 输入到一半）
  var curEl = which === 'pack' ? packEl : which === 'packprice' ? priceEl : which === 'total' ? totalEl : which === 'packqty' ? qtyEl : weightEl;
  if (packEl && packEl !== curEl) packEl.value = packCount || '';
  if (priceEl && priceEl !== curEl) priceEl.value = packPrice || '';
  if (totalEl && totalEl !== curEl) totalEl.value = v.totalPrice || '';
  if (qtyEl && qtyEl !== curEl) qtyEl.value = (packQty > 0 ? packQty : '');
  if (weightEl && weightEl !== curEl) weightEl.value = weight || '';
  var hint = document.getElementById('packstock-' + idx);
  if (hint) hint.innerHTML = packHintOf(v);
}
// 失焦时把当前框格式化为两位小数，并触发一次联动重算
function onConsumablePriceBlur(idx, which, val) {
  var v = window._editVariants && window._editVariants[idx];
  if (!v) return;
  var raw = (val === undefined || val === null) ? '' : String(val).trim();
  var num = raw === '' ? 0 : (parseFloat(raw) || 0);
  if (which === 'pack') v.packCount = num;
  else if (which === 'packprice') v.packPrice = num;
  else if (which === 'total') v.totalPrice = num;
  else if (which === 'packqty') {
    var evB = evalSimpleExpr(raw);
    num = (!isNaN(evB) && evB > 0) ? evB : num;
    v.packQty = num > 0 ? num : 1;
  }
  else if (which === 'weight') v.packWeight = num;
  var row = document.querySelectorAll('.consumable-variant-row')[idx];
  if (!row) return;
  var inputs = row.querySelectorAll('input[type=number]');
  var el = which === 'pack' ? inputs[0] : which === 'packprice' ? inputs[1] : which === 'total' ? inputs[2] : which === 'packqty' ? inputs[3] : inputs[4];
  if (el) {
    if (raw === '') el.value = '';
    else if (which === 'pack') el.value = String(num);
    else if (which === 'packqty') el.value = num > 0 ? String(num) : '';
    else el.value = num.toFixed(2);
  }
  onConsumablePriceInput(idx, which, String(num));
}
// 库存提示：带计算过程（套餐数 × 每套含 = 库存小单位）
function packHintOf(v) {
  // 混合规格：直接列出每种规格的件数与含量，再汇总
  var sp = variantSpecsOf(v);
  if (sp.length) {
    var parts = sp.map(function (s) {
      var nm = String(s.name || '').trim();
      return (nm ? nm + ' ' : '') + trimNum(+s.qty) + '×' + trimNum(+s.content) + (s.unit || '') + ' = ' + trimNum((+s.qty) * (+s.content)) + (s.unit || '');
    });
    return '📦 库存 = ' + parts.join(' + ') + ' = ' + trimNum(variantSpecContent(v)) + variantSpecUnit(v) + '（共 ' + trimNum(variantSpecPieces(v)) + ' 件）';
  }
  var pc = parseFloat(v.packCount) || 0;
  var pq = parseFloat(v.packQty) || 1;
  var st = Math.max(0, Math.round(pc * pq));
  var u = v.packUnit || '个';
  var w = parseFloat(v.packWeight) || 0;
  var wu = weightUnitOf(v);
  var txt;
  if (pq > 1) txt = pc + ' 套 × ' + pq + u + '/套 = ' + st + u;
  else txt = st + ' ' + u;
  if (w > 0) txt += ' × ' + w + wu + ' ≈ ' + round1(st * w) + wu + '（' + st + ' × ' + w + wu + '/' + u + '）';
  return '📦 库存 = ' + txt;
}
// 每套单位：任意文本（ml / 毫升 / L / 颗 / 片 / 包…），不限制
function onConsumableUnitInput(idx, val) {

}
// 含量单位：kg / g / ml / L（影响比价口径与库存/明细的单位展示）
function onConsumableWeightUnitInput(idx, val) {

}

}

function saveItem() {
  var zone = getZone(currentZoneId);
  var name = document.getElementById('item-name').value.trim();
  if (!name) { toast('请输入名称'); return; }

  // 分类：选了子分类用子分类，否则用大类
  var finalCategoryId = document.getElementById('item-category').value;
  var subSel = document.getElementById('item-subcategory');
  if (subSel && subSel.value) finalCategoryId = subSel.value;

  var data = {
    name: name,
    categoryId: finalCategoryId,
    location: document.getElementById('item-location').value,
    notes: (function() { var el = document.getElementById('item-notes'); return el ? el.value : ''; })(),
    photos: itemPhotos.slice()
  };

  if (zone.type === 'consumable') {
    // 从品牌变体编辑器读取
    var editVariants = window._editVariants || [];
    var editPhotos = window._editVariantPhotos || [];
    data.variants = editVariants.map(function(ev, i) {
      var evStock = parseFloat(ev.stock) || 0;
      var evPrice = parseFloat(ev.price) || 0;
      // 以编辑行数据为基础（保留 packWeightUnit / noRestock / notes 等扩展字段，避免保存时丢失），
      // 再覆盖本表单实际管理的字段
      var nv = {};
      Object.keys(ev).forEach(function(k) { nv[k] = ev[k]; });
      nv.id = ev.id;
      nv.brand = ev.brand || '未命名';
      nv.stock = evStock;
      nv.price = evPrice;
      nv.totalPrice = ev.totalPrice || +(evPrice * evStock).toFixed(2);
      nv.channel = '';
      nv.photos = (editPhotos[i] || []).slice();
      nv.opened = false; nv.openDate = null; nv.finishDate = null;
      nv.usedUp = false; nv.openQty = 0; nv.feeling = null; nv.shelfLife = null; nv.productionDate = null;
      nv.packCount = (typeof ev.packCount !== 'undefined' ? ev.packCount : evStock);
      nv.packPrice = (typeof ev.packPrice !== 'undefined' ? ev.packPrice : (ev.totalPrice || 0));
      nv.packQty = (typeof ev.packQty !== 'undefined' ? ev.packQty : 1);
      nv.packUnit = ev.packUnit || '个';
      nv.packWeight = (typeof ev.packWeight !== 'undefined' ? ev.packWeight : 0);
      // 混合规格（本品牌可选）：库存按含量口径汇总，件数仅作参考
      nv.specs = (ev.specs || []).filter(function (s) { return (+s.qty > 0) && (+s.content > 0); }).map(function (s) {
        return { name: (s.name || '').trim(), qty: +s.qty || 0, content: +s.content || 0, unit: (s.unit || '').trim() };
      });
      if (nv.specs.length) {
        var sc = 0, spc = 0;
        nv.specs.forEach(function (s) { sc += s.qty * s.content; spc += s.qty; });
        nv.stock = Math.round(sc * 100) / 100;
        nv.packCount = Math.round(spc * 100) / 100; // 件数（参考，不参与库存换算）
        nv.packQty = 1;
        nv.packUnit = nv.specs[0].unit || nv.packUnit;
        nv.packWeight = 1;
        nv.packWeightUnit = nv.specs[0].unit || nv.packWeightUnit;
      }
      return nv;
    });
    // 合并变体照片，用于卡片展示
    var variantPhotos = [];
    data.variants.forEach(function(v) { variantPhotos = variantPhotos.concat(v.photos); });
    var seenP = {};
    var allP = [];
    variantPhotos.forEach(function(p) { if (p && !seenP[p]) { seenP[p] = true; allP.push(p); } });
    data.photos = allP;
    data.stock = data.variants.reduce(function(s,v) { return s + (v.stock||0); }, 0);
    // 补给品总金额 = 各品牌总价之和
    data.currentPrice = data.variants.reduce(function(s,v){ return s + (v.totalPrice || ((v.price||0)*(v.stock||0))); }, 0);
    data.unit = document.getElementById('item-unit').value || '个';
    data.shelfLife = parseInt(document.getElementById('item-shelf').value) || null;
    var prodDate = document.getElementById('item-prod-date').value;
    data.productionDate = prodDate ? new Date(prodDate).toISOString() : null;
    data.stockThreshold = parseFloat(document.getElementById('item-threshold').value) || 1;
    data.oneShot = !!document.getElementById('item-oneshot').checked;
    data.consumeMode = (document.getElementById('item-consumemode') ? document.getElementById('item-consumemode').value : 'pack') || 'pack';
  } else {
    // 耐用品：从件数编辑器读取
    var dEditVariants = window._editVariants || [];
    var dEditPhotos = window._editVariantPhotos || [];
    data.variants = dEditVariants.map(function(ev, i) {
      return {
        id: ev.id,
        brand: ev.brand || ('第' + (i+1) + '件'),
        stock: Math.max(1, parseInt(ev.stock) || 1),
        price: ev.price || 0,
        totalPrice: ev.totalPrice || ((ev.price || 0) * (Math.max(1, parseInt(ev.stock) || 1))),
        channel: '',
        photos: (dEditPhotos[i] || []).slice(),
        notes: ev.notes || '',
        opened: false, openDate: null, finishDate: null,
        usedUp: false, openQty: 0, feeling: null,
        shelfLife: null, productionDate: null
      };
    });
    data.stock = data.variants.reduce(function(s,v){ return s + (v.stock||1); }, 0);
    data.unit = '件';
    // 耐用品总金额 = 各款总价之和
    data.currentPrice = data.variants.reduce(function(s,v){ return s + (v.totalPrice || ((v.price||0)*(v.stock||1))); }, 0);
    data.channel = '';
  }

  if (editingItemId) {
    var item = getItem(currentZoneId, editingItemId);
    if (zone.type === 'consumable') {
      // 补给品：保留已有的variant使用数据
      var oldVariants = item.variants || [];
      var newVariants = data.variants;
      newVariants.forEach(function(nv) {
        var old = oldVariants.find(function(ov) { return ov.id === nv.id; });
        if (old) {
          nv.opened = old.opened;
          nv.usedUp = old.usedUp;
          nv.openDate = old.openDate;
          nv.finishDate = old.finishDate;
          nv.openQty = old.openQty;
          nv.feeling = old.feeling;
          nv.shelfLife = old.shelfLife;
          nv.productionDate = old.productionDate;
          // 注意：不覆盖 nv.photos，让用户编辑时新上传的照片生效
          // 但如果新上传为空且旧照片存在，保留旧照片
          if ((!nv.photos || nv.photos.length === 0) && old.photos && old.photos.length > 0) {
            nv.photos = old.photos.slice();
          }
        }
      });
      // 兼容旧数据：如果variant没有照片但item.photos有，把item.photos分给第一个variant
      var hasAnyVariantPhoto = newVariants.some(function(v) { return v.photos && v.photos.length > 0; });
      if (!hasAnyVariantPhoto && item.photos && item.photos.length > 0) {
        if (newVariants.length > 0) {
          newVariants[0].photos = item.photos.slice();
        }
      }
    } else {
      // 耐用品：保留已有的variant使用感受和备注
      var oldDVariants = item.variants || [];
      data.variants.forEach(function(nv) {
        var old = oldDVariants.find(function(ov) { return ov.id === nv.id; });
        if (old) {
          nv.feeling = old.feeling;
          if (!nv.notes && old.notes) nv.notes = old.notes;
          if (!nv.totalPrice && old.totalPrice) nv.totalPrice = old.totalPrice;
        }
      });
    }
    // 耐用品编辑表单已无整物品备注输入框，保留旧值不被空覆盖
    if (zone.type !== 'consumable' && !data.notes && item.notes) data.notes = item.notes;
    Object.assign(item, data);
    if (zone.type === 'consumable') syncItemFromVariants(item);
    else syncDurableFromVariants(item);
  } else {
    data.id = genId();
    data.usageRecords = [];
    data.priceHistory = [];
    data.createdAt = new Date().toISOString();
    zone.items.push(data);
  }

  saveDB();
  closeModal();
  renderZone();
  toast(editingItemId ? '已保存' : '已添加');
}

// 删除：会连同使用记录一起消失，所以先说清楚，并给「归档」这个更稳的出路

// ========== 年度档案：把明细压缩成一句「这一年的使用效率」==========
// 固化后，用完的品牌/物品就可以放心删掉，结论不会丢
function buildYearStats(year) {
  if (!DB.yearStats) DB.yearStats = {};
  var items = [];
  var totalSpend = 0;
  DB.zones.forEach(function(z) {
    (z.items || []).forEach(function(it) {
      var yq = 0, times = 0, daySum = 0, dayCnt = 0, spend = 0;
      var brandMap = {};
      // 消耗量：使用记录落在这一年的
      (it.usageRecords || []).forEach(function(r) {
        var d = r.endDate || r.startDate || r.date;
        if (!d) return;
        if (new Date(d).getFullYear() !== year) return;
        yq += (r.qty || 1);
        times += 1;
        if (r.startDate && r.endDate) {
          var dd = daysBetween(new Date(r.startDate), new Date(r.endDate));
          if (dd >= 0) { daySum += dd; dayCnt += 1; }
        }
        var bn = r.brand || '未命名';
        if (!brandMap[bn]) brandMap[bn] = { name: bn, spend: 0, restock: null };
      });
      // 花费：价格历史落在这一年的（按品牌归集）
      (it.priceHistory || []).forEach(function(p) {
        if (!p.date || new Date(p.date).getFullYear() !== year) return;
        spend += (p.totalPrice || 0);
        var bn2 = p.brand || '未命名';
        if (!brandMap[bn2]) brandMap[bn2] = { name: bn2, spend: 0, restock: null };
        brandMap[bn2].spend += (p.totalPrice || 0);
      });
      // 品牌评分 / 是否回购（从变体取当前结论）
      (it.variants || []).forEach(function(v) {
        var bn3 = v.brand || '未命名';
        if (!brandMap[bn3]) brandMap[bn3] = { name: bn3, spend: 0, restock: null };
        var b = brandMap[bn3];
        b.rating = (v.feeling && v.feeling.rating) || 0;
        b.tags = (v.feeling && v.feeling.tags) ? v.feeling.tags.slice() : [];
        if (v.noRestock) b.restock = false; else if (v.usedUp) b.restock = true;
      });
      // 没有价格历史（很多物品只在变体上记了单价）→ 按当前单价估算花费，标注「约」
      var estimated = false;
      if (spend <= 0 && yq > 0) {
        var perUnit = 0;
        if (it.variants && it.variants.length) {
          perUnit = it.variants.reduce(function(s, v) { return s + (v.packPrice || v.price || 0); }, 0) / it.variants.length;
        } else {
          perUnit = it.price || 0;
        }
        spend = Math.round(perUnit * yq * 100) / 100;
        estimated = true;
      }
      if (yq <= 0 && spend <= 0) return; // 这一年没有任何动静，不进档案
      var isPack = it.consumeMode === 'pack';
      var unitName = isPack ? '套' : (it.unit || '个');
      var aq = avgPackQtyOf(it);
      var capUnit = mainPackUnit(it);
      var brands = Object.keys(brandMap).map(function(k) { return brandMap[k]; });
      totalSpend += spend;
      items.push({
        zoneId: z.id, zoneName: z.name, zoneIcon: z.icon || '📦',
        categoryPath: getCategoryPath(z.id, it.categoryId) || '未分类',
        name: it.name, unit: unitName,
        qty: Math.round(yq * 10) / 10,
        capQty: (isPack && aq > 1) ? round1(yq * aq) : 0,
        capUnit: capUnit,
        spend: Math.round(spend * 100) / 100,
        unitPrice: yq > 0 ? Math.round((spend / yq) * 100) / 100 : 0,
        times: times,
        avgDays: dayCnt > 0 ? Math.round(daySum / dayCnt) : 0,
        estimated: estimated,
        brands: brands
      });
    });
  });
  items.sort(function(a, b) { return b.spend - a.spend; });
  DB.yearStats[String(year)] = {
    generatedAt: new Date().toISOString(),
    itemCount: items.length,
    totalSpend: Math.round(totalSpend * 100) / 100,
    items: items
  };
  saveDB();
  return DB.yearStats[String(year)];
}

function yearStatsYears() {
  var ys = Object.keys(DB.yearStats || {});
  var cur = String(new Date().getFullYear());
  if (ys.indexOf(cur) < 0) ys.push(cur);
  ys.sort(function(a, b) { return Number(b) - Number(a); });
  return ys;
}

    document.getElementById('modal-content').innerHTML = html;
    document.getElementById('modal-overlay').classList.add('show');

  }

  html += '<div style="padding:14px;border-radius:12px;background:rgba(0,122,255,0.08);margin-bottom:14px">';
  html += '<div style="font-size:13px;color:var(--text-secondary)">' + year + '年 · ' + st.itemCount + ' 件物品有消耗记录</div>';
  html += '<div style="font-size:24px;font-weight:700;color:var(--accent);margin-top:2px">¥' + st.totalSpend.toFixed(2) + '</div>';

  st.items.forEach(function(e) {
    html += '<div style="padding:12px;border:0.5px solid var(--separator);border-radius:10px;margin-bottom:10px">';
    html += '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">';
    html += '<div style="min-width:0"><strong>' + escapeHtml(e.name) + '</strong>';
    html += '<div style="font-size:11px;color:var(--text-secondary);margin-top:2px">' + e.zoneIcon + ' ' + escapeHtml(e.zoneName) + ' · ' + escapeHtml(e.categoryPath) + '</div></div>';
    html += '<div style="text-align:right;flex-shrink:0"><div style="font-weight:700">' + (e.estimated ? '约 ' : '') + '¥' + e.spend.toFixed(2) + '</div>';
    html += '<div style="font-size:11px;color:var(--text-secondary)">用了 ' + e.qty + e.unit + (e.capQty > 0 ? '（≈' + e.capQty + escapeHtml(e.capUnit) + '）' : '') + '</div></div>';
    html += '</div>';
    var meta = [];
    if (e.unitPrice > 0) meta.push('均价 ¥' + e.unitPrice.toFixed(2) + '/' + e.unit);
    if (e.times > 0) meta.push(e.times + ' 次');

    if (meta.length) html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:6px">' + meta.join(' · ') + '</div>';
    if (e.brands && e.brands.length) {
      html += '<div style="font-size:12px;color:var(--text-secondary);margin-top:6px;line-height:1.7">';
      e.brands.forEach(function(b) {
        var stars = b.rating ? new Array(b.rating + 1).join('⭐') : '';
        var flag = b.restock === false ? '🚫不回购' : (b.restock === true ? '✅回购' : '');
        html += '<div>· ' + escapeHtml(b.name) + (stars ? ' ' + stars : '') + (flag ? ' ' + flag : '') + (b.spend > 0 ? ' · ¥' + b.spend.toFixed(2) : '') + '</div>';
      });

    }

  });

  document.getElementById('modal-content').innerHTML = html;
