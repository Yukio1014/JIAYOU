// ========== 目标锁定 ==========
function renderPool() {
  var html = '';
  var activePool = DB.pool.filter(function(p) { return p.status !== 'given-up'; });
  var givenUp = DB.poolHistory || [];

  // 统计
  html += '<div class="alert-strip">';
  html += '<div class="alert-badge alert-yellow"><div class="badge-num">' + DB.pool.filter(function(p){return p.status==='pending';}).length + '</div><div class="badge-label">目标冻结</div></div>';
  html += '<div class="alert-badge alert-blue"><div class="badge-num">' + DB.pool.filter(function(p){return p.status==='decided';}).length + '</div><div class="badge-label">目标锁定</div></div>';
  html += '<div class="alert-badge alert-gray"><div class="badge-num">' + givenUp.length + '</div><div class="badge-label">目标解除</div></div>';
  html += '</div>';

  html += '<div class="section-title">想入手的东西<div class="section-action" onclick="openPoolForm()">＋ 添加</div></div>';

  if (activePool.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">🎯</div><div class="empty-text">目标锁定是空的<br>想买什么先放这里考虑一下</div></div>';
  } else {
    activePool.forEach(function(p) {
      html += renderPoolItem(p);
    });
  }

  if (givenUp.length > 0) {
    html += '<div class="section-title">目标解除记录</div>';
    givenUp.slice(-10).forEach(function(p) {
      html += '<div class="pool-item" style="opacity:0.6">';
      html += '<div class="pool-header"><div><div class="pool-name">' + escapeHtml(p.name) + '</div>';
      html += '<div class="pool-meta">¥' + (p.price||0) + ' · ' + formatDate(p.date) + '解除</div></div>';
      html += '<span class="pool-status status-given-up">已解除</span></div>';
      html += '</div>';
    });
  }

  document.getElementById('pool-content').innerHTML = html;
}

function renderPoolItem(p) {
  var html = '<div class="pool-item">';
  html += '<div class="pool-header">';
  html += '<div><div class="pool-name">' + escapeHtml(p.name) + '</div>';
  var meta = '';
  if (p.zoneId) {
    var zone = getZone(p.zoneId);
    if (zone) meta += zone.icon + ' ' + zone.name;
  }
  if (p.categoryId) {
    var cat = getCategory(p.zoneId, p.categoryId);
    if (cat) meta += ' · ' + cat.name;
  }
  if (p.date) meta += ' · ' + formatDate(p.date);
  html += '<div class="pool-meta">' + meta + '</div></div>';
  html += '<div class="pool-price">¥' + (p.price||0) + '</div>';
  html += '</div>';

  html += '<div style="margin-top:4px"><span class="pool-status status-' + (p.status==='pending'?'pending':'decided') + '">' + (p.status==='pending'?'目标冻结':'目标锁定') + '</span></div>';

  if (p.notes) {
    html += '<div style="font-size:13px;color:var(--text-secondary);margin-top:6px">' + escapeHtml(p.notes) + '</div>';
  }

  // 库存对比提醒
  if (p.zoneId && p.categoryId) {
    var zone = getZone(p.zoneId);
    if (zone) {
      var existing = zone.items.filter(function(it) { return it.categoryId === p.categoryId; });
      if (existing.length > 0) {
        if (zone.type === 'durable') {
          html += '<div class="pool-warn">⚠️ 你已经有 ' + existing.length + ' 件同类物品了，确定要买吗？</div>';
        } else {
          var totalStock = existing.reduce(function(s,it){return s+(it.stock||0);},0);
          html += '<div class="pool-warn">⚠️ 同类已有 ' + totalStock + '件库存</div>';
        }
      } else {
        html += '<div class="pool-ok">✓ 同类暂无库存，可以买</div>';
      }
    }
  }

  if (p.photos && p.photos.length > 0) {
    html += '<div style="display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none">';
    p.photos.forEach(function(ph) {
      html += '<img src="' + ph + '" style="width:60px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0">';
    });
    html += '</div>';
  }

  // 操作按钮
  html += '<div class="pool-actions">';
  if (p.status === 'pending') {
    html += '<button class="btn btn-primary btn-sm" style="flex:1" onclick="poolDecide(\'' + p.id + '\')">🎯 锁定目标</button>';
  }
  html += '<button class="btn btn-success btn-sm" style="flex:1" onclick="poolToItem(\'' + p.id + '\')">📦 已入手</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="poolGiveUp(\'' + p.id + '\')">解除</button>';
  html += '<button class="btn btn-outline btn-sm" onclick="poolDelete(\'' + p.id + '\')">删</button>';
  html += '</div>';

  html += '</div>';
  return html;
}

function uploadPoolPhoto() {
  var input = document.getElementById('photo-input');
  input.onchange = function(e) {
    var files = e.target.files;
    for (var i = 0; i < files.length && poolPhotos.length < 9; i++) {
      compressImage(files[i], function(dataUrl) {
        poolPhotos.push(dataUrl);
        renderPoolPhotos();
      });
    }
    input.value = '';
  };
  input.click();
}

function renderPoolPhotos() {
  var container = document.getElementById('pool-photos');
  var html = '';

    html += '<div class="photo-slot has-photo"><img src="' + p + '"><button class="remove-photo" onclick="removePoolPhoto(' + i + ')">✕</button></div>';
  });
  if (poolPhotos.length < 9) {
    html += '<div class="photo-slot" onclick="uploadPoolPhoto()">📷</div>';
  }
  container.innerHTML = html;

function updatePoolCategories() {

function savePoolItem() {
  var name = document.getElementById('pool-name').value.trim();
  if (!name) { toast('请输入名称'); return; }
  var zoneId = document.getElementById('pool-zone').value;
  var item = {
    id: genId(),
    name: name,
    price: parseFloat(document.getElementById('pool-price').value) || 0,
    qty: parseInt(document.getElementById('pool-qty').value) || 1,
    zoneId: zoneId,
    categoryId: zoneId ? document.getElementById('pool-category').value : null,
    notes: document.getElementById('pool-notes').value,
    photos: poolPhotos.slice(),
    status: 'pending',
    date: new Date().toISOString()
  };

  saveDB();
  closeModal();

function poolDecide(itemId) {
  var item = DB.pool.find(function(p) { return p.id === itemId; });
  if (item) { item.status = 'decided'; saveDB(); renderPool(); toast('已锁定目标'); }
}

function poolGiveUp(itemId) {
  if (!confirm('确定解除这个目标？会保留记录用于反思。')) return;
  var idx = DB.pool.findIndex(function(p) { return p.id === itemId; });
  if (idx >= 0) {
    var item = DB.pool[idx];
    item.status = 'given-up';
    item.giveUpDate = new Date().toISOString();
    if (!DB.poolHistory) DB.poolHistory = [];
    DB.poolHistory.push(item);
    DB.pool.splice(idx, 1);
    saveDB();
    renderPool();
    toast('目标已解除（保留记录）');
  }
}

function poolDelete(itemId) {
  if (!confirm('彻底删除？不留记录。')) return;
  DB.pool = DB.pool.filter(function(p) { return p.id !== itemId; });
  saveDB();
  renderPool();
  toast('已删除');
}

function poolToItem(itemId) {
  var item = DB.pool.find(function(p) { return p.id === itemId; });

  if (!item.zoneId) {
    toast('请先编辑该物品，选择归类领地');
    return;
  }
  var zone = getZone(item.zoneId);
  var newItem = {
    id: genId(),
    name: item.name,
    categoryId: item.categoryId,
    stock: item.qty || 1,
    unit: '个',
    currentPrice: item.price || 0,
    channel: '',
    location: '',
    notes: item.notes || '',
    photos: item.photos || [],
    usageRecords: [],
    priceHistory: item.price ? [{
      date: new Date().toISOString(),
      channel: '',
      quantity: item.qty || 1,
      totalPrice: (item.price||0) * (item.qty||1),
      unitPrice: item.price || 0,
      notes: '从目标锁定转入'

  renderPool();
  toast('已转入库存');
}

// ========== 数据导入导出 ==========
function exportJSON() {
  var data = JSON.stringify(DB, null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '家有-备份-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出');
}

function importJSON(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!data.zones) { toast('文件格式不对'); return; }
      if (!confirm('导入会覆盖当前数据，确定？')) return;
      DB = mergeDB({
        zones: [], pool: [], poolHistory: [],
        settings: { githubToken:'', githubRepo:'', githubPath:'jiayou-backup.json', lastBackup:null },
        version: 1
      }, data);
      saveDB();
      showPage('home');
      toast('导入成功');
    } catch(err) {
      toast('文件解析失败');
    }
  };
  reader.readAsText(file);
}

function backupToGitHub() {
  if (!DB.settings.githubToken || !DB.settings.githubRepo) {
    toast('请先设置Token和仓库');
    return;
  }

  toast('正在备份...');

  var repo = DB.settings.githubRepo;
  var path = DB.settings.githubPath || 'jiayou-backup.json';
  var token = DB.settings.githubToken;
  var content = btoa(unescape(encodeURIComponent(JSON.stringify(DB, null, 2))));

  // 先尝试获取现有文件（获取sha用于更新）
  var getUrl = 'https://api.github.com/repos/' + repo + '/contents/' + path;
  fetch(getUrl, {
    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
  }).then(function(r) {
    if (r.status === 404) return null;
    return r.json();
  }).then(function(existing) {
    var body = {
      message: '家有备份 ' + new Date().toISOString(),
      content: content
    };
    if (existing && existing.sha) body.sha = existing.sha;

    return fetch(getUrl, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
  }).then(function(r) {
    if (r.ok) {
      DB.settings.lastBackup = new Date().toISOString();
      saveDB();
      toast('✓ 备份成功');
      renderSettings();
    } else {
      return r.json().then(function(err) {
        throw new Error(err.message || '备份失败');
      });
    }
  }).catch(function(err) {
    toast('备份失败：' + err.message);
  });
}

// ========== 工具函数 ==========
function daysBetween(d1, d2) {
  return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

// 图片压缩
function compressImage(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      var canvas = document.createElement('canvas');
      var maxDim = 800;
      var w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = h * maxDim / w; w = maxDim; }
        else { w = w * maxDim / h; h = maxDim; }
      }
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// 导入文件监听
document.getElementById('import-input').addEventListener('change', function(e) {
  if (e.target.files[0]) importJSON(e.target.files[0]);
  e.target.value = '';
});

// ========== 预警详情弹窗 ==========
function showAlertDetail(type) {
  var title = '', items = [];
  if (type === 'expired') {
    title = '🔴 已过期';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      zone.items.forEach(function(it) {
        if (getItemStatus(it).expired) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'expiring') {
    title = '🟡 即将过期（30天内）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      zone.items.forEach(function(it) {
        if (getItemStatus(it).expiring) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'lowStock') {
    title = '🟡 库存告急';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      zone.items.forEach(function(it) {
        if (getItemStatus(it).lowStock) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'overStock') {
    title = '🔵 囤太多（用到过期也用不完）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'consumable') return;
      zone.items.forEach(function(it) {
        if (getItemStatus(it).overStock) items.push({item: it, zone: zone});
      });
    });
  } else if (type === 'idle') {
    title = '🟣 闲置中（超过6个月没用）';
    DB.zones.forEach(function(zone) {
      if (zone.type !== 'durable') return;
      zone.items.forEach(function(it) {
        if (it.lastUsedDate) {
          var days = daysBetween(new Date(it.lastUsedDate), new Date());
          if (days > 180) items.push({item: it, zone: zone, days: days});
        }
      });
    });
  }

  var html = '<div class="modal-handle"></div>';
  html += '<div class="modal-title">' + title + '</div>';
  if (items.length === 0) {
    html += '<div class="empty-state"><div class="empty-icon">✓</div><div class="empty-text">没有需要关注的</div></div>';
  } else {
    html += '<div style="margin-bottom:16px;font-size:13px;color:var(--text-secondary)">共 ' + items.length + ' 件</div>';
    items.forEach(function(entry) {
      var it = entry.item, zone = entry.zone;
      var status = getItemStatus(it);
      var bgColor = '#fff';
      if (type === 'expired') bgColor = 'rgba(255,59,48,0.06)';
      else if (type === 'expiring') bgColor = 'rgba(255,149,0,0.06)';
      else if (type === 'lowStock') bgColor = 'rgba(255,149,0,0.06)';
      else if (type === 'overStock') bgColor = 'rgba(90,200,250,0.06)';
      else if (type === 'idle') bgColor = 'rgba(175,82,222,0.06)';

      html += '<div style="display:flex;gap:10px;padding:12px;border-radius:10px;background:' + bgColor + ';margin-bottom:8px;cursor:pointer" onclick="closeModal();setTimeout(function(){enterZone(\'' + zone.id + '\')},200)">';
      // 照片
      html += '<div style="width:50px;height:50px;border-radius:8px;overflow:hidden;flex-shrink:0;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px">';
      if (it.photos && it.photos.length > 0) {
        html += '<img src="' + it.photos[0] + '" style="width:100%;height:100%;object-fit:cover">';
      } else {
        html += '📦';
      }
      html += '</div>';
      // 信息
      html += '<div style="flex:1;min-width:0">';
      html += '<div style="font-weight:700;font-size:15px">' + escapeHtml(it.name) + '</div>';
      html += '<div style="font-size:12px;color:var(--text-secondary)">' + zone.icon + ' ' + escapeHtml(zone.name) + '</div>';
      if (type === 'expired') {
        html += '<div style="font-size:13px;color:var(--red);font-weight:600;margin-top:2px">⚠️ 已过期' + (status.daysLeft!==null?'（超期'+Math.abs(status.daysLeft)+'天）':'') + '</div>';
      } else if (type === 'expiring') {
        html += '<div style="font-size:13px;color:var(--orange);font-weight:600;margin-top:2px">⏰ 还剩 ' + status.daysLeft + ' 天过期</div>';
      } else if (type === 'lowStock') {
        html += '<div style="font-size:13px;color:var(--orange);font-weight:600;margin-top:2px">📦 库存仅剩 ' + it.stock + (it.unit||'') + '（告急阈值' + (it.stockThreshold||1) + '）</div>';
      } else if (type === 'overStock') {
        var rate = calcUsageRate(it);
        var monthsLeft = rate > 0 ? (it.stock / rate).toFixed(1) : '?';
        html += '<div style="font-size:13px;color:var(--blue);font-weight:600;margin-top:2px">📦 库存' + it.stock + (it.unit||'') + '，按消耗速率够用' + monthsLeft + '月</div>';
      } else if (type === 'idle') {
        html += '<div style="font-size:13px;color:var(--purple);font-weight:600;margin-top:2px">🕐 已' + Math.floor(entry.days/30) + '个月没用</div>';
      }
      html += '</div>';
      html += '</div>';
    });
  }
  html += '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeModal()">关闭</button>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

// ========== 首页过滤快捷（改为弹窗显示详情）==========
function filterExpired() { showAlertDetail('expired'); }
function filterExpiring() { showAlertDetail('expiring'); }
function filterLowStock() { showAlertDetail('lowStock'); }
function filterOverStock() { showAlertDetail('overStock'); }
function filterIdle() { showAlertDetail('idle'); }
</script>
